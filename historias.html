<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f2f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="historias/icono-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="historias/icono-180.png">
<link rel="manifest" href="historias.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Historias">
<title>Historias de la música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DISEÑO 5 (2026-10-17) · «La discoteca»
     Cada historia es una funda con su vinilo; los capítulos, caras.
     Unbounded para títulos, Instrument Sans para leer, DM Mono para años.
     ============================================================ */
  :root {
    color-scheme: light;
    --bg:#f3f2f7; --bg-2:#e9e7f0; --surface:#ffffff; --surface-2:#e8e6ef; --surface-3:#dcd9e6;
    --line:rgba(22,18,40,.08); --line-firm:rgba(22,18,40,.16);
    --fg:#15121f; --fg-soft:#48435a; --fg-mute:#7d778f;
    --acc:#5b3fe0; --acc-soft:rgba(91,63,224,.12);
    --sp:#1db954; --yt:#ff0033;
    --shadow-sm:0 1px 2px rgba(22,18,40,.06), 0 4px 14px rgba(22,18,40,.07);
    --shadow-md:0 12px 32px rgba(22,18,40,.14);
    --ease:cubic-bezier(.23,1,.32,1);
    --f-disp:"Unbounded", "Instrument Sans", system-ui, sans-serif;
    --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono:"DM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --side:0px; --top:58px; --tabs:0px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:#100e16; --bg-2:#15121d; --surface:#1c1926; --surface-2:#262233; --surface-3:#322d42;
      --line:rgba(235,228,255,.07); --line-firm:rgba(235,228,255,.15);
      --fg:#f4f1fb; --fg-soft:#c4bed6; --fg-mute:#8c869e;
      --acc:#a593ff; --acc-soft:rgba(165,147,255,.14);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --shadow-md:0 14px 34px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#100e16; --bg-2:#15121d; --surface:#1c1926; --surface-2:#262233; --surface-3:#322d42;
    --line:rgba(235,228,255,.07); --line-firm:rgba(235,228,255,.15);
    --fg:#f4f1fb; --fg-soft:#c4bed6; --fg-mute:#8c869e;
    --acc:#a593ff; --acc-soft:rgba(165,147,255,.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-md:0 14px 34px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body);
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding-left: var(--side); padding-bottom: calc(var(--tabs) + 40px + env(safe-area-inset-bottom));
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  ::selection { background: var(--acc-soft); }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
  svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
  h1, h2 { font-family: var(--f-disp); font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .eti { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-mute); }
  .eti svg { width: 14px; height: 14px; }
  .pto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  mark { background: color-mix(in srgb, var(--acc) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

  /* ---------- cabecera ---------- */
  .top { position: sticky; top: 0; z-index: 40; padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--bg) 82%, transparent); box-shadow: 0 1px 0 var(--line);
    backdrop-filter: saturate(1.5) blur(16px); -webkit-backdrop-filter: saturate(1.5) blur(16px); }
  .bar { display: flex; align-items: center; gap: 10px; height: var(--top); padding: 0 16px; max-width: 1240px; margin: 0 auto; }
  .logo { display: flex; align-items: center; gap: 9px; font-family: var(--f-disp); font-weight: 700; font-size: 17px; letter-spacing: -0.03em; white-space: nowrap; }
  .marca { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
    background: radial-gradient(circle, var(--acc) 0 30%, #17141f 31%); box-shadow: var(--shadow-sm); }
  .marca svg { width: 18px; height: 18px; opacity: .55; }
  .busca { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
  .busca svg { position: absolute; left: 13px; width: 17px; height: 17px; color: var(--fg-mute); pointer-events: none; }
  .field { width: 100%; border: 0; border-radius: 999px; background: var(--surface-2); padding: 10px 14px 10px 38px; outline: none; font-size: 15px;
    transition: background .15s, box-shadow .15s; }
  .field::placeholder { color: var(--fg-mute); }
  .field:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--acc); }
  @media (max-width: 560px) { .logo span { display: none; } #aFono span { display: none; } body.buscando .logo { display: none; } }

  /* ---------- botones y pastillas (nunca enlaces subrayados) ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; border: 1px solid var(--line-firm); background: var(--surface); color: var(--fg);
    border-radius: 999px; padding: 8px 16px; font-size: 14.5px; font-weight: 600; cursor: pointer; white-space: nowrap; user-select: none;
    transition: transform .12s var(--ease), background .15s, border-color .15s; -webkit-tap-highlight-color: transparent; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.97); }
  .btn.sm { min-height: 34px; padding: 6px 13px; font-size: 13.5px; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.pri { background: var(--tinte, var(--acc)); border-color: transparent; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25);
    box-shadow: 0 8px 22px color-mix(in srgb, var(--tinte, var(--acc)) 38%, transparent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--tinte, var(--acc)) 86%, #000); }
  .btn.vidrio { background: color-mix(in srgb, var(--bg) 45%, transparent); border-color: var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 7px; flex: none; border: 0; background: var(--surface-2); color: var(--fg-soft); border-radius: 999px; min-height: 36px;
    padding: 6px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, transform .12s var(--ease); -webkit-tap-highlight-color: transparent; }
  .chip:hover { background: var(--surface-3); color: var(--fg); }
  .chip:active { transform: scale(.96); }
  .chip.on { background: var(--fg); color: var(--bg); }
  .chip.on .pto { box-shadow: 0 0 0 2px var(--bg); }
  .chip em { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--fg-mute); }

  main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 0; }
  main.entra { animation: entra .3s var(--ease); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } }

  /* ---------- lateral (ordenador) y pestañas (móvil) ---------- */
  .lado { display: none; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.5) blur(16px); -webkit-backdrop-filter: saturate(1.5) blur(16px); box-shadow: 0 -1px 0 var(--line); }
  .tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 14px; font-size: 11.5px; font-weight: 600; color: var(--fg-mute);
    -webkit-tap-highlight-color: transparent; }
  .tabs a svg { width: 22px; height: 22px; padding: 0; transition: transform .15s var(--ease); }
  .tabs a.on { color: var(--fg); }
  .tabs a.on svg { color: var(--acc); }
  .tabs a:active svg { transform: scale(.9); }
  :root { --tabs: 64px; }
  @media (min-width: 1000px) {
    :root { --side: 248px; --tabs: 0px; }
    .tabs { display: none; }
    .logo { display: none; }
    .lado { display: flex; flex-direction: column; gap: 2px; position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); z-index: 41;
      padding: 16px 12px 24px; overflow-y: auto; background: var(--bg-2); box-shadow: 1px 0 0 var(--line); scrollbar-width: thin; }
    .lado .tit { display: flex; align-items: center; gap: 10px; font-family: var(--f-disp); font-weight: 700; font-size: 20px; letter-spacing: -0.03em; padding: 6px 10px 14px; }
    .lado .sec { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); padding: 18px 12px 6px; }
    .lado > a:not(.tit) { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--fg-soft); }
    .lado > a:not(.tit):hover { background: var(--surface-2); color: var(--fg); }
    .lado > a.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
    .lado > a.on svg { color: var(--acc); }
    .lado .volver { margin-bottom: 6px; color: var(--fg-mute) !important; font-size: 14px !important; }
    .lado summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 14.5px; font-weight: 600;
      color: var(--fg-soft); user-select: none; }
    .lado summary::-webkit-details-marker { display: none; }
    .lado summary:hover { background: var(--surface-2); color: var(--fg); }
    .lado summary span { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--fg-mute); }
    .lado summary::after { content: ""; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg);
      transition: transform .2s var(--ease); opacity: .5; }
    .lado details[open] > summary::after { transform: rotate(45deg); }
    .lado details a { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 26px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--fg-soft); line-height: 1.3; }
    .lado details a .pto { width: 7px; height: 7px; }
    .lado details a:hover { background: var(--surface-2); color: var(--fg); }
    .lado details a.on { background: var(--surface); color: var(--fg); font-weight: 650; box-shadow: var(--shadow-sm); }
  }

  /* ============================================================
     LA FUNDA Y EL VINILO (la firma de la página)
     ============================================================ */
  .disco { position: relative; display: block; width: 100%; aspect-ratio: 1.17 / 1; isolation: isolate; container-type: inline-size; }
  .funda { position: absolute; left: 0; top: 0; width: 85.5%; aspect-ratio: 1; z-index: 2; border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between; padding: 7.7cqi 7.7cqi 6.84cqi; color: #fff;
    background:
      linear-gradient(180deg, transparent 40%, rgba(0,0,0,.42)),
      var(--dib, none),
      linear-gradient(155deg, color-mix(in srgb, var(--c) 82%, #fff), color-mix(in srgb, var(--c) 72%, #000));
    box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 10px 24px rgba(0,0,0,.22), 0 2px 4px rgba(0,0,0,.15); }
  /* un dibujo por familia */
  .funda[data-p="0"] { --dib: repeating-radial-gradient(circle at 100% 100%, rgba(255,255,255,.16) 0 2px, transparent 2px 7.7cqi); }
  .funda[data-p="1"] { --dib: repeating-linear-gradient(135deg, rgba(255,255,255,.13) 0 4.28cqi, transparent 4.28cqi 9.4cqi); }
  .funda[data-p="2"] { --dib: radial-gradient(rgba(255,255,255,.28) 18%, transparent 21%) 0 0 / 6.84cqi 6.84cqi; }
  .funda[data-p="3"] { --dib: radial-gradient(circle at 72% 30%, rgba(255,255,255,.26) 0 30%, transparent 30.5%), radial-gradient(circle at 72% 30%, transparent 0 38%, rgba(255,255,255,.14) 38.5% 40%, transparent 40.5%); }
  .funda[data-p="4"] { --dib: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2.56cqi, transparent 2.56cqi 6.84cqi); }
  .funda[data-p="5"] { --dib: conic-gradient(from 200deg at 0% 100%, rgba(255,255,255,.22) 0 12deg, transparent 12deg 24deg, rgba(255,255,255,.14) 24deg 36deg, transparent 36deg 50deg, rgba(255,255,255,.18) 50deg 62deg, transparent 62deg); }
  .f-anyo { font-family: var(--f-mono); font-size: 7.27cqi; font-weight: 500; line-height: 1; letter-spacing: -.02em; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .f-anyo em { font-style: normal; opacity: .72; }
  .f-anyo em::before { content: " → "; }
  .f-tit { font-family: var(--f-disp); font-weight: 800; font-size: 10.69cqi; line-height: .98; letter-spacing: -.035em; text-wrap: balance; hyphens: auto; -webkit-hyphens: auto;
    text-shadow: 0 2px 10px rgba(0,0,0,.25); overflow-wrap: anywhere; margin-top: auto; }
  .f-fam { font-family: var(--f-mono); font-size: 5.13cqi; letter-spacing: .06em; text-transform: uppercase; opacity: .8; margin-top: 2.56cqi; }
  .vinilo { position: absolute; z-index: 1; top: 4%; right: 0; width: 78%; aspect-ratio: 1; border-radius: 50%;
    background:
      conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.13) 13%, transparent 19% 56%, rgba(255,255,255,.09) 61%, transparent 67%),
      repeating-radial-gradient(circle, #101010 0 1.2px, #1c1c1f 1.6px 2.8px);
    box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: transform .5s var(--ease); }
  .vinilo i { position: absolute; inset: 33%; border-radius: 50%; background: radial-gradient(circle, var(--bg) 0 8%, color-mix(in srgb, var(--c) 90%, #fff) 9% 100%);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .vinilo i::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); }
  a:hover > .disco .vinilo, a:focus-visible > .disco .vinilo { transform: translateX(9%) rotate(70deg); }
  /* en la cabecera de una historia, el disco gira */
  .disco.grande .vinilo { animation: gira 7s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* tarjeta = funda + datos */
  .tarj { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; -webkit-tap-highlight-color: transparent; }
  .tarj .disco { margin-bottom: 8px; transition: transform .25s var(--ease); }
  .tarj:active .disco { transform: scale(.97); }
  .t-tit { font-weight: 700; font-size: 15px; line-height: 1.25; letter-spacing: -.01em; }
  .t-lema { font-size: 13.5px; color: var(--fg-soft); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .t-meta { font-family: var(--f-mono); font-size: 12px; color: var(--fg-mute); margin-top: 2px; }
  .tarj .nueva { position: absolute; top: 8px; right: calc(14.5% + 8px); z-index: 3; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; background: #fff; color: #15121f; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .tarj .mini { height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 4px; max-width: 85%; }
  .tarj .mini i { display: block; height: 100%; background: var(--c); }

  /* ---------- portada ---------- */
  .p-hero { display: grid; gap: 28px; align-items: center; padding: 12px 0 8px; }
  .p-txt h1 { font-size: clamp(38px, 9vw, 76px); font-weight: 800; line-height: .94; letter-spacing: -.045em; margin: 12px 0 16px; }
  .p-txt p { margin: 0 0 12px; max-width: 52ch; color: var(--fg-soft); font-size: 17px; }
  .p-txt .cuenta-total { font-family: var(--f-mono); font-size: 13px; color: var(--fg-mute); margin-bottom: 18px; }
  .p-hoy { display: flex; flex-direction: column; gap: 14px; max-width: 420px; padding: 18px; border-radius: 24px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 26%, var(--surface)), var(--surface) 70%); box-shadow: var(--shadow-sm); }
  .p-hoy .disco { width: 92%; }
  .hoy-pie { display: flex; flex-direction: column; gap: 3px; }
  .hoy-pie b { font-family: var(--f-disp); font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .hoy-pie span:last-child { font-size: 14px; color: var(--fg-soft); }
  @media (max-width: 759px) { .p-hoy { flex-direction: row; align-items: center; max-width: none; padding: 14px; } .p-hoy .disco { width: 46%; flex: none; } .hoy-pie b { font-size: 16px; } .hoy-pie span:last-child { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } }
  @media (min-width: 760px) { .p-hero { grid-template-columns: 1.25fr .75fr; padding-top: 28px; } .p-hoy { justify-self: end; width: 100%; } }

  .fams { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 26px -16px 0; padding: 4px 16px; }
  .fams::-webkit-scrollbar { display: none; }
  @media (min-width: 1000px) { .fams { flex-wrap: wrap; overflow: visible; } }

  .sabias { display: flex; gap: 18px; align-items: stretch; margin: 26px 0 6px; padding: 18px 20px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-sm);
    transition: transform .2s var(--ease); }
  .sabias:hover { transform: translateY(-2px); }
  .s-anyo { flex: none; font-family: var(--f-mono); font-size: clamp(26px, 6vw, 40px); line-height: 1; color: var(--c); letter-spacing: -.04em; padding-right: 18px; border-right: 2px solid color-mix(in srgb, var(--c) 40%, transparent); }
  .s-txt { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .s-txt b { font-size: 18px; line-height: 1.3; }
  .s-txt .nota { font-size: 15px; color: var(--fg-soft); }
  .s-txt .de { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--fg-mute); }
  @media (max-width: 560px) { .sabias { flex-direction: column; gap: 10px; } .s-anyo { border-right: 0; padding: 0; } }

  .fila-discos { margin-top: 38px; }
  .fd-cab { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
  .fd-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fd-txt h2 { font-size: clamp(20px, 3.4vw, 26px); }
  .fd-txt h2::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 10px; vertical-align: .18em; }
  .fd-txt span { font-size: 14px; color: var(--fg-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flecha { display: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-firm); background: var(--surface); place-items: center; cursor: pointer; flex: none; }
  .flecha:hover { background: var(--surface-2); }
  .flecha svg { width: 18px; height: 18px; }
  @media (hover: hover) and (min-width: 700px) { .flecha { display: grid; } }
  .pista { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(150px, 42vw, 210px); gap: 18px; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; }
  .pista::-webkit-scrollbar { display: none; }
  .pista > .tarj { scroll-snap-align: start; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 18px; }
  @media (min-width: 700px) { .rejilla { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }

  /* ---------- cabeceras de sección (explorar, cronología, juego, buscar) ---------- */
  .cab { margin: 8px 0 14px; }
  .cab .eti { color: color-mix(in srgb, var(--c) 75%, var(--fg)); }
  .cab h1 { font-size: clamp(30px, 6vw, 52px); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 10px 0 10px; }
  .cab p { margin: 0; max-width: 62ch; color: var(--fg-soft); }
  .filtros { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 16px -16px 0; padding: 10px 16px;

  /* caras */

  .row:hover { background: color-mix(in srgb, var(--tinte) 7%, var(--surface-2)); }

  .anyo { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding-top: 1px; font-family: var(--f-mono); font-size: 16px; font-weight: 500; letter-spacing: -.03em;
    color: color-mix(in srgb, var(--tinte) 65%, var(--fg)); font-variant-numeric: tabular-nums; line-height: 1.2; }

  .anyo em.pos { font-style: normal; font-family: var(--f-disp); font-weight: 800; font-size: 21px; letter-spacing: -.04em; color: color-mix(in srgb, var(--tinte) 80%, var(--fg)); line-height: 1; margin-bottom: 2px; }
  .anyo b { font-weight: 400; font-size: 11.5px; color: var(--fg-mute); letter-spacing: .02em; }

  .t2 { font-size: 14.5px; color: var(--fg-soft); margin-top: 2px; }
  .nota { font-size: 14.5px; color: var(--fg-mute); margin: 6px 0 0; line-height: 1.5; max-width: 72ch; }
  .tipo, .tuya, .veredicto { display: inline-block; vertical-align: 2px; margin-left: 7px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; }
  .tipo { background: color-mix(in srgb, var(--tinte) 16%, transparent); color: color-mix(in srgb, var(--tinte) 70%, var(--fg)); }
  .tuya { margin-left: 4px; background: color-mix(in srgb, var(--sp) 16%, transparent); color: color-mix(in srgb, var(--sp) 65%, var(--fg)); }
  .veredicto { --vc: #8a8a96; background: color-mix(in srgb, var(--vc) 18%, transparent); color: color-mix(in srgb, var(--vc) 80%, var(--fg)); }
  .veredicto.falso { --vc: #e0484d; } .veredicto.cierto { --vc: #1fa45a; } .veredicto.medias { --vc: #d99a12; }

  /* acciones: escuchada, Spotify y YouTube */
  .acc { grid-column: 2; display: flex; gap: 6px; align-items: center; margin-top: 8px; }

    background: var(--surface-2); color: var(--fg-soft); transition: background .15s, color .15s, transform .12s var(--ease); -webkit-tap-highlight-color: transparent; }
  .oir svg { width: 17px; height: 17px; }

  .arriba { position: fixed; right: 16px; bottom: calc(var(--tabs) + 16px + env(safe-area-inset-bottom)); z-index: 44; width: 46px; height: 46px; border-radius: 50%; border: 0;

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
