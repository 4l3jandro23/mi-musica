<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portadas">
<meta name="theme-color" content="#14100d">
<link rel="manifest" href="portadas.webmanifest">
<link rel="apple-touch-icon" href="portadas/icono-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Permanent+Marker&display=block" rel="stylesheet">
<title>Portadas de Playlist</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14100d;
    --surface: #1e1915;
    --surface-2: #2a231d;
    --line: #3a3029;
    --fg: #f3ece2;
    --fg-mute: #a99c8c;
    --acc: #e8913a;
    --acc-fg: #1a0f05;
    --ok: #7fc98a;
    --err: #ef8a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header a { color: var(--fg-mute); text-decoration: none; font-size: 22px; line-height: 1; padding: 4px 6px 4px 0; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.01em; }

  .lienzo { position: relative; border-radius: 10px; overflow: hidden; background: #fff; aspect-ratio: 1; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .lienzo canvas { display: block; width: 100%; height: 100%; }
  .lienzo .cargando { position: absolute; inset: 0; display: grid; place-items: center; color: #555; font-size: 14px; background: #f4f4f4; }

  label.tit { display: block; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); margin: 18px 0 8px; }
  .texto { display: flex; gap: 8px; }
  .texto input[type=text] {
    flex: 1; min-width: 0; font: 600 18px/1.2 inherit; font-family: inherit;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .texto input[type=text]:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--fg-mute); font-size: 14px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--acc); }

  .paleta { display: flex; flex-wrap: wrap; gap: 10px; }
  .muestra {
    width: 42px; height: 42px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); position: relative;
  }
  .muestra[aria-pressed=true] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg) inset; }
  .muestra.cinta { border-radius: 8px; }
  .muestra.otro { background: conic-gradient(#f44, #fd4, #4d6, #4bf, #a5f, #f4a, #f44); overflow: hidden; }
  .muestra.otro input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .nombre-color { font-size: 13px; color: var(--fg-mute); margin-top: 6px; min-height: 1.2em; }

  .acciones { display: grid; gap: 10px; margin-top: 24px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    font: 600 16px/1 inherit; font-family: inherit; padding: 15px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--fg); cursor: pointer; text-decoration: none;
  }
  .btn.pri { background: var(--acc); color: var(--acc-fg); border-color: var(--acc); }
  .btn.verde { background: #1ed760; color: #06210f; border-color: #1ed760; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* hoja de playlists */
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 10; }
  .velo.abierto { display: block; }
  .hoja {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; max-height: 88dvh; z-index: 11;
    background: var(--surface); border-radius: 18px 18px 0 0; display: none; flex-direction: column;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px); max-width: 560px; margin: 0 auto;
  }
  .hoja.abierto { display: flex; }
  .hoja .cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .hoja .cab h2 { font-size: 17px; margin: 0; }
  .hoja .cerrar { background: none; border: 0; color: var(--fg-mute); font-size: 26px; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .hoja input[type=search] {
    width: 100%; font: 16px inherit; font-family: inherit; background: var(--surface-2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .lista { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 120px; }
  .fila {
    display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; width: 100%;
    background: none; border: 0; color: inherit; text-align: left; font: inherit;
  }
  .fila:hover { background: var(--surface-2); }
  .fila[aria-pressed=true] { background: var(--surface-2); outline: 2px solid var(--acc); outline-offset: -2px; }
  .fila img, .fila .sin { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; flex: none; background: var(--surface-2); }
  .fila .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila .m { font-size: 13px; color: var(--fg-mute); }
  .fila > div { min-width: 0; }
  .aviso { color: var(--fg-mute); padding: 18px 4px; text-align: center; }
  .aviso .btn { margin-top: 14px; }
  .pie { display: none; gap: 8px; flex-direction: column; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 6px; }
  .pie.visible { display: flex; }
  .pie .sel { font-size: 14px; color: var(--fg-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pie .sel b { color: var(--fg); }
  .pie .dos { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
  .pie .btn { padding: 13px 10px; font-size: 15px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%) translateY(20px);
    background: #f3ece2; color: #14100d; padding: 11px 16px; border-radius: 10px; font-weight: 600; font-size: 14px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.ver { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.mal { background: var(--err); }

  /* plantillas */
  .plantillas { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .plantillas::-webkit-scrollbar { display: none; }
  .plantilla { flex: none; width: 92px; background: none; border: 0; padding: 0; color: var(--fg-mute); font: 12.5px/1.2 inherit; font-family: inherit; cursor: pointer; scroll-snap-align: start; text-align: center; }
  .plantilla canvas { display: block; width: 92px; height: 92px; border-radius: 8px; margin-bottom: 5px; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .plantilla:active canvas { transform: scale(.96); }

  /* más opciones */
  details.mas { margin-top: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; }
  details.mas summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  details.mas summary::-webkit-details-marker { display: none; }
  details.mas summary::after { content: '+'; font-size: 22px; color: var(--fg-mute); line-height: 1; }
  details.mas[open] summary::after { content: '−'; }
  details.mas[open] { padding-bottom: 16px; }
  details.mas label.tit:first-of-type { margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: 500 14px/1 inherit; font-family: inherit; padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .campo { width: 100%; font: 16px/1.3 inherit; font-family: inherit; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: none; }
  .campo:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
  .fila2 { display: flex; gap: 8px; align-items: stretch; }
  .fila2 .campo { flex: 1; min-width: 0; font-size: 20px; }
  .btn.peque { width: auto; padding: 0 14px; font-size: 14px; white-space: nowrap; }
  .sub { margin-top: 10px; }
  .rango { display: flex; align-items: center; gap: 12px; color: var(--fg-mute); font-size: 14px; margin-top: 10px; }
  .rango input { flex: 1; accent-color: var(--acc); }
  .ayuda { font-size: 13px; color: var(--fg-mute); margin: 6px 0 0; }

  /* barra bajo la vista previa */
  .barra { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .ico { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 20px; cursor: pointer; }
  .ico:disabled { opacity: .35; cursor: default; }
  .ico.dado { font-size: 22px; }
  .vista-spotify { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: #121212; border-radius: 10px; padding: 6px 10px 6px 6px; }
  .vista-spotify canvas { width: 40px; height: 40px; border-radius: 4px; flex: none; }
  .vista-spotify div { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .vista-spotify b { font-size: 14px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vista-spotify span { font-size: 12px; color: #a7a7a7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .cab-fila { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .cab-fila .tit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .enlace { background: none; border: 0; color: var(--acc); font: 600 14px inherit; font-family: inherit; cursor: pointer; padding: 18px 0 8px; white-space: nowrap; }
  .nota { margin: -4px 0 8px; }

  /* miniaturas: plantilla, idea o diseño guardado */
  .plantilla { position: relative; padding-top: 6px; }
  .mini-btn { display: block; background: none; border: 0; padding: 0; color: var(--fg-mute); font: 12.5px/1.2 inherit; font-family: inherit; cursor: pointer; text-align: center; width: 92px; }
  .mini-btn canvas { display: block; width: 92px; height: 92px; border-radius: 8px; margin-bottom: 5px; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .mini-btn:active canvas { transform: scale(.96); }
  .guardar-mio { height: 92px; border: 2px dashed var(--line); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--fg-mute); }
  .mas-grande { font-size: 28px; line-height: 1; }
  .borrar { position: absolute; top: 0; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.8); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
  .chip.emoji { font-size: 18px; padding: 6px 10px; min-width: 42px; }

  /* modo varias */
  .fila.multi .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--fg-mute); flex: none; }
  .fila.multi[aria-pressed=true] { outline: none; }
  .fila.multi[aria-pressed=true] .tick { background: #1ed760; border-color: #1ed760; box-shadow: inset 0 0 0 3px var(--surface); }
  .hoja .cab .chip { margin-left: auto; }

  /* miniatura flotante al bajar */
  .flotante { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 12px; z-index: 9; width: 84px; height: 84px; padding: 0; border: 2px solid rgba(255,255,255,.2); border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.55); cursor: pointer; }
  .flotante canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="Volver">‹</a>
  <h1>Portadas de Playlist</h1>
</header>

<div class="lienzo">
  <canvas id="lienzo" width="1024" height="1024" aria-label="Vista previa de la portada"></canvas>
  <div class="cargando" id="cargando">Cargando…</div>
</div>

<div class="barra">
  <button class="ico" id="deshacer" disabled aria-label="Deshacer">↶</button>
  <button class="ico" id="rehacer" disabled aria-label="Rehacer">↷</button>
  <div class="vista-spotify" aria-label="Así se verá en tu lista de Spotify">
    <canvas id="vista-mini" width="96" height="96"></canvas>
    <div><b id="vista-nombre"></b><span>Así se ve en Spotify</span></div>
  </div>
  <button class="ico dado" id="sorpresa" aria-label="Sorpréndeme">🎲</button>
</div>

<label class="tit" for="texto">Nombre de la playlist (va en la cinta)</label>
<div class="texto">
  <input type="text" id="texto" value="SALSA" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false">
</div>
<label class="chk"><input type="checkbox" id="mayus" checked> Todo en mayúsculas</label>

<div class="cab-fila">
  <label class="tit" id="ideas-tit">Ideas</label>
  <button class="enlace" id="otras-ideas">Otras ideas ↻</button>
</div>
<p class="ayuda nota" id="ideas-nota"></p>
<div class="plantillas" id="ideas"></div>

<label class="tit">Mis diseños</label>
<p class="ayuda nota" id="mios-vacio">Guarda un diseño que te guste para usarlo en otras playlists y que todas queden a juego.</p>
<div class="plantillas" id="mios"></div>

<label class="tit">Plantillas</label>
<div class="plantillas" id="plantillas"></div>

<label class="tit">Color del disco</label>
<div class="paleta" id="pal-disco"></div>
<div class="nombre-color" id="nom-disco"></div>

<label class="tit">Color de la cinta</label>
<div class="paleta" id="pal-cinta"></div>
<div class="nombre-color" id="nom-cinta"></div>

<details class="mas" id="mas">
  <summary>Más opciones</summary>

  <label class="tit">Acabado del disco</label>
  <div class="chips" id="acabados"></div>
  <div id="foto-ctl" class="sub" hidden>
    <p class="ayuda" id="foto-nombre"></p>
    <label class="btn sub">Elegir foto<input type="file" id="foto-in" accept="image/*" hidden></label>
  </div>

  <label class="tit">Dibujo repetido</label>
  <label class="chk"><input type="checkbox" id="pat-on"> Repetir un dibujo por todo el disco</label>
  <div id="pat-ctl" class="sub" hidden>
    <div class="fila2">
      <input type="text" class="campo" id="pat-emoji" maxlength="12" placeholder="Emoji o símbolo" autocomplete="off" aria-label="Emoji o símbolo">
      <label class="btn peque">Subir logo<input type="file" id="logo-in" accept="image/*" hidden></label>
    </div>
    <div class="chips rapidos sub" id="rapidos"></div>
    <p class="ayuda">Toca uno o escribe el tuyo. Si pones varios (🍑🍒), se van alternando.</p>
    <label class="chk" id="logo-si" hidden><input type="checkbox" id="pat-logo"> Usar mi logo en vez del emoji</label>
    <label class="chk"><input type="checkbox" id="pat-blanco"> Símbolos y logo en blanco (si no, en negro)</label>
    <label class="chk"><input type="checkbox" id="pat-fondo"> Con un círculo detrás</label>
    <label class="rango">Tamaño <input type="range" id="pat-tam" min="30" max="140" step="2"></label>
    <label class="rango">Separación <input type="range" id="pat-sep" min="1.4" max="3.6" step="0.05"></label>
  </div>

  <label class="tit" for="borde">Texto alrededor del borde</label>
  <input type="text" class="campo" id="borde" maxlength="40" placeholder="Ej.: LADO A · 33 RPM" autocomplete="off">

  <label class="tit" for="grande">Texto grande en el disco</label>
  <textarea class="campo" id="grande" rows="2" maxlength="30" placeholder="Ej.: VOL. (y en otra línea) 2"></textarea>
  <div class="chips sub" id="grande-pos"></div>

  <label class="tit">Estilo de los textos del disco</label>
  <div class="chips" id="estilos"></div>
</details>

<div class="acciones">
  <button class="btn pri" id="guardar">Guardar imagen</button>
  <button class="btn verde" id="abrir-spotify">Poner en una playlist de Spotify</button>
</div>

<div class="velo" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-tit">
  <div class="cab">
    <h2 id="hoja-tit">Elige la playlist</h2>
    <button class="chip" id="varias" aria-pressed="false" hidden>Varias a la vez</button>
    <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
  </div>
  <input type="search" id="buscar" placeholder="Buscar playlist…" autocomplete="off">
  <div class="lista" id="lista"></div>
  <div class="pie" id="pie">
    <div class="sel" id="sel"></div>
    <div class="dos" id="pie-uno">
      <button class="btn" id="usar-nombre">Usar su nombre</button>
      <button class="btn verde" id="subir">Poner portada</button>
    </div>
    <div class="dos" id="pie-varias" hidden>
      <button class="btn" id="marcar-todas">Marcar todas</button>
      <button class="btn verde" id="subir-varias" disabled>Poner portadas</button>
    </div>
    <button class="btn" id="detener" hidden>Detener</button>
  </div>
</div>

<button class="flotante" id="flotante" hidden aria-label="Volver a la portada"><canvas id="flotante-lienzo" width="200" height="200"></canvas></button>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============================================================
   PORTADAS DE PLAYLIST
   ------------------------------------------------------------
   La base es la foto del CD con la cinta ya limpia (sin "SALSA").
   mascaras.png dice qué píxeles son disco (canal rojo) y cuáles
   cinta (canal verde), con el borde suavizado. Para recolorear se
   conserva la luz de cada píxel (brillos, reflejos, arrugas de la
   cinta) y solo se cambia el tono: así el disco sigue pareciendo
   un CD y no una mancha plana.
   ============================================================ */

const W = 1024;
const K_AJUSTES = 'portadas_ajustes_v1';
const K_CREDS = 'musicvault_spotify_creds_v1';   // la misma sesión que MusicVault y el Estudio
const API = 'https://api.spotify.com/v1';

/* Zona útil de la cinta (en píxeles de la imagen de 1024). Deja fuera
   el doblez del borde derecho, como en la original. */
const CAJA = { x: 722, y: 392, w: 246, h: 256 };
const TAM_MAX = 112;   // "SALSA" en la original mide lo que da este tamaño
/* Permanent Marker viene inclinada y algo achatada; la letra de la foto es
   recta y más alta. Se endereza (ENDEREZA) y se estira en vertical (ALTO_X). */
const ENDEREZA = 0.16, ALTO_X = 1.3;

const DISCOS = [
  { id: 'orig', n: 'Dorado (original)', c: null, vista: 'conic-gradient(#f9b84a,#c9661a,#fbd27a,#7a3b0a,#f9b84a)' },
  { id: 'plata', n: 'Plata', c: '#c9ccd3' },
  { id: 'negro', n: 'Negro', c: '#3a3a3e' },
  { id: 'rojo', n: 'Rojo', c: '#e0312b' },
  { id: 'naranja', n: 'Naranja', c: '#ff8a1f' },
  { id: 'amarillo', n: 'Amarillo', c: '#f5c518' },
  { id: 'rosa', n: 'Rosa', c: '#ff5fa8' },
  { id: 'morado', n: 'Morado', c: '#8a4dff' },
  { id: 'azul', n: 'Azul', c: '#2f7bff' },
  { id: 'marino', n: 'Azul marino', c: '#1d5ea8' },
  { id: 'cian', n: 'Turquesa', c: '#18c7c1' },
  { id: 'verde', n: 'Verde', c: '#3cc14a' }
];
const CINTAS = [
  { id: 'orig', n: 'Cobre (original)', c: null, vista: '#b5602a' },
  { id: 'blanco', n: 'Blanca', c: '#f1ede4' },
  { id: 'amarillo', n: 'Amarilla', c: '#f2c230' },
  { id: 'rojo', n: 'Roja', c: '#c9302a' },
  { id: 'rosa', n: 'Rosa', c: '#ef7fb0' },
  { id: 'azul', n: 'Azul', c: '#3565c9' },
  { id: 'verde', n: 'Verde', c: '#3f9a4e' },
  { id: 'gris', n: 'Gris plata', c: '#9a9d9f' },
  { id: 'negro', n: 'Negra', c: '#2b2b2b' }
];

const $ = id => document.getElementById(id);
const leer = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } };
const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

/* ---------------- recoloreado ---------------- */
let base = null, lum = null, mDisco = null, mCinta = null;
let refDisco = 1, topeDisco = 2, refCinta = 1, topeCinta = 2;

function cargarImg(src) {
  return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No se pudo cargar ' + src)); i.src = src; });
}
function pixeles(img) {
  const c = document.createElement('canvas'); c.width = c.height = W;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, W, W);
  return x.getImageData(0, 0, W, W).data;
}
/* Luz de referencia (media) y techo (percentil 98) de una zona, para
   saber qué píxeles son "más claros de lo normal" (reflejos) */
function referencia(mascara) {
  let s = 0, n = 0; const hist = new Uint32Array(256);
  for (let i = 0; i < lum.length; i++) if (mascara[i] > 200) { s += lum[i]; n++; hist[Math.round(lum[i] * 255)]++; }
  const media = s / n;
  let acum = 0, p98 = 1;
  for (let v = 0; v < 256; v++) { acum += hist[v]; if (acum >= n * 0.98) { p98 = v / 255; break; } }
  return [media, Math.max(1.05, p98 / media)];
}

async function preparar() {
  const [b, m] = await Promise.all([cargarImg('portadas/base.jpg'), cargarImg('portadas/mascaras.png')]);
  base = pixeles(b);
  const mp = pixeles(m);
  const n = W * W;
  lum = new Float32Array(n); mDisco = new Uint8Array(n); mCinta = new Uint8Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    lum[i] = (0.299 * base[j] + 0.587 * base[j + 1] + 0.114 * base[j + 2]) / 255;
    mDisco[i] = mp[j]; mCinta[i] = mp[j + 1];
  }
  [refDisco, topeDisco] = referencia(mDisco);
  [refCinta, topeCinta] = referencia(mCinta);
}

const hexRgb = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16) / 255);

/* Cada píxel: más oscuro que la media -> el color oscurecido en la misma
   proporción; más claro -> el color aclarado hacia blanco. Así un disco
   plateado conserva sus rayos de luz y una cinta blanca sus arrugas. */
function tenir(datos, mascara, hex, ref, tope) {
  const c = hexRgb(hex);
  for (let i = 0, j = 0; i < mascara.length; i++, j += 4) {
    const a = mascara[i];
    if (!a) continue;
    const r = lum[i] / ref;
    let o0, o1, o2;
    if (r <= 1) { o0 = c[0] * r; o1 = c[1] * r; o2 = c[2] * r; }
    else {
      const t = Math.min(1, (r - 1) / (tope - 1)) * 0.85;
      o0 = c[0] + (1 - c[0]) * t; o1 = c[1] + (1 - c[1]) * t; o2 = c[2] + (1 - c[2]) * t;
    }
    const f = a / 255;
    datos[j]     = datos[j]     * (1 - f) + o0 * 255 * f;
    datos[j + 1] = datos[j + 1] * (1 - f) + o1 * 255 * f;
    datos[j + 2] = datos[j + 2] * (1 - f) + o2 * 255 * f;
  }
}

/* ---------------- texto a rotulador ---------------- */
/* Reparte las palabras en 1..4 líneas y se queda con el reparto que
   permite la letra más grande dentro de la cinta. */
function repartos(palabras, n) {
  if (n === 1) return [[palabras.join(' ')]];
  const out = [];
  for (let i = 1; i <= palabras.length - n + 1; i++)
    for (const resto of repartos(palabras.slice(i), n - 1)) out.push([palabras.slice(0, i).join(' ')].concat(resto));
  return out;
}
function mejorReparto(ctx, palabras, alto) {
  let mejor = null;
  for (let n = 1; n <= Math.min(4, palabras.length); n++) {
    for (const lineas of repartos(palabras, n)) {
      const ancho = Math.max(...lineas.map(l => ctx.measureText(l).width));
      const tam = Math.min(TAM_MAX, CAJA.w / ancho * 100, CAJA.h / (n * alto * ALTO_X));
      if (!mejor || tam > mejor.tam + 0.5) mejor = { lineas, tam, alto };
    }
  }
  return mejor;
}
function maquetar(ctx, texto) {
  let palabras = texto.split(/\s+/).filter(Boolean);
  if (!palabras.length) return null;
  ctx.font = '100px "Permanent Marker"';
  const alto = 1.02;   // interlineado, en "em"
  let mejor = mejorReparto(ctx, palabras, alto);
  /* Una palabra muy larga (13+ letras) dejaría la letra diminuta: se parte
     con guion en 2-4 trozos, como se haría a mano en una cinta estrecha, y
     solo si así queda claramente más grande. */
  for (let trozos = 2; trozos <= 4; trozos++) {
    const prueba = [];
    palabras.forEach(w => {
      if (w.length < 13) { prueba.push(w); return; }
      const t = Math.ceil(w.length / trozos);
      for (let i = 0; i < w.length; i += t) prueba.push(w.slice(i, i + t) + (i + t < w.length ? '-' : ''));
    });
    if (prueba.length === palabras.length) break;   // no hay ninguna palabra tan larga
    const otro = mejorReparto(ctx, prueba, alto);
    if (otro.tam > mejor.tam * 1.15) mejor = otro;
  }
  return mejor;
}
/* rotulador negro sobre cinta clara; blanco (de pintura) sobre cinta oscura */
function colorTinta(st) {
  const cc = colorDe(CINTAS, st.cinta, st.cintaOtro);
  if (!cc) return '#17110e';
  const [r, g, b] = hexRgb(cc);
  return 0.299 * r + 0.587 * g + 0.114 * b < 0.3 ? '#f2eee6' : '#17110e';
}
function escribirCinta(ctx, texto, st) {
  const m = maquetar(ctx, texto);
  if (!m) return;
  ctx.save();
  ctx.font = m.tam.toFixed(1) + 'px "Permanent Marker"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  /* altura real de las letras para centrar de verdad en vertical */
  const med = ctx.measureText(m.lineas.join(''));
  const asc = med.actualBoundingBoxAscent, desc = Math.max(0, med.actualBoundingBoxDescent);
  const paso = m.tam * m.alto * ALTO_X;
  const bloque = paso * (m.lineas.length - 1) + (asc + desc) * ALTO_X;
  const cx = CAJA.x + CAJA.w / 2, y0 = CAJA.y + (CAJA.h - bloque) / 2 + asc * ALTO_X;
  ctx.translate(cx, CAJA.y + CAJA.h / 2);
  ctx.rotate(-0.012);
  ctx.translate(-cx, -(CAJA.y + CAJA.h / 2));
  ctx.fillStyle = colorTinta(st);
  ctx.globalAlpha = 0.94;
  m.lineas.forEach((l, i) => {
    const y = y0 + i * paso, ym = y - (asc - desc) / 2 * ALTO_X;   // centro de la línea
    ctx.save();
    ctx.translate(cx, ym);
    ctx.transform(1, 0, ENDEREZA, ALTO_X, 0, 0);
    ctx.fillText(l, 0, (asc - desc) / 2);
    ctx.restore();
  });
  ctx.restore();
}

/* ---------------- utilidades de dibujo ---------------- */
const temps = {};
function temp(nombre) {
  if (!temps[nombre]) { const c = document.createElement('canvas'); c.width = c.height = W; temps[nombre] = c; }
  return temps[nombre];
}
/* azar con semilla: la textura sale igual en la vista previa, en las
   miniaturas y en la imagen que se sube */
function azar(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let _mascara = null;
function mascaraDisco() {

  const x = c.getContext('2d'), im = x.createImageData(W, W);
  for (let i = 0; i < mDisco.length; i++) im.data[i * 4 + 3] = mDisco[i];

}

/* ---------------- acabados ---------------- */
/* Misma idea que tenir(): un factor de luz r por píxel; r<1 oscurece el
   color, r>1 lo acerca a blanco (k = cuánto brilla el material). */
const texturas = {};
function textura(acabado, hex) {
  const clave = acabado + hex;
  if (texturas[clave]) return texturas[clave];
  const c = hexRgb(hex);
  const cv = document.createElement('canvas'); cv.width = cv.height = W;
  const x = cv.getContext('2d'), im = x.createImageData(W, W), d = im.data;
  const rnd = azar(7);
  const anillos = new Float32Array(1400);
  for (let i = 0, v = 0; i < anillos.length; i++) { v = v * 0.55 + (rnd() - 0.5); anillos[i] = v; }
  const k = acabado === 'metal' ? 0.8 : acabado === 'goma' ? 0.35 : acabado === 'puntos' ? 0.6 : acabado === 'rayas' ? 0.9 : 0.5;
  for (let y = DY - DR - 4; y < DY + DR + 4; y++) {
    for (let xx = DX - DR - 4; xx < DX + DR + 4; xx++) {
      const dx = xx - DX, dy = y - DY, rho = Math.sqrt(dx * dx + dy * dy);
      if (rho > DR + 3) continue;
      const th = Math.atan2(dy, dx);
      let r, brillo = 0;
      if (acabado === 'metal') {
        /* rayado circular fino + dos franjas de luz que giran con el disco */
        r = 1 + 0.16 * anillos[Math.round(rho * 3)] + 0.34 * Math.cos(2 * (th - 0.5)) + 0.12 * Math.cos(4 * (th + 0.4)) + 0.05 * (rnd() - 0.5);
      } else if (acabado === 'goma') {
        /* grano de goma, un poco de luz hacia arriba a la izquierda y dos
           surcos biselados como en un disco de pesas */
        r = 1 + 0.24 * (rnd() - 0.5) + 0.05 * anillos[Math.round(rho * 1.5)] + 0.1 * Math.cos(th - LUZ) * (rho / DR);
        for (const g of [220, 352, DR - 7]) {
          const dd = rho - g;
          if (dd > -6 && dd < 6) r += 0.55 * Math.cos(th - LUZ) * Math.sign(dd) * (1 - Math.abs(dd) / 6);
        }
      } else if (acabado === 'rayas') {
        /* franjas anchas claras sobre el color, con grano de asfalto
           y bordes algo gastados (paso de cebra) */
        const franja = ((y - DY + 1035) / 70 | 0) % 2 === 0;
        const borde = Math.abs(((y - DY + 1035) % 70) - 35) > 31 ? 0.25 * rnd() : 0;
        r = franja ? 2 - borde - 0.15 * rnd() : 0.9 + 0.2 * (rnd() - 0.5);
      } else if (acabado === 'puntos') {
        /* bultitos en rejilla hexagonal, iluminados desde arriba a la
           izquierda y con una sombra pequeña al otro lado: piel de gallina */
        const s = 19, fila = Math.round(dy / (s * 0.866)), desp = (fila & 1) * s / 2;
        const col = Math.round((dx - desp) / s);
        const ex = dx - (col * s + desp), ey = dy - fila * s * 0.866, rb = 6.5;
        const dd = Math.sqrt(ex * ex + ey * ey);
        r = 0.92 + 0.06 * (rnd() - 0.5) + 0.12 * Math.cos(th - LUZ) * (rho / DR);
        if (dd < rb) {
          const nz = Math.sqrt(1 - (dd / rb) * (dd / rb));
          r += 0.6 * (-(ex / rb) * 0.6 - (ey / rb) * 0.6 + nz * 0.53 - 0.53);
        } else if (dd < rb + 2.5) {
          r -= 0.18 * Math.max(0, (ex + ey) / (dd * 1.41)) * (1 - (dd - rb) / 2.5);
        }
      } else {
        /* vinilo: surcos + el típico reflejo en cruz */
        const surco = 0.5 + 0.5 * Math.sin(rho * 2.3 + anillos[Math.round(rho * 2)] * 2);
        r = 0.8 + 0.3 * surco;
        brillo = Math.pow(Math.max(0, Math.cos(2 * (th - 0.7))), 8) * 0.5 * (0.7 + 0.3 * surco);
      }
      const j = (y * W + xx) * 4;
      for (let ch = 0; ch < 3; ch++) {
        let o = r <= 1 ? c[ch] * r : c[ch] + (1 - c[ch]) * Math.min(1, r - 1) * k;
        o = o + (1 - o) * brillo;
        d[j + ch] = o * 255;
      }
      d[j + 3] = 255;
    }
  }
  x.putImageData(im, 0, 0);
  return (texturas[clave] = cv);
}

/* La foto propia lleva encima los brillos del CD original, suaves,
   para que siga pareciendo un disco dentro de la caja. */

/* ---------------- dibujo repetido ---------------- */
const simbolos = s => {
  s = (s || '').trim();
  if (!s) return [];
  if (window.Intl && Intl.Segmenter) return Array.from(new Intl.Segmenter('es', { granularity: 'grapheme' }).segment(s), g => g.segment).filter(g => g.trim());
  return Array.from(s).filter(g => g.trim());
};
/* Símbolos "de trazo": cada móvil los pinta distinto (a veces como emoji
   de color), así que se dibujan como silueta en blanco o negro. Todo lo
   demás se trata como emoji y se deja con sus colores. */
const MONO = new Set(Array.from('♫♪✦★☆♥♡⚡❄☾☀●○▲△■◆✿❀☂✈✎✚✕✓☁☘⚓♠♣♦∞☯☮✌'));
function sprite(g, tam, blanco) {
  const lado = Math.ceil(tam * 1.6);
  const c = document.createElement('canvas'); c.width = c.height = lado;
  const x = c.getContext('2d');
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const mono = MONO.has(g.replace(/️|︎/g, ''));
  x.font = tam + 'px ' + (mono
    ? '"Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif'
    : '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif');
  x.fillText(mono ? g.replace(/️/g, '') + '︎' : g, lado / 2, lado / 2 + tam * 0.04);
  if (mono) {
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = blanco ? '#f6f4ef' : '#141414';
    x.fillRect(0, 0, lado, lado);
  }
  return c;
}
function dibujarPatron(x, st) {
  const tam = st.patTam, paso = tam * (st.patSep || 2.25);
  const usarLogo = st.patLogo && logoImg;
  const lista = simbolos(st.patEmoji);
  if (!usarLogo && !lista.length) return;
  const logo = usarLogo ? (st.patBlanco ? logoBlanco : logoImg) : null;
  const sprites = logo ? [] : lista.map(g => sprite(g, tam, st.patBlanco));
  const filas = Math.ceil(DR / (paso * 0.866)) + 1;
  let n = 0;
  for (let j = -filas; j <= filas; j++) {
    for (let i = -filas - 1; i <= filas + 1; i++) {
      const px = DX + (i + (j & 1) * 0.5) * paso, py = DY + j * paso * 0.866;
      const rho = Math.hypot(px - DX, py - DY);
      if (rho < R_HUB + tam * 0.55 || rho > DR + tam * 0.4) continue;
      if (st.patFondo) {
        x.fillStyle = 'rgba(0,0,0,0.22)';
        x.beginPath(); x.arc(px, py, tam * 0.88, 0, Math.PI * 2); x.fill();
      }
      if (logo) {
        const f = Math.min(tam * 1.1 / logo.width, tam * 1.1 / logo.height);
        x.drawImage(logo, px - logo.width * f / 2, py - logo.height * f / 2, logo.width * f, logo.height * f);
      } else {
        const sp = sprites[n % sprites.length];
        x.drawImage(sp, px - sp.width / 2, py - sp.height / 2);
      }
      n++;
    }
  }
}

/* Relieve: sombra abajo-derecha, luz arriba-izquierda, y el interior se
   vacía para que se vea el material de debajo, como un grabado. */
function estampar(x, dibujo, estilo) {
  const g = temp('glifos'), gx = g.getContext('2d');
  gx.clearRect(0, 0, W, W); gx.fillStyle = '#fff'; dibujo(gx);
  const t = temp('tinte'), tx = t.getContext('2d');
  const capa = temp('relieve'), cx = capa.getContext('2d');
  cx.clearRect(0, 0, W, W);
  const pon = (color, alfa, ox, oy, modo) => {
    tx.globalCompositeOperation = 'source-over'; tx.clearRect(0, 0, W, W); tx.drawImage(g, 0, 0);
    tx.globalCompositeOperation = 'source-in'; tx.fillStyle = color; tx.fillRect(0, 0, W, W);
    cx.globalAlpha = alfa; cx.globalCompositeOperation = modo || 'source-over';
    cx.drawImage(t, ox, oy);
    cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
  };
  if (estilo === 'relieve') {
    pon('#000', 0.6, 2.5, 2.5);
    pon('#fff', 0.45, -1.5, -1.5);
    pon('#000', 1, 0, 0, 'destination-out');
    pon('#fff', 0.1, 0, 0);
  } else {
    pon(estilo === 'blanco' ? '#f5f2ea' : '#121212', 0.95, 0, 0);
  }
  x.drawImage(capa, 0, 0);
}
function textoBorde(gx, texto) {
  const tam = 30, radio = DR - 28;
  gx.font = '600 ' + tam + 'px Oswald, "Arial Narrow", sans-serif';
  gx.textAlign = 'center'; gx.textBaseline = 'middle';
  const unidad = texto + '     ';
  const ancho = gx.measureText(unidad).width, circ = 2 * Math.PI * radio;
  const veces = Math.max(1, Math.floor(circ / ancho));
  const letras = Array.from(unidad.repeat(veces));
  const extra = (circ - ancho * veces) / letras.length;   // reparte el hueco sobrante entre letras
  let a = -Math.PI / 2 - 0.35;

    a += w / 2 / radio;
    gx.save();
    gx.translate(DX + radio * Math.cos(a), DY + radio * Math.sin(a));
    gx.rotate(a + Math.PI / 2);
    gx.fillText(l, 0, 0);
    gx.restore();
    a += w / 2 / radio;

  if (!lineas.length) return;
  const z = ZONAS[pos] || ZONAS.izq, alto = 0.92;
  gx.font = '700 100px Oswald, "Arial Narrow", sans-serif';
  const ancho = Math.max(...lineas.map(l => gx.measureText(l).width));
  const tam = Math.min(150, z.w / ancho * 100, z.h / (lineas.length * alto));
  gx.font = '700 ' + tam.toFixed(1) + 'px Oswald, "Arial Narrow", sans-serif';
  gx.textAlign = 'center'; gx.textBaseline = 'middle';
  const y0 = z.y - (lineas.length - 1) * tam * alto / 2;
  lineas.forEach((l, i) => gx.fillText(l, z.x, y0 + i * tam * alto));
}

}

const K_LOGO = 'portadas_logo_v1', K_FOTO = 'portadas_foto_v1';

/* reduce la imagen (para que quepa en el almacenamiento del móvil) */
function reducir(img, max, tipo, q) {
  const f = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { canvas: c, url: c.toDataURL(tipo, q) };
}
function ponerLogo(c) {
  logoImg = c;
  logoBlanco = document.createElement('canvas');
  logoBlanco.width = c.width; logoBlanco.height = c.height;
  const x = logoBlanco.getContext('2d');
  x.drawImage(c, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#f6f4ef'; x.fillRect(0, 0, c.width, c.height);
}
const leerArchivo = f => new Promise((ok, mal) => {
  const r = new FileReader();
  r.onload = () => cargarImg(r.result).then(ok, mal);
  r.onerror = () => mal(r.error);
  r.readAsDataURL(f);
});

}

const marcadores = [];
function montarPaleta(cont, lista, clave, claveOtro, nom, cinta) {
  const el = $(cont);
  const marcar = () => {
    el.querySelectorAll('.muestra').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === aj[clave])));
    const x = lista.find(x => x.id === aj[clave]);
    let t = x ? x.n : 'Personalizado (' + aj[claveOtro] + ')';
    if (!cinta && aj[clave] === 'orig' && aj.acabado !== 'cd') t = 'Color propio del acabado';
    if (!cinta && aj.acabado === 'foto') t = 'Con tu foto no se usa el color del disco';
    $(nom).textContent = t;
    inp.value = aj[claveOtro];
  };
  lista.forEach(x => {
    const b = document.createElement('button');
    b.className = 'muestra' + (cinta ? ' cinta' : '');
    b.dataset.id = x.id; b.title = x.n; b.setAttribute('aria-label', x.n);
    b.style.background = x.vista || x.c;
    b.onclick = () => { aj[clave] = x.id; marcar(); pintar(); guardarAjustes(); };
    el.appendChild(b);
  });
  const o = document.createElement('label');
  o.className = 'muestra otro' + (cinta ? ' cinta' : '');
  o.dataset.id = 'otro'; o.title = 'Elegir otro color';
  const inp = document.createElement('input');
  inp.type = 'color'; inp.value = aj[claveOtro]; inp.setAttribute('aria-label', 'Elegir otro color');
  inp.oninput = () => { aj[claveOtro] = inp.value; aj[clave] = 'otro'; marcar(); pintar(); };
  inp.onchange = guardarAjustes;
  inp.onclick = () => { if (aj[clave] !== 'otro') { aj[clave] = 'otro'; marcar(); pintar(); guardarAjustes(); } };
  o.appendChild(inp);
  el.appendChild(o);
  marcadores.push(marcar);
  marcar();
}
function montarChips(cont, lista, clave, alCambiar) {
  const el = $(cont);
  const marcar = () => el.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === aj[clave])));
  lista.forEach(x => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.id = x.id; b.textContent = x.n;
    b.onclick = () => { aj[clave] = x.id; marcar(); if (alCambiar) alCambiar(); pintar(); guardarAjustes(); };
    el.appendChild(b);
  });
  marcadores.push(marcar);
  marcar();
}

/* Un diseño al azar pero con sentido: tonos del disco y la cinta que
   contrastan, y dibujos solo a veces. */
const SIMBOLOS = ['✦', '★', '♫', '●', '♥', '⚡', '☾', '✿', '▲', '❄', '☀', '♪'];
function aleatorio(semilla) {
  const r = azar(semilla), elige = l => l[Math.floor(r() * l.length)];
  const acabado = elige(['cd', 'cd', 'cd', 'metal', 'metal', 'vinilo', 'puntos']);
  const discos = DISCOS.map(d => d.id);
  const disco = acabado === 'vinilo' ? 'orig' : elige(discos);
  let cinta = elige(CINTAS.map(c => c.id));
  if (cinta === disco) cinta = 'blanco';
  const d = { acabado, disco, cinta };
  if (acabado !== 'puntos' && r() < 0.55) Object.assign(d, { patOn: true, patEmoji: elige(SIMBOLOS), patTam: 30 + Math.round(r() * 30), patFondo: r() < 0.4 });
  if (r() < 0.2) Object.assign(d, { borde: '{T}', estilo: elige(['relieve', 'blanco', 'negro']) });
  return d;
}
function ideasPara(texto, vuelta) {
  const tema = vuelta ? null : temaDe(texto);
  const lista = tema ? tema.ideas.slice() : [];
  const base = semillaDe(sinTildes(texto)) + vuelta * 7919;
  for (let i = 0; lista.length < 6; i++) lista.push(aleatorio(base + i * 104729));
  return { tema, lista };
}

const cred = () => leer(K_CREDS, null);

async function token() {
  const c = cred();
  if (!c || !c.refreshToken) throw new Error('SIN_CONEXION');
  if (c.accessToken && c.expiresAt > Date.now()) return c.accessToken;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: c.refreshToken, client_id: c.clientId })
  });
  if (!res.ok) throw new Error('SESION_CADUCADA');
  const d = await res.json();
  escribir(K_CREDS, {
    clientId: c.clientId, accessToken: d.access_token,
    refreshToken: d.refresh_token || c.refreshToken,
    expiresAt: Date.now() + (d.expires_in - 60) * 1000,
    scope: d.scope || c.scope || ''
  });
  return d.access_token;
}
async function sp(ruta, o) {
  o = o || {};
  let intentos = 0;
  while (true) {
    const cab = { Authorization: 'Bearer ' + await token() };
    if (o.body !== undefined) cab['Content-Type'] = o.tipo || 'application/json';
    let res;
    try { res = await fetch(ruta.indexOf('http') === 0 ? ruta : API + ruta, { method: o.method || 'GET', headers: cab, body: o.body }); }
    catch (e) { if (++intentos > 3) throw new Error('Sin conexión con Spotify'); await sleep(800 * intentos); continue; }
    if (res.status === 429) {
      if (++intentos > 5) throw new Error('Spotify está frenando las peticiones; prueba en un rato');
      await sleep(Math.min(20, +(res.headers.get('Retry-After') || 2)) * 1000);
      continue;
    }
    if (res.status === 401) {
      if (++intentos > 2) throw new Error('SESION_CADUCADA');
      const c = cred(); if (c) escribir(K_CREDS, Object.assign({}, c, { accessToken: '', expiresAt: 0 }));
      continue;
    }
    if (res.status >= 500) { if (++intentos > 3) throw new Error('Spotify no responde (' + res.status + ')'); await sleep(700 * intentos); continue; }
    if (!res.ok) {
      let t = ''; try { const j = await res.json(); t = (j.error && (j.error.message || j.error)) || ''; } catch (e) {}
      const e = new Error(res.status + (t ? ': ' + t : '')); e.status = res.status; throw e;
    }
    const txt = await res.text();
    try { return txt ? JSON.parse(txt) : null; } catch (e) { return null; }
  }
}

/* Spotify solo acepta JPEG en base64 de hasta 256 KB: se baja calidad
   (y si hace falta tamaño) hasta que quepa. */
function jpegDe(origen) {
  const LIM = 250000;
  for (const lado of [1024, 800, 640]) {
    let c = origen;
    if (lado !== W) { c = document.createElement('canvas'); c.width = c.height = lado; c.getContext('2d').drawImage(origen, 0, 0, lado, lado); }
    for (let q = 0.92; q >= 0.6; q -= 0.08) {
      const b64 = c.toDataURL('image/jpeg', q).split(',')[1];
      if (b64.length <= LIM) return b64;
    }
  }
  throw new Error('La imagen no cabe en el límite de Spotify');
}

  }
  $('cargando').remove();
  sincronizar();
  pintarYa();
  registrarYa();
  montarIdeas(true);
  montarMios();
  montarPlantillas();
})();
</script>
