<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MusicVault">
<meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="musicvault.webmanifest">
<title>MusicVault</title>
<style>
  :root {
    color-scheme: light;
    /* neutrales con sesgo cálido, no gris puro */
    --bg:        #f7f2e9;
    --surface:   #fffdf8;
    --surface-2: #efe8db;
    --line:      rgba(26,20,14,0.11);
    --line-firm: rgba(26,20,14,0.20);
    --fg:        #1a140e;
    --fg-soft:   #5d5346;
    --fg-mute:   #726858;
    --amber:     #a3690f;
    --amber-soft:#f0e0c2;
    --on-amber:  #fffdf8;
    --jade:      #14795c;
    --jade-soft: #d5e9e0;
    --rust:      #b03f30;
    --shadow-sm: 0 1px 2px rgba(26,20,14,0.06), 0 4px 12px rgba(26,20,14,0.06);
    --shadow-md: 0 2px 6px rgba(26,20,14,0.10), 0 12px 28px rgba(26,20,14,0.12);
    --shadow-lg: 0 -4px 40px rgba(26,20,14,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:        #14100d;
      --surface:   #1e1915;
      --surface-2: #2a231d;
      --line:      rgba(247,242,233,0.10);
      --line-firm: rgba(247,242,233,0.20);
      --fg:        #f5efe4;
      --fg-soft:   #b8ab99;
      --fg-mute:   #948877;
      --amber:     #e0a03a;
      --amber-soft:#3a2c15;
      --on-amber:  #1a140e;
      --jade:      #46b491;
      --jade-soft: #14312a;
      --rust:      #e0705e;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg: 0 -4px 40px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:        #14100d;
    --surface:   #1e1915;
    --surface-2: #2a231d;
    --line:      rgba(247,242,233,0.10);
    --line-firm: rgba(247,242,233,0.20);
    --fg:        #f5efe4;
    --fg-soft:   #b8ab99;
    --fg-mute:   #948877;
    --amber:     #e0a03a;
    --amber-soft:#3a2c15;
    --on-amber:  #1a140e;
    --jade:      #46b491;
    --jade-soft: #14312a;
    --rust:      #e0705e;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    --shadow-lg: 0 -4px 40px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- command bar ---------- */
  .cmdbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .wordmark { display:flex; align-items:center; gap:9px; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .wordmark .disc { width:19px; height:19px; flex-shrink:0; }
  /* en pantallas estrechas el disco basta como identidad; el espacio va a los controles */
  @media (max-width: 419px) { .wordmark .wm-text { display: none; } }
  .cmd-actions { display:flex; gap: 7px; }
  .iconbtn {
    display:flex; align-items:center; justify-content:center;
    width: 38px; height: 38px; border-radius: 11px; flex-shrink:0;
    background: var(--surface); border: 1px solid var(--line); color: var(--fg);
    font-size: 16px; cursor: pointer; transition: background .15s, transform .1s;
  }
  .iconbtn:hover { background: var(--surface-2); }
  .iconbtn:active { transform: scale(0.94); }
  .iconbtn.accent { background: var(--amber); border-color: transparent; color: var(--on-amber); }

  .shell { max-width: 1080px; margin: 0 auto; padding: 0 14px; }

  /* ---------- vault state strip ---------- */
  .state-strip { display:grid; grid-template-columns: repeat(3, 1fr); gap: 9px; padding: 16px 0 4px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 13px; cursor: pointer; text-align:left; font-family: inherit; color: inherit;
    transition: border-color .15s, background .15s;
  }
  .stat:hover { background: var(--surface-2); }
  .stat.active { border-color: var(--amber); background: var(--amber-soft); }
  .stat .n { font-family: Georgia, serif; font-size: 25px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat.pending .n { color: var(--amber); }
  .stat.done .n { color: var(--jade); }
  .stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-mute); margin-top: 5px; font-family: ui-monospace, monospace; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: calc(58px + env(safe-area-inset-top)); z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 10px 0 9px; margin-top: 12px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar-row { display:flex; gap: 8px; align-items:center; }
  .searchwrap { position: relative; flex: 1 1 auto; min-width: 0; }
  .searchwrap .mag { position:absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--fg-mute); pointer-events:none; }
  .searchwrap input {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 12px 9px 31px;
  }
  .searchwrap input::placeholder { color: var(--fg-mute); }
  select.ctl {
    font-family: inherit; font-size: 13px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 8px; max-width: 45vw;
  }
  .chiprow { display:flex; gap: 6px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    display:flex; align-items:center; gap:5px; flex-shrink: 0;
    font-family: inherit; font-size: 12.5px; color: var(--fg-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { background: var(--surface-2); }
  .chip.on { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .chip .ct { font-size: 10.5px; opacity: .65; font-variant-numeric: tabular-nums; }

  /* ---------- content ---------- */
  .content { padding: 16px 0 110px; }
  .resultline { font-size: 11.5px; color: var(--fg-mute); font-family: ui-monospace, monospace; margin-bottom: 11px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .linkbtn { background:none; border:none; font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--amber); cursor:pointer; padding:0; text-decoration: underline; text-underline-offset: 2px; }

  .group + .group { margin-top: 22px; }
  .ghead {
    display:flex; align-items:baseline; gap: 9px; margin: 0 0 10px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--fg-soft); font-family: ui-monospace, monospace;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
    position: sticky; top: calc(158px + env(safe-area-inset-top)); z-index: 10;
    background: var(--bg);
  }
  .ghead .gcount { font-size: 10.5px; color: var(--fg-mute); font-weight: 500; }

  .grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .gcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
    overflow: hidden; cursor: pointer; position: relative;
    box-shadow: var(--shadow-sm); transition: transform .12s, box-shadow .15s, border-color .15s;
  }
  .gcard:active { transform: scale(0.975); }
  @media (hover: hover) { .gcard:hover { box-shadow: var(--shadow-md); } }
  .gcard.sel { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber); }
  .gcard .art { position: relative; aspect-ratio: 1; background: var(--surface-2); display:flex; align-items:center; justify-content:center; }
  .gcard .art img { width:100%; height:100%; object-fit: cover; display:block; transition: opacity .2s, filter .2s; }
  .gcard.done .art img { opacity: .5; filter: saturate(.55); }
  .gcard .art .ph { font-size: 30px; opacity: .3; }
  .gcard .gbody { padding: 9px 11px 11px; }
  .gcard .gt { font-size: 13px; font-weight: 650; line-height: 1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gcard .ga { font-size: 11.5px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top: 2px; }
  .gcard .gmeta { display:flex; align-items:center; gap: 5px; margin-top: 7px; min-height: 15px; }

  .statusdot {
    position:absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; cursor: pointer; z-index: 2;
    font-size: 12px; font-weight: 800; line-height: 1;
    background: rgba(20,16,13,0.55); border: 1.5px solid rgba(255,255,255,0.75); color: #fff;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: transform .12s;
  }
  .statusdot:active { transform: scale(0.88); }
  .statusdot.on { background: var(--jade); border-color: var(--jade); }
  /* el círculo se ve de 24px pero se toca en 44px */
  .statusdot::after { content:''; position:absolute; inset:-10px; border-radius: 50%; }
  .typetag {
    position:absolute; top: 8px; right: 8px; z-index: 2;
    font-size: 9.5px; font-family: ui-monospace, monospace; letter-spacing: 0.04em;
    padding: 3px 7px; border-radius: 6px; color: #fff;
    background: rgba(20,16,13,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .stars { font-size: 10.5px; color: var(--amber); letter-spacing: -0.5px; }
  .tagpip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* list view */
  .list { display:flex; flex-direction: column; gap: 7px; }
  .lrow {
    display:flex; align-items:center; gap: 11px; cursor: pointer; position: relative;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 12px 8px 8px; overflow: hidden;
    transition: background .13s, border-color .15s;
  }
  .lrow::before { content:''; position:absolute; left:0; top:0; bottom:0; width: 3px; background: var(--amber); }
  .lrow.done::before { background: var(--jade); }
  .lrow:hover { background: var(--surface-2); }
  .lrow.sel { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  .lrow .lart { width: 46px; height: 46px; border-radius: 8px; flex-shrink:0; overflow:hidden; background: var(--surface-2); display:flex; align-items:center; justify-content:center; margin-left: 4px; }
  .lrow .lart img { width:100%; height:100%; object-fit:cover; }
  .lrow.done .lart img { opacity:.5; filter: saturate(.55); }
  .lrow .linfo { flex: 1; min-width: 0; }
  .lrow .lt { font-size: 14px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .la { font-size: 12px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .lmeta { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .lrow .lyear { font-size: 11px; color: var(--fg-mute); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .lcheck {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink:0; cursor:pointer; position: relative;
    display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 800;
    background: transparent; border: 1.5px solid var(--line-firm); color: transparent;
  }
  .lcheck::after { content:''; position:absolute; inset:-9px; border-radius: 50%; }
  .lcheck.on { background: var(--jade); border-color: var(--jade); color: #fff; }

  /* ---------- empty ---------- */
  .empty { text-align:center; padding: 64px 22px; }
  .empty .ico { font-size: 34px; opacity: .4; margin-bottom: 14px; }
  .empty h2 { font-size: 16.5px; margin: 0 0 6px; font-weight: 650; }
  .empty p { font-size: 13.5px; color: var(--fg-mute); margin: 0 auto; max-width: 34ch; line-height: 1.5; }
  .empty .acts { display:flex; gap: 9px; justify-content:center; margin-top: 18px; flex-wrap: wrap; }

  /* ---------- buttons ---------- */
  .btn {
    font-family: inherit; font-size: 14px; font-weight: 550; text-align:center; text-decoration:none;
    padding: 11px 16px; border-radius: 12px; cursor:pointer; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); display:inline-flex; align-items:center; justify-content:center; gap: 7px;
    transition: transform .1s, background .15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--amber); color: var(--on-amber); border-color: transparent; font-weight: 650; }
  .btn.jade { background: var(--jade); color: #fff; border-color: transparent; font-weight: 650; }
  .btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 45%, transparent); background: transparent; }
  .btn.vermas { display: block; width: 100%; margin: 18px 0 4px; padding: 14px; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btnrow { display:flex; gap: 9px; margin-top: 12px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 35;
    height: 54px; padding: 0 20px; border-radius: 27px; border:none; cursor:pointer;
    background: var(--amber); color: var(--on-amber);
    font-family: inherit; font-size: 15px; font-weight: 650;
    display:flex; align-items:center; gap: 8px;
    box-shadow: 0 6px 20px color-mix(in srgb, var(--amber) 45%, transparent);
    transition: transform .12s;
  }
  .fab:active { transform: scale(0.94); }

  /* ---------- selection action bar ---------- */
  .selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); box-shadow: var(--shadow-lg);
    display:flex; align-items:center; gap: 8px;
  }
  .selbar .cnt { font-size: 13px; font-weight: 650; margin-right: auto; font-variant-numeric: tabular-nums; }
  .selbar .btn { padding: 9px 13px; font-size: 13px; }

  /* ---------- sheets / modals ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(10,7,5,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { transform: translateY(18px); opacity: .6 } to { transform: none; opacity: 1 } }
  @media (min-width: 640px) { .overlay { align-items:center; } }
  .sheet {
    background: var(--bg); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 18px calc(26px + env(safe-area-inset-bottom));
    border: 1px solid var(--line); border-bottom: none;
    animation: rise .2s cubic-bezier(.2,.8,.3,1);
  }
  @media (min-width: 640px) { .sheet { border-radius: 20px; max-height: 86vh; border-bottom: 1px solid var(--line); } }
  .sheethead { display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-bottom: 14px; }
  .sheethead h2 { font-size: 17px; margin:0; font-weight: 680; }
  .lede { font-size: 13px; color: var(--fg-mute); margin: 0 0 13px; line-height: 1.5; }
  .lede a { color: var(--amber); }
  .flabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-mute); font-family: ui-monospace, monospace; margin: 18px 0 7px; }
  .flabel:first-child { margin-top: 0; }

  .field {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px;
  }
  textarea.field { min-height: 76px; resize: vertical; line-height: 1.5; }
  textarea.field.tall { min-height: 150px; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .field.mono { font-family: ui-monospace, monospace; font-size: 12.5px; }

  .segrow { display:flex; gap: 6px; margin-bottom: 13px; }
  .seg {
    flex: 1; font-family: inherit; font-size: 13px; color: var(--fg-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; cursor:pointer;
    transition: background .15s, color .15s;
  }
  .seg.on { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }

  /* search results */
  .rrow { display:flex; gap: 11px; align-items:center; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .rrow:last-child { border-bottom: none; }
  .rrow .rart { width: 48px; height: 48px; border-radius: 8px; background: var(--surface-2); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size: 17px; }
  .rrow .rart img { width:100%; height:100%; object-fit:cover; }
  .rrow .rinfo { flex:1; min-width:0; }
  .rrow .rt { font-size: 13.5px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .ra { font-size: 12px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .addbtn {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0; cursor:pointer;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--fg);
    font-size: 17px; font-weight: 500; display:flex; align-items:center; justify-content:center;
    transition: transform .1s;
  }
  .addbtn:active { transform: scale(0.9); }
  .addbtn.done { background: var(--jade); color: #fff; border-color: transparent; }
  .skel { height: 66px; border-radius: 10px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sweep 1.2s infinite; margin-bottom: 7px; }
  @keyframes sweep { from { background-position: 200% 0 } to { background-position: -200% 0 } }

  /* detail */
  .dart { width: 100%; aspect-ratio: 1; border-radius: 16px; overflow:hidden; background: var(--surface-2); box-shadow: var(--shadow-md); display:flex; align-items:center; justify-content:center; font-size: 44px; }
  .dart img { width:100%; height:100%; object-fit:cover; }
  .dwrap { display:grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 460px) { .dwrap { grid-template-columns: 168px 1fr; align-items: start; } }
  .dtitle { font-size: 20px; font-weight: 700; line-height: 1.2; margin: 0 0 3px; text-wrap: balance; }
  .dartist { font-size: 14.5px; color: var(--fg-soft); margin: 0; }
  .dfacts { display:flex; flex-wrap:wrap; gap:6px; margin-top: 10px; }
  .fact { font-size: 11px; font-family: ui-monospace, monospace; color: var(--fg-mute); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; }
  /* gap 0 a propósito: el espaciado lo da el padding, que además crea la zona táctil de 44px */
  .starpick { display:flex; gap: 0; margin-left: -6px; }
  .starpick button { background:none; border:none; font-size: 27px; line-height: 1; cursor:pointer; color: var(--line-firm); padding: 9px 6px; transition: transform .1s, color .12s; }
  .starpick button.on { color: var(--amber); }

<script>
'use strict';

/* ============ storage ============ */
const K_ITEMS = 'musicvault_items_v1';
const K_TAGS  = 'musicvault_tags_v1';
const K_CREDS = 'musicvault_spotify_creds_v1';
const K_PREFS = 'musicvault_prefs_v1';
const K_THEME = 'musicvaultTheme';
const K_GH    = 'musicvault_github_v1';   // token + repo de sincronización
const K_TOMB  = 'musicvault_tomb_v1';     // borrados pendientes de propagar
const K_META  = 'musicvault_meta_v1';     // marca de tiempo del vault local

const read = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch { return fb; } };
const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* El vault vive en IndexedDB: localStorage se queda en ~5 MB (y cuenta UTF-16),
   que con miles de álbumes se agota enseguida. Ajustes/tema/credenciales siguen
   en localStorage porque son cuatro claves y conviene leerlas de forma síncrona. */
const DB_NAME = 'musicvault', DB_STORE = 'kv';
let _db = null, _sinIDB = false;

function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    if (!self.indexedDB) return rej(new Error('sin indexedDB'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE);
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
const idbGet = k => idb().then(db => new Promise((res, rej) => {
  const q = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
}));
const idbSet = (k, v) => idb().then(db => new Promise((res, rej) => {
  const t = db.transaction(DB_STORE, 'readwrite');
  t.objectStore(DB_STORE).put(v, k);
  t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
}));

let ITEMS = [];
let TAGS  = [];
let PREFS = Object.assign({ sort: 'added_desc', view: 'grid', type: 'all', status: 'all', tag: 'all', covers: false }, read(K_PREFS, {}));

/* Al borrar algo hay que dejar constancia: si no, el otro dispositivo lo
   vuelve a subir en la siguiente sincronización y el borrado "revive". */
let TOMB = read(K_TOMB, []);
let META = Object.assign({ updatedAt: 0 }, read(K_META, {}));
const saveTomb = () => write(K_TOMB, TOMB.slice(-4000));
const saveMeta = () => write(K_META, META);
function tombstone(items) {
  const at = Date.now();
  items.forEach(it => { if (it && it.spotifyId) TOMB.push({ sid: it.spotifyId, at }); });
  saveTomb();
}
function untombstone(items) {   // al deshacer un borrado
  const sids = new Set(items.map(i => i && i.spotifyId).filter(Boolean));
  TOMB = TOMB.filter(t => !sids.has(t.sid));
  saveTomb();
}

/* Escrituras agrupadas: al importar miles de elementos no queremos una
   transacción por cada uno. */
let _pend = null;
function _flush(k, get) {
  if (_sinIDB) { try { write(k, get()); } catch (e) { toast('No cabe en el almacenamiento del navegador'); } return; }
  idbSet(k, get()).catch(() => toast('No se ha podido guardar'));
}
function saveItems() {
  META.updatedAt = Date.now(); saveMeta();
  clearTimeout(_pend);
  _pend = setTimeout(() => _flush(K_ITEMS, () => ITEMS), 120);
  programarSync();
}
const saveTags  = () => _flush(K_TAGS, () => TAGS);
const savePrefs = () => write(K_PREFS, PREFS);
const loadCreds = () => read(K_CREDS, null);

/* Carga inicial + migración desde localStorage la primera vez. */
async function bootStorage() {
  try {
    const [i, t] = await Promise.all([idbGet(K_ITEMS), idbGet(K_TAGS)]);
    if (Array.isArray(i)) ITEMS = i;
    if (Array.isArray(t)) TAGS = t;
    if (!Array.isArray(i)) {
      const li = read(K_ITEMS, []), lt = read(K_TAGS, []);
      if (li.length || lt.length) {
        ITEMS = li; TAGS = lt;
        await idbSet(K_ITEMS, ITEMS); await idbSet(K_TAGS, TAGS);
      }
    }
  } catch {
    _sinIDB = true;
    ITEMS = read(K_ITEMS, []);
    TAGS  = read(K_TAGS, []);
  }
}

/* ============ helpers ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const TYPE_LABEL = { album: 'Álbum', track: 'Canción', artist: 'Artista' };
const TYPE_PLURAL = { album: 'Álbumes', track: 'Canciones', artist: 'Artistas' };
const TYPE_ICON  = { album: '💿', track: '🎵', artist: '🎤' };
const TAG_COLORS = ['#2a78d6','#1baf7a','#eda100','#3f9c35','#7a5cd6','#e34948','#e87ba4','#eb6834'];
const artistsOf = it => (it.artists || []).join(', ');
/* Con las carátulas desactivadas el vault se lee como una lista, no como una
   pared de discos. Es una preferencia, no un borrado: se vuelve a activar en Ajustes. */
const verPortada = () => PREFS.covers !== false;
const portada = (url, icono, lazy) =>
  (verPortada() && url) ? `<img src="${esc(url)}" ${lazy ? 'loading="lazy" ' : ''}alt="">` : icono;
// Buscar "camaron" tiene que encontrar "Camarón".
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const yearOf = it => (it.releaseDate ? parseInt(String(it.releaseDate).slice(0, 4), 10) : 0) || 0;
// Para ordenar como una discoteca de verdad: "The Beatles" va por la B.
const sortKey = s => String(s || '').toLowerCase().replace(/^(the|los|las|el|la|a|an)\s+/, '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
const cmp = (a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' });
const tagById = id => TAGS.find(t => t.id === id);

/* ============ theme ============ */
(() => {
  const root = document.documentElement;
  const saved = localStorage.getItem(K_THEME);
  if (saved) root.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem(K_THEME, next);
  });
})();

/* ============ toasts ============ */
function toast(msg, actionLabel, actionFn, ms = 5000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tmsg">${esc(msg)}</span>`;
  if (actionLabel) {
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.addEventListener('click', () => { actionFn(); el.remove(); });
    el.appendChild(b);
  }
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ============ spotify ============ */
let tok = { v: null, exp: 0 };

async function spotifyToken() {
  const c = loadCreds();
  if (!c || !c.clientId || !c.clientSecret) throw new Error('NO_CREDS');
  if (tok.v && tok.exp > Date.now()) return tok.v;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': 'Basic ' + btoa(c.clientId + ':' + c.clientSecret) },
    body: 'grant_type=client_credentials'
  });
  if (!res.ok) throw new Error('AUTH_FAILED');
  const d = await res.json();
  tok = { v: d.access_token, exp: Date.now() + (d.expires_in - 60) * 1000 };
  return tok.v;
}

async function spotifySearch(q, type) {
  const t = await spotifyToken();
  const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=${type}&limit=20`, { headers: { Authorization: 'Bearer ' + t } });
  if (!res.ok) throw new Error('SEARCH_FAILED:' + res.status);
  return res.json();
}

async function spotifyLookup(type, id) {
  const t = await spotifyToken();
  const res = await fetch(`https://api.spotify.com/v1/${type}s/${id}`, { headers: { Authorization: 'Bearer ' + t } });
  if (!res.ok) throw new Error('LOOKUP_FAILED:' + res.status);
  return res.json();
}

const URL_ONE = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(album|track|artist)\/([a-zA-Z0-9]+)/i;
const URL_ALL = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(album|track|artist)\/([a-zA-Z0-9]+)/gi;
const URL_PLAYLIST = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?playlist\/([a-zA-Z0-9]+)/gi;

/* Trae hasta 500 canciones de una playlist pública, paginando de 100 en 100. */
async function fetchPlaylist(id, onProgress) {
  const t = await spotifyToken();
  const fields = 'items(track(id,name,external_urls,artists(name),duration_ms,album(id,name,images,release_date,external_urls,artists(name),total_tracks))),total';
  let out = [], offset = 0, total = null;
  while (offset < 500) {
    const res = await fetch(`https://api.spotify.com/v1/playlists/${id}/tracks?limit=100&offset=${offset}&fields=${encodeURIComponent(fields)}`, { headers: { Authorization: 'Bearer ' + t } });
    if (!res.ok) throw new Error('PLAYLIST_FAILED:' + res.status);
    const d = await res.json();
    if (total === null) total = d.total;
    const batch = (d.items || []).map(i => i && i.track).filter(x => x && x.id);
    out = out.concat(batch);
    onProgress?.(out.length, Math.min(total, 500));
    offset += 100;
    if (offset >= total || !batch.length) break;
  }
  return out;
}

/* Captura todos los metadatos que venga trayendo el objeto de Spotify.
   Los endpoints de búsqueda devuelven objetos simplificados; "Actualizar desde
   Spotify" en la ficha vuelve a pedir el objeto completo (sello, popularidad, géneros…). */
function normalize(raw, type) {
  const base = {
    spotifyId: raw.id, type, title: raw.name,
    coverUrl: null, spotifyUrl: raw.external_urls?.spotify || '', releaseDate: null,
    albumName: null, albumId: null, durationMs: null, totalTracks: null, label: null,
    popularity: typeof raw.popularity === 'number' ? raw.popularity : null,
    genres: raw.genres?.length ? raw.genres : null,
    followers: raw.followers?.total ?? null,
    explicit: null, trackNumber: null, discNumber: null, albumType: null, isrc: null
  };

  if (type === 'album') return Object.assign(base, {
    artists: (raw.artists || []).map(a => a.name),
    coverUrl: raw.images?.[0]?.url || null,
    releaseDate: raw.release_date || null,
    totalTracks: raw.total_tracks ?? null,
    label: raw.label || null,
    albumType: raw.album_type || null
  });

  if (type === 'track') return Object.assign(base, {
    artists: (raw.artists || []).map(a => a.name),
    coverUrl: raw.album?.images?.[0]?.url || null,
    releaseDate: raw.album?.release_date || null,
    albumName: raw.album?.name || null,
    albumId: raw.album?.id || null,
    albumType: raw.album?.album_type || null,
    totalTracks: raw.album?.total_tracks ?? null,
    durationMs: raw.duration_ms ?? null,
    explicit: typeof raw.explicit === 'boolean' ? raw.explicit : null,
    trackNumber: raw.track_number ?? null,
    discNumber: raw.disc_number ?? null,
    isrc: raw.external_ids?.isrc || null
  });

  return Object.assign(base, {
    artists: [raw.name],
    coverUrl: raw.images?.[0]?.url || null
  });
}

function makeItem(r) {
  return Object.assign({}, r, {
    id: uid(), dateAdded: Date.now(), notes: '', rating: 0, tagIds: [], listened: false
  });
}

/* ---- formateo de metadatos ---- */
const fmtDur = ms => ms ? Math.floor(ms / 60000) + ':' + String(Math.round(ms % 60000 / 1000)).padStart(2, '0') : null;
function fmtDate(d) {
  if (!d) return null;
  const p = String(d).split('-');
  if (p.length === 1) return p[0];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return p.length === 2 ? `${meses[+p[1] - 1]} ${p[0]}` : `${+p[2]} ${meses[+p[1] - 1]} ${p[0]}`;
}
const ALBUM_TYPE_ES = { album: 'Álbum', single: 'Single', compilation: 'Recopilatorio' };

/* Lista completa de metadatos de una ficha, en pares etiqueta/valor. */
function metaPairs(it) {
  const p = [];
  const add = (k, v) => { if (v !== null && v !== undefined && v !== '') p.push([k, v]); };
  add('Tipo', TYPE_LABEL[it.type]);
  add('Artista', artistsOf(it));
  if (it.type === 'track') add('Álbum', it.albumName);
  add(it.type === 'track' ? 'Lanzamiento del álbum' : 'Lanzamiento', fmtDate(it.releaseDate));
  if (it.type !== 'artist' && yearOf(it)) add('Año', yearOf(it));
  add('Formato', ALBUM_TYPE_ES[it.albumType] || it.albumType);
  add('Duración', fmtDur(it.durationMs));
  add('Nº de pista', it.trackNumber ? (it.totalTracks ? `${it.trackNumber} de ${it.totalTracks}` : it.trackNumber) : null);
  if (it.type === 'album') add('Pistas', it.totalTracks);
  add('Disco', it.discNumber && it.discNumber > 1 ? it.discNumber : null);
  add('Explícito', it.explicit === true ? 'Sí' : it.explicit === false ? 'No' : null);
  add('Sello', it.label);
  add('Géneros', it.genres?.length ? it.genres.join(', ') : null);
  add('Oyentes (seguidores)', it.followers ? it.followers.toLocaleString('es-ES') : null);
  add('Popularidad en Spotify', it.popularity !== null && it.popularity !== undefined ? `${it.popularity}/100` : null);
  add('ISRC', it.isrc);
  add('Guardado', `${new Date(it.dateAdded).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })} (${relDate(it.dateAdded)})`);
  add('ID de Spotify', it.spotifyId);
  return p;
}

/* ============ filtering & sorting ============ */
function filtered() {
  const q = fold(document.getElementById('q').value.trim());
  let out = ITEMS.filter(it => {
    if (PREFS.type !== 'all' && it.type !== PREFS.type) return false;
    if (PREFS.status === 'pending' && it.listened) return false;
    if (PREFS.status === 'listened' && !it.listened) return false;
    if (PREFS.tag !== 'all' && !(it.tagIds || []).includes(PREFS.tag)) return false;
    if (q && !fold(it.title + ' ' + artistsOf(it) + ' ' + (it.notes || '')).includes(q)) return false;
    return true;
  });
  const s = PREFS.sort;
  out.sort((a, b) => {
    switch (s) {
      case 'title_asc':   return cmp(sortKey(a.title), sortKey(b.title));
      case 'title_desc':  return cmp(sortKey(b.title), sortKey(a.title));
      case 'artist_asc':  return cmp(sortKey(artistsOf(a)), sortKey(artistsOf(b))) || cmp(sortKey(a.title), sortKey(b.title));
      case 'artist_desc': return cmp(sortKey(artistsOf(b)), sortKey(artistsOf(a))) || cmp(sortKey(a.title), sortKey(b.title));
      case 'rating_desc': return (b.rating || 0) - (a.rating || 0) || cmp(sortKey(a.title), sortKey(b.title));
      case 'year_desc':   return yearOf(b) - yearOf(a);
      case 'year_asc':    return yearOf(a) - yearOf(b);
      case 'added_asc':   return a.dateAdded - b.dateAdded;
      default:            return b.dateAdded - a.dateAdded;
    }
  });
  return out;
}

/* Tanda visible. Se reinicia sola cuando cambian filtros, orden o búsqueda:
   así no hay que acordarse de resetearla en cada sitio que llama a render(). */
const TANDA = 120;
let VISTAS = TANDA, _firma = null;

function render() {
  const firma = [PREFS.type, PREFS.status, PREFS.tag, PREFS.sort,
                 document.getElementById('q').value.trim()].join('');
  if (firma !== _firma) { _firma = firma; VISTAS = TANDA; }

  renderStats();
  renderChips();
  renderSelBar();
  document.getElementById('sortSel').value = PREFS.sort;
  document.getElementById('viewBtn').textContent = PREFS.view === 'grid' ? '▦' : '☰';

  const box = document.getElementById('results');
  const line = document.getElementById('resultline');

  if (ITEMS.length === 0) {
    line.innerHTML = '';
    box.innerHTML = `<div class="empty">
      <div class="ico">🗄️</div>
      <h2>Tu vault está vacío</h2>
      <p>Guarda álbumes, canciones y artistas de Spotify para no perderlos de vista. Nada se reproduce aquí: esto es tu lista de lo que quieres escuchar.</p>
      <div class="acts">
        <button class="btn primary" data-open="search">Buscar en Spotify</button>
        <button class="btn" data-open="bulk">Pegar enlaces</button>
      </div>
    </div>`;
    return;
  }

  const rows = filtered();
  const anyFilter = PREFS.type !== 'all' || PREFS.status !== 'all' || PREFS.tag !== 'all' || document.getElementById('q').value.trim();
  line.innerHTML = `<span>${rows.length} de ${ITEMS.length}</span>${anyFilter ? `<button class="linkbtn" data-clear="1">Quitar filtros</button>` : ''}`;

  if (rows.length === 0) {
    box.innerHTML = `<div class="empty">
      <div class="ico">🔍</div>
      <h2>Nada coincide</h2>
      <p>Prueba a quitar algún filtro o a buscar otra cosa.</p>
      <div class="acts"><button class="btn" data-clear="1">Quitar filtros</button></div>
    </div>`;
    return;
  }

  /* Con un vault de miles de elementos, pintarlos todos de golpe bloquea el
     móvil varios segundos. Dibujamos por tandas. */
  const visibles = rows.slice(0, VISTAS);
  const restan = rows.length - visibles.length;
  const groups = groupsFor(visibles);
  const draw = list => PREFS.view === 'grid'
    ? `<div class="grid">${list.map(gcard).join('')}</div>`
    : `<div class="list">${list.map(lrow).join('')}</div>`;

  box.innerHTML = (groups
    ? groups.map(g => `<section class="group"><h3 class="ghead">${esc(g.key)}<span class="gcount">${g.items.length}</span></h3>${draw(g.items)}</section>`).join('')
    : draw(visibles))
    + (restan > 0
      ? `<button class="btn vermas" data-more="1">Ver más — quedan ${restan.toLocaleString('es-ES')}</button>`
      : '');
}

/* Agrupa solo cuando el orden lo hace significativo: por artista, por inicial o por década. */
function groupsFor(rows) {
  const s = PREFS.sort;
  let keyOf = null;
  if (s.startsWith('artist')) keyOf = it => artistsOf(it) || 'Sin artista';
  else if (s.startsWith('title')) keyOf = it => { const c = (sortKey(it.title)[0] || '#').toUpperCase(); return /\p{L}/u.test(c) ? c : '#'; };
  else if (s.startsWith('year')) keyOf = it => { const y = yearOf(it); return y ? Math.floor(y / 10) * 10 + 's' : 'Sin año'; };
  if (!keyOf) return null;

  const out = [];
  let cur = null;
  for (const it of rows) {
    const k = keyOf(it);
    if (!cur || cur.key !== k) { cur = { key: k, items: [] }; out.push(cur); }
    cur.items.push(it);
  }
  return out;
}

/* ============ item actions ============ */
function toggleListened(id) {
  const it = ITEMS.find(i => i.id === id);
  if (!it) return;
  it.listened = !it.listened;
  saveItems();
  render();
}

function deleteItems(ids) {
  const removed = ITEMS.filter(i => ids.includes(i.id));
  ITEMS = ITEMS.filter(i => !ids.includes(i.id));
  tombstone(removed);
  saveItems();
  render();
  toast(`${removed.length} eliminado${removed.length === 1 ? '' : 's'}`, 'Deshacer', () => {
    ITEMS = ITEMS.concat(removed);
    untombstone(removed);
    saveItems();
    render();
  });
}

function openSearch() {

  `);

    runSearch();

async function runSearch() {
  const q = document.getElementById('sq').value.trim();
  const box = document.getElementById('sres');
  if (!q) { box.innerHTML = ''; return; }
  const c = loadCreds();
  if (!c || !c.clientId || !c.clientSecret) {
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>Necesitas conectar tu cuenta de Spotify Developer para buscar.</p><div class="acts"><button class="btn primary" data-open="settings">Ir a Ajustes</button></div></div>`;
    return;
  }
  box.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  const m = q.match(URL_ONE);
  try {
    if (m) {
      lastResults = [normalize(await spotifyLookup(m[1], m[2]), m[1])];
    } else {
      const d = await spotifySearch(q, searchType);
      lastResults = (d[searchType + 's']?.items || []).map(r => normalize(r, searchType));
    }
    if (!lastResults.length) { box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>Sin resultados para “${esc(q)}”.</p></div>`; return; }
    box.innerHTML = lastResults.map(rrow).join('');
  } catch (err) {
    const msg = err.message || '';
    let text = 'No se pudo conectar con Spotify. Revisa tu conexión.';
    if (msg === 'AUTH_FAILED' || msg === 'NO_CREDS') text = 'Tus credenciales no son válidas. Revísalas en Ajustes.';
    else if (msg.startsWith('LOOKUP_FAILED')) text = `Ese enlace no existe o es privado (error ${msg.split(':')[1]}).`;
    else if (msg.startsWith('SEARCH_FAILED')) text = `Spotify devolvió un error ${msg.split(':')[1]}.`;
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>${esc(text)}</p></div>`;
  }
}

function rrow(r, i) {
  const saved = ITEMS.some(x => x.spotifyId === r.spotifyId);
  return `<div class="rrow">

async function runBulk() {
  const out = document.getElementById('bulkOut');
  const go = document.getElementById('bulkGo');
  const c = loadCreds();
  if (!c || !c.clientId || !c.clientSecret) {
    out.innerHTML = 'Conecta tu cuenta de Spotify en Ajustes antes de añadir.';
    return;
  }
  const text = document.getElementById('bulkIn').value;

  const playlists = [];
  let m; URL_PLAYLIST.lastIndex = 0;
  while ((m = URL_PLAYLIST.exec(text)) !== null) if (!playlists.includes(m[1])) playlists.push(m[1]);

  const singles = new Map();
  URL_ALL.lastIndex = 0;
  while ((m = URL_ALL.exec(text)) !== null) singles.set(m[2], m[1]);

  if (!playlists.length && !singles.size) { out.innerHTML = 'No he encontrado ningún enlace de Spotify en ese texto.'; return; }

  go.disabled = true;
  let added = 0, dup = 0, fail = 0;
  const notes = [];

  // 1) playlists
  for (const pid of playlists) {
    try {
      const tracks = await fetchPlaylist(pid, (got, tot) => { out.innerHTML = `Leyendo playlist… ${got} de ${tot} canciones`; });
      const wanted = new Map();
      for (const t of tracks) {
        if (playlistMode === 'albums') {
          if (t.album?.id) wanted.set(t.album.id, normalize(t.album, 'album'));
        } else {
          wanted.set(t.id, normalize(t, 'track'));
        }
      }
      let i = 0;
      for (const [sid, r] of wanted) {
        i++;
        if (i % 10 === 0) out.innerHTML = `Guardando ${i} de ${wanted.size}… <strong>${added}</strong> añadidos`;
        if (ITEMS.some(x => x.spotifyId === sid)) { dup++; continue; }
        ITEMS.push(makeItem(r)); added++;
      }
      notes.push(`Playlist: ${wanted.size} ${playlistMode === 'albums' ? 'álbumes' : 'canciones'} encontrad${playlistMode === 'albums' ? 'os' : 'as'}`);
    } catch (err) {
      const code = (err.message || '').split(':')[1];
      notes.push(code === '404'
        ? 'Una playlist no es accesible (privada, o de las que genera Spotify — solo funcionan las públicas de usuario).'
        : `Una playlist falló (error ${code || '?'}).`);
      fail++;
    }
  }

  // 2) enlaces sueltos, por lotes (20 álbumes / 50 canciones o artistas por llamada)
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));
  const porTipo = { album: [], track: [], artist: [] };
  for (const [id, type] of singles) {
    if (yaTengo.has(id)) { dup++; continue; }
    if (porTipo[type]) porTipo[type].push(id);
  }
  const pendientes = porTipo.album.length + porTipo.track.length + porTipo.artist.length;
  let hechos = 0;

  for (const tipo of ['album', 'track', 'artist']) {
    const ids = porTipo[tipo];
    for (let i = 0; i < ids.length; i += LOTE[tipo]) {
      const trozo = ids.slice(i, i + LOTE[tipo]);
      let res;
      try {
        const t = await spotifyToken();
        res = await fetch(`https://api.spotify.com/v1/${tipo}s?ids=${trozo.join(',')}`,
                          { headers: { Authorization: 'Bearer ' + t } });
      } catch { fail += trozo.length; hechos += trozo.length; continue; }
      if (res.status === 429) {                       // límite de peticiones: esperar y repetir
        const esperar = (+res.headers.get('Retry-After') || 2);
        out.innerHTML = `Spotify pide una pausa de ${esperar}s… <strong>${added}</strong> añadidos de ${pendientes}`;
        await new Promise(r => setTimeout(r, esperar * 1000));
        i -= LOTE[tipo];
        continue;
      }
      if (!res.ok) { fail += trozo.length; hechos += trozo.length; continue; }
      const datos = await res.json().catch(() => null);
      (datos && datos[tipo + 's'] || []).forEach(raw => {
        if (!raw || !raw.id || yaTengo.has(raw.id)) { if (!raw) fail++; return; }
        ITEMS.push(makeItem(normalize(raw, tipo)));
        yaTengo.add(raw.id);
        added++;
      });
      hechos += trozo.length;
      out.innerHTML = `Procesando ${Math.min(hechos, pendientes)} de ${pendientes}… <strong>${added}</strong> añadidos`;
      if (added && added % 500 < LOTE[tipo]) { saveItems(); }   // guardado parcial por si acaso
    }
  }

  saveItems(); render();
  const bits = [`<strong>${added}</strong> añadidos`];
  if (dup) bits.push(`${dup} ya estaban`);
  if (fail) bits.push(`${fail} fallaron`);
  out.innerHTML = bits.join(' · ') + (notes.length ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">${notes.map(esc).join('<br>')}</span>` : '');
  go.disabled = false;
  if (added) toast(`${added} añadido${added === 1 ? '' : 's'} al vault`);
}

  document.getElementById('dEdit')?.addEventListener('click', () => {
    document.getElementById('dMeta').innerHTML = metaFormHtml(it);
    document.getElementById('mCancel').addEventListener('click', () => { document.getElementById('dMeta').innerHTML = metaTableHtml(it); wireMeta(it, id); });
    document.getElementById('mSave').addEventListener('click', () => {
      document.querySelectorAll('.metaform [data-f]').forEach(inp => {
        const f = inp.dataset.f, v = inp.value.trim();
        if (f === 'artistsStr') it.artists = v ? v.split(',').map(s => s.trim()).filter(Boolean) : [];
        else if (f === 'genresStr') it.genres = v ? v.split(',').map(s => s.trim()).filter(Boolean) : null;
        else it[f] = v || null;
      });
      it.editedByUser = true;
      saveItems(); render(); openDetail(id);
      toast('Metadatos actualizados');
    });
  });

  document.getElementById('dRefresh')?.addEventListener('click', async () => {
    const btn = document.getElementById('dRefresh');
    const c = loadCreds();
    if (!c?.clientId) { toast('Conecta Spotify en Ajustes primero'); return; }
    if (it.editedByUser && !confirm('Editaste estos datos a mano. Actualizar desde Spotify los sobrescribirá. ¿Continuar?')) return;
    btn.textContent = 'Actualizando…';
    try {
      const fresh = normalize(await spotifyLookup(it.type, it.spotifyId), it.type);
      // conservo lo que es tuyo: notas, valoración, etiquetas, estado y fecha de guardado
      Object.assign(it, fresh, {

        tagIds: it.tagIds, listened: it.listened, editedByUser: false
      });

    const res = await fetch(`https://api.spotify.com/v1/artists/${artist.spotifyId}/albums?include_groups=album,single&limit=50&market=ES`, { headers: { Authorization: 'Bearer ' + t } });
    if (!res.ok) throw new Error('DISCO_FAILED:' + res.status);

/* ---- settings ---- */
let swatch = TAG_COLORS[0];

/* ============ sincronización vía GitHub ============
   El vault se guarda como un JSON en tu repo. Cada dispositivo se baja el
   remoto, lo funde con lo suyo y vuelve a subir el resultado.
   Reglas de la fusión:
     · unión por spotifyId — nadie pierde lo que ha añadido
     · si el mismo elemento está en los dos, gana el del documento más reciente
     · un borrado deja una "tumba" con su hora: si la tumba es posterior a la
       última edición del elemento, el borrado manda y no revive. */
const GH_PATH = 'musicvault-sync.json';
let _syncEstado = { at: 0, msg: '', err: false };
let _syncTimer = null, _syncCorriendo = false;

const ghCfg = () => { const g = read(K_GH, null); return (g && g.token && g.repo) ? g : null; };

function syncEstadoTexto() {
  if (!ghCfg()) return 'Ahora mismo este dispositivo guarda solo en local.';
  if (!_syncEstado.at) return 'Sin sincronizar todavía en esta sesión.';
  return _syncEstado.msg;
}

const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));

async function ghFetch(url, opts) {
  const g = ghCfg();
  return fetch(url, Object.assign({}, opts, {
    headers: Object.assign({
      Authorization: 'Bearer ' + g.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, (opts && opts.headers) || {})
  }));
}

function fundir(remoto) {
  const tombLocal = TOMB.slice();
  (remoto.tombstones || []).forEach(t => { if (t && t.sid) tombLocal.push(t); });
  const ultimaTumba = new Map();
  tombLocal.forEach(t => {
    if (!ultimaTumba.has(t.sid) || t.at > ultimaTumba.get(t.sid)) ultimaTumba.set(t.sid, t.at);
  });

  const remotoGana = (remoto.updatedAt || 0) > (META.updatedAt || 0);
  const porId = new Map();
  const meter = (arr, prioritario) => (arr || []).forEach(it => {
    if (!it || !it.spotifyId) return;
    if (!porId.has(it.spotifyId) || prioritario) porId.set(it.spotifyId, it);
  });
  meter(remotoGana ? ITEMS : remoto.items, false);
  meter(remotoGana ? remoto.items : ITEMS, true);

  const vivos = [];
  porId.forEach((it, sid) => {
    const muerto = ultimaTumba.get(sid);
    // el elemento sobrevive si se guardó después de que lo borraran
    if (muerto && !(it.dateAdded && it.dateAdded > muerto)) return;
    vivos.push(it);
  });

  const nombres = new Set(TAGS.map(t => t.name.toLowerCase()));
  (remoto.tags || []).forEach(t => {
    if (t && t.name && !nombres.has(t.name.toLowerCase())) { TAGS.push(t); nombres.add(t.name.toLowerCase()); }
  });

  const cambia = vivos.length !== ITEMS.length;
  ITEMS = vivos;
  TOMB = tombLocal.slice(-4000);
  saveTomb();
  return cambia;
}

async function sincronizar(manual) {
  const g = ghCfg();
  if (!g) return 'Ahora mismo este dispositivo guarda solo en local.';
  if (_syncCorriendo) return 'Ya hay una sincronización en marcha.';
  _syncCorriendo = true;
  const api = `https://api.github.com/repos/${g.repo}/contents/${GH_PATH}`;
  try {
    // 1) bajar el remoto
    let sha = null, remoto = null;
    const res = await ghFetch(api + '?ref=main&t=' + Date.now());
    if (res.status === 401 || res.status === 403) throw new Error('El token no tiene permiso sobre ese repo.');
    if (res.status === 404 && !res.headers.get('x-ratelimit-remaining')) throw new Error('No encuentro ese repo. Revisa usuario/repo.');
    if (res.ok) {
      const d = await res.json();
      sha = d.sha;
      try { remoto = JSON.parse(b64dec(d.content.replace(/\n/g, ''))); } catch { remoto = null; }
    } else if (res.status !== 404) {
      throw new Error('GitHub respondió ' + res.status + '.');
    }

    // 2) fundir
    const antes = ITEMS.length;
    if (remoto && Array.isArray(remoto.items)) {
      fundir(remoto);
      _flush(K_ITEMS, () => ITEMS); saveTags();
    }
    const traidos = ITEMS.length - antes;

    // 3) subir el resultado
    const cuerpo = JSON.stringify({
      app: 'MusicVault', version: 2, updatedAt: Date.now(),
      items: ITEMS, tags: TAGS, tombstones: TOMB
    });
    const put = await ghFetch(api, {
      method: 'PUT',
      body: JSON.stringify({
        message: `vault: ${ITEMS.length} elementos`,
        content: b64enc(cuerpo), branch: 'main',
        sha: sha || undefined
      })
    });
    if (put.status === 409) throw new Error('Otro dispositivo estaba escribiendo. Prueba otra vez.');
    if (!put.ok) throw new Error('No he podido subirlo (' + put.status + ').');

    META.updatedAt = Date.now(); saveMeta();
    if (traidos) render();
    const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    _syncEstado = { at: Date.now(), err: false,
      msg: `Sincronizado a las ${hora} · ${ITEMS.length.toLocaleString('es-ES')} elementos` +
           (traidos > 0 ? ` · ${traidos.toLocaleString('es-ES')} traídos del otro dispositivo` : '') };
    if (manual) toast(traidos > 0 ? `${traidos} traídos del otro dispositivo` : 'Sincronizado');
    return _syncEstado.msg;
  } catch (e) {
    _syncEstado = { at: Date.now(), err: true, msg: 'Error: ' + (e && e.message ? e.message : 'de red') };
    if (manual) toast(_syncEstado.msg);
    return _syncEstado.msg;
  } finally {
    _syncCorriendo = false;
  }
}

/* Cualquier cambio en el vault programa una subida, agrupando ráfagas. */
function programarSync() {
  if (!ghCfg()) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => sincronizar(false), 4000);
}

const sinPortada = () => ITEMS.filter(i => !i.coverUrl).length;

/* Pide a Spotify los objetos completos en lotes (20 álbumes / 50 artistas o
   canciones por llamada) y rellena solo lo que falte, sin tocar tus ediciones. */
const LOTE = { album: 20, artist: 50, track: 50 };
let _parar = false;

async function completarPortadas() {
  const btn = document.getElementById('fillCovers');
  const est = document.getElementById('coverStat');
  if (btn.dataset.run === '1') { _parar = true; return; }
  _parar = false;
  btn.dataset.run = '1'; btn.textContent = 'Detener';

  const faltan = ITEMS.filter(i => !i.coverUrl && i.spotifyId);
  let hechos = 0, fallos = 0;

  try {
    for (const tipo of ['album', 'artist', 'track']) {
      const grupo = faltan.filter(i => i.type === tipo);
      for (let i = 0; i < grupo.length; i += LOTE[tipo]) {
        if (_parar) break;
        const trozo = grupo.slice(i, i + LOTE[tipo]);
        const t = await spotifyToken();
        const res = await fetch(
          `https://api.spotify.com/v1/${tipo}s?ids=${trozo.map(x => x.spotifyId).join(',')}`,
          { headers: { Authorization: 'Bearer ' + t } });
        if (res.status === 429) {                       // límite de peticiones
          await new Promise(r => setTimeout(r, (+res.headers.get('Retry-After') || 2) * 1000));
          i -= LOTE[tipo];
          continue;
        }
        if (!res.ok) { fallos += trozo.length; continue; }
        const datos = await res.json();
        (datos[tipo + 's'] || []).forEach((raw, n) => {
          const it = trozo[n];
          if (!raw || !it) { fallos++; return; }
          const fresco = normalize(raw, tipo);
          Object.keys(fresco).forEach(k => {
            if (fresco[k] != null && fresco[k] !== '' &&
                (it[k] == null || it[k] === '' ||
                 (Array.isArray(it[k]) && !it[k].length))) it[k] = fresco[k];
          });
          hechos++;
        });
        est.textContent = `● ${hechos.toLocaleString('es-ES')} de ${faltan.length.toLocaleString('es-ES')} completadas`;
        saveItems();
      }
      if (_parar) break;
    }
  } catch (e) {
    toast('Spotify ha fallado: ' + (e && e.message ? e.message : 'error de red'));
  }

  saveItems(); render();
  btn.dataset.run = '0';
  toast(_parar ? `Detenido — ${hechos} completadas`
               : `${hechos} completadas${fallos ? ` · ${fallos} sin datos` : ''}`);
  openSettings();
}

const cuenta = tipo => ITEMS.filter(i => i.type === tipo).length;

function openSettings() {

  const gh = read(K_GH, null);
  showSheet(`

    <div class="statusline ${gh && gh.token ? 'ok' : 'no'}">${gh && gh.token ? '● Activada' : '● Desactivada'}</div>
    <p class="lede">Guarda el vault en tu repo de GitHub para que el PC y el iPhone vean lo mismo. Crea un token en <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Fine-grained tokens</a>, dale acceso <strong>solo</strong> al repo <code>mi-musica</code> y permiso <strong>Contents: Read and write</strong>. Se guarda únicamente en este dispositivo.</p>
    <input class="field mono" id="ghRepo" placeholder="usuario/repo" value="${esc((gh && gh.repo) || 'mi-musica')}" autocomplete="off" spellcheck="false" style="margin-bottom:8px;">
    <input class="field mono" id="ghTok" type="password" placeholder="github_pat_..." value="${esc((gh && gh.token) || '')}" autocomplete="off" spellcheck="false">
    <div class="btnrow">
      <button class="btn primary wide" id="ghSave">Guardar y sincronizar</button>
      <button class="btn" id="ghNow" ${gh && gh.token ? '' : 'disabled'} title="Sincronizar ahora">⟳</button>
    </div>
    <div class="lede" id="ghOut" style="margin-top:6px;">${esc(syncEstadoTexto())}</div>

    <div class="flabel">Apariencia</div>
    <p class="lede">Sin carátulas el vault se lee como una lista de texto, mucho más rápido con miles de elementos. No borra nada.</p>
    <div class="btnrow">
      <button class="btn wide ${verPortada() ? 'jade' : ''}" id="togCovers">${verPortada() ? '✓ Carátulas visibles' : 'Carátulas ocultas'}</button>
    </div>
    ${verPortada() ? `
      <div class="statusline ${sinPortada() ? 'no' : 'ok'}" id="coverStat" style="margin-top:10px;">${
        sinPortada() ? `● ${sinPortada().toLocaleString('es-ES')} sin carátula` : '● Todas tienen carátula'}</div>
      <div class="btnrow"><button class="btn wide" id="fillCovers" ${sinPortada() && ok ? '' : 'disabled'}>Completar carátulas</button></div>` : ''}

    <div class="flabel">Limpiar el vault</div>
    <p class="lede">Borra de golpe todo un tipo de elemento. Se puede deshacer desde el aviso que sale justo después, pero solo en ese momento.</p>
    <div class="btnrow">
      <button class="btn wide" id="purgeAlbum" ${cuenta('album') ? '' : 'disabled'}>Borrar ${cuenta('album').toLocaleString('es-ES')} álbumes</button>
      <button class="btn wide" id="purgeArtist" ${cuenta('artist') ? '' : 'disabled'}>Borrar ${cuenta('artist').toLocaleString('es-ES')} artistas</button>
    </div>

    <div class="flabel">Copia de seguridad</div>
    <p class="lede">Tu vault vive solo en este navegador. Si borras los datos del navegador, se pierde. Descarga una copia de vez en cuando.</p>
    <div class="btnrow">
      <button class="btn wide" id="expBtn">Descargar copia</button>
      <button class="btn wide" id="impBtn">Restaurar copia</button>
    </div>
    <input type="file" id="impFile" accept="application/json,.json" class="hidden">
  `);

  const fc = document.getElementById('fillCovers');
  if (fc) fc.addEventListener('click', completarPortadas);

  document.getElementById('togCovers').addEventListener('click', () => {
    PREFS.covers = !verPortada();
    savePrefs(); render(); openSettings();
    toast(verPortada() ? 'Carátulas visibles' : 'Carátulas ocultas');
  });

  const purgar = (tipo, etiqueta) => {
    const victimas = ITEMS.filter(i => i.type === tipo);
    if (!victimas.length) return;
    if (!confirm(`¿Borrar ${victimas.length.toLocaleString('es-ES')} ${etiqueta} del vault?\n\nPodrás deshacerlo desde el aviso que sale a continuación, pero solo en ese momento.`)) return;
    deleteItems(victimas.map(i => i.id));
    openSettings();
  };
  document.getElementById('purgeAlbum').addEventListener('click', () => purgar('album', 'álbumes'));
  document.getElementById('purgeArtist').addEventListener('click', () => purgar('artist', 'artistas'));

  document.getElementById('ghSave').addEventListener('click', async () => {
    const repo = document.getElementById('ghRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '');
    const token = document.getElementById('ghTok').value.trim();
    if (!repo.includes('/')) { toast('El repo va en formato usuario/repo'); return; }
    write(K_GH, { repo, token });
    document.getElementById('ghOut').textContent = 'Comprobando…';
    const r = await sincronizar(true);
    document.getElementById('ghOut').textContent = r;
    openSettings();
  });
  const ghNow = document.getElementById('ghNow');
  if (ghNow) ghNow.addEventListener('click', async () => {
    document.getElementById('ghOut').textContent = 'Sincronizando…';
    document.getElementById('ghOut').textContent = await sincronizar(true);
  });

  swatch = TAG_COLORS[0];
  document.getElementById('saveCreds').addEventListener('click', () => {
    write(K_CREDS, { clientId: document.getElementById('cid').value.trim(), clientSecret: document.getElementById('csec').value.trim() });
    tok = { v: null, exp: 0 };
    toast('Credenciales guardadas');
    openSettings();
  });
  document.getElementById('sw').addEventListener('click', e => {
    const s = e.target.closest('.sw'); if (!s) return;
    document.querySelectorAll('#sw .sw').forEach(x => x.classList.toggle('on', x === s));
    swatch = s.dataset.c;
  });
  document.getElementById('addTag').addEventListener('click', () => {
    const name = document.getElementById('newTag').value.trim();
    if (!name) return;
    if (TAGS.some(t => t.name.toLowerCase() === name.toLowerCase())) { toast('Ya tienes una etiqueta con ese nombre'); return; }
    TAGS.push({ id: uid(), name, colorHex: swatch });
    saveTags(); render(); openSettings();
  });
  document.getElementById('tagList').addEventListener('click', e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const id = b.dataset.del;
    TAGS = TAGS.filter(t => t.id !== id);
    ITEMS.forEach(it => { it.tagIds = (it.tagIds || []).filter(x => x !== id); });
    if (PREFS.tag === id) PREFS.tag = 'all';
    saveTags(); saveItems(); savePrefs(); render(); openSettings();
  });
  document.getElementById('expBtn').addEventListener('click', exportBackup);
  document.getElementById('impBtn').addEventListener('click', () => document.getElementById('impFile').click());
  document.getElementById('impFile').addEventListener('change', importBackup);
}

function tagListHtml() {
  if (!TAGS.length) return `<p class="lede" style="margin:0;">Aún no hay etiquetas. Crea una abajo para organizar tu vault.</p>`;
  return TAGS.map(t => {
    const n = ITEMS.filter(i => (i.tagIds || []).includes(t.id)).length;
    return `<div class="tagline">
      <span class="lf"><span class="dot" style="background:${esc(t.colorHex)}"></span>${esc(t.name)}<span class="ct">${n}</span></span>
      <button class="xbtn" data-del="${esc(t.id)}" aria-label="Eliminar etiqueta">✕</button>
    </div>`;
  }).join('');
}

function exportBackup() {
  const blob = new Blob([JSON.stringify({ app: 'MusicVault', version: 1, exportedAt: new Date().toISOString(), items: ITEMS, tags: TAGS }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `musicvault-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Copia descargada');
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!Array.isArray(d.items)) throw new Error('bad');
      const known = new Set(ITEMS.map(i => i.spotifyId));
      const fresh = d.items.filter(i => i && i.spotifyId && !known.has(i.spotifyId));
      const tagNames = new Set(TAGS.map(t => t.name.toLowerCase()));
      (d.tags || []).forEach(t => { if (t && t.name && !tagNames.has(t.name.toLowerCase())) TAGS.push(t); });
      ITEMS = ITEMS.concat(fresh);
      saveItems(); saveTags(); render(); closeModal();
      toast(`${fresh.length} elemento${fresh.length === 1 ? '' : 's'} restaurado${fresh.length === 1 ? '' : 's'}`);
    } catch {
      toast('Ese archivo no es una copia válida de MusicVault');
    }
  };
  fr.readAsText(file);
  e.target.value = '';
}

/* ---- estadísticas ---- */
function relDate(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return 'hoy';
  if (days === 1) return 'ayer';
  if (days < 30) return `hace ${days} días`;
  const months = Math.floor(days / 30);
  if (months < 12) return `hace ${months} ${months === 1 ? 'mes' : 'meses'}`;
  const years = Math.floor(days / 365);
  return `hace ${years} ${years === 1 ? 'año' : 'años'}`;
}

function bars(rows, color) {
  if (!rows.length) return '<p class="lede" style="margin:0;">Sin datos todavía.</p>';
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="barlist">${rows.map(([label, n]) => `
    <div class="barrow">
      <span class="blabel">${esc(label)}</span>
      <span class="btrack"><span class="bfill" style="width:${Math.max(4, n / max * 100)}%;background:${color}"></span></span>
      <span class="bnum">${n}</span>
    </div>`).join('')}</div>`;
}

function openStats() {
  if (!ITEMS.length) { toast('Tu vault está vacío'); return; }
  const done = ITEMS.filter(i => i.listened);
  const pending = ITEMS.filter(i => !i.listened);

  const byArtist = {};
  ITEMS.forEach(i => (i.artists || []).forEach(a => { byArtist[a] = (byArtist[a] || 0) + 1; }));
  const topArtists = Object.entries(byArtist).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 8);

  const byDecade = {};
  ITEMS.forEach(i => { const y = yearOf(i); if (y) { const d = Math.floor(y / 10) * 10 + 's'; byDecade[d] = (byDecade[d] || 0) + 1; } });
  const decades = Object.entries(byDecade).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));

  const byType = ['album', 'track', 'artist'].map(t => [TYPE_PLURAL[t], ITEMS.filter(i => i.type === t).length]).filter(r => r[1]);
  const rated = ITEMS.filter(i => i.rating > 0);
  const avg = rated.length ? (rated.reduce((s, i) => s + i.rating, 0) / rated.length).toFixed(1) : null;
  const oldest = pending.slice().sort((a, b) => a.dateAdded - b.dateAdded)[0];
  const pct = Math.round(done.length / ITEMS.length * 100);

  showSheet(`
    <div class="sheethead"><h2>Tu vault en números</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>

    <div class="bigstat">
      <div class="bignum">${pct}<span class="pctsign">%</span></div>
      <div>
        <div style="font-weight:650;">escuchado</div>
        <div class="lede" style="margin:0;">${done.length} de ${ITEMS.length} · te quedan ${pending.length} por escuchar</div>
      </div>
    </div>
    <div class="progtrack"><span class="progfill" style="width:${pct}%"></span></div>

    ${oldest ? `<div class="flabel">Lo que más tiempo lleva esperando</div>
    <button class="oldcard" data-goto="${oldest.id}">
      <span class="oldart">${portada(oldest.coverUrl, TYPE_ICON[oldest.type], false)}</span>
      <span class="oldinfo">
        <span class="oldt">${esc(oldest.title)}</span>
        <span class="olda">${esc(artistsOf(oldest))} · guardado ${relDate(oldest.dateAdded)}</span>
      </span>
    </button>` : ''}

    <div class="flabel">Qué guardas</div>
    ${bars(byType, 'var(--amber)')}

    <div class="flabel">Artistas con más cosas guardadas</div>
    ${bars(topArtists, 'var(--jade)')}

    <div class="flabel">Por década de lanzamiento</div>
    ${bars(decades, 'var(--amber)')}

    <div class="flabel">Valoraciones</div>
    <p class="lede" style="margin:0;">${rated.length ? `Has valorado ${rated.length} de ${ITEMS.length}. Media: <strong>${avg}</strong> ★` : 'Todavía no has valorado nada. Abre cualquier ficha y toca las estrellas.'}</p>
  `);

  document.querySelector('[data-goto]')?.addEventListener('click', e => openDetail(e.currentTarget.dataset.goto));
}

/* ---- shuffle ---- */
function shuffle() {
  const pool = ITEMS.filter(i => !i.listened);
  if (!pool.length) {
    toast(ITEMS.length ? '¡No te queda nada pendiente!' : 'Tu vault está vacío');
    return;
  }
  openDetail(pool[Math.floor(Math.random() * pool.length)].id);
}

/* ============ events ============ */
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('statsBtn').addEventListener('click', openStats);
document.getElementById('bulkBtn').addEventListener('click', openBulk);
document.getElementById('setBtn').addEventListener('click', openSettings);
document.getElementById('addFab').addEventListener('click', openSearch);

document.getElementById('q').addEventListener('input', render);
document.getElementById('sortSel').addEventListener('change', e => { PREFS.sort = e.target.value; savePrefs(); render(); });
document.getElementById('viewBtn').addEventListener('click', () => { PREFS.view = PREFS.view === 'grid' ? 'list' : 'grid'; savePrefs(); render(); });

document.querySelector('.state-strip').addEventListener('click', e => {
  const b = e.target.closest('.stat'); if (!b) return;
  PREFS.status = PREFS.status === b.dataset.status ? 'all' : b.dataset.status;
  savePrefs(); render();
});

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.type) PREFS.type = b.dataset.type;
  if (b.dataset.tag) PREFS.tag = PREFS.tag === b.dataset.tag ? 'all' : b.dataset.tag;
  savePrefs(); render();
});

/* content delegation: open detail, toggle listened, selection, empty-state buttons */
let pressTimer = null;
const contentEl = document.getElementById('results');

contentEl.addEventListener('click', e => {
  const clear = e.target.closest('[data-clear]');
  if (clear) { PREFS.type = 'all'; PREFS.status = 'all'; PREFS.tag = 'all'; document.getElementById('q').value = ''; savePrefs(); render(); return; }
  const open = e.target.closest('[data-open]');
  if (open) { open.dataset.open === 'search' ? openSearch() : openBulk(); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { e.stopPropagation(); toggleListened(tg.dataset.toggle); return; }
  const more = e.target.closest('[data-more]');
  if (more) { VISTAS += TANDA * 3; render(); return; }
  const card = e.target.closest('[data-id]');
  if (!card) return;
  if (selMode) toggleSel(card.dataset.id);
  else openDetail(card.dataset.id);
});

/* long-press enters selection mode (mobile) */
contentEl.addEventListener('pointerdown', e => {
  const card = e.target.closest('[data-id]');
  if (!card || e.target.closest('[data-toggle]')) return;
  pressTimer = setTimeout(() => {
    if (!selMode) { selMode = true; selected.add(card.dataset.id); render(); if (navigator.vibrate) navigator.vibrate(12); }
  }, 480);
});
['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(ev =>
  contentEl.addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));
window.addEventListener('scroll', () => clearTimeout(pressTimer), { passive: true });

document.getElementById('selbarRoot').addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (!b) return;
  const ids = [...selected];
  if (b.dataset.sel === 'cancel') return setSelMode(false);
  if (b.dataset.sel === 'listen') {
    ids.forEach(id => { const it = ITEMS.find(x => x.id === id); if (it) it.listened = true; });
    saveItems(); setSelMode(false); toast(`${ids.length} marcado${ids.length === 1 ? '' : 's'} como escuchado${ids.length === 1 ? '' : 's'}`);
  }
  if (b.dataset.sel === 'tag') openTagPicker(ids);
  if (b.dataset.sel === 'del') { setSelMode(false); deleteItems(ids); }
});

/* modal delegation */
modalRoot.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeModal();
  const add = e.target.closest('[data-add]');
  if (add) {
    const r = lastResults[+add.dataset.add];
    if (!r || ITEMS.some(x => x.spotifyId === r.spotifyId)) return;
    ITEMS.push(makeItem(r));
    saveItems(); render();
    add.classList.add('done'); add.textContent = '✓';
    return;
  }
  const open = e.target.closest('[data-open]');
  if (open && open.dataset.open === 'settings') { closeModal(); openSettings(); }
});

/* desktop shortcuts */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'n' || e.key === 'N') openSearch();
  if (e.key === 'v' || e.key === 'V') { PREFS.view = PREFS.view === 'grid' ? 'list' : 'grid'; savePrefs(); render(); }
});

/* ============ init ============ */
bootStorage().then(() => {
  render();
  if (ghCfg()) sincronizar(false);
});

/* Al volver a la app (cambiar de pestaña, desbloquear el móvil) se comprueba
   si el otro dispositivo ha añadido algo, pero como mucho una vez por minuto. */
let _ultimoVistazo = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !ghCfg()) return;
  if (Date.now() - _ultimoVistazo < 60000) return;
  _ultimoVistazo = Date.now();
  sincronizar(false);
});
</script>
