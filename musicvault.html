  mas:         '<path d="M12 5v14"/><path d="M5 12h14"/>'
};
/* A 1em hereda el tamano del texto de alrededor; con px se fuerza. */
/* Cada tipo con su icono, para cuando no hay caratula y para las pastillas. */
const TYPE_ICON = { album: null, track: null, artist: null, playlist: null };
const ui = (n, px) => '<svg class="ui" viewBox="0 0 24 24" width="' + (px || '1em') + '" height="' + (px || '1em') + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICO[n] || ICO.nota) + '</svg>';
TYPE_ICON.album = ui('disco'); TYPE_ICON.track = ui('nota');
TYPE_ICON.artist = ui('micro'); TYPE_ICON.playlist = ui('lista');

/* Una etiqueta sin icono elegido se pinta con el de etiqueta, y una carpeta
   con el de carpeta: nunca sale un hueco. */
const iconoDe = t => ICONOS[t && t.icon] ? t.icon : (t && t.esCarpeta ? 'carpeta' : 'etiqueta');
const iconoHtml = (t, px) =>
  `<svg class="tgico" viewBox="0 0 24 24" width="${px}" height="${px}" fill="${esc(t && t.colorHex || 'currentColor')}" aria-hidden="true"><path d="${ICONOS[iconoDe(t)]}"/></svg>`;
const artistsOf = it => (it.artists || []).join(', ');
/* Spotify devuelve el artista principal el primero, y la importación desde el
   Excel mantuvo ese orden: artists[0] es de quién es la canción y el resto son
   colaboraciones. Agrupar por el principal junta "50 Cent" con "50 Cent, Olivia"
   en lugar de abrir una cabecera distinta por cada combinación de invitados. */
const principalDe = it => (it.artists || [])[0] || '';
const colaboradoresDe = it => (it.artists || []).slice(1);
/* Con las carátulas desactivadas el vault se lee como una lista, no como una
   pared de discos. Es una preferencia, no un borrado: se vuelve a activar en Ajustes. */
const verPortada = () => PREFS.covers !== false;
const portada = (url, icono, lazy) =>
  (verPortada() && url && !/00-000000-80-0-0/.test(String(url))) ? `<img src="${esc(url)}" ${lazy ? 'loading="lazy" ' : ''}alt="">` : icono;
// Buscar "camaron" tiene que encontrar "Camarón".
const _LETRAS_RARAS = [[/ø/g, 'o'], [/æ/g, 'ae'], [/œ/g, 'oe'], [/ß/g, 'ss'], [/đ|ð/g, 'd'], [/ł/g, 'l'], [/þ/g, 'th']];
const _quitaRaras = s => { for (const [rx, a] of _LETRAS_RARAS) s = s.replace(rx, a); return s; };
const fold = s => _quitaRaras(String(s || '').toLowerCase()).normalize('NFD').replace(/[̀-ͯ]/g, '');
const yearOf = it => (it.releaseDate ? parseInt(String(it.releaseDate).slice(0, 4), 10) : 0) || 0;
// Para ordenar como una discoteca de verdad: "The Beatles" va por la B.
const sortKey = s => String(s || '').toLowerCase().replace(/^(the|los|las|el|la|a|an)\s+/, '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
/* localeCompare construye un comparador nuevo en CADA llamada, y ordenar el
   vault son cientos de miles de llamadas: era segundo y medio de espera por
   render (mucho más en el móvil). Reutilizar un Intl.Collator compara igual
   pero cuesta una fracción. */
const COLLATOR = new Intl.Collator('es', { sensitivity: 'base' });
const cmp = (a, b) => COLLATOR.compare(a, b);
/* Intl.Collator es correcto pero caro: ordenar el vault son ~245.000
   comparaciones y cada una cuesta medio microsegundo, o sea 150ms en cada
   repintado. Comparar dos cadenas con < y > cuesta una fraccion de eso, pero
   solo vale si la cadena YA viene normalizada. Eso es lo que hace esto:
   quita tildes y mayusculas de una vez por elemento, y a la enye la deja
   como "n~" para que siga cayendo donde le toca en castellano — detras de
   todas las enes y delante de las oes. */
const foldOrden = s => _quitaRaras(String(s || '').toLowerCase().normalize('NFC'))
  .replace(/ñ/g, 'n~').normalize('NFD').replace(/[̀-ͯ]/g, '');
/* Empate a clave normalizada: se deshace por el texto original para que el
   orden sea siempre el mismo y la lista no baile entre repintados. */
const cmpR = (a, b) => a < b ? -1 : a > b ? 1 : 0;
/* Agrupar y ordenar tienen que coincidir o los grupos salen partidos. Va foldeada
   para que "deadmau5" y "Deadmau5" no sean dos cabeceras seguidas. */
/* Ordenar recalculaba sortKey() de título y artistas en cada comparación: para
   17.000 elementos son millones de normalizaciones de texto repetidas. Se
   calculan una vez por elemento y se guardan aquí. El caché se revalida solo
   comparando el título y la referencia del array de artistas, así que editar
   una ficha (o que llegue una versión nueva al sincronizar) lo recalcula sin
   necesidad de acordarse de invalidarlo a mano en cada sitio. */
const _clavesOrden = new WeakMap();
function clavesDe(it) {
  let k = _clavesOrden.get(it);
  if (!k || k.t !== it.title || k.a !== it.artists) {
    const art = sortKey(principalDe(it));
    k = { t: it.title, a: it.artists, art: foldOrden(art), agr: fold(art), full: foldOrden(sortKey(artistsOf(it))), tit: foldOrden(sortKey(it.title)), crudo: it.title };
    _clavesOrden.set(it, k);
  }
  return k;
}
const claveArtista = it => clavesDe(it).agr;
let _indiceTags = null, _versionTags = 0, _idxRef = null, _idxLen = -1;
const invalidarTags = () => { _indiceTags = null; _versionTags++; };
const tagById = id => {
  if (!_indiceTags || _idxRef !== TAGS || _idxLen !== TAGS.length) {
    _indiceTags = new Map(TAGS.map(t => [t.id, t]));
    _idxRef = TAGS; _idxLen = TAGS.length; _versionTags++;
  }
  return _indiceTags.get(id);
};

/* ============ theme ============
   Con el automatico puesto, la app se pone oscura de noche y clara de dia
   sola. Si le das al boton, mandas TU hasta el proximo cambio de tramo:
   es decir, si a las once de la noche la pones clara, se queda clara hasta
   la manana siguiente, que es cuando el automatico habria cambiado igual.
   Asi no hay que acordarse de volver a activar nada. */
const K_AUTOTEMA = 'mv_autotema';
const HORA_CLARO = 8, HORA_OSCURO = 20;
const temaPorHora = () => { const h = new Date().getHours(); return (h >= HORA_CLARO && h < HORA_OSCURO) ? 'light' : 'dark'; };
const autoTemaOn = () => localStorage.getItem(K_AUTOTEMA) !== '0';

(() => {
  const root = document.documentElement;
  const K_ULT = 'mv_tema_ult';   // que tramo tocaba la ultima vez que se miro

  /* El boton ensena a donde vas, no donde estas: en claro ofrece la luna. */
  function pintarBotonTema() {
    const b = document.getElementById('themeBtn');
    if (!b) return;
    const oscuro = (root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
    b.innerHTML = ui(oscuro ? 'sol' : 'luna', 18);
    b.title = oscuro ? 'Pasar a claro' : 'Pasar a oscuro';
  }
  function aplicar() {
    if (!autoTemaOn()) { pintarBotonTema(); return; }
    const toca = temaPorHora();
    /* Si el tramo no ha cambiado, se respeta lo que hubiera (tu override
       manual incluido). En cuanto cambia, manda el reloj otra vez. */
    if (localStorage.getItem(K_ULT) === toca) return;
    localStorage.setItem(K_ULT, toca);
    root.setAttribute('data-theme', toca);
    localStorage.setItem(K_THEME, toca);
    pintarBotonTema();
  }

  const saved = localStorage.getItem(K_THEME);
  if (saved) root.setAttribute('data-theme', saved);
  aplicar();
  pintarBotonTema();
  /* cada cinco minutos, y ademas al volver a la app: en el movil la pestana
     se congela y sin esto amanecias con la pantalla todavia en oscuro */
  setInterval(aplicar, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) aplicar(); });

  document.getElementById('themeBtn').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem(K_THEME, next);
    pintarBotonTema();
    if (autoTemaOn()) {
      localStorage.setItem(K_ULT, temaPorHora());   // manda tu hasta el proximo tramo
      toast(next === 'dark' ? 'Oscuro hasta mañana' : 'Claro hasta la noche');
    }
  });
  window.aplicarTemaPorHora = aplicar;
})();

/* ============ teclado en iOS ============
   Cuando aparece el teclado, Safari en iPhone no encoge el viewport de LAYOUT
   (el que usan los position:fixed) — solo el visual. El FAB "＋ Añadir" y el
   último botón de cada hoja se quedaban por tanto tapados detrás del teclado,
   aunque siguieran "ahí" según el CSS. visualViewport sí conoce el hueco real
   que deja libre el teclado, así que se usa para levantar esos elementos. */
function ajustarPorTeclado() {
  const vv = window.visualViewport;
  if (!vv) return;
  const solape = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  // Safari añade, pegada encima del teclado, una barra nativa para moverte
  // entre campos (flechas + "Hecho") que visualViewport no siempre descuenta
  // del todo — sin este margen de más, el contenido quedaba justo detrás de
  // esa barra en vez de por encima.
  const extra = solape > 0 ? 44 : 0;
  document.documentElement.style.setProperty('--kb', (solape + extra) + 'px');
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', ajustarPorTeclado);
  visualViewport.addEventListener('scroll', ajustarPorTeclado);
  ajustarPorTeclado();
}

/* En el iPhone, la pantalla se apaga sola a los pocos segundos sin tocarla —
   justo lo que pasa mientras se mira una barra de progreso de una subida
   larga (cientos o miles de elementos). Si se apaga o se bloquea, iOS pausa
   la pestaña y el proceso se corta a mitad. Wake Lock evita que se apague
   mientras dura; se libera en cuanto termina para no gastar batería de más.
   Disponible desde iOS 16.4 — en iOS más antiguo, o si algo falla, esto no
   hace nada y el proceso sigue igual que siempre, solo sin esta protección. */
let _wakeLock = null;
async function pedirDespertar() {
  try { if ('wakeLock' in navigator) _wakeLock = await navigator.wakeLock.request('screen'); }
  catch {}   // sin soporte, sin permiso, o la pestaña no está visible: no pasa nada
}
function soltarDespertar() {
  if (_wakeLock) { _wakeLock.release().catch(() => {}); _wakeLock = null; }
}
// si se bloqueó la pantalla y se desbloquea con el proceso aún en marcha, el
// wake lock ya se soltó solo (así lo hace el sistema) — hay que volver a pedirlo
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (_bulkCorriendo || _completandoPortadas || _completandoGeneros)) pedirDespertar();
});

/* ============ toasts ============ */
function toast(msg, actionLabel, actionFn, ms = 5000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tmsg">${esc(msg)}</span>`;
  if (actionLabel) {
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.addEventListener('click', () => { actionFn(); el.remove(); });
    el.appendChild(b);
  }
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ============ spotify ============
   Desde febrero de 2026 Spotify cerró el acceso de Client Credentials (app
   sola, sin usuario) a los datos de catálogo para apps en modo desarrollo:
   https://developer.spotify.com/documentation/web-api/references/changes/february-2026
   La única vía que sigue funcionando es Authorization Code con PKCE: el
   usuario inicia sesión de verdad en Spotify y la app actúa en su nombre.
   PKCE no usa Client Secret — es un flujo pensado para apps sin servidor
   propio, así que sigue siendo seguro pegar solo el Client ID aquí. */
const REDIRECT_URI = location.origin + location.pathname;
const K_PKCE = 'musicvault_pkce_v1';   // verifier+state durante la ida y vuelta a Spotify

function b64url(bytes) {
  let bin = '';
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randomToken(nBytes) {
  const arr = new Uint8Array(nBytes);
  crypto.getRandomValues(arr);
  return b64url(arr);
}
async function pkceChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64url(digest);
}

function isConnected() { const c = loadCreds(); return !!(c && c.refreshToken); }

/* Con permiso vacío, Spotify solo deja ver catálogo público: un álbum, un
   artista o una playlist marcada como pública. Una playlist personal que no
   hayas puesto en público (la mayoría, por defecto) daba 403 al leerla o
   guardarla. Estos dos permisos son de solo lectura y piden exactamente eso,
   nada de escritura ni datos que no sean playlists:
   https://developer.spotify.com/documentation/web-api/concepts/scopes */
const SPOTIFY_SCOPE = 'playlist-read-private playlist-read-collaborative';
/* Permiso aparte para leer el historial reciente real (qué has escuchado de
   verdad en Spotify) y poder marcar "escuchado" solo — separado de
   SPOTIFY_SCOPE a propósito: tieneScopePlaylists() no debe empezar a exigir
   este permiso nuevo de golpe y forzar una reconexión a quien ya tenía
   playlists funcionando. Se piden juntos al conectar, pero se comprueban aparte. */
const SPOTIFY_SCOPE_RECIENTES = 'user-read-recently-played';

/* Manda al usuario a la pantalla de login real de Spotify. Al volver, Spotify
   añade ?code=...&state=... a esta misma URL (por eso hace falta registrar
   esta página exacta como Redirect URI en el Developer Dashboard). */
async function beginSpotifyLogin() {
  const c = loadCreds();
  if (!c || !c.clientId) { toast('Pon primero el Client ID en Ajustes'); return; }
  const verifier = randomToken(64);
  const state = randomToken(16);
  sessionStorage.setItem(K_PKCE, JSON.stringify({ verifier, state }));
  const challenge = await pkceChallenge(verifier);
  const params = new URLSearchParams({
    client_id: c.clientId, response_type: 'code', redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256', code_challenge: challenge, state,
    scope: SPOTIFY_SCOPE + ' ' + SPOTIFY_SCOPE_RECIENTES
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

/* Se llama al arrancar la página. Si venimos de vuelta del login de Spotify,
   la URL trae ?code=... (o ?error=...): hay que completarlo antes de pintar
   nada, y limpiar la URL en cualquier caso para no dejar el code a la vista
   ni reprocesarlo si se recarga la página. */
async function handleSpotifyRedirect() {
  const qs = new URLSearchParams(location.search);
  const code = qs.get('code'), state = qs.get('state'), err = qs.get('error');
  if (!code && !err) return;
  history.replaceState({}, '', location.pathname);
  if (err) { toast('Spotify: ' + err); return; }

  let guardado = null;
  try { guardado = JSON.parse(sessionStorage.getItem(K_PKCE) || 'null'); } catch {}
  sessionStorage.removeItem(K_PKCE);
  if (!guardado || state !== guardado.state) {
    toast('La conexión con Spotify no se pudo verificar. Vuelve a intentarlo.');
    return;
  }
  const c = loadCreds();
  if (!c || !c.clientId) { toast('Falta el Client ID en Ajustes.'); return; }
  try {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI,
        client_id: c.clientId, code_verifier: guardado.verifier
      })
    });
    if (!res.ok) throw new Error('' + res.status);
    const d = await res.json();
    write(K_CREDS, {
      clientId: c.clientId, accessToken: d.access_token,
      refreshToken: d.refresh_token, expiresAt: Date.now() + (d.expires_in - 60) * 1000,
      scope: d.scope || ''   // permisos que Spotify concedió de verdad, para saber si faltan
    });
    toast('Conectado con Spotify');
  } catch (e) {
    toast('No se pudo completar la conexión con Spotify (' + (e.message || 'error') + ').');
  }
}

function disconnectSpotify() {
  const c = loadCreds();
  if (c) write(K_CREDS, { clientId: c.clientId });   // conserva el Client ID, olvida la sesión
  toast('Desconectado de Spotify');
}

async function spotifyToken() {
  const c = loadCreds();
  if (!c || !c.refreshToken) throw new Error('NO_CREDS');
  if (c.accessToken && c.expiresAt > Date.now()) return c.accessToken;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: c.refreshToken, client_id: c.clientId })
  });
  if (!res.ok) throw new Error('AUTH_FAILED');
  const d = await res.json();
  const fresco = {
    clientId: c.clientId, accessToken: d.access_token,
    refreshToken: d.refresh_token || c.refreshToken,   // Spotify no siempre rota el refresh token
    expiresAt: Date.now() + (d.expires_in - 60) * 1000,
    scope: d.scope || c.scope || ''   // al refrescar no siempre viene: se conserva el que ya había
  };
  write(K_CREDS, fresco);
  return fresco.accessToken;
}

/* Un token pedido antes de añadir un permiso nuevo (por ejemplo, leer
   playlists privadas) sigue teniendo SOLO los permisos con los que se pidió
   la primera vez — cambiar el código no se lo da con carácter retroactivo.
   Esto detecta esa situación para avisar de que hay que reconectar, en vez
   de dejar que Spotify devuelva un 403 sin explicación. */
function tieneScopePlaylists() {
  const c = loadCreds();
  if (!c || !c.scope) return false;
  const got = new Set(c.scope.split(' ').filter(Boolean));
  return SPOTIFY_SCOPE.split(' ').every(s => got.has(s));
}
function tieneScopeRecientes() {
  const c = loadCreds();
  if (!c || !c.scope) return false;
  return c.scope.split(' ').includes(SPOTIFY_SCOPE_RECIENTES);
}

/* Búsquedas de sobra en poco tiempo (escribir rápido, o un rato largo de uso
   seguido) pueden toparse con el límite de peticiones de Spotify (429). Antes
   se enseñaba tal cual "Spotify devolvió un error 429"; ahora se reintenta
   solo, respetando el Retry-After que manda Spotify (con un tope para no
   dejar la búsqueda colgada), y solo si sigue fallando se avisa. */
/* Un 429 no es problema de UNA petición: Spotify limita por app y por ventana
   de tiempo, así que en cuanto llega uno, todo lo que salga detrás va a chocar
   igual. Antes cada petición descubría el 429 por su cuenta —gastando otra
   petición en enterarse— y con solo 3 intentos y 4s de tope acababa rindiéndose
   y enseñando el aviso. Esta puerta global hace que, en cuanto una petición se
   come el castigo, TODAS las demás esperen a que pase. */
let _pausaSpotifyHasta = 0;
const esperarTurnoSpotify = async () => {
  const falta = _pausaSpotifyHasta - Date.now();
  if (falta > 0) await new Promise(r => setTimeout(r, falta));
};

/* Si Spotify pide esperar 20s o más, no es el típico "escribiste muy rápido
   en el buscador" — es un bloqueo en serio (pasa sobre todo importando cientos
   de enlaces seguidos). Por debajo de eso se trata como ruido normal y se
   reintenta sin más. El número es una estimación nuestra, no algo que Spotify
   documente. */
const SEG_BLOQUEO_SOSTENIDO = 20;

/* El Retry-After no siempre delata un bloqueo en serio: a veces Spotify
   contesta 429 sin esa cabecera, o con un número pequeño (2-5s) que dice
   "espera un poco" pero el bloqueo real sigue horas — confirmado con un vault
   real, donde eso hacía que la importación se quedara reintentando canción a
   canción sin parar en vez de darse cuenta y pasar el resto a la cola. Si se
   encadenan varios 429 SEGUIDOS (sin ningún éxito de por medio, venga el
   Retry-After que venga), se trata igual que un bloqueo sostenido. Compartido
   entre lotes: si un tipo (p. ej. álbumes) ya demostró que estamos
   bloqueados, el siguiente tipo (canciones) no tiene que volver a
   descubrirlo desde cero. */
let _429Seguidos = 0;
const UMBRAL_429_SEGUIDOS = 6;

/* Cuánto queda de la pausa actual, en texto para el usuario. Antes los avisos
   de "demasiadas peticiones" decían siempre "espera unos segundos" aunque la
   espera real pedida por Spotify fuera de minutos u horas — mentira a medias
   que solo hacía que el usuario lo reintentase antes de tiempo. */
function tiempoEsperaTexto() {
  const s = Math.ceil((_pausaSpotifyHasta - Date.now()) / 1000);
  if (s <= 5) return 'unos segundos';
  if (s < 60) return `unos ${s} segundos`;
  const min = Math.ceil(s / 60);
  if (min < 60) return `unos ${min} minuto${min === 1 ? '' : 's'}`;
  const horas = Math.ceil(min / 60);
  return `unas ${horas} hora${horas === 1 ? '' : 's'}`;
}

async function fetchConReintento429(url, token, intentos = 5) {
  let res;
  for (let i = 0; i < intentos; i++) {
    await esperarTurnoSpotify();
    res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    if (res.status !== 429) { if (res.ok) _429Seguidos = 0; return res; }
    _429Seguidos++;
    // Retry-After viene en segundos; si Spotify no lo manda, subida exponencial.
    // Antes esto se recortaba a 10s como mucho ANTES de guardarlo como pausa
    // global (más abajo) — si Spotify pedía esperar de verdad más que eso, la
    // puerta se volvía a abrir demasiado pronto y todo lo demás chocaba otra
    // vez con el mismo 429 en vez de esperar lo que tocaba.
    const seg = +res.headers.get('Retry-After') || Math.pow(2, i);
    _pausaSpotifyHasta = Math.max(_pausaSpotifyHasta, Date.now() + seg * 1000);
    if (i === intentos - 1) return res;
    // Para algo interactivo (buscar mientras escribes) no tiene sentido dejar
    // la pantalla colgada una hora esperando: si la espera real es larga, no
    // se agota aquí — se devuelve el 429 tal cual (la puerta global ya deja en
    // pausa a todo lo demás el tiempo real) y quien llamó decide qué decir.
    if (seg > 10) return res;
  }
  return res;
}

/* Escribir, borrar un par de letras y volver a escribirlas repetía la misma
   búsqueda una y otra vez: era la forma más fácil de comerse un 429 sin estar
   haciendo nada raro. Se guarda cinco minutos lo ya preguntado. */
const _cacheBusqueda = new Map();
const TTL_BUSQUEDA = 5 * 60000;

async function spotifySearch(q, type, offset = 0) {
  const clave = type + '|' + offset + '|' + fold(q).trim();
  const guardado = _cacheBusqueda.get(clave);
  if (guardado && Date.now() - guardado.t < TTL_BUSQUEDA) return guardado.data;

  const t = await spotifyToken();
  // el límite máximo bajó de 50 a 10 en el cambio de febrero de 2026; para ver
  // más de 10 hay que pedir páginas sucesivas con offset (ver cargarMasResultados)
  const res = await fetchConReintento429(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=${type}&limit=10&offset=${offset}`, t);
  if (res.status === 429) throw new Error('RATE_LIMIT');
  if (!res.ok) throw new Error('SEARCH_FAILED:' + res.status);
  const data = await res.json();
  _cacheBusqueda.set(clave, { t: Date.now(), data });
  if (_cacheBusqueda.size > 300) _cacheBusqueda.delete(_cacheBusqueda.keys().next().value);
  return data;
}

async function spotifyLookup(type, id) {
  const t = await spotifyToken();
  const res = await fetchConReintento429(`https://api.spotify.com/v1/${type}s/${id}`, t);
  if (res.status === 429) throw new Error('RATE_LIMIT');
  if (!res.ok) throw new Error('LOOKUP_FAILED:' + res.status);
  return res.json();
}

/* Las llamadas "varias a la vez" (GET /albums?ids=, /tracks?ids=, /artists?ids=)
   se eliminaron en el cambio de febrero de 2026 — solo queda pedir uno a uno:
   https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide
   Esto los pide con una concurrencia pequeña (5 a la vez) para no tardar una
   eternidad con listas largas. Si falla por credenciales, PARA TODO en vez de
   contarlo como fallos sueltos (si el token no vale, el siguiente tampoco). */
async function fetchItemsIndividually(tipo, ids, onProgress, shouldStop, onItem) {
  const CONCURRENCIA = 5;
  const resultados = new Array(ids.length).fill(null);
  // true = Spotify dijo que no (bloqueo real, o agotamos reintentos con un
  // 429 corto): NO significa "no existe", así que quien llame no debe darlo
  // por perdido — hay que reintentarlo más tarde (ver import queue).
  const bloqueados = new Array(ids.length).fill(false);
  let hechos = 0, i = 0, pararTodo = null, bloqueoDetectado = false;

  async function trabajador() {
    while (i < ids.length && !pararTodo && !bloqueoDetectado) {
      if (shouldStop && shouldStop()) return;
      const mio = i++;
      for (let intento = 0; intento < 4; intento++) {
        if (bloqueoDetectado) { bloqueados[mio] = true; return; }
        // puerta compartida: si otro worker (u otra búsqueda) ya se comió un
        // 429 hace un instante, todos esperan juntos en vez de ir chocando
        // uno detrás de otro contra el mismo límite. Cooperativa (a trozos de
        // 1s como mucho): si MIENTRAS esperamos otro worker descubre que es
        // un bloqueo sostenido, salimos enseguida en vez de agotar la espera
        // entera puesta ahí abajo, que puede ser de minutos u horas — si no,
        // toda la subida se queda "congelada" ese tiempo entero antes de
        // poder pasar el resto a la cola.
        let falta = _pausaSpotifyHasta - Date.now();
        while (falta > 0 && !bloqueoDetectado) {
          await new Promise(r => setTimeout(r, Math.min(falta, 1000)));
          falta = _pausaSpotifyHasta - Date.now();
        }
        if (bloqueoDetectado) { bloqueados[mio] = true; return; }
        let t;
        try { t = await spotifyToken(); }
        catch (e) { pararTodo = e; return; }
        let res;
        try {
          res = await fetch(`https://api.spotify.com/v1/${tipo}s/${ids[mio]}`, { headers: { Authorization: 'Bearer ' + t } });
        } catch { break; }   // fallo de red puntual: cuenta como fallo de este elemento, no para todo
        if (res.status === 429) {
          const seg = +res.headers.get('Retry-After') || 2;
          _pausaSpotifyHasta = Math.max(_pausaSpotifyHasta, Date.now() + seg * 1000);
          _429Seguidos++;
          if (seg >= SEG_BLOQUEO_SOSTENIDO || _429Seguidos >= UMBRAL_429_SEGUIDOS) {
            // esto ya no es "espera un poco y sigue": es un bloqueo en serio
            // (o Spotify no está siendo sincero sobre cuánto dura). Paramos
            // TODO el lote entero aquí mismo en vez de que cada worker se
            // coma 4 intentos por canción sin ninguna esperanza — lo que
            // quede pendiente se queda tal cual para reintentarlo luego.
            bloqueados[mio] = true;
            bloqueoDetectado = true;
            return;
          }
          if (intento < 3) continue;   // la siguiente vuelta ya espera la pausa puesta arriba
          bloqueados[mio] = true;
          break;
        }
        if (res.status === 401 || res.status === 403) { pararTodo = new Error('AUTH_FAILED'); return; }
        if (res.ok) {
          _429Seguidos = 0;   // una respuesta buena de verdad rompe la racha
          const raw = await res.json();
          resultados[mio] = raw;
          // con listas largas esto permite guardar sobre la marcha en vez de
          // perderlo todo si se cierra la pestaña a mitad (ver onItem en runBulk/completarPortadas)
          if (onItem) onItem(raw);
        }
        break;
      }
      hechos++;
      if (onProgress) onProgress(hechos, ids.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCIA, ids.length) }, trabajador));
  if (pararTodo) throw pararTodo;
  // el hueco entre "donde nos quedamos" (i) y el final nunca se llegó a
  // intentar por culpa del bloqueo — hay que marcarlo también como
  // bloqueado (no como "no existe"), o se perdería de la cola sin más
  if (bloqueoDetectado) for (let k = i; k < ids.length; k++) bloqueados[k] = true;
  resultados.bloqueados = bloqueados;
  resultados.bloqueoDetectado = bloqueoDetectado;
  return resultados;
}

const URL_ONE = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(album|track|artist)\/([a-zA-Z0-9]+)/i;
const URL_ALL = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(album|track|artist)\/([a-zA-Z0-9]+)/gi;
const URL_PLAYLIST = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?playlist\/([a-zA-Z0-9]+)/gi;
const URL_PLAYLIST_ONE = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?playlist\/([a-zA-Z0-9]+)/i;

/* Trae hasta 500 canciones de una playlist pública, paginando de 100 en 100. */
async function fetchPlaylist(id, onProgress) {
  const t = await spotifyToken();
  const fields = 'items(track(id,name,external_urls,artists(name),duration_ms,album(id,name,images,release_date,external_urls,artists(name),total_tracks))),total';
  let out = [], offset = 0, total = null;
  while (offset < 500) {
    const res = await fetchConReintento429(`https://api.spotify.com/v1/playlists/${id}/tracks?limit=100&offset=${offset}&fields=${encodeURIComponent(fields)}`, t);
    if (res.status === 429) throw new Error('RATE_LIMIT');
    if (!res.ok) throw new Error('PLAYLIST_FAILED:' + res.status);
    const d = await res.json();
    if (total === null) total = d.total;
    const batch = (d.items || []).map(i => i && i.track).filter(x => x && x.id);
    out = out.concat(batch);
    onProgress?.(out.length, Math.min(total, 500));
    offset += 100;
    if (offset >= total || !batch.length) break;
  }
  return out;
}

/* Datos ligeros de la playlist en sí (nombre, portada, dueño, nº de canciones),
   para poder guardarla como un marcador — sin traer sus canciones. */
async function fetchPlaylistMeta(id) {
  const t = await spotifyToken();
  const fields = 'id,name,images,owner(display_name),external_urls,tracks.total';
  const res = await fetchConReintento429(`https://api.spotify.com/v1/playlists/${id}?fields=${encodeURIComponent(fields)}`, t);
  if (res.status === 429) throw new Error('RATE_LIMIT');
  if (!res.ok) throw new Error('PLAYLIST_FAILED:' + res.status);
  return res.json();
}

/* Captura todos los metadatos que venga trayendo el objeto de Spotify.
   Los endpoints de búsqueda devuelven objetos simplificados; "Actualizar desde
   Spotify" en la ficha vuelve a pedir el objeto completo (sello, popularidad, géneros…). */
function normalize(raw, type) {
  const base = {
    spotifyId: raw.id, type, title: raw.name,
    coverUrl: null, spotifyUrl: raw.external_urls?.spotify || '', releaseDate: null,
    albumName: null, albumId: null, durationMs: null, totalTracks: null, label: null,
    popularity: typeof raw.popularity === 'number' ? raw.popularity : null,
    genres: raw.genres?.length ? raw.genres : null,
    followers: raw.followers?.total ?? null,
    explicit: null, trackNumber: null, discNumber: null, albumType: null, isrc: null
  };

  if (type === 'album') return Object.assign(base, {
    artists: (raw.artists || []).map(a => a.name),
    coverUrl: raw.images?.[0]?.url || null,
    releaseDate: raw.release_date || null,
    totalTracks: raw.total_tracks ?? null,
    label: raw.label || null,
    albumType: raw.album_type || null
  });

  if (type === 'track') return Object.assign(base, {
    artists: (raw.artists || []).map(a => a.name),
    coverUrl: raw.album?.images?.[0]?.url || null,
    releaseDate: raw.album?.release_date || null,
    albumName: raw.album?.name || null,
    albumId: raw.album?.id || null,
    albumType: raw.album?.album_type || null,
    totalTracks: raw.album?.total_tracks ?? null,
    durationMs: raw.duration_ms ?? null,
    explicit: typeof raw.explicit === 'boolean' ? raw.explicit : null,
    trackNumber: raw.track_number ?? null,
    discNumber: raw.disc_number ?? null,
    isrc: raw.external_ids?.isrc || null
  });

  if (type === 'playlist') return Object.assign(base, {
    artists: raw.owner?.display_name ? [raw.owner.display_name] : [],
    coverUrl: raw.images?.[0]?.url || null,
    totalTracks: raw.tracks?.total ?? null
  });

  return Object.assign(base, {
    artists: [raw.name],
    coverUrl: raw.images?.[0]?.url || null
  });
}

function makeItem(r) {
  return Object.assign({}, r, {
    id: uid(), dateAdded: Date.now(), notes: '', rating: 0, tagIds: [], listened: false
  });
}

/* ---- formateo de metadatos ---- */
const fmtDur = ms => ms ? Math.floor(ms / 60000) + ':' + String(Math.round(ms % 60000 / 1000)).padStart(2, '0') : null;
function fmtDate(d) {
  if (!d) return null;
  const p = String(d).split('-');
  if (p.length === 1) return p[0];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return p.length === 2 ? `${meses[+p[1] - 1]} ${p[0]}` : `${+p[2]} ${meses[+p[1] - 1]} ${p[0]}`;
}
const ALBUM_TYPE_ES = { album: 'Álbum', single: 'Single', compilation: 'Recopilatorio' };

/* Lista completa de metadatos de una ficha, en pares etiqueta/valor. */
function metaPairs(it) {
  const p = [];
  const add = (k, v) => { if (v !== null && v !== undefined && v !== '') p.push([k, v]); };
  add('Tipo', TYPE_LABEL[it.type]);
  add(it.type === 'playlist' ? 'Creador' : 'Artista', artistsOf(it));
  if (it.type === 'track') add('Álbum', it.albumName);
  add(it.type === 'track' ? 'Lanzamiento del álbum' : 'Lanzamiento', fmtDate(it.releaseDate));
  if (it.type !== 'artist' && it.type !== 'playlist' && yearOf(it)) add('Año', yearOf(it));
  add('Formato', ALBUM_TYPE_ES[it.albumType] || it.albumType);
  add('Duración', fmtDur(it.durationMs));
  add('Nº de pista', it.trackNumber ? (it.totalTracks ? `${it.trackNumber} de ${it.totalTracks}` : it.trackNumber) : null);
  if (it.type === 'album') add('Pistas', it.totalTracks);
  if (it.type === 'album' && it.totalDurationMs) {
    const mins = Math.round(it.totalDurationMs / 60000);
    add('Duración total', mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${mins} min`);
  }
  if (it.type === 'playlist') add('Canciones', it.totalTracks);
  add('Disco', it.discNumber && it.discNumber > 1 ? it.discNumber : null);
  add('Explícito', it.explicit === true ? 'Sí' : it.explicit === false ? 'No' : null);
  add('Sello', it.label);
  add('Géneros', it.genres?.length ? it.genres.join(', ') : null);
  /* La popularidad la traia Spotify desde el primer dia y no se ensenaba en
     ningun sitio. Arriba va con barra; aqui, el numero. */
  add('Popularidad', typeof it.popularity === 'number' ? it.popularity + '/100' : null);
  add('Oyentes (seguidores)', it.followers ? it.followers.toLocaleString('es-ES') : null);
  if (it.type !== 'artist' && it.type !== 'playlist') {
    const edad = edadLanzamiento(it);
    if (edad) add('Antigüedad', edad);
  }
  if (it.releaseDateOrig) add('Año que daba Spotify', fmtDate(it.releaseDateOrig) + ' (corregido)');
  add('ISRC', it.isrc);
  add('Guardado', `${new Date(it.dateAdded).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })} (${relDate(it.dateAdded)})`);
  if (it.listenedAt) add('Escuchado', `${new Date(it.listenedAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })} (${relDate(it.listenedAt)})`);
  if (totalPlays(it)) {
    const n = totalPlays(it);
    add('Reproducciones', n >= TOPE_PLAYS ? `${n}+ registradas` : `${n} registrada${n === 1 ? '' : 's'}`);
    add('Primera vez', `${new Date(primeraEscucha(it)).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })} (${relDate(primeraEscucha(it))})`);
  }
  if (!it.manual) add('ID de Spotify', it.spotifyId);
  return p;
}

/* ============ filtering & sorting ============ */

/* El comparador se elige UNA vez, antes de ordenar. Cuando el switch vivía
   dentro del comparador se resolvía en cada una de las cientos de miles de
   comparaciones, y de paso impedía que el motor optimizara la única rama que
   se estaba usando. */
function comparadorDe(s) {
  switch (s) {
    case 'title_asc':   return (a, b) => cmpR(clavesDe(a).tit, clavesDe(b).tit) || cmpR(clavesDe(a).crudo, clavesDe(b).crudo);
    case 'title_desc':  return (a, b) => cmpR(clavesDe(b).tit, clavesDe(a).tit) || cmpR(clavesDe(b).crudo, clavesDe(a).crudo);
    /* Manda el principal: ordenando por la cadena entera, "Ed Sheeran & Justin
       Bieber" se cuela entre las de "Ed Sheeran" y parte el grupo en dos. */
    case 'artist_asc':  return (a, b) => { const x = clavesDe(a), y = clavesDe(b); return cmpR(x.art, y.art) || cmpR(x.full, y.full) || cmpR(x.tit, y.tit) || cmpR(x.crudo, y.crudo); };
    case 'artist_desc': return (a, b) => { const x = clavesDe(a), y = clavesDe(b); return cmpR(y.art, x.art) || cmpR(y.full, x.full) || cmpR(x.tit, y.tit) || cmpR(x.crudo, y.crudo); };
    case 'rating_desc': return (a, b) => (b.rating || 0) - (a.rating || 0) || cmpR(clavesDe(a).tit, clavesDe(b).tit);
    case 'year_desc':   return (a, b) => yearOf(b) - yearOf(a);
    case 'year_asc':    return (a, b) => yearOf(a) - yearOf(b);
    /* Orden manual: solo significa algo dentro de una etiqueta concreta (el
       orden vive en la propia etiqueta). Sin etiqueta elegida se comporta
       como "añadido hace poco", en vez de dejar la lista en un orden
       arbitrario que parecería un fallo. */
    case 'manual': {
      const t = PREFS.tag !== 'all' ? tagById(PREFS.tag) : null;
      if (!t || !t.orden) return (a, b) => b.dateAdded - a.dateAdded;
      /* Un indexOf() por comparación recorría la lista entera cada vez: con una
         etiqueta grande, ordenarla a mano se arrastraba. */
      const pos = new Map(t.orden.map((id, i) => [id, i]));
      return (a, b) => {
        const ia = pos.has(a.id) ? pos.get(a.id) : -1, ib = pos.has(b.id) ? pos.get(b.id) : -1;
        if (ia === -1 && ib === -1) return b.dateAdded - a.dateAdded;
        if (ia === -1) return 1;          // lo que aún no has colocado va al final
        if (ib === -1) return -1;
        return ia - ib;
      };
    }
    // lo nunca escuchado cae al final en vez de mezclarse con lo antiguo
    case 'played_desc': return (a, b) => (b.listenedAt || 0) - (a.listenedAt || 0);
    case 'plays_desc':  return (a, b) => totalPlays(b) - totalPlays(a) || cmpR(clavesDe(a).tit, clavesDe(b).tit);
    case 'added_asc':   return (a, b) => a.dateAdded - b.dateAdded;
    default:            return (a, b) => b.dateAdded - a.dateAdded;
  }
}

/* El heno de la busqueda, calculado una vez por elemento. Se rehace solo si
   el elemento cambia (touchedAt) o si has tocado las etiquetas. */
const _heno = new WeakMap();
function textoBuscable(it) {
  const h = _heno.get(it);
  if (h && h.v === _versionTags && h.m === it.touchedAt && h.t === it.title) return h.s;
  const tagNames = (it.tagIds || []).map(id => tagById(id)?.name).filter(Boolean).join(' ');
  const s = fold(it.title + ' ' + artistsOf(it) + ' ' + (it.notes || '') + ' ' + (it.genres || []).join(' ') + ' ' + tagNames + ' ' + (it.albumName || ''));
  _heno.set(it, { v: _versionTags, m: it.touchedAt, t: it.title, s });
  return s;
}

/* La mezcla activa: incluir unas etiquetas y excluir otras, con "todas a la
   vez" o "cualquiera de ellas". Vive aparte de PREFS.tag para que puedas
   tener una etiqueta suelta puesta y encima una mezcla. */
const mezclaVacia = () => ({ modo: 'y', inc: [], exc: [] });
const mezclaActiva = () => { const m = PREFS.mezcla; return !!(m && ((m.inc || []).length || (m.exc || []).length)); };
function cumpleMezcla(it) {
  const m = PREFS.mezcla;
  if (!m) return true;
  const inc = m.inc || [], exc = m.exc || [];
  if (!inc.length && !exc.length) return true;
  const ids = it.tagIds || [];
  for (const id of exc) if (ids.includes(id)) return false;
  if (!inc.length) return true;
  return m.modo === 'o' ? inc.some(id => ids.includes(id)) : inc.every(id => ids.includes(id));
}

function filtered() {
  const q = fold(document.getElementById('q').value.trim());
  // índice álbum → títulos de sus canciones guardadas, para que buscar el
  // nombre de una canción también encuentre el álbum al que pertenece cuando
  // esa canción está guardada como elemento suelto. Para los álbumes cuya
  // ficha ya abriste, hay algo mejor: it.trackTitles con la lista real (se
  // guarda en cargarTracksAlbum al verla) — este índice es el respaldo para
  // el resto, que no cuesta ninguna petición nueva porque reusa lo que ya
  // tenías guardado como canciones sueltas.
  let cancionesPorAlbum = null;
  if (q) {
    cancionesPorAlbum = new Map();
    ITEMS.forEach(i => {
      if (i.type !== 'track' || !i.albumId) return;
      if (!cancionesPorAlbum.has(i.albumId)) cancionesPorAlbum.set(i.albumId, []);
      cancionesPorAlbum.get(i.albumId).push(fold(i.title));
    });
  }
  let out = ITEMS.filter(it => {
    // archivar no es borrar: se queda en el vault (cuenta en "En el vault"),
    // pero se aparta de todas las listas normales — solo aparece bajo "Archivado"
    if (PREFS.status === 'archived') { if (!it.archived) return false; }
    else if (it.archived) return false;
    if (PREFS.type !== 'all' && it.type !== PREFS.type) return false;
    if (PREFS.canon && !esCanon(it)) return false;
    // un artista no se "escucha" de golpe: no participa en pendiente/escuchado
    if (PREFS.status === 'pending' && (it.listened || it.type === 'artist')) return false;
    if (PREFS.status === 'listened' && (!it.listened || it.type === 'artist')) return false;
    /* "none" no es una etiqueta de verdad: es el filtro de lo que todavía no
       tiene ninguna, que es justo por donde se empieza a ordenar un vault. */
    if (PREFS.tag === 'none') { if ((it.tagIds || []).length) return false; }
    else if (PREFS.tag !== 'all' && !(it.tagIds || []).includes(PREFS.tag)) return false;
    if (!cumpleMezcla(it)) return false;
    if (PREFS.genre !== 'all' && !(it.genres || []).some(g => fold(g) === PREFS.genre)) return false;
    if (PREFS.decade !== 'all') { const y = yearOf(it); if (!y || Math.floor(y / 10) * 10 !== +PREFS.decade) return false; }
    /* Duración: mide la canción, o la del álbum entero si ya la conocemos
       (se guarda al abrir su ficha). Lo que no tiene duración conocida se
       queda fuera al filtrar — decirte "corto" de algo que no he medido
       sería inventar. */
    if (PREFS.dur !== 'all') {
      const ms = it.type === 'album' ? it.totalDurationMs : it.durationMs;
      if (!ms) return false;
      const min = ms / 60000;
      if (PREFS.dur === 'corto' && !(it.type === 'album' ? min < 35 : min < 3)) return false;
      if (PREFS.dur === 'medio' && !(it.type === 'album' ? (min >= 35 && min <= 60) : (min >= 3 && min <= 6))) return false;
      if (PREFS.dur === 'largo' && !(it.type === 'album' ? min > 60 : min > 6)) return false;
    }
    if (q) {
      const texto = textoBuscable(it);
      let coincide = texto.includes(q);
      // "no sight" también saca Yeezus: primero por su propia tracklist (si
      // ya la viste alguna vez), si no por canciones sueltas que apunten a él
      if (!coincide && it.type === 'album') {
        if (it.trackTitles && it.trackTitles.length) coincide = it.trackTitles.some(t => fold(t).includes(q));
        if (!coincide && cancionesPorAlbum.has(it.spotifyId)) coincide = cancionesPorAlbum.get(it.spotifyId).some(t => t.includes(q));
      }
      if (!coincide) return false;
    }
    return true;
  });
  out.sort(comparadorDe(PREFS.sort));
  // segunda pasada estable: lo prioritario sube arriba del todo sin
  // desordenar nada dentro de cada grupo, sea cual sea el criterio elegido
  out.sort((a, b) => (b.prioridad ? 1 : 0) - (a.prioridad ? 1 : 0));
  return out;
}

/* ============ render ============ */
function renderStats() {
  // los artistas y lo archivado no cuentan en pendiente/escuchado (ver filtered())
  const contables = ITEMS.filter(i => i.type !== 'artist' && !i.archived);
  const done = contables.filter(i => i.listened).length;

  document.getElementById('statPending').textContent = contables.length - done;

// se usa desde renderChips() y desde el selector "Ver todos los géneros" —
// separado para que los dos vean siempre el mismo universo de datos
/* Todos los numeros que necesita la barra de filtros salen de UNA pasada, y
   la pasada se guarda: mientras no cambie el vault ni las etiquetas,
   repintar no vuelve a contar nada. Antes eran siete recorridos completos
   del vault por cada repintado, y con 17.000 elementos eso era la mitad de
   lo que costaba dibujar la pantalla. */
let _versionItems = 0;
const invalidarConteos = () => { _versionItems++; };
let _conteos = null, _claveConteos = '';
function conteosChips() {
  const enArchivo = PREFS.status === 'archived';
  const clave = enArchivo + '|' + ITEMS.length + '|' + _versionItems + '|' + _versionTags;
  if (_conteos && _claveConteos === clave) return _conteos;
  const tipos = { all: 0, album: 0, track: 0, artist: 0, playlist: 0 };
  const decadas = {}, freq = {}, label = {}, cuentaTag = new Map();
  let sinEtiquetar = 0, nCanon = 0;
  for (const i of ITEMS) {
    if (enArchivo ? !i.archived : i.archived) continue;
    tipos.all++;
    if (tipos[i.type] !== undefined) tipos[i.type]++;
    if (i.releaseDate) {
      const y = parseInt(String(i.releaseDate).slice(0, 4), 10);
      if (y) { const d = Math.floor(y / 10) * 10; decadas[d] = (decadas[d] || 0) + 1; }
    }
    const gs = i.genres;
    if (gs) for (const g of gs) { const k = fold(g); if (k) { freq[k] = (freq[k] || 0) + 1; if (!label[k]) label[k] = g; } }
    const ids = i.tagIds;
    if (!ids || !ids.length) sinEtiquetar++;
    else for (const id of ids) cuentaTag.set(id, (cuentaTag.get(id) || 0) + 1);
    if (esCanon(i)) nCanon++;
  }
  _conteos = { tipos, decadas, freq, label, cuentaTag, sinEtiquetar, nCanon };
  _claveConteos = clave;
  return _conteos;
}

function renderChips() {
  // los números de los chips reflejan el mismo universo que ve filtered():
  // lo archivado normalmente no cuenta, pero si estás viendo "Archivado" sí
  // tiene sentido que los chips describan lo archivado, no el resto del vault
  const enArchivo = PREFS.status === 'archived';
  const C = conteosChips();
  const countType = t => C.tipos[t] || 0;

  // Por década: dato fiable (releaseDate llega para la mayoría de álbumes y
  // canciones), así que estos chips sí van a verse casi siempre.
  const decades = Object.entries(C.decadas).sort((a, b) => +a[0] - +b[0]);   // cronológico, no por frecuencia


  const chipsTipo = [
    `<button class="chip ${PREFS.type === 'all' ? 'on' : ''}" data-type="all">Todo <span class="ct">${C.tipos.all}</span></button>`,
    ...['album', 'track', 'artist'].map(t =>
      `<button class="chip ${PREFS.type === t ? 'on' : ''}" data-type="${t}">${TYPE_ICON[t]} ${TYPE_PLURAL[t]} <span class="ct">${countType(t)}</span></button>`),
    // el chip de playlists solo aparece si tienes alguna guardada: es un tipo poco
    // frecuente y mostrarlo siempre a cero sería ruido en la barra de filtros
    ...(countType('playlist') ? [`<button class="chip ${PREFS.type === 'playlist' ? 'on' : ''}" data-type="playlist">${TYPE_ICON.playlist} ${TYPE_PLURAL.playlist} <span class="ct">${countType('playlist')}</span></button>`] : [])
  ];
  const chipsDecada = decades.map(([dec, n]) =>
    `<button class="chip decade ${PREFS.decade === dec ? 'on' : ''}" data-decade="${dec}">${dec}s <span class="ct">${n}</span></button>`);
  const cuentaTag = C.cuentaTag, sinEtiquetar = C.sinEtiquetar;
  /* Con 254 etiquetas, pintarlas todas en la barra la deja inservible: salen
     las que mas cosas tienen aqui (mas la que tengas puesta, este donde este)
     y el resto detras de un boton, igual que los generos. */
  const TOPE_CHIPS_TAG = 10;
  const tagsPorUso = tagsOrdenados().filter(t => cuentaTag.get(t.id)).sort((a, b) => cuentaTag.get(b.id) - cuentaTag.get(a.id));
  let tagsVisibles = tagsPorUso.slice(0, TOPE_CHIPS_TAG);
  if (PREFS.tag && PREFS.tag !== 'all' && PREFS.tag !== 'none' && !tagsVisibles.some(t => t.id === PREFS.tag)) {
    const act = tagsOrdenados().find(t => t.id === PREFS.tag);
    if (act) tagsVisibles = [act, ...tagsVisibles.slice(0, TOPE_CHIPS_TAG - 1)];
  }
  const chipsTag = tagsVisibles.map(t =>
    `<button class="chip ${PREFS.tag === t.id ? 'on' : ''}" data-tag="${esc(t.id)}">${iconoHtml(t, 13)}${esc(t.name)} <span class="ct">${(cuentaTag.get(t.id) || 0).toLocaleString('es-ES')}</span></button>`);
  if (tagsPorUso.length > tagsVisibles.length) chipsTag.push(`<button class="chip" data-tagall="1">${ui('etiqueta')} Ver todas (${tagsPorUso.length})</button>`);
  /* El sello no es una etiqueta guardada, asi que necesita su propio filtro. */
  const nCanon = C.nCanon;
  if (nCanon) chipsTag.unshift(`<button class="chip canon ${PREFS.canon ? 'on' : ''}" data-canon="1">${ICO_LAUREL} Aclamados <span class="ct">${nCanon.toLocaleString('es-ES')}</span></button>`);
  if (mezclaActiva()) {
    const mm = PREFS.mezcla;
    const dentro = (mm.inc || []).length, fuera = (mm.exc || []).length;
    const txt = (dentro ? dentro + (mm.modo === 'o' ? ' cualquiera' : ' a la vez') : '') + (fuera ? (dentro ? ' · ' : '') + fuera + ' fuera' : '');
    chipsTag.unshift(`<button class="chip on mezchip" data-abrirmezcla="1" title="Tienes una mezcla puesta">${ui('destello')} Mezcla: ${txt} <span class="quitamez">${ui('cerrar')}</span></button>`);
  }
  if (sinEtiquetar) chipsTag.push(`<button class="chip ${PREFS.tag === 'none' ? 'on' : ''}" data-tag="none">${ui('etiqueta')} Sin etiqueta <span class="ct">${sinEtiquetar}</span></button>`);
  const DUR_ET = { corto: 'Corto', medio: 'Medio', largo: 'Largo' };
  const chipsDur = ['corto', 'medio', 'largo'].map(d =>
    `<button class="chip ${PREFS.dur === d ? 'on' : ''}" data-dur="${d}">${ui('crono')} ${DUR_ET[d]}</button>`);
  const chipsVistas = [];   // las vistas guardadas se retiraron: nunca se usaban

  // separadores finos entre grupos: con tipo + duración + década + etiquetas la
  // fila puede crecer mucho, y un separador ayuda a distinguir de un vistazo
  // dónde empieza cada tipo de filtro sin tener que leerlos todos
  const parts = [chipsVistas, chipsTipo, chipsDur, chipsDecada, chipsTag]
    .filter(grupo => grupo.length)
    .flatMap((grupo, i) => i === 0 ? grupo : ['<span class="chipdiv"></span>', ...grupo]);
  document.getElementById('chips').innerHTML = parts.join('');
}

/* El principal en primer plano y los colaboradores detrás y más apagados: la
   línea se corta con puntos suspensivos, así lo primero que se lee siempre es

/* Tanda visible. Se reinicia sola cuando cambian filtros, orden o búsqueda:
   así no hay que acordarse de resetearla en cada sitio que llama a render(). */
/* La entrada escalonada de las tarjetas solo tiene gracia cuando la lista
   cambia de verdad (otro filtro, otra busqueda). Al pulsar "Ver mas" o al
   marcar algo como escuchado, volver a animarlo todo marea. */
let _gridNueva = false;
const tanda = () => PREFS.tanda || 120;   // configurable en Ajustes ("Elementos por pagina")
let VISTAS = tanda(), _firma = null;

function render() {
  /* En Inicio no hay lista que filtrar ni ordenar: se sale antes de tocar nada
     de eso, así entrar y salir es instantáneo aunque el vault sea enorme. */
  if (PREFS.pantalla === 'inicio') {
    document.body.classList.add('en-inicio');
    const hb = document.getElementById('homeBtn');
    hb.innerHTML = ui('baul', 18); hb.title = 'Ver el vault';
    renderInicio();
    return;
  }
  document.body.classList.remove('en-inicio');
  const hb = document.getElementById('homeBtn');
  hb.innerHTML = ui('casa', 18); hb.title = 'Inicio';

  const firma = [PREFS.type, PREFS.status, PREFS.tag, PREFS.sort,
                 document.getElementById('q').value.trim()].join('');
  _gridNueva = firma !== _firma;
  if (_gridNueva) { _firma = firma; VISTAS = tanda(); }

  renderStats();
  renderChips();
  renderSelBar();
  document.getElementById('sortSel').value = PREFS.sort;
  document.getElementById('viewBtn').innerHTML = PREFS.view === 'grid' ? ui('rejilla', 18) : ui('filas', 18);

  const box = document.getElementById('results');
  const line = document.getElementById('resultline');

  if (ITEMS.length === 0) {
    line.innerHTML = '';
    box.innerHTML = `<div class="empty">
      <div class="ico">${ui('baul')}</div>
      <h2>Tu vault está vacío</h2>
      <p>Guarda álbumes, canciones y artistas de Spotify para no perderlos de vista. Nada se reproduce aquí: esto es tu lista de lo que quieres escuchar.</p>
      <div class="acts">
        <button class="btn primary" data-open="search">Buscar en Spotify</button>
        <button class="btn" data-open="bulk">Pegar enlaces</button>
      </div>
    </div>`;
    return;
  }

  const rows = filtered();
  renderIndiceAZ(rows);
  const anyFilter = PREFS.type !== 'all' || PREFS.status !== 'all' || PREFS.tag !== 'all' || PREFS.genre !== 'all' || PREFS.decade !== 'all' || PREFS.dur !== 'all' || mezclaActiva() || document.getElementById('q').value.trim();
  // con un vault grande, filtrar (p. ej. "álbumes de los 70") y no poder
  // seleccionar todo ese grupo de golpe para archivarlo/etiquetarlo obligaba
  // a marcarlos uno a uno a mano — esto selecciona TODO lo que cumple el
  // filtro actual, no solo lo que hay pintado en pantalla ahora mismo
  const acciones = [];
  if (rows.length) acciones.push(`<button class="pillbtn accent" data-selall="1">${ui('visto')} Seleccionar ${rows.length === ITEMS.length ? 'todo' : `estos ${rows.length.toLocaleString('es-ES')}`}</button>`);
  if (anyFilter) acciones.push(`<button class="pillbtn" data-clear="1">${ui('cerrar')} Quitar filtros</button>`);
  if (PREFS.tag !== 'all') acciones.push(`<button class="pillbtn" data-ordenar="1">${ui('ordenar')} Ordenar</button>`);
  line.innerHTML = `<span>${rows.length} de ${ITEMS.length}</span>${acciones.length ? `<span style="display:flex;gap:8px;">${acciones.join('')}</span>` : ''}`;

  if (rows.length === 0) {
    box.innerHTML = PREFS.status === 'archived'
      ? `<div class="empty">
          <div class="ico">${ui('archivo')}</div>
          <h2>Nada archivado por aquí</h2>
          <p>No has archivado nada todavía, o nada archivado coincide con estos filtros. Archivar algo (desde su ficha, o seleccionando varios) lo saca de tus listas normales sin borrarlo.</p>
          <div class="acts"><button class="btn" data-clear="1">Quitar filtros</button></div>
        </div>`
      : `<div class="empty">
          <div class="ico">${ui('lupa')}</div>
          <h2>Nada coincide</h2>
          <p>Prueba a quitar algún filtro o a buscar otra cosa.</p>
          <div class="acts"><button class="btn" data-clear="1">Quitar filtros</button></div>
        </div>`;
    return;
  }

  /* Con un vault de miles de elementos, pintarlos todos de golpe bloquea el
     móvil varios segundos. Dibujamos por tandas. */
  const visibles = rows.slice(0, VISTAS);
  const restan = rows.length - visibles.length;
  const groups = groupsFor(visibles);
  const draw = list => PREFS.view === 'grid'
    ? `<div class="grid${_gridNueva ? ' recien' : ''}">${list.map(it => gcard(it)).join('')}</div>`
    : `<div class="list">${list.map(it => lrow(it)).join('')}</div>`;

  box.innerHTML = (groups
    ? groups.map(g => `<section class="group"><h3 class="ghead">${esc(g.key)}<span class="gcount">${g.items.length}</span></h3>${draw(g.items)}</section>`).join('')
    : draw(visibles))
    + (restan > 0
      ? `<button class="btn vermas" data-more="1">Ver más — quedan ${restan.toLocaleString('es-ES')}</button>`
      : '');
}

/* ============ pantalla de inicio ============ */

/* Índice de artistas: agrupa por artista principal (la misma clave que usan
   las cabeceras de la lista) y deja fuera las fichas de artista, que no son
   discos ni canciones — el número de al lado cuenta lo que tienes SUYO. */
/* Agrupar 17.000 elementos y ordenar 4.000 nombres cuesta lo suyo para hacerlo
   cada vez que entras y sales de Inicio. META.updatedAt cambia en cada guardado,
   así que sirve de marca: mientras no toques el vault, vale el índice de antes. */
let _indiceCache = null;
function indiceArtistas() {
  if (_indiceCache && _indiceCache.marca === META.updatedAt && _indiceCache.n === ITEMS.length) return _indiceCache.lista;
  const m = new Map();
  for (const it of ITEMS) {
    /* Lo archivado se aparta de las listas, pero no deja de ser de su artista:
       si lo despliegas tiene que salir, marcado, o parece que se ha perdido. */
    if (it.type === 'artist') continue;
    const k = claveArtista(it);
    if (!k) continue;
    let g = m.get(k);
    if (!g) { g = { clave: k, nombre: principalDe(it), items: [] }; m.set(k, g); }
    g.items.push(it);
  }
  const lista = [...m.values()].sort((a, b) => cmp(sortKey(a.nombre), sortKey(b.nombre)));
  _indiceCache = { marca: META.updatedAt, n: ITEMS.length, lista };
  return lista;
}

let VISTOS_ARTISTAS = 60;                  // artistas pintados; crece con "Ver más"
const ARTISTAS_ABIERTOS = new Set();       // cuáles están desplegados
const TAGS_ABIERTAS = new Set();
const CARPETAS_ABIERTAS = new Set();

const itemsDeTag = id => ITEMS.filter(i => (i.tagIds || []).includes(id));

/* La fila de una etiqueta enseña la portada de lo último que le pusiste: con
   veinte etiquetas, reconocerlas por la carátula es más rápido que leerlas. */
function filaTag(t, dentro) {
  const items = itemsDeTag(t.id);
  const abierta = TAGS_ABIERTAS.has(t.id);
  /* Antes esta fila ensenaba la caratula de un disco cualquiera de la etiqueta.
     Con etiquetas distintas salian cuadraditos de colores sin relacion entre si
     y la lista parecia un collage. El icono de la etiqueta, sobre su propio
     color, dice lo mismo y deja la columna alineada. */
  const emblema = `<span class="tgbadge" style="width:32px;height:32px;background:${esc(t.colorHex)}1f;">${iconoHtml(t, 19)}</span>`;
  return `<button class="crow ${dentro ? 'dentro' : ''} ${abierta ? 'abierta' : ''}" data-tag2="${esc(t.id)}">
      <span class="ci">${emblema}</span><span class="ct">${esc(t.name)}</span><span class="cn">${items.length}</span>
    </button>${abierta ? `<div class="aexp">${items.length
      ? items.slice().sort(ordenDentroDeArtista).slice(0, 40).map(filaElemento).join('')
        + (items.length > 40 ? `<div class="irow" data-vertag="${esc(t.id)}"><div class="ii"><div class="it" style="color:var(--amber);">Ver las ${items.length} en el vault →</div></div></div>` : '')
      : `<div class="irow"><div class="ii"><div class="it" style="font-weight:500;color:var(--fg-mute);">Todavía no has puesto esta etiqueta a nada.</div></div></div>`}</div>` : ''}`;
}

function bloqueEtiquetas() {
  const carpetas = carpetasOrdenadas(), sueltas = tagsDeCarpeta(null);
  if (!carpetas.length && !sueltas.length) {
    return `<p class="lede">Las etiquetas son lo que convierte 17.000 canciones en algo que se puede mirar. Crea la primera en Ajustes → Etiquetas.</p>`;
  }
  return `<div class="card">${carpetas.map(c => {
    const abierta = CARPETAS_ABIERTAS.has(c.id);
    const dentro = tagsDeCarpeta(c.id);
    return `<button class="crow ${abierta ? 'abierta' : ''}" data-carp="${esc(c.id)}">
        <span class="ci"><span class="tgbadge" style="width:30px;height:30px;background:${esc(c.colorHex)}22;">${iconoHtml(c, 18)}</span></span>
        <span class="ct">${esc(c.name)}</span><span class="cn">${dentro.length} ${abierta ? ui('abajo') : ui('derecha')}</span>
      </button>${abierta ? dentro.map(t => filaTag(t, true)).join('') || `<div class="aexp"><div class="irow"><div class="ii"><div class="it" style="font-weight:500;color:var(--fg-mute);">Carpeta vacía.</div></div></div></div>` : ''}`;
  }).join('')}${sueltas.map(t => filaTag(t, false)).join('')}</div>`;
}

/* Dentro de un artista: primero los discos, luego las canciones, y dentro de
   cada grupo lo más nuevo arriba — que es como se busca algo de alguien. */
const ordenDentroDeArtista = (a, b) =>
  (a.type === b.type ? 0 : a.type === 'album' ? -1 : 1) || (yearOf(b) - yearOf(a)) || cmp(clavesDe(a).tit, clavesDe(b).tit);

function filaElemento(it) {
  const y = yearOf(it);
  return `<div class="irow" data-abrir="${it.id}">
    <div class="ip">${portada(it.coverUrl, TYPE_ICON[it.type], true)}</div>
    <div class="ii">

      <div class="ig">${y ? `<span class="gchip">${ui('calendario')} ${y}</span>` : ''}<span class="gchip">${TYPE_ICON[it.type]} ${TYPE_LABEL[it.type]}</span>${it.archived ? `<span class="gchip apagado">${ui('archivo')} Archivado</span>` : ''}</div>
    </div>
    ${it.spotifyUrl ? `<button class="spotbtn" data-spot="${esc(it.spotifyUrl)}" title="Abrir en Spotify" aria-label="Abrir en Spotify">${ICO_SPOT}</button>` : ''}
  </div>`;
}

/* La lista de artistas se pinta aparte del resto de Inicio por dos motivos:
   escribir en el buscador no puede repintar (ni desenfocar) el campo donde
   estas escribiendo, y al bajar la lista se amplia sola sin pulsar nada. */
let FILTRO_ARTISTA = '';
let _observador = null;

function pintarArtistas() {
  const zona = document.getElementById('zonaArtistas');
  if (!zona) return;
  const q = fold(FILTRO_ARTISTA.trim());
  const todos = indiceArtistas();
  const artistas = q ? todos.filter(g => fold(g.nombre).includes(q)) : todos;
  const visibles = artistas.slice(0, VISTOS_ARTISTAS);
  const restan = artistas.length - visibles.length;
  zona.innerHTML = (!artistas.length
    ? `<p class="lede">Ningún artista con ese nombre.</p>`
    : `<div class="card">${visibles.map(g => {
        const abierto = ARTISTAS_ABIERTOS.has(g.clave);
        return `<button class="crow ${abierto ? 'abierta' : ''}" data-art="${esc(g.clave)}">
          <span class="ci">${abierto ? ui('abajo') : ui('persona')}</span><span class="ct">${esc(g.nombre)}</span><span class="cn">${g.items.length}</span>
        </button>${abierto ? `<div class="aexp">${g.items.slice().sort(ordenDentroDeArtista).map(filaElemento).join('')}</div>` : ''}`;
      }).join('')}</div>`)
    + (restan > 0 ? `<div class="masart" id="masArt">Cargando ${Math.min(restan, 120).toLocaleString('es-ES')} más…</div>` : '');

  /* En vez de un boton "Ver mas" al que hay que perseguir, un centinela al
     final: cuando asoma por la pantalla, la lista se amplia sola. */
  if (_observador) _observador.disconnect();
  const centinela = document.getElementById('masArt');
  if (centinela) {
    _observador = new IntersectionObserver(entradas => {
      if (entradas.some(e => e.isIntersecting)) { VISTOS_ARTISTAS += 120; pintarArtistas(); }
    }, { rootMargin: '400px' });
    _observador.observe(centinela);
  }
}

      <button class="crow" data-acc="revision"><span class="ci">${ui('ajustes')}</span><span class="ct">Arreglar el vault</span></button>
      <button class="crow" data-acc="anyos"><span class="ci">${ui('calendario')}</span><span class="ct">Revisar años mal puestos</span></button>
