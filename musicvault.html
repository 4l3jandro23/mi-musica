/* Cambiar de pantalla se recuerda: si te gusta empezar en el vault, te quedas
   en el vault, y si te gusta empezar aquí, te quedas aquí. */
/* Plegar y desplegar repinta la pantalla entera, así que hay que devolver la
   fila que has tocado a la misma altura de pantalla en la que estaba: si no,
   al abrir algo que está a mitad de la lista, el contenido salta bajo el dedo. */
function alternar(conjunto, clave, boton, attr, pintor) {   // attr: por que atributo reencontrar la fila tras repintar
  conjunto.has(clave) ? conjunto.delete(clave) : conjunto.add(clave);
  const antes = boton.getBoundingClientRect().top;
  const sel = `[${attr}="${CSS.escape(clave)}"]`;
  (pintor || renderInicio)();
  const otra = document.querySelector(sel);
  if (otra) window.scrollBy(0, otra.getBoundingClientRect().top - antes);
}

function irAPantalla(p) {
  PREFS.pantalla = p;
  savePrefs();
  window.scrollTo(0, 0);
  render();
}

/* Agrupa solo cuando el orden lo hace significativo: por artista, por inicial o por década. */
function groupsFor(rows) {
  const s = PREFS.sort;
  /* Buscando "algo" sin filtrar por tipo, lo útil es ver de un vistazo qué es
     álbum, qué canción y qué artista — no una lista plana donde se mezclan.
     Solo cuando buscas: en la vista normal manda el orden que hayas elegido. */
  if (document.getElementById('q').value.trim() && PREFS.type === 'all') {
    const orden = ['artist', 'album', 'track', 'playlist'];
    const porTipo = new Map();
    rows.forEach(it => { if (!porTipo.has(it.type)) porTipo.set(it.type, []); porTipo.get(it.type).push(it); });
    const out = orden.filter(t => porTipo.has(t)).map(t => ({ key: TYPE_PLURAL[t] || t, items: porTipo.get(t) }));
    return out.length > 1 ? out : null;   // con un solo tipo, agrupar no aporta nada
  }
  let keyOf = null, tituloDe = null;   // keyOf agrupa (normalizado), tituloDe es lo que se lee en la cabecera
  if (s.startsWith('artist')) { keyOf = claveArtista; tituloDe = it => principalDe(it) || 'Sin artista'; }
  else if (s.startsWith('title')) keyOf = it => { const c = (sortKey(it.title)[0] || '#').toUpperCase(); return /\p{L}/u.test(c) ? c : '#'; };
  else if (s.startsWith('year')) keyOf = it => { const y = yearOf(it); return y ? Math.floor(y / 10) * 10 + 's' : 'Sin año'; };
  if (!keyOf) return null;

  const out = [];
  let cur = null, curK = null;
  for (const it of rows) {
    const k = keyOf(it);
    if (!cur || curK !== k) { curK = k; cur = { key: tituloDe ? tituloDe(it) : k, items: [] }; out.push(cur); }
    cur.items.push(it);
  }
  return out;
}

/* Inicial de un elemento según el orden activo — misma normalización que usa
   groupsFor para las cabeceras, así el salto siempre cae donde debe. */
function letraDe(it) {
  const k = clavesDe(it);
  const c = ((PREFS.sort.startsWith('artist') ? k.art : k.tit)[0] || '#').toUpperCase();
  return /\p{L}/u.test(c) ? c : '#';
}

const ordenAlfabetico = () => PREFS.sort.startsWith('artist') || PREFS.sort.startsWith('title');

// 0 = grande (2 columnas, como siempre), 1 = media, 2 = pequeña
function aplicarTamanoCaratula() {
  document.documentElement.style.setProperty('--gcols', 2 + (PREFS.gcardSize || 0));
}

function renderIndiceAZ(rows) {
  const rail = document.getElementById('azRail');
  if (!rail) return;
  // con pocos elementos scrollear no duele, y el orden por año/fecha no tiene inicial que valga
  if (!ordenAlfabetico() || rows.length < 40) { rail.classList.add('hidden'); rail.innerHTML = ''; return; }
  /* "rows" trae lo prioritario subido arriba del todo (ver el segundo sort de
     filtered()), así que el orden en que salen las letras al recorrerlo no
     vale: si algo con "W" es prioritario, la "W" se colaría antes que la "A".
     Antes eso se arreglaba reordenando OTRA VEZ el vault entero — el segundo
     orden más caro de cada render. Pero letras hay treinta y pico: se recogen
     de una pasada y se ordenan ellas, que da lo mismo y no cuesta nada. A qué
     elemento saltar al tocarlas sigue mirando el orden real (rows). */
  const letras = [...new Set(rows.map(letraDe))].sort((a, b) => (b === '#') - (a === '#') || cmp(a, b) || (a < b ? -1 : a > b ? 1 : 0));
  rail.classList.remove('hidden');
  rail.innerHTML = letras.map(l => `<button data-az="${esc(l)}">${esc(l)}</button>`).join('');
}

/* Saltar a una letra con la lista paginada: si esa letra todavía no se ha
   pintado (está más allá de VISTAS), se amplía lo justo para incluirla antes
   de desplazarse — si no, el scrollIntoView no encontraría nada. */
function saltarALetra(letra) {
  const rows = filtered();
  const idx = rows.findIndex(it => letraDe(it) === letra);
  if (idx === -1) return;
  if (idx >= VISTAS) { VISTAS = idx + tanda(); render(); }
  const objetivo = PREFS.sort.startsWith('artist')
    ? letraDe(rows[idx]) && rows[idx]                 // por artista las cabeceras son nombres: uso el elemento
    : null;
  const cabeceras = [...document.querySelectorAll('#results .ghead')];
  const dest = objetivo
    ? document.querySelector(`#results [data-id="${objetivo.id}"]`)
    : cabeceras.find(h => h.textContent.trim().charAt(0).toUpperCase() === letra);
  (dest || document.querySelector(`#results [data-id="${rows[idx].id}"]`))
    ?.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

/* Un "ding" corto con Web Audio, sin archivo de sonido que descargar ni
   mantener. navigator.vibrate no existe en Safari de iOS (nunca lo ha
   implementado), pero el guard no hace daño y sí sirve en Android. */
let _audioCtx = null;
function sonidoEscuchado() {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.start(); osc.stop(ctx.currentTime + 0.2);
  } catch {}
  if (navigator.vibrate) navigator.vibrate(15);
}

/* ============ item actions ============ */
function toggleListened(id) {
  const it = ITEMS.find(i => i.id === id);
  if (!it) return;
  it.listened = !it.listened;
  it.listenedAt = it.listened ? Date.now() : null;
  it.touchedAt = Date.now();   // edición deliberada: debe ganarle a una tumba vieja de otro dispositivo
  // marcar el álbum entero escuchado marca todas sus canciones, y al revés
  // (ver toggleCancionEscuchada) — para que el estado del álbum y el de su
  // lista de canciones no se lleven la contraria
  if (it.type === 'album') {
    it.cancionesEscuchadas = it.listened ? (it.trackTitles || []).slice() : [];
    if (_tracklistCache && _tracklistCache.albumId === it.spotifyId) pintarTracklist(it);
  }
  if (it.listened) sonidoEscuchado();
  saveItems();
  render();
}

// El aviso de "Deshacer" ya protege de un borrado sin querer, pero a quien
// prefiera algo más explícito le vale más un confirm() antes de que pase nada.
// Los borrados masivos ("Limpiar el vault") ya tienen su propio confirm
// incondicional aparte — este es solo para borrar uno o varios a mano.
function confirmarBorradoSiHaceFalta(n) {
  if (!PREFS.confirmarBorrado) return true;
  return confirm(`¿Borrar ${n} elemento${n === 1 ? '' : 's'}? Podrás deshacerlo justo después.`);
}

async function copiarEnlaces(items, mensajeUno) {
  const enlaces = items.map(it => it.spotifyUrl).filter(Boolean);
  if (!enlaces.length) { toast('No hay enlace que copiar'); return; }
  try {
    await navigator.clipboard.writeText(enlaces.join('\n'));
    toast(enlaces.length === 1 ? mensajeUno : `${enlaces.length} enlaces copiados`);
  } catch {
    toast('No se pudo copiar (el navegador bloqueó el portapapeles)');
  }
}

function deleteItems(ids) {
  // con selecciones grandes (p. ej. "Seleccionar todo lo filtrado"), comprobar
  // ids.includes(...) por cada elemento del vault es lento — un Set lo evita
  const idSet = new Set(ids);
  const removed = ITEMS.filter(i => idSet.has(i.id));
  ITEMS = ITEMS.filter(i => !idSet.has(i.id));
  tombstone(removed);
  TRASH = TRASH.concat(removed.map(it => Object.assign({}, it, { deletedAt: Date.now() })));
  saveTrash();
  saveItems();
  render();
  toast(`${removed.length} eliminado${removed.length === 1 ? '' : 's'}`, 'Deshacer', () => {
    /* Si el borrado ya llegó a sincronizarse antes de pulsar Deshacer, el otro
       dispositivo (o incluso este, en la próxima sincronización) sigue trayendo
       esa tumba del remoto. dateAdded no cambia al deshacer, así que sin esto
       la tumba vieja seguiría siendo "más nueva" que el ítem y lo volvería a
       matar en cuanto se sincronizase otra vez. touchedAt es la fecha que
       cuenta para decidir contra las tumbas; dateAdded se queda intacto para
       no romper el orden "añadido el" ni las estadísticas. */
    removed.forEach(it => { it.touchedAt = Date.now(); });
    ITEMS = ITEMS.concat(removed);
    untombstone(removed);
    const idsVueltos = new Set(removed.map(it => it.id));
    TRASH = TRASH.filter(t => !idsVueltos.has(t.id));
    saveTrash();
    saveItems();
    render();
  }, 9000);   // borrar es fácil de tocar sin querer: más margen que el resto de avisos
}

function restaurarDePapelera(id) {
  const idx = TRASH.findIndex(t => t.id === id);
  if (idx === -1) return;
  const it = Object.assign({}, TRASH[idx]);
  delete it.deletedAt;
  it.touchedAt = Date.now();   // igual razón que en el Deshacer: gana a una tumba vieja
  TRASH.splice(idx, 1);
  ITEMS.push(it);
  untombstone([it]);
  saveTrash(); saveItems(); render();
  toast('Restaurado: ' + it.title);
}

function openPapelera() {
  purgarPapelera();
  const lista = TRASH.slice().sort((a, b) => b.deletedAt - a.deletedAt);
  showSheet(`
    <div class="sheethead"><h2>Papelera</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">${ui('cerrar', 17)}</button></div>
    <p class="lede">Lo que borres se queda aquí 7 días antes de irse del todo, por si acaso. Solo en este dispositivo — no se sincroniza con los demás.</p>
    ${lista.length ? `<div class="list">${lista.map(it => `
      <article class="lrow" data-id="${it.id}">
        <div class="lart">${portada(it.coverUrl, TYPE_ICON[it.type], true)}</div>
        <div class="linfo"><div class="lt">${esc(it.title)}</div><div class="la">${esc(artistsOf(it))} · borrado ${relDate(it.deletedAt)}</div></div>
        <button class="btn" data-restore="${it.id}">Restaurar</button>
      </article>`).join('')}</div>` : `<p class="lede" style="margin:0;">La papelera está vacía.</p>`}
  `);
  document.querySelector('#modalRoot .list')?.addEventListener('click', e => {
    const b = e.target.closest('[data-restore]'); if (!b) return;
    restaurarDePapelera(b.dataset.restore);
    openPapelera();
  });
}

/* Todo lo que el scrobbling añadió solo (nueva.autoAdded), para poder
   auditarlo de un vistazo y borrar lo que no cuadre — como el caso de la
   pista mal etiquetada por el propio Spotify. Marcarla aquí como "revisada"
   no borra el dato: simplemente dice "ya la miré y está bien", para no tener
   que repasar siempre la misma lista entera. */
function openAutoAdded() {
  const lista = ITEMS.filter(i => i.autoAdded && !i.archived).sort((a, b) => b.dateAdded - a.dateAdded);
  showSheet(`
    <div class="sheethead"><h2>Añadidas automáticamente</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">${ui('cerrar', 17)}</button></div>
    <p class="lede">Todo lo que se añadió solo porque sonó en tu Spotify, no porque tú lo guardaras. Revisa y borra lo que no sea lo que creías escuchar.</p>
    ${lista.length ? `<div class="list">${lista.map(it => `
      <article class="lrow" data-id="${it.id}">
        <div class="lart">${portada(it.coverUrl, TYPE_ICON[it.type], true)}</div>
        <div class="linfo"><div class="lt">${esc(it.title)}</div><div class="la">${esc(artistsOf(it))} · ${relDate(it.dateAdded)}</div></div>
        <button class="xbtn" data-quitarauto="${it.id}" aria-label="Ya no es automática">${ui('visto')}</button>
        <button class="xbtn" data-delauto="${it.id}" aria-label="Eliminar">${ui('cerrar')}</button>
      </article>`).join('')}</div>` : `<p class="lede" style="margin:0;">No hay nada añadido automáticamente ahora mismo.</p>`}
  `);
  document.querySelector('#modalRoot .list')?.addEventListener('click', e => {
    const del = e.target.closest('[data-delauto]');
    if (del) { deleteItems([del.dataset.delauto]); openAutoAdded(); return; }
    const quitar = e.target.closest('[data-quitarauto]');
    if (quitar) {
      const it = ITEMS.find(x => x.id === quitar.dataset.quitarauto);
      if (it) { delete it.autoAdded; it.touchedAt = Date.now(); saveItems(); render(); }
      openAutoAdded();
    }
  });
}

/* ============ unir duplicados (lo usa openDuplicados) ============
   Spotify da IDs distintos a la misma canción según la edición (normal /
   deluxe / remaster) y según el mercado, así que el historial llegó a
   añadirla otra vez creyendo que era nueva: había 21 pares con el mismo ISRC.
   El emparejamiento nuevo ya evita crear más, pero los que había siguen ahí
   y borrar a mano el "malo" perdería lo que tuvieras dentro.
   Se queda la ficha con más trabajo tuyo encima (valoración, notas,
   etiquetas...) y hereda de las otras todo lo que ella no tenga: así unir
   nunca puede hacerte perder un dato que ya habías puesto. */
function unirGrupo(grupo) {
  const puntos = it => (it.rating ? 4 : 0) + (it.notes ? 3 : 0) + ((it.tagIds || []).length ? 2 : 0)
                     + (it.listened ? 1 : 0) + (it.autoAdded ? -2 : 0);
  const orden = grupo.slice().sort((a, b) => puntos(b) - puntos(a) || (a.dateAdded || 0) - (b.dateAdded || 0));
  const queda = orden[0], sobran = orden.slice(1);
  sobran.forEach(o => {
    if (!queda.listened && o.listened) { queda.listened = true; queda.listenedAt = o.listenedAt; }
    if (!queda.rating && o.rating) queda.rating = o.rating;
    if (!queda.notes && o.notes) queda.notes = o.notes;
    if (!queda.recomendadoPor && o.recomendadoPor) queda.recomendadoPor = o.recomendadoPor;
    if (!queda.coverUrl && o.coverUrl) queda.coverUrl = o.coverUrl;
    if (o.prioridad) queda.prioridad = true;
    queda.tagIds = [...new Set((queda.tagIds || []).concat(o.tagIds || []))];
    if (o.cancionesEscuchadas?.length) {
      queda.cancionesEscuchadas = [...new Set((queda.cancionesEscuchadas || []).concat(o.cancionesEscuchadas))];
    }
    if (o.trackRatings) queda.trackRatings = Object.assign({}, o.trackRatings, queda.trackRatings || {});
    const plays = [...new Set((queda.plays || []).concat(o.plays || []))].sort((a, b) => a - b);
    if (plays.length) {
      queda.plays = plays.length > TOPE_PLAYS
        ? [plays[0]].concat(plays.slice(plays.length - (TOPE_PLAYS - 1)))
        : plays;
    }
    if (o.dateAdded && (!queda.dateAdded || o.dateAdded < queda.dateAdded)) queda.dateAdded = o.dateAdded;
  });
  queda.touchedAt = Date.now();   // es una edición tuya: debe ganarle a una tumba vieja
  return { queda, sobran };
}

/* ============ modals ============ */
const modalRoot = document.getElementById('modalRoot');
/* Cerrar una hoja no siempre dispara a tiempo el evento de visualViewport que
   corrige --kb (el hueco reservado para el teclado): si se cierra con el
   teclado todavía abierto, la SIGUIENTE hoja podía heredar ese hueco durante
   un instante y salir comprimida como si el teclado ya estuviera puesto,
   antes de que tocaras nada — de ahí que "la segunda vez" se viera mal. */
let _closeTimer = null;
function closeModal() {
  const overlay = modalRoot.querySelector('.overlay');
  if (!overlay) { modalRoot.innerHTML = ''; document.documentElement.style.setProperty('--kb', '0px'); return; }
  if (overlay.classList.contains('closing')) return;   // ya se está cerrando: no reiniciar la cuenta atrás
  overlay.classList.add('closing');
  overlay.querySelector('.sheet')?.classList.add('closing');
  // 150ms = la duración de .closing en CSS. Un timeout en vez de esperar a
  // 'animationend' porque si la pestaña pasa a segundo plano a media
  // animación ese evento puede no llegar nunca, y el modal se quedaría
  // atascado a medio cerrar para siempre.
  clearTimeout(_closeTimer);
  _closeTimer = setTimeout(() => {
    modalRoot.innerHTML = '';
    document.documentElement.style.setProperty('--kb', '0px');
  }, 150);
}
function showSheet(html) {
  clearTimeout(_closeTimer);   // abrir algo nuevo gana sin esperar a que termine un cierre en marcha
  document.documentElement.style.setProperty('--kb', '0px');
  modalRoot.innerHTML = `<div class="overlay" data-overlay="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
}
modalRoot.addEventListener('click', e => { if (e.target.dataset.overlay) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (modalRoot.innerHTML) closeModal(); else if (selMode) setSelMode(false); }
});

/* ---- search ---- */
let searchType = 'album';
let lastResults = [];
let searchTimer;
let searchSelMode = false;
let searchSel = new Set();   // índices de lastResults marcados en modo selección
// solo tiene sentido para "Canciones": no reordena lastResults (eso rompería
// los índices de searchSel y data-add), solo el orden en que se pintan
let searchSortMode = 'relevance';   // relevance | album | duration | alpha

/* Spotify solo da 10 resultados por página desde el cambio de febrero de 2026.
   Para poder elegir entre más de 10, "Ver más resultados" pide la siguiente
   página con offset y la añade al final de lastResults (nunca se reordena, así
   que los índices ya marcados en searchSel siguen siendo válidos). */
let searchOffset = 0;
let searchAgotado = true;
let searchQueryActual = '';
let searchTypeActual = '';
let _cargandoMasResultados = false;
const TOPE_OFFSET_BUSQUEDA = 100;   // 10 páginas; de sobra para elegir a mano

function openSearch() {
  searchType = 'album';
  searchSelMode = false; searchSel = new Set(); searchSortMode = 'relevance';
  showSheet(`
    <div class="sheethead"><h2>Buscar en Spotify</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">${ui('cerrar', 17)}</button></div>
    <div class="segrow" id="segs">
      <button class="seg on" data-t="album">${ui('disco')} Álbumes</button>
      <button class="seg" data-t="track">${ui('nota')} Canciones</button>
      <button class="seg" data-t="artist">${ui('micro')} Artistas</button>
      <button class="seg" data-t="playlist">${ui('lista')} Playlists</button>
    </div>
    <input type="text" class="field" id="sq" placeholder="Título, artista, o pega un enlace (álbum, canción, artista o playlist)" autocomplete="off">
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;">
      <button class="pillbtn" id="bulkLink">${ui('portapapeles')} Pegar varios enlaces</button>
      <button class="pillbtn" id="manualLink">${ui('enlace')} Añadir enlace externo</button>
    </div>
    <div id="sres" style="margin-top:12px;"></div>
  `);
  const sq = document.getElementById('sq');
  document.getElementById('segs').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    document.querySelectorAll('#segs .seg').forEach(x => x.classList.toggle('on', x === b));
    searchType = b.dataset.t;
    searchSelMode = false; searchSel = new Set(); searchSortMode = 'relevance'; document.getElementById('searchSelBar')?.remove();
    runSearch();
  });
  document.getElementById('bulkLink').addEventListener('click', () => { bulkInputMode = 'links'; openBulk(); });
  document.getElementById('manualLink').addEventListener('click', openManualAdd);
  // 330ms disparaba una búsqueda casi por sílaba; 450 apenas se nota al
  // escribir y manda bastantes menos peticiones (menos riesgo de 429)
  sq.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 450); });
  sq.focus();
}

/* Si se teclea rápido, una búsqueda vieja puede tardar más en responder que la
   que se lanzó después (red lenta, resultado más pesado…). Sin esto, la vieja
   llega tarde y pisa los resultados correctos con otros ya obsoletos. Cada
   llamada se numera y, al volver, se descarta si ya no es la más reciente. */
let _searchSeq = 0;

async function runSearch() {
  const miTurno = ++_searchSeq;
  const q = document.getElementById('sq').value.trim();
  const box = document.getElementById('sres');
  if (!q) { box.innerHTML = ''; return; }
  if (!isConnected()) {
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>Este dispositivo todavía no está conectado con Spotify. La conexión es por dispositivo: inicia sesión aquí también.</p><div class="acts"><button class="btn primary" data-open="settings">Ir a Ajustes</button></div></div>`;
    return;
  }
  box.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  const m = q.match(URL_ONE);
  const mPl = !m && q.match(URL_PLAYLIST_ONE);   // un enlace no puede ser las dos cosas a la vez
  searchOffset = 0; searchAgotado = true;
  searchQueryActual = q; searchTypeActual = searchType;
  try {
    let resultados;
    if (mPl) {
      // la propia playlist como marcador (rápido) va primero; sus canciones sueltas
      // detrás, por si quieres quedarte solo con algunas en vez de la playlist entera
      const [meta, tracks] = await Promise.all([
        fetchPlaylistMeta(mPl[1]).catch(() => null),
        fetchPlaylist(mPl[1], (got, tot) => {
          if (miTurno === _searchSeq) box.innerHTML = `<p class="lede" style="text-align:center;padding:20px 4px;">Leyendo la playlist… ${got} de ${tot}</p>`;
        })
      ]);
      const marcador = meta ? [normalize(meta, 'playlist')] : [];
      resultados = marcador.concat(tracks.map(t => normalize(t, 'track')));
    } else if (m) {
      resultados = [normalize(await spotifyLookup(m[1], m[2]), m[1])];
    } else {
      const d = await spotifySearch(q, searchType, 0);
      resultados = (d[searchType + 's']?.items || []).map(r => normalize(r, searchType));
      searchOffset = resultados.length;
      searchAgotado = resultados.length < 10;   // menos de una página llena: no hay más
    }
    if (miTurno !== _searchSeq) return;   // ya hay una búsqueda más nueva en curso
    lastResults = resultados;
    searchSelMode = false; searchSel = new Set();   // resultados nuevos: cualquier selección previa ya no aplica
    if (!lastResults.length) {
      box.innerHTML = `<div class="empty" style="padding:26px 8px;">
        <p>Sin resultados para “${esc(q)}” en Spotify.</p>
        <p class="lede" style="margin-top:10px;">Prueba a buscarlo en otro sitio y pega el enlace con "Añadir enlace externo":</p>
        <div class="acts" style="flex-wrap:wrap;">
          <a class="btn" href="https://music.youtube.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">Buscar en YouTube Music ${ui('fuera')}</a>
          <a class="btn" href="https://music.apple.com/search?term=${encodeURIComponent(q)}" target="_blank" rel="noopener">Buscar en Apple Music ${ui('fuera')}</a>
        </div>
      </div>`;
      document.getElementById('searchSelBar')?.remove();
      return;
    }
    pintarResultados();
  } catch (err) {
    if (miTurno !== _searchSeq) return;
    const msg = err.message || '';
    let text = 'No se pudo conectar con Spotify. Revisa tu conexión.';
    let mostrarReconectar = false;
    if (msg === 'AUTH_FAILED' || msg === 'NO_CREDS') text = 'Tu conexión con Spotify ha caducado o no es válida. Vuelve a conectarte en Ajustes.';
    else if (msg === 'RATE_LIMIT') text = `Demasiadas búsquedas seguidas — Spotify ha puesto un límite temporal. Espera ${tiempoEsperaTexto()} y vuelve a intentarlo.`;
    else if (msg.startsWith('LOOKUP_FAILED')) text = `Ese enlace no existe o es privado (error ${msg.split(':')[1]}).`;
    else if (msg.startsWith('SEARCH_FAILED')) text = `Spotify devolvió un error ${msg.split(':')[1]}.`;
    else if (msg.startsWith('PLAYLIST_FAILED')) {
      const code = msg.split(':')[1];
      if (code === '404') text = 'Esa playlist no es accesible (privada, o de las que genera Spotify — solo funcionan las públicas de usuario).';
      else if (code === '403' && !tieneScopePlaylists()) {
        text = 'Para leer playlists (sobre todo las tuyas, que suelen ser privadas) hace falta darle un permiso nuevo a esta conexión.';
        mostrarReconectar = true;
      } else text = `No se pudo leer la playlist (error ${code}).`;
    }
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>${esc(text)}</p>${mostrarReconectar ? `<div class="acts"><button class="btn primary" data-reconnect="1">Reconectar con Spotify</button></div>` : ''}</div>`;
    document.getElementById('searchSelBar')?.remove();
  }
}

function rrow(r, i) {
  const saved = ITEMS.some(x => x.spotifyId === r.spotifyId);
  const sub = r.type === 'playlist'
    ? [r.artists[0] ? `de ${r.artists[0]}` : null, r.totalTracks != null ? `${r.totalTracks} canciones` : null].filter(Boolean).join(' · ')
    : `${r.artists.join(', ')}${r.releaseDate ? ' · ' + String(r.releaseDate).slice(0, 4) : ''}`;
  const info = `<div class="rart">${portada(r.coverUrl, TYPE_ICON[r.type], true)}</div>
    <div class="rinfo">
      <div class="rt">${esc(r.title)}</div>
      <div class="ra">${esc(sub)}</div>
    </div>`;

  if (searchSelMode) {
    const marcado = searchSel.has(i);
    return `<div class="rrow${saved ? '' : ' selectable'}" ${saved ? '' : `data-rchk="${i}"`}>
      ${info}
      <span class="rchk ${marcado ? 'on' : ''} ${saved ? 'saved' : ''}" aria-label="${saved ? 'Ya guardado' : (marcado ? 'Quitar de la selección' : 'Seleccionar')}">✓</span>
    </div>`;
  }
  return `<div class="rrow">
    ${info}
    <button class="addbtn ${saved ? 'done' : ''}" data-add="${i}" aria-label="${saved ? 'Ya guardado' : 'Guardar'}">${saved ? ui('visto') : ui('mas')}</button>
  </div>`;
}

// Orden de PINTADO, no de datos: devuelve índices de lastResults reordenados
// sin tocar el array — así searchSel y data-add (que son índices reales) no
// se rompen cuando cambias el criterio de orden.
function ordenResultados() {
  const idx = lastResults.map((_, i) => i);
  if (searchSortMode === 'relevance') return idx;
  idx.sort((ia, ib) => {
    const a = lastResults[ia], b = lastResults[ib];
    if (searchSortMode === 'album') return fold(a.albumName || '').localeCompare(fold(b.albumName || ''), 'es') || (a.trackNumber || 0) - (b.trackNumber || 0);
    if (searchSortMode === 'duration') return (a.durationMs || 0) - (b.durationMs || 0);
    if (searchSortMode === 'alpha') return fold(a.title).localeCompare(fold(b.title), 'es');
    return 0;
  });
  return idx;
}

/* Vuelve a pintar la lista de resultados: la barra de herramientas (Seleccionar
   varios / Añadir todos), las filas, y si hay selección activa, la barra de
   confirmación abajo. Se llama tras cada búsqueda y tras cada toque en modo
   selección, para que el recuento y las marcas siempre reflejen el estado real. */
function pintarResultados() {
  const box = document.getElementById('sres');
  if (!box) return;
  const pendientes = lastResults.filter(r => !ITEMS.some(x => x.spotifyId === r.spotifyId)).length;

  // el orden alternativo solo tiene sentido en Canciones (duración, álbum "padre")
  // y no mientras seleccionas varios — un desplegable discreto, no otra fila de pestañas
  const ordenSel = (searchType === 'track' && lastResults.length > 1 && !searchSelMode) ? `
    <select class="ctl" id="srSort" style="margin-left:auto;max-width:132px;">
      <option value="relevance" ${searchSortMode === 'relevance' ? 'selected' : ''}>Relevancia</option>
      <option value="album" ${searchSortMode === 'album' ? 'selected' : ''}>Por álbum</option>
      <option value="duration" ${searchSortMode === 'duration' ? 'selected' : ''}>Por duración</option>
      <option value="alpha" ${searchSortMode === 'alpha' ? 'selected' : ''}>A-Z</option>
    </select>` : '';

  let tools = '';
  if (lastResults.length > 1) {
    tools = searchSelMode
      ? `<div class="restools"><button data-restool="cancel">Cancelar</button></div>`
      : `<div class="restools">
           <button data-restool="selmode">Seleccionar varios</button>
           ${pendientes ? `<button data-restool="addall">Añadir todos<span class="n">(${pendientes})</span></button>` : ''}
           ${ordenSel}
         </div>`;
  }

  const masBtn = (!searchAgotado && searchOffset < TOPE_OFFSET_BUSQUEDA)
    ? `<button class="btn vermas" data-moreres="1" ${_cargandoMasResultados ? 'disabled' : ''}>${_cargandoMasResultados ? 'Cargando…' : 'Ver más resultados'}</button>`
    : '';

  box.innerHTML = tools + ordenResultados().map(i => rrow(lastResults[i], i)).join('') + masBtn;
  document.getElementById('srSort')?.addEventListener('change', e => {
    searchSortMode = e.target.value;
    pintarResultados();
  });

  const barra = document.getElementById('searchSelBar');
  if (barra) barra.remove();
  if (searchSelMode && searchSel.size) {
    document.querySelector('.sheet')?.insertAdjacentHTML('beforeend', `
      <div class="selbar" id="searchSelBar">
        <span class="cnt">${searchSel.size} seleccionado${searchSel.size === 1 ? '' : 's'}</span>
        <button class="btn" data-selbar="cancel">Cancelar</button>
        <button class="btn primary" data-selbar="add">Añadir</button>
      </div>`);
  }
}

/* Pide la siguiente página de 10 resultados y la añade al final de lastResults
   sin perder la selección ni las filas ya pintadas. */
async function cargarMasResultados() {
  if (_cargandoMasResultados || searchAgotado) return;
  _cargandoMasResultados = true;
  pintarResultados();
  try {
    const d = await spotifySearch(searchQueryActual, searchTypeActual, searchOffset);
    const nuevos = (d[searchTypeActual + 's']?.items || []).map(r => normalize(r, searchTypeActual));
    const yaIds = new Set(lastResults.map(r => r.spotifyId));
    const frescos = nuevos.filter(r => !yaIds.has(r.spotifyId));
    lastResults = lastResults.concat(frescos);
    searchOffset += nuevos.length;
    searchAgotado = nuevos.length < 10;
  } catch (e) {
    toast('No se pudieron cargar más resultados');   // offset no cambia: el botón deja reintentar
  } finally {
    _cargandoMasResultados = false;
    pintarResultados();
  }
}

/* Añade a la vez todo lo que no esté ya guardado, de un array de resultados
   de Spotify (normalizados). Usado tanto por "Añadir todos" como por
   confirmar una selección múltiple. */
function addManyResults(items) {
  let added = 0;
  items.forEach(r => {
    if (!r || ITEMS.some(x => x.spotifyId === r.spotifyId)) return;
    ITEMS.push(makeItem(r)); added++;
  });
  if (added) { saveItems(); render(); }
  return added;
}

function wireBulkSheet() {
  document.getElementById('bulkSegs').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    if (b.dataset.t === 'back') { openSearch(); return; }
    if (b.dataset.t === 'links') { bulkInputMode = 'links'; openBulk(); return; }
    if (b.dataset.t === 'names') { bulkInputMode = 'names'; openBulk(); return; }
  });

  if (bulkInputMode === 'names') {
    document.getElementById('bulkNameSeg').addEventListener('click', e => {
      const b = e.target.closest('.seg'); if (!b) return;
      bulkNameType = b.dataset.nt;
      document.querySelectorAll('#bulkNameSeg .seg').forEach(x => x.classList.toggle('on', x === b));
    });
    document.getElementById('bulkFileBtn').addEventListener('click', () => document.getElementById('bulkFile').click());
    document.getElementById('bulkFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const box = document.getElementById('bulkNames');
        box.value = (box.value ? box.value + '\n' : '') + fr.result;
      };
      fr.readAsText(f);
      e.target.value = '';
    });

    document.getElementById('bulkNames').focus();
  } else {
    document.getElementById('bulkFileBtn').addEventListener('click', () => document.getElementById('bulkFile').click());
    document.getElementById('bulkFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const box = document.getElementById('bulkIn');
        box.value = (box.value ? box.value + '\n' : '') + fr.result;
        const n = (String(fr.result).match(/open\.spotify\.com\//g) || []).length;
        document.getElementById('bulkOut').innerHTML = `Archivo cargado: <strong>${n}</strong> enlaces detectados. Pulsa “Añadir al vault”.`;
      };
      fr.readAsText(f);
      e.target.value = '';
    });
    document.getElementById('plMode').addEventListener('click', e => {
      const b = e.target.closest('.seg'); if (!b) return;
      playlistMode = b.dataset.m;
      document.querySelectorAll('#plMode .seg').forEach(x => x.classList.toggle('on', x === b));
    });
    document.getElementById('bulkGo').addEventListener('click', runBulk);
    document.getElementById('bulkIn').focus();
  }
}

async function runBulk() {
  const out = document.getElementById('bulkOut');
  const go = document.getElementById('bulkGo');
  if (_bulkCorriendo) { out.innerHTML = 'Ya hay una subida en marcha (la empezaste antes de cerrar este panel). Espera a que termine.'; return; }
  if (!isConnected()) {
    out.innerHTML = 'Este dispositivo aún no está conectado con Spotify. La conexión es por dispositivo: ve a Ajustes y conéctate también aquí.';
    return;
  }
  const text = document.getElementById('bulkIn').value;

  const playlists = [];
  let m; URL_PLAYLIST.lastIndex = 0;
  while ((m = URL_PLAYLIST.exec(text)) !== null) if (!playlists.includes(m[1])) playlists.push(m[1]);

  const singles = new Map();
  URL_ALL.lastIndex = 0;
  while ((m = URL_ALL.exec(text)) !== null) singles.set(m[2], m[1]);

  if (!playlists.length && !singles.size) { out.innerHTML = 'No he encontrado ningún enlace de Spotify en ese texto.'; return; }

  _bulkCorriendo = true;
  go.disabled = true;
  pedirDespertar();
  let added = 0, dup = 0, fail = 0;
  let necesitaReconectarPlaylist = false;
  const notes = [];

  try {
  // 1) playlists
  for (const pid of playlists) {
    try {
      // la playlist en sí, como marcador con enlace directo (si falla solo esto,
      // seguimos igualmente con sus canciones/álbumes más abajo)
      try {
        const marcador = normalize(await fetchPlaylistMeta(pid), 'playlist');
        if (ITEMS.some(x => x.spotifyId === marcador.spotifyId)) dup++;
        else { ITEMS.push(makeItem(marcador)); added++; }
      } catch {}

      const tracks = await fetchPlaylist(pid, (got, tot) => { out.innerHTML = `Leyendo playlist… ${got} de ${tot} canciones`; });
      const wanted = new Map();
      for (const t of tracks) {
        if (playlistMode === 'albums') {
          if (t.album?.id) wanted.set(t.album.id, normalize(t.album, 'album'));
        } else {
          wanted.set(t.id, normalize(t, 'track'));
        }
      }
      let i = 0;
      for (const [sid, r] of wanted) {
        i++;
        if (i % 10 === 0) out.innerHTML = `Guardando ${i} de ${wanted.size}… <strong>${added}</strong> añadidos`;
        if (ITEMS.some(x => x.spotifyId === sid)) { dup++; continue; }
        ITEMS.push(makeItem(r)); added++;
      }
      notes.push(`Playlist: ${wanted.size} ${playlistMode === 'albums' ? 'álbumes' : 'canciones'} encontrad${playlistMode === 'albums' ? 'os' : 'as'}`);
    } catch (err) {
      const code = (err.message || '').split(':')[1];
      if (code === '403' && !tieneScopePlaylists()) {
        notes.push('Una playlist dio error 403 — para leer playlists privadas hace falta darle un permiso nuevo a esta conexión.');
        necesitaReconectarPlaylist = true;
      } else {
        notes.push(code === '404'
          ? 'Una playlist no es accesible (privada, o de las que genera Spotify — solo funcionan las públicas de usuario).'
          : `Una playlist falló (error ${code || '?'}).`);
      }
      fail++;
    }
  }

  // 2) enlaces sueltos, uno a uno (con 5 en paralelo — ver fetchItemsIndividually)
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));
  const porTipo = { album: [], track: [], artist: [] };
  for (const [id, type] of singles) {
    if (yaTengo.has(id)) { dup++; continue; }
    if (porTipo[type]) porTipo[type].push(id);
  }
  const pendientes = porTipo.album.length + porTipo.track.length + porTipo.artist.length;
  let hechosTotal = 0;
  // Con listas de cientos/miles de enlaces, Spotify acaba poniendo un límite
  // en firme (ver SEG_BLOQUEO_SOSTENIDO en fetchItemsIndividually). Antes eso
  // se traducía en un montón de "fallaron" sin explicación, y había que ir
  // pegando el resto del Excel a mano al día siguiente. Ahora, en cuanto se
  // detecta el bloqueo, lo que falte (de este tipo Y de los que quedan por
  // procesar) se guarda en la cola de importación y la propia app lo sigue
  // metiendo sola, un poco cada vez, sin que haya que volver a pegar nada.
  let bloqueado = false;
  let encoladas = 0;

  for (const tipo of ['album', 'track', 'artist']) {
    const ids = porTipo[tipo];
    if (!ids.length) continue;
    if (bloqueado) {
      encoladas += encolarImportacion(ids.map(id => ({ type: tipo, id })));
      continue;
    }
    let sinGuardar = 0;
    let datos;
    try {
      datos = await fetchItemsIndividually(tipo, ids, (n) => {
        out.innerHTML = `Procesando ${hechosTotal + n} de ${pendientes}… <strong>${added}</strong> añadidos`;
      }, null, raw => {
        // se añade y se cuenta al momento — con listas de miles, esperar a que
        // termine TODO el tipo para guardar significaba perderlo todo si se
        // cerraba la pestaña a mitad
        if (!raw.id || yaTengo.has(raw.id)) return;
        ITEMS.push(makeItem(normalize(raw, tipo)));
        yaTengo.add(raw.id);
        added++;
        if (++sinGuardar >= 25) { saveItems(); sinGuardar = 0; }
      });
    } catch (e) {
      /* Si el fallo es de credenciales, va a fallar exactamente igual con
         cada elemento que quede: antes seguía intentando todos en silencio y
         al final solo decía "N fallaron", sin explicar por qué. Ahora para
         en el primero y lo dice. Lo ya añadido (vía onItem, arriba) no se pierde. */
      saveItems();
      out.innerHTML = `Parado: tu conexión con Spotify en este dispositivo no es válida o ha caducado. Vuelve a conectarte en Ajustes.<br><span style="color:var(--fg-mute);font-size:12.5px;">${added} añadidos antes de fallar.</span>`;
      return;   // el finally de más abajo repone _bulkCorriendo y el botón
    }
    fail += datos.filter((d, idx) => !d && !datos.bloqueados[idx]).length;
    if (datos.bloqueoDetectado) {
      bloqueado = true;
      const pendientesTipo = ids.filter((id, idx) => datos.bloqueados[idx]);
      encoladas += encolarImportacion(pendientesTipo.map(id => ({ type: tipo, id })));
    }
    hechosTotal += ids.length;
    saveItems();
  }

  saveItems(); render();
  const bits = [`<strong>${added}</strong> añadidos`];
  if (dup) bits.push(`${dup} ya estaban`);
  if (fail) bits.push(`${fail} fallaron`);
  if (encoladas) bits.push(`<strong>${encoladas.toLocaleString('es-ES')}</strong> en cola`);
  out.innerHTML = bits.join(' · ')
    + (bloqueado ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">Spotify ha puesto un límite temporal por tantas peticiones seguidas (parece que va para largo — más de ${tiempoEsperaTexto()}). Lo que falta se ha guardado y esta app lo irá añadiendo sola, poco a poco, cada vez que la abras — no hace falta que hagas nada más. Puedes ver el progreso en Ajustes → Cola de importación.</span>` : '')
    + (notes.length ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">${notes.map(esc).join('<br>')}</span>` : '')
    + (necesitaReconectarPlaylist ? `<div class="btnrow"><button class="btn primary wide" data-reconnect="1">Reconectar con Spotify</button></div>` : '');
  if (added) toast(`${added} añadido${added === 1 ? '' : 's'} al vault`);
  } finally {
    _bulkCorriendo = false;
    go.disabled = false;
    soltarDespertar();
  }
}

/* ============ Cola de importación ============
   Cuando se pegan cientos/miles de enlaces de golpe (ver runBulk), Spotify
   acaba poniendo un límite en firme que puede durar minutos u horas — no lo
   controlamos ni lo sabemos de antemano. En vez de forzar la marcha o hacer
   que el usuario vaya troceando el pegado a mano día a día, lo que no cabe
   AHORA se queda guardado aquí, y la propia app lo sigue metiendo sola, un
   poco cada vez, cada vez que se abre — sin que haga falta acordarse de nada.
   Solo vive en este dispositivo (no se sincroniza entre PC/iPhone): cada uno
   importa a su ritmo, y lo que entra al vault sí se sincroniza como siempre. */
const K_IMPORT_QUEUE = 'musicvault_import_queue_v1';
let IMPORT_QUEUE = [];   // [{type, id}] — se carga de IndexedDB en bootStorage()
const saveImportQueue = () => _flush(K_IMPORT_QUEUE, () => IMPORT_QUEUE);

function encolarImportacion(entradas) {
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));
  const yaEnCola = new Set(IMPORT_QUEUE.map(e => e.type + ':' + e.id));
  let nuevos = 0;
  for (const e of entradas) {
    if (yaTengo.has(e.id) || yaEnCola.has(e.type + ':' + e.id)) continue;
    IMPORT_QUEUE.push(e);
    yaEnCola.add(e.type + ':' + e.id);
    nuevos++;
  }
  if (nuevos) saveImportQueue();
  return nuevos;
}

const colaStatTexto = () => IMPORT_QUEUE.length
  ? `● ${IMPORT_QUEUE.length.toLocaleString('es-ES')} en cola — se van añadiendo solas cada vez que abres la app`
  : '● Cola vacía';

let _procesandoCola = false;
let _ultimoIntentoCola = 0;

/* auto=true: la llama la propia app al abrirse, en silencio (si no hay nada
   que hacer, no toca la interfaz para nada). auto=false: la ha pedido el
   usuario a mano desde Ajustes → sí refleja progreso ahí y avisa al acabar. */
async function procesarColaImportacion(auto) {
  if (_procesandoCola || !IMPORT_QUEUE.length) return;
  if (!isConnected()) return;
  // no reintentar en cada apertura/cambio de pestaña si acabamos de fallar hace nada
  if (auto && Date.now() - _ultimoIntentoCola < 5 * 60000) return;
  _ultimoIntentoCola = Date.now();
  _procesandoCola = true;
  pedirDespertar();

  const est = () => document.getElementById('colaStat');
  let añadidas = 0;

  try {
    const porTipo = { album: [], track: [], artist: [] };
    for (const e of IMPORT_QUEUE) if (porTipo[e.type]) porTipo[e.type].push(e.id);
    const yaTengo = new Set(ITEMS.map(x => x.spotifyId));

    for (const tipo of ['album', 'track', 'artist']) {
      const ids = porTipo[tipo];
      if (!ids.length) continue;
      let sinGuardar = 0;
      let datos;
      try {
        datos = await fetchItemsIndividually(tipo, ids, () => {
          const nodo = est();
          if (nodo) nodo.textContent = `● Importando… ${añadidas.toLocaleString('es-ES')} añadidas, quedan ${IMPORT_QUEUE.length.toLocaleString('es-ES')}`;
        }, null, raw => {
          if (!raw.id || yaTengo.has(raw.id)) return;
          ITEMS.push(makeItem(normalize(raw, tipo)));
          yaTengo.add(raw.id);
          añadidas++;
          if (++sinGuardar >= 25) { saveItems(); sinGuardar = 0; }
        });
      } catch (e) {
        break;   // token inválido u otro fallo fuerte: se para y la cola queda tal cual para el próximo intento
      }
      // sale de la cola lo que ya se añadió y lo que Spotify confirma que ya
      // no existe; lo que sigue bloqueado por el límite se queda para luego
      const idsSalen = new Set();
      ids.forEach((id, idx) => { if (!datos.bloqueados[idx]) idsSalen.add(id); });
      IMPORT_QUEUE = IMPORT_QUEUE.filter(e => !(e.type === tipo && idsSalen.has(e.id)));
      saveImportQueue();
      if (datos.bloqueoDetectado) break;   // ya sabemos que hoy no da para más
    }
  } finally {
    _procesandoCola = false;
    soltarDespertar();
    if (añadidas) { saveItems(); render(); }
    const nodo = est();
    if (nodo) nodo.textContent = colaStatTexto();
    if (!auto && añadidas) toast(`${añadidas} añadida${añadidas === 1 ? '' : 's'} desde la cola de importación`);
  }
}

/* Añadir "por nombre": una línea = una búsqueda, se guarda la primera
   coincidencia. Comparte _bulkCorriendo con runBulk() a propósito — evita que
   una subida por enlaces y otra por nombre corran a la vez y dupliquen algo,
   el mismo motivo por el que existe ese cerrojo. */
async function runBulkByName() {
  const out = document.getElementById('bulkOut');
  const go = document.getElementById('bulkGo');
  if (_bulkCorriendo) { out.innerHTML = 'Ya hay una subida en marcha (la empezaste antes de cerrar este panel). Espera a que termine.'; return; }
  if (!isConnected()) {
    out.innerHTML = 'Este dispositivo aún no está conectado con Spotify. La conexión es por dispositivo: ve a Ajustes y conéctate también aquí.';
    return;
  }
  const lineas = [...new Set(document.getElementById('bulkNames').value.split('\n').map(s => s.trim()).filter(Boolean))];
  if (!lineas.length) { out.innerHTML = 'Escribe al menos un título, uno por línea.'; return; }

  _bulkCorriendo = true;
  go.disabled = true;
  pedirDespertar();
  const tipo = bulkNameType;
  let added = 0, dup = 0;
  const sinCoincidencia = [];
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));

  try {
    const CONCURRENCIA = 3;   // cada línea es una búsqueda entera, más cara que un lookup: menos paralelismo que fetchItemsIndividually
    let i = 0, hechos = 0, pararTodo = null;
    async function trabajador() {
      while (i < lineas.length && !pararTodo) {
        const mio = i++;
        const texto = lineas[mio];
        try {
          const d = await spotifySearch(texto, tipo, 0);
          const top = (d[tipo + 's']?.items || [])[0];
          if (!top) sinCoincidencia.push(texto);
          else if (yaTengo.has(top.id)) dup++;
          else { ITEMS.push(makeItem(normalize(top, tipo))); yaTengo.add(top.id); added++; }
        } catch (e) {
          const msg = e.message || '';
          if (msg === 'AUTH_FAILED' || msg === 'NO_CREDS') { pararTodo = e; return; }
          sinCoincidencia.push(texto);   // fallo puntual (red, límite agotado…): cuenta como sin encontrar, no para todo
        }
        hechos++;
        out.innerHTML = `Buscando ${hechos} de ${lineas.length}… <strong>${added}</strong> añadidos`;
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCIA, lineas.length) }, trabajador));
    if (pararTodo) {
      out.innerHTML = `Parado: tu conexión con Spotify en este dispositivo no es válida o ha caducado. Vuelve a conectarte en Ajustes.<br><span style="color:var(--fg-mute);font-size:12.5px;">${added} añadidos antes de fallar.</span>`;
      return;
    }
    saveItems(); render();
    const bits = [`<strong>${added}</strong> añadidos`];
    if (dup) bits.push(`${dup} ya estaban`);
    if (sinCoincidencia.length) bits.push(`${sinCoincidencia.length} sin coincidencia`);
    out.innerHTML = bits.join(' · ') + (sinCoincidencia.length
      ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">Sin encontrar: ${sinCoincidencia.slice(0, 15).map(esc).join(', ')}${sinCoincidencia.length > 15 ? '…' : ''}</span>`
      : '');
    if (added) toast(`${added} añadido${added === 1 ? '' : 's'} al vault — revisa que sea la versión correcta`);
  } finally {
    _bulkCorriendo = false;
    go.disabled = false;
    soltarDespertar();
  }
}

/* ---- enlace externo (lo que no está en Spotify) ----
   El vault entero está pensado en torno a un spotifyId real: es la clave que
   usan la deduplicación, las tumbas de borrado y la fusión al sincronizar. En
   vez de montar un sistema de ids en paralelo, a estos elementos se les da un
   spotifyId sintético (prefijo "manual:") que encaja en todo ese mecanismo
   como una clave opaca cualquiera, y se marcan con `manual: true` para que
   "Completar carátulas" y "Actualizar desde Spotify" —que sí necesitan un
   id real de catálogo— los dejen en paz. */
let manualType = 'album';

/* Relleno automático desde YouTube (título, autor, miniatura) cuando el
   enlace pegado es un vídeo de YouTube. La propia API de YouTube no deja
   pedirla desde el navegador (no manda cabeceras CORS); noembed.com es una
   pasarela oEmbed abierta que sí lo permite. Es una ayuda opcional: si falla
   por lo que sea, no pasa nada — simplemente no rellena nada solo. */
const YOUTUBE_RE = /(?:youtube\.com\/(?:watch\?v=|live\/|shorts\/)|youtu\.be\/)/i;
async function rellenarDesdeYoutube() {
  const urlEl = document.getElementById('manUrl');
  if (!urlEl) return;
  const url = urlEl.value.trim();
  if (!YOUTUBE_RE.test(url)) return;
  const tituloEl = document.getElementById('manTitle');
  const artistaEl = document.getElementById('manArtist');
  const coverEl = document.getElementById('manCover');
  if (tituloEl.value.trim() && coverEl.value.trim()) return;   // ya rellenado a mano, no lo piso
  const stat = document.getElementById('manYtStat');
  if (stat) stat.style.display = 'block';
  try {
    const res = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(url));
    if (!res.ok) return;
    const d = await res.json();
    if (d.error) return;
    if (!tituloEl.value.trim() && d.title) tituloEl.value = d.title;
    if (!artistaEl.value.trim() && d.author_name) artistaEl.value = d.author_name;
    if (!coverEl.value.trim() && d.thumbnail_url) coverEl.value = d.thumbnail_url;
  } catch {
    // sin conexión con noembed, o CORS bloqueado: se sigue pudiendo rellenar a mano
  } finally {
    if (stat) stat.style.display = 'none';
  }
}

  showSheet(`

    if (!/^https?:\/\//i.test(url)) { toast('Pon un enlace válido (empieza por http:// o https://)'); return; }

      label: null, popularity: null, genres: null, followers: null, explicit: null,
      trackNumber: null, discNumber: null, albumType: null, isrc: null
    });
    ITEMS.push(item);

// otros álbumes del mismo artista ya guardados — y si el título base coincide
// (ignorando "deluxe", "remaster"...) se marca como "otra edición" reusando
// tituloBase(), la misma comparación que ya hace el detector de duplicados
function relacionadosDelArtista(it) {
  const artistaFold = fold(artistsOf(it));
  if (!artistaFold) return [];
  const base = tituloBase(it.title);
  const otros = ITEMS.filter(x => x.id !== it.id && x.type === 'album' && fold(artistsOf(x)) === artistaFold);
  return otros.map(x => ({ item: x, otraEdicion: !!base && tituloBase(x.title) === base })).sort((a, b) => {
    if (a.otraEdicion !== b.otraEdicion) return a.otraEdicion ? -1 : 1;
    return (parseInt(String(b.item.releaseDate || '0').slice(0, 4)) || 0) - (parseInt(String(a.item.releaseDate || '0').slice(0, 4)) || 0);
  });
}
function relatedRow(item, esEdicion) {
  const y = yearOf(item);
  return `<div class="relrow${item.archived ? ' esarchivo' : ''}" data-openrel="${item.id}">
    <div class="relart">${portada(item.coverUrl, TYPE_ICON[item.type], true)}</div>
    <span class="relt">${esc(item.title)}${esEdicion ? ' <span class="reltag">· otra edición</span>' : ''}${item.archived ? ' <span class="reltag">· archivado</span>' : ''}</span>
    ${y ? `<span class="rely">${y}</span>` : ''}
  </div>`;
}

// solo con precisión de día (YYYY-MM-DD) — con solo el año no hay "hoy hace
// X años" que valga, y muchos discos antiguos en Spotify solo traen el año
function aniversarioTexto(it) {
  if (it.type !== 'album' || !it.releaseDate || String(it.releaseDate).length !== 10) return null;
  const [ry, rm, rd] = it.releaseDate.split('-').map(Number);
  const years = new Date().getFullYear() - ry;
  if (years <= 0) return null;
  const hoy = new Date();
  const a = new Date(2000, rm - 1, rd).getTime();
  const b = new Date(2000, hoy.getMonth(), hoy.getDate()).getTime();
  const diffDias = Math.abs(a - b) / 86400000;
  if (Math.min(diffDias, 365 - diffDias) > 3) return null;
  return `${ui('confeti')} Hace ${years} año${years === 1 ? '' : 's'}`;
}
function repasoTexto(it) {
  if (!it.listened || !it.listenedAt) return null;
  if (Date.now() - it.listenedAt < 180 * 86400000) return null;
  return `${ui('repetir')} ${relDate(it.listenedAt)} sin escucharlo`;
}

// el único 5 estrellas de ese artista entre lo que no está archivado —
// no crea ninguna etiqueta real (para no llenar tu lista de etiquetas con
// una por artista), es solo un aviso calculado al vuelo en la ficha
function esFavoritoUnico(it) {
  if (it.rating !== 5 || it.type === 'artist') return null;
  const artistaFold = fold(artistsOf(it));
  if (!artistaFold) return null;
  const hayOtro = ITEMS.some(x => x.id !== it.id && !x.archived && x.rating === 5 && fold(artistsOf(x)) === artistaFold);
  return hayOtro ? null : `${ui('estrella')} Tu favorito de ${artistsOf(it)}`;
}

// cada nombre de artista se enlaza a su ficha SI ese artista ya está
// guardado como elemento propio en el vault — si no, se queda en texto plano
function artistLinksHtml(it) {
  const nombres = it.artists || [];
  if (!nombres.length) return esc(artistsOf(it));
  return nombres.map(nombre => {
    const match = it.type !== 'artist' && ITEMS.find(x => x.type === 'artist' && !x.archived && fold(x.title) === fold(nombre));
    return match ? `<span class="artistlink" data-goartist="${match.id}">${esc(nombre)}</span>` : esc(nombre);
  }).join(', ');
}
