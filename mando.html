<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mando">
<meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>Mando de Spotify</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f7f2e9; --surface:#fffdf8; --surface-2:#efe8db;
    --line:rgba(26,20,14,0.11); --line-firm:rgba(26,20,14,0.20);
    --fg:#1a140e; --fg-soft:#5d5346; --fg-mute:#726858;
    --amber:#a3690f; --amber-soft:#f0e0c2; --on-amber:#fffdf8;
    --jade:#14795c; --jade-soft:#d5e9e0; --rust:#b03f30;
    --shadow-sm:0 1px 2px rgba(26,20,14,0.05),0 3px 8px rgba(26,20,14,0.05),0 8px 24px rgba(26,20,14,0.04);
    --shadow-lg:0 -4px 40px rgba(26,20,14,0.18);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-drawer:cubic-bezier(0.32,0.72,0,1);
    --row:60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:#14100d; --surface:#1e1915; --surface-2:#2a231d;
      --line:rgba(247,242,233,0.10); --line-firm:rgba(247,242,233,0.20);
      --fg:#f5efe4; --fg-soft:#b8ab99; --fg-mute:#948877;
      --amber:#e0a03a; --amber-soft:#3a2c15; --on-amber:#1a140e;
      --jade:#46b491; --jade-soft:#14312a; --rust:#e0705e;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.34),0 3px 10px rgba(0,0,0,0.26);
      --shadow-lg:0 -4px 40px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#14100d; --surface:#1e1915; --surface-2:#2a231d;
    --line:rgba(247,242,233,0.10); --line-firm:rgba(247,242,233,0.20);
    --fg:#f5efe4; --fg-soft:#b8ab99; --fg-mute:#948877;
    --amber:#e0a03a; --amber-soft:#3a2c15; --on-amber:#1a140e;
    --jade:#46b491; --jade-soft:#14312a; --rust:#e0705e;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.34),0 3px 10px rgba(0,0,0,0.26);
    --shadow-lg:0 -4px 40px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding-bottom: calc(150px + env(safe-area-inset-bottom));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .mute { color: var(--fg-mute); } .soft { color: var(--fg-soft); } .tiny { font-size: 12px; }
  .nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

  /* cabecera */
  .top {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px 6px; max-width: 900px; margin: 0 auto; }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; flex: 1; min-width: 0; }
  .logo span { color: var(--amber); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 2px 14px 9px; max-width: 900px; margin: 0 auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; color: var(--fg-soft); font-weight: 650; font-size: 14px;
    padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.on { background: var(--fg); color: var(--bg); }
  .tab:active { transform: scale(0.97); }

  main { max-width: 900px; margin: 0 auto; padding: 12px 14px; }

  /* botones */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line-firm); background: var(--surface); color: var(--fg);
    border-radius: 11px; padding: 9px 13px; font-size: 14px; font-weight: 600;
    cursor: pointer; white-space: nowrap; user-select: none; text-decoration: none;
    transition: transform .12s var(--ease-out), background .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn.pri { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 45%, transparent); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
  .btn.ico { padding: 8px 9px; }
  .btn.wide { width: 100%; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-firm); background: var(--surface); border-radius: 999px;
    padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { transform: scale(0.96); }
  .chip.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .field {
    width: 100%; background: var(--surface); border: 1px solid var(--line-firm);
    border-radius: 11px; padding: 10px 12px; font-size: 16px;
  }
  .field:focus { outline: none; border-color: var(--amber); }
  select.field { padding: 9px 10px; }
  label.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 5px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--amber); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 10px; }
  .aviso { background: var(--amber-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
  .aviso b { display: block; margin-bottom: 4px; }
  h2 { font-size: 20px; margin: 4px 0 2px; letter-spacing: -0.3px; }
  h3 { font-size: 15px; margin: 18px 0 8px; }

  /* cabecera de una lista */
  .cab { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .cab img, .cab .ph { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); box-shadow: var(--shadow-sm); }
  .cab .ph.red { border-radius: 50%; }
  .cab .txt { min-width: 0; flex: 1; }
  .back { margin: -4px 0 8px -8px; }

  .herr { display: flex; gap: 8px; align-items: center; margin: 10px 0 8px; }
  .herr .field { flex: 1; padding: 8px 12px; }
  .herr select.field { flex: none; width: auto; max-width: 42%; }
  .selbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }

  /* lista virtual */
  .vlist { position: relative; }
  .row {
    position: absolute; left: 0; right: 0; height: var(--row);
    display: flex; align-items: center; gap: 10px; padding: 0 4px 0 2px;
    border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .row:hover { background: var(--surface); }
  .row.sel { background: var(--amber-soft); }
  .row .ck {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-firm); flex: none;
    display: grid; place-items: center; color: var(--on-amber); transition: background .12s, border-color .12s;
  }
  .row.sel .ck { background: var(--amber); border-color: var(--amber); }
  .row .ck svg { width: 13px; height: 13px; stroke-width: 3; opacity: 0; }
  .row.sel .ck svg { opacity: 1; }
  .row img, .row .ph { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--surface-2); }
  .row .t { flex: 1; min-width: 0; }
  .row .t1 { font-weight: 600; font-size: 14.5px; }
  .row .t2 { font-size: 12.5px; color: var(--fg-mute); }
  .row .r { font-size: 12px; color: var(--fg-mute); text-align: right; flex: none; }
  .row .mas { flex: none; }
  .row.suena .t1 { color: var(--jade); }
  .row .n { width: 26px; text-align: right; font-size: 12px; color: var(--fg-mute); flex: none; font-variant-numeric: tabular-nums; }

  /* rejilla de playlists, discos, artistas */
  .lista-obj { display: flex; flex-direction: column; gap: 2px; }
  .obj {
    display: flex; align-items: center; gap: 12px; padding: 7px 6px; border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .obj:hover { background: var(--surface); }
  .obj.sel { background: var(--amber-soft); }
  .obj img, .obj .ph { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); }
  .obj.red img, .obj.red .ph { border-radius: 50%; }
  .obj .t { flex: 1; min-width: 0; }
  .obj .t1 { font-weight: 650; }
  .obj .t2 { font-size: 13px; color: var(--fg-mute); }
  .obj .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-firm); flex: none; display: grid; place-items: center; color: var(--on-amber); }
  .obj.sel .ck { background: var(--amber); border-color: var(--amber); }
  .obj .ck svg { width: 13px; height: 13px; stroke-width: 3; opacity: 0; }
  .obj.sel .ck svg { opacity: 1; }
  .ph { display: grid; place-items: center; color: var(--fg-mute); }

  /* barra de seleccion + minirreproductor */
  .abajo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  .abajo > * { pointer-events: auto; max-width: 880px; margin: 0 auto; }
  .accion {
    background: var(--fg); color: var(--bg); border-radius: 16px; padding: 8px; margin-bottom: 8px;
    display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none;
    box-shadow: var(--shadow-lg);
    animation: sube .22s var(--ease-out);
  }
  .accion::-webkit-scrollbar { display: none; }
  .accion .cuantas { font-weight: 800; padding: 0 8px 0 6px; white-space: nowrap; font-size: 14px; }
  .accion button {
    border: 0; background: transparent; color: inherit; font-weight: 650; font-size: 13px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 9px; border-radius: 10px; cursor: pointer; white-space: nowrap;
  }
  .accion button:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }
  .accion button:active { transform: scale(0.95); }
  .accion button svg { width: 19px; height: 19px; }
  @keyframes sube { from { transform: translateY(12px); opacity: 0; } }
  .mini {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 7px; cursor: pointer;
  }
  .mini img, .mini .ph { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); }
  .mini .t { flex: 1; min-width: 0; }
  .mini .t1 { font-weight: 650; font-size: 14px; }
  .mini .t2 { font-size: 12px; color: var(--fg-mute); }
  .mini .prog { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .mini .prog i { display: block; height: 100%; background: var(--jade); width: 0; }
  .mini .btn { border: 0; background: transparent; padding: 8px; }

  /* hojas */
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 60; opacity: 0; transition: opacity .25s; }
  .velo.on { opacity: 1; }
  .hoja {
    position: fixed; left: 50%; bottom: 0; z-index: 61; width: min(560px, 100vw);
    max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg);
    padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translate(-50%, 100%); transition: transform .32s var(--ease-drawer);
  }
  .hoja.on { transform: translate(-50%, 0); }
  .hoja .asa { width: 38px; height: 5px; border-radius: 3px; background: var(--line-firm); margin: 2px auto 10px; }
  .hoja h2 { margin: 0 0 4px; }
  .opc { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .opc button, .opc a {
    display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; color: var(--fg);
    padding: 11px 8px; border-radius: 10px; font-size: 15px; font-weight: 550; cursor: pointer; text-decoration: none;
  }
  .opc button:hover, .opc a:hover { background: var(--surface); }
  .opc button.danger { color: var(--rust); }
  .opc .sub { font-size: 12.5px; color: var(--fg-mute); font-weight: 400; display: block; }
  .opc svg { width: 20px; height: 20px; color: var(--fg-soft); }
  .opc button.danger svg { color: var(--rust); }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translate(-50%, -20px); opacity: 0;
    background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; z-index: 80; font-weight: 600; font-size: 14px;
    transition: transform .25s var(--ease-out), opacity .25s; max-width: calc(100vw - 28px); display: flex; gap: 12px; align-items: center;
    box-shadow: var(--shadow-lg);
  }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
  .toast button { border: 0; background: transparent; color: var(--amber); font-weight: 800; cursor: pointer; padding: 0; }
  .progreso { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); z-index: 79;
    background: var(--surface); border: 1px solid var(--line-firm); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow-lg);
    width: min(420px, calc(100vw - 28px)); font-size: 14px; }
  .progreso .b { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 2px; overflow: hidden; }
  .progreso .b i { display: block; height: 100%; background: var(--amber); width: 0; transition: width .2s; }
  .vacio { text-align: center; color: var(--fg-mute); padding: 40px 20px; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--line-firm); border-top-color: var(--amber); border-radius: 50%; animation: gira .8s linear infinite; margin: 30px auto; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .hist { display: flex; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .hist .t { flex: 1; min-width: 0; }
  .hist.hecho .t { opacity: .5; text-decoration: line-through; }
  input[type=range] { width: 100%; accent-color: var(--amber); }
  .disp { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 10px; cursor: pointer; }
  .disp:hover { background: var(--surface); }
  .disp.on { color: var(--jade); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="logo">Mando <span>de Spotify</span></div>
    <button class="btn ghost ico" id="bRecargar" title="Volver a leer de Spotify"></button>
    <button class="btn ghost ico" id="bAjustes" title="Conexión y copias"></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="abajo" id="abajo">
  <div class="accion" id="accion" hidden></div>
  <div class="mini" id="mini" hidden></div>
</div>
<div class="toast" id="toast"></div>
<div class="progreso" id="progreso" hidden></div>

<script>
'use strict';
/* ============================================================
   MANDO DE SPOTIFY
   ------------------------------------------------------------
   Editar Spotify de verdad, rapido y en bloque: playlists, «Me
   gusta», discos, artistas seguidos y el reproductor.
   Todo lo que borra o reordena guarda antes una foto de como
   estaba, asi que cualquier cambio se puede deshacer desde
   «Cambios».
   La sesion la abre MusicVault (es la pagina registrada en el
   panel de Spotify) y aqui se reutiliza: renovar el token no
   necesita Redirect URI.
   Rutas de 2026: /playlists/{id}/items y /me/library (40 por
   peticion) para guardar, seguir y dejar de seguir de todo.
   ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const leer = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } };
const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const K_CREDS = 'musicvault_spotify_creds_v1';
const K_HIST = 'mando_historial_v1';
const K_PREFS = 'mando_prefs_v1';
const API = 'https://api.spotify.com/v1';
const CONECTAR = 'musicvault.html?conectar=mando';

/* ---------------- iconos (trazo, estilo Lucide) ---------------- */
const ICO = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  mas: '<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  mover: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  papelera: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  corazon: '<path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 1 1 12 6a5 5 0 1 1 7.5 6.6z"/>',
  cola: '<path d="M3 6h13M3 12h13M3 18h9M17 15l5 3-5 3z"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  pausa: '<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>',
  sig: '<path d="M5 4v16l11-8zM19 5v14"/>',
  ant: '<path d="M19 20V4L8 12zM5 19V5"/>',
  aleat: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  repetir: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  enlace: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  disco: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>',
  persona: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  lista: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  buscar: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',

function tieneScope(s) { const c = cred(); return !!(c && c.scope && c.scope.split(' ').indexOf(s) >= 0); }
const permisosQueFaltan = () => PERMISOS.filter(p => !tieneScope(p.s));

async function token() {
  const c = cred();
  if (!c || !c.refreshToken) throw new Error('SIN_CONEXION');
  if (c.accessToken && c.expiresAt > Date.now()) return c.accessToken;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: c.refreshToken, client_id: c.clientId })
  });
  if (!res.ok) throw new Error('La sesión de Spotify ha caducado: vuelve a conectar');
  const d = await res.json();
  escribir(K_CREDS, {
    clientId: c.clientId, accessToken: d.access_token,
    refreshToken: d.refresh_token || c.refreshToken,
    expiresAt: Date.now() + (d.expires_in - 60) * 1000,
    scope: d.scope || c.scope || ''
  });
  return d.access_token;
}

/* Freno de Spotify (429): una sola puerta para todas las peticiones, que se
   espera a trozos de un segundo para que Detener funcione de verdad. */
let _pausaHasta = 0, _parar = false, _429 = 0;
const esperaPendiente = () => Math.max(0, Math.ceil((_pausaHasta - Date.now()) / 1000));
async function esperarTurno() {
  let falta = _pausaHasta - Date.now();
  while (falta > 0 && !_parar) { await sleep(Math.min(falta, 1000)); falta = _pausaHasta - Date.now(); }
}
async function motivo(res) {
  let t = '';
  try { const j = await res.json(); t = (j && j.error && (j.error.message || j.error.reason || j.error)) || ''; } catch (e) {}
  return res.status + (t ? ': ' + t : '');
}

async function sp(ruta, o) {
  o = o || {};
  let intentos = 0;
  while (true) {
    if (_parar && !o.siempre) throw new Error('DETENIDO');
    await esperarTurno();
    const tk = await token();
    const cab = { Authorization: 'Bearer ' + tk };
    let cuerpo;
    if (o.body !== undefined) {
      if (o.raw) { cuerpo = o.body; cab['Content-Type'] = o.tipo || 'text/plain'; }
      else { cuerpo = JSON.stringify(o.body); cab['Content-Type'] = 'application/json'; }
    }
    let res;
    try {
      res = await fetch(ruta.indexOf('http') === 0 ? ruta : API + ruta, { method: o.method || 'GET', headers: cab, body: cuerpo });
    } catch (e) {
      if (++intentos > 3) throw new Error('Sin conexión con Spotify');
      await sleep(800 * intentos);
      continue;
    }
    if (res.status === 429) {
      const ra = +(res.headers.get('Retry-After') || 0);
      const seg = ra > 0 ? ra : Math.min(60, 2 * Math.pow(2, _429++));
      _pausaHasta = Math.max(_pausaHasta, Date.now() + seg * 1000 + 300);
      if (++intentos > 6) { const e = new Error('Spotify está frenando las peticiones: prueba en un rato'); e.status = 429; throw e; }
      continue;
    }
    if (res.status === 401) {
      if (++intentos > 2) throw new Error('La sesión de Spotify ya no vale: vuelve a conectar');
      const c = cred(); if (c) escribir(K_CREDS, Object.assign({}, c, { accessToken: '', expiresAt: 0 }));
      continue;
    }
    if (res.status >= 500 && res.status !== 501) {
      if (++intentos > 4) throw new Error('Spotify no responde (' + res.status + ')');
      await sleep(700 * intentos);
      continue;
    }
    _429 = 0;
    if (!res.ok) { const e = new Error(await motivo(res)); e.status = res.status; throw e; }
    if (res.status === 202 || res.status === 204) return null;
    const txt = await res.text();
    if (!txt) return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  }
}

/* Recorre paginas siguiendo el «next» que da Spotify (vale igual para
   offset que para cursores). Si Spotify no acepta 50 por pagina en una
   ruta, baja a 10 y sigue. */
async function paginar(ruta, o) {
  o = o || {};
  const tope = o.tope || Infinity;
  let lim = o.limite || 50;
  let url = ruta + (ruta.indexOf('?') >= 0 ? '&' : '?') + 'limit=' + lim;
  const out = [];
  let total = null;
  while (url && out.length < tope) {
    let d;
    try { d = await sp(url); }
    catch (e) {
      if (e.status === 400 && lim > 10 && !out.length) { lim = 10; url = url.replace(/limit=\d+/, 'limit=10'); continue; }
      throw e;
    }
    if (d && o.clave) d = d[o.clave];
    if (!d) break;
    const items = d.items || [];
    if (d.total != null) total = d.total;
    for (const x of items) out.push(x);
    if (o.alAvanzar) o.alAvanzar(out.length, total);
    if (!items.length) break;
    url = d.next || null;
  }
  return out;
}

function explicarError(e) {
  const m = (e && e.message) || String(e);
  if (m === 'DETENIDO') return 'Detenido';
  if (m === 'SIN_CONEXION') return 'Falta conectar con Spotify';
  if (e && e.status === 403) {
    if (/premium/i.test(m)) return 'Esto necesita Spotify Premium';
    if (/scope/i.test(m)) return 'Falta un permiso: vuelve a conectar desde Ajustes';
    return 'Spotify no deja hacer esto (' + m + ')';
  }
  if (e && e.status === 404 && /device/i.test(m)) return 'No hay ningún Spotify abierto: abre la app en algún aparato';
  return m;
}

let _k = 0;
function imgDe(imgs, min) {
  imgs = (imgs || []).slice().sort((a, b) => (a.width || 0) - (b.width || 0));
  const i = imgs.find(x => (x.width || 0) >= (min || 60)) || imgs[imgs.length - 1];
  return i ? i.url : '';
}
function pista(t, extra) {
  if (!t || !t.uri) return null;
  const al = t.album || (t.show ? { name: t.show.name, images: t.show.images } : {});
  const artistas = (t.artists || []).map(a => ({ id: a.id, name: a.name, uri: a.uri }));
  return {
    k: ++_k, id: t.id, uri: t.uri, tipo: t.type || 'track', local: !!t.is_local || /^spotify:local:/.test(t.uri),
    title: t.name || '', artists: artistas, album: al.name || '', albumId: al.id || '', albumUri: al.uri || '',
    cover: imgDe(al.images || t.images, 60), coverG: imgDe(al.images || t.images, 300),
    year: String(al.release_date || '').slice(0, 4), ms: t.duration_ms || 0,
    added: extra && extra.added ? (Date.parse(extra.added) || 0) : 0,
    _f: fold((t.name || '') + ' ' + artistas.map(a => a.name).join(' ') + ' ' + (al.name || ''))
  };
}

async function trozos(arr, n, fn, etiqueta) {
  for (let i = 0; i < arr.length; i += n) {
    if (etiqueta) progreso(etiqueta, i, arr.length);
    await fn(arr.slice(i, i + n), i);
  }
}
/* Biblioteca unificada de 2026: canciones, discos, artistas y playlists
   se guardan / siguen y se quitan con la misma ruta, de 40 en 40. */
const libPoner = (uris, et) => trozos(uris, 40, u => sp('/me/library?uris=' + encodeURIComponent(u.join(',')), { method: 'PUT' }), et);
const libQuitar = (uris, et) => trozos(uris, 40, u => sp('/me/library?uris=' + encodeURIComponent(u.join(',')), { method: 'DELETE' }), et);
async function libTiene(uris) {
  const out = [];
  await trozos(uris, 40, async u => {
    const d = await sp('/me/library/contains?uris=' + encodeURIComponent(u.join(',')));
    for (const b of (d || [])) out.push(!!b);
  });
  return out;
}
async function plAnadir(id, uris, pos, et) {
  await trozos(uris, 100, (u, i) => sp('/playlists/' + id + '/items', { method: 'POST', body: pos == null ? { uris: u } : { uris: u, position: pos + i } }), et);
}
async function plQuitar(id, uris, et) {
  const unicas = Array.from(new Set(uris));
  await trozos(unicas, 100, u => sp('/playlists/' + id + '/items', { method: 'DELETE', body: { items: u.map(x => ({ uri: x })) } }), et);
}
/* Reescribir la lista entera: PUT con las 100 primeras (reemplaza) y el
   resto de 100 en 100. Los archivos locales no se pueden volver a meter
   desde la API, asi que una lista con locales no se reescribe. */
async function plReescribir(id, uris, et) {
  if (uris.some(u => /^spotify:local:/.test(u))) throw new Error('Esta playlist tiene archivos locales: Spotify no deja reordenarla desde fuera');
  if (uris.length > 10000) throw new Error('Una playlist no puede pasar de 10.000 canciones');
  if (et) progreso(et, 0, uris.length);
  await sp('/playlists/' + id + '/items', { method: 'PUT', body: { uris: uris.slice(0, 100) } });
  if (uris.length > 100) await plAnadir(id, uris.slice(100), null, et);
}
async function plMoverUna(id, desde, antesDe) {
  return sp('/playlists/' + id + '/items', { method: 'PUT', body: { range_start: desde, insert_before: antesDe, range_length: 1 } });
}
async function crearPlaylist(nombre, desc, publica) {
  const d = await sp('/me/playlists', { method: 'POST', body: { name: nombre, description: desc || '', public: !!publica } });
  if (!d || !d.id) throw new Error('Spotify no ha devuelto la playlist creada');
  S.playlists = null;
  return d;
}

/* ============================================================
   HISTORIAL (deshacer)
   Cada cambio guarda lo necesario para volver atras.
   ============================================================ */
let HIST = leer(K_HIST, []);
function apuntar(txt, deshacer) {
  HIST.unshift({ id: Date.now() + '' + Math.random().toString(36).slice(2, 6), at: Date.now(), txt: txt, d: deshacer, hecho: false });
  HIST = HIST.slice(0, 40);
  /* si no cabe, se quitan fotos viejas antes que perder la nueva */
  while (!escribir(K_HIST, HIST) && HIST.length > 1) HIST.pop();
}
async function deshacer(h) {
  const d = h.d;
  if (!d) return;
  if (d.t === 'reescribir') await plReescribir(d.pid, d.uris, 'Deshaciendo');
  else if (d.t === 'plQuitar') await plQuitar(d.pid, d.uris, 'Deshaciendo');
  else if (d.t === 'plAnadir') await plAnadir(d.pid, d.uris, null, 'Deshaciendo');
  else if (d.t === 'libPoner') await libPoner(d.uris, 'Deshaciendo');
  else if (d.t === 'libQuitar') await libQuitar(d.uris, 'Deshaciendo');
  else if (d.t === 'detalles') await sp('/playlists/' + d.pid, { method: 'PUT', body: d.antes });
  else if (d.t === 'varios') { for (const x of d.lista) await deshacer({ d: x }); }
  h.hecho = true;
  escribir(K_HIST, HIST);
}
async function deshacerUltimo(id) {
  const h = HIST.find(x => x.id === id);
  if (!h || h.hecho) return;
  await trabajo(async () => { await deshacer(h); invalidar(); toast('Deshecho: ' + h.txt); }, 'Deshaciendo');
  render();
}
/* Ejecuta algo largo con barra de progreso, Detener y errores explicados. */
async function trabajo(fn, txt) {
  _parar = false;
  progreso(txt || 'Trabajando…');
  try { return await fn(); }
  catch (e) { toast(explicarError(e)); return undefined; }
  finally { progreso(null); _parar = false; }
}

/* "Canción 2" antes que "Canción 10", y sin distinguir tildes ni mayúsculas */
const COL = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
function ordenar(arr, o) {
  const a = arr.slice();
  const by = (fn, dir) => a.sort((x, y) => { const p = fn(x), q = fn(y); return (typeof p === 'number' ? p - q : COL.compare(p, q)) * (dir || 1); });
  if (o === 'title') by(p => p.title);
  else if (o === 'artist') by(p => nombresArtistas(p) + ' ' + p.year + ' ' + p.album);
  else if (o === 'album') by(p => p.album);
  else if (o === 'year') by(p => p.year || '0000', -1);
  else if (o === 'yearA') by(p => p.year || '9999');
  else if (o === 'ms') by(p => p.ms, -1);
  else if (o === 'added') by(p => p.added, -1);
  else if (o === 'addedA') by(p => p.added);
  return a;
}

  let v = q.length ? f.pistas.filter(p => q.every(w => p._f.indexOf(w) >= 0)) : f.pistas;
  v = ordenar(v, S.orden);

      '<span class="nowrap">' + esc(p.name) + '<span class="sub">' + p.total + ' canciones</span></span></button>').join('') + '</div>', h => {
      h.querySelector('#dQ').oninput = e => { const q = fold(e.target.value); h.querySelectorAll('#dL [data-n]').forEach(b => { b.hidden = q && b.dataset.n.indexOf(q) < 0; }); };

        const id = b.dataset.id;
        cerrarHoja();
        let ok;
        if (id === '_nueva') {
          const np = await hojaNuevaPlaylist(ps.filter(p => !p.local).map(p => p.uri));
          ok = !!np;
          if (ok && mover) await quitarDeFuente(ps, true, ps.length + ' movidas a «' + np.name + '»');
          return;

      };

}
async function anadirAPlaylist(dest, ps) {
  return trabajo(async () => {
    let uris = ps.filter(p => !p.local).map(p => p.uri);
    let saltadas = 0;
    if (PREFS.saltarRepes) {
      const ya = new Set((await pistasDePlaylist(dest.id, (n, t) => progreso('Mirando qué hay en «' + dest.name + '»', n, t))).map(p => p.uri));
      const antes = uris.length;
      uris = Array.from(new Set(uris)).filter(u => !ya.has(u));
      saltadas = antes - uris.length;
    }
    if (!uris.length) { toast('Ya estaban todas en «' + dest.name + '»'); return true; }
    await plAnadir(dest.id, uris, null, 'Añadiendo a «' + dest.name + '»');
    /* si se saltaron las repetidas, las añadidas no estaban antes y quitarlas
       por uri deja la lista exactamente como estaba */
    apuntar(uris.length + ' añadidas a «' + dest.name + '»', PREFS.saltarRepes ? { t: 'plQuitar', pid: dest.id, uris: uris } : null);
    S.playlists = null;
    toast(uris.length + ' añadidas a «' + dest.name + '»' + (saltadas ? ' (' + saltadas + ' ya estaban)' : ''));
    return true;
  }, 'Añadiendo');
}
async function darLike(ps) {
  const uris = Array.from(new Set(ps.filter(p => !p.local && (p.tipo === 'track' || p.tipo === 'episode')).map(p => p.uri)));
  return trabajo(async () => {
    const ya = await libTiene(uris);
    const nuevas = uris.filter((u, i) => !ya[i]);
    if (!nuevas.length) { toast('Ya estaban todas en Me gusta'); return true; }
    await libPoner(nuevas, 'Guardando en Me gusta');
    apuntar(nuevas.length + ' a Me gusta', { t: 'libQuitar', uris: nuevas });
    S.likes = null;
    toast(nuevas.length + ' a Me gusta');

}

/* Quitar de la fuente. En una playlist: si ninguna de las quitadas se queda
   repetida en otro sitio de la lista, basta un DELETE por uri (y las demas
   conservan su fecha); si no, se reescribe la lista sin ellas. */
async function quitarDeFuente(ps, sinPreguntar, msg) {
  const f = S.fuente;
  if (!f.editable) return;
  if (!sinPreguntar && !(await confirmar('¿Quitar ' + ps.length + ' de «' + f.name + '»?', 'Quitar', 'Se puede deshacer desde Cambios.'))) return;
  const fuera = new Set(ps.map(p => p.k));
  const quedan = f.pistas.filter(p => !fuera.has(p.k));
  const ok = await trabajo(async () => {
    if (f.kind === 'likes') {
      const uris = Array.from(new Set(ps.map(p => p.uri)));
      await libQuitar(uris, 'Quitando de Me gusta');
      apuntar(uris.length + ' quitadas de Me gusta', { t: 'libPoner', uris: uris });
    } else {
      const antes = f.pistas.map(p => p.uri);
      const urisFuera = new Set(ps.map(p => p.uri));
      const limpio = !quedan.some(p => urisFuera.has(p.uri));
      if (limpio) await plQuitar(f.id, Array.from(urisFuera), 'Quitando de «' + f.name + '»');
      else await plReescribir(f.id, quedan.map(p => p.uri), 'Reescribiendo «' + f.name + '»');
      apuntar(ps.length + ' quitadas de «' + f.name + '»', { t: 'reescribir', pid: f.id, uris: antes });
    }
    return true;
  }, 'Quitando');
  if (!ok) return;
  f.pistas = quedan; S.sel.clear(); S.playlists = null; if (f.kind === 'likes') S.likes = quedan;
  toast(msg || ps.length + ' quitadas', { txt: 'Deshacer', fn: () => deshacerUltimo(HIST[0].id) });
  recalcular(); pintarAccion();
  const h = document.querySelector('.cab .tiny'); if (h) h.textContent = f.pistas.length + ' canciones';
}

/* Mover la seleccion arriba o abajo del todo. Con pocas se hace con la
   ruta de reordenar (una a una, las fechas se conservan); con muchas se
   reescribe la lista, que es una sola tanda de peticiones. */
async function moverDentro(ps, arriba) {
  const f = S.fuente;
  const sel = new Set(ps.map(p => p.k));
  const elegidas = f.pistas.filter(p => sel.has(p.k)), resto = f.pistas.filter(p => !sel.has(p.k));
  const nueva = arriba ? elegidas.concat(resto) : resto.concat(elegidas);
  await aplicarOrden(nueva, elegidas.length + (arriba ? ' subidas arriba' : ' bajadas al final') + ' en «' + f.name + '»', elegidas.length <= 15 ? { elegidas, arriba } : null);
}
async function aplicarOrden(nueva, txt, pocas) {
  const f = S.fuente;
  const antes = f.pistas.map(p => p.uri);
  const ok = await trabajo(async () => {
    if (pocas) {
      /* se simula la lista para saber la posicion de cada una en cada paso */
      const cur = f.pistas.slice();
      for (let i = 0; i < pocas.elegidas.length; i++) {
        progreso('Moviendo', i, pocas.elegidas.length);
        const p = pocas.elegidas[i];
        const desde = cur.indexOf(p);
        if (pocas.arriba ? desde === i : desde === cur.length - 1) continue;
        await plMoverUna(f.id, desde, pocas.arriba ? i : cur.length);
        cur.splice(desde, 1);
        cur.splice(pocas.arriba ? i : cur.length, 0, p);
      }
    } else await plReescribir(f.id, nueva.map(p => p.uri), 'Guardando el orden');
    apuntar(txt, { t: 'reescribir', pid: f.id, uris: antes });
    return true;
  }, 'Guardando el orden');
  if (!ok) return;
  f.pistas = nueva; S.orden = '';
  const sel = $('#fO'); if (sel) sel.value = '';
  toast(txt, { txt: 'Deshacer', fn: () => deshacerUltimo(HIST[0].id) });
  recalcular();
}
async function aLaCola(ps) {
  const uris = ps.filter(p => !p.local).map(p => p.uri).slice(0, 50);
  await trabajo(async () => {
    for (let i = 0; i < uris.length; i++) { progreso('A la cola', i, uris.length); await sp('/me/player/queue?uri=' + encodeURIComponent(uris[i]), { method: 'POST' }); }
    toast(uris.length + ' a la cola' + (ps.length > 50 ? ' (máximo 50 de golpe)' : ''));

function copiarEnlaces(ps) {
  const txt = ps.filter(p => !p.local).map(p => 'https://open.spotify.com/' + p.tipo + '/' + p.id).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
    () => toast(ps.length + ' enlaces copiados'), () => toast('No se ha podido copiar'));
}
function descargar(nombre, contenido, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo || 'application/json' }));
  a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCampo = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
function csvDe(ps) {
  return '﻿' + ['Canción', 'Artistas', 'Disco', 'Año', 'Duración', 'Añadida', 'Enlace'].map(csvCampo).join(';') + '\n' +
    ps.map(p => [p.title, nombresArtistas(p), p.album, p.year, dur(p.ms), p.added ? new Date(p.added).toISOString().slice(0, 10) : '', p.local ? '' : 'https://open.spotify.com/track/' + p.id].map(csvCampo).join(';')).join('\n');
}

function elegirPortada(f) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    await trabajo(async () => {
      const b64 = await jpegCuadrado(file);
      await sp('/playlists/' + f.id + '/images', { method: 'PUT', raw: true, tipo: 'image/jpeg', body: b64 });
      f.meta.imgG = 'data:image/jpeg;base64,' + b64; S.playlists = null;
      toast('Portada cambiada (Spotify tarda unos segundos en enseñarla)');
      render();
    }, 'Subiendo portada');
  };
  inp.click();
}
/* Spotify pide JPEG en base64 de 256 KB como mucho: se recorta al cuadrado
   del centro y se baja la calidad hasta que cabe. */
async function jpegCuadrado(file) {
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se puede leer la imagen')); i.src = URL.createObjectURL(file); });
  const lado = Math.min(img.naturalWidth, img.naturalHeight);
  for (const px of [640, 512, 400]) {
    const c = document.createElement('canvas'); c.width = c.height = px;
    c.getContext('2d').drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, px, px);
    for (let q = 0.9; q >= 0.5; q -= 0.1) {
      const b64 = c.toDataURL('image/jpeg', q).split(',')[1];
      if (b64.length <= 250000) return b64;
    }
  }
  throw new Error('La imagen es demasiado grande');
}
function hojaOrdenar(f) {
  const ops = [['title', 'Título (A-Z)'], ['artist', 'Artista, y dentro por año'], ['album', 'Disco'], ['year', 'Año, de nuevo a viejo'], ['yearA', 'Año, de viejo a nuevo'], ['ms', 'Duración, de larga a corta'], ['added', 'Añadida, lo último primero'], ['addedA', 'Añadida, lo primero primero'], ['azar', 'Al azar'], ['invertir', 'Darle la vuelta'], ['artistasMezcla', 'Repartir artistas (que no vayan dos seguidas del mismo)']];

/* Reparte para que no suenen dos seguidas del mismo artista: se van
   sacando del artista con mas canciones pendientes que no sea el ultimo. */
function repartirArtistas(ps) {
  const grupos = new Map();
  for (const p of barajar(ps.slice())) { const a = fold((p.artists[0] || {}).name); if (!grupos.has(a)) grupos.set(a, []); grupos.get(a).push(p); }
  const out = []; let ultimo = null;
  while (out.length < ps.length) {
    let mejor = null;
    for (const [a, l] of grupos) if (l.length && a !== ultimo && (!mejor || l.length > grupos.get(mejor).length)) mejor = a;
    if (mejor == null) mejor = ultimo;
    out.push(grupos.get(mejor).pop()); ultimo = mejor;
  }
  return out;
}
async function quitarRepetidas(f) {
  const vistas = new Set(), fuera = [];
  for (const p of f.pistas) { const a = p.uri, o = claveObra(p); if (vistas.has(a) || vistas.has(o)) fuera.push(p); vistas.add(a); vistas.add(o); }
  if (!fuera.length) { toast('No hay repetidas'); return; }
  S.sel = new Set(fuera.map(p => p.k)); recalcular(); pintarAccion();
  if (await confirmar('Hay ' + fuera.length + ' repetidas', 'Quitarlas', 'Se queda la primera de cada una. Incluye la misma canción en otra edición (remaster, deluxe); los directos y remixes no cuentan como repetidas.')) quitarDeFuente(fuera, true);
}

    else if (o === 'artistas') abrirVista({ pintar: async mm => {

      let l; try { l = (await paginar('/me/top/artists?time_range=medium_term', { limite: 50, tope: 50 })).map(artistaDe); } catch (e) { return fallo(mm, e); }
      mm.innerHTML = '<button class="btn ghost sm back" id="bAtras">' + ic('atras') + 'Atrás</button><h2>' + esc(nom) + '</h2><p class="mute tiny">Últimos 6 meses</p><div class="lista-obj">' +
        l.map((a, i) => '<div class="obj red" data-id="' + a.id + '"><span class="mute tiny" style="width:20px;text-align:right">' + (i + 1) + '</span>' + imgOph(a.img, 'persona', true) + '<div class="t"><div class="t1 nowrap">' + esc(a.name) + '</div><div class="t2 nowrap">' + esc(a.sub) + '</div></div></div>').join('') + '</div>';
      $('#bAtras').onclick = atras;
      mm.querySelectorAll('.obj').forEach(el => el.onclick = () => abrirArtista(el.dataset.id));
    } });
    else abrirFuente({ kind: 'top', name: nom, editable: false, pistas: null },
      async () => (await paginar('/me/top/tracks?time_range=' + o, { limite: 50, tope: 100 })).map(t => pista(t)).filter(Boolean));
  };
}

/* ============================================================
   CAMBIOS (deshacer)
   ============================================================ */
function vCambios(m) {
  if (!HIST.length) { m.innerHTML = '<div class="vacio">Aquí aparecerá todo lo que cambies, con su botón de deshacer.</div>'; return; }
  m.innerHTML = '<p class="soft tiny">Los últimos 40 cambios hechos desde el Mando en este aparato. Deshacer una reordenación o un borrado deja la playlist como estaba (las fechas de «añadida» pasan a ser las de hoy).</p>' +
    HIST.map(h => '<div class="hist' + (h.hecho ? ' hecho' : '') + '"><div class="t"><div class="nowrap">' + esc(h.txt) + '</div><div class="mute tiny">' + new Date(h.at).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }) + '</div></div>' +
      (h.d && !h.hecho ? '<button class="btn sm" data-h="' + h.id + '">' + ic('deshacer') + 'Deshacer</button>' : (h.hecho ? '<span class="tiny mute">deshecho</span>' : '')) + '</div>').join('');
  m.onclick = async e => {
    const b = e.target.closest('[data-h]'); if (!b) return;
    const h = HIST.find(x => x.id === b.dataset.h);
    if (!(await confirmar('¿Deshacer «' + h.txt + '»?', 'Deshacer'))) return;
    deshacerUltimo(h.id);
  };
}

/* ============================================================
   REPRODUCTOR
   ============================================================ */
async function reproducir(cuerpo) {
  try {
    await sp('/me/player/play' + (S.dispositivo ? '?device_id=' + S.dispositivo : ''), { method: 'PUT', body: cuerpo });
    setTimeout(leerReproductor, 700);
  } catch (e) {
    if (e.status === 404) {
      /* no hay aparato activo: se prueba con el primero que haya abierto */
      try {
        const d = await sp('/me/player/devices');
        const disp = ((d && d.devices) || [])[0];
        if (disp) { await sp('/me/player/play?device_id=' + disp.id, { method: 'PUT', body: cuerpo }); setTimeout(leerReproductor, 700); return; }
      } catch (e2) { e = e2; }
    }
    toast(explicarError(e));
  }
}
async function leerReproductor() {
  if (!conectado() || !tieneScope('user-read-playback-state')) { $('#mini').hidden = true; return; }
  let d;
  try { d = await sp('/me/player?additional_types=episode', { siempre: true }); } catch (e) { return; }
  const t = d && d.item;
  if (!t) { S.suena = null; $('#mini').hidden = true; return; }
  const antes = S.suena && S.suena.uri;
  S.suena = { uri: t.uri, p: pista(t), playing: d.is_playing, prog: d.progress_ms, dur: t.duration_ms, shuffle: d.shuffle_state, repeat: d.repeat_state, vol: d.device && d.device.volume_percent, disp: d.device, ctx: d.context, at: Date.now() };
  pintarMini();
  if (antes !== t.uri) pintarFilas(true);
}
function pintarMini() {
  const s = S.suena, el = $('#mini');
  if (!s) { el.hidden = true; return; }
  el.hidden = false;
  const prog = Math.min(1, (s.prog + (s.playing ? Date.now() - s.at : 0)) / (s.dur || 1));
  el.innerHTML = imgOph(s.p.cover, 'disco') + '<div class="t"><div class="t1 nowrap">' + esc(s.p.title) + '</div><div class="t2 nowrap">' + esc(nombresArtistas(s.p)) + (s.disp ? ' · ' + esc(s.disp.name) : '') + '</div><div class="prog"><i style="width:' + (prog * 100).toFixed(1) + '%"></i></div></div>' +
    '<button class="btn ico" data-p="ant">' + ic('ant') + '</button><button class="btn ico" data-p="pp">' + ic(s.playing ? 'pausa' : 'play') + '</button><button class="btn ico" data-p="sig">' + ic('sig') + '</button>';
}
$('#mini').onclick = async e => {
  const b = e.target.closest('[data-p]');
  if (!b) return hojaReproductor();
  e.stopPropagation();
  const p = b.dataset.p;
  try {
    if (p === 'pp') { await sp('/me/player/' + (S.suena.playing ? 'pause' : 'play'), { method: 'PUT' }); S.suena.playing = !S.suena.playing; S.suena.prog += 0; pintarMini(); }
    else await sp('/me/player/' + (p === 'sig' ? 'next' : 'previous'), { method: 'POST' });
  } catch (err) { toast(explicarError(err)); }
  setTimeout(leerReproductor, 600);
};
async function hojaReproductor() {
  const s = S.suena;
  let disp = [];
  try { disp = ((await sp('/me/player/devices')) || {}).devices || []; } catch (e) {}
  const REP = { off: 'Sin repetir', context: 'Repetir la lista', track: 'Repetir la canción' };
  hoja((s ? '<div class="cab">' + (s.p.coverG ? '<img src="' + esc(s.p.coverG) + '">' : ph('disco')) + '<div class="txt"><h2>' + esc(s.p.title) + '</h2><div class="soft">' + esc(nombresArtistas(s.p)) + '</div><div class="mute tiny">' + esc(s.p.album) + '</div></div></div>' : '<h2>Reproductor</h2>') +
    '<div class="btnrow" style="justify-content:center;margin:6px 0 12px">' +
    '<button class="btn' + (s && s.shuffle ? ' pri' : '') + '" data-p="shuffle">' + ic('aleat') + '</button>' +
    '<button class="btn" data-p="ant">' + ic('ant') + '</button>' +
    '<button class="btn pri" data-p="pp">' + ic(s && s.playing ? 'pausa' : 'play') + '</button>' +
    '<button class="btn" data-p="sig">' + ic('sig') + '</button>' +
    '<button class="btn' + (s && s.repeat !== 'off' ? ' pri' : '') + '" data-p="repeat" title="' + (s ? REP[s.repeat] : '') + '">' + ic('repetir') + '</button></div>' +
    (s && s.vol != null ? '<label class="lbl">' + ic('altavoz') + ' Volumen</label><input type="range" id="rVol" min="0" max="100" value="' + s.vol + '">' : '') +
    (s ? '<div class="opc"><button data-p="anadir">' + ic('plus') + 'Añadir esta canción a una playlist</button><button data-p="like">' + ic('corazon') + 'Me gusta</button>' +
      (s.p.albumId ? '<button data-p="disco">' + ic('disco') + 'Ver el disco</button>' : '') + '</div>' : '') +
    '<label class="lbl">Sonar en</label>' + (disp.length ? disp.map(x => '<div class="disp' + (x.is_active ? ' on' : '') + '" data-d="' + x.id + '">' + ic('altavoz') + '<span class="nowrap" style="flex:1">' + esc(x.name) + ' <span class="mute tiny">' + esc(x.type) + '</span></span>' + (x.is_active ? ic('check') : '') + '</div>').join('') : '<p class="mute tiny">No hay ningún Spotify abierto. Abre la app en el móvil, el ordenador o un altavoz.</p>'), h => {
      h.onclick = async e => {
        const d = e.target.closest('[data-d]');
        try {
          if (d) { await sp('/me/player', { method: 'PUT', body: { device_ids: [d.dataset.d], play: true } }); toast('Cambiado'); cerrarHoja(); setTimeout(leerReproductor, 900); return; }
          const b = e.target.closest('[data-p]'); if (!b) return;
          const p = b.dataset.p;
          if (p === 'pp') await sp('/me/player/' + (s && s.playing ? 'pause' : 'play'), { method: 'PUT' });
          else if (p === 'sig' || p === 'ant') await sp('/me/player/' + (p === 'sig' ? 'next' : 'previous'), { method: 'POST' });
          else if (p === 'shuffle') await sp('/me/player/shuffle?state=' + !(s && s.shuffle), { method: 'PUT' });
          else if (p === 'repeat') { const sigR = { off: 'context', context: 'track', track: 'off' }[(s && s.repeat) || 'off']; await sp('/me/player/repeat?state=' + sigR, { method: 'PUT' }); toast(REP[sigR]); }
          else if (p === 'anadir') { cerrarHoja(); const f0 = S.fuente; S.fuente = { kind: 'suelta', name: '', pistas: [s.p] }; await elegirDestino([s.p], false); S.fuente = f0; return; }
          else if (p === 'like') { cerrarHoja(); darLike([s.p]); return; }
          else if (p === 'disco') { cerrarHoja(); abrirDisco(s.p.albumId); return; }
          cerrarHoja(); setTimeout(leerReproductor, 600);
        } catch (err) { toast(explicarError(err)); }
      };
      const v = h.querySelector('#rVol');
      if (v) v.onchange = async () => { try { await sp('/me/player/volume?volume_percent=' + v.value, { method: 'PUT' }); } catch (err) { toast(explicarError(err)); } };
    });
}
setInterval(() => { if (document.visibilityState === 'visible') leerReproductor(); }, 15000);
setInterval(() => { if (S.suena && S.suena.playing && document.visibilityState === 'visible') pintarMini(); }, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') leerReproductor(); });

/* ============================================================
   AJUSTES: conexion y copias de seguridad
   ============================================================ */
function hojaAjustes() {
  const f = permisosQueFaltan();
  hoja('<h2>Conexión y copias</h2>' +
    (conectado() ? '<p class="soft">Conectado' + (S.me ? ' como <b>' + esc(S.me.display_name || S.me.id) + '</b>' : '') + '. ' + (f.length ? 'Faltan ' + f.length + ' permisos.' : 'Tiene todos los permisos.') + '</p>' : '<p class="soft">Sin conectar.</p>') +
    '<a class="btn ' + (f.length || !conectado() ? 'pri ' : '') + 'wide" href="' + CONECTAR + '">' + (conectado() ? 'Volver a conectar' : 'Conectar con Spotify') + '</a>' +
    '<h3>Copia de seguridad</h3><p class="soft tiny">Descarga un archivo con todas tus playlists (con sus canciones), tus Me gusta, tus discos y los artistas que sigues. Si algún día se borra algo, desde aquí se puede recrear.</p>' +
    '<div class="btnrow"><button class="btn" id="aCopia">' + ic('bajar') + 'Descargar copia de todo</button><button class="btn" id="aRest">' + ic('subir') + 'Recuperar desde una copia</button></div>' +
    '<h3>Tema</h3><div class="chips" id="aTema">' + [['', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro']].map(t => '<button class="chip' + ((PREFS.tema || '') === t[0] ? ' on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
    '<p class="mute tiny" style="margin-top:16px"><a href="index.html" style="color:inherit">Volver a Mi Música</a></p>', h => {
      h.querySelector('#aCopia').onclick = () => { cerrarHoja(); copiaDeTodo(); };
      h.querySelector('#aRest').onclick = () => { cerrarHoja(); restaurarCopia(); };
      h.querySelector('#aTema').onclick = e => { const c = e.target.closest('[data-t]'); if (!c) return; PREFS.tema = c.dataset.t; guardarPrefs(); aplicarTema(); cerrarHoja(); };
    });
}
function aplicarTema() { if (PREFS.tema) document.documentElement.dataset.theme = PREFS.tema; else delete document.documentElement.dataset.theme; }
async function copiaDeTodo() {
  await trabajo(async () => {
    await yo();
    const pls = await cargarPlaylists(true);
    const out = { hecha: new Date().toISOString(), usuario: S.me.id, playlists: [], meGusta: [], discos: [], artistas: [] };
    for (let i = 0; i < pls.length; i++) {
      const p = pls[i];
      progreso('Copiando «' + p.name + '»', i, pls.length);
      const ps = await pistasDePlaylist(p.id);
      out.playlists.push({ id: p.id, nombre: p.name, descripcion: p.desc, publica: p.publica, mia: esMia(p), canciones: ps.map(x => ({ uri: x.uri, t: x.title, a: nombresArtistas(x), al: x.album })) });
    }
    progreso('Copiando Me gusta');
    out.meGusta = (await pistasMeGusta()).map(x => ({ uri: x.uri, t: x.title, a: nombresArtistas(x), añadida: x.added ? new Date(x.added).toISOString() : '' }));
    progreso('Copiando discos');
    out.discos = (await paginar('/me/albums')).map(x => ({ uri: x.album.uri, nombre: x.album.name }));
    progreso('Copiando artistas');
    out.artistas = (await paginar('/me/following?type=artist', { clave: 'artists' })).map(a => ({ uri: a.uri, nombre: a.name }));
    descargar('spotify-copia-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(out));
    toast('Copia descargada: ' + out.playlists.length + ' playlists, ' + out.meGusta.length + ' Me gusta');
  }, 'Haciendo la copia');
}
function restaurarCopia() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    let c;
    try { c = JSON.parse(await inp.files[0].text()); } catch (e) { toast('Ese archivo no es una copia del Mando'); return; }
    if (!c || !Array.isArray(c.playlists)) { toast('Ese archivo no es una copia del Mando'); return; }
    hoja('<h2>Copia del ' + esc(new Date(c.hecha).toLocaleDateString('es-ES')) + '</h2><p class="soft tiny">Elige qué recuperar. Las playlists se crean nuevas (no pisan nada).</p><div id="rL" style="max-height:46vh;overflow:auto">' +
      c.playlists.map((p, i) => '<label class="check"><input type="checkbox" value="' + i + '"> <span class="nowrap">' + esc(p.nombre) + ' <span class="mute">· ' + p.canciones.length + '</span></span></label>').join('') +
      '<label class="check"><input type="checkbox" id="rLikes"> Volver a poner los ' + c.meGusta.length + ' Me gusta</label>' +
      '<label class="check"><input type="checkbox" id="rDis"> Volver a guardar los ' + c.discos.length + ' discos</label>' +
      '<label class="check"><input type="checkbox" id="rArt"> Volver a seguir a los ' + c.artistas.length + ' artistas</label></div>' +
      '<button class="btn pri wide" id="rOk" style="margin-top:10px">Recuperar</button>', h => {
        h.querySelector('#rOk').onclick = async () => {
          const idx = Array.from(h.querySelectorAll('#rL input[value]:checked')).map(x => +x.value);
          const likes = h.querySelector('#rLikes').checked, dis = h.querySelector('#rDis').checked, art = h.querySelector('#rArt').checked;
          cerrarHoja();
          await trabajo(async () => {
            const hechos = [];
            for (const i of idx) {
              const p = c.playlists[i];
              const np = await crearPlaylist(p.nombre, p.descripcion || '', false);
              await plAnadir(np.id, p.canciones.map(x => x.uri).filter(u => !/^spotify:local:/.test(u)), null, 'Recuperando «' + p.nombre + '»');
              hechos.push({ t: 'libQuitar', uris: [np.uri] });
            }
            /* Me gusta: de la mas vieja a la mas nueva, para que queden en el mismo orden */
            if (likes) { const u = c.meGusta.map(x => x.uri).reverse(); await libPoner(u, 'Recuperando Me gusta'); hechos.push({ t: 'libQuitar', uris: u }); }
            if (dis) { const u = c.discos.map(x => x.uri); await libPoner(u, 'Recuperando discos'); hechos.push({ t: 'libQuitar', uris: u }); }
            if (art) { const u = c.artistas.map(x => x.uri); await libPoner(u, 'Recuperando artistas'); hechos.push({ t: 'libQuitar', uris: u }); }
            apuntar('Recuperado desde una copia', { t: 'varios', lista: hechos });
            invalidar();
            toast('Recuperado');
          }, 'Recuperando');
          render();
        };
      });
  };
  inp.click();
}

/* ============================================================
   HOJAS Y CONFIRMACIONES
   ============================================================ */
let _hoja = null;
function hoja(html, alMontar, alCerrar) {
  cerrarHoja(true);
  const velo = document.createElement('div'); velo.className = 'velo';
  const h = document.createElement('div'); h.className = 'hoja'; h.setAttribute('role', 'dialog');
  h.innerHTML = '<div class="asa"></div>' + html;
  document.body.append(velo, h);
  _hoja = { velo, h, alCerrar };
  velo.onclick = () => cerrarHoja();
  requestAnimationFrame(() => { velo.classList.add('on'); h.classList.add('on'); });
  if (alMontar) alMontar(h);
  return h;
}
function cerrarHoja(ya) {
  if (!_hoja) return;
  const { velo, h, alCerrar } = _hoja; _hoja = null;
  if (alCerrar) alCerrar();
  if (ya) { velo.remove(); h.remove(); return; }
  velo.classList.remove('on'); h.classList.remove('on');
  setTimeout(() => { velo.remove(); h.remove(); }, 320);
}
addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });
function confirmar(titulo, boton, texto) {
  return new Promise(ok => {
    let dicho = false;
    hoja('<h2>' + esc(titulo) + '</h2>' + (texto ? '<p class="soft">' + esc(texto) + '</p>' : '') +
      '<div class="btnrow" style="margin-top:14px"><button class="btn" id="cNo" style="flex:1">Cancelar</button><button class="btn pri" id="cSi" style="flex:1">' + esc(boton) + '</button></div>', h => {
        h.querySelector('#cNo').onclick = () => { dicho = true; cerrarHoja(); ok(false); };
        h.querySelector('#cSi').onclick = () => { dicho = true; cerrarHoja(); ok(true); };
      }, () => { if (!dicho) ok(false); });
  });
}

/* ============================================================
   ARRANQUE
   ============================================================ */
$('#bRecargar').innerHTML = ic('recargar');
$('#bAjustes').innerHTML = ic('ajustes');
$('#bRecargar').onclick = () => {
  invalidar();
  if (S.fuente && S.vista) S.fuente.pistas = null;
  render(); leerReproductor(); toast('Leyendo de nuevo de Spotify');
};
$('#bAjustes').onclick = hojaAjustes;
aplicarTema();
render();
leerReproductor();
</script>
