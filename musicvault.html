    <input type="text" class="field" id="sq" placeholder="Título, artista, o pega un enlace (álbum, canción, artista o playlist)" autocomplete="off">
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;">
      <button class="pillbtn" id="bulkLink">📋 Pegar varios enlaces</button>
      <button class="pillbtn" id="manualLink">🔗 Añadir enlace externo</button>
    </div>
    <div id="sres" style="margin-top:12px;"></div>
  `);
  const sq = document.getElementById('sq');
  document.getElementById('segs').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    document.querySelectorAll('#segs .seg').forEach(x => x.classList.toggle('on', x === b));
    searchType = b.dataset.t;
    searchSelMode = false; searchSel = new Set(); searchSortMode = 'relevance'; document.getElementById('searchSelBar')?.remove();
    runSearch();
  });
  document.getElementById('bulkLink').addEventListener('click', () => { bulkInputMode = 'links'; openBulk(); });
  document.getElementById('manualLink').addEventListener('click', openManualAdd);
  // 330ms disparaba una búsqueda casi por sílaba; 450 apenas se nota al
  // escribir y manda bastantes menos peticiones (menos riesgo de 429)
  sq.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 450); });
  sq.focus();
}

/* Si se teclea rápido, una búsqueda vieja puede tardar más en responder que la
   que se lanzó después (red lenta, resultado más pesado…). Sin esto, la vieja
   llega tarde y pisa los resultados correctos con otros ya obsoletos. Cada
   llamada se numera y, al volver, se descarta si ya no es la más reciente. */
let _searchSeq = 0;

async function runSearch() {
  const miTurno = ++_searchSeq;
  const q = document.getElementById('sq').value.trim();
  const box = document.getElementById('sres');
  if (!q) { box.innerHTML = ''; return; }
  if (!isConnected()) {
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>Este dispositivo todavía no está conectado con Spotify. La conexión es por dispositivo: inicia sesión aquí también.</p><div class="acts"><button class="btn primary" data-open="settings">Ir a Ajustes</button></div></div>`;
    return;
  }
  box.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  const m = q.match(URL_ONE);
  const mPl = !m && q.match(URL_PLAYLIST_ONE);   // un enlace no puede ser las dos cosas a la vez
  searchOffset = 0; searchAgotado = true;
  searchQueryActual = q; searchTypeActual = searchType;
  try {
    let resultados;
    if (mPl) {
      // la propia playlist como marcador (rápido) va primero; sus canciones sueltas
      // detrás, por si quieres quedarte solo con algunas en vez de la playlist entera
      const [meta, tracks] = await Promise.all([
        fetchPlaylistMeta(mPl[1]).catch(() => null),
        fetchPlaylist(mPl[1], (got, tot) => {
          if (miTurno === _searchSeq) box.innerHTML = `<p class="lede" style="text-align:center;padding:20px 4px;">Leyendo la playlist… ${got} de ${tot}</p>`;
        })
      ]);
      const marcador = meta ? [normalize(meta, 'playlist')] : [];
      resultados = marcador.concat(tracks.map(t => normalize(t, 'track')));
    } else if (m) {
      resultados = [normalize(await spotifyLookup(m[1], m[2]), m[1])];
    } else {
      const d = await spotifySearch(q, searchType, 0);
      resultados = (d[searchType + 's']?.items || []).map(r => normalize(r, searchType));
      searchOffset = resultados.length;
      searchAgotado = resultados.length < 10;   // menos de una página llena: no hay más
    }
    if (miTurno !== _searchSeq) return;   // ya hay una búsqueda más nueva en curso
    lastResults = resultados;
    searchSelMode = false; searchSel = new Set();   // resultados nuevos: cualquier selección previa ya no aplica
    if (!lastResults.length) {
      box.innerHTML = `<div class="empty" style="padding:26px 8px;">
        <p>Sin resultados para “${esc(q)}” en Spotify.</p>
        <p class="lede" style="margin-top:10px;">Prueba a buscarlo en otro sitio y pega el enlace con "Añadir enlace externo":</p>
        <div class="acts" style="flex-wrap:wrap;">
          <a class="btn" href="https://music.youtube.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">Buscar en YouTube Music ↗</a>
          <a class="btn" href="https://music.apple.com/search?term=${encodeURIComponent(q)}" target="_blank" rel="noopener">Buscar en Apple Music ↗</a>
        </div>
      </div>`;
      document.getElementById('searchSelBar')?.remove();
      return;
    }
    pintarResultados();
  } catch (err) {
    if (miTurno !== _searchSeq) return;
    const msg = err.message || '';
    let text = 'No se pudo conectar con Spotify. Revisa tu conexión.';
    let mostrarReconectar = false;
    if (msg === 'AUTH_FAILED' || msg === 'NO_CREDS') text = 'Tu conexión con Spotify ha caducado o no es válida. Vuelve a conectarte en Ajustes.';
    else if (msg === 'RATE_LIMIT') text = `Demasiadas búsquedas seguidas — Spotify ha puesto un límite temporal. Espera ${tiempoEsperaTexto()} y vuelve a intentarlo.`;
    else if (msg.startsWith('LOOKUP_FAILED')) text = `Ese enlace no existe o es privado (error ${msg.split(':')[1]}).`;
    else if (msg.startsWith('SEARCH_FAILED')) text = `Spotify devolvió un error ${msg.split(':')[1]}.`;
    else if (msg.startsWith('PLAYLIST_FAILED')) {
      const code = msg.split(':')[1];
      if (code === '404') text = 'Esa playlist no es accesible (privada, o de las que genera Spotify — solo funcionan las públicas de usuario).';
      else if (code === '403' && !tieneScopePlaylists()) {
        text = 'Para leer playlists (sobre todo las tuyas, que suelen ser privadas) hace falta darle un permiso nuevo a esta conexión.';
        mostrarReconectar = true;
      } else text = `No se pudo leer la playlist (error ${code}).`;
    }
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>${esc(text)}</p>${mostrarReconectar ? `<div class="acts"><button class="btn primary" data-reconnect="1">Reconectar con Spotify</button></div>` : ''}</div>`;
    document.getElementById('searchSelBar')?.remove();
  }
}

function rrow(r, i) {
  const saved = ITEMS.some(x => x.spotifyId === r.spotifyId);
  const sub = r.type === 'playlist'
    ? [r.artists[0] ? `de ${r.artists[0]}` : null, r.totalTracks != null ? `${r.totalTracks} canciones` : null].filter(Boolean).join(' · ')
    : `${r.artists.join(', ')}${r.releaseDate ? ' · ' + String(r.releaseDate).slice(0, 4) : ''}`;
  const info = `<div class="rart">${portada(r.coverUrl, TYPE_ICON[r.type], true)}</div>
    <div class="rinfo">
      <div class="rt">${esc(r.title)}</div>
      <div class="ra">${esc(sub)}</div>
    </div>`;

  if (searchSelMode) {
    const marcado = searchSel.has(i);
    return `<div class="rrow${saved ? '' : ' selectable'}" ${saved ? '' : `data-rchk="${i}"`}>
      ${info}
      <span class="rchk ${marcado ? 'on' : ''} ${saved ? 'saved' : ''}" aria-label="${saved ? 'Ya guardado' : (marcado ? 'Quitar de la selección' : 'Seleccionar')}">✓</span>
    </div>`;
  }
  return `<div class="rrow">
    ${info}
    <button class="addbtn ${saved ? 'done' : ''}" data-add="${i}" aria-label="${saved ? 'Ya guardado' : 'Guardar'}">${saved ? '✓' : '＋'}</button>
  </div>`;
}

// Orden de PINTADO, no de datos: devuelve índices de lastResults reordenados
// sin tocar el array — así searchSel y data-add (que son índices reales) no
// se rompen cuando cambias el criterio de orden.
function ordenResultados() {
  const idx = lastResults.map((_, i) => i);
  if (searchSortMode === 'relevance') return idx;
  idx.sort((ia, ib) => {
    const a = lastResults[ia], b = lastResults[ib];
    if (searchSortMode === 'album') return fold(a.albumName || '').localeCompare(fold(b.albumName || ''), 'es') || (a.trackNumber || 0) - (b.trackNumber || 0);
    if (searchSortMode === 'duration') return (a.durationMs || 0) - (b.durationMs || 0);
    if (searchSortMode === 'alpha') return fold(a.title).localeCompare(fold(b.title), 'es');
    return 0;
  });
  return idx;
}

/* Vuelve a pintar la lista de resultados: la barra de herramientas (Seleccionar
   varios / Añadir todos), las filas, y si hay selección activa, la barra de
   confirmación abajo. Se llama tras cada búsqueda y tras cada toque en modo
   selección, para que el recuento y las marcas siempre reflejen el estado real. */
function pintarResultados() {
  const box = document.getElementById('sres');
  if (!box) return;
  const pendientes = lastResults.filter(r => !ITEMS.some(x => x.spotifyId === r.spotifyId)).length;

  // el orden alternativo solo tiene sentido en Canciones (duración, álbum "padre")
  // y no mientras seleccionas varios — un desplegable discreto, no otra fila de pestañas
  const ordenSel = (searchType === 'track' && lastResults.length > 1 && !searchSelMode) ? `
    <select class="ctl" id="srSort" style="margin-left:auto;max-width:132px;">
      <option value="relevance" ${searchSortMode === 'relevance' ? 'selected' : ''}>Relevancia</option>
      <option value="album" ${searchSortMode === 'album' ? 'selected' : ''}>Por álbum</option>
      <option value="duration" ${searchSortMode === 'duration' ? 'selected' : ''}>Por duración</option>
      <option value="alpha" ${searchSortMode === 'alpha' ? 'selected' : ''}>A-Z</option>
    </select>` : '';

  let tools = '';
  if (lastResults.length > 1) {
    tools = searchSelMode
      ? `<div class="restools"><button data-restool="cancel">Cancelar</button></div>`
      : `<div class="restools">
           <button data-restool="selmode">Seleccionar varios</button>
           ${pendientes ? `<button data-restool="addall">Añadir todos<span class="n">(${pendientes})</span></button>` : ''}
           ${ordenSel}
         </div>`;
  }

  const masBtn = (!searchAgotado && searchOffset < TOPE_OFFSET_BUSQUEDA)
    ? `<button class="btn vermas" data-moreres="1" ${_cargandoMasResultados ? 'disabled' : ''}>${_cargandoMasResultados ? 'Cargando…' : 'Ver más resultados'}</button>`
    : '';

  box.innerHTML = tools + ordenResultados().map(i => rrow(lastResults[i], i)).join('') + masBtn;
  document.getElementById('srSort')?.addEventListener('change', e => {
    searchSortMode = e.target.value;
    pintarResultados();
  });

  const barra = document.getElementById('searchSelBar');
  if (barra) barra.remove();
  if (searchSelMode && searchSel.size) {
    document.querySelector('.sheet')?.insertAdjacentHTML('beforeend', `
      <div class="selbar" id="searchSelBar">
        <span class="cnt">${searchSel.size} seleccionado${searchSel.size === 1 ? '' : 's'}</span>
        <button class="btn" data-selbar="cancel">Cancelar</button>
        <button class="btn primary" data-selbar="add">Añadir</button>
      </div>`);
  }
}

/* Pide la siguiente página de 10 resultados y la añade al final de lastResults
   sin perder la selección ni las filas ya pintadas. */
async function cargarMasResultados() {
  if (_cargandoMasResultados || searchAgotado) return;
  _cargandoMasResultados = true;
  pintarResultados();
  try {
    const d = await spotifySearch(searchQueryActual, searchTypeActual, searchOffset);
    const nuevos = (d[searchTypeActual + 's']?.items || []).map(r => normalize(r, searchTypeActual));
    const yaIds = new Set(lastResults.map(r => r.spotifyId));
    const frescos = nuevos.filter(r => !yaIds.has(r.spotifyId));
    lastResults = lastResults.concat(frescos);
    searchOffset += nuevos.length;
    searchAgotado = nuevos.length < 10;
  } catch (e) {
    toast('No se pudieron cargar más resultados');   // offset no cambia: el botón deja reintentar
  } finally {
    _cargandoMasResultados = false;
    pintarResultados();
  }
}

/* Añade a la vez todo lo que no esté ya guardado, de un array de resultados
   de Spotify (normalizados). Usado tanto por "Añadir todos" como por
   confirmar una selección múltiple. */
function addManyResults(items) {
  let added = 0;
  items.forEach(r => {
    if (!r || ITEMS.some(x => x.spotifyId === r.spotifyId)) return;
    ITEMS.push(makeItem(r)); added++;
  });
  if (added) { saveItems(); render(); }
  return added;
}

/* ---- bulk ---- */
let playlistMode = 'tracks';
/* Cerrar el panel de "En bloque" mientras sube y volver a pulsar Añadir lanzaba
   un segundo runBulk en paralelo: cada uno calcula "ya lo tengo" contra su
   propia foto de ITEMS, así que ninguno ve lo que está subiendo el otro y el
   mismo álbum/canción acababa guardado dos veces. */
let _bulkCorriendo = false;

/* "Pegar enlaces" tiene dos modos: por enlace (lo de siempre) y por nombre
   (nuevo — busca cada línea en Spotify y guarda la mejor coincidencia, para
   cuando no tienes los enlaces a mano y quieres ir rápido con una lista). */
let bulkInputMode = 'links';
let bulkNameType = 'track';

function openBulk() {

  wireBulkSheet();
}

https://open.spotify.com/album/...

    <p class="lede">Un título por línea. Busco cada uno en Spotify y guardo la coincidencia más probable — <strong>revisa el resultado después</strong>: acierto el título casi siempre, pero no siempre la versión exacta (directo, remaster, banda sonora…). Para eso mejor un enlace.</p>
    <div class="flabel">Buscar cada línea como…</div>
    <div class="segrow" id="bulkNameSeg">
      <button class="seg ${bulkNameType === 'track' ? 'on' : ''}" data-nt="track">🎵 Canción</button>
      <button class="seg ${bulkNameType === 'album' ? 'on' : ''}" data-nt="album">💿 Álbum</button>
      <button class="seg ${bulkNameType === 'artist' ? 'on' : ''}" data-nt="artist">🎤 Artista</button>

Hotel California
Imagine"></textarea>

    <div class="btnrow">
      <button class="btn primary wide" id="bulkGo" ${_bulkCorriendo ? 'disabled' : ''}>${_bulkCorriendo ? 'Buscando…' : 'Buscar y añadir'}</button>

function wireBulkSheet() {
  document.getElementById('bulkSegs').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    if (b.dataset.t === 'back') { openSearch(); return; }
    if (b.dataset.t === 'links') { bulkInputMode = 'links'; openBulk(); return; }
    if (b.dataset.t === 'names') { bulkInputMode = 'names'; openBulk(); return; }
  });

  if (bulkInputMode === 'names') {
    document.getElementById('bulkNameSeg').addEventListener('click', e => {
      const b = e.target.closest('.seg'); if (!b) return;
      bulkNameType = b.dataset.nt;
      document.querySelectorAll('#bulkNameSeg .seg').forEach(x => x.classList.toggle('on', x === b));
    });
    document.getElementById('bulkFileBtn').addEventListener('click', () => document.getElementById('bulkFile').click());
    document.getElementById('bulkFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const box = document.getElementById('bulkNames');
        box.value = (box.value ? box.value + '\n' : '') + fr.result;
      };
      fr.readAsText(f);
      e.target.value = '';
    });
    document.getElementById('bulkGo').addEventListener('click', runBulkByName);
    document.getElementById('bulkNames').focus();
  } else {
    document.getElementById('bulkFileBtn').addEventListener('click', () => document.getElementById('bulkFile').click());
    document.getElementById('bulkFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const box = document.getElementById('bulkIn');
        box.value = (box.value ? box.value + '\n' : '') + fr.result;
        const n = (String(fr.result).match(/open\.spotify\.com\//g) || []).length;
        document.getElementById('bulkOut').innerHTML = `Archivo cargado: <strong>${n}</strong> enlaces detectados. Pulsa “Añadir al vault”.`;
      };
      fr.readAsText(f);
      e.target.value = '';
    });
    document.getElementById('plMode').addEventListener('click', e => {
      const b = e.target.closest('.seg'); if (!b) return;
      playlistMode = b.dataset.m;
      document.querySelectorAll('#plMode .seg').forEach(x => x.classList.toggle('on', x === b));
    });
    document.getElementById('bulkGo').addEventListener('click', runBulk);

async function runBulk() {
  const out = document.getElementById('bulkOut');
  const go = document.getElementById('bulkGo');
  if (_bulkCorriendo) { out.innerHTML = 'Ya hay una subida en marcha (la empezaste antes de cerrar este panel). Espera a que termine.'; return; }
  if (!isConnected()) {
    out.innerHTML = 'Este dispositivo aún no está conectado con Spotify. La conexión es por dispositivo: ve a ⚙ Ajustes y conéctate también aquí.';
    return;
  }
  const text = document.getElementById('bulkIn').value;

  const playlists = [];
  let m; URL_PLAYLIST.lastIndex = 0;
  while ((m = URL_PLAYLIST.exec(text)) !== null) if (!playlists.includes(m[1])) playlists.push(m[1]);

  const singles = new Map();
  URL_ALL.lastIndex = 0;
  while ((m = URL_ALL.exec(text)) !== null) singles.set(m[2], m[1]);

  if (!playlists.length && !singles.size) { out.innerHTML = 'No he encontrado ningún enlace de Spotify en ese texto.'; return; }

  _bulkCorriendo = true;
  go.disabled = true;
  pedirDespertar();
  let added = 0, dup = 0, fail = 0;
  let necesitaReconectarPlaylist = false;
  const notes = [];

  try {
  // 1) playlists
  for (const pid of playlists) {
    try {
      // la playlist en sí, como marcador con enlace directo (si falla solo esto,
      // seguimos igualmente con sus canciones/álbumes más abajo)
      try {
        const marcador = normalize(await fetchPlaylistMeta(pid), 'playlist');
        if (ITEMS.some(x => x.spotifyId === marcador.spotifyId)) dup++;
        else { ITEMS.push(makeItem(marcador)); added++; }
      } catch {}

      const tracks = await fetchPlaylist(pid, (got, tot) => { out.innerHTML = `Leyendo playlist… ${got} de ${tot} canciones`; });
      const wanted = new Map();
      for (const t of tracks) {
        if (playlistMode === 'albums') {
          if (t.album?.id) wanted.set(t.album.id, normalize(t.album, 'album'));
        } else {
          wanted.set(t.id, normalize(t, 'track'));
        }
      }
      let i = 0;
      for (const [sid, r] of wanted) {
        i++;
        if (i % 10 === 0) out.innerHTML = `Guardando ${i} de ${wanted.size}… <strong>${added}</strong> añadidos`;
        if (ITEMS.some(x => x.spotifyId === sid)) { dup++; continue; }
        ITEMS.push(makeItem(r)); added++;
      }
      notes.push(`Playlist: ${wanted.size} ${playlistMode === 'albums' ? 'álbumes' : 'canciones'} encontrad${playlistMode === 'albums' ? 'os' : 'as'}`);
    } catch (err) {
      const code = (err.message || '').split(':')[1];
      if (code === '403' && !tieneScopePlaylists()) {
        notes.push('Una playlist dio error 403 — para leer playlists privadas hace falta darle un permiso nuevo a esta conexión.');
        necesitaReconectarPlaylist = true;
      } else {
        notes.push(code === '404'
          ? 'Una playlist no es accesible (privada, o de las que genera Spotify — solo funcionan las públicas de usuario).'
          : `Una playlist falló (error ${code || '?'}).`);
      }
      fail++;
    }
  }

  // 2) enlaces sueltos, uno a uno (con 5 en paralelo — ver fetchItemsIndividually)
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));
  const porTipo = { album: [], track: [], artist: [] };
  for (const [id, type] of singles) {
    if (yaTengo.has(id)) { dup++; continue; }
    if (porTipo[type]) porTipo[type].push(id);
  }
  const pendientes = porTipo.album.length + porTipo.track.length + porTipo.artist.length;
  let hechosTotal = 0;
  // Con listas de cientos/miles de enlaces, Spotify acaba poniendo un límite
  // en firme (ver SEG_BLOQUEO_SOSTENIDO en fetchItemsIndividually). Antes eso
  // se traducía en un montón de "fallaron" sin explicación, y había que ir
  // pegando el resto del Excel a mano al día siguiente. Ahora, en cuanto se
  // detecta el bloqueo, lo que falte (de este tipo Y de los que quedan por
  // procesar) se guarda en la cola de importación y la propia app lo sigue
  // metiendo sola, un poco cada vez, sin que haya que volver a pegar nada.
  let bloqueado = false;
  let encoladas = 0;

  for (const tipo of ['album', 'track', 'artist']) {
    const ids = porTipo[tipo];
    if (!ids.length) continue;
    if (bloqueado) {
      encoladas += encolarImportacion(ids.map(id => ({ type: tipo, id })));
      continue;
    }
    let sinGuardar = 0;
    let datos;
    try {
      datos = await fetchItemsIndividually(tipo, ids, (n) => {
        out.innerHTML = `Procesando ${hechosTotal + n} de ${pendientes}… <strong>${added}</strong> añadidos`;
      }, null, raw => {
        // se añade y se cuenta al momento — con listas de miles, esperar a que
        // termine TODO el tipo para guardar significaba perderlo todo si se
        // cerraba la pestaña a mitad
        if (!raw.id || yaTengo.has(raw.id)) return;
        ITEMS.push(makeItem(normalize(raw, tipo)));
        yaTengo.add(raw.id);
        added++;
        if (++sinGuardar >= 25) { saveItems(); sinGuardar = 0; }
      });
    } catch (e) {
      /* Si el fallo es de credenciales, va a fallar exactamente igual con
         cada elemento que quede: antes seguía intentando todos en silencio y
         al final solo decía "N fallaron", sin explicar por qué. Ahora para
         en el primero y lo dice. Lo ya añadido (vía onItem, arriba) no se pierde. */
      saveItems();
      out.innerHTML = `Parado: tu conexión con Spotify en este dispositivo no es válida o ha caducado. Vuelve a conectarte en Ajustes.<br><span style="color:var(--fg-mute);font-size:12.5px;">${added} añadidos antes de fallar.</span>`;
      return;   // el finally de más abajo repone _bulkCorriendo y el botón
    }
    fail += datos.filter((d, idx) => !d && !datos.bloqueados[idx]).length;
    if (datos.bloqueoDetectado) {
      bloqueado = true;
      const pendientesTipo = ids.filter((id, idx) => datos.bloqueados[idx]);
      encoladas += encolarImportacion(pendientesTipo.map(id => ({ type: tipo, id })));
    }
    hechosTotal += ids.length;
    saveItems();
  }

  saveItems(); render();
  const bits = [`<strong>${added}</strong> añadidos`];
  if (dup) bits.push(`${dup} ya estaban`);
  if (fail) bits.push(`${fail} fallaron`);
  if (encoladas) bits.push(`<strong>${encoladas.toLocaleString('es-ES')}</strong> en cola`);
  out.innerHTML = bits.join(' · ')
    + (bloqueado ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">Spotify ha puesto un límite temporal por tantas peticiones seguidas (parece que va para largo — más de ${tiempoEsperaTexto()}). Lo que falta se ha guardado y esta app lo irá añadiendo sola, poco a poco, cada vez que la abras — no hace falta que hagas nada más. Puedes ver el progreso en ⚙ Ajustes → Cola de importación.</span>` : '')
    + (notes.length ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">${notes.map(esc).join('<br>')}</span>` : '')
    + (necesitaReconectarPlaylist ? `<div class="btnrow"><button class="btn primary wide" data-reconnect="1">Reconectar con Spotify</button></div>` : '');
  if (added) toast(`${added} añadido${added === 1 ? '' : 's'} al vault`);
  } finally {
    _bulkCorriendo = false;
    go.disabled = false;
    soltarDespertar();
  }
}

/* ============ Cola de importación ============
   Cuando se pegan cientos/miles de enlaces de golpe (ver runBulk), Spotify
   acaba poniendo un límite en firme que puede durar minutos u horas — no lo
   controlamos ni lo sabemos de antemano. En vez de forzar la marcha o hacer
   que el usuario vaya troceando el pegado a mano día a día, lo que no cabe
   AHORA se queda guardado aquí, y la propia app lo sigue metiendo sola, un
   poco cada vez, cada vez que se abre — sin que haga falta acordarse de nada.
   Solo vive en este dispositivo (no se sincroniza entre PC/iPhone): cada uno
   importa a su ritmo, y lo que entra al vault sí se sincroniza como siempre. */
const K_IMPORT_QUEUE = 'musicvault_import_queue_v1';
let IMPORT_QUEUE = [];   // [{type, id}] — se carga de IndexedDB en bootStorage()
const saveImportQueue = () => _flush(K_IMPORT_QUEUE, () => IMPORT_QUEUE);

function encolarImportacion(entradas) {
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));
  const yaEnCola = new Set(IMPORT_QUEUE.map(e => e.type + ':' + e.id));
  let nuevos = 0;
  for (const e of entradas) {
    if (yaTengo.has(e.id) || yaEnCola.has(e.type + ':' + e.id)) continue;
    IMPORT_QUEUE.push(e);
    yaEnCola.add(e.type + ':' + e.id);
    nuevos++;
  }
  if (nuevos) saveImportQueue();
  return nuevos;
}

const colaStatTexto = () => IMPORT_QUEUE.length
  ? `● ${IMPORT_QUEUE.length.toLocaleString('es-ES')} en cola — se van añadiendo solas cada vez que abres la app`
  : '● Cola vacía';

let _procesandoCola = false;
let _ultimoIntentoCola = 0;

/* auto=true: la llama la propia app al abrirse, en silencio (si no hay nada
   que hacer, no toca la interfaz para nada). auto=false: la ha pedido el
   usuario a mano desde Ajustes → sí refleja progreso ahí y avisa al acabar. */
async function procesarColaImportacion(auto) {
  if (_procesandoCola || !IMPORT_QUEUE.length) return;
  if (!isConnected()) return;
  // no reintentar en cada apertura/cambio de pestaña si acabamos de fallar hace nada
  if (auto && Date.now() - _ultimoIntentoCola < 5 * 60000) return;
  _ultimoIntentoCola = Date.now();
  _procesandoCola = true;
  pedirDespertar();

  const est = () => document.getElementById('colaStat');
  let añadidas = 0;

  try {
    const porTipo = { album: [], track: [], artist: [] };
    for (const e of IMPORT_QUEUE) if (porTipo[e.type]) porTipo[e.type].push(e.id);
    const yaTengo = new Set(ITEMS.map(x => x.spotifyId));

    for (const tipo of ['album', 'track', 'artist']) {
      const ids = porTipo[tipo];
      if (!ids.length) continue;
      let sinGuardar = 0;
      let datos;
      try {
        datos = await fetchItemsIndividually(tipo, ids, () => {
          const nodo = est();
          if (nodo) nodo.textContent = `● Importando… ${añadidas.toLocaleString('es-ES')} añadidas, quedan ${IMPORT_QUEUE.length.toLocaleString('es-ES')}`;
        }, null, raw => {
          if (!raw.id || yaTengo.has(raw.id)) return;
          ITEMS.push(makeItem(normalize(raw, tipo)));
          yaTengo.add(raw.id);
          añadidas++;
          if (++sinGuardar >= 25) { saveItems(); sinGuardar = 0; }
        });
      } catch (e) {
        break;   // token inválido u otro fallo fuerte: se para y la cola queda tal cual para el próximo intento
      }
      // sale de la cola lo que ya se añadió y lo que Spotify confirma que ya
      // no existe; lo que sigue bloqueado por el límite se queda para luego
      const idsSalen = new Set();
      ids.forEach((id, idx) => { if (!datos.bloqueados[idx]) idsSalen.add(id); });
      IMPORT_QUEUE = IMPORT_QUEUE.filter(e => !(e.type === tipo && idsSalen.has(e.id)));
      saveImportQueue();
      if (datos.bloqueoDetectado) break;   // ya sabemos que hoy no da para más
    }
  } finally {
    _procesandoCola = false;
    soltarDespertar();
    if (añadidas) { saveItems(); render(); }
    const nodo = est();
    if (nodo) nodo.textContent = colaStatTexto();
    if (!auto && añadidas) toast(`${añadidas} añadida${añadidas === 1 ? '' : 's'} desde la cola de importación`);
  }
}

/* Añadir "por nombre": una línea = una búsqueda, se guarda la primera
   coincidencia. Comparte _bulkCorriendo con runBulk() a propósito — evita que
   una subida por enlaces y otra por nombre corran a la vez y dupliquen algo,
   el mismo motivo por el que existe ese cerrojo. */
async function runBulkByName() {
  const out = document.getElementById('bulkOut');
  const go = document.getElementById('bulkGo');
  if (_bulkCorriendo) { out.innerHTML = 'Ya hay una subida en marcha (la empezaste antes de cerrar este panel). Espera a que termine.'; return; }
  if (!isConnected()) {
    out.innerHTML = 'Este dispositivo aún no está conectado con Spotify. La conexión es por dispositivo: ve a ⚙ Ajustes y conéctate también aquí.';
    return;
  }
  const lineas = [...new Set(document.getElementById('bulkNames').value.split('\n').map(s => s.trim()).filter(Boolean))];
  if (!lineas.length) { out.innerHTML = 'Escribe al menos un título, uno por línea.'; return; }

  _bulkCorriendo = true;
  go.disabled = true;
  pedirDespertar();
  const tipo = bulkNameType;
  let added = 0, dup = 0;
  const sinCoincidencia = [];
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));

  try {
    const CONCURRENCIA = 3;   // cada línea es una búsqueda entera, más cara que un lookup: menos paralelismo que fetchItemsIndividually
    let i = 0, hechos = 0, pararTodo = null;
    async function trabajador() {
      while (i < lineas.length && !pararTodo) {
        const mio = i++;
        const texto = lineas[mio];
        try {
          const d = await spotifySearch(texto, tipo, 0);
          const top = (d[tipo + 's']?.items || [])[0];
          if (!top) sinCoincidencia.push(texto);
          else if (yaTengo.has(top.id)) dup++;
          else { ITEMS.push(makeItem(normalize(top, tipo))); yaTengo.add(top.id); added++; }
        } catch (e) {
          const msg = e.message || '';
          if (msg === 'AUTH_FAILED' || msg === 'NO_CREDS') { pararTodo = e; return; }
          sinCoincidencia.push(texto);   // fallo puntual (red, límite agotado…): cuenta como sin encontrar, no para todo
        }
        hechos++;
        out.innerHTML = `Buscando ${hechos} de ${lineas.length}… <strong>${added}</strong> añadidos`;
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCIA, lineas.length) }, trabajador));
    if (pararTodo) {
      out.innerHTML = `Parado: tu conexión con Spotify en este dispositivo no es válida o ha caducado. Vuelve a conectarte en Ajustes.<br><span style="color:var(--fg-mute);font-size:12.5px;">${added} añadidos antes de fallar.</span>`;
      return;
    }
    saveItems(); render();
    const bits = [`<strong>${added}</strong> añadidos`];
    if (dup) bits.push(`${dup} ya estaban`);
    if (sinCoincidencia.length) bits.push(`${sinCoincidencia.length} sin coincidencia`);
    out.innerHTML = bits.join(' · ') + (sinCoincidencia.length
      ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">Sin encontrar: ${sinCoincidencia.slice(0, 15).map(esc).join(', ')}${sinCoincidencia.length > 15 ? '…' : ''}</span>`
      : '');
    if (added) toast(`${added} añadido${added === 1 ? '' : 's'} al vault — revisa que sea la versión correcta`);
  } finally {
    _bulkCorriendo = false;
    go.disabled = false;
    soltarDespertar();
  }
}

/* ---- enlace externo (lo que no está en Spotify) ----
   El vault entero está pensado en torno a un spotifyId real: es la clave que
   usan la deduplicación, las tumbas de borrado y la fusión al sincronizar. En
   vez de montar un sistema de ids en paralelo, a estos elementos se les da un
   spotifyId sintético (prefijo "manual:") que encaja en todo ese mecanismo
   como una clave opaca cualquiera, y se marcan con `manual: true` para que
   "Completar carátulas" y "Actualizar desde Spotify" —que sí necesitan un
   id real de catálogo— los dejen en paz. */
let manualType = 'album';

/* Relleno automático desde YouTube (título, autor, miniatura) cuando el
   enlace pegado es un vídeo de YouTube. La propia API de YouTube no deja
   pedirla desde el navegador (no manda cabeceras CORS); noembed.com es una
   pasarela oEmbed abierta que sí lo permite. Es una ayuda opcional: si falla
   por lo que sea, no pasa nada — simplemente no rellena nada solo. */
const YOUTUBE_RE = /(?:youtube\.com\/(?:watch\?v=|live\/|shorts\/)|youtu\.be\/)/i;
async function rellenarDesdeYoutube() {
  const urlEl = document.getElementById('manUrl');
  if (!urlEl) return;
  const url = urlEl.value.trim();
  if (!YOUTUBE_RE.test(url)) return;
  const tituloEl = document.getElementById('manTitle');
  const artistaEl = document.getElementById('manArtist');
  const coverEl = document.getElementById('manCover');
  if (tituloEl.value.trim() && coverEl.value.trim()) return;   // ya rellenado a mano, no lo piso
  const stat = document.getElementById('manYtStat');
  if (stat) stat.style.display = 'block';
  try {
    const res = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(url));
    if (!res.ok) return;
    const d = await res.json();
    if (d.error) return;
    if (!tituloEl.value.trim() && d.title) tituloEl.value = d.title;
    if (!artistaEl.value.trim() && d.author_name) artistaEl.value = d.author_name;
    if (!coverEl.value.trim() && d.thumbnail_url) coverEl.value = d.thumbnail_url;
  } catch {
    // sin conexión con noembed, o CORS bloqueado: se sigue pudiendo rellenar a mano
  } finally {
    if (stat) stat.style.display = 'none';
  }
}

  document.getElementById('manSegs').addEventListener('click', e => {

    });

// otros álbumes del mismo artista ya guardados — y si el título base coincide
// (ignorando "deluxe", "remaster"...) se marca como "otra edición" reusando
// tituloBase(), la misma comparación que ya hace el detector de duplicados
function relacionadosDelArtista(it) {
  const artistaFold = fold(artistsOf(it));
  if (!artistaFold) return [];
  const base = tituloBase(it.title);
  const otros = ITEMS.filter(x => x.id !== it.id && x.type === 'album' && !x.archived && fold(artistsOf(x)) === artistaFold);
  return otros.map(x => ({ item: x, otraEdicion: !!base && tituloBase(x.title) === base })).sort((a, b) => {
    if (a.otraEdicion !== b.otraEdicion) return a.otraEdicion ? -1 : 1;
    return (parseInt(String(b.item.releaseDate || '0').slice(0, 4)) || 0) - (parseInt(String(a.item.releaseDate || '0').slice(0, 4)) || 0);
  });
}
function relatedRow(item, esEdicion) {
  const y = yearOf(item);
  return `<div class="relrow" data-openrel="${item.id}">
    <div class="relart">${portada(item.coverUrl, TYPE_ICON[item.type], true)}</div>
    <span class="relt">${esc(item.title)}${esEdicion ? ' <span class="reltag">· otra edición</span>' : ''}</span>
    ${y ? `<span class="rely">${y}</span>` : ''}
  </div>`;
}

// solo con precisión de día (YYYY-MM-DD) — con solo el año no hay "hoy hace
// X años" que valga, y muchos discos antiguos en Spotify solo traen el año
function aniversarioTexto(it) {
  if (it.type !== 'album' || !it.releaseDate || String(it.releaseDate).length !== 10) return null;
  const [ry, rm, rd] = it.releaseDate.split('-').map(Number);
  const years = new Date().getFullYear() - ry;
  if (years <= 0) return null;
  const hoy = new Date();
  const a = new Date(2000, rm - 1, rd).getTime();
  const b = new Date(2000, hoy.getMonth(), hoy.getDate()).getTime();
  const diffDias = Math.abs(a - b) / 86400000;
  if (Math.min(diffDias, 365 - diffDias) > 3) return null;
  return `🎉 Hace ${years} año${years === 1 ? '' : 's'}`;
}
function repasoTexto(it) {
  if (!it.listened || !it.listenedAt) return null;
  if (Date.now() - it.listenedAt < 180 * 86400000) return null;
  return `🔁 ${relDate(it.listenedAt)} sin escucharlo`;
}

// el único 5 estrellas de ese artista entre lo que no está archivado —
// no crea ninguna etiqueta real (para no llenar tu lista de etiquetas con
// una por artista), es solo un aviso calculado al vuelo en la ficha
function esFavoritoUnico(it) {
  if (it.rating !== 5 || it.type === 'artist') return null;
  const artistaFold = fold(artistsOf(it));
  if (!artistaFold) return null;
  const hayOtro = ITEMS.some(x => x.id !== it.id && !x.archived && x.rating === 5 && fold(artistsOf(x)) === artistaFold);
  return hayOtro ? null : `⭐ Tu favorito de ${artistsOf(it)}`;
}

// cada nombre de artista se enlaza a su ficha SI ese artista ya está
// guardado como elemento propio en el vault — si no, se queda en texto plano
function artistLinksHtml(it) {
  const nombres = it.artists || [];
  if (!nombres.length) return esc(artistsOf(it));
  return nombres.map(nombre => {
    const match = it.type !== 'artist' && ITEMS.find(x => x.type === 'artist' && !x.archived && fold(x.title) === fold(nombre));
    return match ? `<span class="artistlink" data-goartist="${match.id}">${esc(nombre)}</span>` : esc(nombre);
  }).join(', ');
}

  ['releaseDate', 'Fecha de lanzamiento (AAAA o AAAA-MM-DD)', 'text'],

function metaFormHtml(it) {

function wireMeta(it, id) {
  document.getElementById('dEdit')?.addEventListener('click', () => {
    document.getElementById('dMeta').innerHTML = metaFormHtml(it);
    document.getElementById('mCancel').addEventListener('click', () => { document.getElementById('dMeta').innerHTML = metaTableHtml(it); wireMeta(it, id); });
    document.getElementById('mSave').addEventListener('click', () => {
      document.querySelectorAll('.metaform [data-f]').forEach(inp => {
        const f = inp.dataset.f, v = inp.value.trim();
        if (f === 'artistsStr') it.artists = v ? v.split(',').map(s => s.trim()).filter(Boolean) : [];
        else if (f === 'genresStr') it.genres = v ? v.split(',').map(s => s.trim()).filter(Boolean) : null;
        else it[f] = v || null;
      });
      it.editedByUser = true;
      it.touchedAt = Date.now();   // una edición manual también debe ganarle a una tumba vieja
      saveItems(); render(); openDetail(id);
      toast('Metadatos actualizados');
    });
  });

  document.getElementById('dRefresh')?.addEventListener('click', async () => {
    const btn = document.getElementById('dRefresh');
    if (!isConnected()) { toast('Conecta Spotify en Ajustes primero'); return; }
    if (it.editedByUser && !confirm('Editaste estos datos a mano. Actualizar desde Spotify los sobrescribirá. ¿Continuar?')) return;
    btn.textContent = 'Actualizando…';
    try {
      const fresh = normalize(await spotifyLookup(it.type, it.spotifyId), it.type);
      // conservo lo que es tuyo: notas, valoración, etiquetas, estado y fecha de guardado
      Object.assign(it, fresh, {
        id: it.id, dateAdded: it.dateAdded, notes: it.notes, rating: it.rating,
        tagIds: it.tagIds, listened: it.listened, editedByUser: false, touchedAt: Date.now()
      });
      saveItems(); render(); openDetail(id);
      toast('Metadatos recargados desde Spotify');
    } catch (err) {
      btn.textContent = 'Actualizar';
      toast('No se pudo actualizar (' + ((err.message || '').split(':')[1] || 'error') + ')');
    }
  });
}

/* Historial real: qué has escuchado de verdad en Spotify, no lo que marcas tú
   a mano. El endpoint solo da como mucho las últimas 50 reproducciones — no
   hay forma de traer el historial completo con una app normal, así que esto
   solo pilla lo reciente, desde que lo actives hacia delante. Encaja bien con
   cómo ya usas la app: lo viejo ya lo marcaste tú a mano, esto es para lo
   nuevo, sin que tengas que acordarte. */
/* Cada reproducción real, no solo un sí/no. Antes, volver a escuchar algo ya
   marcado no dejaba ni rastro; ahora queda registrada y alimenta el contador,
   los gráficos por mes y las sugerencias por franja horaria.
   Dedupe por marca de tiempo exacta: el endpoint devuelve SIEMPRE las últimas
   50 reproducciones, así que sin esto cada sincronización volvería a contar
   las mismas. El tope por elemento evita que el JSON que viaja a GitHub
   crezca sin control con miles de elementos. */
const TOPE_PLAYS = 40;
function registrarPlay(it, ts) {
  if (!ts) return false;
  const plays = it.plays || [];
  if (plays.includes(ts)) return false;             // ya contada en una sincronización anterior
  plays.push(ts);
  plays.sort((a, b) => a - b);
  // se recorta por el principio: interesa conservar lo reciente y la primera vez
  it.plays = plays.length > TOPE_PLAYS
    ? [plays[0]].concat(plays.slice(plays.length - (TOPE_PLAYS - 1)))
    : plays;
  // Sin tocar touchedAt a propósito: es un registro automático de fondo, no
  // una edición deliberada. Si lo tocara, una reproducción de Spotify en un
  // dispositivo que todavía no se ha enterado de que borraste esto en otro
  // le ganaría a la tumba del borrado y lo revivería en la próxima
  // sincronización (justo lo que le pasó a "Locked & Loaded" con d4vd).
  return true;
}
const totalPlays = it => (it.plays || []).length;
const primeraEscucha = it => (it.plays && it.plays.length) ? it.plays[0] : null;

/* Lo mismo que registrarPlay pero por canción DENTRO de un álbum — para que
   "Time" y "Money" del mismo disco tengan cada una su propio contador, en
   vez de que el álbum entero sume todas las reproducciones en un solo saco.
   album.plays (registrarPlay) sigue existiendo aparte: sirve para "algo de
   este disco sonó", esto es "esta pista concreta sonó". */
function registrarPlayCancion(album, nombreCancion, ts) {
  if (!ts || !nombreCancion) return false;
  album.trackPlays = album.trackPlays || {};
  const plays = album.trackPlays[nombreCancion] || [];
  if (plays.includes(ts)) return false;
  plays.push(ts);
  plays.sort((a, b) => a - b);
  album.trackPlays[nombreCancion] = plays.length > TOPE_PLAYS
    ? [plays[0]].concat(plays.slice(plays.length - (TOPE_PLAYS - 1)))
    : plays;
  return true;
}
const playsDeCancion = (album, nombre) => (album.trackPlays?.[nombre] || []).length;

/* Claves de comparación "es la misma obra aunque Spotify la sirva distinta".
   Deliberadamente conservadoras: quitan solo lo que de verdad es la MISMA
   grabación reetiquetada (remaster, edición deluxe, reedición). NO tocan
   "Live", "Remix", "Acoustic" ni "Radio Edit" — esas sí son grabaciones
   distintas y fundirlas sería peor que tener dos fichas. */
const _RUIDO_EDICION = /\s*[-–(\[]\s*(\d{4}\s+)?(remaster(ed|izado)?|deluxe|expanded|anniversary|special|bonus)\b[^)\]]*[)\]]?\s*$/i;
const limpiarEdicion = s => String(s || '').replace(_RUIDO_EDICION, '').trim();
const claveObra = (titulo, artista) => fold(limpiarEdicion(titulo)).replace(/[^a-z0-9]+/g, ' ').trim()
  + '|' + fold(artista || '').replace(/[^a-z0-9]+/g, ' ').trim();

/* Antes pedía siempre "las últimas 50 y ya". Si escuchabas más de 50 canciones
   entre dos aperturas de la app, las más viejas se caían del historial de
   Spotify sin registrarse nunca — y con 15k me gusta eso pasa a menudo.
   Ahora recuerda la última escucha procesada y pide con el cursor `after`
   todo lo posterior, paginando. Sin marca previa (primera vez) sigue
   pidiendo las últimas 50, que es todo lo que Spotify guarda de golpe. */
async function fetchRecentlyPlayed(desde) {
  const out = [];
  const vistos = new Set();
  let url = 'https://api.spotify.com/v1/me/player/recently-played?limit=50'
          + (desde ? `&after=${desde}` : '');
  for (let pagina = 0; pagina < 10 && url; pagina++) {
    const t = await spotifyToken();
    const res = await fetchConReintento429(url, t);
    if (res.status === 429) throw new Error('RATE_LIMIT');
    if (!res.ok) throw new Error('RECENT_FAILED:' + res.status);
    const d = await res.json();
    let nuevos = 0;
    (d.items || []).forEach(x => {
      const k = x.played_at + '|' + (x.track?.id || '');
      if (!vistos.has(k)) { vistos.add(k); out.push(x); nuevos++; }
    });
    // sin `after` solo tiene sentido la primera página (las 50 últimas);
    // y si una página no aporta nada nuevo, seguir sería dar vueltas
    url = (desde && nuevos) ? d.next : null;
  }
  return out;   // cada uno: { track: {...}, played_at: "..." }
}

/* Cruza el historial contra lo que ya tienes guardado: una canción suelta se
   marca escuchada con la fecha real de reproducción; si la canción es de un
   álbum que tienes guardado, marca esa pista dentro de su tracklist (mismo
   mecanismo que tocar el check a mano — si se completan todas, el álbum
   entero pasa a escuchado solo). Nunca desmarca ni pisa algo que ya
   marcaste tú mismo. Con PREFS.autoAddEscuchas activado (apagado por
   defecto), lo que ni está suelto ni pertenece a un álbum tuyo se añade
   como canción nueva — apagado de fábrica porque "todo lo que suena en
   Spotify" incluye saltos rápidos y música de fondo que igual no querías
   guardar; el marcado de lo que ya tienes SÍ es automático siempre.

   Dos correcciones sobre la primera versión de esto:
   1) Si el álbum ya está guardado pero nunca abriste su ficha (sin
      trackTitles cacheado), ahora se pide su tracklist EN EL MOMENTO — antes
      eso hacía que la canción se añadiera suelta y duplicada en vez de
      marcarse dentro del álbum, que es justo lo que quieres. Se cachea por
      álbum dentro de la misma pasada para no pedirlo dos veces si suenan
      varias canciones suyas.
   2) Si borraste una canción que se había añadido sola, ya no vuelve a
      añadirse en la siguiente sincronización — se respeta la tumba del
      borrado, igual que respeta la sincronización entre dispositivos. */
async function sincronizarEscuchasSpotify(silencioso) {
  if (!isConnected() || !tieneScopeRecientes()) {
    if (!silencioso) toast('Reconéctate en Ajustes para activar esto (hace falta un permiso nuevo de Spotify)');
    return;
  }
  try {
    const items = await fetchRecentlyPlayed(META.lastPlayedAt || 0);
    let marcados = 0, anadidas = 0, reproducciones = 0;
    let maxTs = META.lastPlayedAt || 0;
    const tombstoned = new Set(TOMB.map(t => t.sid));

    /* Índices en vez de un .find() por cada canción sonada: con ~5.000
       elementos y 50 escuchas eran 250.000 comparaciones por sincronización.
       Y sobre todo, permiten emparejar por algo más que el ID exacto (ver
       buscarPropia): el ID de Spotify NO es estable para una misma canción. */
    const trackPorId = new Map(), trackPorIsrc = new Map(), trackPorObra = new Map();
    const albPorId = new Map(), albPorObra = new Map();
    const indexar = x => {
      if (x.type === 'track') {
        if (x.spotifyId) trackPorId.set(x.spotifyId, x);
        if (x.isrc && !trackPorIsrc.has(x.isrc)) trackPorIsrc.set(x.isrc, x);
        const k = claveObra(x.title, (x.artists || [])[0]);
        if (!trackPorObra.has(k)) trackPorObra.set(k, x);
      } else if (x.type === 'album') {
        if (x.spotifyId) albPorId.set(x.spotifyId, x);
        const k = claveObra(x.title, (x.artists || [])[0]);
        if (!albPorObra.has(k)) albPorObra.set(k, x);
      }
    };
    ITEMS.forEach(indexar);

    /* Los tres motivos reales por los que "escucho una canción y me marca otra
       cosa, o me la añade repetida aunque ya la tenga":
        1) `linked_from`: Spotify sirve IDs distintos según el mercado, y el
           que reproduce no tiene por qué ser el que guardaste.
        2) ISRC: identifica la GRABACIÓN, no la edición. Es lo que hace que
           "Dark Horse" de PRISM y de PRISM (Deluxe) se reconozcan como la
           misma canción — en este vault había 21 pares así duplicados.
        3) Título+artista normalizados, como último recurso para las pocas
           fichas viejas que no tienen ISRC guardado. */
    const idsDe = track => [track.id, track.linked_from?.id].filter(Boolean);
    const buscarPropia = track => {
      for (const id of idsDe(track)) { const m = trackPorId.get(id); if (m) return m; }
      const isrc = track.external_ids?.isrc;
      if (isrc && trackPorIsrc.has(isrc)) return trackPorIsrc.get(isrc);
      /* El nivel 3 es el único que puede equivocarse de canción: dos
         grabaciones distintas pueden compartir título y artista (un directo,
         una versión de otro disco, un tema regrabado años después). Sin más
         comprobación, sonaba una y se marcaba la otra. La duración las
         distingue: la misma grabación dura lo mismo, y dos versiones
         distintas casi nunca coinciden al segundo. */
      const candidata = trackPorObra.get(claveObra(track.name, track.artists?.[0]?.name));
      if (!candidata) return null;
      const a = track.duration_ms, b = candidata.durationMs;
      if (a && b && Math.abs(a - b) > 3000) return null;   // duraciones muy distintas: no es la misma
      return candidata;
    };
    const cacheAlbum = new Map();   // albumId -> promesa de trackTitles (o null si falló)
    const trackTitlesDe = album => {
      if (album.trackTitles) return Promise.resolve(album.trackTitles);
      if (!cacheAlbum.has(album.spotifyId)) {
        cacheAlbum.set(album.spotifyId, fetchAlbumTracks(album.spotifyId).then(tracks => {
          const titulos = tracks.map(t => t.name).filter(Boolean);
          if (titulos.length) {
            album.trackTitles = titulos;
            album.totalDurationMs = tracks.reduce((s, t) => s + (t.duration_ms || 0), 0) || null;
          }
          return album.trackTitles || null;
        }).catch(() => null));
      }
      return cacheAlbum.get(album.spotifyId);
    };

    for (const { track, played_at } of items) {
      if (!track || (track.type && track.type !== 'track')) continue;
      const playedTs = new Date(played_at).getTime();
      if (playedTs > maxTs) maxTs = playedTs;
      let cubierta = false;

      const propia = buscarPropia(track);
      if (propia) {
        cubierta = true;
        if (registrarPlay(propia, playedTs)) reproducciones++;
        if (!propia.listened) { propia.listened = true; propia.listenedAt = playedTs; marcados++; }   // sin touchedAt: mismo motivo que en registrarPlay
      }

      if (track.album?.id) {
        // Mismo problema que con las canciones: el ID del álbum cambia entre
        // ediciones y mercados. Se busca por ID y, si no, por nombre+artista
        // normalizados (quitando "Deluxe", "Remastered"...), que reconoce la
        // reedición sin arriesgarse a confundir dos discos distintos.
        let album = albPorId.get(track.album.id);
        if (!album) album = albPorObra.get(claveObra(track.album.name, track.album.artists?.[0]?.name || track.artists?.[0]?.name));
        if (album) {
          const titulos = await trackTitlesDe(album);
          if (titulos && titulos.includes(track.name)) {
            cubierta = true;
            if (registrarPlay(album, playedTs)) reproducciones++;
            registrarPlayCancion(album, track.name, playedTs);   // el contador de ESA pista, no solo el del disco entero
            if (!album.listened) {
              const set = new Set(album.cancionesEscuchadas || []);
              if (!set.has(track.name)) {
                set.add(track.name);
                album.cancionesEscuchadas = [...set];
                const completo = titulos.every(t => set.has(t));
                if (completo) { album.listened = true; album.listenedAt = playedTs; }
                // sin touchedAt aquí tampoco: mismo motivo que en registrarPlay
                marcados++;
              }
            }
          }
        }
      }

      /* La tumba se comprueba contra TODOS los ids posibles de la canción: si
         no, borras algo y vuelve solo bajo el id de otra edición. Y buscarPropia
         ya descarta que la tengas guardada con otro id/edición, así que llegar
         aquí significa de verdad "esto no lo tienes". */
      const enterrada = idsDe(track).some(id => tombstoned.has(id));
      /* Spotify sirve en el historial cosas que NO son pistas de catálogo:
         los vídeos musicales y clips promocionales. Se reconocen porque no
         traen ISRC (el identificador de la grabación) — de 1.636 canciones
         reales de este vault, 1.628 lo tienen; de las 8 que no, las 8 eran
         justo eso. Además vienen con la carátula del VÍDEO en vez de la del
         álbum, y con el título retocado ("- HD Remaster", "- Re-Edit"), así
         que al colarse parecía que se guardaba "otra canción" distinta a la
         que sonaba. Sirven para marcar lo que ya tienes (arriba), pero no
         para crear fichas nuevas con metadatos que no son de la canción. */
      const esClipDeVideo = !track.external_ids?.isrc;
      if (!cubierta && PREFS.autoAddEscuchas && !enterrada && !esClipDeVideo) {
        const nueva = makeItem(normalize(track, 'track'));
        nueva.listened = true; nueva.listenedAt = playedTs;
        nueva.autoAdded = true;   // se pintó en Metadatos y sale en "Auto-añadidos" (Ajustes), para poder auditar
        registrarPlay(nueva, playedTs);
        ITEMS.push(nueva);
        indexar(nueva);   // si vuelve a sonar en esta misma tanda, ya no se duplica
        anadidas++; reproducciones++;
      }
    }
    // avanza el cursor aunque no haya cambiado nada: lo ya visto no se
    // vuelve a pedir, y así el historial no se pierde por desbordar las 50
    if (maxTs > (META.lastPlayedAt || 0)) { META.lastPlayedAt = maxTs; saveMeta(); }

    if (marcados || anadidas || reproducciones) {
      saveItems(); render();
      if (!silencioso) {
        const bits = [];
        if (marcados) bits.push(`${marcados} marcado${marcados === 1 ? '' : 's'}`);
        if (anadidas) bits.push(`${anadidas} añadida${anadidas === 1 ? '' : 's'} nueva${anadidas === 1 ? '' : 's'}`);
        if (reproducciones) bits.push(`${reproducciones} reproducción${reproducciones === 1 ? '' : 'es'} registrada${reproducciones === 1 ? '' : 's'}`);
        toast(bits.join(' · '));
      }
    } else if (!silencioso) {
      toast('Nada nuevo desde la última vez');
    }
  } catch (e) {
    if (!silencioso) toast(e.message === 'RATE_LIMIT' ? `Demasiadas peticiones seguidas — inténtalo en ${tiempoEsperaTexto()}` : 'No se pudo consultar tu historial de Spotify ahora mismo');
  }
}

/* Traía limit=50 de golpe, pero este endpoint (a diferencia de /search) siempre
   ha tenido el máximo en 10 — con más, Spotify responde 400 (parámetro
   inválido), no un fallo de red. Pagina de 10 en 10 hasta agotar el catálogo
   del artista o llegar a un tope razonable. */
async function fetchArtistAlbums(artistId, onProgress) {
  let out = [], offset = 0, total = null;
  while (offset < 200) {
    const t = await spotifyToken();
    const res = await fetchConReintento429(`https://api.spotify.com/v1/artists/${artistId}/albums?include_groups=album,single,compilation&limit=10&offset=${offset}&market=ES`, t);
    if (res.status === 429) throw new Error('RATE_LIMIT');
    if (!res.ok) throw new Error('DISCO_FAILED:' + res.status);
    const d = await res.json();
    if (total === null) total = d.total;
    out = out.concat(d.items || []);
    onProgress?.(out.length, Math.min(total, 200));
    offset += 10;
    if (offset >= total || !(d.items || []).length) break;
  }
  return out;
}

/* Igual de paginado que fetchArtistAlbums, por el mismo motivo: no fiarse de
   un límite alto en un solo golpe. Los items son "simplified track objects"
   — sin portada ni álbum, pero traen external_urls.spotify, que es justo lo
   único que hace falta para enlazar cada canción sin tener que guardarla. */
async function fetchAlbumTracks(albumId) {
  let out = [], offset = 0, total = null;
  while (offset < 200) {
    const t = await spotifyToken();
    const res = await fetchConReintento429(`https://api.spotify.com/v1/albums/${albumId}/tracks?limit=10&offset=${offset}&market=ES`, t);
    if (res.status === 429) throw new Error('RATE_LIMIT');
    if (!res.ok) throw new Error('TRACKS_FAILED:' + res.status);
    const d = await res.json();
    if (total === null) total = d.total;
    out = out.concat(d.items || []);
    offset += 10;
    if (offset >= total || !(d.items || []).length) break;
  }
  return out;
}

// { albumId, items } de la última tracklist pintada — evita repetir la
// petición a Spotify solo para repintar tras marcar una canción escuchada
let _tracklistCache = null;

async function cargarTracksAlbum(it) {
  const box = document.getElementById('dTracks');
  if (!box) return;
  try {
    const items = await fetchAlbumTracks(it.spotifyId);
    if (!items.length) { box.innerHTML = `<p class="lede" style="margin:0;">Spotify no devuelve canciones para este álbum.</p>`; return; }
    // se guarda para que la búsqueda del vault encuentre este álbum también
    // buscando el nombre de una de sus canciones, aunque no la tengas suelta
    const titulos = items.map(tr => tr.name).filter(Boolean);
    const duracionTotal = items.reduce((sum, tr) => sum + (tr.duration_ms || 0), 0);
    if (titulos.length) { it.trackTitles = titulos; it.totalDurationMs = duracionTotal || null; saveItems(); }
    _tracklistCache = { albumId: it.spotifyId, items };
    pintarTracklist(it);
  } catch (err) {
    const text = err.message === 'RATE_LIMIT'
      ? `Demasiadas peticiones seguidas — inténtalo de nuevo en ${tiempoEsperaTexto()}.`
      : 'No se pudieron cargar las canciones ahora mismo.';
    box.innerHTML = `<p class="lede" style="margin:0;">${text}</p>`;
  }
}

function pintarTracklist(it) {
  const box = document.getElementById('dTracks');
  if (!box || !_tracklistCache || _tracklistCache.albumId !== it.spotifyId) return;
  const escuchadas = new Set(it.cancionesEscuchadas || []);
  const total = _tracklistCache.items.length;
  const hechas = it.listened ? total : _tracklistCache.items.filter(tr => escuchadas.has(tr.name)).length;
  const pct = total ? Math.round(hechas / total * 100) : 0;
  const progreso = `<div class="tlprogress">
    <div class="tlprogress-bar"><div class="tlprogress-fill" style="width:${pct}%"></div></div>
    <span class="tlprogress-txt">${hechas} de ${total} escuchadas</span>
  </div>`;
  box.innerHTML = progreso + `<div class="tracklist">${_tracklistCache.items.map(tr => {
    const oida = it.listened || escuchadas.has(tr.name);
    const n = playsDeCancion(it, tr.name);
    const rating = (it.trackRatings || {})[tr.name] || 0;
    return `<div class="trow${oida ? ' done' : ''}">
      <div class="trmain">
        <button class="trcheck${oida ? ' on' : ''}" data-trtoggle="${esc(tr.name)}" aria-label="${oida ? 'Marcar pendiente' : 'Marcar escuchada'}">✓</button>
        <a class="trlink" href="${esc(tr.external_urls?.spotify || it.spotifyUrl)}" target="_blank" rel="noopener">
          <span class="trn">${tr.track_number ?? ''}</span>
          <span class="trt">${esc(tr.name || '')}</span>
        </a>
        ${n ? `<span class="trplays" title="Reproducciones registradas">${n}×</span>` : ''}
        <span class="trd">${esc(fmtDur(tr.duration_ms) || '')}</span>
      </div>
      <div class="trstars" data-trstars="${esc(tr.name)}">
        ${[1,2,3,4,5].map(v => `<button data-n="${v}" class="${v <= rating ? 'on' : ''}" aria-label="${v} estrellas">★</button>`).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
  box.querySelector('.tracklist')?.addEventListener('click', e => {
    const s = e.target.closest('.trstars button');
    if (s) {
      const titulo = s.closest('[data-trstars]').dataset.trstars;
      const n = +s.dataset.n;
      it.trackRatings = it.trackRatings || {};
      it.trackRatings[titulo] = it.trackRatings[titulo] === n ? 0 : n;
      if (!it.trackRatings[titulo]) delete it.trackRatings[titulo];
      it.touchedAt = Date.now();
      saveItems();
      pintarTracklist(it);
      return;
    }
    const b = e.target.closest('[data-trtoggle]'); if (!b) return;
    toggleCancionEscuchada(it, b.dataset.trtoggle);
    pintarTracklist(it);
    sincronizarBotonEscuchado(it);
  });
}

// Al completo (todas marcadas) el álbum entero pasa a escuchado, con su
// fecha; al desmarcar cualquiera deja de estar "completo" y el álbum vuelve
// a pendiente — así el botón grande de la ficha y esta lista nunca se contradicen.
function toggleCancionEscuchada(it, titulo) {
  const set = new Set(it.cancionesEscuchadas || []);
  set.has(titulo) ? set.delete(titulo) : set.add(titulo);
  it.cancionesEscuchadas = [...set];
  const todas = it.trackTitles || [];
  const completo = todas.length > 0 && todas.every(t => set.has(t));
  it.listened = completo;
  it.listenedAt = completo ? Date.now() : null;
  it.touchedAt = Date.now();   // edición deliberada: debe ganarle a una tumba vieja de otro dispositivo
  saveItems();
}

function sincronizarBotonEscuchado(it) {
  const btn = document.getElementById('dListen');
  if (btn) { btn.classList.toggle('jade', it.listened); btn.textContent = it.listened ? '✓ Ya escuchado' : 'Marcar como escuchado'; }
  render();
}

/* ---- discografía de un artista ---- */
async function fetchArtistTopTracks(artistId) {
  const t = await spotifyToken();
  const res = await fetchConReintento429(`https://api.spotify.com/v1/artists/${artistId}/top-tracks?market=ES`, t);
  if (res.status === 429) throw new Error('RATE_LIMIT');
  if (!res.ok) throw new Error('DISCO_FAILED:' + res.status);
  const d = await res.json();
  return d.tracks || [];
}

async function openDiscography(artist) {
  searchSelMode = false; searchSel = new Set();
  showSheet(`
    <div class="sheethead"><h2>Discografía</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <p class="lede">Canciones y álbumes de <strong>${esc(artist.title)}</strong>. Toca ＋ para guardarlos en tu vault.</p>
    <div id="discoOut"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  `);
  const box = document.getElementById('discoOut');
  // un artista de "enlace externo" no tiene un id real de catálogo: pedir su
  // discografía a Spotify daría un 400 (id inválido), no un fallo de red
  if (artist.manual || !artist.spotifyId || String(artist.spotifyId).startsWith('manual:')) {
    box.innerHTML = `<div class="empty" style="padding:24px 8px;"><p>Este artista es un enlace externo, no tiene ficha ni discografía en Spotify.</p></div>`;
    return;
  }
  // se piden a la vez pero se resuelven por separado: si Spotify niega las
  // canciones más populares (algunas apps sin "extended quota" lo sufren) no
  // quiero perder también los álbumes, que sí suelen funcionar siempre
  const [tracksRes, albumsRes] = await Promise.allSettled([
    fetchArtistTopTracks(artist.spotifyId),
    fetchArtistAlbums(artist.spotifyId, (got, tot) => {
      if (tot > 10) box.innerHTML = `<p class="lede" style="text-align:center;padding:20px 4px;">Leyendo discografía… ${got} de ${tot}</p>`;
    })
  ]);

  if (albumsRes.status === 'rejected') {
    const err = albumsRes.reason;
    const text = err?.message === 'RATE_LIMIT'
      ? `Demasiadas peticiones seguidas — espera ${tiempoEsperaTexto()} y vuelve a intentarlo.`
      : `No se pudo cargar la discografía (${esc((err?.message || '').split(':')[1] || 'error')}).`;
    box.innerHTML = `<div class="empty" style="padding:24px 8px;"><p>${text}</p></div>`;
    return;
  }

  let tracks = [], tracksError = null;
  if (tracksRes.status === 'fulfilled') tracks = tracksRes.value.map(t => normalize(t, 'track'));
  else tracksError = tracksRes.reason?.message === 'RATE_LIMIT'
    ? `Demasiadas peticiones seguidas — inténtalo de nuevo en ${tiempoEsperaTexto()}.`
    : 'Spotify no ha dejado consultar sus canciones más populares con esta conexión.';

  // Spotify repite el mismo disco en varias ediciones; me quedo con uno por título.
  const seen = new Set();
  const normalizados = albumsRes.value.map(a => normalize(a, 'album'))
    .filter(r => { const k = fold(r.title); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (parseInt(String(b.releaseDate || '0').slice(0, 4)) || 0) - (parseInt(String(a.releaseDate || '0').slice(0, 4)) || 0));
  // como en la página de un artista en Spotify: álbumes, singles/EPs y
  // recopilatorios se ven claramente distintos, no todo mezclado en un montón
  const albums = normalizados.filter(r => r.albumType === 'album');
  const singles = normalizados.filter(r => r.albumType === 'single');
  const comps = normalizados.filter(r => r.albumType === 'compilation');
  const otros = normalizados.filter(r => !['album', 'single', 'compilation'].includes(r.albumType));

  lastResults = tracks.concat(albums, singles, comps, otros);
  if (!lastResults.length && !tracksError) {
    box.innerHTML = `<div class="empty" style="padding:24px 8px;"><p>Spotify no devuelve discografía para este artista.</p></div>`;
    return;
  }

  let cursor = 0;
  const seccion = (titulo, arr) => {
    if (!arr.length) return '';
    const html = `<p class="flabel">${titulo}</p>${arr.map((r, i) => rrow(r, cursor + i)).join('')}`;
    cursor += arr.length;
    return html;
  };
  /* "Cuánto te falta" sale gratis: estos datos ya están descargados aquí.
     Se cuenta solo sobre álbumes de estudio — meter singles y recopilatorios
     haría que ningún artista pareciera nunca completo. */
  const tengo = albums.filter(r => ITEMS.some(x => x.spotifyId === r.spotifyId)).length;
  const resumenFalta = albums.length
    ? `<p class="lede" style="margin:0 0 10px;">Tienes <strong>${tengo}</strong> de sus <strong>${albums.length}</strong> álbumes${tengo < albums.length ? ` — te faltan ${albums.length - tengo}` : ' — los tienes todos 🎉'}.</p>`
    : '';

  const partes = [
    resumenFalta,
    tracks.length ? seccion('Canciones', tracks) : (tracksError ? `<p class="flabel">Canciones</p><p class="lede" style="margin:0 0 4px;">${esc(tracksError)}</p>` : ''),
    seccion('Álbumes', albums),
    seccion('Singles y EPs', singles),
    seccion('Recopilatorios', comps),
    seccion('Otros', otros)
  ];
  box.innerHTML = partes.join('');
}

/* Selector de etiquetas compartido por la ficha y por el etiquetado en lote.
   'puestas' es el Set de ids ya marcados; 'alTocar' recibe el id. */
function pintarSelectorTags(caja, puestas, filtro) {
  const q = fold((filtro || '').trim());
  const casa = t => !q || fold(t.name).includes(q);
  const pastilla = t => `<button class="tagsel ${puestas.has(t.id) ? '' : 'off'}" data-tag="${esc(t.id)}">${iconoHtml(t, 15)}${esc(t.name)}</button>`;

  const todas = tagsOrdenados();
  if (!todas.length) {
    caja.innerHTML = `<p class="lede" style="margin:0;">Todavía no has creado ninguna etiqueta.</p>`;
    return;
  }
  /* Buscando: lista plana, que es lo que esperas cuando escribes. */
  if (q) {
    const hay = todas.filter(casa);
    caja.innerHTML = hay.length
      ? `<div class="tagpick">${hay.slice(0, 60).map(pastilla).join('')}</div>` + (hay.length > 60 ? `<p class="lede" style="margin:8px 0 0;">y ${hay.length - 60} mas: afina la búsqueda.</p>` : '')
      : `<p class="lede" style="margin:0;">Ninguna etiqueta se llama así.</p>`;
    return;
  }
  /* En reposo: primero las que ya tiene puestas, luego las tuyas sueltas y
     al final las carpetas plegadas, con su cuenta. */
  const marcadas = todas.filter(t => puestas.has(t.id));
  const sueltas = tagsDeCarpeta(null).filter(t => !puestas.has(t.id));
  const carpetas = carpetasOrdenadas();
  caja.innerHTML =
    (marcadas.length ? `<div class="selgrupo">Puestas</div><div class="tagpick">${marcadas.map(pastilla).join('')}</div>` : '')
    + (sueltas.length ? `<div class="selgrupo">Tuyas</div><div class="tagpick">${sueltas.map(pastilla).join('')}</div>` : '')
    + carpetas.map(c => {
      const dentro = tagsDeCarpeta(c.id).filter(t => !puestas.has(t.id));
      if (!dentro.length) return '';
      const abierta = _carpetasSelector.has(c.id);
      return `<div class="selgrupo"><button class="linkbtn" data-selcarp="${esc(c.id)}">${iconoHtml(c, 13)} ${esc(c.name)} <span class="ct">${dentro.length}</span> ${abierta ? '&#9662;' : '&#9656;'}</button></div>`
        + (abierta ? `<div class="tagpick">${dentro.map(pastilla).join('')}</div>` : '');
    }).join('');
}
const _carpetasSelector = new Set();

/* Monta el buscador + la lista dentro de un contenedor ya existente. */
function montarSelectorTags(idCaja, puestasFn, alTocar) {
  const raiz = document.getElementById(idCaja);
  if (!raiz) return;
  raiz.innerHTML = `<div class="buscaart selbusca"><span class="mag">&#128269;</span><input type="text" placeholder="Buscar etiqueta…" autocomplete="off"></div><div class="sellista"></div>`;
