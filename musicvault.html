/* ---- settings ---- */
let swatch = TAG_COLORS[0];

/* ============ sincronización vía GitHub ============
   El vault se guarda como un JSON en tu repo. Cada dispositivo se baja el
   remoto, lo funde con lo suyo y vuelve a subir el resultado.
   Reglas de la fusión:
     · unión por spotifyId — nadie pierde lo que ha añadido
     · si el mismo elemento está en los dos, gana el del documento más reciente
     · un borrado deja una "tumba" con su hora: si la tumba es posterior a la
       última edición del elemento, el borrado manda y no revive. */
const GH_PATH = 'musicvault-sync.json';
let _syncEstado = { at: 0, msg: '', err: false };
let _syncTimer = null, _syncCorriendo = false;

const ghCfg = () => { const g = read(K_GH, null); return (g && g.token && g.repo) ? g : null; };

function syncEstadoTexto() {
  if (!ghCfg()) return 'Ahora mismo este dispositivo guarda solo en local.';
  if (!_syncEstado.at) return 'Sin sincronizar todavía en esta sesión.';
  return _syncEstado.msg;
}

/* Nada de String.fromCharCode(...bytes): con un vault de miles de elementos son
   millones de argumentos y se desborda la pila de llamadas. Va por trozos. */
function b64enc(s) {
  const bytes = new TextEncoder().encode(s);
  const TROZO = 0x8000;
  let bin = '';
  for (let i = 0; i < bytes.length; i += TROZO) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + TROZO));
  }
  return btoa(bin);
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));

async function ghFetch(url, opts) {
  const g = ghCfg();
  return fetch(url, Object.assign({}, opts, {
    headers: Object.assign({
      Authorization: 'Bearer ' + g.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, (opts && opts.headers) || {})
  }));
}

/* Cuándo cambió por última vez ESTE elemento, mirando las cuatro huellas que
   deja cualquier cambio real: edición deliberada, marcado como escuchado,
   última reproducción registrada por el scrobbling, y su alta. */
const marcaCambio = it => Math.max(
  it.touchedAt || 0,
  it.listenedAt || 0,
  (it.plays && it.plays.length) ? it.plays[it.plays.length - 1] : 0,
  it.dateAdded || 0
);

/* Las reproducciones son un histórico que solo crece: nunca "des-escuchas"
   algo. Así que al resolver un conflicto se unen las de los dos lados en vez
   de que el perdedor las tire. Los demás campos sí los decide el ganador, para
   que desmarcar como escuchado o quitar una etiqueta siga funcionando. */
function unirHistoriales(gana, pierde) {
  const hayPlays = pierde.plays && pierde.plays.length;
  if (!hayPlays && !pierde.trackPlays) return gana;
  const out = Object.assign({}, gana);
  if (hayPlays) {
    const p = [...new Set((gana.plays || []).concat(pierde.plays))].sort((a, b) => a - b);
    out.plays = p.length > TOPE_PLAYS ? [p[0]].concat(p.slice(p.length - (TOPE_PLAYS - 1))) : p;
  }
  if (pierde.trackPlays) {
    out.trackPlays = Object.assign({}, gana.trackPlays);
    Object.keys(pierde.trackPlays).forEach(k => {
      const p = [...new Set((out.trackPlays[k] || []).concat(pierde.trackPlays[k]))].sort((a, b) => a - b);
      out.trackPlays[k] = p.length > TOPE_PLAYS ? [p[0]].concat(p.slice(p.length - (TOPE_PLAYS - 1))) : p;
    });
  }
  return out;
}

function fundir(remoto) {
  const tombLocal = TOMB.slice();
  (remoto.tombstones || []).forEach(t => { if (t && t.sid) tombLocal.push(t); });
  const ultimaTumba = new Map();
  tombLocal.forEach(t => {
    if (!ultimaTumba.has(t.sid) || t.at > ultimaTumba.get(t.sid)) ultimaTumba.set(t.sid, t.at);
  });

  /* Antes esto era todo-o-nada POR DOCUMENTO: se comparaba qué copia del vault
     ENTERO era más reciente (remoto.updatedAt vs META.updatedAt) y esa ganaba
     para todos los elementos a la vez. De ahí el fallo real de "marco algo
     escuchado en el iPhone y en el PC no aparece": bastaba con que el PC
     hubiera tocado cualquier otra cosa después para que impusiera su copia
     entera y borrase esa marca. Ahora gana el más reciente elemento a
     elemento, con su propia fecha de cambio. */
  const porId = new Map();
  const meter = arr => (arr || []).forEach(it => {
    if (!it || !it.spotifyId) return;
    const previo = porId.get(it.spotifyId);
    if (!previo) { porId.set(it.spotifyId, it); return; }
    const gana = marcaCambio(it) > marcaCambio(previo) ? it : previo;   // empate: se queda el local
    porId.set(it.spotifyId, unirHistoriales(gana, gana === it ? previo : it));
  });
  meter(ITEMS);
  meter(remoto.items);

  const vivos = [];
  porId.forEach((it, sid) => {
    const muerto = ultimaTumba.get(sid);
    // el elemento sobrevive si se tocó (deshacer, edición) después de que lo borraran
    const marca = it.touchedAt || it.dateAdded;
    if (muerto && !(marca && marca > muerto)) return;
    vivos.push(it);
  });

  // etiquetas: mismo mecanismo que arriba pero para borrados de etiquetas —
  // sin esto, borrar una etiqueta en un dispositivo no se enteraba el otro y
  // la volvía a subir en su siguiente sincronización, "reviviéndola"
  const tagTombLocal = new Set(TAG_TOMB);
  (remoto.tagTombstones || []).forEach(id => tagTombLocal.add(id));
  const nombres = new Map(TAGS.map(t => [t.name.toLowerCase(), t]));
  (remoto.tags || []).forEach(t => {
    if (!t || !t.name || tagTombLocal.has(t.id)) return;
    const mia = nombres.get(t.name.toLowerCase());
    if (!mia) { TAGS.push(t); nombres.set(t.name.toLowerCase(), t); return; }
    /* Ya la tengo: no la piso, pero SÍ relleno lo que aquí falta. Si eliges el
       icono o la carpeta en el móvil, el PC los adopta en vez de quedarse con
       una etiqueta a medias para siempre — y al revés nunca borra lo tuyo. */
    if (!mia.icon && t.icon) mia.icon = t.icon;
    if (!mia.carpetaId && t.carpetaId) mia.carpetaId = t.carpetaId;
    if (mia.esCarpeta === undefined && t.esCarpeta) mia.esCarpeta = true;
  });
  TAGS = TAGS.filter(t => !tagTombLocal.has(t.id));   // por si la borraron en el otro dispositivo y aquí seguía
  vivos.forEach(it => { if (it.tagIds && it.tagIds.length) it.tagIds = it.tagIds.filter(id => !tagTombLocal.has(id)); });
  TAG_TOMB = [...tagTombLocal];
  saveTagTomb();

  const cambia = vivos.length !== ITEMS.length;
  ITEMS = vivos;
  TOMB = tombLocal;
  saveTomb();          // deduplica y poda
  return cambia;
}

async function sincronizar(manual) {
  const g = ghCfg();
  if (!g) return 'Ahora mismo este dispositivo guarda solo en local.';
  if (_syncCorriendo) return 'Ya hay una sincronización en marcha.';
  _syncCorriendo = true;
  const api = `https://api.github.com/repos/${g.repo}/contents/${GH_PATH}`;
  try {
    // 1) bajar el remoto
    let sha = null, remoto = null;
    const res = await ghFetch(api + '?ref=main&t=' + Date.now());
    if (res.status === 401 || res.status === 403) throw new Error('El token no tiene permiso sobre ese repo.');
    if (res.status === 404 && !res.headers.get('x-ratelimit-remaining')) throw new Error('No encuentro ese repo. Revisa usuario/repo.');
    if (res.ok) {
      const d = await res.json();
      sha = d.sha;
      if (d.content) {
        try { remoto = JSON.parse(b64dec(d.content.replace(/\n/g, ''))); } catch { remoto = null; }
      } else {
        /* Por encima de 1 MB la API no incluye el contenido: hay que pedirlo en
           crudo. Devuelve el archivo tal cual, sin límite práctico de tamaño. */
        const crudo = await ghFetch(api + '?ref=main&t=' + Date.now(),
                                    { headers: { Accept: 'application/vnd.github.raw' } });
        if (crudo.ok) { try { remoto = JSON.parse(await crudo.text()); } catch { remoto = null; } }
      }
    } else if (res.status !== 404) {
      throw new Error('GitHub respondió ' + res.status + '.');
    }

    // 2) fundir
    const antes = ITEMS.length;
    if (remoto && Array.isArray(remoto.items)) {
      fundir(remoto);
      _flush(K_ITEMS, () => ITEMS); saveTags();
    }
    const traidos = ITEMS.length - antes;

    // 3) subir el resultado
    const cuerpo = JSON.stringify({
      app: 'MusicVault', version: 2, updatedAt: Date.now(),
      items: ITEMS, tags: TAGS, tombstones: TOMB, tagTombstones: TAG_TOMB
    });
    if (cuerpo.length > 60e6) {
      throw new Error(`el vault ocupa ${(cuerpo.length / 1e6).toFixed(0)} MB y no cabe en GitHub. Borra lo que no uses.`);
    }
    const put = await ghFetch(api, {
      method: 'PUT',
      body: JSON.stringify({
        message: `vault: ${ITEMS.length} elementos`,
        content: b64enc(cuerpo), branch: 'main',
        sha: sha || undefined
      })
    });
    if (put.status === 409) throw new Error('Otro dispositivo estaba escribiendo. Prueba otra vez.');
    if (!put.ok) throw new Error('No he podido subirlo (' + put.status + ').');

    META.updatedAt = Date.now(); META.lastSyncedAt = Date.now(); saveMeta();
    if (traidos) render();
    const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    _syncEstado = { at: Date.now(), err: false,
      msg: `Sincronizado a las ${hora} · ${ITEMS.length.toLocaleString('es-ES')} elementos` +
           (traidos > 0 ? ` · ${traidos.toLocaleString('es-ES')} traídos del otro dispositivo` : '') };
    if (manual) toast(traidos > 0 ? `${traidos} traídos del otro dispositivo` : 'Sincronizado');
    return _syncEstado.msg;
  } catch (e) {
    _syncEstado = { at: Date.now(), err: true, msg: 'Error: ' + (e && e.message ? e.message : 'de red') };
    if (manual) toast(_syncEstado.msg);
    return _syncEstado.msg;
  } finally {
    _syncCorriendo = false;
  }
}

/* Cualquier cambio en el vault programa una subida, agrupando ráfagas. */
function programarSync() {
  const g = ghCfg();
  if (!g || g.auto === false) return;   // sincronización automática desactivada: solo con el botón ⟳
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => {
    /* Si justo ahora hay una subida en marcha, sincronizar() se rendía y
       devolvía "ya hay una en marcha" — y este cambio se quedaba sin subir
       hasta que algo lo disparase otra vez (o hasta la próxima apertura).
       Reintentar en unos segundos cuesta nada y cierra ese agujero. */
    if (_syncCorriendo) { programarSync(); return; }
    sincronizar(false);
  }, 4000);
}

const sinPortada = () => ITEMS.filter(i => !i.coverUrl && !i.manual && i.type !== 'playlist').length;

/* Pide a Spotify los objetos completos uno a uno y rellena solo lo que falte,
   sin tocar tus ediciones (ver fetchItemsIndividually). */
let _parar = false;

/* El botón "Detener" vivía como dataset del propio <button>, pero si se cierra
   Ajustes mientras el bucle corre, el nodo se destruye y al reabrir aparece uno
   nuevo con el dataset a cero: pulsar "Completar" otra vez lanzaba un SEGUNDO
   bucle en paralelo sobre las mismas peticiones. El estado de "está corriendo"
   tiene que vivir fuera del DOM. */
let _completandoPortadas = false;

async function completarPortadas() {
  const btn = document.getElementById('fillCovers');
  const est = document.getElementById('coverStat');
  if (_completandoPortadas) { _parar = true; return; }
  _completandoPortadas = true;
  _parar = false;
  pedirDespertar();
  if (btn) btn.textContent = 'Detener';

  const faltan = ITEMS.filter(i => !i.coverUrl && i.spotifyId && !i.manual && i.type !== 'playlist');
  let hechos = 0, fallos = 0, bloqueado = false;

  try {
    for (const tipo of ['album', 'artist', 'track']) {
      const grupo = faltan.filter(i => i.type === tipo);
      if (!grupo.length || _parar || bloqueado) continue;
      const porId = new Map(grupo.map(it => [it.spotifyId, it]));
      const hechosAntes = hechos;
      let sinGuardar = 0;
      const datos = await fetchItemsIndividually(
        tipo, grupo.map(x => x.spotifyId),
        (n) => {
          const estAhora = document.getElementById('coverStat');
          // la hoja de Ajustes puede haberse cerrado o reabierto: comprobar
          // que el nodo sigue siendo el que hay en pantalla antes de tocarlo
          if (estAhora) estAhora.textContent = `● ${(hechosAntes + n).toLocaleString('es-ES')} de ${faltan.length.toLocaleString('es-ES')} completadas`;
        },
        () => _parar,
        raw => {
          // guarda sobre la marcha: con miles de elementos pendientes, esperar
          // a que termine TODO el tipo antes de guardar significaba perder
          // horas de trabajo si se cerraba la pestaña a mitad
          const it = porId.get(raw.id);
          if (!it) return;   // no debería pasar — defensivo
          const fresco = normalize(raw, tipo);
          Object.keys(fresco).forEach(k => {
            if (fresco[k] != null && fresco[k] !== '' &&
                (it[k] == null || it[k] === '' ||
                 (Array.isArray(it[k]) && !it[k].length))) it[k] = fresco[k];
          });
          hechos++;
          if (++sinGuardar >= 25) { saveItems(); sinGuardar = 0; }
        }
      );
      // un 429 NO significa "esta canción no tiene datos": significa que
      // Spotify no nos ha dejado preguntar. Contarlo como fallo hacía que el
      // aviso final dijera "0 completadas · 880 sin datos", que suena a que el
      // vault está roto cuando en realidad solo hay que esperar un rato.
      fallos += datos.filter((d, i) => !d && !datos.bloqueados[i]).length;
      if (datos.bloqueoDetectado) bloqueado = true;
      saveItems();
    }
  } catch (e) {
    const msg = (e && e.message) || '';
    toast(msg === 'NO_CREDS' || msg === 'AUTH_FAILED'
      ? 'Tu conexión con Spotify no es válida o ha caducado. Vuelve a conectarte en Ajustes.'
      : 'Spotify ha fallado: ' + (msg || 'error de red'));
  }

  saveItems(); render();
  _completandoPortadas = false;
  soltarDespertar();
  toast(_parar ? `Detenido — ${hechos} completadas`
               : bloqueado
                 ? `${hechos} completadas — Spotify no deja seguir ahora mismo (demasiadas peticiones). Vuelve a darle en ${tiempoEsperaTexto()}; lo que falte sigue esperando.`
                 : `${hechos} completadas${fallos ? ` · ${fallos} sin datos` : ''}`);
  if (document.getElementById('fillCovers')) openSettings();
}

/* ============ géneros vía Last.fm ============
   Spotify dejó de rellenar el campo de géneros para casi todos los artistas
   desde finales de 2024 (verificado: 0 de los artistas de este vault lo
   tienen). Last.fm sí mantiene esta información — no es un catálogo oficial,
   son etiquetas que pone la gente, pero para esto basta y de sobra. No hace
   falta iniciar sesión, solo una clave de API gratuita. */
const lastfmCfg = () => { const l = read(K_LASTFM, null); return (l && l.apiKey) ? l : null; };

async function lastfmToptags(nombreArtista, apiKey, intentos = 3) {
  const url = `https://ws.audioscrobbler.com/2.0/?method=artist.gettoptags&artist=${encodeURIComponent(nombreArtista)}&autocorrect=1&api_key=${encodeURIComponent(apiKey)}&format=json`;
  for (let i = 0; i < intentos; i++) {
    let res;
    try { res = await fetch(url); } catch { if (i === intentos - 1) throw new Error('LASTFM_RED'); await new Promise(r => setTimeout(r, 1500)); continue; }
    if (!res.ok) { if (i === intentos - 1) throw new Error('LASTFM_HTTP:' + res.status); await new Promise(r => setTimeout(r, 1500)); continue; }
    const d = await res.json();
    if (d.error) {
      if (d.error === 29 && i < intentos - 1) { await new Promise(r => setTimeout(r, 2500)); continue; }   // límite de peticiones: esperar y reintentar
      if (d.error === 6) return [];   // artista sin coincidencia en Last.fm — no es un fallo, simplemente no hay etiquetas
      throw new Error('LASTFM_ERR:' + d.error);
    }
    // el JSON de Last.fm viene de XML: con una sola etiqueta, "tag" es un objeto
    // suelto en vez de un array de un elemento — hay que contemplar los dos casos
    const raw = d.toptags?.tag;
    const lista = Array.isArray(raw) ? raw : (raw ? [raw] : []);
    return lista.map(t => t && t.name).filter(Boolean);
  }
  return [];
}

async function lastfmSimilar(nombreArtista, apiKey, limite = 8) {
  const url = `https://ws.audioscrobbler.com/2.0/?method=artist.getsimilar&artist=${encodeURIComponent(nombreArtista)}&autocorrect=1&limit=${limite}&api_key=${encodeURIComponent(apiKey)}&format=json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('LASTFM_HTTP:' + res.status);
  const d = await res.json();
  if (d.error) {
    if (d.error === 6) return [];   // sin coincidencia en Last.fm
    throw new Error('LASTFM_ERR:' + d.error);
  }
  // mismo caso XML-a-JSON que en gettoptags: un solo resultado llega como objeto suelto
  const raw = d.similarartists?.artist;
  const lista = Array.isArray(raw) ? raw : (raw ? [raw] : []);
  return lista.map(a => a && a.name).filter(Boolean);
}

/* Wikipedia en español, sin clave y sin registrarse (a diferencia de Last.fm,
   que solo tiene biografías en inglés). Se busca primero con la API de
   búsqueda de MediaWiki (para no depender de que el título coincida exacto)
   y se prueban los primeros resultados hasta encontrar uno con pinta de ser
   realmente sobre música — si no, se descarta y se cae a Last.fm. */
async function wikipediaResumen(query) {
  const searchUrl = `https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=3`;
  const sres = await fetch(searchUrl);
  if (!sres.ok) throw new Error('WIKI_HTTP:' + sres.status);
  const sdata = await sres.json();
  const candidatos = sdata.query?.search || [];
  const pistas = ['musico', 'musica', 'banda', 'grupo', 'cantante', 'album', 'disco', 'rapero', 'rapera', 'dj', 'productor musical', 'productora musical', 'compositor', 'compositora', 'discografia'];
  for (const c of candidatos) {
    const res = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(c.title.replace(/ /g, '_'))}`);
    if (!res.ok) continue;
    const sum = await res.json();
    if (sum.type === 'disambiguation' || !sum.extract) continue;
    const texto = fold((sum.description || '') + ' ' + sum.extract);
    if (!pistas.some(p => texto.includes(p))) continue;
    return sum.extract;
  }
  return null;
}

async function lastfmArtistInfo(nombreArtista, apiKey) {
  const url = `https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=${encodeURIComponent(nombreArtista)}&autocorrect=1&api_key=${encodeURIComponent(apiKey)}&format=json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('LASTFM_HTTP:' + res.status);
  const d = await res.json();
  if (d.error) {
    if (d.error === 6) return null;
    throw new Error('LASTFM_ERR:' + d.error);
  }
  const ar = d.artist;
  if (!ar) return null;
  const resumen = (ar.bio?.summary || '').replace(/<a[^>]*>[\s\S]*?<\/a>/gi, '').replace(/<[^>]+>/g, '').trim();
  return { resumen, listeners: ar.stats?.listeners ? +ar.stats.listeners : null };
}

async function cargarBioArtista(it) {
  const box = document.getElementById('dArtistBio');
  if (!box) return;
  try {
    const extracto = await wikipediaResumen(`${it.title} músico`).catch(() => null);
    if (extracto) { box.innerHTML = `<p class="lede" style="margin:0;">${esc(extracto)}</p>`; return; }
  } catch {}
  const lf = lastfmCfg();
  if (!lf) { box.innerHTML = `<p class="lede" style="margin:0;">No hay artículo en Wikipedia en español. Pon tu clave de Last.fm en Ajustes para ver una biografía (en inglés).</p>`; return; }
  try {
    const info = await lastfmArtistInfo(it.title, lf.apiKey);
    if (!info || !info.resumen) { box.innerHTML = `<p class="lede" style="margin:0;">No hay biografía disponible para este artista.</p>`; return; }
    box.innerHTML = `<p class="lede" style="margin:0 0 4px;">${esc(info.resumen)}</p><p class="lede" style="margin:0;font-size:11px;color:var(--fg-mute);">En inglés — no hay artículo en Wikipedia en español para este artista.</p>`;
  } catch {
    box.innerHTML = `<p class="lede" style="margin:0;">No se pudo cargar la biografía ahora mismo.</p>`;
  }
}

async function lastfmAlbumInfo(nombreAlbum, nombreArtista, apiKey) {
  const url = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&artist=${encodeURIComponent(nombreArtista)}&album=${encodeURIComponent(nombreAlbum)}&autocorrect=1&api_key=${encodeURIComponent(apiKey)}&format=json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('LASTFM_HTTP:' + res.status);
  const d = await res.json();
  if (d.error) {
    if (d.error === 6) return null;   // sin coincidencia en Last.fm
    throw new Error('LASTFM_ERR:' + d.error);
  }
  const al = d.album;
  if (!al) return null;
  // el resumen viene con un enlace "Read more on Last.fm" pegado en HTML crudo al final; se limpia entero
  const resumen = (al.wiki?.summary || '').replace(/<a[^>]*>[\s\S]*?<\/a>/gi, '').replace(/<[^>]+>/g, '').trim();
  return {
    resumen,
    listeners: al.listeners ? +al.listeners : null,
    playcount: al.playcount ? +al.playcount : null
  };
}

/* Una frase y punto, como el renglón editorial de las apps de música. El resto
   del texto sigue ahí, detrás de "Leer más", para quien quiera la historia
   larga — pero no se la come de entrada quien solo quería saber de qué va. */
function burbujaEditorial(texto) {
  const t = String(texto || '').trim();
  if (!t) return '';
  const corte = t.search(/[.!?]\s/);
  const primera = (corte > 40 && corte < t.length - 2) ? t.slice(0, corte + 1) : t;
  const resto = t.slice(primera.length).trim();
  return `<div class="editorial">
    <p>${esc(primera)}</p>
    ${resto ? `<button class="linkbtn" data-masinfo="1">Leer más</button><p class="mas hidden">${esc(resto)}</p>` : ''}
  </div>`;
}

function wireEditorial(box) {
  box.querySelector('[data-masinfo]')?.addEventListener('click', e => {
    box.querySelector('.editorial .mas')?.classList.remove('hidden');
    e.currentTarget.remove();
  });
}

async function cargarInfoAlbum(it) {
  const box = document.getElementById('dAlbumInfo');
  if (!box) return;
  try {
    const extracto = await wikipediaResumen(`${it.title} ${artistsOf(it)} álbum`).catch(() => null);
    if (extracto) { box.innerHTML = burbujaEditorial(extracto); wireEditorial(box); return; }
  } catch {}
  const lf = lastfmCfg();
  if (!lf) { box.innerHTML = `<p class="lede" style="margin:0;">No hay artículo en Wikipedia en español. Pon tu clave de Last.fm en Ajustes para ver información (en inglés).</p>`; return; }
  try {
    const info = await lastfmAlbumInfo(it.title, artistsOf(it), lf.apiKey);
    if (!info || (!info.resumen && !info.listeners)) { box.innerHTML = `<p class="lede" style="margin:0;">No hay información disponible sobre este álbum.</p>`; return; }
    const datos = [];
    if (info.listeners) datos.push(`${info.listeners.toLocaleString('es-ES')} oyentes en Last.fm`);
    if (info.playcount) datos.push(`${info.playcount.toLocaleString('es-ES')} reproducciones`);
    box.innerHTML = `
      ${info.resumen ? `${burbujaEditorial(info.resumen)}<p class="lede" style="margin:6px 0 8px;font-size:11px;color:var(--fg-mute);">En inglés — no hay artículo en Wikipedia en español para este álbum.</p>` : ''}
      ${datos.length ? `<p class="lede" style="margin:0;color:var(--fg-mute);font-size:11.5px;">${esc(datos.join(' · '))}</p>` : ''}
    `;
    wireEditorial(box);
  } catch {
    box.innerHTML = `<p class="lede" style="margin:0;">No se pudo consultar Last.fm ahora mismo.</p>`;
  }
}

/* MusicBrainz: base de datos musical abierta, sin clave de API. Ni Spotify
   ni Last.fm modelan "es miembro de esta banda" o "también graba como" — esto
   sí, con dos peticiones encadenadas (buscar el artista, luego sus
   relaciones). Verificado en vivo: CORS abierto, y devuelve justo esto —
   "member of band" (John Lennon → The Beatles, Paul McCartney → Wings…) e
   "is person" para alias/alter egos (Oliver Heldens → HI-LO). */
async function musicbrainzRelaciones(nombreArtista) {
  const sres = await fetch(`https://musicbrainz.org/ws/2/artist/?query=${encodeURIComponent('artist:"' + nombreArtista + '"')}&fmt=json&limit=1`);
  if (!sres.ok) throw new Error('MB_HTTP:' + sres.status);
  const sdata = await sres.json();
  const artist = sdata.artists?.[0];
  if (!artist) return null;
  const relRes = await fetch(`https://musicbrainz.org/ws/2/artist/${artist.id}?inc=artist-rels&fmt=json`);
  if (!relRes.ok) throw new Error('MB_HTTP:' + relRes.status);
  const rel = await relRes.json();
  const relaciones = rel.relations || [];
  const nombresUnicos = tipo => [...new Set(relaciones.filter(r => r.type === tipo && r.artist?.name).map(r => r.artist.name))];
  return {
    origen: artist.area?.name || null,
    bandas: nombresUnicos('member of band'),
    alterEgos: nombresUnicos('is person')
  };
}

function cargarRelacionesMusicBrainz(it) {
  const box = document.getElementById('dArtistRel');
  if (!box) return;
  musicbrainzRelaciones(it.title).then(info => {
    if (!box.isConnected) return;
    if (!info || (!info.origen && !info.bandas.length && !info.alterEgos.length)) {
      box.innerHTML = ''; document.getElementById('dArtistRelLabel')?.remove();
      return;
    }
    const grupo = (titulo, lista) => !lista.length ? '' : `
      <p class="lede" style="margin:8px 0 4px;font-weight:600;">${esc(titulo)}</p>
      <div class="simgrid">${lista.map(nombre => {
        const enVault = ITEMS.find(x => x.type === 'artist' && !x.archived && fold(x.title) === fold(nombre));
        return enVault
          ? `<button class="simchip done" data-openrel="${enVault.id}">✓ ${esc(nombre)}</button>`
          : `<button class="simchip" data-simadd="${esc(nombre)}">＋ ${esc(nombre)}</button>`;
      }).join('')}</div>`;
    box.innerHTML = (info.origen ? `<p class="lede" style="margin:0;">📍 ${esc(info.origen)}</p>` : '')
      + grupo('Miembro de', info.bandas) + grupo('También lo conoces como', info.alterEgos);
    box.addEventListener('click', e => {
      const rel = e.target.closest('[data-openrel]');
      if (rel) { openDetail(rel.dataset.openrel); return; }
      const add = e.target.closest('[data-simadd]');
      if (add) agregarArtistaSimilar(add.dataset.simadd, add);
    });
  }).catch(() => {
    box.innerHTML = ''; document.getElementById('dArtistRelLabel')?.remove();
  });
}

// resumen 100% local (sin red): incluye tanto lo suyo como propio como lo
// que aparece "con" él en colaboraciones/feat., aunque el elemento sea de otro artista
/* Joyas ocultas: te encantan pero el resto del mundo apenas las escucha.
   Cruza TU valoración con la popularidad que da Spotify (0-100). */
function joyasOcultas() {
  return ITEMS.filter(i => !i.archived && i.rating >= 4 && typeof i.popularity === 'number' && i.popularity <= 40)
    .sort((a, b) => (b.rating - a.rating) || (a.popularity - b.popularity));
}

/* Artistas que aparecen mucho acompañando en lo que ya tienes, pero a los que
   nunca guardaste como artista — colaboradores habituales que se te escapan. */
function colaboradoresSinGuardar(minApariciones = 3) {
  const guardados = new Set(ITEMS.filter(i => i.type === 'artist').map(i => fold(i.title)));
  const cuenta = {};
  ITEMS.forEach(i => {
    if (i.type === 'artist' || i.archived) return;
    (i.artists || []).slice(1).forEach(a => {   // slice(1): el principal no es "colaborador"
      const k = fold(a);
      if (!k || guardados.has(k)) return;
      if (!cuenta[k]) cuenta[k] = { nombre: a, n: 0 };
      cuenta[k].n++;
    });
  });
  return Object.values(cuenta).filter(c => c.n >= minApariciones).sort((a, b) => b.n - a.n);
}

// última vez que escuchaste ALGO de este artista (cualquier cosa suya)
function ultimaEscuchaDeArtista(it) {
  const f = fold(it.title);
  const fechas = ITEMS.filter(x => x.type !== 'artist' && x.listenedAt && (x.artists || []).some(a => fold(a) === f))
    .map(x => x.listenedAt);
  return fechas.length ? Math.max(...fechas) : null;
}

function resumenLocalArtista(it) {
  const artistaFold = fold(it.title);
  const misCosas = ITEMS.filter(x => x.type !== 'artist' && !x.archived && (x.artists || []).some(a => fold(a) === artistaFold));
  const misAlbumes = misCosas.filter(x => x.type === 'album');
  const misCanciones = misCosas.filter(x => x.type === 'track');
  const hechos = misCosas.filter(x => x.listened).length;
  const pct = misCosas.length ? Math.round(hechos / misCosas.length * 100) : 0;
  const mejorValorado = misAlbumes.filter(x => x.rating > 0).sort((a, b) => b.rating - a.rating || (yearOf(b) || 0) - (yearOf(a) || 0))[0] || null;
  const cronologia = misAlbumes.filter(x => yearOf(x)).sort((a, b) => yearOf(a) - yearOf(b));
  return { misAlbumes, misCanciones, total: misCosas.length, hechos, pct, mejorValorado, cronologia };
}

async function cargarSimilares(it) {
  const box = document.getElementById('dSimilar');
  if (!box) return;
  const lf = lastfmCfg();
  if (!lf) { box.innerHTML = `<p class="lede" style="margin:0;">Pon tu clave de Last.fm en Ajustes para ver sugerencias de artistas parecidos.</p>`; return; }
  try {
    const nombres = (await lastfmSimilar(it.title, lf.apiKey, 8)).filter(n => fold(n) !== fold(it.title));
    if (!nombres.length) { box.innerHTML = `<p class="lede" style="margin:0;">Last.fm no tiene sugerencias para este artista.</p>`; return; }
    box.innerHTML = `<div class="simgrid">${nombres.map(n => `<button class="simchip" data-simadd="${esc(n)}">＋ ${esc(n)}</button>`).join('')}</div>`;
    box.querySelector('.simgrid').addEventListener('click', e => {
      const b = e.target.closest('.simchip'); if (!b || b.disabled) return;
      agregarArtistaSimilar(b.dataset.simadd, b);
    });
  } catch {
    box.innerHTML = `<p class="lede" style="margin:0;">No se pudo consultar Last.fm ahora mismo.</p>`;
  }
}

async function agregarArtistaSimilar(nombre, btn) {
  if (!isConnected()) { toast('Conéctate con Spotify en Ajustes para añadir sugerencias'); return; }
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '…';
  try {
    const d = await spotifySearch(nombre, 'artist', 0);
    const top = (d.artists?.items || [])[0];
    if (!top) { toast('No lo encontré en Spotify: ' + nombre); btn.disabled = false; btn.innerHTML = original; return; }
    if (ITEMS.some(x => x.spotifyId === top.id)) {
      btn.classList.add('done'); btn.innerHTML = '✓ ' + esc(top.name);
      toast('Ya lo tenías: ' + top.name);
      return;
    }
    ITEMS.push(makeItem(normalize(top, 'artist')));
    saveItems(); render();
    btn.classList.add('done'); btn.innerHTML = '✓ ' + esc(top.name);
    toast('Añadido: ' + top.name);
  } catch {
    toast('No se pudo buscar ahora mismo');
    btn.disabled = false; btn.innerHTML = original;
  }
}

// Las etiquetas de Last.fm son libres: mucha gente etiqueta "seen live", el
// nombre del propio artista, o el año/década sueltos. Se filtra lo obvio.
const LASTFM_RUIDO = new Set(['seen live', 'favorite', 'favorites', 'favourite', 'favourites', 'spotify', 'albums i own', 'vinyl', 'cd', 'under 2000 listeners']);
function limpiarEtiquetasLastfm(tags, nombreArtista) {
  const artistaFold = fold(nombreArtista);
  return tags
    .filter(t => t && !/^\d{2,4}s?$/.test(t.trim()))
    .filter(t => !LASTFM_RUIDO.has(fold(t)))
    .filter(t => fold(t) !== artistaFold)
    .slice(0, 5);
}

const sinGenero = () => ITEMS.filter(i => (!i.genres || !i.genres.length) && !i.manual && i.type !== 'playlist' && (i.artists || []).length).length;
// cuántas peticiones a Last.fm haría falta como mucho (agrupando por artista principal)
function porArtistaUnicos() {
  const set = new Set();
  ITEMS.forEach(i => {
    if ((!i.genres || !i.genres.length) && !i.manual && i.type !== 'playlist' && i.artists && i.artists[0]) set.add(fold(i.artists[0]));
  });
  return set.size;
}

let _completandoGeneros = false;
let _pararGeneros = false;

async function completarGeneros() {
  const lf = lastfmCfg();
  if (!lf) { toast('Pon primero tu clave de Last.fm en Ajustes'); return; }
  if (_completandoGeneros) { _pararGeneros = true; return; }
  _completandoGeneros = true;
  _pararGeneros = false;
  pedirDespertar();
  const btn = document.getElementById('fillGenres');
  if (btn) btn.textContent = 'Detener';

  // agrupa por artista principal: si tienes 40 canciones del mismo artista,
  // se le pregunta a Last.fm una sola vez, no 40
  const faltan = ITEMS.filter(i => (!i.genres || !i.genres.length) && !i.manual && i.type !== 'playlist' && (i.artists || []).length);
  const porArtista = new Map();
  faltan.forEach(it => {
    const nombre = it.artists[0];
    const k = fold(nombre);
    if (!porArtista.has(k)) porArtista.set(k, { nombre, items: [] });
    porArtista.get(k).items.push(it);
  });
  const grupos = [...porArtista.values()];
  let hechos = 0, conEtiquetas = 0, clavemal = false, sinGuardar = 0;

  try {
    const CONCURRENCIA = 2;   // Last.fm no publica un límite claro: mejor ir con calma
    let i = 0;
    async function trabajador() {
      while (i < grupos.length && !_pararGeneros && !clavemal) {
        const mio = i++;
        const { nombre, items } = grupos[mio];
        try {
          const tags = limpiarEtiquetasLastfm(await lastfmToptags(nombre, lf.apiKey), nombre);
          if (tags.length) {
            items.forEach(it => { it.genres = tags; it.touchedAt = Date.now(); });
            conEtiquetas++;
            // con miles de artistas por mirar, guardar solo al final significaría
            // perder horas de trabajo si se cierra la pestaña a mitad
            if (++sinGuardar >= 25) { saveItems(); sinGuardar = 0; }
          }
        } catch (e) {
          if (e.message === 'LASTFM_ERR:10') clavemal = true;   // clave inválida: no seguir gastando peticiones
        }
        hechos++;
        const est = document.getElementById('genreStat');
        if (est) est.textContent = `● ${hechos.toLocaleString('es-ES')} de ${grupos.length.toLocaleString('es-ES')} artistas mirados`;
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCIA, grupos.length) }, trabajador));
  } finally {
    saveItems(); render();
    _completandoGeneros = false;
    soltarDespertar();
    if (clavemal) toast('Esa clave de Last.fm no es válida. Revísala en Ajustes.');
    else toast(_pararGeneros
      ? `Detenido — ${conEtiquetas} de ${hechos} artistas con género nuevo`
      : `${conEtiquetas} de ${grupos.length} artistas tenían etiquetas en Last.fm`);
    if (document.getElementById('fillGenres')) openSettings();
  }
}

/* Revisión de metadatos y enlaces en una sola pasada: pedir cada elemento a
   Spotify ya nos dice las dos cosas — si responde, rellenamos los huecos; si
   responde 404, ese elemento ya no existe en Spotify (retirado del catálogo,
   cambio de región…) y se marca como roto.
   NUNCA pisa lo que hayas editado a mano: solo rellena campos vacíos. */
let _revisando = false, _pararRevision = false;
const REVISABLES = () => ITEMS.filter(i => !i.manual && i.spotifyId && !String(i.spotifyId).startsWith('manual:') && i.type !== 'playlist');

async function revisarMetadatos() {
  if (!isConnected()) { toast('Conéctate con Spotify primero'); return; }
  if (_revisando) { _pararRevision = true; return; }
  _revisando = true; _pararRevision = false;
  pedirDespertar();
  const btn = document.getElementById('revisarMeta');
  if (btn) btn.textContent = 'Detener';

  const lista = REVISABLES();
  let hechos = 0, rellenados = 0, rotos = 0, sinGuardar = 0, authFail = false;
  const CAMPOS = ['releaseDate', 'label', 'popularity', 'totalTracks', 'durationMs', 'albumType', 'isrc', 'coverUrl'];

  try {
    const CONCURRENCIA = 4;
    let i = 0;
    async function trabajador() {
      while (i < lista.length && !_pararRevision && !authFail) {
        const it = lista[i++];
        try {
          const t = await spotifyToken();
          const res = await fetchConReintento429(`https://api.spotify.com/v1/${it.type}s/${it.spotifyId}`, t);
          if (res.status === 401 || res.status === 403) { authFail = true; return; }
          if (res.status === 404) {
            if (!it.roto) { it.roto = true; it.touchedAt = Date.now(); rotos++; }
          } else if (res.ok) {
            if (it.roto) { delete it.roto; it.touchedAt = Date.now(); }
            const fresco = normalize(await res.json(), it.type);
            let cambio = false;
            CAMPOS.forEach(c => {
              const vacio = it[c] === null || it[c] === undefined || it[c] === '';
              if (vacio && fresco[c] !== null && fresco[c] !== undefined && fresco[c] !== '') { it[c] = fresco[c]; cambio = true; }
            });
            if (cambio) { it.touchedAt = Date.now(); rellenados++; }
          }
        } catch { /* fallo puntual de red: se salta este elemento */ }
        hechos++;
        // guardar cada tanto: con miles de elementos, no perder el trabajo si se cierra la pestaña
        if (++sinGuardar >= 150) { sinGuardar = 0; saveItems(); }
        const est = document.getElementById('revisarStat');
        if (est) est.textContent = `● ${hechos.toLocaleString('es-ES')} de ${lista.length.toLocaleString('es-ES')} revisados · ${rellenados} completados · ${rotos} rotos`;
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCIA, lista.length) }, trabajador));
  } finally {
    saveItems(); render();
    _revisando = false;
    soltarDespertar();
    if (authFail) toast('Tu conexión con Spotify no vale. Vuelve a conectarte en Ajustes.');
    else toast(`${rellenados} con datos nuevos · ${rotos} sin resultado en Spotify` + (_pararRevision ? ' (detenido)' : ''));
    if (document.getElementById('revisarMeta')) openSettings();
  }
}

const rotosCount = () => ITEMS.filter(i => i.roto).length;

const cuenta = tipo => ITEMS.filter(i => i.type === tipo).length;

/* Canciones sueltas cuyo álbum ya está guardado entero: al importar listas
   grandes (o al guardar canciones de un disco que luego guardas completo) el
   vault acaba con la misma música contada dos veces — la ficha del álbum ya
   lleva su lista de canciones dentro, así que la copia suelta solo estorba.
   No se toca lo que tenga algo tuyo (valoración, notas, etiquetas, escuchado,
   prioridad): eso lo guardaste por algo. */
function cancionesConAlbumGuardado() {
  const albumes = new Set(ITEMS.filter(i => i.type === 'album' && i.spotifyId).map(i => i.spotifyId));
  if (!albumes.size) return [];
  return ITEMS.filter(i =>
    i.type === 'track' && i.albumId && albumes.has(i.albumId) &&
    !i.rating && !(i.notes || '').trim() && !(i.tagIds || []).length &&
    !i.listened && !i.prioridad && !i.archived);
}

function quitarCancionesConAlbumGuardado() {
  const sobran = cancionesConAlbumGuardado();
  if (!sobran.length) { toast('No hay ninguna canción suelta cuyo álbum ya tengas'); return; }
  const porAlbum = new Set(sobran.map(i => i.albumId));
  if (!confirm(`¿Quitar ${sobran.length.toLocaleString('es-ES')} canciones sueltas?\n\n` +
    `Están todas dentro de ${porAlbum.size.toLocaleString('es-ES')} álbumes que ya tienes guardados enteros, así que no pierdes nada: siguen estando en la ficha de su álbum.\n\n` +
    `No se toca ninguna que tenga valoración, notas, etiquetas, prioridad o esté marcada como escuchada. Podrás deshacerlo desde el aviso que sale justo después.`)) return;
  deleteItems(sobran.map(i => i.id));
  openSettings();
}

/* Editor de etiqueta y de carpeta. Es la misma hoja: una carpeta es una
   etiqueta con esCarpeta y sin carpeta propia, así que cambia el título, el
   texto y poco más — y no hay dos formularios que mantener a la vez. */
function abrirEditorTag(id, carpeta) {
  const t = id ? TAGS.find(x => x.id === id) : null;
  const esCar = t ? esCarpeta(t) : !!carpeta;
  let color = t ? t.colorHex : TAG_COLORS[Math.floor(Math.random() * TAG_COLORS.length)];
  let icono = iconoDe(t || { esCarpeta: esCar });
  const pintar = () => {
    document.getElementById('icoGrid').innerHTML = ICONOS_ORDEN.map(k =>
      `<button data-ico="${k}" class="${k === icono ? 'on' : ''}" style="color:${esc(color)}">` +
      `<svg viewBox="0 0 24 24" width="22" height="22" fill="${esc(color)}"><path d="${ICONOS[k]}"/></svg></button>`).join('');
  };
  showSheet(`
    <div class="sheethead"><h2>${t ? 'Editar' : 'Nueva'} ${esCar ? 'carpeta' : 'etiqueta'}</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <div class="flabel">Nombre</div>
    <input class="field" id="tgName" value="${esc(t ? t.name : '')}" placeholder="${esCar ? 'Por ejemplo: Géneros' : 'Por ejemplo: Para el gimnasio'}" autocomplete="off">
    <div class="flabel">Color</div>
    <div class="swatches" id="tgSw">
      ${TAG_COLORS.map(c => `<span class="sw ${c === color ? 'on' : ''}" data-c="${c}" style="background:${c}"></span>`).join('')}
      <input type="color" id="tgSwCustom" value="${esc(color)}" title="Color a medida" style="width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer;">
    </div>
    <div class="flabel">Icono</div>
    <div class="icogrid" id="icoGrid"></div>
    ${!esCar ? `<div class="flabel">Carpeta</div>
    <select class="field" id="tgCarpeta">
      <option value="">Sin carpeta</option>
      ${carpetasOrdenadas().map(c => `<option value="${esc(c.id)}" ${t && t.carpetaId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
    </select>` : ''}
    <div class="btnrow" style="margin-top:16px;"><button class="btn primary wide" id="tgSave">Guardar</button></div>
    ${t ? `<div class="btnrow"><button class="btn danger wide" id="tgDel">Eliminar ${esCar ? 'carpeta' : 'etiqueta'}</button></div>` : ''}
  `);
  pintar();
  document.getElementById('icoGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-ico]'); if (!b) return;
    icono = b.dataset.ico; pintar();
  });
  const cambiaColor = c => { color = c; document.getElementById('tgSwCustom').value = c; pintar(); };
  document.getElementById('tgSw').addEventListener('click', e => {
    const s = e.target.closest('.sw'); if (!s) return;
    document.querySelectorAll('#tgSw .sw').forEach(x => x.classList.toggle('on', x === s));
    cambiaColor(s.dataset.c);
  });
  document.getElementById('tgSwCustom').addEventListener('input', e => {
    document.querySelectorAll('#tgSw .sw').forEach(x => x.classList.remove('on'));
    cambiaColor(e.target.value);
  });
  document.getElementById('tgSave').addEventListener('click', () => {
    const name = document.getElementById('tgName').value.trim();
    if (!name) { toast('Ponle un nombre'); return; }
    const repe = TAGS.some(x => x.id !== (t && t.id) && esCarpeta(x) === esCar && x.name.toLowerCase() === name.toLowerCase());
    if (repe) { toast(`Ya tienes ${esCar ? 'una carpeta' : 'una etiqueta'} con ese nombre`); return; }
    const carpetaId = esCar ? null : (document.getElementById('tgCarpeta')?.value || null);
    if (t) Object.assign(t, { name, colorHex: color, icon: icono, carpetaId });
    else TAGS.push({ id: uid(), name, colorHex: color, icon: icono, carpetaId, esCarpeta: esCar || undefined });
    saveTags(); render(); closeModal(); openSettings();
  });
  document.getElementById('tgDel')?.addEventListener('click', () => {
    /* Borrar una carpeta no borra lo que hay dentro: sus etiquetas salen a la
       superficie. Perder etiquetas por reordenar carpetas sería el peor
       recuerdo posible de esta pantalla. */
    if (esCar) TAGS.forEach(x => { if (x.carpetaId === t.id) x.carpetaId = null; });
    else ITEMS.forEach(it => { it.tagIds = (it.tagIds || []).filter(x => x !== t.id); });
    TAGS = TAGS.filter(x => x.id !== t.id);
    tombstoneTag(t.id);
    if (PREFS.tag === t.id) PREFS.tag = 'all';
    saveTags(); if (!esCar) saveItems(); savePrefs(); render(); closeModal(); openSettings();
  });
}

/* Aparte del JSON (que es el que sabe leer la propia app), un CSV sirve para
   mirar el vault como lo que ya conoces: una hoja de cálculo. Este no se
   piensa para volver a importarlo — es de solo lectura, para consultar. */
function exportarCSV() {
  const filas = [['Título', 'Artista', 'Tipo', 'Año', 'Escuchado', 'Valoración', 'Etiquetas', 'Archivado', 'Enlace']];
  ITEMS.forEach(it => {
    const tagNames = (it.tagIds || []).map(id => tagById(id)?.name).filter(Boolean).join('; ');
    filas.push([
      it.title || '', artistsOf(it), TYPE_LABEL[it.type] || it.type, yearOf(it) || '',
      it.listened ? 'Sí' : 'No', it.rating || 0, tagNames, it.archived ? 'Sí' : 'No', it.spotifyUrl || ''
    ]);
  });
  const csv = filas.map(fila => fila.map(v => {
    const s = String(v ?? '');
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });   // BOM: para que Excel detecte UTF-8 solo
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `musicvault-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  META.lastExportedAt = Date.now(); saveMeta();
  toast('CSV descargado');
}

/* Lo tuyo, que una copia NUNCA debe pisar al restaurarla: es lo que has hecho
   tú a mano (o lo que ha registrado el historial de escucha), no metadatos
   que se puedan volver a pedir. El resto de campos (carátula, año, duración,
   géneros…) sí se rellenan, pero solo si están vacíos. */
const CAMPOS_TUYOS = new Set(['id', 'dateAdded', 'notes', 'rating', 'tagIds',
  'listened', 'listenedAt', 'archived', 'prioridad', 'plays', 'trackPlays',
  'cancionesEscuchadas', 'touchedAt', 'autoAdded']);

/* Rellena los huecos de `it` con lo que traiga `fresco`, sin tocar nada tuyo
   ni machacar un dato que ya estuviera puesto. Devuelve true si cambió algo. */
/* Caso aparte: una lista a la que solo le FALTAN nombres. Si lo que ya tienes
   está entero dentro de lo que llega y lo que llega trae más, no es pisar un
   dato — es completarlo. Pasa con las colaboraciones: una ficha guardada como
   "Brennan Heart" cuando en realidad es "Brennan Heart, HI-LO, Project
   Zeitgeist". Si has quitado o cambiado algún nombre a mano, tu versión ya no
   está contenida en la nueva y no se toca. */
function listaAmpliable(actual, nuevo) {
  if (!Array.isArray(actual) || !Array.isArray(nuevo)) return false;
  if (nuevo.length <= actual.length) return false;
  const enNuevo = new Set(nuevo.map(x => String(x).trim().toLowerCase()));
  return actual.every(x => enNuevo.has(String(x).trim().toLowerCase()));
}

function enriquecer(it, fresco) {
  let cambio = false;
  Object.keys(fresco).forEach(k => {
    if (CAMPOS_TUYOS.has(k)) return;
    const nuevo = fresco[k];
    if (nuevo == null || nuevo === '' || (Array.isArray(nuevo) && !nuevo.length)) return;
    const actual = it[k];
    const vacio = actual == null || actual === '' || (Array.isArray(actual) && !actual.length);
    if (!vacio && !listaAmpliable(actual, nuevo)) return;
    it[k] = nuevo;
    cambio = true;
  });
  return cambio;
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!Array.isArray(d.items)) throw new Error('bad');
      const porSid = new Map();
      ITEMS.forEach(i => { if (i.spotifyId) porSid.set(i.spotifyId, i); });

      const fresh = [];
      let rellenados = 0;
      /* Antes lo que ya tenías se saltaba sin más. Si la copia traía MÁS datos
         (p. ej. una importación masiva que entró sin carátula ni año, y luego
         una copia con todo), no había forma de completarlo: tocaba borrar y
         volver a importar. Ahora esos huecos se rellenan aquí mismo. */
      (d.items || []).forEach(i => {
        if (!i || !i.spotifyId) return;
        const mio = porSid.get(i.spotifyId);
        if (!mio) { fresh.push(i); porSid.set(i.spotifyId, i); return; }
        if (enriquecer(mio, i)) { mio.touchedAt = Date.now(); rellenados++; }
      });

      // si alguno estaba borrado (con tumba) desde después de esta copia, que la
      // restauración gane: si no, la próxima sincronización lo borraría otra vez
      // sin avisar, justo después de decirte que se había restaurado
      fresh.forEach(i => { i.touchedAt = Date.now(); });
      untombstone(fresh);
      const tagNames = new Set(TAGS.map(t => t.name.toLowerCase()));
      (d.tags || []).forEach(t => { if (t && t.name && !tagNames.has(t.name.toLowerCase())) TAGS.push(t); });
      ITEMS = ITEMS.concat(fresh);
      saveItems(); saveTags(); render(); closeModal();
      const partes = [];
      if (fresh.length) partes.push(`${fresh.length.toLocaleString('es-ES')} restaurado${fresh.length === 1 ? '' : 's'}`);
      if (rellenados) partes.push(`${rellenados.toLocaleString('es-ES')} completado${rellenados === 1 ? '' : 's'}`);
      toast(partes.length ? partes.join(' · ') : 'No había nada nuevo que restaurar');
    } catch {
      toast('Ese archivo no es una copia válida de MusicVault');
    }
  };
  fr.readAsText(file);
  e.target.value = '';
}

/* ---- estadísticas ---- */
/* ---- posibles duplicados ----
   Con varias vías de entrada (búsqueda exacta, "por nombre" con coincidencia
   aproximada, enlaces externos, playlists), es fácil que el mismo álbum o
   canción acabe guardado dos veces sin que la app lo note — porque no
   comparten el mismo spotifyId (uno puede ser un enlace externo, o venir de
   ediciones distintas). Se compara título (ignorando remaster/directo/edición)
   + artista + tipo entre elementos que SÍ tienen spotifyId distinto. */
function tituloBase(t) {
  const patron = /(remaster(?:ed)?(?:\s*\d{2,4})?|live|en vivo|directo|deluxe(?:\s*edition)?|mono|stereo|single version|radio edit|explicit|clean|bonus track version|anniversary edition|edición especial)/i;
  return fold(t)
    .replace(new RegExp('[-–—]\\s*' + patron.source + '.*$', 'i'), '')
    .replace(new RegExp('[\\(\\[]\\s*' + patron.source + '[^\\)\\]]*[\\)\\]]', 'gi'), '')
    .trim();
}
function buscarDuplicados() {
  const grupos = new Map();
  ITEMS.forEach(it => {
    if (it.archived || it.type === 'artist' || it.type === 'playlist') return;   // esos no aplican aquí
    const key = it.type + '::' + tituloBase(it.title) + '::' + fold(artistsOf(it));
    if (!key || key.startsWith('::')) return;
    if (!grupos.has(key)) grupos.set(key, []);
    grupos.get(key).push(it);
  });
  return [...grupos.values()].filter(g => g.length > 1 && new Set(g.map(i => i.spotifyId)).size > 1);
}
function openDuplicados() {
  const grupos = buscarDuplicados();
  const TOPE = 60;
  showSheet(`
    <div class="sheethead"><h2>Posibles duplicados</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <p class="lede">Comparo título y artista (ignorando remasters, directos, ediciones especiales…) entre elementos que no comparten el mismo enlace de Spotify. No borro nada por mi cuenta — decides tú cuál te quedas.</p>
    <p class="lede"><strong>Unir</strong> deja una sola ficha, la más completa, y le pasa lo que tengan las otras: escuchado, valoración, notas, etiquetas y reproducciones. <strong>Borrar este</strong> quita esa copia tal cual, con lo que tuviera dentro.</p>
    <div id="dupOut">
      ${!grupos.length
        ? `<div class="empty" style="padding:24px 8px;"><div class="ico">✨</div><h2>Nada que limpiar</h2><p>No he encontrado títulos y artistas repetidos entre orígenes distintos.</p></div>`
        : grupos.slice(0, TOPE).map((g, gi) => `
          <div class="flabel" style="margin-top:${gi === 0 ? '0' : '18'}px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <span>${esc(g[0].title)} — ${esc(artistsOf(g[0]))}</span>
            <button class="linkbtn" data-dupunir="${gi}">Unir las ${g.length}</button>
          </div>
          <div class="list">${g.map(it => `
            <div class="lrow" style="cursor:default;">
              <div class="lart">${portada(it.coverUrl, TYPE_ICON[it.type], true)}</div>
              <div class="linfo">
                <div class="lt">${esc(it.title)}</div>
                <div class="la">${it.manual ? 'Enlace externo' : 'Spotify'} · guardado ${relDate(it.dateAdded)}</div>
              </div>
              <button class="btn danger" style="padding:7px 11px;font-size:12px;flex-shrink:0;" data-dupdel="${it.id}">Borrar este</button>
            </div>`).join('')}
          </div>`).join('') + (grupos.length > TOPE ? `<p class="lede" style="margin-top:14px;">Y ${(grupos.length - TOPE).toLocaleString('es-ES')} grupos más — repite la búsqueda después de limpiar estos para ver el resto.</p>` : '')
      }
    </div>
  `);
  document.getElementById('dupOut').addEventListener('click', e => {
    const unir = e.target.closest('[data-dupunir]');
    if (unir) {
      // unirGrupo vuelca en la ficha más completa lo que tengan las demás
      // antes de borrarlas, para que limpiar no cueste ningún dato tuyo
      const { sobran } = unirGrupo(grupos[+unir.dataset.dupunir]);
      if (sobran.length) deleteItems(sobran.map(x => x.id));   // deja tumba + papelera + Deshacer
      openDuplicados();
      return;
    }
    const b = e.target.closest('[data-dupdel]'); if (!b) return;
    deleteItems([b.dataset.dupdel]);
    openDuplicados();
  });
}

function relDate(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return 'hoy';
  if (days === 1) return 'ayer';
  if (days < 30) return `hace ${days} días`;
  const months = Math.floor(days / 30);
  if (months < 12) return `hace ${months} ${months === 1 ? 'mes' : 'meses'}`;
  const years = Math.floor(days / 365);
  return `hace ${years} ${years === 1 ? 'año' : 'años'}`;
}

function bars(rows, color) {
  if (!rows.length) return '<p class="lede" style="margin:0;">Sin datos todavía.</p>';
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="barlist">${rows.map(([label, n]) => `
    <div class="barrow">
      <span class="blabel">${esc(label)}</span>
      <span class="btrack"><span class="bfill" style="width:${Math.max(4, n / max * 100)}%;background:${color}"></span></span>
      <span class="bnum">${n}</span>
    </div>`).join('')}</div>`;
}

// compara cuántas veces aparece cada género entre lo añadido este año contra
// lo añadido el año pasado — el que más ha subido, no el más frecuente sin más
function generoQueMasHaCrecido() {
  const anioActual = new Date().getFullYear();
  const porGenero = {};
  ITEMS.forEach(it => {
    if (!it.genres?.length) return;
    const anio = new Date(it.dateAdded).getFullYear();
    if (anio !== anioActual && anio !== anioActual - 1) return;
    it.genres.forEach(g => {
      if (!porGenero[g]) porGenero[g] = { actual: 0, anterior: 0 };
      porGenero[g][anio === anioActual ? 'actual' : 'anterior']++;
    });
  });
  let mejor = null, mejorDelta = 0;
  Object.entries(porGenero).forEach(([g, { actual, anterior }]) => {
    const delta = actual - anterior;
    if (delta > mejorDelta) { mejorDelta = delta; mejor = g; }
  });
  return mejor ? { genero: mejor, delta: mejorDelta } : null;
}

// lo que añadiste un día como hoy, en años anteriores — "cápsula del tiempo"
function capsulaDeHoy() {
  const hoy = new Date();
  return ITEMS.filter(it => {

    return d.getMonth() === hoy.getMonth() && d.getDate() === hoy.getDate() && d.getFullYear() < hoy.getFullYear();
  }).sort((a, b) => b.dateAdded - a.dateAdded);
}

/* Historial de escucha: dos mitades. Arriba, lo que TÚ tienes marcado como
   escuchado (con su fecha real, dato local, siempre disponible). Abajo, lo
   que Spotify dice que has reproducido hace poco — sirve además para ver de
   un vistazo por qué algo entró o no entró en el vault, en vez de tener que
   adivinarlo. */
function openHistorial() {
  const escuchados = ITEMS.filter(i => i.listenedAt).sort((a, b) => b.listenedAt - a.listenedAt);
  const ahora = Date.now();
  const enUltimos = d => escuchados.filter(i => ahora - i.listenedAt < d * 86400000).length;

  // racha: días seguidos (hacia atrás desde hoy) con al menos una escucha
  const diasConEscucha = new Set(escuchados.map(i => new Date(i.listenedAt).toDateString()));
  let racha = 0;
  for (let d = 0; d < 400; d++) {
    const dia = new Date(ahora - d * 86400000).toDateString();
    if (diasConEscucha.has(dia)) racha++;
    else if (d > 0) break;   // el día de hoy puede estar vacío todavía sin romper la racha
  }

  // récord de racha: la tirada más larga de días consecutivos, no solo la actual.
  // Se compara por fecha de calendario (no restando milisegundos) para no
  // desajustarse en el cambio de hora dos veces al año.
  let rachaRecord = 0;
  {
    const dias = [...diasConEscucha].map(d => new Date(d)).sort((a, b) => a - b);
    let actual = 0;
    dias.forEach((dia, i) => {
      if (i === 0) { actual = 1; }
      else {
        const esperado = new Date(dias[i - 1]);
        esperado.setDate(esperado.getDate() + 1);
        actual = esperado.toDateString() === dia.toDateString() ? actual + 1 : 1;
      }
      rachaRecord = Math.max(rachaRecord, actual);
    });
  }

  /* Reproducciones totales: basta con sumar it.plays de cada elemento — el de
     un álbum YA incluye las de todas sus canciones (se registran a la vez en
     el mismo evento), así que sumar además trackPlays contaría cada una dos
     veces. Canciones distintas sí se cuentan aparte: para un álbum, cada
     pista de trackPlays es una canción distinta; sin ese detalle, el álbum
     entero cuenta como una sola (no se sabe cuántas fueron sin él). */
  let totalReproducciones = 0, cancionesDistintas = 0;
  ITEMS.forEach(i => {
    if (i.plays?.length) totalReproducciones += i.plays.length;
    if (i.type === 'album' && i.trackPlays) cancionesDistintas += Object.keys(i.trackPlays).length;
    else if (i.plays?.length) cancionesDistintas++;
  });

  const porArtista = {};
  escuchados.forEach(i => (i.artists || []).forEach(a => { porArtista[a] = (porArtista[a] || 0) + 1; }));
  const topArtistas = Object.entries(porArtista).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 6);

  /* Lo más reproducido de verdad, contador real — y mezclando canciones
     dentro de un álbum con lo suelto, no solo el disco entero como un bloque.
     Un álbum nunca entra por su cuenta aquí (su total es la suma de todas
     sus pistas, mezclarlo con el contador de una sola canción no compara lo
     mismo) — si tiene trackPlays, entra pista por pista; si no, no aparece
     hasta que alguna de sus canciones se reproduzca lo bastante para tener
     su propio dato. */
  const masReproducidos = [];
  ITEMS.forEach(i => {
    if (i.archived) return;
    if (i.type === 'album') {
      if (!i.trackPlays) return;
      Object.entries(i.trackPlays).forEach(([nombre, plays]) => {
        if (plays.length > 1) masReproducidos.push({ id: i.id, title: nombre, sub: `en ${i.title}`, plays: plays.length });
      });
    } else if (totalPlays(i) > 1) {
      masReproducidos.push({ id: i.id, title: i.title, sub: (i.artists || [])[0] || '', plays: totalPlays(i) });
    }
  });
  masReproducidos.sort((a, b) => b.plays - a.plays);
  masReproducidos.length = Math.min(masReproducidos.length, 10);

  // reproducciones por mes de este año, contando cada play individual
  const anio = new Date().getFullYear();
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const porMes = new Array(12).fill(0);
  ITEMS.forEach(i => (i.plays || []).forEach(ts => {
    const d = new Date(ts);
    if (d.getFullYear() === anio) porMes[d.getMonth()]++;
  }));
  const filasMes = porMes.map((n, m) => [MESES[m], n]).filter(r => r[1]);

  /* Sugerencia por franja horaria: mira qué artistas sueles reproducir a esta
     misma hora (±2 h) y propone algo pendiente de ellos. Solo aparece si hay
     datos suficientes — si no, sería adivinar. */
  const horaAhora = new Date().getHours();
  const artistasDeEstaFranja = {};
  ITEMS.forEach(i => (i.plays || []).forEach(ts => {
    const h = new Date(ts).getHours();
    const dist = Math.min(Math.abs(h - horaAhora), 24 - Math.abs(h - horaAhora));
    if (dist <= 2) (i.artists || []).forEach(a => { artistasDeEstaFranja[a] = (artistasDeEstaFranja[a] || 0) + 1; });
  }));
  const artistaFranja = Object.entries(artistasDeEstaFranja).sort((a, b) => b[1] - a[1])[0];
  const sugerencia = artistaFranja
    ? ITEMS.filter(i => !i.listened && !i.archived && i.type !== 'artist' && (i.artists || []).includes(artistaFranja[0]))[0] || null
    : null;

  // por hora del día: revela si eres de escuchar de noche, en el curro, etc.
  const porHora = new Array(24).fill(0);
  escuchados.forEach(i => { porHora[new Date(i.listenedAt).getHours()]++; });
  const maxHora = Math.max(...porHora, 1);
  const franjas = [['Madrugada (0-6)', 0, 6], ['Mañana (6-12)', 6, 12], ['Tarde (12-20)', 12, 20], ['Noche (20-24)', 20, 24]]
    .map(([et, a, b]) => [et, porHora.slice(a, b).reduce((s, n) => s + n, 0)]).filter(r => r[1]);

  showSheet(`
    <div class="sheethead"><h2>Historial de escucha</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    ${!escuchados.length ? `<p class="lede">Todavía no hay nada con fecha de escucha. Las fechas se guardan a partir de que marcaste algo (lo marcado antes de esa función no tiene fecha).</p>` : `
    <div class="histgrid">
      <div class="histcell"><div class="histnum">${racha}</div><div class="histlbl">día${racha === 1 ? '' : 's'} de racha</div></div>
      <div class="histcell"><div class="histnum">${rachaRecord}</div><div class="histlbl">récord de racha</div></div>
      <div class="histcell"><div class="histnum">${totalReproducciones.toLocaleString('es-ES')}</div><div class="histlbl">reproducciones</div></div>
      <div class="histcell"><div class="histnum">${cancionesDistintas.toLocaleString('es-ES')}</div><div class="histlbl">canciones distintas</div></div>
    </div>
    <div class="flabel">Ritmo</div>
    ${bars([['Últimas 24 h', enUltimos(1)], ['Última semana', enUltimos(7)], ['Último mes', enUltimos(30)], ['Último año', enUltimos(365)]].filter(r => r[1]), 'var(--amber)')}
    ${franjas.length ? `<div class="flabel">A qué horas escuchas</div>${bars(franjas, 'var(--jade)')}` : ''}
    ${sugerencia ? `<div class="flabel">A esta hora sueles escuchar ${esc(artistaFranja[0])}</div>
    <div class="list">${relatedRow(sugerencia, false)}</div>` : ''}
    ${filasMes.length ? `<div class="flabel">Reproducciones por mes (${anio})</div>${bars(filasMes, 'var(--amber)')}` : ''}
    ${masReproducidos.length ? `<div class="flabel">Lo que más repites</div>
    <div class="tracklist">${masReproducidos.map((it, i) => `
      <div class="trow" data-id="${it.id}" style="cursor:pointer;">
        <span class="trplays" style="flex-shrink:0;">${it.plays}×</span>
        <span class="trlink"><span class="trt">${esc(it.title)}</span></span>
        <span class="trd">${esc(it.sub)}</span>
      </div>`).join('')}</div>` : ''}
    ${topArtistas.length ? `<div class="flabel">Más escuchados (por elementos marcados)</div>${bars(topArtistas, 'var(--jade)')}` : ''}
    <div class="flabel">Lo último que marcaste</div>
    <div class="list">${escuchados.slice(0, 25).map(it => `
      <article class="lrow" data-id="${it.id}">
        <div class="lart">${portada(it.coverUrl, TYPE_ICON[it.type], true)}</div>
        <div class="linfo"><div class="lt">${esc(it.title)}</div><div class="la">${esc(artistsOf(it))} · ${relDate(it.listenedAt)}</div></div>
      </article>`).join('')}</div>`}

    <div class="flabel">Reproducciones recientes en Spotify</div>
    <div id="histSpotify"><p class="lede" style="margin:0;">Consultando…</p></div>
  `);
  // en toda la hoja, no solo en .list: "Lo que más repites" es una .tracklist
  document.querySelector('#modalRoot .sheet')?.addEventListener('click', e => {
    const card = e.target.closest('[data-id]'); if (card) openDetail(card.dataset.id);
  });
  cargarHistorialSpotify();
}

async function cargarHistorialSpotify() {
  const box = document.getElementById('histSpotify');
  if (!box) return;
  if (!isConnected() || !tieneScopeRecientes()) {
    box.innerHTML = `<p class="lede" style="margin:0;">Reconéctate con Spotify en Ajustes para ver esto.</p>`;
    return;
  }
  try {
    const items = await fetchRecentlyPlayed(50);
    if (!box.isConnected) return;
    if (!items.length) { box.innerHTML = `<p class="lede" style="margin:0;">Spotify no devuelve reproducciones recientes. Recuerda que solo cuentan las canciones que sonaron 30 segundos o más sin saltarlas — y nunca la que está sonando ahora mismo.</p>`; return; }
    box.innerHTML = `<p class="lede" style="margin:0 0 8px;">Lo que Spotify dice que has reproducido, más reciente primero. ✓ verde = ya está en tu vault · 🤖 = se añadió sola.</p>
      <div class="tracklist">${items.map(({ track, played_at }) => {
        if (!track) return '';
        const suelta = ITEMS.find(x => x.spotifyId === track.id);
        const enAlbum = !suelta && track.album?.id
          ? ITEMS.some(x => x.type === 'album' && x.spotifyId === track.album.id && x.trackTitles?.includes(track.name))
          : false;
        const enVault = !!suelta || enAlbum;
        const artistas = (track.artists || []).map(a => a.name).filter(Boolean).join(', ');
        return `<div class="trow">
          <span class="trcheck ${enVault ? 'on' : ''}" title="${enVault ? 'Ya en tu vault' : 'No está en tu vault'}">${enVault ? '✓' : ''}</span>
          <span class="trlink"><span class="trtwrap">
            <span class="trt">${esc(track.name || '')}${suelta?.autoAdded ? ' 🤖' : ''}</span>
            ${artistas ? `<span class="tra">${esc(artistas)}</span>` : ''}
          </span></span>
          <span class="trd">${esc(relDate(new Date(played_at).getTime()))}</span>
        </div>`;
      }).join('')}</div>`;
  } catch (e) {
    box.innerHTML = `<p class="lede" style="margin:0;">${e.message === 'RATE_LIMIT' ? `Demasiadas peticiones seguidas — inténtalo en ${tiempoEsperaTexto()}.` : 'No se pudo consultar tu historial de Spotify.'}</p>`;
  }
}

function openResumenAnual() {
  const anio = new Date().getFullYear();
  const anadidos = ITEMS.filter(it => new Date(it.dateAdded).getFullYear() === anio);
  const escuchados = ITEMS.filter(it => it.listenedAt && new Date(it.listenedAt).getFullYear() === anio);
  if (!anadidos.length && !escuchados.length) { toast(`Todavía no tienes nada de ${anio} en tu vault`); return; }

  const byArtist = {};
  anadidos.forEach(i => (i.artists || []).forEach(a => { byArtist[a] = (byArtist[a] || 0) + 1; }));
  const topArtists = Object.entries(byArtist).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 5);

  const byGenre = {};
  anadidos.forEach(i => (i.genres || []).forEach(g => { byGenre[g] = (byGenre[g] || 0) + 1; }));
  const topGenres = Object.entries(byGenre).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 5);

  const favorito5 = anadidos.filter(i => i.rating === 5).sort((a, b) => b.dateAdded - a.dateAdded)[0] || null;
  // solo cuenta lo que tiene duración guardada (no todo lo trae Spotify) — es una estimación por abajo, no el total real
  const minutos = Math.round(escuchados.reduce((s, i) => s + (i.durationMs || 0), 0) / 60000);

  showSheet(`
    <div class="sheethead"><h2>Tu ${anio}</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <div class="bigstat">
      <div class="bignum">${anadidos.length}</div>
      <div><div style="font-weight:650;">añadidos este año</div><div class="lede" style="margin:0;">${escuchados.length} marcados como escuchados</div></div>
    </div>
    ${favorito5 ? `<div class="flabel">Tu 5 estrellas de ${anio}</div><div class="list">${relatedRow(favorito5, false)}</div>` : ''}
    ${topArtists.length ? `<div class="flabel">Tus artistas de ${anio}</div>${bars(topArtists, 'var(--jade)')}` : ''}
    ${topGenres.length ? `<div class="flabel">Tus géneros de ${anio}</div>${bars(topGenres, 'var(--amber)')}` : ''}
    ${minutos > 0 ? `<div class="flabel">Minutos escuchados este año</div><p class="lede" style="margin:0;">${minutos.toLocaleString('es-ES')} minutos (${(minutos / 60).toFixed(1)} h) — solo cuenta lo que tiene duración guardada, así que es una estimación por abajo del total real.</p>` : ''}
  `);
  document.querySelector('#modalRoot .list')?.addEventListener('click', e => {
    const card = e.target.closest('[data-id]'); if (card) openDetail(card.dataset.id);
  });
}

function openStats() {
  if (!ITEMS.length) { toast('Tu vault está vacío'); return; }
  // si hay un filtro puesto (tipo, década, etiqueta, género, búsqueda...), las
  // estadísticas se calculan sobre ESO en vez de sobre el vault entero — así
  // "¿cuánto llevo escuchado de los 70?" se responde solo, sin hacer cuentas
  const q = fold(document.getElementById('q').value.trim());
  const anyFilter = PREFS.type !== 'all' || PREFS.status !== 'all' || PREFS.tag !== 'all' || PREFS.genre !== 'all' || PREFS.decade !== 'all' || PREFS.dur !== 'all' || q;
  const base = anyFilter ? filtered() : ITEMS.filter(i => !i.archived);
  if (!base.length) { toast('No hay nada que coincida con el filtro actual'); return; }

  // los artistas no cuentan como pendiente ni escuchado (ver filtered())
  const contables = base.filter(i => i.type !== 'artist');
  const done = contables.filter(i => i.listened);
  const pending = contables.filter(i => !i.listened);

  const byArtist = {};
  base.forEach(i => (i.artists || []).forEach(a => { byArtist[a] = (byArtist[a] || 0) + 1; }));
  const topArtists = Object.entries(byArtist).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 8);

  const byGenre = {};
  base.forEach(i => (i.genres || []).forEach(g => { byGenre[g] = (byGenre[g] || 0) + 1; }));
  const topGenres = Object.entries(byGenre).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 8);

  const byDecade = {};
  base.forEach(i => { const y = yearOf(i); if (y) { const d = Math.floor(y / 10) * 10 + 's'; byDecade[d] = (byDecade[d] || 0) + 1; } });
  const decades = Object.entries(byDecade).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));

  const byType = ['album', 'track', 'artist', 'playlist'].map(t => [TYPE_PLURAL[t], base.filter(i => i.type === t).length]).filter(r => r[1]);
  const rated = base.filter(i => i.rating > 0);
  const avg = rated.length ? (rated.reduce((s, i) => s + i.rating, 0) / rated.length).toFixed(1) : null;
  const oldest = pending.slice().sort((a, b) => a.dateAdded - b.dateAdded)[0];
  const pct = contables.length ? Math.round(done.length / contables.length * 100) : 0;
  const sinExplorar = anyFilter ? [] : artistasSinExplorar();
  const aMedias = anyFilter ? [] : albumesAMedias();
  const capsula = anyFilter ? [] : capsulaDeHoy();
  const joyas = anyFilter ? [] : joyasOcultas();
  const colabs = anyFilter ? [] : colaboradoresSinGuardar();
  const crecimiento = anyFilter ? null : generoQueMasHaCrecido();

  showSheet(`
    <div class="sheethead"><h2>${anyFilter ? 'Esto en números' : 'Tu vault en números'}</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    ${!anyFilter ? `<div class="btnrow">
      <button class="btn wide" id="verResumenAnual">🎁 Resumen de ${new Date().getFullYear()}</button>
      <button class="btn wide" id="verHistorial">🎧 Historial</button>
    </div>` : ''}
    ${anyFilter ? `<p class="lede" style="margin:-8px 0 14px;">Con el filtro que tienes puesto ahora: ${base.length.toLocaleString('es-ES')} de ${ITEMS.length.toLocaleString('es-ES')} elementos.</p>` : ''}
    ${capsula.length ? `<button class="linkbtn" id="verCapsula" style="display:block;margin-bottom:12px;">📅 Lo que añadiste un día como hoy →</button>` : ''}

    <div class="bigstat">
      <div class="bignum">${pct}<span class="pctsign">%</span></div>
      <div>
        <div style="font-weight:650;">escuchado</div>
        <div class="lede" style="margin:0;">${done.length} de ${contables.length} · te quedan ${pending.length} por escuchar</div>
      </div>
    </div>
    <div class="progtrack"><span class="progfill" style="width:${pct}%"></span></div>
    ${aMedias.length ? `<button class="linkbtn" id="verAMedias" style="display:block;margin-top:8px;">Retomar los ${aMedias.length} álbum${aMedias.length === 1 ? '' : 'es'} que dejaste a medias →</button>` : ''}

    ${oldest ? `<div class="flabel">Lo que más tiempo lleva esperando</div>
    <button class="oldcard" data-goto="${oldest.id}">
      <span class="oldart">${portada(oldest.coverUrl, TYPE_ICON[oldest.type], false)}</span>
      <span class="oldinfo">
        <span class="oldt">${esc(oldest.title)}</span>
        <span class="olda">${esc(artistsOf(oldest))} · guardado ${relDate(oldest.dateAdded)}</span>
      </span>
    </button>` : ''}

    <div class="flabel">Qué guardas</div>
    ${bars(byType, 'var(--amber)')}

    <div class="flabel">Artistas con más cosas guardadas</div>
    ${bars(topArtists, 'var(--jade)')}
    ${sinExplorar.length ? `<button class="linkbtn" id="verSinExplorar" style="display:block;margin-top:8px;">Ver los ${sinExplorar.length.toLocaleString('es-ES')} artistas que aún no tienen nada más guardado →</button>` : ''}

    ${topGenres.length ? `<div class="flabel">Géneros más frecuentes</div>
    ${bars(topGenres, 'var(--jade)')}
    ${crecimiento ? `<p class="lede" style="margin:8px 0 0;">📈 <strong>${esc(crecimiento.genero)}</strong> es el que más ha crecido este año (+${crecimiento.delta} desde el año pasado).</p>` : ''}` : ''}

    ${joyas.length ? `<div class="flabel">Tus joyas ocultas</div>
    <p class="lede" style="margin:0 0 6px;">Les diste 4★ o más y en Spotify apenas las escucha nadie.</p>
    <div class="list">${joyas.slice(0, 8).map(it => relatedRow(it, false)).join('')}</div>` : ''}

    ${colabs.length ? `<div class="flabel">Colaboradores que no tienes guardados</div>
    <p class="lede" style="margin:0 0 6px;">Aparecen acompañando en varias cosas tuyas, pero no los sigues.</p>
    <div class="simgrid">${colabs.slice(0, 12).map(c => `<button class="simchip" data-simadd="${esc(c.nombre)}">＋ ${esc(c.nombre)} <span class="ct">${c.n}</span></button>`).join('')}</div>` : ''}

    <div class="flabel">Por década de lanzamiento</div>
    ${bars(decades, 'var(--amber)')}

    <div class="flabel">Valoraciones</div>
    <p class="lede" style="margin:0;">${rated.length ? `Has valorado ${rated.length} de ${base.length}. Media: <strong>${avg}</strong> ★` : 'Todavía no has valorado nada. Abre cualquier ficha y toca las estrellas.'}</p>

    ${!anyFilter && ITEMS.some(i => i.archived) ? `<div class="flabel">Archivado</div>
    <p class="lede" style="margin:0;">${ITEMS.filter(i => i.archived).length} guardado${ITEMS.filter(i => i.archived).length === 1 ? '' : 's'} aparte, fuera de las listas normales.</p>
    <button class="linkbtn" id="redescubrir" style="display:block;margin-top:6px;">🎲 Redescubrir algo del archivo →</button>` : ''}
  `);

  document.querySelector('[data-goto]')?.addEventListener('click', e => openDetail(e.currentTarget.dataset.goto));
  document.querySelector('#modalRoot .sheet')?.addEventListener('click', e => {
    const rel = e.target.closest('[data-openrel]');
    if (rel) { openDetail(rel.dataset.openrel); return; }
    const add = e.target.closest('[data-simadd]');
    if (add) agregarArtistaSimilar(add.dataset.simadd, add);
  });
  document.getElementById('verSinExplorar')?.addEventListener('click', openArtistasSinExplorar);
  document.getElementById('verAMedias')?.addEventListener('click', openAlbumesAMedias);
  document.getElementById('verCapsula')?.addEventListener('click', openCapsula);
  document.getElementById('verResumenAnual')?.addEventListener('click', openResumenAnual);
  document.getElementById('verHistorial')?.addEventListener('click', openHistorial);
  document.getElementById('redescubrir')?.addEventListener('click', redescubrirArchivado);
}

/* ---- shuffle ---- */
function shuffle() {
  const pool = ITEMS.filter(i => !i.listened && !i.archived);
  if (!pool.length) {
    toast(ITEMS.length ? '¡No te queda nada pendiente!' : 'Tu vault está vacío');
    return;
  }
  openDetail(pool[Math.floor(Math.random() * pool.length)].id);
}

/* ============ events ============ */
/* Fullscreen de verdad si el navegador deja (en iOS no existe para páginas
   normales, así que allí se queda en "esconder la interfaz", que ya es lo
   principal). Salir con Esc o con la ✕ de la esquina. */
function togglePresentacion() {
  const on = !document.body.classList.contains('presentacion');
  document.body.classList.toggle('presentacion', on);
  try {
    if (on) document.documentElement.requestFullscreen?.();
    else if (document.fullscreenElement) document.exitFullscreen?.();
  } catch {}
}
document.getElementById('salirPresent').addEventListener('click', togglePresentacion);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('presentacion') && !modalRoot.innerHTML) togglePresentacion();
});

document.getElementById('azRail').addEventListener('click', e => {
  const b = e.target.closest('[data-az]'); if (!b) return;
  saltarALetra(b.dataset.az);
});
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('statsBtn').addEventListener('click', openStats);
document.getElementById('setBtn').addEventListener('click', openSettings);

/* Sin esto, cada tecla del buscador filtra y reordena el vault entero. Con una
   pausa corta se pinta cuando dejas de escribir, no siete veces por palabra. */
let _teclaBusqueda = null;
document.getElementById('homeBtn').addEventListener('click', () =>
  irAPantalla(PREFS.pantalla === 'inicio' ? 'lista' : 'inicio'));
document.getElementById('logoHome').addEventListener('click', () => irAPantalla('inicio'));

document.getElementById('inicio').addEventListener('click', e => {
  /* Los mosaicos llevan al vault ya filtrado: tocar "Pendientes" es lo mismo
     que entrar en la lista y elegir ese filtro, en un solo gesto. */
  const tile = e.target.closest('[data-ira]');
  if (tile) {
    const d = tile.dataset.ira;
    PREFS.type = 'all'; PREFS.genre = 'all'; PREFS.decade = 'all'; PREFS.dur = 'all';
    PREFS.status = d === 'sintag' ? 'all' : d;
    PREFS.tag = d === 'sintag' ? 'none' : 'all';
    document.getElementById('q').value = '';
    irAPantalla('lista');
    return;
  }
  const acc = e.target.closest('[data-acc]');
  if (acc) {
    const a = acc.dataset.acc;
    if (a === 'buscar') openSearch();
    else if (a === 'pegar') openBulk();
    else if (a === 'azar') shuffle();
    else if (a === 'stats') openStats();
    else if (a === 'lote') { irAPantalla('lista'); setSelMode(true); }
    return;
  }
  const carp = e.target.closest('[data-carp]');
  if (carp) { alternar(CARPETAS_ABIERTAS, carp.dataset.carp, carp, 'data-carp'); return; }
  const tg = e.target.closest('[data-tag2]');
  if (tg) { alternar(TAGS_ABIERTAS, tg.dataset.tag2, tg, 'data-tag2'); return; }
  const vertag = e.target.closest('[data-vertag]');
  if (vertag) {
    PREFS.tag = vertag.dataset.vertag; PREFS.status = 'all'; PREFS.type = 'all';
    PREFS.genre = 'all'; PREFS.decade = 'all'; PREFS.dur = 'all';
    irAPantalla('lista');
    return;
  }
  const art = e.target.closest('[data-art]');
  if (art) { alternar(ARTISTAS_ABIERTOS, art.dataset.art, art, 'data-art'); return; }
  const abrir = e.target.closest('[data-abrir]');
  if (abrir) { openDetail(abrir.dataset.abrir); return; }
  if (e.target.closest('[data-masart]')) { VISTOS_ARTISTAS += 120; renderInicio(); }
});

document.getElementById('q').addEventListener('input', () => {

  _teclaBusqueda = setTimeout(render, 160);
});
document.getElementById('sortSel').addEventListener('change', e => { PREFS.sort = e.target.value; savePrefs(); render(); });
document.getElementById('viewBtn').addEventListener('click', () => { PREFS.view = PREFS.view === 'grid' ? 'list' : 'grid'; savePrefs(); render(); });

document.querySelector('.state-strip').addEventListener('click', e => {
