<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MusicVault">
<meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="musicvault.webmanifest">
<title>MusicVault</title>
<style>
  :root {
    color-scheme: light;
    /* Alto que tapa el teclado en iOS ahora mismo (lo actualiza JS con visualViewport).
       position:fixed se ancla al viewport de LAYOUT, que no encoge con el teclado;
       esta variable es lo que permite compensarlo a mano. */
    --kb: 0px;
    /* neutrales con sesgo cálido, no gris puro */
    --bg:        #f7f2e9;
    --surface:   #fffdf8;
    --surface-2: #efe8db;
    --line:      rgba(26,20,14,0.11);
    --line-firm: rgba(26,20,14,0.20);
    --fg:        #1a140e;
    --fg-soft:   #5d5346;
    --fg-mute:   #726858;
    --amber:     #a3690f;
    --amber-soft:#f0e0c2;
    --on-amber:  #fffdf8;
    --jade:      #14795c;
    --jade-soft: #d5e9e0;
    --rust:      #b03f30;
    --shadow-sm: 0 1px 2px rgba(26,20,14,0.06), 0 4px 12px rgba(26,20,14,0.06);
    --shadow-md: 0 2px 6px rgba(26,20,14,0.10), 0 12px 28px rgba(26,20,14,0.12);
    --shadow-lg: 0 -4px 40px rgba(26,20,14,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:        #14100d;
      --surface:   #1e1915;
      --surface-2: #2a231d;
      --line:      rgba(247,242,233,0.10);
      --line-firm: rgba(247,242,233,0.20);
      --fg:        #f5efe4;
      --fg-soft:   #b8ab99;
      --fg-mute:   #948877;
      --amber:     #e0a03a;
      --amber-soft:#3a2c15;
      --on-amber:  #1a140e;
      --jade:      #46b491;
      --jade-soft: #14312a;
      --rust:      #e0705e;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg: 0 -4px 40px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:        #14100d;
    --surface:   #1e1915;
    --surface-2: #2a231d;
    --line:      rgba(247,242,233,0.10);
    --line-firm: rgba(247,242,233,0.20);
    --fg:        #f5efe4;
    --fg-soft:   #b8ab99;
    --fg-mute:   #948877;
    --amber:     #e0a03a;
    --amber-soft:#3a2c15;
    --on-amber:  #1a140e;
    --jade:      #46b491;
    --jade-soft: #14312a;
    --rust:      #e0705e;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    --shadow-lg: 0 -4px 40px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- command bar ---------- */
  .cmdbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .wordmark { display:flex; align-items:center; gap:9px; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .wordmark .disc { width:19px; height:19px; flex-shrink:0; }
  /* en pantallas estrechas el disco basta como identidad; el espacio va a los controles */
  @media (max-width: 419px) { .wordmark .wm-text { display: none; } }
  .cmd-actions { display:flex; gap: 7px; }
  .iconbtn {
    display:flex; align-items:center; justify-content:center;
    width: 38px; height: 38px; border-radius: 11px; flex-shrink:0;
    background: var(--surface); border: 1px solid var(--line); color: var(--fg);
    font-size: 16px; cursor: pointer; transition: background .15s, transform .1s;
    position: relative;
  }
  /* 38px se ve bien pero se falla al pulsar; esto lleva la zona táctil a 44 */
  .iconbtn::after { content:""; position:absolute; inset:-3px; border-radius:14px; }
  .iconbtn:hover { background: var(--surface-2); }
  .iconbtn:active { transform: scale(0.94); }
  .iconbtn.accent { background: var(--amber); border-color: transparent; color: var(--on-amber); }
  /* el enlace de vuelta al índice: mismo botón, sin subrayado ni color de enlace */
  .backbtn { text-decoration: none; font-size: 18px; line-height: 1; }
  .backbtn:visited { color: var(--fg); }

  .shell { max-width: 1080px; margin: 0 auto; padding: 0 14px; }

  /* ---------- vault state strip ---------- */
  .state-strip { display:grid; grid-template-columns: repeat(4, 1fr); gap: 9px; padding: 16px 0 4px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 10px; cursor: pointer; text-align:left; font-family: inherit; color: inherit;
    transition: border-color .15s, background .15s;
  }
  .stat:hover { background: var(--surface-2); }
  .stat.active { border-color: var(--amber); background: var(--amber-soft); }
  .stat .n { font-family: Georgia, serif; font-size: 23px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat.pending .n { color: var(--amber); }
  .stat.done .n { color: var(--jade); }
  .stat.archived .n { color: var(--fg-mute); }
  .stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-mute); margin-top: 5px; font-family: ui-monospace, monospace; line-height: 1.25; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: calc(58px + env(safe-area-inset-top)); z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 10px 0 9px; margin-top: 12px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar-row { display:flex; gap: 8px; align-items:center; }
  .searchwrap { position: relative; flex: 1 1 auto; min-width: 0; }
  .searchwrap .mag { position:absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--fg-mute); pointer-events:none; }
  .searchwrap input {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 12px 9px 31px;
  }
  .searchwrap input::placeholder { color: var(--fg-mute); }
  select.ctl {
    font-family: inherit; font-size: 13px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 8px; max-width: 45vw;
  }
  .chiprow { display:flex; gap: 6px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    display:flex; align-items:center; gap:5px; flex-shrink: 0;
    font-family: inherit; font-size: 12.5px; color: var(--fg-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  /* el chip mide 30px de alto: se ve bien pero se falla mucho con el dedo.
     El pseudoelemento amplía la zona sensible sin cambiar el aspecto. */
  .chip { position: relative; }
  .chip::after { content:""; position:absolute; inset:-7px -2px; border-radius:999px; }
  .chip:hover { background: var(--surface-2); }
  .chip.on { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .chip .ct { font-size: 10.5px; opacity: .65; font-variant-numeric: tabular-nums; }

  /* ---------- content ---------- */
  .content { padding: 16px 0 110px; }
  .resultline { font-size: 11.5px; color: var(--fg-mute); font-family: ui-monospace, monospace; margin-bottom: 11px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .linkbtn { background:none; border:none; font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--amber); cursor:pointer; padding:0; text-decoration: underline; text-underline-offset: 2px; }

  .group + .group { margin-top: 22px; }
  .ghead {
    display:flex; align-items:baseline; gap: 9px; margin: 0 0 10px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--fg-soft); font-family: ui-monospace, monospace;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
    position: sticky; top: calc(158px + env(safe-area-inset-top)); z-index: 10;
    background: var(--bg);
  }
  .ghead .gcount { font-size: 10.5px; color: var(--fg-mute); font-weight: 500; }

  .grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .gcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
    overflow: hidden; cursor: pointer; position: relative;
    box-shadow: var(--shadow-sm); transition: transform .12s, box-shadow .15s, border-color .15s;
  }
  .gcard:active { transform: scale(0.975); }
  @media (hover: hover) { .gcard:hover { box-shadow: var(--shadow-md); } }
  .gcard.sel { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber); }
  .gcard .art { position: relative; aspect-ratio: 1; background: var(--surface-2); display:flex; align-items:center; justify-content:center; }
  .gcard .art img { width:100%; height:100%; object-fit: cover; display:block; transition: opacity .2s, filter .2s; }
  .gcard.done .art img { opacity: .5; filter: saturate(.55); }
  .gcard .art .ph { font-size: 30px; opacity: .3; }
  .gcard .gbody { padding: 9px 11px 11px; }
  .gcard .gt { font-size: 13px; font-weight: 650; line-height: 1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gcard .ga { font-size: 11.5px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top: 2px; }
  .gcard .gmeta { display:flex; align-items:center; gap: 5px; margin-top: 7px; min-height: 15px; }

  .statusdot {
    position:absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; cursor: pointer; z-index: 2;
    font-size: 12px; font-weight: 800; line-height: 1;
    background: rgba(20,16,13,0.55); border: 1.5px solid rgba(255,255,255,0.75); color: #fff;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: transform .12s;
  }
  .statusdot:active { transform: scale(0.88); }
  .statusdot.on { background: var(--jade); border-color: var(--jade); }
  /* el círculo se ve de 24px pero se toca en 44px */
  .statusdot::after { content:''; position:absolute; inset:-10px; border-radius: 50%; }
  .typetag {
    position:absolute; top: 8px; right: 8px; z-index: 2;
    font-size: 11px; font-family: ui-monospace, monospace; letter-spacing: 0.04em;
    padding: 3px 7px; border-radius: 6px; color: #fff;
    background: rgba(20,16,13,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .stars { font-size: 12px; color: var(--amber); letter-spacing: -0.5px; }
  .tagpip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* list view */
  .list { display:flex; flex-direction: column; gap: 7px; }
  .lrow {
    display:flex; align-items:center; gap: 11px; cursor: pointer; position: relative;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 12px 8px 8px; overflow: hidden;
    transition: background .13s, border-color .15s;
  }
  .lrow::before { content:''; position:absolute; left:0; top:0; bottom:0; width: 3px; background: var(--amber); }
  .lrow.done::before { background: var(--jade); }
  .lrow:hover { background: var(--surface-2); }
  .lrow.sel { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  .lrow .lart { width: 46px; height: 46px; border-radius: 8px; flex-shrink:0; overflow:hidden; background: var(--surface-2); display:flex; align-items:center; justify-content:center; margin-left: 4px; }
  .lrow .lart img { width:100%; height:100%; object-fit:cover; }
  .lrow.done .lart img { opacity:.5; filter: saturate(.55); }
  .lrow .linfo { flex: 1; min-width: 0; }
  .lrow .lt { font-size: 14px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .la { font-size: 12px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .lmeta { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .lrow .lyear { font-size: 11px; color: var(--fg-mute); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .lcheck {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink:0; cursor:pointer; position: relative;
    display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 800;
    background: transparent; border: 1.5px solid var(--line-firm); color: transparent;
  }
  .lcheck::after { content:''; position:absolute; inset:-9px; border-radius: 50%; }
  .lcheck.on { background: var(--jade); border-color: var(--jade); color: #fff; }

  /* ---------- empty ---------- */
  .empty { text-align:center; padding: 64px 22px; }
  .empty .ico { font-size: 34px; opacity: .4; margin-bottom: 14px; }
  .empty h2 { font-size: 16.5px; margin: 0 0 6px; font-weight: 650; }
  .empty p { font-size: 13.5px; color: var(--fg-mute); margin: 0 auto; max-width: 34ch; line-height: 1.5; }
  .empty .acts { display:flex; gap: 9px; justify-content:center; margin-top: 18px; flex-wrap: wrap; }

  /* ---------- buttons ---------- */
  .btn {
    font-family: inherit; font-size: 14px; font-weight: 550; text-align:center; text-decoration:none;
    padding: 11px 16px; border-radius: 12px; cursor:pointer; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); display:inline-flex; align-items:center; justify-content:center; gap: 7px;
    transition: transform .1s, background .15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--amber); color: var(--on-amber); border-color: transparent; font-weight: 650; }
  .btn.jade { background: var(--jade); color: #fff; border-color: transparent; font-weight: 650; }
  .btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 45%, transparent); background: transparent; }
  .btn.vermas { display: block; width: 100%; margin: 18px 0 4px; padding: 14px; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btnrow { display:flex; gap: 9px; margin-top: 12px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom) + var(--kb, 0px)); z-index: 35;
    height: 54px; padding: 0 20px; border-radius: 27px; border:none; cursor:pointer;
    background: var(--amber); color: var(--on-amber);
    font-family: inherit; font-size: 15px; font-weight: 650;
    display:flex; align-items:center; gap: 8px;
    box-shadow: 0 6px 20px color-mix(in srgb, var(--amber) 45%, transparent);
    transition: transform .12s;
  }
  .fab:active { transform: scale(0.94); }

  /* ---------- selection action bar ---------- */
  .selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); box-shadow: var(--shadow-lg);
    display:flex; align-items:center; gap: 8px;
    /* con 5 botones (contador + escuchado + etiquetar + archivar + eliminar +
       cancelar) puede no caber entero en un iPhone pequeño: mejor que se
       deslice a que se aplaste o se salga de la pantalla */
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .selbar::-webkit-scrollbar { display: none; }
  .selbar .cnt { font-size: 13px; font-weight: 650; margin-right: auto; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .selbar .btn { padding: 9px 13px; font-size: 13px; flex-shrink: 0; white-space: nowrap; }

  /* ---------- sheets / modals ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(10,7,5,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { transform: translateY(18px); opacity: .6 } to { transform: none; opacity: 1 } }
  @media (min-width: 640px) { .overlay { align-items:center; } }
  .sheet {
    background: var(--bg); width: 100%; max-width: 540px; overflow-y: auto;
    /* min() con --kb: si el teclado está tapando parte de la pantalla, el hueco
       útil se reduce para que el contenido de abajo (el último botón, sobre
       todo) quede siempre por encima del teclado y no oculto detrás. */
    max-height: min(90vh, calc(100vh - var(--kb, 0px) - 12px));
    border-radius: 22px 22px 0 0; padding: 18px 18px calc(26px + env(safe-area-inset-bottom) + var(--kb, 0px));
    border: 1px solid var(--line); border-bottom: none;
    animation: rise .2s cubic-bezier(.2,.8,.3,1);
  }
  @media (min-width: 640px) { .sheet { border-radius: 20px; max-height: min(86vh, calc(100vh - var(--kb, 0px) - 12px)); border-bottom: 1px solid var(--line); } }
  .sheethead { display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-bottom: 14px; }
  .sheethead h2 { font-size: 17px; margin:0; font-weight: 680; }
  .lede { font-size: 13px; color: var(--fg-mute); margin: 0 0 13px; line-height: 1.5; }
  .lede a { color: var(--amber); }
  .flabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-mute); font-family: ui-monospace, monospace; margin: 18px 0 7px; }
  .flabel:first-child { margin-top: 0; }

  .field {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px;
  }
  textarea.field { min-height: 76px; resize: vertical; line-height: 1.5; }
  textarea.field.tall { min-height: 150px; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .field.mono { font-family: ui-monospace, monospace; font-size: 12.5px; }

  .segrow { display:flex; gap: 6px; margin-bottom: 13px; }
  .seg {
    flex: 1; font-family: inherit; font-size: 13px; color: var(--fg-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; cursor:pointer;
    transition: background .15s, color .15s;
  }
  .seg.on { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }

  /* search results */
  .rrow { display:flex; gap: 11px; align-items:center; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .rrow:last-child { border-bottom: none; }
  .rrow .rart { width: 48px; height: 48px; border-radius: 8px; background: var(--surface-2); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size: 17px; }
  .rrow .rart img { width:100%; height:100%; object-fit:cover; }
  .rrow .rinfo { flex:1; min-width:0; }
  .rrow .rt { font-size: 13.5px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .ra { font-size: 12px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .addbtn {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0; cursor:pointer;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--fg);
    font-size: 17px; font-weight: 500; display:flex; align-items:center; justify-content:center;
    transition: transform .1s;
  }
  .addbtn:active { transform: scale(0.9); }

<script>
'use strict';

/* ============ storage ============ */
const K_ITEMS = 'musicvault_items_v1';
const K_TAGS  = 'musicvault_tags_v1';
const K_CREDS = 'musicvault_spotify_creds_v1';
const K_PREFS = 'musicvault_prefs_v1';
const K_THEME = 'musicvaultTheme';
const K_GH    = 'musicvault_github_v1';   // token + repo de sincronización
const K_TOMB  = 'musicvault_tomb_v1';     // borrados pendientes de propagar
const K_META  = 'musicvault_meta_v1';     // marca de tiempo del vault local

const read = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch { return fb; } };
const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* El vault vive en IndexedDB: localStorage se queda en ~5 MB (y cuenta UTF-16),
   que con miles de álbumes se agota enseguida. Ajustes/tema/credenciales siguen
   en localStorage porque son cuatro claves y conviene leerlas de forma síncrona. */
const DB_NAME = 'musicvault', DB_STORE = 'kv';
let _db = null, _sinIDB = false;

function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    if (!self.indexedDB) return rej(new Error('sin indexedDB'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE);
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
const idbGet = k => idb().then(db => new Promise((res, rej) => {
  const q = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
}));
const idbSet = (k, v) => idb().then(db => new Promise((res, rej) => {
  const t = db.transaction(DB_STORE, 'readwrite');
  t.objectStore(DB_STORE).put(v, k);
  t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
}));

let ITEMS = [];
let TAGS  = [];
let PREFS = Object.assign({ sort: 'added_desc', view: 'grid', type: 'all', status: 'all', tag: 'all', genre: 'all', decade: 'all', covers: false }, read(K_PREFS, {}));

/* Al borrar algo hay que dejar constancia: si no, el otro dispositivo lo
   vuelve a subir en la siguiente sincronización y el borrado "revive". */
let TOMB = read(K_TOMB, []);
let META = Object.assign({ updatedAt: 0 }, read(K_META, {}));
/* Un borrado masivo genera decenas de miles de tumbas. Si se recortan demasiado
   pronto, el otro dispositivo no se entera de esos borrados y los resucita en la
   siguiente sincronización. Se deduplica por id (vale la más reciente) y el tope
   se deja alto: 30.000 tumbas ocupan ~1,5 MB, que GitHub asume sin problema. */
const TOPE_TUMBAS = 30000;
function podarTumbas() {
  const ultima = new Map();
  for (const t of TOMB) {
    if (!t || !t.sid) continue;
    const prev = ultima.get(t.sid);
    if (prev === undefined || t.at > prev) ultima.set(t.sid, t.at);
  }
  TOMB = [...ultima].map(([sid, at]) => ({ sid, at }))
                    .sort((a, b) => a.at - b.at)
                    .slice(-TOPE_TUMBAS);
  return TOMB;
}
const saveTomb = () => write(K_TOMB, podarTumbas());
const saveMeta = () => write(K_META, META);
function tombstone(items) {
  const at = Date.now();
  items.forEach(it => { if (it && it.spotifyId) TOMB.push({ sid: it.spotifyId, at }); });
  saveTomb();
}
function untombstone(items) {   // al deshacer un borrado
  const sids = new Set(items.map(i => i && i.spotifyId).filter(Boolean));
  TOMB = TOMB.filter(t => !sids.has(t.sid));
  saveTomb();
}

/* Escrituras agrupadas: al importar miles de elementos no queremos una
   transacción por cada uno. */
let _pend = null;
function _flush(k, get) {
  if (_sinIDB) { try { write(k, get()); } catch (e) { toast('No cabe en el almacenamiento del navegador'); } return; }
  idbSet(k, get()).catch(() => toast('No se ha podido guardar'));
}
function saveItems() {
  META.updatedAt = Date.now(); saveMeta();
  clearTimeout(_pend);
  _pend = setTimeout(() => _flush(K_ITEMS, () => ITEMS), 120);
  programarSync();
}
const saveTags  = () => _flush(K_TAGS, () => TAGS);
const savePrefs = () => write(K_PREFS, PREFS);
const loadCreds = () => read(K_CREDS, null);

/* Carga inicial + migración desde localStorage la primera vez. */
async function bootStorage() {
  try {
    const [i, t] = await Promise.all([idbGet(K_ITEMS), idbGet(K_TAGS)]);
    if (Array.isArray(i)) ITEMS = i;
    if (Array.isArray(t)) TAGS = t;
    if (!Array.isArray(i)) {
      const li = read(K_ITEMS, []), lt = read(K_TAGS, []);
      if (li.length || lt.length) {
        ITEMS = li; TAGS = lt;
        await idbSet(K_ITEMS, ITEMS); await idbSet(K_TAGS, TAGS);
      }
    }
  } catch {
    _sinIDB = true;
    ITEMS = read(K_ITEMS, []);
    TAGS  = read(K_TAGS, []);
  }
}

/* ============ helpers ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const TYPE_LABEL = { album: 'Álbum', track: 'Canción', artist: 'Artista', playlist: 'Playlist' };
const TYPE_PLURAL = { album: 'Álbumes', track: 'Canciones', artist: 'Artistas', playlist: 'Playlists' };
const TYPE_ICON  = { album: '💿', track: '🎵', artist: '🎤', playlist: '📑' };
const TAG_COLORS = ['#2a78d6','#1baf7a','#eda100','#3f9c35','#7a5cd6','#e34948','#e87ba4','#eb6834'];
const artistsOf = it => (it.artists || []).join(', ');
/* Con las carátulas desactivadas el vault se lee como una lista, no como una
   pared de discos. Es una preferencia, no un borrado: se vuelve a activar en Ajustes. */
const verPortada = () => PREFS.covers !== false;
const portada = (url, icono, lazy) =>
  (verPortada() && url) ? `<img src="${esc(url)}" ${lazy ? 'loading="lazy" ' : ''}alt="">` : icono;
// Buscar "camaron" tiene que encontrar "Camarón".
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const yearOf = it => (it.releaseDate ? parseInt(String(it.releaseDate).slice(0, 4), 10) : 0) || 0;
// Para ordenar como una discoteca de verdad: "The Beatles" va por la B.
const sortKey = s => String(s || '').toLowerCase().replace(/^(the|los|las|el|la|a|an)\s+/, '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
const cmp = (a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' });
const tagById = id => TAGS.find(t => t.id === id);

/* ============ theme ============ */
(() => {
  const root = document.documentElement;
  const saved = localStorage.getItem(K_THEME);
  if (saved) root.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem(K_THEME, next);
  });
})();

/* ============ teclado en iOS ============
   Cuando aparece el teclado, Safari en iPhone no encoge el viewport de LAYOUT
   (el que usan los position:fixed) — solo el visual. El FAB "＋ Añadir" y el
   último botón de cada hoja se quedaban por tanto tapados detrás del teclado,
   aunque siguieran "ahí" según el CSS. visualViewport sí conoce el hueco real
   que deja libre el teclado, así que se usa para levantar esos elementos. */
function ajustarPorTeclado() {
  const vv = window.visualViewport;
  if (!vv) return;
  const solape = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', solape + 'px');
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', ajustarPorTeclado);
  visualViewport.addEventListener('scroll', ajustarPorTeclado);
  ajustarPorTeclado();
}

/* ============ toasts ============ */
function toast(msg, actionLabel, actionFn, ms = 5000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tmsg">${esc(msg)}</span>`;
  if (actionLabel) {
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.addEventListener('click', () => { actionFn(); el.remove(); });
    el.appendChild(b);
  }
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ============ spotify ============
   Desde febrero de 2026 Spotify cerró el acceso de Client Credentials (app
   sola, sin usuario) a los datos de catálogo para apps en modo desarrollo:
   https://developer.spotify.com/documentation/web-api/references/changes/february-2026
   La única vía que sigue funcionando es Authorization Code con PKCE: el
   usuario inicia sesión de verdad en Spotify y la app actúa en su nombre.
   PKCE no usa Client Secret — es un flujo pensado para apps sin servidor
   propio, así que sigue siendo seguro pegar solo el Client ID aquí. */
const REDIRECT_URI = location.origin + location.pathname;
const K_PKCE = 'musicvault_pkce_v1';   // verifier+state durante la ida y vuelta a Spotify

function b64url(bytes) {
  let bin = '';
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randomToken(nBytes) {
  const arr = new Uint8Array(nBytes);
  crypto.getRandomValues(arr);
  return b64url(arr);
}
async function pkceChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64url(digest);
}

function isConnected() { const c = loadCreds(); return !!(c && c.refreshToken); }

/* Con permiso vacío, Spotify solo deja ver catálogo público: un álbum, un
   artista o una playlist marcada como pública. Una playlist personal que no
   hayas puesto en público (la mayoría, por defecto) daba 403 al leerla o
   guardarla. Estos dos permisos son de solo lectura y piden exactamente eso,
   nada de escritura ni datos que no sean playlists:
   https://developer.spotify.com/documentation/web-api/concepts/scopes */
const SPOTIFY_SCOPE = 'playlist-read-private playlist-read-collaborative';

/* Manda al usuario a la pantalla de login real de Spotify. Al volver, Spotify
   añade ?code=...&state=... a esta misma URL (por eso hace falta registrar
   esta página exacta como Redirect URI en el Developer Dashboard). */
async function beginSpotifyLogin() {
  const c = loadCreds();
  if (!c || !c.clientId) { toast('Pon primero el Client ID en Ajustes'); return; }
  const verifier = randomToken(64);
  const state = randomToken(16);
  sessionStorage.setItem(K_PKCE, JSON.stringify({ verifier, state }));
  const challenge = await pkceChallenge(verifier);
  const params = new URLSearchParams({
    client_id: c.clientId, response_type: 'code', redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256', code_challenge: challenge, state, scope: SPOTIFY_SCOPE
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

/* Se llama al arrancar la página. Si venimos de vuelta del login de Spotify,
   la URL trae ?code=... (o ?error=...): hay que completarlo antes de pintar
   nada, y limpiar la URL en cualquier caso para no dejar el code a la vista
   ni reprocesarlo si se recarga la página. */
async function handleSpotifyRedirect() {
  const qs = new URLSearchParams(location.search);
  const code = qs.get('code'), state = qs.get('state'), err = qs.get('error');
  if (!code && !err) return;
  history.replaceState({}, '', location.pathname);
  if (err) { toast('Spotify: ' + err); return; }

  let guardado = null;
  try { guardado = JSON.parse(sessionStorage.getItem(K_PKCE) || 'null'); } catch {}
  sessionStorage.removeItem(K_PKCE);
  if (!guardado || state !== guardado.state) {
    toast('La conexión con Spotify no se pudo verificar. Vuelve a intentarlo.');
    return;
  }
  const c = loadCreds();
  if (!c || !c.clientId) { toast('Falta el Client ID en Ajustes.'); return; }
  try {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI,
        client_id: c.clientId, code_verifier: guardado.verifier
      })
    });
    if (!res.ok) throw new Error('' + res.status);
    const d = await res.json();
    write(K_CREDS, {
      clientId: c.clientId, accessToken: d.access_token,
      refreshToken: d.refresh_token, expiresAt: Date.now() + (d.expires_in - 60) * 1000,
      scope: d.scope || ''   // permisos que Spotify concedió de verdad, para saber si faltan
    });
    toast('Conectado con Spotify');
  } catch (e) {
    toast('No se pudo completar la conexión con Spotify (' + (e.message || 'error') + ').');
  }
}

function disconnectSpotify() {
  const c = loadCreds();
  if (c) write(K_CREDS, { clientId: c.clientId });   // conserva el Client ID, olvida la sesión
  toast('Desconectado de Spotify');
}

async function spotifyToken() {
  const c = loadCreds();
  if (!c || !c.refreshToken) throw new Error('NO_CREDS');
  if (c.accessToken && c.expiresAt > Date.now()) return c.accessToken;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: c.refreshToken, client_id: c.clientId })
  });
  if (!res.ok) throw new Error('AUTH_FAILED');
  const d = await res.json();
  const fresco = {
    clientId: c.clientId, accessToken: d.access_token,
    refreshToken: d.refresh_token || c.refreshToken,   // Spotify no siempre rota el refresh token
    expiresAt: Date.now() + (d.expires_in - 60) * 1000,
    scope: d.scope || c.scope || ''   // al refrescar no siempre viene: se conserva el que ya había
  };
  write(K_CREDS, fresco);
  return fresco.accessToken;
}

/* Un token pedido antes de añadir un permiso nuevo (por ejemplo, leer
   playlists privadas) sigue teniendo SOLO los permisos con los que se pidió
   la primera vez — cambiar el código no se lo da con carácter retroactivo.
   Esto detecta esa situación para avisar de que hay que reconectar, en vez
   de dejar que Spotify devuelva un 403 sin explicación. */
function tieneScopePlaylists() {
  const c = loadCreds();
  if (!c || !c.scope) return false;
  const got = new Set(c.scope.split(' ').filter(Boolean));
  return SPOTIFY_SCOPE.split(' ').every(s => got.has(s));
}

/* Búsquedas de sobra en poco tiempo (escribir rápido, o un rato largo de uso
   seguido) pueden toparse con el límite de peticiones de Spotify (429). Antes
   se enseñaba tal cual "Spotify devolvió un error 429"; ahora se reintenta
   solo, respetando el Retry-After que manda Spotify (con un tope para no
   dejar la búsqueda colgada), y solo si sigue fallando se avisa. */
async function fetchConReintento429(url, token, intentos = 3) {
  let res;
  for (let i = 0; i < intentos; i++) {
    res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    if (res.status !== 429 || i === intentos - 1) return res;
    const espera = Math.min(+res.headers.get('Retry-After') || 1, 4) * 1000;
    await new Promise(r => setTimeout(r, espera));
  }
  return res;
}

async function spotifySearch(q, type, offset = 0) {
  const t = await spotifyToken();
  // el límite máximo bajó de 50 a 10 en el cambio de febrero de 2026; para ver
  // más de 10 hay que pedir páginas sucesivas con offset (ver cargarMasResultados)
  const res = await fetchConReintento429(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=${type}&limit=10&offset=${offset}`, t);
  if (res.status === 429) throw new Error('RATE_LIMIT');
  if (!res.ok) throw new Error('SEARCH_FAILED:' + res.status);
  return res.json();
}

async function spotifyLookup(type, id) {
  const t = await spotifyToken();
  const res = await fetchConReintento429(`https://api.spotify.com/v1/${type}s/${id}`, t);
  if (res.status === 429) throw new Error('RATE_LIMIT');
  if (!res.ok) throw new Error('LOOKUP_FAILED:' + res.status);
  return res.json();
}

/* Las llamadas "varias a la vez" (GET /albums?ids=, /tracks?ids=, /artists?ids=)
   se eliminaron en el cambio de febrero de 2026 — solo queda pedir uno a uno:
   https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide
   Esto los pide con una concurrencia pequeña (5 a la vez) para no tardar una
   eternidad con listas largas. Si falla por credenciales, PARA TODO en vez de
   contarlo como fallos sueltos (si el token no vale, el siguiente tampoco). */
async function fetchItemsIndividually(tipo, ids, onProgress, shouldStop) {
  const CONCURRENCIA = 5;
  const resultados = new Array(ids.length).fill(null);
  let hechos = 0, i = 0, pararTodo = null;

  async function trabajador() {
    while (i < ids.length && !pararTodo) {
      if (shouldStop && shouldStop()) return;
      const mio = i++;
      for (let intento = 0; intento < 4; intento++) {
        let t;
        try { t = await spotifyToken(); }
        catch (e) { pararTodo = e; return; }
        let res;
        try {
          res = await fetch(`https://api.spotify.com/v1/${tipo}s/${ids[mio]}`, { headers: { Authorization: 'Bearer ' + t } });
        } catch { break; }   // fallo de red puntual: cuenta como fallo de este elemento, no para todo
        if (res.status === 429 && intento < 3) {
          await new Promise(r => setTimeout(r, (+res.headers.get('Retry-After') || 2) * 1000));
          continue;
        }
        if (res.status === 401 || res.status === 403) { pararTodo = new Error('AUTH_FAILED'); return; }
        if (res.ok) resultados[mio] = await res.json();
        break;
      }
      hechos++;
      if (onProgress) onProgress(hechos, ids.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCIA, ids.length) }, trabajador));
  if (pararTodo) throw pararTodo;
  return resultados;
}

const URL_ONE = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(album|track|artist)\/([a-zA-Z0-9]+)/i;
const URL_ALL = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(album|track|artist)\/([a-zA-Z0-9]+)/gi;
const URL_PLAYLIST = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?playlist\/([a-zA-Z0-9]+)/gi;
const URL_PLAYLIST_ONE = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?playlist\/([a-zA-Z0-9]+)/i;

/* Trae hasta 500 canciones de una playlist pública, paginando de 100 en 100. */
async function fetchPlaylist(id, onProgress) {
  const t = await spotifyToken();
  const fields = 'items(track(id,name,external_urls,artists(name),duration_ms,album(id,name,images,release_date,external_urls,artists(name),total_tracks))),total';
  let out = [], offset = 0, total = null;
  while (offset < 500) {
    const res = await fetchConReintento429(`https://api.spotify.com/v1/playlists/${id}/tracks?limit=100&offset=${offset}&fields=${encodeURIComponent(fields)}`, t);
    if (res.status === 429) throw new Error('RATE_LIMIT');
    if (!res.ok) throw new Error('PLAYLIST_FAILED:' + res.status);
    const d = await res.json();
    if (total === null) total = d.total;
    const batch = (d.items || []).map(i => i && i.track).filter(x => x && x.id);
    out = out.concat(batch);
    onProgress?.(out.length, Math.min(total, 500));
    offset += 100;
    if (offset >= total || !batch.length) break;
  }
  return out;
}

/* Datos ligeros de la playlist en sí (nombre, portada, dueño, nº de canciones),
   para poder guardarla como un marcador — sin traer sus canciones. */
async function fetchPlaylistMeta(id) {
  const t = await spotifyToken();
  const fields = 'id,name,images,owner(display_name),external_urls,tracks.total';
  const res = await fetchConReintento429(`https://api.spotify.com/v1/playlists/${id}?fields=${encodeURIComponent(fields)}`, t);
  if (res.status === 429) throw new Error('RATE_LIMIT');
  if (!res.ok) throw new Error('PLAYLIST_FAILED:' + res.status);
  return res.json();
}

/* Captura todos los metadatos que venga trayendo el objeto de Spotify.
   Los endpoints de búsqueda devuelven objetos simplificados; "Actualizar desde
   Spotify" en la ficha vuelve a pedir el objeto completo (sello, popularidad, géneros…). */
function normalize(raw, type) {
  const base = {
    spotifyId: raw.id, type, title: raw.name,
    coverUrl: null, spotifyUrl: raw.external_urls?.spotify || '', releaseDate: null,
    albumName: null, albumId: null, durationMs: null, totalTracks: null, label: null,
    popularity: typeof raw.popularity === 'number' ? raw.popularity : null,
    genres: raw.genres?.length ? raw.genres : null,
    followers: raw.followers?.total ?? null,
    explicit: null, trackNumber: null, discNumber: null, albumType: null, isrc: null
  };

  if (type === 'album') return Object.assign(base, {
    artists: (raw.artists || []).map(a => a.name),
    coverUrl: raw.images?.[0]?.url || null,
    releaseDate: raw.release_date || null,
    totalTracks: raw.total_tracks ?? null,
    label: raw.label || null,
    albumType: raw.album_type || null
  });

  if (type === 'track') return Object.assign(base, {
    artists: (raw.artists || []).map(a => a.name),
    coverUrl: raw.album?.images?.[0]?.url || null,
    releaseDate: raw.album?.release_date || null,
    albumName: raw.album?.name || null,
    albumId: raw.album?.id || null,
    albumType: raw.album?.album_type || null,
    totalTracks: raw.album?.total_tracks ?? null,
    durationMs: raw.duration_ms ?? null,
    explicit: typeof raw.explicit === 'boolean' ? raw.explicit : null,
    trackNumber: raw.track_number ?? null,
    discNumber: raw.disc_number ?? null,
    isrc: raw.external_ids?.isrc || null
  });

  if (type === 'playlist') return Object.assign(base, {
    artists: raw.owner?.display_name ? [raw.owner.display_name] : [],
    coverUrl: raw.images?.[0]?.url || null,
    totalTracks: raw.tracks?.total ?? null
  });

  return Object.assign(base, {
    artists: [raw.name],
    coverUrl: raw.images?.[0]?.url || null
  });
}

function makeItem(r) {
  return Object.assign({}, r, {
    id: uid(), dateAdded: Date.now(), notes: '', rating: 0, tagIds: [], listened: false
  });
}

/* ---- formateo de metadatos ---- */
const fmtDur = ms => ms ? Math.floor(ms / 60000) + ':' + String(Math.round(ms % 60000 / 1000)).padStart(2, '0') : null;
function fmtDate(d) {
  if (!d) return null;
  const p = String(d).split('-');
  if (p.length === 1) return p[0];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return p.length === 2 ? `${meses[+p[1] - 1]} ${p[0]}` : `${+p[2]} ${meses[+p[1] - 1]} ${p[0]}`;
}
const ALBUM_TYPE_ES = { album: 'Álbum', single: 'Single', compilation: 'Recopilatorio' };

/* Lista completa de metadatos de una ficha, en pares etiqueta/valor. */
function metaPairs(it) {
  const p = [];
  const add = (k, v) => { if (v !== null && v !== undefined && v !== '') p.push([k, v]); };
  add('Tipo', TYPE_LABEL[it.type]);
  add(it.type === 'playlist' ? 'Creador' : 'Artista', artistsOf(it));
  if (it.type === 'track') add('Álbum', it.albumName);
  add(it.type === 'track' ? 'Lanzamiento del álbum' : 'Lanzamiento', fmtDate(it.releaseDate));
  if (it.type !== 'artist' && it.type !== 'playlist' && yearOf(it)) add('Año', yearOf(it));
  add('Formato', ALBUM_TYPE_ES[it.albumType] || it.albumType);
  add('Duración', fmtDur(it.durationMs));
  add('Nº de pista', it.trackNumber ? (it.totalTracks ? `${it.trackNumber} de ${it.totalTracks}` : it.trackNumber) : null);
  if (it.type === 'album') add('Pistas', it.totalTracks);
  if (it.type === 'playlist') add('Canciones', it.totalTracks);
  add('Disco', it.discNumber && it.discNumber > 1 ? it.discNumber : null);
  add('Explícito', it.explicit === true ? 'Sí' : it.explicit === false ? 'No' : null);
  add('Sello', it.label);
  add('Géneros', it.genres?.length ? it.genres.join(', ') : null);
  add('Oyentes (seguidores)', it.followers ? it.followers.toLocaleString('es-ES') : null);
  add('Popularidad en Spotify', it.popularity !== null && it.popularity !== undefined ? `${it.popularity}/100` : null);
  add('ISRC', it.isrc);
  add('Guardado', `${new Date(it.dateAdded).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })} (${relDate(it.dateAdded)})`);
  if (!it.manual) add('ID de Spotify', it.spotifyId);
  return p;
}

/* ============ filtering & sorting ============ */
function filtered() {
  const q = fold(document.getElementById('q').value.trim());
  let out = ITEMS.filter(it => {
    // archivar no es borrar: se queda en el vault (cuenta en "En el vault"),
    // pero se aparta de todas las listas normales — solo aparece bajo "Archivado"
    if (PREFS.status === 'archived') { if (!it.archived) return false; }
    else if (it.archived) return false;
    if (PREFS.type !== 'all' && it.type !== PREFS.type) return false;
    // un artista no se "escucha" de golpe: no participa en pendiente/escuchado
    if (PREFS.status === 'pending' && (it.listened || it.type === 'artist')) return false;
    if (PREFS.status === 'listened' && (!it.listened || it.type === 'artist')) return false;
    if (PREFS.tag !== 'all' && !(it.tagIds || []).includes(PREFS.tag)) return false;
    if (PREFS.genre !== 'all' && !(it.genres || []).some(g => fold(g) === PREFS.genre)) return false;
    if (PREFS.decade !== 'all') { const y = yearOf(it); if (!y || Math.floor(y / 10) * 10 !== +PREFS.decade) return false; }
    if (q && !fold(it.title + ' ' + artistsOf(it) + ' ' + (it.notes || '')).includes(q)) return false;
    return true;
  });
  const s = PREFS.sort;
  out.sort((a, b) => {
    switch (s) {
      case 'title_asc':   return cmp(sortKey(a.title), sortKey(b.title));
      case 'title_desc':  return cmp(sortKey(b.title), sortKey(a.title));
      case 'artist_asc':  return cmp(sortKey(artistsOf(a)), sortKey(artistsOf(b))) || cmp(sortKey(a.title), sortKey(b.title));
      case 'artist_desc': return cmp(sortKey(artistsOf(b)), sortKey(artistsOf(a))) || cmp(sortKey(a.title), sortKey(b.title));
      case 'rating_desc': return (b.rating || 0) - (a.rating || 0) || cmp(sortKey(a.title), sortKey(b.title));
      case 'year_desc':   return yearOf(b) - yearOf(a);
      case 'year_asc':    return yearOf(a) - yearOf(b);
      case 'added_asc':   return a.dateAdded - b.dateAdded;
      default:            return b.dateAdded - a.dateAdded;
    }
  });
  return out;
}

/* ============ selection ============ */

/* ============ render ============ */
function renderStats() {
  // los artistas y lo archivado no cuentan en pendiente/escuchado (ver filtered())
  const contables = ITEMS.filter(i => i.type !== 'artist' && !i.archived);
  const done = contables.filter(i => i.listened).length;
  document.getElementById('statAll').textContent = ITEMS.length;
  document.getElementById('statPending').textContent = contables.length - done;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statArchived').textContent = ITEMS.filter(i => i.archived).length;
  document.querySelectorAll('.stat').forEach(b => b.classList.toggle('active', b.dataset.status === PREFS.status));
}

function renderChips() {
  // los números de los chips reflejan el mismo universo que ve filtered():
  // lo archivado normalmente no cuenta, pero si estás viendo "Archivado" sí
  // tiene sentido que los chips describan lo archivado, no el resto del vault
  const enArchivo = PREFS.status === 'archived';
  const visibles = ITEMS.filter(i => enArchivo ? i.archived : !i.archived);
  const countType = t => t === 'all' ? visibles.length : visibles.filter(i => i.type === t).length;

  // Por década: dato fiable (releaseDate llega para la mayoría de álbumes y
  // canciones), así que estos chips sí van a verse casi siempre.
  const decadeCounts = {};
  visibles.forEach(i => { const y = yearOf(i); if (y) { const dec = Math.floor(y / 10) * 10; decadeCounts[dec] = (decadeCounts[dec] || 0) + 1; } });
  const decades = Object.entries(decadeCounts).sort((a, b) => +a[0] - +b[0]);   // cronológico, no por frecuencia

  // Género: Spotify prácticamente ha dejado de rellenar este campo desde
  // finales de 2024 (es un cambio suyo, documentado por otros desarrolladores,
  // no algo que dependa de esta app) — así que estos chips solo aparecerán si
  // alguno de tus artistas todavía conserva géneros, o si editas alguno a mano
  // desde su ficha (Editar → Géneros).
  const genreFreq = {}, genreLabel = {};
  visibles.forEach(i => (i.genres || []).forEach(g => {
    const k = fold(g);
    if (!k) return;
    genreFreq[k] = (genreFreq[k] || 0) + 1;
    if (!genreLabel[k]) genreLabel[k] = g;
  }));
  const topGenres = Object.entries(genreFreq).sort((a, b) => b[1] - a[1]).slice(0, 12);

  const parts = [
    `<button class="chip ${PREFS.type === 'all' ? 'on' : ''}" data-type="all">Todo <span class="ct">${visibles.length}</span></button>`,
    ...['album', 'track', 'artist'].map(t =>
      `<button class="chip ${PREFS.type === t ? 'on' : ''}" data-type="${t}">${TYPE_ICON[t]} ${TYPE_PLURAL[t]} <span class="ct">${countType(t)}</span></button>`),
    // el chip de playlists solo aparece si tienes alguna guardada: es un tipo poco
    // frecuente y mostrarlo siempre a cero sería ruido en la barra de filtros
    ...(countType('playlist') ? [`<button class="chip ${PREFS.type === 'playlist' ? 'on' : ''}" data-type="playlist">${TYPE_ICON.playlist} ${TYPE_PLURAL.playlist} <span class="ct">${countType('playlist')}</span></button>`] : []),
    ...decades.map(([dec, n]) =>
      `<button class="chip decade ${PREFS.decade === dec ? 'on' : ''}" data-decade="${dec}">${dec}s <span class="ct">${n}</span></button>`),
    ...TAGS.map(t => {
      const n = visibles.filter(i => (i.tagIds || []).includes(t.id)).length;
      return `<button class="chip ${PREFS.tag === t.id ? 'on' : ''}" data-tag="${esc(t.id)}"><span class="dot" style="background:${esc(t.colorHex)}"></span>${esc(t.name)} <span class="ct">${n}</span></button>`;
    }),
    ...topGenres.map(([k, n]) =>
      `<button class="chip genre ${PREFS.genre === k ? 'on' : ''}" data-genre="${esc(k)}">🎧 ${esc(genreLabel[k])} <span class="ct">${n}</span></button>`)
  ];
  document.getElementById('chips').innerHTML = parts.join('');
}

function gcard(it) {
  const tags = (it.tagIds || []).map(tagById).filter(Boolean).slice(0, 4);
  return `<article class="gcard ${it.listened ? 'done' : ''} ${selected.has(it.id) ? 'sel' : ''}" data-id="${it.id}">
    <div class="art">
      ${portada(it.coverUrl, `<span class="ph">${TYPE_ICON[it.type]}</span>`, true)}
      ${it.type !== 'artist' ? `<button class="statusdot ${it.listened ? 'on' : ''}" data-toggle="${it.id}" aria-label="${it.listened ? 'Marcar pendiente' : 'Marcar escuchado'}">${it.listened ? '✓' : ''}</button>` : ''}
      <span class="typetag">${TYPE_LABEL[it.type]}</span>
    </div>
    <div class="gbody">
      <div class="gt">${esc(it.title)}</div>
      <div class="ga">${esc(artistsOf(it))}</div>
      <div class="gmeta">
        ${yearOf(it) ? `<span class="lyear">${yearOf(it)}</span>` : ''}
        ${it.rating ? `<span class="stars">${'★'.repeat(it.rating)}</span>` : ''}
        ${tags.map(t => `<span class="tagpip" style="background:${esc(t.colorHex)}" title="${esc(t.name)}"></span>`).join('')}
      </div>
    </div>
  </article>`;
}

function lrow(it) {
  const tags = (it.tagIds || []).map(tagById).filter(Boolean).slice(0, 4);
  const y = yearOf(it);
  return `<article class="lrow ${it.listened ? 'done' : ''} ${selected.has(it.id) ? 'sel' : ''}" data-id="${it.id}">
    <div class="lart">${portada(it.coverUrl, TYPE_ICON[it.type], true)}</div>
    <div class="linfo">
      <div class="lt">${esc(it.title)}</div>
      <div class="la">${esc(artistsOf(it))}</div>
    </div>
    <div class="lmeta">
      ${tags.map(t => `<span class="tagpip" style="background:${esc(t.colorHex)}" title="${esc(t.name)}"></span>`).join('')}
      ${it.rating ? `<span class="stars">${'★'.repeat(it.rating)}</span>` : ''}
      ${y ? `<span class="lyear">${y}</span>` : ''}
      ${it.type !== 'artist' ? `<button class="lcheck ${it.listened ? 'on' : ''}" data-toggle="${it.id}" aria-label="${it.listened ? 'Marcar pendiente' : 'Marcar escuchado'}">✓</button>` : ''}
    </div>
  </article>`;
}

/* Tanda visible. Se reinicia sola cuando cambian filtros, orden o búsqueda:
   así no hay que acordarse de resetearla en cada sitio que llama a render(). */
const TANDA = 120;
let VISTAS = TANDA, _firma = null;

function render() {
  const firma = [PREFS.type, PREFS.status, PREFS.tag, PREFS.sort,
                 document.getElementById('q').value.trim()].join('');
  if (firma !== _firma) { _firma = firma; VISTAS = TANDA; }

  renderStats();
  renderChips();
  renderSelBar();
  document.getElementById('sortSel').value = PREFS.sort;
  document.getElementById('viewBtn').textContent = PREFS.view === 'grid' ? '▦' : '☰';

  const box = document.getElementById('results');
  const line = document.getElementById('resultline');

  if (ITEMS.length === 0) {
    line.innerHTML = '';
    box.innerHTML = `<div class="empty">
      <div class="ico">🗄️</div>
      <h2>Tu vault está vacío</h2>
      <p>Guarda álbumes, canciones y artistas de Spotify para no perderlos de vista. Nada se reproduce aquí: esto es tu lista de lo que quieres escuchar.</p>
      <div class="acts">
        <button class="btn primary" data-open="search">Buscar en Spotify</button>
        <button class="btn" data-open="bulk">Pegar enlaces</button>
      </div>
    </div>`;
    return;
  }

  const rows = filtered();
  const anyFilter = PREFS.type !== 'all' || PREFS.status !== 'all' || PREFS.tag !== 'all' || PREFS.genre !== 'all' || PREFS.decade !== 'all' || document.getElementById('q').value.trim();
  line.innerHTML = `<span>${rows.length} de ${ITEMS.length}</span>${anyFilter ? `<button class="linkbtn" data-clear="1">Quitar filtros</button>` : ''}`;

  if (rows.length === 0) {
    box.innerHTML = PREFS.status === 'archived'
      ? `<div class="empty">
          <div class="ico">📦</div>
          <h2>Nada archivado por aquí</h2>
          <p>No has archivado nada todavía, o nada archivado coincide con estos filtros. Archivar algo (desde su ficha, o seleccionando varios) lo saca de tus listas normales sin borrarlo.</p>
          <div class="acts"><button class="btn" data-clear="1">Quitar filtros</button></div>
        </div>`
      : `<div class="empty">
          <div class="ico">🔍</div>
          <h2>Nada coincide</h2>
          <p>Prueba a quitar algún filtro o a buscar otra cosa.</p>
          <div class="acts"><button class="btn" data-clear="1">Quitar filtros</button></div>
        </div>`;
    return;
  }

  /* Con un vault de miles de elementos, pintarlos todos de golpe bloquea el
     móvil varios segundos. Dibujamos por tandas. */
  const visibles = rows.slice(0, VISTAS);
  const restan = rows.length - visibles.length;
  const groups = groupsFor(visibles);
  const draw = list => PREFS.view === 'grid'
    ? `<div class="grid">${list.map(gcard).join('')}</div>`
    : `<div class="list">${list.map(lrow).join('')}</div>`;

  box.innerHTML = (groups
    ? groups.map(g => `<section class="group"><h3 class="ghead">${esc(g.key)}<span class="gcount">${g.items.length}</span></h3>${draw(g.items)}</section>`).join('')
    : draw(visibles))
    + (restan > 0
      ? `<button class="btn vermas" data-more="1">Ver más — quedan ${restan.toLocaleString('es-ES')}</button>`
      : '');
}

/* Agrupa solo cuando el orden lo hace significativo: por artista, por inicial o por década. */
function groupsFor(rows) {
  const s = PREFS.sort;
  let keyOf = null;
  if (s.startsWith('artist')) keyOf = it => artistsOf(it) || 'Sin artista';
  else if (s.startsWith('title')) keyOf = it => { const c = (sortKey(it.title)[0] || '#').toUpperCase(); return /\p{L}/u.test(c) ? c : '#'; };
  else if (s.startsWith('year')) keyOf = it => { const y = yearOf(it); return y ? Math.floor(y / 10) * 10 + 's' : 'Sin año'; };
  if (!keyOf) return null;

  const out = [];
  let cur = null;
  for (const it of rows) {
    const k = keyOf(it);
    if (!cur || cur.key !== k) { cur = { key: k, items: [] }; out.push(cur); }
    cur.items.push(it);
  }
  return out;
}

/* ============ item actions ============ */
function toggleListened(id) {
  const it = ITEMS.find(i => i.id === id);
  if (!it) return;
  it.listened = !it.listened;
  saveItems();
  render();
}

function deleteItems(ids) {
  const removed = ITEMS.filter(i => ids.includes(i.id));
  ITEMS = ITEMS.filter(i => !ids.includes(i.id));
  tombstone(removed);
  saveItems();
  render();
  toast(`${removed.length} eliminado${removed.length === 1 ? '' : 's'}`, 'Deshacer', () => {
    /* Si el borrado ya llegó a sincronizarse antes de pulsar Deshacer, el otro
       dispositivo (o incluso este, en la próxima sincronización) sigue trayendo
       esa tumba del remoto. dateAdded no cambia al deshacer, así que sin esto
       la tumba vieja seguiría siendo "más nueva" que el ítem y lo volvería a
       matar en cuanto se sincronizase otra vez. touchedAt es la fecha que
       cuenta para decidir contra las tumbas; dateAdded se queda intacto para
       no romper el orden "añadido el" ni las estadísticas. */
    removed.forEach(it => { it.touchedAt = Date.now(); });
    ITEMS = ITEMS.concat(removed);
    untombstone(removed);
    saveItems();
    render();
  }, 9000);   // borrar es fácil de tocar sin querer: más margen que el resto de avisos
}

/* ---- search ---- */
let searchType = 'album';
let lastResults = [];
let searchTimer;
let searchSelMode = false;
let searchSel = new Set();   // índices de lastResults marcados en modo selección

/* Spotify solo da 10 resultados por página desde el cambio de febrero de 2026.
   Para poder elegir entre más de 10, "Ver más resultados" pide la siguiente
   página con offset y la añade al final de lastResults (nunca se reordena, así
   que los índices ya marcados en searchSel siguen siendo válidos). */
let searchOffset = 0;
let searchAgotado = true;
let searchQueryActual = '';
let searchTypeActual = '';
let _cargandoMasResultados = false;
const TOPE_OFFSET_BUSQUEDA = 100;   // 10 páginas; de sobra para elegir a mano

function openSearch() {
  searchType = 'album';
  searchSelMode = false; searchSel = new Set();
  showSheet(`
    <div class="sheethead"><h2>Buscar en Spotify</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <div class="segrow" id="segs">
      <button class="seg on" data-t="album">💿 Álbumes</button>
      <button class="seg" data-t="track">🎵 Canciones</button>
      <button class="seg" data-t="artist">🎤 Artistas</button>
      <button class="seg" data-t="bulk">📋 En bloque</button>
    </div>
    <input type="text" class="field" id="sq" placeholder="Título, artista, o pega un enlace (álbum, canción, artista o playlist)" autocomplete="off">
    <button class="linkbtn" id="manualLink" style="display:block;margin:9px 0 2px;">🔗 ¿No está en Spotify? Añade un enlace externo</button>
    <div id="sres" style="margin-top:12px;"></div>
  `);
  const sq = document.getElementById('sq');
  document.getElementById('segs').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    if (b.dataset.t === 'bulk') { bulkInputMode = 'links'; openBulk(); return; }   // misma hoja, panel de pegado
    document.querySelectorAll('#segs .seg').forEach(x => x.classList.toggle('on', x === b));
    searchType = b.dataset.t;
    searchSelMode = false; searchSel = new Set(); document.getElementById('searchSelBar')?.remove();
    runSearch();
  });
  document.getElementById('manualLink').addEventListener('click', openManualAdd);
  sq.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 330); });
  sq.focus();
}

/* Si se teclea rápido, una búsqueda vieja puede tardar más en responder que la
   que se lanzó después (red lenta, resultado más pesado…). Sin esto, la vieja
   llega tarde y pisa los resultados correctos con otros ya obsoletos. Cada
   llamada se numera y, al volver, se descarta si ya no es la más reciente. */
let _searchSeq = 0;

async function runSearch() {
  const miTurno = ++_searchSeq;
  const q = document.getElementById('sq').value.trim();
  const box = document.getElementById('sres');
  if (!q) { box.innerHTML = ''; return; }
  if (!isConnected()) {
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>Este dispositivo todavía no está conectado con Spotify. La conexión es por dispositivo: inicia sesión aquí también.</p><div class="acts"><button class="btn primary" data-open="settings">Ir a Ajustes</button></div></div>`;
    return;
  }
  box.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;
  const m = q.match(URL_ONE);
  const mPl = !m && q.match(URL_PLAYLIST_ONE);   // un enlace no puede ser las dos cosas a la vez
  searchOffset = 0; searchAgotado = true;
  searchQueryActual = q; searchTypeActual = searchType;
  try {
    let resultados;
    if (mPl) {
      // la propia playlist como marcador (rápido) va primero; sus canciones sueltas
      // detrás, por si quieres quedarte solo con algunas en vez de la playlist entera
      const [meta, tracks] = await Promise.all([
        fetchPlaylistMeta(mPl[1]).catch(() => null),
        fetchPlaylist(mPl[1], (got, tot) => {
          if (miTurno === _searchSeq) box.innerHTML = `<p class="lede" style="text-align:center;padding:20px 4px;">Leyendo la playlist… ${got} de ${tot}</p>`;
        })
      ]);
      const marcador = meta ? [normalize(meta, 'playlist')] : [];
      resultados = marcador.concat(tracks.map(t => normalize(t, 'track')));
    } else if (m) {
      resultados = [normalize(await spotifyLookup(m[1], m[2]), m[1])];
    } else {
      const d = await spotifySearch(q, searchType, 0);
      resultados = (d[searchType + 's']?.items || []).map(r => normalize(r, searchType));
      searchOffset = resultados.length;
      searchAgotado = resultados.length < 10;   // menos de una página llena: no hay más
    }
    if (miTurno !== _searchSeq) return;   // ya hay una búsqueda más nueva en curso
    lastResults = resultados;
    searchSelMode = false; searchSel = new Set();   // resultados nuevos: cualquier selección previa ya no aplica
    if (!lastResults.length) { box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>Sin resultados para “${esc(q)}”.</p></div>`; document.getElementById('searchSelBar')?.remove(); return; }
    pintarResultados();
  } catch (err) {
    if (miTurno !== _searchSeq) return;
    const msg = err.message || '';
    let text = 'No se pudo conectar con Spotify. Revisa tu conexión.';
    let mostrarReconectar = false;
    if (msg === 'AUTH_FAILED' || msg === 'NO_CREDS') text = 'Tu conexión con Spotify ha caducado o no es válida. Vuelve a conectarte en Ajustes.';
    else if (msg === 'RATE_LIMIT') text = 'Demasiadas búsquedas seguidas — Spotify ha puesto un límite temporal. Espera unos segundos y vuelve a intentarlo.';
    else if (msg.startsWith('LOOKUP_FAILED')) text = `Ese enlace no existe o es privado (error ${msg.split(':')[1]}).`;
    else if (msg.startsWith('SEARCH_FAILED')) text = `Spotify devolvió un error ${msg.split(':')[1]}.`;
    else if (msg.startsWith('PLAYLIST_FAILED')) {
      const code = msg.split(':')[1];
      if (code === '404') text = 'Esa playlist no es accesible (privada, o de las que genera Spotify — solo funcionan las públicas de usuario).';
      else if (code === '403' && !tieneScopePlaylists()) {
        text = 'Para leer playlists (sobre todo las tuyas, que suelen ser privadas) hace falta darle un permiso nuevo a esta conexión.';
        mostrarReconectar = true;
      } else text = `No se pudo leer la playlist (error ${code}).`;
    }
    box.innerHTML = `<div class="empty" style="padding:26px 8px;"><p>${esc(text)}</p>${mostrarReconectar ? `<div class="acts"><button class="btn primary" data-reconnect="1">Reconectar con Spotify</button></div>` : ''}</div>`;
    document.getElementById('searchSelBar')?.remove();
  }
}

function rrow(r, i) {
  const saved = ITEMS.some(x => x.spotifyId === r.spotifyId);
  const sub = r.type === 'playlist'
    ? [r.artists[0] ? `de ${r.artists[0]}` : null, r.totalTracks != null ? `${r.totalTracks} canciones` : null].filter(Boolean).join(' · ')
    : `${r.artists.join(', ')}${r.releaseDate ? ' · ' + String(r.releaseDate).slice(0, 4) : ''}`;
  const info = `<div class="rart">${portada(r.coverUrl, TYPE_ICON[r.type], true)}</div>
    <div class="rinfo">
      <div class="rt">${esc(r.title)}</div>
      <div class="ra">${esc(sub)}</div>
    </div>`;

  if (searchSelMode) {
    const marcado = searchSel.has(i);
    return `<div class="rrow${saved ? '' : ' selectable'}" ${saved ? '' : `data-rchk="${i}"`}>
      ${info}
      <span class="rchk ${marcado ? 'on' : ''} ${saved ? 'saved' : ''}" aria-label="${saved ? 'Ya guardado' : (marcado ? 'Quitar de la selección' : 'Seleccionar')}">✓</span>
    </div>`;
  }
  return `<div class="rrow">
    ${info}
    <button class="addbtn ${saved ? 'done' : ''}" data-add="${i}" aria-label="${saved ? 'Ya guardado' : 'Guardar'}">${saved ? '✓' : '＋'}</button>
  </div>`;
}

/* Vuelve a pintar la lista de resultados: la barra de herramientas (Seleccionar
   varios / Añadir todos), las filas, y si hay selección activa, la barra de
   confirmación abajo. Se llama tras cada búsqueda y tras cada toque en modo
   selección, para que el recuento y las marcas siempre reflejen el estado real. */
function pintarResultados() {
  const box = document.getElementById('sres');
  if (!box) return;
  const pendientes = lastResults.filter(r => !ITEMS.some(x => x.spotifyId === r.spotifyId)).length;

  let tools = '';
  if (lastResults.length > 1) {
    tools = searchSelMode
      ? `<div class="restools"><button data-restool="cancel">Cancelar</button></div>`
      : `<div class="restools">
           <button data-restool="selmode">Seleccionar varios</button>
           ${pendientes ? `<button data-restool="addall">Añadir todos<span class="n">(${pendientes})</span></button>` : ''}
         </div>`;
  }

  const masBtn = (!searchAgotado && searchOffset < TOPE_OFFSET_BUSQUEDA)
    ? `<button class="btn vermas" data-moreres="1" ${_cargandoMasResultados ? 'disabled' : ''}>${_cargandoMasResultados ? 'Cargando…' : 'Ver más resultados'}</button>`
    : '';

  box.innerHTML = tools + lastResults.map(rrow).join('') + masBtn;

  const barra = document.getElementById('searchSelBar');
  if (barra) barra.remove();
  if (searchSelMode && searchSel.size) {
    document.querySelector('.sheet')?.insertAdjacentHTML('beforeend', `
      <div class="selbar" id="searchSelBar">
        <span class="cnt">${searchSel.size} seleccionado${searchSel.size === 1 ? '' : 's'}</span>
        <button class="btn" data-selbar="cancel">Cancelar</button>
        <button class="btn primary" data-selbar="add">Añadir</button>
      </div>`);
  }
}

/* Pide la siguiente página de 10 resultados y la añade al final de lastResults
   sin perder la selección ni las filas ya pintadas. */
async function cargarMasResultados() {
  if (_cargandoMasResultados || searchAgotado) return;
  _cargandoMasResultados = true;
  pintarResultados();
  try {
    const d = await spotifySearch(searchQueryActual, searchTypeActual, searchOffset);
    const nuevos = (d[searchTypeActual + 's']?.items || []).map(r => normalize(r, searchTypeActual));
    const yaIds = new Set(lastResults.map(r => r.spotifyId));
    const frescos = nuevos.filter(r => !yaIds.has(r.spotifyId));
    lastResults = lastResults.concat(frescos);
    searchOffset += nuevos.length;
    searchAgotado = nuevos.length < 10;
  } catch (e) {
    toast('No se pudieron cargar más resultados');   // offset no cambia: el botón deja reintentar
  } finally {
    _cargandoMasResultados = false;
    pintarResultados();
  }
}

/* Añade a la vez todo lo que no esté ya guardado, de un array de resultados
   de Spotify (normalizados). Usado tanto por "Añadir todos" como por
   confirmar una selección múltiple. */
function addManyResults(items) {
  let added = 0;
  items.forEach(r => {
    if (!r || ITEMS.some(x => x.spotifyId === r.spotifyId)) return;
    ITEMS.push(makeItem(r)); added++;
  });
  if (added) { saveItems(); render(); }
  return added;
}
