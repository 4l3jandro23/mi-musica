<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>Historias de la música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  /* Mismo diseño que la Fonoteca (mando.html, capa «DISEÑO 2026-09-30») */
  :root {
    color-scheme: light;
    --bg:#f6f2ec; --bg-2:#efe9e0; --surface:#ffffff; --surface-2:#ece6dc; --surface-3:#e2dace;
    --line:rgba(28,20,12,0.08); --line-firm:rgba(28,20,12,0.15);
    --fg:#17120d; --fg-soft:#4c4339; --fg-mute:#80766a;
    --amber:#c47a0a; --amber-soft:#f6e3c0; --on-amber:#ffffff;
    --shadow-sm:0 1px 2px rgba(28,20,12,.05), 0 4px 14px rgba(28,20,12,.06);
    --shadow-md:0 8px 28px rgba(28,20,12,.12);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --f-disp:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
    --side:0px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:#0e0c0b; --bg-2:#141110; --surface:#1a1715; --surface-2:#24201d; --surface-3:#2f2a26;
      --line:rgba(255,236,210,0.07); --line-firm:rgba(255,236,210,0.14);
      --fg:#f8f2ea; --fg-soft:#cbbfae; --fg-mute:#91877a;
      --amber:#f4b13e; --amber-soft:rgba(244,177,62,0.15); --on-amber:#1c1305;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --shadow-md:0 10px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0e0c0b; --bg-2:#141110; --surface:#1a1715; --surface-2:#24201d; --surface-3:#2f2a26;
    --line:rgba(255,236,210,0.07); --line-firm:rgba(255,236,210,0.14);
    --fg:#f8f2ea; --fg-soft:#cbbfae; --fg-mute:#91877a;
    --amber:#f4b13e; --amber-soft:rgba(244,177,62,0.15); --on-amber:#1c1305;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv11", "ss01"; letter-spacing: -0.006em;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding-left: var(--side); padding-bottom: calc(60px + env(safe-area-inset-bottom));
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  ::selection { background: var(--amber-soft); }
  svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
  h2 { font-family: var(--f-disp); font-weight: 800; font-size: 24px; letter-spacing: -0.025em; line-height: 1.1; }
  h3 { font-family: var(--f-disp); font-weight: 750; font-size: 20px; letter-spacing: -0.02em; margin: 0; }
  .mute { color: var(--fg-mute); } .soft { color: var(--fg-soft); }

  /* cabecera */
  .top {
    position: sticky; top: 0; z-index: 40; padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--bg) 80%, transparent); box-shadow: 0 1px 0 var(--line);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 8px; max-width: 1100px; margin: 0 auto; }
  .logo { font-family: var(--f-disp); font-weight: 800; font-size: 21px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .marca { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; color: var(--on-amber); box-shadow: var(--shadow-sm);
    background: linear-gradient(135deg, var(--amber), color-mix(in srgb, var(--amber) 55%, #d4568a)); }
  .marca svg { width: 17px; height: 17px; stroke-width: 2.4; }
  .field { flex: 1; min-width: 0; border: 0; border-radius: 14px; background: var(--surface-2); padding: 9px 14px; outline: none; transition: background .15s, box-shadow .15s; }
  .field:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--amber); }

  /* botones y pastillas (nunca enlaces subrayados) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-firm); background: var(--surface); color: var(--fg);
    border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap; user-select: none;
    transition: transform .12s var(--ease-out), background .15s; -webkit-tap-highlight-color: transparent; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(0.97); }
  .btn.sm { padding: 7px 13px; font-size: 13px; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.pri { background: var(--tinte, var(--amber)); border-color: transparent; color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--tinte, var(--amber)) 35%, transparent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--tinte, var(--amber)) 88%, #fff); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--fg-soft); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .chip:hover { background: var(--surface-3); color: var(--fg); }

  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px; }
  main.entra { animation: entra .32s var(--ease-out); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } }

  /* barra lateral en el ordenador, como la Fonoteca */
  .lado { display: none; }
  @media (min-width: 1000px) {
    :root { --side: 236px; }
    .lado { display: flex; flex-direction: column; gap: 2px; position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); z-index: 41;
      padding: 18px 12px; overflow-y: auto; background: var(--bg-2); box-shadow: 1px 0 0 var(--line); }
    .lado .tit { font-family: var(--f-disp); font-weight: 800; font-size: 24px; letter-spacing: -0.03em; padding: 4px 12px 12px; }
    .lado .sec { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-mute); padding: 14px 12px 4px; }
    .lado a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; font-size: 14.5px; font-weight: 650; color: var(--fg-soft); }
    .lado a:hover { background: var(--surface-2); color: var(--fg); }
    .lado a.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
    .lado a .pto { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
    .lado a.volver { margin-bottom: 4px; }
    .logo { visibility: hidden; width: 0; }
  }

  /* portada */
  .cab { margin: 10px 0 18px; }
  .cab h2 { font-size: clamp(30px, 5.4vw, 48px); margin: 4px 0 8px; }
  .cab p { margin: 0; color: var(--fg-soft); max-width: 62ch; }
  .eti { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); }
  .familia { margin-top: 26px; }
  .familia > .eti { display: block; margin-bottom: 10px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .tarj { position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 178px; padding: 16px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 70%, var(--bg)) 0%, color-mix(in srgb, var(--c) 25%, var(--surface)) 70%);
    box-shadow: var(--shadow-md); transition: transform .2s var(--ease-out); }
  .tarj:hover { transform: translateY(-3px); }
  .tarj:active { transform: scale(.97); }
  .tarj .eti { color: color-mix(in srgb, var(--fg) 75%, transparent); }
  .tarj b { font-family: var(--f-disp); font-weight: 800; font-size: 22px; letter-spacing: -0.025em; line-height: 1.05; }
  .tarj .lema { font-size: 13.5px; color: var(--fg-soft); flex: 1; }
  .tarj .cuenta { font-size: 12.5px; font-weight: 700; color: var(--fg-soft); }

  /* cabecera de historia: el color de la historia manda, como las portadas */
  .hero { margin: -14px -16px 8px; padding: 14px 16px 26px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tinte) 62%, var(--bg)) 0%, color-mix(in srgb, var(--tinte) 22%, var(--bg)) 62%, var(--bg) 100%); }
  .hero .atras { margin: 0 0 14px -6px; background: color-mix(in srgb, var(--bg) 35%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .hero .eti { display: block; }
  .hero h2 { font-size: clamp(30px, 5.8vw, 54px); line-height: 1.02; margin: 6px 0 10px; }
  .hero p { margin: 0 0 16px; color: var(--fg-soft); max-width: 64ch; }

  /* capítulos y piezas, con filas como las de la Fonoteca */
  .capitulo { margin-top: 30px; scroll-margin-top: 70px; }
  .capitulo .eti { color: var(--tinte); }
  .capitulo h3 { margin: 4px 0 4px; }
  .capitulo h3 span { font-family: "Inter", sans-serif; font-size: 14px; font-weight: 600; color: var(--fg-mute); margin-left: 6px; letter-spacing: 0; }
  .capitulo > p { margin: 0 0 10px; color: var(--fg-soft); max-width: 64ch; }
  .lista { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 6px 10px 2px; border-radius: 12px; transition: background .12s; }
  .row:hover { background: var(--surface-2); }
  .anyo { width: 52px; height: 46px; flex: none; border-radius: 10px; display: grid; place-items: center; box-shadow: var(--shadow-sm);
    font-family: var(--f-disp); font-weight: 800; font-size: 15px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--tinte) 22%, var(--surface)); color: color-mix(in srgb, var(--tinte) 70%, var(--fg)); }
  .row .txt { flex: 1; min-width: 0; padding-top: 2px; }
  .t1 { font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }
  .t2 { font-size: 13px; color: var(--fg-soft); margin-top: 1px; }
  .nota { font-size: 13px; color: var(--fg-mute); margin: 4px 0 0; }
  .tipo { display: inline-block; vertical-align: 1px; margin-left: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; background: color-mix(in srgb, var(--tinte) 18%, transparent); color: color-mix(in srgb, var(--tinte) 75%, var(--fg)); }
  .row.hito .anyo { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-firm); color: var(--fg-mute); }
  .row.hito .t1 { color: var(--fg-soft); }
  .oir { flex: none; margin-top: 4px; }
  .oir:hover { background: #1db954; border-color: #1db954; color: #fff; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 650; font-size: 14px; transition: .25s var(--ease-out); z-index: 60; }
  .toast.ver { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 1000px) { .toast { margin-left: calc(var(--side) / 2); } }

  @media (max-width: 560px) {
    .logo span { display: none; }
    .oir span { display: none; }
    .oir { padding: 8px 10px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="logo" href="#"><i class="marca"></i>Historias<span class="mute">&nbsp;de la música</span></a>
    <input class="field" id="buscar" type="search" placeholder="Buscar artista, tema o año…" autocomplete="off">
    <a class="btn ghost sm" href="mando.html" id="aFono" title="Volver a la Fonoteca"></a>

</header>

<main id="main"></main>
