<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#edece7" media="(prefers-color-scheme: light)">
<link rel="icon" href="historias/icono-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="historias/icono-180.png">
<link rel="manifest" href="historias.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Historias">
<title>Historias de la música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DISEÑO 6 (2026-11-01) · Hermana de la Fonoteca
     Todo va por año: la portada es una línea del tiempo por épocas, con una foto
     de archivo en blanco y negro para cada una. Una sola letra (Archivo; ancha en
     los títulos), el ultramar de la Fonoteca para la acción y el progreso, y el
     color de cada historia solo en su funda. Plano: sin degradados ni sombras.
     ============================================================ */
  :root {
    color-scheme: light;
    --bg: #edece7; --bg2: #e6e4de; --sur: #fbfaf7; --sur2: #e2e0d9; --sur3: #d6d4cc;
    --ink: #14151a; --soft: #3f4047; --mute: #64636a;
    --acc: #2b3fd1; --acc-soft: #dde2fb; --on-acc: #ffffff;
    --ok: #0b6b4c; --bad: #b8382a;
    --f: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r: 16px; --r-sm: 10px; --r-cd: 4px;
    --side: 0px; --tabs-h: 0px; --top-h: 60px; --pad: 16px;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #0c0d10; --bg2: #111216; --sur: #17181d; --sur2: #202127; --sur3: #2c2d35;
      --ink: #eeede8; --soft: #c2c1bc; --mute: #94939b;
      --acc: #8c9cff; --acc-soft: rgba(140, 156, 255, 0.15); --on-acc: #0c0d10;
      --ok: #5fd3a0; --bad: #ff8a7a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0d10; --bg2: #111216; --sur: #17181d; --sur2: #202127; --sur3: #2c2d35;
    --ink: #eeede8; --soft: #c2c1bc; --mute: #94939b;
    --acc: #8c9cff; --acc-soft: rgba(140, 156, 255, 0.15); --on-acc: #0c0d10;
    --ok: #5fd3a0; --bad: #ff8a7a;
  }
  @media (min-width: 700px) { :root { --pad: 32px; } }
  @media (min-width: 1000px) { :root { --pad: 48px; } }
  @media (max-width: 999px) { :root { --tabs-h: calc(64px + env(safe-area-inset-bottom)); } }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top-h) + 64px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.5;
    padding-left: var(--side); padding-bottom: calc(var(--tabs-h) + 24px); }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  img { max-width: 100%; display: block; }
  .i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: var(--acc-soft); }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  mark { background: var(--acc-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
  h1, h2, h3 { font-stretch: 112%; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(34px, 5.4vw, 56px); }
  h2 { font-size: clamp(24px, 3vw, 30px); }
  .lead { font-size: 18px; color: var(--soft); max-width: 62ch; margin: 14px 0 0; }

  /* ---------- cabecera con el buscador ---------- */
  .top { position: sticky; top: 0; z-index: 40; background: var(--bg); }
  .bar { height: var(--top-h); display: flex; align-items: center; gap: 12px; padding: 0 var(--pad); max-width: calc(1180px + 2 * var(--pad)); margin: 0 auto; }
  .logo { font-stretch: 116%; font-weight: 800; font-size: 22px; margin-right: 8px; letter-spacing: -0.03em; text-decoration: none; flex: none; }
  .busca { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 999px; background: var(--sur); color: var(--mute); cursor: text; }
  .busca:focus-within { box-shadow: inset 0 0 0 2px var(--acc); }
  .busca i { display: flex; }
  .busca input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); outline: none; }
  .busca input::placeholder { color: var(--mute); }
  #aFono { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 999px; text-decoration: none; font-weight: 650; color: var(--soft); flex: none; }
  #aFono:hover { background: var(--sur2); color: var(--ink); }
  @media (max-width: 999px) { #aFono span { display: none; } #aFono { width: 44px; justify-content: center; padding: 0; } }

  /* ---------- apartados: en la barra de arriba (ordenador) y en pestañas (móvil) ---------- */
  .secc { display: none; }
  @media (min-width: 1000px) {
    .secc { display: flex; gap: 4px; }
    .secc a { display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; text-decoration: none; font-weight: 650; color: var(--soft); }
    .secc a:hover { background: var(--sur2); color: var(--ink); }
    .secc a.on { background: var(--sur); color: var(--ink); }
  }
  .pto { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--mute)); flex: none; display: inline-block; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; background: var(--bg2); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 50px; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 600; color: var(--mute); border-radius: 12px; }
  .tabs a .i { width: 23px; height: 23px; }
  .tabs a.on { color: var(--ink); }
  .tabs a.on .i { stroke-width: 2.3; }
  @media (min-width: 1000px) { .tabs { display: none; } }

  /* ---------- lienzo ---------- */
  main { max-width: calc(1180px + 2 * var(--pad)); margin: 0 auto; padding: 20px var(--pad) 40px; }
  main.lectura { max-width: calc(1040px + 2 * var(--pad)); }
  .anyo-top { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 28px; }
  .anyo-top .selector { margin-top: 0; }
  @media (min-width: 900px) { .anyo-top { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
  main.entra { animation: entra .32s var(--ease); }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } }
  .revela { opacity: 0; transform: translateY(22px); transition: opacity .5s var(--ease) var(--d, 0ms), transform .6s var(--ease) var(--d, 0ms); }
  .revela.dentro { opacity: 1; transform: none; }

  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--sur2); color: var(--ink);
    font-weight: 650; font-size: 16px; text-decoration: none; cursor: pointer; transition: background .15s, transform .15s var(--ease); }
  .btn:hover { background: var(--sur3); }
  .btn:active { transform: scale(0.97); }
  .btn.pri { background: var(--acc); color: var(--on-acc); }
  .btn.pri:hover { background: color-mix(in srgb, var(--acc) 86%, var(--ink)); }
  .btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
  .btn.peligro { color: var(--bad); }
  .btn.redondo { width: 52px; height: 52px; padding: 0; }
  .btn:disabled { opacity: .35; cursor: default; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 15px; border-radius: 999px; border: 0; background: var(--sur); color: var(--soft);
    font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; cursor: pointer; flex: none; transition: background .15s, color .15s; }
  .chip:hover { background: var(--sur2); color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--bg); }
  .chip.on .pto { box-shadow: 0 0 0 2px var(--bg); }

  /* filas de pastillas: en el móvil se deslizan; en el ordenador, en varias líneas */
  .fams, .filtros, .atajos-anyo { display: flex; gap: 8px; flex-wrap: wrap; margin: 28px 0 0; }
  .indice { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; position: sticky; top: var(--top-h); z-index: 30; background: var(--bg);
    margin: 0 calc(-1 * var(--pad)); padding: 10px var(--pad); }
  .saltos { display: flex; gap: 8px; flex-wrap: wrap; }
  .saltos::-webkit-scrollbar, .indice::-webkit-scrollbar, .fams::-webkit-scrollbar { display: none; }
  .indice .chip b { color: var(--mute); font-weight: 800; }
  .indice .chip.on b { color: inherit; }
  @media (max-width: 699px) {
    .fams { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--pad)); margin-right: calc(-1 * var(--pad)); padding: 0 var(--pad); }
  }

  /* ---------- la funda con su vinilo ---------- */
  .disco { position: relative; display: block; aspect-ratio: 1 / 0.88; }
  .funda { position: absolute; left: 0; top: 0; width: 88%; height: 100%; display: block; }
  .vinilo { position: absolute; top: 4%; bottom: 4%; right: 0; aspect-ratio: 1; border-radius: 50%; background: #1d1e23; transition: transform .45s var(--ease); }
  :root[data-theme="dark"] .vinilo { background: #2a2b31; }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .vinilo { background: #2a2b31; } }
  .vinilo i { position: absolute; inset: 34%; border-radius: 50%; background: var(--c); }
  .vinilo i::after { content: ''; position: absolute; inset: 42%; border-radius: 50%; background: #111214; }
  .f-tit { font-family: var(--f); font-stretch: 116%; font-weight: 800; letter-spacing: -0.04em; }
  .f-pie { font-family: var(--f); font-weight: 650; font-variant-numeric: tabular-nums; }
  a:hover > .disco .vinilo, .hoy:hover .vinilo { transform: translateX(-9%) rotate(25deg); }

  /* ---------- tarjetas ---------- */
  .rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; }
  @media (min-width: 700px) { .rejilla { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 24px; } }
  @media (min-width: 1200px) { .rejilla { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tarj { display: flex; flex-direction: column; gap: 6px; text-decoration: none; min-width: 0; }
  .tarj .disco { margin-bottom: 8px; }
  .t-tit { font-weight: 750; font-size: 18px; line-height: 1.25; letter-spacing: -0.01em; }
  .t-lema { font-size: 16px; color: var(--soft); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .t-meta { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .nueva { display: inline-block; vertical-align: 2px; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--acc-soft); color: var(--acc); letter-spacing: 0; }
  .barrita { display: block; height: 4px; border-radius: 4px; background: var(--sur2); overflow: hidden; margin-top: 2px; }
  .barrita i { display: block; height: 100%; background: var(--acc); }

  /* ---------- inicio ---------- */
  .ini-cab { padding: 28px 0 8px; }
  .ini-cab h1 { font-size: clamp(42px, 8.2vw, 120px); letter-spacing: -0.045em; line-height: .95; }
  .mini-h { font-size: 16px; font-stretch: 100%; letter-spacing: 0; font-weight: 700; color: var(--soft); margin: 36px 0 0; }
  .mini-h + .fams, .mini-h + .saltos { margin-top: 12px; }
  .era-foto figcaption { margin-bottom: 0; }
  .ini-cab { display: grid; grid-template-columns: 1fr; gap: 28px; }
  .ini-cab h1 { grid-column: 1 / -1; }
  @media (min-width: 900px) { .ini-cab:not(.filtrada) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 32px 48px; align-items: start; } }
  .ini-txt .lead { margin-top: 0; }
  .hoy { display: grid; grid-template-columns: minmax(110px, 170px) 1fr; gap: 16px 22px; align-items: center; padding: 20px; border-radius: var(--r); background: var(--sur); text-decoration: none; }
  .hoy .disco { width: 100%; }
  .hoy-txt { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .hoy-txt h2 { font-size: clamp(22px, 2.4vw, 28px); }
  .hoy .lema { color: var(--soft); }
  .meta { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
  @media (max-width: 559px) { .hoy { grid-template-columns: 1fr; padding: 18px; } .hoy .disco { width: 170px; } }
  .era { padding-top: 112px; }
  @media (min-width: 1000px) { .era { padding-top: 160px; } }
  .era-cab { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 28px; }
  @media (min-width: 760px) { .era-cab { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: end; } }
  .era-txt h2 { font-size: clamp(30px, 4.2vw, 46px); }
  .era-txt p { margin: 12px 0 0; font-size: 18px; color: var(--soft); max-width: 46ch; }
  .era-txt .meta { font-size: 14px; color: var(--mute); }
  .era-foto { margin: 0; }
  .era-foto img { width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: var(--r-cd); background: var(--sur2); }
  .era-foto figcaption { font-size: 14px; color: var(--mute); margin-top: 8px; }
  .pie { margin-top: 80px; padding-top: 28px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .pie p { font-size: 14px; color: var(--mute); max-width: 70ch; margin: 0; }

  /* ---------- cabeceras de sección (años, lo tuyo, juego, búsqueda) ---------- */
  .cab { padding: 28px 0 8px; }
  .cab h1 { font-size: clamp(32px, 3.8vw, 46px); }
  .bloque { margin-top: 56px; }
  .bloque h2 { margin-bottom: 20px; }
  .bloque .sub { color: var(--soft); margin: -8px 0 22px; max-width: 64ch; }
  .volver-fam { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; margin-bottom: 14px; color: var(--soft); font-weight: 650; text-decoration: none; }
  .volver-fam:hover { color: var(--ink); }
  .volver-fam .i { width: 18px; height: 18px; }

  /* ---------- una historia ---------- */
  .hero { padding: 20px 0 8px; }
  .hero-in { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .hero-in .disco { width: min(72vw, 340px); }
  @media (min-width: 760px) { .hero-in { grid-template-columns: 340px 1fr; gap: 48px; align-items: center; } .hero-in .disco { width: 100%; } }
  .hero-txt h1 { font-size: clamp(30px, 4.4vw, 54px); }
  .lema-h { font-size: 19px; color: var(--soft); margin: 14px 0 0; max-width: 52ch; }
  .datos { font-size: 14px; color: var(--mute); margin: 12px 0 0; font-variant-numeric: tabular-nums; }
  .progreso { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--soft); max-width: 420px; }
  .barra { height: 6px; border-radius: 6px; background: var(--sur2); overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--acc); transition: width .4s var(--ease); }
  .intro { font-size: 18px; line-height: 1.6; max-width: 68ch; margin: 40px 0 0; }
  .crono-h { display: flex; flex-direction: column; gap: 2px; margin: 40px 0 0; }
  .crono-h a { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 92px; gap: 14px; align-items: center; min-height: 40px; padding: 0 10px; border-radius: var(--r-sm); text-decoration: none; }
  .crono-h a:hover { background: var(--sur); }
  .ch-nom { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-nom b { color: var(--mute); margin-right: 8px; }
  .ch-pista { position: relative; height: 10px; border-radius: 6px; background: var(--sur2); }
  .ch-pista i { position: absolute; top: 0; bottom: 0; min-width: 8px; border-radius: 6px; background: var(--acc); }
  .ch-anyos { font-size: 14px; color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 599px) { .crono-h a { grid-template-columns: minmax(0, 1fr) 84px; } .ch-pista { grid-column: 1 / -1; grid-row: 2; margin-bottom: 8px; } }
  .indice { margin-top: 28px; }

  .capitulo { margin-top: 56px; }
  .cap-cab { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; }
  .letra { font-stretch: 125%; font-weight: 800; font-size: 56px; line-height: .85; color: var(--sur3); flex: none; min-width: 48px; }
  .cap-txt { flex: 1; min-width: 0; }
  .cap-txt p { margin: 10px 0 0; color: var(--soft); max-width: 70ch; }
  .cap-txt .periodo { margin-top: 8px; font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .editar-cap { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--mute); display: grid; place-items: center; cursor: pointer; flex: none; }
  .editar-cap:hover { background: var(--sur2); color: var(--ink); }
  .editor-cap { margin: -6px 0 18px; padding: 18px; border-radius: var(--r); background: var(--sur); }
  .editor-cap label { display: flex; flex-direction: column; gap: 8px; font-weight: 650; }
  .editor-cap input { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: var(--r-sm); border: 0; background: var(--bg); color: var(--ink); }
  .editor-cap .btnrow { margin-top: 14px; }
  .editor-cap p { color: var(--soft); margin: 12px 0 0; }

  /* ---------- filas de canciones ---------- */
  .lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 10px 14px 12px; border-radius: var(--r-sm); transition: background .15s, opacity .22s, transform .22s; }
  .row:hover { background: var(--sur); }
  .row.saliendo { opacity: 0; transform: translateX(20px); }
  .anyo { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; padding-top: 1px; display: flex; flex-direction: column; gap: 2px; }
  .anyo small { font-size: 13px; font-weight: 600; color: var(--mute); }
  .anyo b { font-size: 13px; font-weight: 600; color: var(--mute); }
  .anyo .puesto { color: var(--acc); font-weight: 700; }
  .t1 { font-weight: 700; font-size: 16px; line-height: 1.35; }
  .t1 .i { width: 16px; height: 16px; vertical-align: -2px; margin-right: 6px; color: var(--acc); }
  .t2 { color: var(--soft); font-size: 16px; margin-top: 2px; }
  .nota { margin: 8px 0 0; color: var(--soft); font-size: 16px; line-height: 1.55; max-width: 70ch; }
  .tipo, .veredicto, .tuya { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--sur2); color: var(--soft); vertical-align: 1px; white-space: nowrap; }
  .tuya { background: var(--acc-soft); color: var(--acc); }
  .veredicto.falso { color: var(--bad); } .veredicto.cierto { color: var(--ok); }
  .row.hito .anyo { color: var(--acc); }
  .row.hito .t1 { font-weight: 750; }
  .row.oida-on .t1, .row.oida-on .t2 { color: var(--mute); }
  .de-h { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
  .de-h a { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none; }
  .de-h a:hover { color: var(--ink); text-decoration: underline; }
  .acc { display: flex; gap: 2px; align-items: center; }
  .acc button, .acc a { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--mute); cursor: pointer; text-decoration: none; position: relative; }
  .acc button::after, .acc a::after { content: ''; position: absolute; inset: -2px; }
  .acc span { display: none; }
  .acc button:hover, .acc a:hover { background: var(--sur2); color: var(--ink); }
  .acc .oida.on { background: var(--acc); color: var(--on-acc); }
  @media (max-width: 599px) {
    .row { grid-template-columns: 48px minmax(0, 1fr); padding: 14px 6px; }
    .acc { grid-column: 2; margin: 6px 0 0 -8px; }
    .anyo { font-size: 15px; }
  }

  .cambios { margin-top: 48px; padding: 18px 20px; border-radius: var(--r); background: var(--sur); }

  .cambios ul { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .cambios li { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .nav-fin { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 64px; }
  @media (min-width: 700px) { .nav-fin { grid-template-columns: 1fr 1fr; } }
  .siguiente { display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-radius: var(--r); background: var(--sur); text-decoration: none; transition: background .15s; }
  .siguiente:hover { background: var(--sur2); }
  .siguiente:not(.ant) { justify-content: flex-end; text-align: right; }
  .siguiente > span { display: flex; flex-direction: column; gap: 4px; }
  .siguiente .de { font-size: 14px; color: var(--mute); }
  .siguiente b { font-size: 18px; letter-spacing: -0.01em; }

  /* ---------- año a año ---------- */
  .selector { margin-top: 28px; padding: 24px; border-radius: var(--r); background: var(--sur); }
  .sel-anyo { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .sel-anyo output { font-stretch: 125%; font-weight: 800; font-size: clamp(64px, 12vw, 120px); line-height: .9; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: center; }
  .barras { display: flex; align-items: flex-end; gap: 1px; height: 120px; margin-top: 26px; border-radius: 6px; touch-action: pan-y; cursor: ew-resize; }
  .barras button { flex: 1; min-width: 0; height: var(--h); padding: 0; border: 0; border-radius: 2px 2px 0 0; background: var(--sur3); cursor: inherit; position: relative; pointer-events: none; }
  .barras button::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; }
  .barras button.dec { background: color-mix(in srgb, var(--acc) 35%, var(--sur3)); }
  .barras button.on { background: var(--acc); }
  .ejes { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .atajos-anyo { margin-top: 20px; }
  .selector .chip { background: var(--bg); }
  .selector .chip.on { background: var(--ink); }
  .vacio, .aviso { color: var(--soft); padding: 18px 0; }

  /* ---------- lo tuyo ---------- */
  .vinc { display: flex; gap: 8px; flex-wrap: wrap; }
  .vinc input { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 16px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--sur); color: var(--ink); }
  .lista-cambios { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-direction: column; gap: 4px; }
  .lista-cambios li { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: var(--r-sm); background: var(--sur); }
  .lista-cambios a { display: flex; align-items: center; gap: 10px; font-weight: 650; text-decoration: none; }
  .lista-cambios span { color: var(--mute); font-size: 14px; }

  /* ---------- juego ---------- */
  .marcador { margin: 18px 0 0; color: var(--soft); font-variant-numeric: tabular-nums; }
  .marcador b { color: var(--ink); }
  .jcarta { margin-top: 28px; padding: 28px; border-radius: var(--r); background: var(--sur); border-left: 6px solid var(--c); max-width: 760px; }
  .jcarta .que { margin: 0; color: var(--mute); font-weight: 600; }
  .jcarta .pregunta { margin: 8px 0 0; font-stretch: 112%; font-weight: 800; font-size: clamp(22px, 3.4vw, 34px); line-height: 1.1; letter-spacing: -0.03em; }
  .jcarta .sub { margin: 10px 0 0; color: var(--soft); font-size: 17px; }
  .jops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
  .jop { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 18px; border: 0; border-radius: var(--r-sm); background: var(--bg); font-weight: 800; font-size: 20px; cursor: pointer; font-variant-numeric: tabular-nums; transition: background .15s, transform .15s var(--ease); }
  .jop:hover:not(:disabled) { background: var(--sur2); }
  .jop:active:not(:disabled) { transform: scale(0.98); }
  .jop kbd { font: inherit; font-size: 13px; font-weight: 700; color: var(--mute); }
  .jop.bien { background: var(--ok); color: #fff; } .jop.bien kbd { color: inherit; }
  .jop.fallo { background: var(--bad); color: #fff; } .jop.fallo kbd { color: inherit; }
  .jop.apagada { opacity: .45; }
  .jsol { margin-top: 22px; }
  .jsol .veredicto-j { font-weight: 800; font-size: 22px; margin: 0; }
  .jsol p { color: var(--soft); }

  /* ---------- búsqueda ---------- */
  .grupo { margin-top: 36px; }
  .grupo-cab { display: flex; align-items: center; gap: 10px; min-height: 48px; text-decoration: none; font-size: 19px; }
  .grupo-cab span { color: var(--mute); font-size: 15px; font-variant-numeric: tabular-nums; }
  .grupo-cab .i { margin-left: auto; color: var(--mute); }

  /* ---------- avisos y volver arriba ---------- */
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 18px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60;
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 650; display: flex; align-items: center; gap: 14px; transition: opacity .2s, transform .25s var(--ease); max-width: calc(100vw - 32px); }
  .toast.ver { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: inherit; font-weight: 800; cursor: pointer; min-height: 36px; text-decoration: underline; }
  .arriba { position: fixed; right: 18px; bottom: calc(var(--tabs-h) + 18px); width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center;
    cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .2s, transform .25s var(--ease); z-index: 45; }
  .arriba.ver { opacity: 1; pointer-events: auto; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }

  }
