<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fonoteca">
<meta name="theme-color" content="#0e0c0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="mando.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>Fonoteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg:#f7f2e9; --surface:#fffdf8; --surface-2:#efe8db;
    --line:rgba(26,20,14,0.11); --line-firm:rgba(26,20,14,0.20);
    --fg:#1a140e; --fg-soft:#5d5346; --fg-mute:#726858;
    --amber:#a3690f; --amber-soft:#f0e0c2; --on-amber:#fffdf8;
    --jade:#14795c; --jade-soft:#d5e9e0; --rust:#b03f30;
    --shadow-sm:0 1px 2px rgba(26,20,14,0.05),0 3px 8px rgba(26,20,14,0.05),0 8px 24px rgba(26,20,14,0.04);
    --shadow-lg:0 -4px 40px rgba(26,20,14,0.18);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-drawer:cubic-bezier(0.32,0.72,0,1);
    --row:60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:#14100d; --surface:#1e1915; --surface-2:#2a231d;
      --line:rgba(247,242,233,0.10); --line-firm:rgba(247,242,233,0.20);
      --fg:#f5efe4; --fg-soft:#b8ab99; --fg-mute:#948877;
      --amber:#e0a03a; --amber-soft:#3a2c15; --on-amber:#1a140e;
      --jade:#46b491; --jade-soft:#14312a; --rust:#e0705e;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.34),0 3px 10px rgba(0,0,0,0.26);
      --shadow-lg:0 -4px 40px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#14100d; --surface:#1e1915; --surface-2:#2a231d;
    --line:rgba(247,242,233,0.10); --line-firm:rgba(247,242,233,0.20);
    --fg:#f5efe4; --fg-soft:#b8ab99; --fg-mute:#948877;
    --amber:#e0a03a; --amber-soft:#3a2c15; --on-amber:#1a140e;
    --jade:#46b491; --jade-soft:#14312a; --rust:#e0705e;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.34),0 3px 10px rgba(0,0,0,0.26);
    --shadow-lg:0 -4px 40px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding-bottom: calc(150px + env(safe-area-inset-bottom));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .mute { color: var(--fg-mute); } .soft { color: var(--fg-soft); } .tiny { font-size: 12px; }
  .nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

  /* cabecera */
  .top {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px 6px; max-width: 900px; margin: 0 auto; }
  .logo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; flex: 1; min-width: 0; }
  .logo span { color: var(--amber); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 2px 14px 9px; max-width: 900px; margin: 0 auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; color: var(--fg-soft); font-weight: 650; font-size: 14px;
    padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.on { background: var(--fg); color: var(--bg); }
  .tab:active { transform: scale(0.97); }

  main { max-width: 900px; margin: 0 auto; padding: 12px 14px; }

  /* botones */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line-firm); background: var(--surface); color: var(--fg);
    border-radius: 11px; padding: 9px 13px; font-size: 14px; font-weight: 600;
    cursor: pointer; white-space: nowrap; user-select: none; text-decoration: none;
    transition: transform .12s var(--ease-out), background .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn.pri { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 45%, transparent); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
  .btn.ico { padding: 8px 9px; }
  .btn.wide { width: 100%; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-firm); background: var(--surface); border-radius: 999px;
    padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { transform: scale(0.96); }
  .chip.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .field {
    width: 100%; background: var(--surface); border: 1px solid var(--line-firm);
    border-radius: 11px; padding: 10px 12px; font-size: 16px;
  }
  .field:focus { outline: none; border-color: var(--amber); }
  select.field { padding: 9px 10px; }
  label.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 5px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--amber); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 10px; }
  .aviso { background: var(--amber-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
  .aviso b { display: block; margin-bottom: 4px; }
  h2 { font-size: 20px; margin: 4px 0 2px; letter-spacing: -0.3px; }
  h3 { font-size: 15px; margin: 18px 0 8px; }

  /* cabecera de una lista */
  .cab { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .cab img, .cab .ph { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); box-shadow: var(--shadow-sm); }
  .cab .ph.red { border-radius: 50%; }
  .cab .txt { min-width: 0; flex: 1; }
  .back { margin: -4px 0 8px -8px; }

  .herr { display: flex; gap: 8px; align-items: center; margin: 10px 0 8px; }
  .herr .field { flex: 1; padding: 8px 12px; }
  .herr select.field { flex: none; width: auto; max-width: 42%; }
  .selbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }

  /* lista virtual */
  .vlist { position: relative; }
  .row {
    position: absolute; left: 0; right: 0; height: var(--row);
    display: flex; align-items: center; gap: 10px; padding: 0 4px 0 2px;
    border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .row:hover { background: var(--surface); }
  .row.sel { background: var(--amber-soft); }
  .row .ck {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-firm); flex: none;
    display: grid; place-items: center; color: var(--on-amber); transition: background .12s, border-color .12s;
  }
  .row.sel .ck { background: var(--amber); border-color: var(--amber); }
  .row .ck svg { width: 13px; height: 13px; stroke-width: 3; opacity: 0; }
  .row.sel .ck svg { opacity: 1; }
  .row img, .row .ph { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--surface-2); }
  .row .t { flex: 1; min-width: 0; }
  .row .t1 { font-weight: 600; font-size: 14.5px; }
  .row .t2 { font-size: 12.5px; color: var(--fg-mute); }
  .row .r { font-size: 12px; color: var(--fg-mute); text-align: right; flex: none; }
  .row .mas { flex: none; }
  .row.suena .t1 { color: var(--jade); }
  .row .n { width: 26px; text-align: right; font-size: 12px; color: var(--fg-mute); flex: none; font-variant-numeric: tabular-nums; }

  /* seleccion tactil: la columna del circulo es la «zona de arrastre» */
  .vlist { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .row .ckz { width: 44px; align-self: stretch; flex: none; display: grid; place-items: center; touch-action: none; margin: 0 -8px 0 -4px; cursor: ns-resize; }
  .row .dots { font-size: 11px; color: var(--jade); font-weight: 700; }
  .selbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; position: sticky; top: var(--topH, 96px); z-index: 20; background: var(--bg); padding: 7px 0; margin: 0 0 4px; }
  .selbar::-webkit-scrollbar { display: none; }
  .selbar .chip, .selbar .tiny { white-space: nowrap; flex: none; }
  .chip.fuerte { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .ayuda { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 0 0 8px; display: flex; gap: 10px; align-items: flex-start; }
  .ayuda button { border: 0; background: transparent; color: var(--fg-mute); font-weight: 700; cursor: pointer; flex: none; }
  .elsec { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); margin: 14px 0 6px; }
  .elchips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 176px; overflow-y: auto; }
  .elchips .chip b { font-weight: 800; margin-left: 5px; opacity: .6; }
  .elnum { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .elnum input { width: 74px; padding: 7px 10px; }
  .elpie { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 2px; margin-top: 12px; display: flex; gap: 8px; }
  .accion .cerrar { padding: 6px; }

  /* medidor de cupo */
  .cupo { border: 1px solid var(--line); background: var(--surface); color: var(--fg-soft); border-radius: 999px; padding: 5px 10px 5px 8px; font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .cupo i { width: 9px; height: 9px; border-radius: 50%; background: #2f8f5e; flex: none; }
  .cupo.medio i { background: #d98c1f; } .cupo.alto i, .cupo.frenado i { background: #c4342e; }
  .cupo.frenado { color: #c4342e; border-color: #c4342e; }
  .medbar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 6px 0 2px; }
  .medbar i { display: block; height: 100%; border-radius: 6px; }

  /* etiquetas */
  .etqs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .etq { font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg-soft); border: 0; cursor: pointer; }
  .etq b { font-weight: 800; opacity: .55; margin-right: 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
  .etq.man { background: var(--amber-soft); color: var(--fg); }
  .chip.medio { border-style: dashed; border-color: var(--amber); }
  #analiza { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--topH, 96px) + 8px); z-index: 44; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 7px 8px 7px 14px; font-size: 13px; font-weight: 650; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg); max-width: calc(100% - 24px); }
  #analiza button { border: 0; border-radius: 999px; padding: 4px 10px; background: color-mix(in srgb, var(--bg) 20%, transparent); color: inherit; font-weight: 700; cursor: pointer; }
  .t2 b.yr { color: var(--jade); font-weight: 750; }

  /* mis discos */
  .tarj .es { position: absolute; left: 7px; bottom: 7px; z-index: 1; font-size: 11px; font-weight: 800; color: #fff; border-radius: 7px; padding: 2px 7px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .tarj .imgw { position: relative; }
  .estados { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 7px; margin: 12px 0 6px; }
  .estados button { border: 1.5px solid var(--line-firm); background: var(--surface); color: inherit; border-radius: 12px; padding: 10px 6px; font-weight: 750; font-size: 13.5px; cursor: pointer; }
  .estados button.on { color: #fff; border-color: transparent; }
  .dcab { display: flex; gap: 14px; align-items: flex-start; }
  .dcab img, .dcab .ph { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; flex: none; box-shadow: var(--shadow-lg); }
  .dnav { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .dnav .btn { flex: 1; }

  /* repaso una a una */
  .rp { max-width: 520px; margin: 0 auto; text-align: center; }
  .rp .prog { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 6px 0 14px; }
  .rp .prog i { display: block; height: 100%; background: var(--amber); transition: width .2s; }
  .rp .port { width: min(62vw, 260px); aspect-ratio: 1; border-radius: 14px; object-fit: cover; box-shadow: var(--shadow-lg); background: var(--surface-2); display: grid; place-items: center; margin: 0 auto; }
  .rp h2 { margin: 14px 0 2px; font-size: 21px; }
  .rp .donde { font-size: 12.5px; color: var(--jade); font-weight: 700; min-height: 18px; margin-top: 4px; }
  .rp .dest { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 8px; }
  .rp .dest button { border: 1.5px solid var(--line-firm); background: var(--surface); border-radius: 14px; padding: 13px 8px; font-weight: 750; font-size: 15px; cursor: pointer; color: inherit; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 54px; }
  .rp .dest button.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .rp .dest button.ya { border-style: dashed; }
  .rp .dest button .k { font-size: 11px; opacity: .55; font-weight: 600; }
  .rp .dest button.malo { color: var(--rust); }
  .rp .dest button.malo.on { background: var(--rust); border-color: var(--rust); color: #fff; }
  .rp .dest button.olvido { flex-direction: column; gap: 2px; }
  .rp .dest button.olvido small { font-size: 11px; font-weight: 600; opacity: .7; }
  .rp .dest button.olvido.on { background: var(--fg-soft); border-color: var(--fg-soft); color: var(--bg); }
  .rep-g { background: var(--surface); border-radius: 16px; padding: 6px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .rep-g h4 { margin: 6px 8px 4px; font-size: 14px; }
  .rep-i { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; cursor: pointer; }
  .rep-i img, .rep-i .ph { width: 40px; height: 40px; border-radius: 6px; flex: none; object-fit: cover; background: var(--surface-2); }
  .rep-i .tx { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .rep-i .tx small { display: block; color: var(--fg-mute); }
  .rep-i .est { font-size: 12px; font-weight: 800; flex: none; padding: 4px 9px; border-radius: 99px; }
  .rep-i.si .est { background: var(--jade); color: #fff; }
  .rep-i.no { opacity: .55; }
  .rep-i.no .est { color: var(--rust); }
  .rep-i .pl { flex: none; }
  .rep-dist { margin: 2px 8px 6px; font-size: 12px; }
  .rp .nav { display: flex; gap: 8px; margin: 6px 0; }
  .rp .nav .btn { flex: 1; }
  .rp .pie { position: sticky; bottom: calc(86px + env(safe-area-inset-bottom)); margin-top: 14px; }

  /* rejilla de playlists, discos, artistas */
  .lista-obj { display: flex; flex-direction: column; gap: 2px; }
  .obj {
    display: flex; align-items: center; gap: 12px; padding: 7px 6px; border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .obj:hover { background: var(--surface); }
  .obj.sel { background: var(--amber-soft); }
  .obj img, .obj .ph { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); }
  .obj.red img, .obj.red .ph { border-radius: 50%; }
  .obj .t { flex: 1; min-width: 0; }
  .obj .t1 { font-weight: 650; }
  .obj .t2 { font-size: 13px; color: var(--fg-mute); }
  .obj .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-firm); flex: none; display: grid; place-items: center; color: var(--on-amber); }
  .obj.sel .ck { background: var(--amber); border-color: var(--amber); }
  .obj .ck svg { width: 13px; height: 13px; stroke-width: 3; opacity: 0; }
  .obj.sel .ck svg { opacity: 1; }
  .ph { display: grid; place-items: center; color: var(--fg-mute); }

  /* barra de seleccion + minirreproductor */
  .abajo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  .abajo > * { pointer-events: auto; max-width: 880px; margin: 0 auto; }
  .accion {
    background: var(--fg); color: var(--bg); border-radius: 16px; padding: 8px; margin-bottom: 8px;
    display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none;
    box-shadow: var(--shadow-lg);
    animation: sube .22s var(--ease-out);
  }
  .accion::-webkit-scrollbar { display: none; }
  .accion .cuantas { font-weight: 800; padding: 0 8px 0 6px; white-space: nowrap; font-size: 14px; }
  .accion button {
    border: 0; background: transparent; color: inherit; font-weight: 650; font-size: 13px;
    display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 9px; border-radius: 10px; cursor: pointer; white-space: nowrap;
  }
  .accion button:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }
  .accion button:active { transform: scale(0.95); }
  .accion button svg { width: 19px; height: 19px; }
  @keyframes sube { from { transform: translateY(12px); opacity: 0; } }
  .mini {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 7px; cursor: pointer;
  }
  .mini img, .mini .ph { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); }
  .mini .t { flex: 1; min-width: 0; }
  .mini .t1 { font-weight: 650; font-size: 14px; }
  .mini .t2 { font-size: 12px; color: var(--fg-mute); }
  .mini .prog { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .mini .prog i { display: block; height: 100%; background: var(--jade); width: 0; }
  .mini .btn { border: 0; background: transparent; padding: 8px; }

  /* hojas */
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 60; opacity: 0; transition: opacity .25s; }
  .velo.on { opacity: 1; }
  .hoja {
    position: fixed; left: 50%; bottom: 0; z-index: 61; width: min(560px, 100vw);
    max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg);
    padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translate(-50%, 100%); transition: transform .32s var(--ease-drawer);
  }
  .hoja.on { transform: translate(-50%, 0); }
  .hoja .asa { width: 38px; height: 5px; border-radius: 3px; background: var(--line-firm); margin: 2px auto 10px; }
  .hoja h2 { margin: 0 0 4px; }
  .opc { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .opc button, .opc a {
    display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; color: var(--fg);
    padding: 11px 8px; border-radius: 10px; font-size: 15px; font-weight: 550; cursor: pointer; text-decoration: none;
  }
  .opc button:hover, .opc a:hover { background: var(--surface); }
  .opc button.danger { color: var(--rust); }
  .opc .sub { font-size: 12.5px; color: var(--fg-mute); font-weight: 400; display: block; }
  .opc svg { width: 20px; height: 20px; color: var(--fg-soft); }
  .opc button.danger svg { color: var(--rust); }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translate(-50%, -20px); opacity: 0;
    background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; z-index: 80; font-weight: 600; font-size: 14px;
    transition: transform .25s var(--ease-out), opacity .25s; max-width: calc(100vw - 28px); display: flex; gap: 12px; align-items: center;
    box-shadow: var(--shadow-lg);
  }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
  .toast button { border: 0; background: transparent; color: var(--amber); font-weight: 800; cursor: pointer; padding: 0; }
  .progreso { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); z-index: 79;
    background: var(--surface); border: 1px solid var(--line-firm); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow-lg);
    width: min(420px, calc(100vw - 28px)); font-size: 14px; }
  .progreso .b { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 2px; overflow: hidden; }
  .progreso .b i { display: block; height: 100%; background: var(--amber); width: 0; transition: width .2s; }
  .vacio { text-align: center; color: var(--fg-mute); padding: 40px 20px; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--line-firm); border-top-color: var(--amber); border-radius: 50%; animation: gira .8s linear infinite; margin: 30px auto; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .hist { display: flex; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .hist .t { flex: 1; min-width: 0; }
  .hist.hecho .t { opacity: .5; text-decoration: line-through; }
  input[type=range] { width: 100%; accent-color: var(--amber); }
  .disp { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 10px; cursor: pointer; }
  .disp:hover { background: var(--surface); }
  .disp.on { color: var(--jade); font-weight: 700; }
  /* portadas en rejilla (playlists, estadisticas) */
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  @media (min-width: 700px) { .rejilla { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; } }
  .tarj { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .15s var(--ease-out); }
  .tarj:active { transform: scale(0.97); }
  .tarj.sel { outline: 3px solid var(--amber); }
  .tarj img, .tarj .ph { width: 100%; aspect-ratio: 1; object-fit: cover; display: grid; background: var(--surface-2); }
  .tarj .ph svg, .ph.grande svg { width: 38%; height: 38%; }
  .tarj.red img, .tarj.red .ph { border-radius: 50%; width: 84%; margin: 8% 8% 0; }
  .tarj .t { padding: 7px 8px 9px; }
  .tarj .t1 { font-weight: 700; font-size: 13.5px; }
  .tarj .t2 { font-size: 12px; color: var(--fg-mute); }
  .tarj .n { position: absolute; top: 8px; left: 8px; z-index: 1; background: var(--amber); color: var(--on-amber); font-weight: 800; font-size: 12px; border-radius: 7px; padding: 2px 7px; }
  .tarj .ck { position: absolute; top: 8px; right: 8px; z-index: 1; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.3); display: grid; place-items: center; color: #fff; }
  .tarj.sel .ck { background: var(--amber); border-color: var(--amber); }
  .tarj .ck svg { width: 13px; height: 13px; stroke-width: 3; opacity: 0; } .tarj.sel .ck svg { opacity: 1; }
  .opc .sec { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); padding: 14px 8px 4px; }
  .barra { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .barra i { display: block; height: 9px; background: var(--amber); border-radius: 5px; flex: none; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 20px; letter-spacing: -0.3px; } .kpi span { font-size: 12px; color: var(--fg-mute); }
  .rangos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  @media (min-width: 700px) { .rangos { grid-template-columns: repeat(4, 1fr); } .kpis { grid-template-columns: repeat(4, 1fr); } .seccion.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; } }
  .rango { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer; }
  .rango b { display: block; font-size: 14px; } .rango span { font-size: 12px; color: var(--fg-mute); }
  .rango.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); } .rango.on span { color: inherit; opacity: .8; }
  .seccion { background: color-mix(in srgb, var(--surface) 55%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 16px; margin-bottom: 14px; }
  .seccion h3 { margin: 4px 0 10px; display: flex; gap: 8px; align-items: center; }
  .sechead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; } .sechead h3 { flex: 1; min-width: 150px; }

  /* ============================================================
     DISEÑO 2026-09-30
     Oscuro profundo o claro cálido, color sacado de cada portada,
     navegación abajo en el móvil y barra lateral en el ordenador.
     ============================================================ */
  :root {
    --bg:#f6f2ec; --bg-2:#efe9e0; --surface:#ffffff; --surface-2:#ece6dc; --surface-3:#e2dace;
    --line:rgba(28,20,12,0.08); --line-firm:rgba(28,20,12,0.15);
    --fg:#17120d; --fg-soft:#4c4339; --fg-mute:#80766a;
    --amber:#c47a0a; --amber-soft:#f6e3c0; --on-amber:#ffffff;
    --jade:#128a64; --jade-soft:#d3ede3; --rust:#c2412f;
    --glass:rgba(255,255,255,0.72);
    --shadow-sm:0 1px 2px rgba(28,20,12,.05), 0 4px 14px rgba(28,20,12,.06);
    --shadow-md:0 8px 28px rgba(28,20,12,.12);
    --shadow-lg:0 18px 60px rgba(28,20,12,.22);
    --r:16px; --r-sm:11px;
    --f-disp:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
    --nav-h:0px; --side:0px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --bg:#0e0c0b; --bg-2:#141110; --surface:#1a1715; --surface-2:#24201d; --surface-3:#2f2a26;
      --line:rgba(255,236,210,0.07); --line-firm:rgba(255,236,210,0.14);
      --fg:#f8f2ea; --fg-soft:#cbbfae; --fg-mute:#91877a;
      --amber:#f4b13e; --amber-soft:rgba(244,177,62,0.15); --on-amber:#1c1305;
      --jade:#4fd1a1; --jade-soft:rgba(79,209,161,0.14); --rust:#ff7a66;
      --glass:rgba(26,23,21,0.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --shadow-md:0 10px 30px rgba(0,0,0,.45);
      --shadow-lg:0 20px 70px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e0c0b; --bg-2:#141110; --surface:#1a1715; --surface-2:#24201d; --surface-3:#2f2a26;
    --line:rgba(255,236,210,0.07); --line-firm:rgba(255,236,210,0.14);
    --fg:#f8f2ea; --fg-soft:#cbbfae; --fg-mute:#91877a;
    --amber:#f4b13e; --amber-soft:rgba(244,177,62,0.15); --on-amber:#1c1305;
    --jade:#4fd1a1; --jade-soft:rgba(79,209,161,0.14); --rust:#ff7a66;
    --glass:rgba(26,23,21,0.72);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.45);
    --shadow-lg:0 20px 70px rgba(0,0,0,.65);
  }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "cv11", "ss01"; letter-spacing: -0.006em;
    padding-bottom: calc(190px + env(safe-area-inset-bottom)); padding-left: var(--side); }
  ::selection { background: var(--amber-soft); }
  h2 { font-family: var(--f-disp); font-weight: 800; font-size: 24px; letter-spacing: -0.025em; line-height: 1.1; }
  h3 { font-family: var(--f-disp); font-weight: 750; font-size: 18px; letter-spacing: -0.02em; margin: 22px 0 10px; }
  main { padding: 14px 16px; max-width: 1100px; }
  main.entra { animation: entra .32s var(--ease-out); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } }

  /* cabecera */
  .top { background: color-mix(in srgb, var(--bg) 80%, transparent); border-bottom-color: transparent; box-shadow: 0 1px 0 var(--line); }
  .bar { max-width: 1100px; padding: 10px 16px 8px; }
  .logo { font-family: var(--f-disp); font-size: 21px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 9px; }
  .logo .marca { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, var(--amber), color-mix(in srgb, var(--amber) 55%, #d4568a)); color: var(--on-amber); box-shadow: var(--shadow-sm); }
  .logo .marca svg { width: 17px; height: 17px; stroke-width: 2.4; }
  .logo span { color: var(--fg-mute); font-weight: 650; }
  .btn.ghost.ico { border-radius: 999px; width: 38px; height: 38px; padding: 0; }
  .btn.ghost.ico:hover { background: var(--surface-2); }
  .cupo { background: var(--surface-2); border-color: transparent; }

  /* navegacion: abajo en el movil */
  .tabs { display: none; }
  .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: space-around;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--glass);
    backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px); box-shadow: 0 -1px 0 var(--line); }
  .bnav button { flex: 1; max-width: 96px; border: 0; background: transparent; color: var(--fg-mute); display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 650; padding: 5px 2px 3px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .bnav button svg { width: 23px; height: 23px; stroke-width: 1.9; transition: transform .2s var(--ease-out); }
  .bnav button.on { color: var(--fg); }
  .bnav button.on svg { stroke-width: 2.4; transform: translateY(-1px) scale(1.06); color: var(--amber); }
  .bnav button:active svg { transform: scale(.9); }
  :root { --nav-h: calc(62px + env(safe-area-inset-bottom)); }
  .abajo { bottom: var(--nav-h); padding-bottom: 8px; }
  .hoja { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

  /* ...y barra lateral en el ordenador */
  @media (min-width: 1000px) {
    :root { --nav-h: 0px; --side: 236px; }
    .bnav { display: none; }
    .tabs { display: flex; flex-direction: column; gap: 2px; position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); z-index: 41;
      padding: 18px 12px; margin: 0; max-width: none; overflow-y: auto; background: var(--bg-2); box-shadow: 1px 0 0 var(--line); }
    .tabs::before { content: "Fonoteca"; font-family: var(--f-disp); font-weight: 800; font-size: 24px; letter-spacing: -0.03em; padding: 4px 12px 16px; }
    .tab { justify-content: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 14.5px; color: var(--fg-soft); gap: 12px; }
    .tab svg { width: 20px; height: 20px; }
    .tab:hover { background: var(--surface-2); color: var(--fg); }
    .tab.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
    .tab.on svg { color: var(--amber); }
    .logo { visibility: hidden; }
    .abajo { left: var(--side); }
    .rejilla { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
  }

  /* botones, chips, campos */
  .btn { border-radius: 999px; padding: 9px 16px; font-weight: 650; border-color: var(--line-firm); background: var(--surface); box-shadow: none; }
  .btn:hover { background: var(--surface-2); }
  .btn.sm { border-radius: 999px; padding: 7px 13px; }
  .btn.pri { background: var(--amber); border-color: transparent; color: var(--on-amber); box-shadow: 0 6px 18px color-mix(in srgb, var(--amber) 35%, transparent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--amber) 88%, #fff); }
  .btn.danger { background: transparent; }
  .chip { border: 0; background: var(--surface-2); color: var(--fg-soft); padding: 7px 13px; font-weight: 650; transition: background .15s, color .15s, transform .12s var(--ease-out); }
  .chip:hover { background: var(--surface-3); color: var(--fg); }
  .chip.on { background: var(--fg); color: var(--bg); }
  .chip.fuerte { background: var(--amber); color: var(--on-amber); }
  .chip.medio { outline: 1.5px dashed var(--amber); outline-offset: -2px; }
  .field { border-radius: 14px; border-color: transparent; background: var(--surface-2); padding: 11px 14px; transition: background .15s, box-shadow .15s; }
  .field:focus { background: var(--surface); border-color: transparent; box-shadow: 0 0 0 2px var(--amber); }
  .herr .field { padding: 10px 14px; }
  .card, .seccion, .kpi, .rango { border-color: transparent; background: var(--surface); box-shadow: var(--shadow-sm); border-radius: var(--r); }
  .aviso { border-radius: var(--r); background: var(--amber-soft); }
  .ayuda { background: var(--surface); box-shadow: var(--shadow-sm); border-radius: var(--r); }

  /* cabecera grande con el color de la portada */
  .hero { position: relative; margin: -14px -16px 16px; padding: 12px 16px 22px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tinte, var(--surface-3)) 62%, var(--bg)) 0%, color-mix(in srgb, var(--tinte, var(--surface-3)) 22%, var(--bg)) 62%, var(--bg) 100%);
    transition: background .6s; }
  .hero .back { margin: 0 0 6px -6px; background: color-mix(in srgb, var(--bg) 35%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .back + .hero { margin-top: 0; padding-top: 8px; }
  .hero-in { display: flex; gap: 22px; align-items: flex-end; }
  .hero-in > img, .hero-in > .ph { width: 188px; height: 188px; border-radius: 14px; object-fit: cover; flex: none; box-shadow: 0 22px 50px rgba(0,0,0,.38); background: var(--surface-2); }
  .hero.red .hero-in > img, .hero.red .hero-in > .ph { border-radius: 50%; }
  .hero .txt { min-width: 0; flex: 1; }
  .hero .eti { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); }
  .hero h2 { font-size: clamp(26px, 5.4vw, 52px); line-height: 1.02; margin: 4px 0 8px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hero .soft.tiny, .hero .mute.tiny { font-size: 13px; }
  .hero .btnrow { margin-top: 14px !important; gap: 10px; align-items: center; }
  .hero .bplay { width: 54px; height: 54px; border-radius: 50%; padding: 0; }
  .hero .bplay svg { width: 22px; height: 22px; fill: currentColor; stroke-width: 0; margin-left: 2px; }
  @media (max-width: 640px) {
    .hero-in { flex-direction: column; align-items: center; text-align: center; gap: 16px; }
    .hero-in > img, .hero-in > .ph { width: min(50vw, 200px); height: min(50vw, 200px); }
    .hero .btnrow { justify-content: center; }
  }

  /* filas de canciones */
  .row { border-radius: 12px; padding: 0 6px 0 2px; transition: background .12s; }
  .row:hover { background: var(--surface-2); }
  .row.sel { background: var(--amber-soft); box-shadow: inset 3px 0 0 var(--amber); }
  .row img, .row .ph { width: 46px; height: 46px; border-radius: 8px; box-shadow: var(--shadow-sm); }
  .row .t1 { font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }
  .row .t2 { font-size: 13px; margin-top: 1px; }
  .row .ck { border-width: 2px; width: 23px; height: 23px; }
  .row.sel .ck, .obj.sel .ck { background: var(--amber); border-color: var(--amber); }
  .row.suena .t1 { color: var(--jade); }
  .row.suena .t1::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--jade); margin-right: 7px; vertical-align: 2px; animation: late 1.2s ease-in-out infinite; }
  @keyframes late { 50% { opacity: .35; } }
  .row .mas { opacity: .6; } .row:hover .mas { opacity: 1; }
  .selbar { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 8px 0; }

  /* listas de objetos */
  .obj { border-radius: 14px; padding: 8px; }
  .obj:hover { background: var(--surface-2); }
  .obj img, .obj .ph { width: 56px; height: 56px; border-radius: 10px; box-shadow: var(--shadow-sm); }
  .obj .t1 { font-weight: 680; letter-spacing: -0.01em; }

  /* tarjetas: la portada manda */
  .rejilla { gap: 14px 12px; }
  .tarj { background: transparent; border: 0; border-radius: 14px; overflow: visible; padding: 0; transition: transform .2s var(--ease-out); }
  .tarj:hover { transform: translateY(-3px); }
  .tarj:active { transform: scale(.97); }
  .tarj img, .tarj .ph, .tarj .imgw { border-radius: 14px; box-shadow: var(--shadow-md); }
  .tarj .imgw img { box-shadow: none; }
  .tarj .imgw { overflow: hidden; }
  .tarj .t { padding: 8px 2px 2px; }
  .tarj .t1 { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .tarj .t2 { font-size: 12.5px; }
  .tarj.sel { outline: 3px solid var(--amber); outline-offset: 3px; }
  .tarj.red img, .tarj.red .ph { box-shadow: var(--shadow-md); }
  .tarj .n { border-radius: 8px; box-shadow: var(--shadow-sm); }
  .tarj .es { border-radius: 999px; padding: 3px 9px; backdrop-filter: blur(4px); }

  /* barra de acciones y minirreproductor: cristal */
  .accion { background: color-mix(in srgb, var(--fg) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 22px; padding: 7px; box-shadow: var(--shadow-lg); }
  .accion button { border-radius: 14px; font-size: 12px; padding: 7px 10px; }
  .accion .cuantas { font-family: var(--f-disp); font-size: 18px; }
  .mini { position: relative; overflow: hidden; border: 0; border-radius: 18px; padding: 8px 8px 8px 8px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--tinte, var(--surface-2)) 55%, var(--surface)) 0%, var(--surface) 75%);
    box-shadow: var(--shadow-md); transition: background .6s; }
  .mini img, .mini .ph { width: 46px; height: 46px; border-radius: 10px; box-shadow: var(--shadow-sm); }
  .mini .t1 { font-weight: 700; }
  .mini .prog { position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2.5px; margin: 0; background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .mini .prog i { background: var(--fg); }
  .mini .btn { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
  .mini .btn[data-p="pp"] { background: var(--fg); color: var(--bg); }
  .mini .btn[data-p="pp"] svg { fill: currentColor; stroke-width: 0; }

  /* hojas, avisos y progreso */
  .velo { background: rgba(0,0,0,0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .hoja { background: var(--bg-2); border-radius: 28px 28px 0 0; padding-left: 20px; padding-right: 20px; }
  @media (min-width: 700px) { .hoja { bottom: 24px; border-radius: 28px; max-height: calc(100vh - 48px); } }
  .hoja .asa { width: 42px; background: var(--line-firm); margin-bottom: 14px; }
  .hoja h2 { font-size: 22px; }
  .opc button, .opc a { border-radius: 14px; padding: 12px 10px; font-weight: 580; }
  .opc button:hover, .opc a:hover { background: var(--surface); }
  .opc svg { width: 21px; height: 21px; color: var(--amber); }
  .opc .sec { padding-top: 18px; }
  .toast { border-radius: 999px; padding: 11px 18px; background: color-mix(in srgb, var(--fg) 94%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .progreso { border: 0; border-radius: 20px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow-md); }
  .progreso .b { height: 5px; border-radius: 3px; }
  .progreso .b i { border-radius: 3px; background: linear-gradient(90deg, var(--amber), color-mix(in srgb, var(--amber) 55%, #d4568a)); }

async function plReescribir(id, uris, et) {

const claveDia = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------------- TU HISTORIA ---------------- */
function historiaDe(ps) {
  const dias = new Map(), anyos = new Map(), meses = new Map(), arts = new Map(), decs = new Map();
  const horas = new Array(24).fill(0), sem = new Array(7).fill(0);
  let ms = 0, primero = Infinity;
  for (const p of ps) {
    const k = claveDia(p.added), d = new Date(p.added), y = d.getFullYear(), mk = k.slice(0, 7);
    (dias.get(k) || dias.set(k, []).get(k)).push(p);
    (anyos.get(y) || anyos.set(y, []).get(y)).push(p);
    (meses.get(mk) || meses.set(mk, []).get(mk)).push(p);
    const a = artPpal(p); if (a) (arts.get(a) || arts.set(a, []).get(a)).push(p);
    const r = anyo(p); if (r > 1900) { const dc = Math.floor(r / 10) * 10; (decs.get(dc) || decs.set(dc, []).get(dc)).push(p); }
    horas[d.getHours()]++; sem[(d.getDay() + 6) % 7]++;
    ms += p.ms || 0; if (p.added < primero) primero = p.added;
  }
  /* racha: dias seguidos dando Me gusta */
  const ks = Array.from(dias.keys()).sort();
  let racha = { n: 0 }, cur = { n: 0 };
  for (let i = 0; i < ks.length; i++) {
    const hoy = Date.parse(ks[i] + 'T12:00:00'), ant = i ? Date.parse(ks[i - 1] + 'T12:00:00') : 0;
    if (i && Math.round((hoy - ant) / 864e5) === 1) cur.n++; else cur = { n: 1, desde: ks[i] };
    cur.hasta = ks[i];
    if (cur.n > racha.n) racha = Object.assign({}, cur);
  }
  let diaTop = null; for (const [k, l] of dias) if (!diaTop || l.length > diaTop[1].length) diaTop = [k, l];
  let mesTop = null; for (const [k, l] of meses) if (!mesTop || l.length > mesTop[1].length) mesTop = [k, l];
  const porArt = Array.from(arts.entries()).sort((a, b) => b[1].length - a[1].length);
  return { ps, dias, anyos, meses, porArt, decs, horas, sem, ms, primero, racha, diaTop, mesTop };
}
const HI = { heat: '' };
function htmlCalor(H, anyoSel) {
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  let fin = hoy, ini;
  if (anyoSel) { fin = new Date(anyoSel, 11, 31, 12); if (fin > hoy) fin = hoy; ini = new Date(anyoSel, 0, 1, 12); }
  else { ini = new Date(hoy); ini.setDate(ini.getDate() - 364); }
  ini.setDate(ini.getDate() - (ini.getDay() + 6) % 7);
  const celdas = [], meses = [];
  let max = 1;
  for (let d = new Date(ini); d <= fin; d.setDate(d.getDate() + 1)) { const l = H.dias.get(claveDia(d)); if (l && l.length > max) max = l.length; }
  let semana = 0, total = 0;
  for (let d = new Date(ini); d <= fin; d.setDate(d.getDate() + 1)) {
    const k = claveDia(d), l = H.dias.get(k), n = l ? l.length : 0;
    const dentro = !anyoSel || d.getFullYear() === anyoSel;
    total += dentro ? n : 0;
    const lv = !n ? 0 : n / max > 0.66 ? 4 : n / max > 0.33 ? 3 : n / max > 0.12 ? 2 : 1;
    celdas.push('<i class="l' + (dentro ? lv : 'x') + '" data-d="' + k + '" title="' + k + ': ' + n + '"></i>');
    if ((d.getDay() + 6) % 7 === 0) { if (d.getDate() <= 7) meses.push('<span style="grid-column:' + (semana + 1) + '">' + MESES_ES[d.getMonth()].slice(0, 3) + '</span>'); semana++; }
  }
  return { html: '<div class="calor-sc"><div class="calor-m" style="grid-template-columns:repeat(' + semana + ',13px)">' + meses.join('') + '</div><div class="calor">' + celdas.join('') + '</div></div>', total };
}

/* ---------------- CÁPSULA DEL TIEMPO (Inicio) ---------------- */
function pintarCapsula(el, ps, vivo) {
  const hoy = new Date(), yy = hoy.getFullYear(), mm = hoy.getMonth();
  const por = new Map();
  for (const p of ps) { if (!p.added) continue; const d = new Date(p.added); if (d.getMonth() === mm && d.getFullYear() < yy) { const n = yy - d.getFullYear(); (por.get(n) || por.set(n, []).get(n)).push(p); } }
  const hace = Array.from(por.keys()).sort((a, b) => a - b);
  if (!hace.length) return;
  let sel = hace.indexOf(PREFS.capsula) >= 0 ? PREFS.capsula : hace[Math.floor(Math.random() * hace.length)];
  const pinta = () => {
    if (!vivo()) return;
    const l = por.get(sel).slice().sort((a, b) => a.added - b.added), ano = yy - sel;
    const vis = barajar(l.slice()).slice(0, 18);
    el.innerHTML = '<div class="capsula"><div class="fila-sec"><h3>Cápsula del tiempo</h3><button data-ir="1">Ver las ' + l.length + '</button></div>' +
      '<p class="soft tiny" style="margin:-4px 0 8px">Lo que te gustaba en ' + MESES_ES[mm] + ' de ' + ano + '</p>' +
      '<div class="chips" style="margin-bottom:10px">' + hace.map(n => '<button class="chip' + (n === sel ? ' on' : '') + '" data-n="' + n + '">Hace ' + n + ' año' + (n > 1 ? 's' : '') + '</button>').join('') + '</div>' +
      '<div class="carrusel">' + vis.map((p, i) => tarjetaMini(p.coverG || p.cover, p.title, nombresArtistas(p), 'data-i="' + i + '"')).join('') + '</div></div>';
    el.onclick = e => {
      const c = e.target.closest('[data-n]'); if (c) { sel = +c.dataset.n; PREFS.capsula = sel; guardarPrefs(); return pinta(); }
      if (e.target.closest('[data-ir]')) return abrirLista(MESES_ES[mm][0].toUpperCase() + MESES_ES[mm].slice(1) + ' de ' + ano, l);
      const t = e.target.closest('[data-i]'); if (t) { const p = vis[+t.dataset.i]; abrirLista(MESES_ES[mm][0].toUpperCase() + MESES_ES[mm].slice(1) + ' de ' + ano, l, l.indexOf(p)); }
    };
  };
  pinta();
}

/* ---------------- RULETA DE DISCOS ---------------- */
function ruleta(lista, alElegir) {
  if (!lista.length) return;
  const gana = Math.floor(Math.random() * lista.length);
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = Math.min(46, Math.max(24, lista.length * 3)), POS = N - 5;
  const tira = []; let o = Math.floor(Math.random() * lista.length);
  for (let i = 0; i < N; i++) tira.push(i === POS ? lista[gana] : lista[(o + i) % lista.length]);
  const el = document.createElement('div'); el.id = 'ruleta';
  el.innerHTML = '<div class="ru-in"><div class="ru-tit">' + ic('varita') + ' ¿Qué disco escucho?</div><div class="ru-vent"><div class="ru-flecha"></div><div class="ru-tira">' +
    tira.map((d, i) => '<div class="ru-c" data-i="' + i + '">' + (d.img ? '<img src="' + esc(d.img) + '" alt="">' : ph('disco')) + '</div>').join('') + '</div></div>' +
    '<div class="ru-res"><b>&nbsp;</b><span>&nbsp;</span></div><div class="ru-bot"><button class="btn" id="ruX">Cerrar</button><button class="btn" id="ruOtra" disabled>' + ic('recargar') + 'Otra vez</button><button class="btn pri" id="ruVer" disabled>Ver disco</button></div></div>';
  document.body.append(el);
  const t = el.querySelector('.ru-tira'), W = 156;
  const centro = i => el.querySelector('.ru-vent').clientWidth / 2 - W / 2 - i * W;
  t.style.transform = 'translateX(' + centro(2) + 'px)';
  const d = lista[gana];
  const fin = () => {
    el.querySelectorAll('.ru-c')[POS].classList.add('gana');
    el.querySelector('.ru-res').innerHTML = '<b>' + esc(d.name) + '</b><span>' + esc(d.artistas || '') + (d.p && anyo(d.p) ? ' · ' + anyo(d.p) : '') + '</span>';
    el.querySelector('#ruVer').disabled = el.querySelector('#ruOtra').disabled = false;
    try { navigator.vibrate && navigator.vibrate([20, 40, 30]); } catch (e) {}
  };
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (quieto) { t.style.transform = 'translateX(' + centro(POS) + 'px)'; fin(); return; }
    t.style.transition = 'transform 4.2s cubic-bezier(.1,.72,.12,1)';
    t.style.transform = 'translateX(' + (centro(POS) + (Math.random() * 60 - 30)) + 'px)';
    setTimeout(() => { t.style.transition = 'transform .35s var(--ease-out)'; t.style.transform = 'translateX(' + centro(POS) + 'px)'; setTimeout(fin, 360); }, 4250);
  }));
  const cerrar = () => { el.classList.add('fuera'); setTimeout(() => el.remove(), 250); };
  el.querySelector('#ruX').onclick = cerrar;
  el.onclick = e => { if (e.target === el) cerrar(); };
  el.querySelector('#ruOtra').onclick = () => { el.remove(); ruleta(lista, alElegir); };
  el.querySelector('#ruVer').onclick = () => { el.remove(); alElegir(d, gana); };
}

    let q, n = 0; do { q = pool[Math.floor(Math.random() * pool.length)]; } while ((anyo(q) === anyo(p) || q.uri === p.uri) && n++ < 300);

  };
  const pinta = h => {

function confeti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confeti'; c.width = innerWidth; c.height = innerHeight; document.body.append(c);
  const x = c.getContext('2d'), cols = ['#f4b13e', '#4fd1a1', '#ff7a66', '#9b87ff', '#5b9dff', '#ff6fa8'];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  let t = 0;
  const paso = () => {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }
    if (++t < 150) requestAnimationFrame(paso); else c.remove();
  };
  paso();
}

  /* lo que diga el nombre o la frase («salsa de cualquier época») también cuenta */

/* Meta semanal de discos: cuantos valoras cada semana (de lunes a domingo) */
const lunesDe = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); };
function metaDiscos() {
  const meta = PREFS.metaDiscos || 3, E = ETQ || ETQ0(), porSem = new Map();
  for (const o of Object.values(E.alb)) if (o && o.te) { const k = lunesDe(o.te); porSem.set(k, (porSem.get(k) || 0) + 1); }
  const esta = lunesDe(Date.now()), hechos = porSem.get(esta) || 0;
  let racha = 0, k = esta;
  if (hechos < meta) k -= 7 * 864e5;
  while ((porSem.get(k) || 0) >= meta) { racha++; k = lunesDe(k - 3 * 864e5); }

}

  const mx = Math.max(m.meta, ...sem.map(x => x[1]));

    '<div class="chips" id="mtN">' + [1, 2, 3, 4, 5, 7, 10].map(n => '<button class="chip' + (n === m.meta ? ' on' : '') + '" data-n="' + n + '">' + n + ' a la semana</button>').join('') + '</div>' +

const RX_OTRA = /\b(live|en vivo|en directo|directo|vivo|acoustic|acustic|acustica|unplugged|demo|take|remix|mix|edit|rework|vip|dub|instrumental|a cappella|acapella|karaoke|cover|sped up|slowed|reverb|session|rehearsal|outtake|alternate|extended|club|piano|orchestral|sinfonic|symphonic)\b/;
const RX_MISMA = /^(\d{4} )?(digital(ly)? )?remaster|remastered|remasteris|remasteriz|^\d+(st|nd|rd|th) anniversary|^feat\b|^ft\b|^featuring|^with |^con |^from |^de la pelicula|^bso|soundtrack|^explicit|^clean$|^deluxe( edition| version)?$|bonus|^(album|lp|original|single|original album|stereo album) version$|^\d{4}$/;
const RX_FEAT = /^(feat\b|ft\b|featuring|with |con )/;
const _PT = new WeakMap();
function partesTitulo(p) {
  const c = _PT.get(p); if (c) return c;
  let t = fold(p.title); const extra = [];
  t = t.replace(/\s*[\(\[]([^\)\]]*)[\)\]]/g, (m, x) => (extra.push(x.trim()), ' '));
  const i = t.indexOf(' - '); if (i > 0) { t.slice(i + 3).split(/ - | \/ /).forEach(x => extra.push(x.trim())); t = t.slice(0, i); }
  const limpio = x => x.replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const resto = extra.filter(x => x && (RX_OTRA.test(x) || !RX_MISMA.test(x))).map(limpio).sort();
  const feat = extra.filter(x => RX_FEAT.test(x) && !RX_OTRA.test(x)).map(limpio).sort().join(',');
  const r = { k: limpio(t) + (resto.length ? ' (' + resto.join(', ') + ')' : '') + '|' + fold((p.artists[0] || {}).name), feat: feat };
  _PT.set(p, r); return r;
}
const claveObra = p => partesTitulo(p).k;
/* ¿la misma grabación? mismo título limpio y casi la misma duración (una
   «single version» suele ser más corta; con otros invitados, casi idéntica) */
function mismaGrabacion(a, b) {
  if (a.uri === b.uri) return true;
  if (claveObra(a) !== claveObra(b)) return false;
  const D = PREFS.distintas || []; if (D.indexOf(parDe(a.uri, b.uri)) >= 0) return false;
  if (!a.ms || !b.ms) return true;
  return Math.abs(a.ms - b.ms) <= (partesTitulo(a).feat === partesTitulo(b).feat ? 8000 : 3000);
}
const parDe = (x, y) => x < y ? x + '|' + y : y + '|' + x;
/* recorre en orden y dice cuáles repiten una anterior */
function marcadorRepes() {
  const m = new Map();
  return p => { const k = claveObra(p), l = m.get(k) || []; const r = l.some(x => mismaGrabacion(x, p)); l.push(p); m.set(k, l); return r; };
}

/* Quitar de la fuente. En una playlist: si ninguna de las quitadas se queda
   repetida en otro sitio de la lista, basta un DELETE por uri (y las demas
   conservan su fecha); si no, se reescribe la lista sin ellas. */
async function quitarDeFuente(ps, sinPreguntar, msg) {
  const f = S.fuente;
  if (!f.editable) return;
  if (!sinPreguntar && !(await confirmar('¿Quitar ' + ps.length + ' de «' + f.name + '»?', 'Quitar', 'Se puede deshacer desde Cambios.'))) return;
  const fuera = new Set(ps.map(p => p.k));
  const quedan = f.pistas.filter(p => !fuera.has(p.k));
  const ok = await trabajo(async () => {
    if (f.kind === 'likes') {
      const uris = Array.from(new Set(ps.map(p => p.uri)));
      await libQuitar(uris, 'Quitando de Me gusta');
      apuntar(uris.length + ' quitadas de Me gusta', { t: 'libPoner', uris: uris });
    } else {
      const antes = f.pistas.map(p => p.uri);
      const urisFuera = new Set(ps.map(p => p.uri));
      const limpio = !quedan.some(p => urisFuera.has(p.uri));
      if (limpio) await plQuitar(f.id, Array.from(urisFuera), 'Quitando de «' + f.name + '»');
      else await plReescribir(f.id, quedan.map(p => p.uri), 'Reescribiendo «' + f.name + '»');
      apuntar(ps.length + ' quitadas de «' + f.name + '»', { t: 'reescribir', pid: f.id, uris: antes });

  if (!ok) return;
  f.pistas = quedan; S.sel.clear(); S.playlists = null; if (f.kind === 'likes') S.likes = quedan;
  toast(msg || ps.length + ' quitadas', { txt: 'Deshacer', fn: () => deshacerUltimo(HIST[0].id) });
  recalcular(); pintarAccion();
  const h = document.querySelector('.cab .tiny'); if (h) h.textContent = f.pistas.length + ' canciones';
}

/* Mover la seleccion arriba o abajo del todo. Con pocas se hace con la
   ruta de reordenar (una a una, las fechas se conservan); con muchas se
   reescribe la lista, que es una sola tanda de peticiones. */
async function moverDentro(ps, arriba) {
  const f = S.fuente;
  const sel = new Set(ps.map(p => p.k));
  const elegidas = f.pistas.filter(p => sel.has(p.k)), resto = f.pistas.filter(p => !sel.has(p.k));
  const nueva = arriba ? elegidas.concat(resto) : resto.concat(elegidas);
  await aplicarOrden(nueva, elegidas.length + (arriba ? ' subidas arriba' : ' bajadas al final') + ' en «' + f.name + '»', elegidas.length <= 15 ? { elegidas, arriba } : null);
}
async function aplicarOrden(nueva, txt, pocas) {
  const f = S.fuente;
  const antes = f.pistas.map(p => p.uri);
  const ok = await trabajo(async () => {
    if (pocas) {
      /* se simula la lista para saber la posicion de cada una en cada paso */
      const cur = f.pistas.slice();
      for (let i = 0; i < pocas.elegidas.length; i++) {
        progreso('Moviendo', i, pocas.elegidas.length);
        const p = pocas.elegidas[i];
        const desde = cur.indexOf(p);
        if (pocas.arriba ? desde === i : desde === cur.length - 1) continue;
        await plMoverUna(f.id, desde, pocas.arriba ? i : cur.length);
        cur.splice(desde, 1);
        cur.splice(pocas.arriba ? i : cur.length, 0, p);
      }
    } else await plReescribir(f.id, nueva.map(p => p.uri), 'Guardando el orden');
    apuntar(txt, { t: 'reescribir', pid: f.id, uris: antes });
    return true;
  }, 'Guardando el orden');
  if (!ok) return;
  f.pistas = nueva; S.orden = '';
  const sel = $('#fO'); if (sel) sel.value = '';
  toast(txt, { txt: 'Deshacer', fn: () => deshacerUltimo(HIST[0].id) });
  recalcular();
}

/* Spotify pide JPEG en base64 de 256 KB como mucho: se recorta al cuadrado
   del centro y se baja la calidad hasta que cabe. */
async function jpegCuadrado(file) {
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se puede leer la imagen')); i.src = URL.createObjectURL(file); });
  const lado = Math.min(img.naturalWidth, img.naturalHeight);
  for (const px of [640, 512, 400]) {
    const c = document.createElement('canvas'); c.width = c.height = px;
    c.getContext('2d').drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, px, px);
    for (let q = 0.9; q >= 0.5; q -= 0.1) {
      const b64 = c.toDataURL('image/jpeg', q).split(',')[1];
      if (b64.length <= 250000) return b64;
    }
  }
  throw new Error('La imagen es demasiado grande');
}

/* Reparte para que no suenen dos seguidas del mismo artista: se van
   sacando del artista con mas canciones pendientes que no sea el ultimo. */
function repartirArtistas(ps) {
  const grupos = new Map();
  for (const p of barajar(ps.slice())) { const a = fold((p.artists[0] || {}).name); if (!grupos.has(a)) grupos.set(a, []); grupos.get(a).push(p); }
  const out = []; let ultimo = null;
  while (out.length < ps.length) {
    let mejor = null;
    for (const [a, l] of grupos) if (l.length && a !== ultimo && (!mejor || l.length > grupos.get(mejor).length)) mejor = a;
    if (mejor == null) mejor = ultimo;
    out.push(grupos.get(mejor).pop()); ultimo = mejor;
  }
  return out;
}
/* Repetidas en Me gusta, agrupadas, para elegir con cuál te quedas. Por
   defecto: la del disco original (no recopilatorio ni single), la más antigua. */
function gruposRepetidas(ps) {
  const g = new Map();
  for (const p of ps) { if (p.local) continue; const k = claveObra(p); if (!g.has(k)) g.set(k, []); g.get(k).push(p); }
  const peso = p => ({ album: 0, single: 1, compilation: 2 })[p.albumType] ?? 1;
  const enPl = p => S.indice ? (S.indice.m.get(p.uri) || []).length : 0;
  const out = [];
  const sub = [];
  for (const l of g.values()) {
    const u = new Map(); for (const p of l) if (!u.has(p.uri)) u.set(p.uri, p);
    if (u.size < 2) continue;
    /* separa en grupos de la misma grabación (por duración) */
    const gs = [];
    for (const p of u.values()) { const x = gs.find(gg => gg.every(q => mismaGrabacion(q, p))); if (x) x.push(p); else gs.push([p]); }
    for (const gg of gs) if (gg.length > 1) sub.push(gg);
  }
  for (const l of sub) {
    const xs = l.slice().sort((a, b) => (enPl(b) - enPl(a)) || (peso(a) - peso(b)) || ((+a.year || 9999) - (+b.year || 9999)) || (a.added - b.added));
    out.push(xs);
  }
  return out.sort((a, b) => artPpal(a[0]).localeCompare(artPpal(b[0])) || a[0].title.localeCompare(b[0].title));
}

/* El color de una portada: se reduce a 12x12 y se hace la media pesando
   mas los pixeles con color (los grises casi no cuentan). */
const _colores = new Map();
function colorDe(url) {
  return new Promise(ok => {
    if (!url) return ok(null);
    if (_colores.has(url)) return ok(_colores.get(url));
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 12;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, 12, 12);
        const d = x.getImageData(0, 0, 12, 12).data;
        let r = 0, g = 0, b = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) { const R = d[i], G = d[i + 1], B = d[i + 2], sat = (Math.max(R, G, B) - Math.min(R, G, B)) / 255, w = 0.08 + sat * sat * 3; r += R * w; g += G * w; b += B * w; n += w; }
        r /= n; g /= n; b /= n;
        /* ni muy oscuro ni quemado */
        const l = (Math.max(r, g, b) + Math.min(r, g, b)) / 2, k = l < 70 ? 70 / Math.max(l, 1) : l > 190 ? 190 / l : 1;
        const col = 'rgb(' + [r, g, b].map(v => Math.round(Math.min(255, v * k))).join(',') + ')';
        _colores.set(url, col); ok(col);
      } catch (e) { _colores.set(url, null); ok(null); }
    };
    im.onerror = () => { _colores.set(url, null); ok(null); };
    im.src = url;
  });
}

/* ============================================================
   MIS ARTISTAS
   ------------------------------------------------------------
   Tu lista propia de artistas, aparte de los que sigues en
   Spotify (vienen del antiguo MusicVault, con sus etiquetas,
   notas y valoraciones). Vive en este aparato y se sincroniza
   con mis-artistas.json en tu repo de GitHub.
   Fusion: por artista, gana el cambio mas reciente (t); un
   borrado deja una tumba y no revive salvo que se vuelva a
   tocar despues.
   ============================================================ */
const K_MIS = 'mando_mis_artistas_v1';
const K_GH = 'musicvault_github_v1';          // token + repo, el mismo que usaba el vault
const K_MIGRADO = 'mando_migrado_vault_v1';

const misSync = { at: 0, msg: '', err: false, corriendo: false, t: 0 };

const tagPorId = id => MIS.tags.find(t => t.id === id);

function fundirMis(a, b) {
  if (!b) return a;
  if (!a) return b;
  const tumbas = new Map();
  for (const t of (a.tumbas || []).concat(b.tumbas || [])) if (!tumbas.has(t.id) || tumbas.get(t.id) < t.at) tumbas.set(t.id, t.at);
  const m = new Map();
  for (const x of (a.artistas || []).concat(b.artistas || [])) { const p = m.get(x.id); if (!p || (x.t || 0) > (p.t || 0)) m.set(x.id, x); }
  const artistas = Array.from(m.values()).filter(x => !(tumbas.has(x.id) && tumbas.get(x.id) >= (x.t || 0)));
  const tags = new Map();
  for (const t of (b.tags || []).concat(a.tags || [])) tags.set(t.id, t);
  /* las tumbas de mas de un año ya no hacen falta */
  const lim = Date.now() - 365 * 864e5;
  return { app: 'MisArtistas', version: 1, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0),
    artistas: artistas.sort((x, y) => (y.added || 0) - (x.added || 0)), tags: Array.from(tags.values()),
    tumbas: Array.from(tumbas, ([id, at]) => ({ id, at })).filter(t => t.at > lim) };
}

  const res = await ghFetch(api + '?ref=main&t=' + Date.now());
  if (res.status === 401 || res.status === 403) throw new Error('el token de GitHub no tiene permiso sobre ' + g.repo);
  if (res.status === 404) return { sha: null, datos: null, api };
  if (!res.ok) throw new Error('GitHub respondió ' + res.status);
  const d = await res.json();
  /* por encima de 1 MB la API no trae el contenido: se pide en crudo */
  const crudo = await ghFetch(api + '?ref=main&t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw' } });
  if (!crudo.ok) throw new Error('GitHub respondió ' + crudo.status);
  return { sha: d.sha, datos: JSON.parse(await crudo.text()), api };
}
async function sincronizarMis(manual) {
  if (!MIS) return;
  if (!ghCfg()) { misSync.msg = 'Solo en este aparato'; pintarEstadoSync(); if (manual) hojaAjustes(); return; }
  if (misSync.corriendo) return;
  misSync.corriendo = true; misSync.msg = 'Sincronizando…'; pintarEstadoSync();
  try {
    for (let intento = 0; intento < 3; intento++) {
      const r = await ghLeer();
      const antes = MIS.artistas.length;
      const fundido = fundirMis(MIS, r.datos);
      const cuerpo = JSON.stringify(fundido);
      const traidos = fundido.artistas.length - antes;
      MIS = fundido; misGuardarLocal();
      if (r.datos && JSON.stringify(r.datos) === cuerpo) { hechoSync(traidos, manual); return; }
      const put = await ghFetch(r.api, { method: 'PUT', body: JSON.stringify({ message: 'mis artistas: ' + fundido.artistas.length, content: b64enc(cuerpo), branch: 'main', sha: r.sha || undefined }) });
      if (put.status === 409 || put.status === 422) continue;   // otro aparato escribio a la vez: se vuelve a fundir
      if (!put.ok) throw new Error('no he podido subirlo (' + put.status + ')');
      hechoSync(traidos, manual); return;
    }
    throw new Error('otro aparato estaba escribiendo; prueba otra vez');
  } catch (e) {
    misSync.err = true; misSync.msg = 'Error al sincronizar: ' + e.message;
    if (manual) toast(misSync.msg);
  } finally { misSync.corriendo = false; pintarEstadoSync(); }
}
function hechoSync(traidos, manual) {
  misSync.err = false; misSync.at = Date.now();
  misSync.msg = 'Sincronizado a las ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + (traidos > 0 ? ' · ' + traidos + ' traídos del otro aparato' : '');
  if (manual) toast('Sincronizado');
  if (traidos && S.tab === 'mis' && !S.vista) render();
}
function pintarEstadoSync() {
  const el = $('#misSync'); if (!el) return;
  el.textContent = misSync.msg || (ghCfg() ? 'Se guarda también en GitHub' : 'Solo en este aparato');
  el.style.color = misSync.err ? 'var(--rust)' : '';
}

function misAnadir(arts) {
  const now = Date.now();
  const nuevos = [];
  for (const a of arts) {
    if (!a || !a.id || misPorId(a.id)) continue;
    const o = { id: a.id, name: a.name || '', img: imgDe(a.images, 200) || a.img || '', added: now, t: now };
    if (a.genres && a.genres.length) o.genres = a.genres.slice(0, 8);
    MIS.artistas.unshift(o); nuevos.push(o);
  }
  if (nuevos.length) { apuntar(nuevos.length === 1 ? '«' + nuevos[0].name + '» a Mis artistas' : nuevos.length + ' a Mis artistas', { t: 'misQuitar', ids: nuevos.map(x => x.id) }); misCambiado(); }
  return nuevos.length;
}
function misQuitar(ids, sinApuntar) {
  const fuera = new Set(ids), now = Date.now();
  const quitados = MIS.artistas.filter(a => fuera.has(a.id));
  MIS.artistas = MIS.artistas.filter(a => !fuera.has(a.id));
  for (const id of ids) MIS.tumbas.push({ id, at: now });
  if (!sinApuntar) apuntar(quitados.length === 1 ? '«' + quitados[0].name + '» fuera de Mis artistas' : quitados.length + ' fuera de Mis artistas', { t: 'misPoner', artistas: quitados });
  misCambiado();
  return quitados.length;
}
function misRestaurar(arts) {
  const now = Date.now();
  const ids = new Set(arts.map(a => a.id));
  MIS.tumbas = MIS.tumbas.filter(t => !ids.has(t.id));
  for (const a of arts) if (!misPorId(a.id)) { MIS.artistas.unshift(Object.assign({}, a, { t: now })); _misIdx = null; }
  misCambiado();
}
function misEditar(id, cambios) {
  const a = misPorId(id); if (!a) return;
  Object.assign(a, cambios, { t: Date.now() });
  for (const k of Object.keys(cambios)) if (cambios[k] === '' || cambios[k] === 0 || (Array.isArray(cambios[k]) && !cambios[k].length)) delete a[k];
  misCambiado();
}

function misVisibles() {
  const q = fold(S.filtro).trim().split(/\s+/).filter(Boolean);

  }
  if (MV.sigo && MV.soloNo) v = v.filter(a => !MV.sigo.has(a.id));
  if (q.length) v = v.filter(a => { const s = fold(a.name + ' ' + (a.notes || '') + ' ' + (a.genres || []).join(' ')); return q.every(w => s.indexOf(w) >= 0); });

function subMis(a) {

/* Desde «Seguidos» o una seleccion de canciones: pasar artistas a la lista */
/* Antes se pedia a Spotify cada artista uno a uno, y esa ruta Spotify la
   limita muchisimo: con cientos de artistas te ponia en pausa. Ahora se usa
   lo que ya se sabe (nombre en las canciones, foto en «Seguidos») y la foto
   que falte se completa sola al abrir el artista. */
function artistasConocidos() {
  const m = new Map();
  for (const a of (S.segCache || [])) m.set(a.id, { id: a.id, name: a.name, img: a.imgG || a.img || '', genres: a.generos });
  const mete = a => { if (a && a.id && !m.has(a.id)) m.set(a.id, { id: a.id, name: a.name, img: a.img || '' }); };
  for (const a of (S.artistas || [])) m.set(a.id, { id: a.id, name: a.name, img: a.imgG || a.img || '', genres: a.generos });
  const listas = [S.fuente && S.fuente.pistas, S.likes, S.visibles].concat(Object.values(ST.datos || {}).map(d => d && d.tracks));
  for (const l of listas) if (l) for (const p of l) for (const a of (p.artists || [])) mete(a);
  for (const d of Object.values(ST.datos || {})) if (d && d.arts) for (const a of d.arts) m.set(a.id, { id: a.id, name: a.name, img: a.imgG || a.img || '', genres: a.generos });
  return m;
}
async function aMisDesdeUris(uris) {
  const ids = Array.from(new Set(uris.map(u => String(u).split(':')[2]).filter(Boolean))).filter(id => !misPorId(id));
  if (!ids.length) { toast('Ya estaban todos en Mis artistas'); return; }
  const con = artistasConocidos();
  const arts = ids.map(id => con.get(id)).filter(a => a && a.name);
  const faltan = ids.filter(id => !con.has(id) || !con.get(id).name).slice(0, 15);

  toast(misAnadir(arts) + ' añadidos a Mis artistas');
}

/* ============================================================
   GENEROS Y ETIQUETAS DE CADA CANCION
   Los generos son del artista (Spotify no los da por cancion).
   Primero se miran los que ya hay en Mis artistas y en la
   memoria de este aparato; solo se pregunta por los que faltan.
   Tus etiquetas (Generos, Subgeneros, Ambiente, Origen) salen de
   Mis artistas, sin gastar ni una peticion.
   ============================================================ */
const K_GEN = 'mando_generos_v1';
let GEN = leer(K_GEN, {});
function generosArtista(id) {
  if (GEN[id]) return GEN[id];
  const m = MIS && misPorId(id);
  return m && m.genres ? m.genres : null;
}
/* Spotify ya no da generos de artista (y pedirlos gastaba cupo de la parte
   que mas frena). Ahora salen de Mis artistas y de Last.fm. */
function faltanGeneros(ps) {
  const v = new Set();
  for (const p of ps) for (const a of p.artists.slice(0, 2)) if (artistaSinGenero(a)) v.add(fold(a.name));
  return Array.from(v);
}
async function cargarGeneros(ps) {
  await misAsegurar(); await etqAsegurar();
  if (!lfCfg()) { toast('Para los géneros hace falta tu clave de Last.fm: ponla en Ajustes', null, 6000); return; }
  const vistos = new Set(), nombres = [];
  for (const p of ps) for (const a of p.artists.slice(0, 2)) { const k = fold(a.name); if (!vistos.has(k) && artistaSinGenero(a)) { vistos.add(k); nombres.push(a.name); } }
  for (let i = 0; i < nombres.length; i++) {
    if (_parar) break;
    progreso('Géneros de los artistas (Last.fm)', i, nombres.length);
    try { const g = await lfArtista(nombres[i]); if (g) ETQ.lfa[fold(nombres[i])] = { g: g, at: Date.now() }; }
    catch (e) { toast(e.message); break; }
    if (i % 20 === 19) etqCambio();
    await sleep(260);
  }
  etqCambio();
}
const generosDe = p => Array.from(new Set(generosCancion(p).map(x => String(x).toLowerCase())));
function etiquetasDe(p) {
  if (!MIS) return [];
  const out = new Set();
  for (const a of p.artists) { const m = misPorId(a.id); if (m && m.tags) m.tags.forEach(t => out.add(t)); }
  return Array.from(out);
}
const decadaDe = p => { const y = anyo(p); return y ? Math.floor(y / 10) * 10 : null; };
const nombreDecada = d => d == null ? 'Sin año' : (d >= 2000 ? 'Años ' + d : 'Años ' + String(d).slice(2));
function contar(ps, fn) {
  const m = new Map();
  for (const p of ps) for (const k of [].concat(fn(p))) if (k != null && k !== '') m.set(k, (m.get(k) || 0) + 1);
  return Array.from(m).sort((a, b) => b[1] - a[1]);
}
const carpetaDe = t => { const tg = tagPorId(t); return tg ? (tg.carpeta ? (tagPorId(tg.carpeta) || {}).name : '') : ''; };

/* ============================================================
   FILTRAR Y CREAR
   Grupos que se combinan: dentro de un grupo vale cualquiera
   de lo marcado; entre grupos se tienen que cumplir todos.
   ============================================================ */
async function hojaFiltrar(f) {
  await misAsegurar();
  await etqAsegurar();
  const F = f._filtro || (f._filtro = { dec: new Set(), gen: new Set(), tag: new Set(), art: new Set(), eq: {}, desde: '', hasta: '', min: '', max: '', dias: '', like: '' });
  F.eq = F.eq || {};
  const ps = f.pistas;
  const cumple = (p, sin) => {
    if (sin !== 'dec' && F.dec.size && !F.dec.has(String(decadaDe(p)))) return false;
    if (F.desde && (!anyo(p) || anyo(p) < +F.desde)) return false;
    if (F.hasta && (!anyo(p) || anyo(p) > +F.hasta)) return false;
    for (const gg in F.eq) { if (sin === 'eq:' + gg || !F.eq[gg].size) continue; const x = etiquetasCancion(p)[gg]; if (!x || !Array.from(F.eq[gg]).some(n => x.has(n))) return false; }
    if (sin !== 'gen' && F.gen.size && !generosDe(p).some(g => F.gen.has(g))) return false;
    if (sin !== 'tag' && F.tag.size && !etiquetasDe(p).some(t => F.tag.has(t))) return false;
    if (sin !== 'art' && F.art.size && !p.artists.some(a => F.art.has(a.name))) return false;
    if (F.min && p.ms < F.min * 60000) return false;
    if (F.max && p.ms > F.max * 60000) return false;
    if (F.dias && (!p.added || p.added < Date.now() - F.dias * 864e5)) return false;
    if (F.like && f._likes && (F.like === 'si') !== !!f._likes.get(p.uri)) return false;
    return true;
  };
  const pinta = h => {
    const chips = (grupo, pares, nombre) => pares.map(([k, n]) => '<button class="chip' + (F[grupo].has(String(k)) ? ' on' : '') + '" data-g="' + grupo + '" data-k="' + esc(String(k)) + '">' + esc(nombre ? nombre(k) : k) + ' <span style="opacity:.6;font-weight:400">' + n + '</span></button>').join('');
    const base = g => ps.filter(p => cumple(p, g));
    const decs = contar(base('dec'), p => String(decadaDe(p))).sort((a, b) => a[0] < b[0] ? -1 : 1);
    const falt = faltanGeneros(ps).length;
    const gens = contar(base('gen'), generosDe).slice(0, 40);
    const tagsC = contar(base('tag'), etiquetasDe).filter(([t]) => tagPorId(t) && !tagPorId(t).esCarpeta);
    const porCarpeta = {};
    for (const [t, n] of tagsC) { const c = carpetaDe(t) || 'Otras'; (porCarpeta[c] = porCarpeta[c] || []).push([t, n]); }
    const orden = ['Ambiente', 'Géneros', 'Subgéneros', 'Origen'];
    const arts = contar(base('art'), p => p.artists.map(a => a.name)).slice(0, 30);
    const res = ps.filter(p => cumple(p));
    h.querySelector('#fzC').innerHTML =
      '<label class="lbl">Década</label><div class="chips">' + chips('dec', decs, k => nombreDecada(k === 'null' ? null : +k)) + '</div>' +
      '<label class="lbl">Año</label><div class="herr" style="margin:0"><input class="field" data-c="desde" inputmode="numeric" placeholder="desde" value="' + F.desde + '"><input class="field" data-c="hasta" inputmode="numeric" placeholder="hasta" value="' + F.hasta + '"></div>' +

    h.querySelector('#fzN').textContent = res.length + ' de ' + ps.length + ' canciones';

    const g = h.querySelector('#fzGen');
    if (g) g.onclick = async () => { cerrarHoja(); await trabajo(() => cargarGeneros(ps), 'Mirando géneros'); hojaFiltrar(f); };
  };
  hoja('<h2>Filtrar «' + esc(f.name) + '»</h2><p class="soft tiny">Marca lo que quieras. Dentro de cada apartado vale cualquiera de lo marcado; entre apartados se tienen que cumplir todos.</p>' +
    '<div id="fzC"></div>' +

    (f.editable ? '<button class="btn danger" id="fzQuitar">' + ic('papelera') + '</button>' : '') + '</div></div>', h => {
      pinta(h);
      h.querySelector('#fzC').addEventListener('click', async e => {
        const c = e.target.closest('[data-g]');
        if (c) { const s = c.dataset.g === 'eq' ? (F.eq[c.dataset.gg] = F.eq[c.dataset.gg] || new Set()) : F[c.dataset.g]; s.has(c.dataset.k) ? s.delete(c.dataset.k) : s.add(c.dataset.k); pinta(h); return; }
        if (e.target.closest('#fzAn')) { cerrarHoja(); hojaAnalizar(f); return; }

          F[c1.dataset.c1] = c1.dataset.v;
          if (c1.dataset.c1 === 'like' && c1.dataset.v && !f._likes) {

            if (!r) { F.like = ''; } else f._likes = new Map(cand.map((p, i) => [p.uri, r[i]]));
          }
          pinta(h);
        }
      });
      h.querySelector('#fzC').addEventListener('change', e => { const c = e.target.dataset.c; if (c) { F[c] = e.target.value.trim().replace(',', '.'); pinta(h); } });
