      h.querySelector('#fzCrear').onclick = () => {
        const res = h._res; if (!res.length) { toast('No queda ninguna'); return; }
        cerrarHoja(); hojaNuevaPlaylist(res.filter(p => !p.local).map(p => p.uri), f.name + ' · ' + nombreFiltro(F));
      };
      h.querySelector('#fzSel').onclick = () => { S.sel = new Set(h._res.map(p => p.k)); cerrarHoja(); recalcular(); pintarAccion(); toast(S.sel.size + ' marcadas: usa la barra de abajo'); };
      const q = h.querySelector('#fzQuitar');
      if (q) q.onclick = () => { const res = h._res; if (!res.length) return; cerrarHoja(); S.sel = new Set(res.map(p => p.k)); recalcular(); pintarAccion(); quitarDeFuente(res); };
    });
}
function nombreFiltro(F) {
  const p = [];
  for (const gg in (F.eq || {})) if (F.eq[gg].size) p.push(Array.from(F.eq[gg]).join(' + '));
  if (F.tag.size) p.push(Array.from(F.tag).map(t => (tagPorId(t) || {}).name).join(' + '));
  if (F.gen.size) p.push(Array.from(F.gen).join(' + '));
  if (F.dec.size) p.push(Array.from(F.dec).map(d => nombreDecada(d === 'null' ? null : +d)).join(' + '));
  if (F.desde || F.hasta) p.push((F.desde || '…') + '-' + (F.hasta || '…'));
  if (F.art.size) p.push(Array.from(F.art).join(' + '));
  return p.join(' · ').slice(0, 80) || 'filtrada';
}

/* ============================================================
   DIVIDIR
   ============================================================ */
async function hojaDividir(f) {
  await misAsegurar();
  await etqAsegurar();
  const criterios = [['decada', 'Por década (año real)'], ['e:ambiente', 'Por mood'], ['e:genero', 'Por género'], ['e:sub', 'Por subgénero'], ['e:idioma', 'Por idioma'], ['e:tipo', 'Por tipología'], ['e:epoca', 'Por épocas'], ['e:origen', 'Por origen'], ['e:mis', 'Por mis etiquetas'], ['artista', 'Por artista'], ['anadida', 'Por año en que la añadiste'], ['tam', 'En trozos del mismo tamaño']];
  let crit = 'decada', min = 10, tam = 100;
  const grupos = () => {
    const ps = f.pistas.filter(p => !p.local);
    const g = new Map();
    const meter = (k, p) => { if (!k) return; if (!g.has(k)) g.set(k, []); g.get(k).push(p); };
    if (crit === 'tam') { for (let i = 0; i < ps.length; i += tam) g.set('Parte ' + (i / tam + 1), ps.slice(i, i + tam)); return Array.from(g); }
    for (const p of ps) {
      if (crit === 'decada') meter(nombreDecada(decadaDe(p)), p);
      else if (crit === 'artista') meter((p.artists[0] || {}).name, p);
      else if (crit.indexOf('e:') === 0) { for (const n of (etiquetasCancion(p)[crit.slice(2)] || [])) meter(n, p); }
      else if (crit === 'anadida') meter(p.added ? 'añadidas en ' + new Date(p.added).getFullYear() : null, p);
      else if (crit === 'genero') { const gg = generosDe(p); meter(gg[0], p); }
      else {
        /* la etiqueta mas general de esa carpeta que tenga el artista */
        const carp = crit === 'ambiente' ? 'Ambiente' : 'Géneros';
        const ts = etiquetasDe(p).filter(t => carpetaDe(t) === carp);
        for (const t of ts) meter((tagPorId(t) || {}).name, p);
      }
    }
    return Array.from(g).filter(([, l]) => l.length >= min).sort((a, b) => b[1].length - a[1].length);
  };
  const pinta = h => {
    const gr = grupos();
    h.querySelector('#dvL').innerHTML = gr.length ? gr.map(([k, l]) => '<div class="barra"><span class="nowrap" style="flex:1">' + esc(f.name + ' · ' + k) + '</span><b>' + l.length + '</b></div>').join('') : '<div class="vacio">Ningún grupo llega al mínimo' + (false ? '. Falta mirar los géneros: pulsa el botón de arriba.' : '') + '</div>';
    h.querySelector('#dvOk').textContent = gr.length ? 'Crear ' + gr.length + ' playlists' : 'Crear';
    h.querySelector('#dvOk').disabled = !gr.length;
    h.querySelector('#dvGen').hidden = !(false);
  };
  hoja('<h2>Dividir «' + esc(f.name) + '»</h2><p class="soft tiny">Crea playlists nuevas; la original no se toca. Con las etiquetas, un artista puede caer en varias.</p>' +
    '<div class="chips" id="dvC">' + criterios.map(([k, t]) => '<button class="chip' + (k === crit ? ' on' : '') + '" data-c="' + k + '">' + t + '</button>').join('') + '</div>' +
    '<div class="herr"><label class="tiny mute" style="white-space:nowrap">Mínimo por playlist</label><input class="field" id="dvMin" type="number" value="' + min + '" style="max-width:90px">' +
    '<label class="tiny mute" style="white-space:nowrap">Tamaño</label><input class="field" id="dvTam" type="number" value="' + tam + '" style="max-width:90px"></div>' +
    '<button class="btn sm" id="dvGen" hidden>' + ic('buscar') + 'Mirar los géneros primero</button>' +
    '<div id="dvL" style="margin:10px 0;max-height:40vh;overflow:auto"></div><button class="btn pri wide" id="dvOk">Crear</button>', h => {
      pinta(h);
      h.querySelector('#dvC').onclick = e => { const c = e.target.closest('[data-c]'); if (!c) return; crit = c.dataset.c; h.querySelectorAll('#dvC .chip').forEach(x => x.classList.toggle('on', x === c)); pinta(h); };
      h.querySelector('#dvMin').onchange = e => { min = Math.max(1, +e.target.value || 1); pinta(h); };
      h.querySelector('#dvTam').onchange = e => { tam = Math.max(5, +e.target.value || 100); pinta(h); };
      h.querySelector('#dvGen').onclick = async () => { cerrarHoja(); await trabajo(() => cargarGeneros(f.pistas), 'Mirando géneros'); hojaDividir(f); };
      h.querySelector('#dvOk').onclick = async () => {
        const gr = grupos(); cerrarHoja();
        await trabajo(async () => {
          const creadas = [];
          for (const [k, l] of gr) {
            const nom = (f.name + ' · ' + k).slice(0, 100);
            const np = await crearPlaylist(nom, 'Parte de «' + f.name + '»', false);
            await plAnadir(np.id, Array.from(new Set(l.map(p => p.uri))), null, 'Creando «' + nom + '»');
            creadas.push(np.uri);
          }
          apuntar('«' + f.name + '» dividida en ' + creadas.length, { t: 'libQuitar', uris: creadas });
          toast(creadas.length + ' playlists creadas');
        }, 'Dividiendo');
      };
    });
}

/* ============================================================
   CREAR UNA PARECIDA
   Spotify ya no da recomendaciones a apps personales, asi que se
   hace a mano: mas canciones de los artistas que mas pesan en la
   lista, sin repetir las que ya estan.
   ============================================================ */
function hojaParecida(f) {
  const arts = contar(f.pistas, p => p.artists.slice(0, 1).map(a => a.name));
  hoja('<h2>Crear una parecida a «' + esc(f.name) + '»</h2><p class="soft tiny">Busca más canciones de sus ' + Math.min(15, arts.length) + ' artistas principales que no estén ya en la lista.</p>' +
    '<label class="lbl">Cuántas canciones</label><input class="field" id="pcN" type="number" value="' + Math.min(50, Math.max(20, f.pistas.length)) + '">' +
    '<label class="check"><input type="checkbox" id="pcMis"> Sumar también a Mis artistas con las mismas etiquetas</label>' +
    '<button class="btn pri wide" id="pcOk" style="margin-top:10px">' + ic('varita') + 'Crearla</button>', h => {
      h.querySelector('#pcOk').onclick = async () => {
        const n = Math.max(5, Math.min(500, +h.querySelector('#pcN').value || 50));
        const conMis = h.querySelector('#pcMis').checked;
        cerrarHoja();
        await trabajo(async () => {
          const ya = new Set(f.pistas.map(p => p.uri)), vistos = new Set(f.pistas.map(claveObra));
          let nombres = arts.slice(0, 15).map(a => a[0]);
          if (conMis) {
            await misAsegurar();
            const tags = contar(f.pistas, etiquetasDe).filter(([t]) => ['Géneros', 'Subgéneros', 'Ambiente'].indexOf(carpetaDe(t)) >= 0).slice(0, 4).map(x => x[0]);
            const enLista = new Set(f.pistas.map(p => (p.artists[0] || {}).name));
            const extra = barajar(MIS.artistas.filter(a => !enLista.has(a.name) && (a.tags || []).some(t => tags.indexOf(t) >= 0))).slice(0, 10).map(a => a.name);
            nombres = nombres.concat(extra);
          }
          const porArt = [];
          for (let i = 0; i < nombres.length; i++) {
            progreso('Buscando canciones de ' + nombres[i], i, nombres.length);
            const out = [];
            /* los primeros resultados suelen ser los exitos que ya tienes: se mira mas hondo */
            const quiero = Math.ceil(n / nombres.length) + 3;
            for (let off = 0; off < 50 && out.length < quiero; off += 10) {
              const d = await sp('/search?type=track&limit=10&offset=' + off + '&q=' + encodeURIComponent('artist:"' + nombres[i] + '"'));
              for (const t of ((d && d.tracks && d.tracks.items) || [])) {
                const p = pista(t); if (!p || ya.has(p.uri) || vistos.has(claveObra(p))) continue;
                if (fold((p.artists[0] || {}).name) !== fold(nombres[i])) continue;
                vistos.add(claveObra(p)); out.push(p.uri);
              }
            }
            porArt.push(barajar(out));
          }
          /* se reparte por turnos para que no salgan diez seguidas del mismo */
          const uris = [];
          for (let r = 0; uris.length < n && porArt.some(l => l.length); r++) for (const l of porArt) if (l.length && uris.length < n) uris.push(l.shift());
          if (!uris.length) { toast('No he encontrado canciones nuevas de esos artistas'); return; }
          const np = await crearPlaylist(f.name + ' · parecida', 'Hecha con la Fonoteca a partir de «' + f.name + '»', false);
          await plAnadir(np.id, uris, null, 'Creando la parecida');
          apuntar('Creada «' + f.name + ' · parecida»', { t: 'libQuitar', uris: [np.uri] });
          toast('«' + f.name + ' · parecida» creada con ' + uris.length + ' canciones');
        }, 'Creando la parecida');
      };
    });
}

/* ============================================================
   VER DATOS
   ============================================================ */
async function verDatos(f) {
  await misAsegurar();
  const ps = f.pistas;
  const barras = (pares, total, nom) => pares.map(([k, n]) => '<div class="barra"><span class="nowrap" style="width:42%">' + esc(nom ? nom(k) : k) + '</span><i style="width:' + Math.max(2, 55 * n / pares[0][1]) + '%"></i><span class="mute">' + n + ' · ' + Math.round(100 * n / total) + '%</span></div>').join('');
  const total = ps.length || 1;
  const dur = ps.reduce((a, p) => a + p.ms, 0);
  const decs = contar(ps, p => decadaDe(p) == null ? null : decadaDe(p)).sort((a, b) => a[0] - b[0]);
  const arts = contar(ps, p => p.artists.map(a => a.name));
  const tagsAmb = contar(ps, etiquetasDe).filter(([t]) => carpetaDe(t) === 'Ambiente');
  const tagsGen = contar(ps, etiquetasDe).filter(([t]) => carpetaDe(t) === 'Géneros');
  const gens = contar(ps, generosDe);
  const anyos = ps.filter(p => p.year).map(p => +p.year).sort((a, b) => a - b);
  const mediana = anyos.length ? anyos[Math.floor(anyos.length / 2)] : '—';
  const añadidas = contar(ps.filter(p => p.added), p => new Date(p.added).getFullYear()).sort((a, b) => a[0] - b[0]);
  const kpi = (n, t) => '<div class="kpi"><b>' + n + '</b><span>' + t + '</span></div>';
  hoja('<h2>Datos de «' + esc(f.name) + '»</h2>' +
    '<div class="kpis">' + kpi(ps.length.toLocaleString('es-ES'), 'canciones') + kpi(durLarga(dur), 'de música') + kpi(arts.length, 'artistas') + kpi(mediana, 'año típico') + '</div>' +
    '<h3>Décadas</h3>' + barras(decs, total, k => nombreDecada(k)) +
    '<h3>Artistas que más salen</h3>' + barras(arts.slice(0, 12), total) +
    (tagsAmb.length ? '<h3>Estado de ánimo <span class="tiny mute">(tus etiquetas)</span></h3>' + barras(tagsAmb.slice(0, 10), total, t => tagPorId(t).name) : '') +
    (tagsGen.length ? '<h3>Géneros <span class="tiny mute">(tus etiquetas)</span></h3>' + barras(tagsGen.slice(0, 10), total, t => tagPorId(t).name) : '') +
    (gens.length ? '<h3>Géneros</h3>' + barras(gens.slice(0, 10), total) : (faltanGeneros(ps).length ? '<p class="tiny mute">Faltan géneros: «Etiquetar automáticamente» los busca en Last.fm.</p>' : '')) +
    (añadidas.length > 1 ? '<h3>Cuándo las añadiste</h3>' + barras(añadidas, total) : '') +
    '<p class="tiny mute" style="margin-top:14px">Spotify ya no da BPM, energía ni popularidad a apps personales; por eso aquí no salen.</p>');
}

  const gens = contar(d.arts, a => (a.generos || generosArtista(a.id) || []).map(g => String(g).toLowerCase()));
  const tagsTop = contar(d.arts, a => { const x = misPorId(a.id); return x && x.tags ? x.tags.filter(t => ['Géneros', 'Ambiente'].indexOf(carpetaDe(t)) >= 0) : []; });
  const discos = contar(d.tracks, p => p.albumId ? p.albumId : null).slice(0, 6).map(([id, n]) => { const p = d.tracks.find(x => x.albumId === id); return { id, n, p }; });
  const barras = (pares, nom) => pares.length ? pares.map(([k, n]) => '<div class="barra"><span class="nowrap" style="width:42%">' + esc(nom ? nom(k) : k) + '</span><i style="width:' + Math.max(3, 55 * n / pares[0][1]) + '%"></i><span class="mute">' + n + '</span></div>').join('') : '<p class="tiny mute">Sin datos</p>';
  $('#stC').innerHTML =
    '<div class="seccion"><div class="sechead"><h3>' + ic('persona') + 'Tus artistas top</h3><button class="btn sm" id="stExpA">' + ic('bajar') + 'TXT</button><button class="btn sm" id="stMisA">' + ic('estrella') + 'A Mis artistas</button></div>' +
    '<div class="rejilla">' + d.arts.slice(0, ST.verArt).map(tarjA).join('') + '</div>' +
    (d.arts.length > ST.verArt ? '<div style="text-align:center;margin-top:10px"><button class="btn" id="stMasA">Mostrar más</button></div>' : '') + '</div>' +
    '<div class="seccion"><div class="sechead"><h3>' + ic('lista') + 'Tus canciones top</h3><button class="btn sm" id="stExpC">' + ic('bajar') + 'TXT</button><button class="btn sm" id="stListaC">' + ic('check') + 'Editar</button><button class="btn sm pri" id="stCrearC">' + ic('plus') + 'Playlist</button></div>' +
    '<div class="rejilla">' + d.tracks.slice(0, ST.verCan).map(tarjC).join('') + '</div>' +
    (d.tracks.length > ST.verCan ? '<div style="text-align:center;margin-top:10px"><button class="btn" id="stMasC">Mostrar más</button></div>' : '') + '</div>' +
    '<div class="seccion dos"><div><h3>' + ic('etiqueta') + 'Tus géneros</h3>' + (tagsTop.length ? barras(tagsTop.slice(0, 8), t => tagPorId(t).name) : barras(gens.slice(0, 8))) + '</div>' +
    '<div><h3>' + ic('disco') + 'Tus discos</h3><div class="lista-obj">' + discos.map(x => '<div class="obj" data-d="' + x.id + '">' + imgOph(x.p.cover, 'disco') + '<div class="t"><div class="t1 nowrap">' + esc(x.p.album) + '</div><div class="t2 nowrap">' + esc(nombresArtistas(x.p)) + ' · ' + x.n + ' canciones</div></div></div>').join('') + '</div></div></div>' +
    '<div class="seccion"><h3>' + ic('mas') + 'Más</h3><div class="opc">' +
    '<button data-x="novedades">' + ic('estrella') + '<span>Novedades de tus artistas<span class="sub">lo que han sacado los que sigues en los últimos 2 meses</span></span></button>' +
    '<button data-x="cola">' + ic('cola') + '<span>Tu cola ahora mismo</span></button>' +
    '<button data-x="reciente">' + ic('reloj') + '<span>Lo último que has escuchado, como lista</span></button></div></div>';
  const txt = (l, fn) => l.map((x, i) => (i + 1) + '. ' + fn(x)).join('\n');
  $('#stExpA').onclick = () => descargar('artistas top - ' + nomR + '.txt', txt(d.arts, a => a.name), 'text/plain');
  $('#stExpC').onclick = () => descargar('canciones top - ' + nomR + '.txt', txt(d.tracks, p => nombresArtistas(p) + ' - ' + p.title), 'text/plain');
  $('#stMisA').onclick = async () => { const n = misAnadir(d.arts.map(a => ({ id: a.id, name: a.name, img: a.imgG, genres: a.generos }))); toast(n ? n + ' añadidos a Mis artistas' : 'Ya estaban todos'); render(); };
  const comoLista = () => abrirFuente({ kind: 'top', name: 'Canciones top · ' + nomR, editable: false, pistas: d.tracks.slice() }, async () => d.tracks);
  $('#stListaC').onclick = comoLista;
  $('#stCrearC').onclick = () => hojaNuevaPlaylist(d.tracks.map(p => p.uri), 'Mi top · ' + nomR + ' · ' + new Date().toLocaleDateString('es-ES', { month: 'short', year: 'numeric' }));
  const ma = $('#stMasA'); if (ma) ma.onclick = () => { ST.verArt = 50; render(); };
  const mc = $('#stMasC'); if (mc) mc.onclick = () => { ST.verCan = 50; render(); };
  $('#stC').onclick = e => {
    const a = e.target.closest('[data-a]'); if (a) return abrirArtista(a.dataset.a);
    const p = e.target.closest('[data-p]'); if (p) { comoLista(); const q = S.fuente.pistas[+p.dataset.p]; if (q) setTimeout(() => hojaPista(q), 80); return; }
    const di = e.target.closest('[data-d]'); if (di) return abrirDisco(di.dataset.d);
    const x = e.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'novedades') abrirNovedades();
    else if (x.dataset.x === 'cola') abrirFuente({ kind: 'queue', name: 'Tu cola', editable: false, pistas: null }, async () => { const q = await sp('/me/player/queue'); return [(q && q.currently_playing)].concat((q && q.queue) || []).map(t => pista(t)).filter(Boolean); });
    else abrirFuente({ kind: 'recent', name: 'Lo último que has escuchado', editable: false, pistas: null }, async () => { const q = await sp('/me/player/recently-played?limit=50'); return ((q && q.items) || []).map(i => pista(i.track, { added: i.played_at })).filter(Boolean); });
  };
}

/* ---------------- novedades de tus artistas ----------------
   Tu propio «Radar de novedades»: se mira cada artista que sigues
   (una peticion por artista) y se guarda medio dia en este aparato. */
const K_NOV = 'mando_novedades_v1';
function abrirNovedades() {
  abrirVista({ pintar: async m => {
    m.innerHTML = '<button class="btn ghost sm back" id="bAtras">' + ic('atras') + 'Atrás</button><h2>Novedades de tus artistas</h2><div id="nvC"><div class="spin"></div></div>';
    $('#bAtras').onclick = atras;
    let c = leer(K_NOV, null);
    if (!c || Date.now() - c.at > 12 * 36e5) {
      const r = await trabajo(async () => {
        /* cada artista se mira como mucho una vez al dia y 60 por vez:
           con cientos de artistas, antes eran cientos de peticiones seguidas */
        const seg = await paginar('/me/following?type=artist', { limite: 50, clave: 'artists' });
        const lim = new Date(Date.now() - 62 * 864e5).toISOString().slice(0, 10);
        const porArt = (leer(K_NOV, null) || {}).porArt || {};
        const pend = seg.filter(a => !porArt[a.id] || Date.now() - porArt[a.id].at > 72 * 36e5);
        const toca = pend.slice(0, 25);
        for (let i = 0; i < toca.length; i++) {
          progreso('Mirando a ' + toca[i].name, i, toca.length);
          try {
            const d = await sp('/artists/' + toca[i].id + '/albums?include_groups=album,single&limit=10');
            porArt[toca[i].id] = { at: Date.now(), d: ((d && d.items) || []).filter(a => (a.release_date || '') >= lim).map(a => Object.assign(discoDe(a), { fecha: a.release_date })) };
          } catch (e) { if (e.message === 'DETENIDO' || esCaida(e)) break; }
        }
        const out = [];
        for (const a of seg) for (const x of ((porArt[a.id] || {}).d || [])) if (x.fecha >= lim && !out.some(y => y.id === x.id)) out.push(x);
        return { at: Date.now(), discos: out.sort((a, b) => b.fecha.localeCompare(a.fecha)), porArt: porArt, faltan: seg.filter(a => !porArt[a.id]).length };
      }, 'Buscando novedades');
      if (!r) { const x = $('#nvC'); if (x) x.innerHTML = '<div class="vacio">No se ha podido</div>'; return; }
      c = r; escribir(K_NOV, c);
    }
    const x = $('#nvC'); if (!x) return;
    x.innerHTML = '<p class="tiny mute">De los artistas que sigues en Spotify, últimos 2 meses · mirado ' + fecha(c.at) + (c.faltan ? ' · <b>faltan ' + c.faltan + ' artistas</b> (se miran de 25 en 25 para no gastar tu cupo)' : '') + ' <button class="btn sm ghost" id="nvRe">' + ic('recargar') + (c.faltan ? 'Mirar más' : 'Volver a mirar') + '</button></p>' +
      (c.discos.length ? '<div class="btnrow" style="margin-bottom:8px"><button class="btn pri sm" id="nvPl">' + ic('plus') + 'Playlist con todo lo nuevo</button></div><div class="lista-obj">' +
        c.discos.map(d => '<div class="obj" data-id="' + d.id + '">' + imgOph(d.img, 'disco') + '<div class="t"><div class="t1 nowrap">' + esc(d.name) + '</div><div class="t2 nowrap">' + esc(d.artistas) + ' · ' + (d.tipo === 'single' ? 'sencillo' : 'disco') + ' · ' + new Date(d.fecha).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + '</div></div></div>').join('') + '</div>'
        : '<div class="vacio">Nada nuevo en los últimos 2 meses</div>');
    $('#nvRe').onclick = () => { escribir(K_NOV, { at: 0, discos: [], porArt: c.porArt || {} }); render(); };
    x.querySelectorAll('.obj').forEach(el => el.onclick = () => abrirDisco(el.dataset.id, c.discos.find(d => d.id === el.dataset.id)));
    const pl = $('#nvPl');
    if (pl) pl.onclick = async () => {
      const uris = await trabajo(async () => {
        const u = [];
        for (let i = 0; i < c.discos.length; i++) { progreso('Leyendo discos', i, c.discos.length); (await pistasDisco(c.discos[i].id)).forEach(z => u.push(z)); }
        return u;
      }, 'Leyendo discos');
      if (uris) hojaNuevaPlaylist(uris, 'Novedades · ' + new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }));
    };
  } });
}

/* ============================================================
   HOJAS Y CONFIRMACIONES
   ============================================================ */
let _hoja = null;
function hoja(html, alMontar, alCerrar) {
  cerrarHoja(true);
  const velo = document.createElement('div'); velo.className = 'velo';
  const h = document.createElement('div'); h.className = 'hoja'; h.setAttribute('role', 'dialog');
  h.innerHTML = '<div class="asa"></div>' + html;
  document.body.append(velo, h);
  _hoja = { velo, h, alCerrar };
  velo.onclick = () => cerrarHoja();
  requestAnimationFrame(() => { velo.classList.add('on'); h.classList.add('on'); });
  if (alMontar) alMontar(h);
  return h;
}
function cerrarHoja(ya) {
  if (!_hoja) return;
  const { velo, h, alCerrar } = _hoja; _hoja = null;
  if (alCerrar) alCerrar();
  if (ya) { velo.remove(); h.remove(); return; }
  velo.classList.remove('on'); h.classList.remove('on');
  setTimeout(() => { velo.remove(); h.remove(); }, 320);
}
addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });
function confirmar(titulo, boton, texto) {
  return new Promise(ok => {
    let dicho = false;
    hoja('<h2>' + esc(titulo) + '</h2>' + (texto ? '<p class="soft">' + esc(texto) + '</p>' : '') +
      '<div class="btnrow" style="margin-top:14px"><button class="btn" id="cNo" style="flex:1">Cancelar</button><button class="btn pri" id="cSi" style="flex:1">' + esc(boton) + '</button></div>', h => {
        h.querySelector('#cNo').onclick = () => { dicho = true; cerrarHoja(); ok(false); };
        h.querySelector('#cSi').onclick = () => { dicho = true; cerrarHoja(); ok(true); };
      }, () => { if (!dicho) ok(false); });
  });
}
