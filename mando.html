<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fonoteca">
<meta name="theme-color" content="#0e0c0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="mando.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>Fonoteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg:#f7f2e9; --surface:#fffdf8; --surface-2:#efe8db;
    --line:rgba(26,20,14,0.11); --line-firm:rgba(26,20,14,0.20);
    --fg:#1a140e; --fg-soft:#5d5346; --fg-mute:#726858;
    --amber:#a3690f; --amber-soft:#f0e0c2; --on-amber:#fffdf8;
    --jade:#14795c; --jade-soft:#d5e9e0; --rust:#b03f30;
    --shadow-sm:0 1px 2px rgba(26,20,14,0.05),0 3px 8px rgba(26,20,14,0.05),0 8px 24px rgba(26,20,14,0.04);
    --shadow-lg:0 -4px 40px rgba(26,20,14,0.18);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-drawer:cubic-bezier(0.32,0.72,0,1);
    --row:60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:#14100d; --surface:#1e1915; --surface-2:#2a231d;
      --line:rgba(247,242,233,0.10); --line-firm:rgba(247,242,233,0.20);
      --fg:#f5efe4; --fg-soft:#b8ab99; --fg-mute:#948877;
      --amber:#e0a03a; --amber-soft:#3a2c15; --on-amber:#1a140e;
      --jade:#46b491; --jade-soft:#14312a; --rust:#e0705e;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.34),0 3px 10px rgba(0,0,0,0.26);
      --shadow-lg:0 -4px 40px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#14100d; --surface:#1e1915; --surface-2:#2a231d;
    --line:rgba(247,242,233,0.10); --line-firm:rgba(247,242,233,0.20);
    --fg:#f5efe4; --fg-soft:#b8ab99; --fg-mute:#948877;
    --amber:#e0a03a; --amber-soft:#3a2c15; --on-amber:#1a140e;
    --jade:#46b491; --jade-soft:#14312a; --rust:#e0705e;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.34),0 3px 10px rgba(0,0,0,0.26);
    --shadow-lg:0 -4px 40px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding-bottom: calc(150px + env(safe-area-inset-bottom));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .mute { color: var(--fg-mute); } .soft { color: var(--fg-soft); } .tiny { font-size: 12px; }
  .nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

  /* cabecera */
  .top {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px 6px; max-width: 900px; margin: 0 auto; }
  .logo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; flex: 1; min-width: 0; }
  .logo span { color: var(--amber); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 2px 14px 9px; max-width: 900px; margin: 0 auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 0; background: transparent; color: var(--fg-soft); font-weight: 650; font-size: 14px;
    padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.on { background: var(--fg); color: var(--bg); }
  .ftool { gap: 8px; }
  .fbusca { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 0 14px; height: 42px; box-shadow: var(--shadow-sm); color: var(--fg-mute); }
  .fbusca svg { width: 18px; height: 18px; flex: none; }
  .fbusca input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; font-size: 15px; color: var(--fg); height: 100%; }
  .fbusca:focus-within { box-shadow: 0 0 0 2px var(--amber); }
  .forden { flex: none; position: relative; display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 999px; padding: 0 12px; height: 42px; box-shadow: var(--shadow-sm); color: var(--fg-soft); max-width: 46%; }
  .forden svg { width: 17px; height: 17px; flex: none; }
  .forden select { border: 0; background: none; font: inherit; font-weight: 650; font-size: 14px; color: var(--fg); outline: none; cursor: pointer; min-width: 0; appearance: none; -webkit-appearance: none; padding-right: 2px; }
  .selbar { gap: 8px; }
  .selbar .chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); font-weight: 650; font-size: 14px; }
  .selbar .chip svg { width: 16px; height: 16px; }
  .selbar .chip.fuerte { background: var(--amber); color: var(--on-amber); }
  .selbar .chip.on { background: var(--fg); color: var(--bg); }
  .selbar .chip.sisel { background: var(--surface-2); box-shadow: none; }
  .selbar:not(.consel) .sisel { display: none; }
  .ayuda { font-size: 12.5px; color: var(--fg-soft); padding: 8px 12px; box-shadow: none !important; background: var(--surface-2) !important; }
  .chip .n { font-size: 11px; font-weight: 700; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, currentColor 12%, transparent); opacity: .85; }
  .elchips .chip b.n { margin-left: 6px; opacity: .85; }
  .elsec, #fzC .lbl { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  #fzC > .lbl:first-child { border-top: 0; padding-top: 0; margin-top: 6px; }
  #fzC .chips, .elchips { max-height: 168px; overflow-y: auto; gap: 7px; padding: 2px; }
  #fzC .herr .field { border-radius: 999px; }
  .btnrow:has(#fzCrear) { flex-wrap: nowrap; } #fzQuitar { flex: none; padding-left: 12px; padding-right: 12px; } #fzCrear, #fzSel { white-space: nowrap; }
  .po-fuentes { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .po-fuentes .chip { display: inline-flex; align-items: center; gap: 6px; }
  .po-fuentes .chip svg { width: 15px; height: 15px; }
  .tabsep { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-mute); padding: 16px 12px 4px; }
  .tab.tmas { font-size: 13.5px; padding-top: 7px; padding-bottom: 7px; }
  .dc-res .dc-num { font-size: 16px; margin-bottom: 8px; } .dc-res .dc-num b { font-size: 28px; font-weight: 800; }
  .dc-res .btnrow { margin-top: 12px; flex-wrap: wrap; }
  .dc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; margin-top: 16px; }
  .dc-pl { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font: inherit; min-width: 0; }
  .dc-pl img, .dc-pl .dc-sin { display: grid; place-items: center; width: 100%; height: auto; aspect-ratio: 1; border-radius: 10px; object-fit: cover; box-shadow: var(--shadow-sm); background: var(--surface-2); color: var(--fg-mute); }
  .dc-pl .dc-sin svg { width: 36%; height: 36%; }
  .dc-pl b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; } .dc-pl small { color: var(--fg-mute); font-size: 12px; }
  .dc-pl .tr-barra { height: 5px; margin: 2px 0 0; }
  .dc-lista label.check { display: flex; padding: 9px 4px; gap: 10px; align-items: center; }
  details.masopc > summary { cursor: pointer; font-weight: 700; color: var(--fg-soft); padding: 14px 4px 6px; list-style: none; }
  details.masopc > summary::-webkit-details-marker { display: none; }
  details.masopc > summary::before { content: '▸ '; } details.masopc[open] > summary::before { content: '▾ '; }
  .tab:active { transform: scale(0.97); }

  main { max-width: 900px; margin: 0 auto; padding: 12px 14px; }

  /* botones */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line-firm); background: var(--surface); color: var(--fg);
    border-radius: 11px; padding: 9px 13px; font-size: 14px; font-weight: 600;
    cursor: pointer; white-space: nowrap; user-select: none; text-decoration: none;
    transition: transform .12s var(--ease-out), background .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn.pri { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 45%, transparent); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
  .btn.ico { padding: 8px 9px; }
  .btn.wide { width: 100%; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-firm); background: var(--surface); border-radius: 999px;
    padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { transform: scale(0.96); }
  .chip.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .field {
    width: 100%; background: var(--surface); border: 1px solid var(--line-firm);
    border-radius: 11px; padding: 10px 12px; font-size: 16px;
  }
  .field:focus { outline: none; border-color: var(--amber); }
  select.field { padding: 9px 10px; }
  label.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 5px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--amber); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 10px; }
  .aviso { background: var(--amber-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
  .aviso b { display: block; margin-bottom: 4px; }
  h2 { font-size: 20px; margin: 4px 0 2px; letter-spacing: -0.3px; }
  h3 { font-size: 15px; margin: 18px 0 8px; }

  /* cabecera de una lista */
  .cab { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .cab img, .cab .ph { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); box-shadow: var(--shadow-sm); }
  .cab .ph.red { border-radius: 50%; }
  .cab .txt { min-width: 0; flex: 1; }
  .back { margin: -4px 0 8px -8px; }

  .herr { display: flex; gap: 8px; align-items: center; margin: 10px 0 8px; }
  .herr .field { flex: 1; padding: 8px 12px; }
  .herr select.field { flex: none; width: auto; max-width: 42%; }
  .selbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }

  /* lista virtual */
  .vlist { position: relative; }
  .row {
    position: absolute; left: 0; right: 0; height: var(--row);
    display: flex; align-items: center; gap: 10px; padding: 0 4px 0 2px;
    border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .row:hover { background: var(--surface); }
  .row.sel { background: var(--amber-soft); }
  .row .ck {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-firm); flex: none;
    display: grid; place-items: center; color: var(--on-amber); transition: background .12s, border-color .12s;
  }
  .row.sel .ck { background: var(--amber); border-color: var(--amber); }
  .row .ck svg { width: 13px; height: 13px; stroke-width: 3; opacity: 0; }
  .row.sel .ck svg { opacity: 1; }
  .row img, .row .ph { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--surface-2); }
  .row .t { flex: 1; min-width: 0; }
  .row .t1 { font-weight: 600; font-size: 14.5px; }
  .row .t2 { font-size: 12.5px; color: var(--fg-mute); }
  .row .r { font-size: 12px; color: var(--fg-mute); text-align: right; flex: none; }
  .row .mas { flex: none; }
  .row.suena .t1 { color: var(--jade); }
  .row .n { width: 26px; text-align: right; font-size: 12px; color: var(--fg-mute); flex: none; font-variant-numeric: tabular-nums; }

  /* seleccion tactil: la columna del circulo es la «zona de arrastre» */
  .vlist { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .row .ckz { width: 44px; align-self: stretch; flex: none; display: grid; place-items: center; touch-action: none; margin: 0 -8px 0 -4px; cursor: ns-resize; }
  .row .dots { font-size: 11px; color: var(--jade); font-weight: 700; }
  .selbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; position: sticky; top: var(--topH, 96px); z-index: 20; background: var(--bg); padding: 7px 0; margin: 0 0 4px; }
  .selbar::-webkit-scrollbar { display: none; }
  .selbar .chip, .selbar .tiny { white-space: nowrap; flex: none; }
  .chip.fuerte { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .ayuda { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 0 0 8px; display: flex; gap: 10px; align-items: flex-start; }
  .ayuda button { border: 0; background: transparent; color: var(--fg-mute); font-weight: 700; cursor: pointer; flex: none; }
  .elsec { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); margin: 14px 0 6px; }
  .elchips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 176px; overflow-y: auto; }
  .elchips .chip b { font-weight: 800; margin-left: 5px; opacity: .6; }
  .elnum { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .elnum input { width: 74px; padding: 7px 10px; }
  .elpie { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 2px; margin-top: 12px; display: flex; gap: 8px; }
  .accion .cerrar { padding: 6px; }

  /* medidor de cupo */
  .cupo { border: 1px solid var(--line); background: var(--surface); color: var(--fg-soft); border-radius: 999px; padding: 5px 10px 5px 8px; font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .cupo i { width: 9px; height: 9px; border-radius: 50%; background: #2f8f5e; flex: none; }
  .cupo.medio i { background: #d98c1f; } .cupo.alto i, .cupo.frenado i { background: #c4342e; }
  .cupo.frenado { color: #c4342e; border-color: #c4342e; }
  .medbar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 6px 0 2px; }
  .medbar i { display: block; height: 100%; border-radius: 6px; }

  /* etiquetas */
  .etqs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .etq { font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--fg-soft); border: 0; cursor: pointer; }
  .etq b { font-weight: 800; opacity: .55; margin-right: 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; }
  .etq.man { background: var(--amber-soft); color: var(--fg); }
  .chip.medio { border-style: dashed; border-color: var(--amber); }
  #analiza { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--topH, 96px) + 8px); z-index: 44; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 7px 8px 7px 14px; font-size: 13px; font-weight: 650; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg); max-width: calc(100% - 24px); }
  #analiza button { border: 0; border-radius: 999px; padding: 4px 10px; background: color-mix(in srgb, var(--bg) 20%, transparent); color: inherit; font-weight: 700; cursor: pointer; }
  .t2 b.yr { color: var(--jade); font-weight: 750; }

  /* mis discos */
  .tarj .es { position: absolute; left: 7px; bottom: 7px; z-index: 1; font-size: 11px; font-weight: 800; color: #fff; border-radius: 7px; padding: 2px 7px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .tarj .imgw { position: relative; }
  .estados { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 7px; margin: 12px 0 6px; }
  .estados button { border: 1.5px solid var(--line-firm); background: var(--surface); color: inherit; border-radius: 12px; padding: 10px 6px; font-weight: 750; font-size: 13.5px; cursor: pointer; }
  .estados button.on { color: #fff; border-color: transparent; }
  .dcab { display: flex; gap: 14px; align-items: flex-start; }
  .dcab img, .dcab .ph { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; flex: none; box-shadow: var(--shadow-lg); }
  .dnav { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .dnav .btn { flex: 1; }

  /* repaso una a una */
  .rp { max-width: 520px; margin: 0 auto; text-align: center; }
  .rp .prog { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 6px 0 14px; }
  .rp .prog i { display: block; height: 100%; background: var(--amber); transition: width .2s; }
  .rp .port { width: min(62vw, 260px); aspect-ratio: 1; border-radius: 14px; object-fit: cover; box-shadow: var(--shadow-lg); background: var(--surface-2); display: grid; place-items: center; margin: 0 auto; }
  .rp h2 { margin: 14px 0 2px; font-size: 21px; }
  .rp .donde { font-size: 12.5px; color: var(--jade); font-weight: 700; min-height: 18px; margin-top: 4px; }
  .rp .dest { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 8px; }
  .rp .dest button { border: 1.5px solid var(--line-firm); background: var(--surface); border-radius: 14px; padding: 13px 8px; font-weight: 750; font-size: 15px; cursor: pointer; color: inherit; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 54px; }
  .rp .dest button.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .rp .dest button.ya { border-style: dashed; }
  .rp .dest button .k { font-size: 11px; opacity: .55; font-weight: 600; }
  .rp .dest button.malo { color: var(--rust); }
  .rp .dest button.malo.on { background: var(--rust); border-color: var(--rust); color: #fff; }
  .rp .dest button.olvido { flex-direction: column; gap: 2px; }
  .rp .dest button.olvido small { font-size: 11px; font-weight: 600; opacity: .7; }
  .rp .dest button.olvido.on { background: var(--fg-soft); border-color: var(--fg-soft); color: var(--bg); }
  .rep-g { background: var(--surface); border-radius: 16px; padding: 6px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
  .rep-g h4 { margin: 6px 8px 4px; font-size: 14px; }
  .rep-i { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; cursor: pointer; }
  .rep-i img, .rep-i .ph { width: 40px; height: 40px; border-radius: 6px; flex: none; object-fit: cover; background: var(--surface-2); }
  .rep-i .tx { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .rep-i .tx small { display: block; color: var(--fg-mute); }
  .rep-i .est { font-size: 12px; font-weight: 800; flex: none; padding: 4px 9px; border-radius: 99px; }
  .rep-i.si .est { background: var(--jade); color: #fff; }
  .rep-i.no { opacity: .55; }
  .rep-i.no .est { color: var(--rust); }

  }

    background: var(--surface); border: 1px solid var(--line-firm); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow-lg);
    width: min(420px, calc(100vw - 28px)); font-size: 14px; }
  .progreso .b { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 2px; overflow: hidden; }
  .progreso .b i { display: block; height: 100%; background: var(--amber); width: 0; transition: width .2s; }
  .vacio { text-align: center; color: var(--fg-mute); padding: 40px 20px; }

  .hist .t { flex: 1; min-width: 0; }

  /* portadas en rejilla (playlists, estadisticas) */
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }

  .tarj { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .15s var(--ease-out); }
  .tarj:active { transform: scale(0.97); }

  .tarj .ph svg, .ph.grande svg { width: 38%; height: 38%; }

  .tarj .t { padding: 7px 8px 9px; }

  .tarj .ck { position: absolute; top: 8px; right: 8px; z-index: 1; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.3); display: grid; place-items: center; color: #fff; }
  .tarj.sel .ck { background: var(--amber); border-color: var(--amber); }
  .tarj .ck svg { width: 13px; height: 13px; stroke-width: 3; opacity: 0; } .tarj.sel .ck svg { opacity: 1; }
  .opc .sec { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-mute); padding: 14px 8px 4px; }
  .barra { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .barra i { display: block; height: 9px; background: var(--amber); border-radius: 5px; flex: none; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }

  .rango b { display: block; font-size: 14px; } .rango span { font-size: 12px; color: var(--fg-mute); }
  .rango.on { background: var(--amber); border-color: var(--amber); color: var(--on-amber); } .rango.on span { color: inherit; opacity: .8; }
  .seccion { background: color-mix(in srgb, var(--surface) 55%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 16px; margin-bottom: 14px; }
  .seccion h3 { margin: 4px 0 10px; display: flex; gap: 8px; align-items: center; }

  /* ============================================================
     DISEÑO 2026-09-30
     Oscuro profundo o claro cálido, color sacado de cada portada,
     navegación abajo en el móvil y barra lateral en el ordenador.
     ============================================================ */
  :root {
    --bg:#f6f2ec; --bg-2:#efe9e0; --surface:#ffffff; --surface-2:#ece6dc; --surface-3:#e2dace;
    --line:rgba(28,20,12,0.08); --line-firm:rgba(28,20,12,0.15);
    --fg:#17120d; --fg-soft:#4c4339; --fg-mute:#80766a;
    --amber:#c47a0a; --amber-soft:#f6e3c0; --on-amber:#ffffff;
    --jade:#128a64; --jade-soft:#d3ede3; --rust:#c2412f;
    --glass:rgba(255,255,255,0.72);
    --shadow-sm:0 1px 2px rgba(28,20,12,.05), 0 4px 14px rgba(28,20,12,.06);
    --shadow-md:0 8px 28px rgba(28,20,12,.12);
    --shadow-lg:0 18px 60px rgba(28,20,12,.22);
    --r:16px; --r-sm:11px;
    --f-disp:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
    --nav-h:0px; --side:0px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --bg:#0e0c0b; --bg-2:#141110; --surface:#1a1715; --surface-2:#24201d; --surface-3:#2f2a26;
      --line:rgba(255,236,210,0.07); --line-firm:rgba(255,236,210,0.14);
      --fg:#f8f2ea; --fg-soft:#cbbfae; --fg-mute:#91877a;
      --amber:#f4b13e; --amber-soft:rgba(244,177,62,0.15); --on-amber:#1c1305;
      --jade:#4fd1a1; --jade-soft:rgba(79,209,161,0.14); --rust:#ff7a66;
      --glass:rgba(26,23,21,0.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
      --shadow-md:0 10px 30px rgba(0,0,0,.45);
      --shadow-lg:0 20px 70px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e0c0b; --bg-2:#141110; --surface:#1a1715; --surface-2:#24201d; --surface-3:#2f2a26;
    --line:rgba(255,236,210,0.07); --line-firm:rgba(255,236,210,0.14);
    --fg:#f8f2ea; --fg-soft:#cbbfae; --fg-mute:#91877a;
    --amber:#f4b13e; --amber-soft:rgba(244,177,62,0.15); --on-amber:#1c1305;
    --jade:#4fd1a1; --jade-soft:rgba(79,209,161,0.14); --rust:#ff7a66;
    --glass:rgba(26,23,21,0.72);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.45);
    --shadow-lg:0 20px 70px rgba(0,0,0,.65);
  }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "cv11", "ss01"; letter-spacing: -0.006em;
    padding-bottom: calc(190px + env(safe-area-inset-bottom)); padding-left: var(--side); }
  ::selection { background: var(--amber-soft); }
  h2 { font-family: var(--f-disp); font-weight: 800; font-size: 24px; letter-spacing: -0.025em; line-height: 1.1; }
  h3 { font-family: var(--f-disp); font-weight: 750; font-size: 18px; letter-spacing: -0.02em; margin: 22px 0 10px; }
  main { padding: 14px 16px; max-width: 1100px; }
  main.entra { animation: entra .32s var(--ease-out); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } }

  /* cabecera */
  .top { background: color-mix(in srgb, var(--bg) 80%, transparent); border-bottom-color: transparent; box-shadow: 0 1px 0 var(--line); }
  .bar { max-width: 1100px; padding: 10px 16px 8px; }
  .logo { font-family: var(--f-disp); font-size: 21px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 9px; }
  .logo .marca { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, var(--amber), color-mix(in srgb, var(--amber) 55%, #d4568a)); color: var(--on-amber); box-shadow: var(--shadow-sm); }
  .logo .marca svg { width: 17px; height: 17px; stroke-width: 2.4; }
  .logo span { color: var(--fg-mute); font-weight: 650; }
  .btn.ghost.ico { border-radius: 999px; width: 38px; height: 38px; padding: 0; }
  .btn.ghost.ico:hover { background: var(--surface-2); }
  .cupo { background: var(--surface-2); border-color: transparent; }

  /* navegacion: abajo en el movil */
  .tabs { display: none; }
  .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: space-around;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--glass);

  .hero-in > .ph svg { width: 34%; height: 34%; }

  /* reproductor a pantalla completa */

let _renovando = null;

async function renovar(c) {

        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: c.refreshToken, client_id: c.clientId })

    const c2 = cred();
    if (c2 && c2.refreshToken !== c.refreshToken && c2.expiresAt > Date.now()) return c2.accessToken;

  escribir(K_CREDS, {
    clientId: c.clientId, accessToken: d.access_token,
    refreshToken: d.refresh_token || c.refreshToken,
    expiresAt: Date.now() + (d.expires_in - 60) * 1000,

let _pausaHasta = +leer(K_PAUSA, 0) || 0, _parar = false, _429 = 0;

/* pausas cuando Spotify frena sin decir cuanto: 1, 5, 15, 30 y 60 minutos */
const PASOS_PAUSA = [60, 300, 900, 1800, 3600];

  const e = new Error('Spotify ha pedido parar un rato. La Fonoteca vuelve a intentarlo solo dentro de ' + t + ' (si insistiera antes, Spotify alargaría el castigo). Mientras, lo guardado funciona y los cambios van a la cola.');
  e.status = 429; e.freno = true;

async function motivo(res) {
  let t = '';
  try { const j = await res.json(); t = (j && j.error && (j.error.message || j.error.reason || j.error)) || ''; } catch (e) {}
  return res.status + (t ? ': ' + t : '');

  /* Gobernador: tras un aviso de Spotify se va mucho mas despacio 10

     peticiones se frena solo ANTES de que Spotify castigue. */
  const n = enVentana();

/* ¿qué te pega ahora? (hora, día, estación; Barcelona) */
const PUESTA_SOL = [17.75, 18.35, 19.1, 20.45, 20.95, 21.45, 21.4, 20.9, 20.05, 19.2, 17.55, 17.4];
function moodsAhora(d) {
  d = d || new Date();
  const h = d.getHours() + d.getMinutes() / 60, dia = d.getDay(), mes = d.getMonth(), dm = d.getDate();
  const laborable = dia >= 1 && dia <= 5, curro = laborable && h >= 9 && h < (dia === 5 ? 15 : 18) && !(h >= 14 && h < 15 && dia !== 5);
  const puesta = PUESTA_SOL[mes], hh = x => { const a = Math.floor(x), b = Math.round((x - a) * 60); return a + ':' + String(b).padStart(2, '0'); };
  const otono = (mes === 8 && dm >= 22) || mes === 9 || mes === 10 || (mes === 11 && dm < 21), verano = mes >= 5 && mes <= 7;
  const l = [];
  if (Math.abs(h - puesta) <= 1) l.push(['Golden hour', 'El sol se pone sobre las ' + hh(puesta)]);
  if ((dia === 5 || dia === 6) && h >= 20 || (dia === 6 || dia === 0) && h < 4) l.push(['Fiesta / Prefiesta', dia === 5 || (dia === 6 && h < 4) ? 'Es viernes noche' : 'Es sábado noche']);
  if (h < 5) l.push(['Autopista desierta a las 3:00 AM', 'Son las ' + hh(h) + ' de la madrugada'], ['Levitar', 'Para flotar a estas horas']);
  if (curro) l.push(['Concentración sin letra', 'Estás en horario de trabajo']);
  if (h >= 6 && h < 11) l.push(['Buen día', 'Para arrancar el día']);
  if (laborable && h >= 18 && h < 21.5) l.push(['NRG', 'Hora de gimnasio']);
  if (otono) l.push(['Otoño', 'Es otoño']);
  if (verano && h >= 11 && h < 21) l.push(['Ventanilla bajada', 'Es verano']);
  if (h >= 21.5 || h < 1) l.push(['Chill relajante', 'Para bajar revoluciones']);
  if (!curro && h >= 11 && h < 20) l.push(['Main character', 'Para salir a la calle']);
  l.push(['Chispa creativa', 'Algo distinto'], ['Levitar', 'Para flotar']);
  const vistos = new Set(); return l.filter(x => !vistos.has(x[0]) && vistos.add(x[0]));
}

async function viaje(pls, titulo, porCasa, mezclar) {
  const r = await trabajo(async () => {
    const uris = [], faltan = [];
    for (let i = 0; i < pls.length; i++) {
      progreso('Eligiendo canciones de «' + nombreCorto(pls[i].name) + '»', i, pls.length);
      const ps = (await pistasCasa(pls[i])).filter(p => p && p.uri && !p.local);
      if (!ps.length) { faltan.push(nombreCorto(pls[i].name)); continue; }

      if (!mezclar) el.sort((a, b) => (anyo(a) || 9999) - (anyo(b) || 9999));
      el.forEach(p => uris.push(p.uri));
    }
    progreso(null);

  if (!r.uris.length) { toast('Aún no tengo guardado lo que hay dentro. Abre alguna de estas playlists una vez y vuelve a probar.', null, 7000); return; }

const MUDANZA = 400;
function historiaDe(ps) {
  const porDia = new Map(); for (const p of ps) { const k = claveDia(p.added); porDia.set(k, (porDia.get(k) || 0) + 1); }

  for (const p of ps) {

    (dias.get(k) || dias.set(k, []).get(k)).push(p);
    (anyos.get(y) || anyos.set(y, []).get(y)).push(p);
    (meses.get(mk) || meses.set(mk, []).get(mk)).push(p);
    const a = artPpal(p); if (a) (arts.get(a) || arts.set(a, []).get(a)).push(p);
    const r = anyo(p); if (r > 1900) { const dc = Math.floor(r / 10) * 10; (decs.get(dc) || decs.set(dc, []).get(dc)).push(p); }
    horas[d.getHours()]++; sem[(d.getDay() + 6) % 7]++;
    if (!mudanza.has(k)) { (meses0.get(mk) || meses0.set(mk, []).get(mk)).push(p); horas0[d.getHours()]++; sem0[(d.getDay() + 6) % 7]++; }
    ms += p.ms || 0; if (p.added < primero) primero = p.added;
  }
  /* racha: dias seguidos dando Me gusta */
  const ks = Array.from(dias.keys()).sort();
  let racha = { n: 0 }, cur = { n: 0 };
  for (let i = 0; i < ks.length; i++) {
    const hoy = Date.parse(ks[i] + 'T12:00:00'), ant = i ? Date.parse(ks[i - 1] + 'T12:00:00') : 0;
    if (i && Math.round((hoy - ant) / 864e5) === 1) cur.n++; else cur = { n: 1, desde: ks[i] };
    cur.hasta = ks[i];
    if (cur.n > racha.n) racha = Object.assign({}, cur);
  }

function ruleta(lista, alElegir, op) {

  const tira = []; let o = Math.floor(Math.random() * lista.length);
  for (let i = 0; i < N; i++) tira.push(i === POS ? lista[gana] : lista[(o + i) % lista.length]);

  el.innerHTML = '<div class="ru-in"><div class="ru-tit">' + ic(op.icono || 'varita') + ' ' + esc(op.tit || '¿Qué disco escucho?') + '</div><div class="ru-vent"><div class="ru-flecha"></div><div class="ru-tira">' +

  const centro = i => el.querySelector('.ru-vent').clientWidth / 2 - W / 2 - i * W;
  t.style.transform = 'translateX(' + centro(2) + 'px)';
  const d = lista[gana];
  const fin = () => {
    el.querySelectorAll('.ru-c')[POS].classList.add('gana');
    el.querySelector('.ru-res').innerHTML = '<b>' + esc(d.name) + '</b><span>' + esc(d.artistas || '') + (d.p && anyo(d.p) ? ' · ' + anyo(d.p) : '') + '</span>';
    el.querySelector('#ruVer').disabled = el.querySelector('#ruOtra').disabled = false;

    t.style.transition = 'transform 4.2s cubic-bezier(.1,.72,.12,1)';
    t.style.transform = 'translateX(' + (centro(POS) + (Math.random() * 60 - 30)) + 'px)';
    setTimeout(() => { t.style.transition = 'transform .35s var(--ease-out)'; t.style.transform = 'translateX(' + centro(POS) + 'px)'; setTimeout(fin, 360); }, 4250);
  }));
  const cerrar = () => { el.classList.add('fuera'); setTimeout(() => el.remove(), 250); };

}

/* Meta semanal de discos: cuantos valoras cada semana (de lunes a domingo) */

  for (const o of Object.values(E.alb)) if (o && o.te) { const k = lunesDe(o.te); porSem.set(k, (porSem.get(k) || 0) + 1); }

  let racha = 0, k = esta;

async function repararCasas(D) {

$('#accion').onclick = async e => {

  if (a === 'plTodas' || a === 'plVacias') { document.querySelectorAll('#main [data-id]').forEach(el => { if (el.hidden || el.dataset.id === '_likes') return; const p = (S.playlists || []).find(x => x.id === el.dataset.id); if (p && (a === 'plTodas' || !p.total) && esMia(p)) { S.selObj.add(p.id); el.classList.add('sel'); } }); pintarAccion(); return; }
  if (a === 'plRepes') return repesEnVarias(Array.from(S.selObj));
  if (a === 'plPriv' || a === 'plPub') return privacidadVarias(Array.from(S.selObj), a === 'plPub');
  if (a === 'plUnir') return hojaCombinar();
  if (a === 'plBorrar') return borrarPlaylists(Array.from(S.selObj));
  if (a === 'objQuitar') return quitarObjetos();
  if (a === 'objNada') { S.selObj.clear(); render(); return; }
  if (a.indexOf('mis') === 0) return misAccion(a);
  if (a === 'aMis') { await misAsegurar(); await aMisDesdeUris(Array.from(S.selObj)); S.selObj.clear(); render(); return; }
  const ps = seleccionadas();
  if (!ps.length) return;
  if (a === 'anadir') return elegirDestino(ps, false);
  if (a === 'mover') return elegirDestino(ps, true);
  if (a === 'quitar') return quitarDeFuente(ps);

  if (a === 'repasar') return repasar(S.fuente, ps);

  if (a === 'arriba' || a === 'abajo') return moverDentro(ps, a === 'arriba');
  if (a === 'play') return reproducir({ uris: ps.filter(p => !p.local).slice(0, 100).map(p => p.uri) });

};

    '<div class="opc" id="dL">' +

      h.querySelector('#dL').onclick = async e => {

        PREFS.saltarRepes = h.querySelector('#dRep').checked; guardarPrefs();
        const id = b.dataset.id;
        cerrarHoja();
        let ok;
        if (id === '_nueva') {
          const np = await hojaNuevaPlaylist(ps.filter(p => !p.local).map(p => p.uri));

}
async function anadirAPlaylist(dest, ps) {
  return trabajo(async () => {
    let uris = ps.filter(p => !p.local).map(p => p.uri);
    let saltadas = 0;
    if (PREFS.saltarRepes) {
      const ya = new Set((await pistasDePlaylist(dest.id, (n, t) => progreso('Mirando qué hay en «' + dest.name + '»', n, t))).map(p => p.uri));
      const antes = uris.length;
      uris = Array.from(new Set(uris)).filter(u => !ya.has(u));
      saltadas = antes - uris.length;
    }
    if (!uris.length) { toast('Ya estaban todas en «' + dest.name + '»'); return true; }
    await plAnadir(dest.id, uris, null, 'Añadiendo a «' + dest.name + '»');
    /* si se saltaron las repetidas, las añadidas no estaban antes y quitarlas
       por uri deja la lista exactamente como estaba */
    apuntar(uris.length + ' añadidas a «' + dest.name + '»', PREFS.saltarRepes ? { t: 'plQuitar', pid: dest.id, uris: uris } : null);
    recordarDestino(dest.id);
    S.playlists = null;
    toast(uris.length + ' añadidas a «' + dest.name + '»' + (saltadas ? ' (' + saltadas + ' ya estaban)' : ''));
    return true;
  }, 'Añadiendo');
}
/* las ultimas playlists a las que añadiste salen primero y como boton directo */
function recordarDestino(id) {

function destinosRapidos(excluir) {

async function darLike(ps) {

/* Quitar de la fuente. En una playlist: si ninguna de las quitadas se queda
   repetida en otro sitio de la lista, basta un DELETE por uri (y las demas
   conservan su fecha); si no, se reescribe la lista sin ellas. */
async function quitarDeFuente(ps, sinPreguntar, msg) {
  const f = S.fuente;
  if (!f.editable) return;
  if (!sinPreguntar && !(await confirmar('¿Quitar ' + ps.length + ' de «' + f.name + '»?', 'Quitar', 'Se puede deshacer desde Cambios.'))) return;
  const fuera = new Set(ps.map(p => p.k));
  const quedan = f.pistas.filter(p => !fuera.has(p.k));
  const ok = await trabajo(async () => {
    if (f.kind === 'likes') {
      const uris = Array.from(new Set(ps.map(p => p.uri)));
      await libQuitar(uris, 'Quitando de Me gusta');
      apuntar(uris.length + ' quitadas de Me gusta', { t: 'libPoner', uris: uris });
    } else {
      const antes = f.pistas.map(p => p.uri);
      const urisFuera = new Set(ps.map(p => p.uri));
      const limpio = !quedan.some(p => urisFuera.has(p.uri));
      if (limpio) await plQuitar(f.id, Array.from(urisFuera), 'Quitando de «' + f.name + '»');
      else await plReescribir(f.id, quedan.map(p => p.uri), 'Reescribiendo «' + f.name + '»');
      apuntar(ps.length + ' quitadas de «' + f.name + '»', { t: 'reescribir', pid: f.id, uris: antes });
    }
    return true;
  }, 'Quitando');
  if (!ok) return;
  f.pistas = quedan; S.sel.clear(); S.playlists = null; if (f.kind === 'likes') S.likes = quedan;
  toast(msg || ps.length + ' quitadas', { txt: 'Deshacer', fn: () => deshacerUltimo(HIST[0].id) });
  recalcular(); pintarAccion();
  const h = document.querySelector('.cab .tiny'); if (h) h.textContent = f.pistas.length + ' canciones';
}

/* Mover la seleccion arriba o abajo del todo. Con pocas se hace con la
   ruta de reordenar (una a una, las fechas se conservan); con muchas se
   reescribe la lista, que es una sola tanda de peticiones. */
async function moverDentro(ps, arriba) {
  const f = S.fuente;
  const sel = new Set(ps.map(p => p.k));
  const elegidas = f.pistas.filter(p => sel.has(p.k)), resto = f.pistas.filter(p => !sel.has(p.k));
  const nueva = arriba ? elegidas.concat(resto) : resto.concat(elegidas);
  await aplicarOrden(nueva, elegidas.length + (arriba ? ' subidas arriba' : ' bajadas al final') + ' en «' + f.name + '»', elegidas.length <= 15 ? { elegidas, arriba } : null);
}
async function aplicarOrden(nueva, txt, pocas) {
  const f = S.fuente;
  const antes = f.pistas.map(p => p.uri);
  const ok = await trabajo(async () => {
    if (pocas) {
      /* se simula la lista para saber la posicion de cada una en cada paso */
      const cur = f.pistas.slice();
      for (let i = 0; i < pocas.elegidas.length; i++) {
        progreso('Moviendo', i, pocas.elegidas.length);
        const p = pocas.elegidas[i];
        const desde = cur.indexOf(p);
        if (pocas.arriba ? desde === i : desde === cur.length - 1) continue;
        await plMoverUna(f.id, desde, pocas.arriba ? i : cur.length);
        cur.splice(desde, 1);
        cur.splice(pocas.arriba ? i : cur.length, 0, p);
      }
    } else await plReescribir(f.id, nueva.map(p => p.uri), 'Guardando el orden');
    apuntar(txt, { t: 'reescribir', pid: f.id, uris: antes });
    return true;
  }, 'Guardando el orden');
  if (!ok) return;
  f.pistas = nueva; S.orden = '';
  const sel = $('#fO'); if (sel) sel.value = '';
  toast(txt, { txt: 'Deshacer', fn: () => deshacerUltimo(HIST[0].id) });
  recalcular();
}

function copiarEnlaces(ps) {

function descargar(nombre, contenido, tipo) {

  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo || 'application/json' }));

}

/* Un disco con todas sus canciones. /albums/{id} ya trae las 50 primeras,
   asi que casi siempre es UNA peticion; y se guarda 30 dias en el aparato
   (un disco no cambia), porque Spotify frena mucho la parte de discos. */
async function discoSp(id) {
  const c = await cacheLeer('alb:' + id);
  if (c && Date.now() - c.at < 30 * 864e5) return c.a;
  const a = await sp('/albums/' + id);
  if (!a) return a;
  let items = ((a.tracks || {}).items || []).slice();
  let next = (a.tracks || {}).next;
  if (!a.tracks) { items = await paginar('/albums/' + id + '/tracks', { limite: 50 }); next = null; }
  while (next) { const d = await sp(next); items = items.concat((d && d.items) || []); next = d && d.next; }
  const lig = Object.assign({}, a, { tracks: { items: items.map(t => ({ id: t.id, uri: t.uri, name: t.name, type: t.type, duration_ms: t.duration_ms, artists: (t.artists || []).map(x => ({ id: x.id, name: x.name, uri: x.uri })), is_local: t.is_local, track_number: t.track_number, disc_number: t.disc_number })) } });
  delete lig.available_markets;
  cachePoner('alb:' + id, { at: Date.now(), a: lig });
  return lig;
}

  });
}

/* El color de una portada: se reduce a 12x12 y se hace la media pesando
   mas los pixeles con color (los grises casi no cuentan). */
const _colores = new Map();
function colorDe(url) {
  return new Promise(ok => {
    if (!url) return ok(null);
    if (_colores.has(url)) return ok(_colores.get(url));
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 12;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, 12, 12);
        const d = x.getImageData(0, 0, 12, 12).data;
        let r = 0, g = 0, b = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) { const R = d[i], G = d[i + 1], B = d[i + 2], sat = (Math.max(R, G, B) - Math.min(R, G, B)) / 255, w = 0.08 + sat * sat * 3; r += R * w; g += G * w; b += B * w; n += w; }
        r /= n; g /= n; b /= n;
        /* ni muy oscuro ni quemado */
        const l = (Math.max(r, g, b) + Math.min(r, g, b)) / 2, k = l < 70 ? 70 / Math.max(l, 1) : l > 190 ? 190 / l : 1;
        const col = 'rgb(' + [r, g, b].map(v => Math.round(Math.min(255, v * k))).join(',') + ')';
        _colores.set(url, col); ok(col);
      } catch (e) { _colores.set(url, null); ok(null); }
    };
    im.onerror = () => { _colores.set(url, null); ok(null); };
    im.src = url;
  });
}

/* ============================================================
   INICIAR SESION EN SPOTIFY
   ------------------------------------------------------------
   Antes lo hacia MusicVault. La direccion registrada en el panel
   de Spotify sigue siendo musicvault.html, que ahora es solo un
   reenvio de una linea hacia aqui: Spotify vuelve alli, y alli

/* la direccion registrada en Spotify, fija: si se abre la Fonoteca por otra ruta (sin .html, con mayusculas…) Spotify la rechazaria */
const REDIRECT = /github\.io$/.test(location.hostname) ? 'https://4l3jandro23.github.io/mi-musica/musicvault.html' : location.origin + location.pathname.replace(/[^/]*$/, '') + 'musicvault.html';
const K_PKCE = 'musicvault_pkce_v1';
const K_VOLVER = 'musicvault_volver_v1';
/* Solo se vuelve a paginas conocidas: nada de ir a donde diga la URL */
const VUELTAS = { estudio: 'estudio.html', portadas: 'mando.html', mando: 'mando.html' };

function b64url(bytes) {
  let bin = '';
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function azar(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }

async function iniciarLogin(volver) {
  let c = cred();
  /* al conectar (o volver a conectar) siempre con el Client ID bueno, aunque el aparato guardase otro de antes */
  if (!c || c.clientId !== CID_DEF) { escribir(K_CREDS, { clientId: CID_DEF }); localStorage.removeItem(K_INTENTO); }
  c = cred();
  if (!c || !c.clientId) { hojaClientId(volver); return; }
  const verifier = azar(64), state = azar(16);
  sessionStorage.setItem(K_PKCE, JSON.stringify({ verifier, state }));
  if (volver) sessionStorage.setItem(K_VOLVER, volver); else sessionStorage.removeItem(K_VOLVER);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: c.clientId, response_type: 'code', redirect_uri: REDIRECT,
    code_challenge_method: 'S256', code_challenge: challenge, state: state,
    scope: PERMISOS.map(p => p.s).join(' ')
  });
}

/* Al abrir la pagina: ¿venimos de Spotify o nos piden conectar? */
async function alVolverDeSpotify() {
  const qs = new URLSearchParams(location.search);
  const pide = qs.get('conectar');
  if (pide) {
    history.replaceState({}, '', location.pathname);
    await iniciarLogin(VUELTAS[pide] && pide !== 'mando' ? VUELTAS[pide] : null);
    return true;
  }
  const code = qs.get('code'), state = qs.get('state'), err = qs.get('error');
  if (!code && !err) return false;
  localStorage.removeItem(K_INTENTO);
  history.replaceState({}, '', location.pathname);
  if (err) { toast('Spotify: ' + err); return false; }
  let g = null;
  try { g = JSON.parse(sessionStorage.getItem(K_PKCE) || 'null'); } catch (e) {}
  sessionStorage.removeItem(K_PKCE);
  if (!g || g.state !== state) { toast('No se pudo verificar la conexión con Spotify. Prueba otra vez.'); return false; }
  const c = cred();
  try {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT, client_id: c.clientId, code_verifier: g.verifier })
    });
    if (!res.ok) throw new Error('' + res.status);
    const d = await res.json();
    escribir(K_CREDS, { clientId: c.clientId, accessToken: d.access_token, refreshToken: d.refresh_token,
      expiresAt: Date.now() + (d.expires_in - 60) * 1000, scope: d.scope || '' });
    const volver = sessionStorage.getItem(K_VOLVER);
    sessionStorage.removeItem(K_VOLVER);
    if (volver && Object.values(VUELTAS).indexOf(volver) >= 0 && volver !== 'mando.html') { location.href = volver; return true; }
    toast('Conectado con Spotify');
  } catch (e) { toast('No se pudo completar la conexión (' + e.message + ')'); }
  return false;
}

/* ============================================================
   MIS ARTISTAS
   ------------------------------------------------------------
   Tu lista propia de artistas, aparte de los que sigues en
   Spotify (vienen del antiguo MusicVault, con sus etiquetas,
   notas y valoraciones). Vive en este aparato y se sincroniza
   con mis-artistas.json en tu repo de GitHub.
   Fusion: por artista, gana el cambio mas reciente (t); un
   borrado deja una tumba y no revive salvo que se vuelva a
   tocar despues.
   ============================================================ */
const K_MIS = 'mando_mis_artistas_v1';
const K_GH = 'musicvault_github_v1';          // token + repo, el mismo que usaba el vault
const K_MIGRADO = 'mando_migrado_vault_v1';
const GH_FILE = 'mis-artistas.json';
let MIS = null;
let _misIdx = null;
const misSync = { at: 0, msg: '', err: false, corriendo: false, t: 0 };
const ghCfg = () => { const g = leer(K_GH, null); return g && g.token && g.repo ? g : null; };
const misPorId = id => { if (!_misIdx) { _misIdx = new Map(); for (const a of MIS.artistas) _misIdx.set(a.id, a); } return _misIdx.get(id); };
const tagPorId = id => MIS.tags.find(t => t.id === id);

function fundirMis(a, b) {
  if (!b) return a;
  if (!a) return b;
  const tumbas = new Map();
  for (const t of (a.tumbas || []).concat(b.tumbas || [])) if (!tumbas.has(t.id) || tumbas.get(t.id) < t.at) tumbas.set(t.id, t.at);
  const m = new Map();
  for (const x of (a.artistas || []).concat(b.artistas || [])) { const p = m.get(x.id); if (!p || (x.t || 0) > (p.t || 0)) m.set(x.id, x); }
  const artistas = Array.from(m.values()).filter(x => !(tumbas.has(x.id) && tumbas.get(x.id) >= (x.t || 0)));
  const tags = new Map();
  for (const t of (b.tags || []).concat(a.tags || [])) tags.set(t.id, t);
  /* las tumbas de mas de un año ya no hacen falta */
  const lim = Date.now() - 365 * 864e5;
  return { app: 'MisArtistas', version: 1, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0),
    artistas: artistas.sort((x, y) => (y.added || 0) - (x.added || 0)), tags: Array.from(tags.values()),
    tumbas: Array.from(tumbas, ([id, at]) => ({ id, at })).filter(t => t.at > lim) };
}
function misGuardarLocal() {
  _misIdx = null;
  if (!escribir(K_MIS, MIS)) toast('No cabe en la memoria de este aparato');
}
function misCambiado() {
  MIS.updatedAt = Date.now();
  misGuardarLocal();
  clearTimeout(misSync.t);
  misSync.t = setTimeout(() => sincronizarMis(), 2500);
}

async function misAsegurar() {
  if (MIS) return MIS;
  MIS = leer(K_MIS, null);

    /* primera vez en este aparato: se baja la lista del repo */
    let r = null;

    if (!r) { try { const res = await fetch(GH_FILE + '?t=' + Date.now()); if (res.ok) r = await res.json(); } catch (e) {} }
    MIS = r || { app: 'MisArtistas', version: 1, updatedAt: 0, artistas: [], tags: [], tumbas: [] };
  }
  await migrarVaultLocal();
  misGuardarLocal();
  return MIS;
}
/* Si en este aparato quedaba un MusicVault con artistas sin subir, se
   rescatan aqui una sola vez para no perder nada. */
async function migrarVaultLocal() {
  if (leer(K_MIGRADO, false)) return;
  let items = leer('musicvault_items_v1', null), tags = leer('musicvault_tags_v1', null);
  try {
    const db = await new Promise((ok, ko) => { const r = indexedDB.open('musicvault', 1); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); }; r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
    const get = k => new Promise(ok => { const q = db.transaction('kv', 'readonly').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); });
    const i2 = await get('musicvault_items_v1'), t2 = await get('musicvault_tags_v1');
    if (Array.isArray(i2) && i2.length) items = i2;
    if (Array.isArray(t2) && t2.length) tags = t2;
    db.close();
  } catch (e) {}
  if (Array.isArray(items) && items.length) {
    const arts = items.filter(x => x && x.type === 'artist' && x.spotifyId).map(x => {
      const o = { id: x.spotifyId, name: x.title || '', img: x.coverUrl || '', added: x.dateAdded || 0, t: x.touchedAt || x.dateAdded || 0 };
      if (x.genres && x.genres.length) o.genres = x.genres.slice(0, 8);
      if (x.notes) o.notes = x.notes;
      if (x.rating) o.rating = x.rating;
      if (x.tagIds && x.tagIds.length) o.tags = x.tagIds.slice();
      return o;
    });
    const tg = (tags || []).map(t => { const o = { id: t.id, name: t.name, color: t.colorHex || '' }; if (t.carpetaId) o.carpeta = t.carpetaId; if (t.esCarpeta) o.esCarpeta = true; return o; });
    const antes = MIS.artistas.length;
    MIS = fundirMis(MIS, { artistas: arts, tags: tg, tumbas: [] });
    const nuevos = MIS.artistas.length - antes;
    if (nuevos > 0) { toast(nuevos + ' artistas rescatados del MusicVault de este aparato'); misSync.t = setTimeout(() => sincronizarMis(), 2500); }
  }
  escribir(K_MIGRADO, true);
}

/* ---- GitHub (Contents API) ---- */
function b64enc(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghFetch(url, o) {
  const g = ghCfg();
  o = o || {};
  return fetch(url, Object.assign({}, o, { headers: Object.assign({ Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json' }, o.headers || {}) }));
}
async function ghLeer(archivo) {
  const g = ghCfg();
  const api = 'https://api.github.com/repos/' + g.repo + '/contents/' + (archivo || GH_FILE);
  const res = await ghFetch(api + '?ref=main&t=' + Date.now());
  if (res.status === 401 || res.status === 403) throw new Error('el token de GitHub no tiene permiso sobre ' + g.repo);
  if (res.status === 404) return { sha: null, datos: null, api };
  if (!res.ok) throw new Error('GitHub respondió ' + res.status);
  const d = await res.json();
  /* por encima de 1 MB la API no trae el contenido: se pide en crudo */
  const crudo = await ghFetch(api + '?ref=main&t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw' } });
  if (!crudo.ok) throw new Error('GitHub respondió ' + crudo.status);
  return { sha: d.sha, datos: JSON.parse(await crudo.text()), api };
}
async function sincronizarMis(manual) {
  if (!MIS) return;
  if (!ghCfg()) { misSync.msg = 'Solo en este aparato'; pintarEstadoSync(); if (manual) hojaAjustes(); return; }
  if (misSync.corriendo) return;
  misSync.corriendo = true; misSync.msg = 'Sincronizando…'; pintarEstadoSync();
  try {
    for (let intento = 0; intento < 3; intento++) {
      const r = await ghLeer();
      const antes = MIS.artistas.length;
      const fundido = fundirMis(MIS, r.datos);
      const cuerpo = JSON.stringify(fundido);
      const traidos = fundido.artistas.length - antes;
      MIS = fundido; misGuardarLocal();
      if (r.datos && JSON.stringify(r.datos) === cuerpo) { hechoSync(traidos, manual); return; }
      const put = await ghFetch(r.api, { method: 'PUT', body: JSON.stringify({ message: 'mis artistas: ' + fundido.artistas.length, content: b64enc(cuerpo), branch: 'main', sha: r.sha || undefined }) });
      if (put.status === 409 || put.status === 422) continue;   // otro aparato escribio a la vez: se vuelve a fundir
      if (!put.ok) throw new Error('no he podido subirlo (' + put.status + ')');
      hechoSync(traidos, manual); return;
    }
    throw new Error('otro aparato estaba escribiendo; prueba otra vez');
  } catch (e) {
    misSync.err = true; misSync.msg = 'Error al sincronizar: ' + e.message;
    if (manual) toast(misSync.msg);
  } finally { misSync.corriendo = false; pintarEstadoSync(); }
}
function hechoSync(traidos, manual) {
  misSync.err = false; misSync.at = Date.now();
  misSync.msg = 'Sincronizado a las ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + (traidos > 0 ? ' · ' + traidos + ' traídos del otro aparato' : '');
  if (manual) toast('Sincronizado');
  if (traidos && S.tab === 'mis' && !S.vista) render();
}
function pintarEstadoSync() {
  const el = $('#misSync'); if (!el) return;
  el.textContent = misSync.msg || (ghCfg() ? 'Se guarda también en GitHub' : 'Solo en este aparato');
  el.style.color = misSync.err ? 'var(--rust)' : '';
}

/* ---- altas, bajas y ediciones ---- */
function misAnadir(arts) {
  const now = Date.now();
  const nuevos = [];
  for (const a of arts) {
    if (!a || !a.id || misPorId(a.id)) continue;
    const o = { id: a.id, name: a.name || '', img: imgDe(a.images, 200) || a.img || '', added: now, t: now };
    if (a.genres && a.genres.length) o.genres = a.genres.slice(0, 8);
    MIS.artistas.unshift(o); nuevos.push(o);
  }
  if (nuevos.length) { apuntar(nuevos.length === 1 ? '«' + nuevos[0].name + '» a Mis artistas' : nuevos.length + ' a Mis artistas', { t: 'misQuitar', ids: nuevos.map(x => x.id) }); misCambiado(); }
  return nuevos.length;
}
function misQuitar(ids, sinApuntar) {
  const fuera = new Set(ids), now = Date.now();
  const quitados = MIS.artistas.filter(a => fuera.has(a.id));
  MIS.artistas = MIS.artistas.filter(a => !fuera.has(a.id));
  for (const id of ids) MIS.tumbas.push({ id, at: now });
  if (!sinApuntar) apuntar(quitados.length === 1 ? '«' + quitados[0].name + '» fuera de Mis artistas' : quitados.length + ' fuera de Mis artistas', { t: 'misPoner', artistas: quitados });
  misCambiado();
  return quitados.length;
}
function misRestaurar(arts) {
  const now = Date.now();
  const ids = new Set(arts.map(a => a.id));
  MIS.tumbas = MIS.tumbas.filter(t => !ids.has(t.id));
  for (const a of arts) if (!misPorId(a.id)) { MIS.artistas.unshift(Object.assign({}, a, { t: now })); _misIdx = null; }
  misCambiado();
}
function misEditar(id, cambios) {
  const a = misPorId(id); if (!a) return;
  Object.assign(a, cambios, { t: Date.now() });
  for (const k of Object.keys(cambios)) if (cambios[k] === '' || cambios[k] === 0 || (Array.isArray(cambios[k]) && !cambios[k].length)) delete a[k];
  misCambiado();
}

function misVisibles() {
  const q = fold(S.filtro).trim().split(/\s+/).filter(Boolean);
  let v = MIS.artistas;
  if (MV.tag) {
    /* una carpeta incluye todas sus etiquetas */
    const ok = new Set([MV.tag].concat(MIS.tags.filter(t => t.carpeta === MV.tag).map(t => t.id)));
    v = v.filter(a => (a.tags || []).some(t => ok.has(t)));
  }
  if (MV.sigo && MV.soloNo) v = v.filter(a => !MV.sigo.has(a.id));
  if (q.length) v = v.filter(a => { const s = fold(a.name + ' ' + (a.notes || '') + ' ' + (a.genres || []).join(' ')); return q.every(w => s.indexOf(w) >= 0); });
  if (MV.orden === 'name') v = v.slice().sort((a, b) => COL.compare(a.name, b.name));
  else if (MV.orden === 'rating') v = v.slice().sort((a, b) => (b.rating || 0) - (a.rating || 0) || COL.compare(a.name, b.name));
  else if (MV.orden === 'antiguos') v = v.slice().sort((a, b) => (a.added || 0) - (b.added || 0));
  return v;
}
function subMis(a) {
  const tg = (a.tags || []).map(tagPorId).filter(t => t && !t.esCarpeta).slice(0, 3).map(t => t.name);

  if (a.rating) partes.push('★'.repeat(a.rating));
  partes.push(tg.length ? tg.join(', ') : (a.genres || []).slice(0, 3).join(', '));
  if (a.notes) partes.push('✎ ' + a.notes);
  return partes.filter(Boolean).join(' · ');
}

    '<div id="tL">' + (bloques || '<div class="vacio">Aún no hay etiquetas</div>') + '</div>' +

      h.querySelector('#tL').onclick = e => {

        if (!multiple) { cerrarHoja(); alElegir(b.dataset.tag); return; }
        sel.has(b.dataset.tag) ? sel.delete(b.dataset.tag) : sel.add(b.dataset.tag);

      if (multiple) {
        h.querySelector('#tCrear').onclick = () => {

          toast('Etiqueta «' + n + '» creada');
        };
        h.querySelector('#tOk').onclick = () => { cerrarHoja(); alElegir(Array.from(sel)); };
      }
    });
}

async function misAccion(a) {

/* Desde «Seguidos» o una seleccion de canciones: pasar artistas a la lista */
/* Antes se pedia a Spotify cada artista uno a uno, y esa ruta Spotify la
   limita muchisimo: con cientos de artistas te ponia en pausa. Ahora se usa
   lo que ya se sabe (nombre en las canciones, foto en «Seguidos») y la foto
   que falte se completa sola al abrir el artista. */
function artistasConocidos() {
  const m = new Map();
  for (const a of (S.segCache || [])) m.set(a.id, { id: a.id, name: a.name, img: a.imgG || a.img || '', genres: a.generos });
  const mete = a => { if (a && a.id && !m.has(a.id)) m.set(a.id, { id: a.id, name: a.name, img: a.img || '' }); };
  for (const a of (S.artistas || [])) m.set(a.id, { id: a.id, name: a.name, img: a.imgG || a.img || '', genres: a.generos });
  const listas = [S.fuente && S.fuente.pistas, S.likes, S.visibles].concat(Object.values(ST.datos || {}).map(d => d && d.tracks));
  for (const l of listas) if (l) for (const p of l) for (const a of (p.artists || [])) mete(a);
  for (const d of Object.values(ST.datos || {})) if (d && d.arts) for (const a of d.arts) m.set(a.id, { id: a.id, name: a.name, img: a.imgG || a.img || '', genres: a.generos });
  return m;
}
async function aMisDesdeUris(uris) {
  const ids = Array.from(new Set(uris.map(u => String(u).split(':')[2]).filter(Boolean))).filter(id => !misPorId(id));
  if (!ids.length) { toast('Ya estaban todos en Mis artistas'); return; }
  const con = artistasConocidos();
  const arts = ids.map(id => con.get(id)).filter(a => a && a.name);
  const faltan = ids.filter(id => !con.has(id) || !con.get(id).name).slice(0, 15);
  if (faltan.length) {
    await trabajo(async () => {
      for (let i = 0; i < faltan.length; i++) {
        progreso('Leyendo artistas', i, faltan.length);
        try { arts.push(await artistaLigero(faltan[i])); } catch (e) { if (esCaida(e) || e.message === 'DETENIDO') break; }
      }
    }, 'Leyendo artistas');
  }
  toast(misAnadir(arts) + ' añadidos a Mis artistas');
}

      lp = null; if (el.dataset.id === '_likes') return; saltar = true; G.saltar = Date.now() + 700;
      if (navigator.vibrate) try { navigator.vibrate(12); } catch (z) {}
      if (!modoSelPl) { modoSelPl = true; S.selObj.clear(); S.selObj.add(el.dataset.id); render(); }
      else { S.selObj.add(el.dataset.id); el.classList.add('sel'); pintarAccion(); }

    el.onpointermove = e => { if (lp && (Math.abs(e.clientX - lp.x) > 9 || Math.abs(e.clientY - lp.y) > 9)) { clearTimeout(lp.t); lp = null; } };
    el.onpointerup = el.onpointercancel = () => { if (lp) { clearTimeout(lp.t); lp = null; } };

      if (saltar || G.saltar > Date.now()) { saltar = false; G.saltar = 0; return; }

async function xlsxConstruir(cab, filas, anchos, nombreHoja) {
  const enc = new TextEncoder();
  const esc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    parts.push(x + '</row>');

  parts.push('</sheetData><autoFilter ref="A1:' + col(cab.length - 1) + (filas.length + 1) + '"/></worksheet>');

    ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + esc(nombreHoja) + '" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1DB954"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
    ['xl/worksheets/sheet1.xml', hoja]
  ];
  const tabla = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tabla[n] = c >>> 0; }

    let d = d0, met = 0;
    if (typeof CompressionStream === 'function') { try { d = new Uint8Array(await new Response(new Blob([d0]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); met = 8; } catch (e) { d = d0; met = 0; } }
    const lh = new DataView(new ArrayBuffer(30));

    central.push(new Uint8Array(ch.buffer), n);
    pos += 30 + n.length + d.length;
  }
  let tc = 0; for (const t of central) tc += t.length;
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, ficheros.length, true); fin.setUint16(10, ficheros.length, true); fin.setUint32(12, tc, true); fin.setUint32(16, pos, true);

  const fecha = t => t ? new Date(t).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' }) : null;
  const filas = ps.map((p, i) => [i + 1, p.title, nombresArtistas(p), p.album || null, +p.year || null, fecha(p.added), dur(p.ms), p.local ? null : 'https://open.spotify.com/track/' + p.id]);
  const blob = await xlsxConstruir(['#', 'Canción', 'Artistas', 'Álbum', 'Año', 'Añadida', 'Duración', 'Enlace'], filas, [6, 38, 30, 34, 7, 12, 9, 52], String(nombre).replace(/[\/?*\[\]:]/g, ' ').slice(0, 31) || 'Canciones');
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = String(nombre).replace(/[\/:*?"<>|]+/g, ' ').trim() + '.xlsx';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
}
function hojaExportar(nombre, ps) {

        else if (o === 'csv') descargar(nombre + '.csv', csvDe(ps), 'text/csv');

      };
