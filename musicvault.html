      <button class="btn" id="bulkFileBtn" title="Cargar una lista de títulos desde un archivo">📄 Archivo</button>
    </div>
    <input type="file" id="bulkFile" accept=".txt,text/plain" class="hidden">
    <div id="bulkOut" style="margin-top:14px;font-size:13.5px;color:var(--fg-soft);line-height:1.6;">${_bulkCorriendo ? 'Sigue buscando lo que pegaste antes de cerrar este panel…' : ''}</div>
  `;
}

function wireBulkSheet() {
  document.getElementById('bulkSegs').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    if (b.dataset.t === 'back') { openSearch(); return; }
    if (b.dataset.t === 'links') { bulkInputMode = 'links'; openBulk(); return; }
    if (b.dataset.t === 'names') { bulkInputMode = 'names'; openBulk(); return; }
  });

  if (bulkInputMode === 'names') {
    document.getElementById('bulkNameSeg').addEventListener('click', e => {
      const b = e.target.closest('.seg'); if (!b) return;
      bulkNameType = b.dataset.nt;
      document.querySelectorAll('#bulkNameSeg .seg').forEach(x => x.classList.toggle('on', x === b));
    });
    document.getElementById('bulkFileBtn').addEventListener('click', () => document.getElementById('bulkFile').click());
    document.getElementById('bulkFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const box = document.getElementById('bulkNames');
        box.value = (box.value ? box.value + '\n' : '') + fr.result;
      };
      fr.readAsText(f);
      e.target.value = '';
    });
    document.getElementById('bulkGo').addEventListener('click', runBulkByName);
    document.getElementById('bulkNames').focus();
  } else {
    document.getElementById('bulkFileBtn').addEventListener('click', () => document.getElementById('bulkFile').click());
    document.getElementById('bulkFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const box = document.getElementById('bulkIn');
        box.value = (box.value ? box.value + '\n' : '') + fr.result;
        const n = (String(fr.result).match(/open\.spotify\.com\//g) || []).length;
        document.getElementById('bulkOut').innerHTML = `Archivo cargado: <strong>${n}</strong> enlaces detectados. Pulsa “Añadir al vault”.`;
      };
      fr.readAsText(f);
      e.target.value = '';
    });
    document.getElementById('plMode').addEventListener('click', e => {
      const b = e.target.closest('.seg'); if (!b) return;
      playlistMode = b.dataset.m;
      document.querySelectorAll('#plMode .seg').forEach(x => x.classList.toggle('on', x === b));
    });
    document.getElementById('bulkGo').addEventListener('click', runBulk);
    document.getElementById('bulkIn').focus();
  }
}

async function runBulk() {
  const out = document.getElementById('bulkOut');
  const go = document.getElementById('bulkGo');
  if (_bulkCorriendo) { out.innerHTML = 'Ya hay una subida en marcha (la empezaste antes de cerrar este panel). Espera a que termine.'; return; }
  if (!isConnected()) {
    out.innerHTML = 'Este dispositivo aún no está conectado con Spotify. La conexión es por dispositivo: ve a ⚙ Ajustes y conéctate también aquí.';
    return;
  }
  const text = document.getElementById('bulkIn').value;

  const playlists = [];
  let m; URL_PLAYLIST.lastIndex = 0;
  while ((m = URL_PLAYLIST.exec(text)) !== null) if (!playlists.includes(m[1])) playlists.push(m[1]);

  const singles = new Map();
  URL_ALL.lastIndex = 0;
  while ((m = URL_ALL.exec(text)) !== null) singles.set(m[2], m[1]);

  if (!playlists.length && !singles.size) { out.innerHTML = 'No he encontrado ningún enlace de Spotify en ese texto.'; return; }

  _bulkCorriendo = true;
  go.disabled = true;
  let added = 0, dup = 0, fail = 0;
  let necesitaReconectarPlaylist = false;
  const notes = [];

  try {
  // 1) playlists
  for (const pid of playlists) {
    try {
      // la playlist en sí, como marcador con enlace directo (si falla solo esto,
      // seguimos igualmente con sus canciones/álbumes más abajo)
      try {
        const marcador = normalize(await fetchPlaylistMeta(pid), 'playlist');
        if (ITEMS.some(x => x.spotifyId === marcador.spotifyId)) dup++;
        else { ITEMS.push(makeItem(marcador)); added++; }
      } catch {}

      const tracks = await fetchPlaylist(pid, (got, tot) => { out.innerHTML = `Leyendo playlist… ${got} de ${tot} canciones`; });
      const wanted = new Map();
      for (const t of tracks) {
        if (playlistMode === 'albums') {
          if (t.album?.id) wanted.set(t.album.id, normalize(t.album, 'album'));
        } else {
          wanted.set(t.id, normalize(t, 'track'));
        }
      }
      let i = 0;
      for (const [sid, r] of wanted) {
        i++;
        if (i % 10 === 0) out.innerHTML = `Guardando ${i} de ${wanted.size}… <strong>${added}</strong> añadidos`;
        if (ITEMS.some(x => x.spotifyId === sid)) { dup++; continue; }
        ITEMS.push(makeItem(r)); added++;
      }
      notes.push(`Playlist: ${wanted.size} ${playlistMode === 'albums' ? 'álbumes' : 'canciones'} encontrad${playlistMode === 'albums' ? 'os' : 'as'}`);
    } catch (err) {
      const code = (err.message || '').split(':')[1];
      if (code === '403' && !tieneScopePlaylists()) {
        notes.push('Una playlist dio error 403 — para leer playlists privadas hace falta darle un permiso nuevo a esta conexión.');
        necesitaReconectarPlaylist = true;
      } else {
        notes.push(code === '404'
          ? 'Una playlist no es accesible (privada, o de las que genera Spotify — solo funcionan las públicas de usuario).'
          : `Una playlist falló (error ${code || '?'}).`);
      }
      fail++;
    }
  }

  // 2) enlaces sueltos, uno a uno (con 5 en paralelo — ver fetchItemsIndividually)
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));
  const porTipo = { album: [], track: [], artist: [] };
  for (const [id, type] of singles) {
    if (yaTengo.has(id)) { dup++; continue; }
    if (porTipo[type]) porTipo[type].push(id);
  }
  const pendientes = porTipo.album.length + porTipo.track.length + porTipo.artist.length;
  let hechosTotal = 0;

  for (const tipo of ['album', 'track', 'artist']) {
    const ids = porTipo[tipo];
    if (!ids.length) continue;
    let datos;
    try {
      datos = await fetchItemsIndividually(tipo, ids, (n) => {
        out.innerHTML = `Procesando ${hechosTotal + n} de ${pendientes}… <strong>${added}</strong> añadidos`;
      });
    } catch (e) {
      /* Si el fallo es de credenciales, va a fallar exactamente igual con
         cada elemento que quede: antes seguía intentando todos en silencio y
         al final solo decía "N fallaron", sin explicar por qué. Ahora para
         en el primero y lo dice. */
      out.innerHTML = `Parado: tu conexión con Spotify en este dispositivo no es válida o ha caducado. Vuelve a conectarte en Ajustes.<br><span style="color:var(--fg-mute);font-size:12.5px;">${added} añadidos antes de fallar.</span>`;
      return;   // el finally de más abajo repone _bulkCorriendo y el botón
    }
    datos.forEach(raw => {
      if (!raw || !raw.id || yaTengo.has(raw.id)) { if (!raw) fail++; return; }
      ITEMS.push(makeItem(normalize(raw, tipo)));
      yaTengo.add(raw.id);
      added++;
    });
    hechosTotal += ids.length;
    saveItems();   // guardado parcial por si el usuario cierra a mitad
  }

  saveItems(); render();
  const bits = [`<strong>${added}</strong> añadidos`];
  if (dup) bits.push(`${dup} ya estaban`);
  if (fail) bits.push(`${fail} fallaron`);
  out.innerHTML = bits.join(' · ')
    + (notes.length ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">${notes.map(esc).join('<br>')}</span>` : '')
    + (necesitaReconectarPlaylist ? `<div class="btnrow"><button class="btn primary wide" data-reconnect="1">Reconectar con Spotify</button></div>` : '');
  if (added) toast(`${added} añadido${added === 1 ? '' : 's'} al vault`);
  } finally {
    _bulkCorriendo = false;
    go.disabled = false;
  }
}

/* Añadir "por nombre": una línea = una búsqueda, se guarda la primera
   coincidencia. Comparte _bulkCorriendo con runBulk() a propósito — evita que
   una subida por enlaces y otra por nombre corran a la vez y dupliquen algo,
   el mismo motivo por el que existe ese cerrojo. */
async function runBulkByName() {
  const out = document.getElementById('bulkOut');
  const go = document.getElementById('bulkGo');
  if (_bulkCorriendo) { out.innerHTML = 'Ya hay una subida en marcha (la empezaste antes de cerrar este panel). Espera a que termine.'; return; }
  if (!isConnected()) {
    out.innerHTML = 'Este dispositivo aún no está conectado con Spotify. La conexión es por dispositivo: ve a ⚙ Ajustes y conéctate también aquí.';
    return;
  }
  const lineas = [...new Set(document.getElementById('bulkNames').value.split('\n').map(s => s.trim()).filter(Boolean))];
  if (!lineas.length) { out.innerHTML = 'Escribe al menos un título, uno por línea.'; return; }

  _bulkCorriendo = true;
  go.disabled = true;
  const tipo = bulkNameType;
  let added = 0, dup = 0;
  const sinCoincidencia = [];
  const yaTengo = new Set(ITEMS.map(x => x.spotifyId));

  try {
    const CONCURRENCIA = 3;   // cada línea es una búsqueda entera, más cara que un lookup: menos paralelismo que fetchItemsIndividually
    let i = 0, hechos = 0, pararTodo = null;
    async function trabajador() {
      while (i < lineas.length && !pararTodo) {
        const mio = i++;
        const texto = lineas[mio];
        try {
          const d = await spotifySearch(texto, tipo, 0);
          const top = (d[tipo + 's']?.items || [])[0];
          if (!top) sinCoincidencia.push(texto);
          else if (yaTengo.has(top.id)) dup++;
          else { ITEMS.push(makeItem(normalize(top, tipo))); yaTengo.add(top.id); added++; }
        } catch (e) {
          const msg = e.message || '';
          if (msg === 'AUTH_FAILED' || msg === 'NO_CREDS') { pararTodo = e; return; }
          sinCoincidencia.push(texto);   // fallo puntual (red, límite agotado…): cuenta como sin encontrar, no para todo
        }
        hechos++;
        out.innerHTML = `Buscando ${hechos} de ${lineas.length}… <strong>${added}</strong> añadidos`;
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCIA, lineas.length) }, trabajador));
    if (pararTodo) {
      out.innerHTML = `Parado: tu conexión con Spotify en este dispositivo no es válida o ha caducado. Vuelve a conectarte en Ajustes.<br><span style="color:var(--fg-mute);font-size:12.5px;">${added} añadidos antes de fallar.</span>`;
      return;
    }
    saveItems(); render();
    const bits = [`<strong>${added}</strong> añadidos`];
    if (dup) bits.push(`${dup} ya estaban`);
    if (sinCoincidencia.length) bits.push(`${sinCoincidencia.length} sin coincidencia`);
    out.innerHTML = bits.join(' · ') + (sinCoincidencia.length
      ? `<br><span style="color:var(--fg-mute);font-size:12.5px;">Sin encontrar: ${sinCoincidencia.slice(0, 15).map(esc).join(', ')}${sinCoincidencia.length > 15 ? '…' : ''}</span>`
      : '');
    if (added) toast(`${added} añadido${added === 1 ? '' : 's'} al vault — revisa que sea la versión correcta`);
  } finally {
    _bulkCorriendo = false;
    go.disabled = false;
  }
}

/* ---- enlace externo (lo que no está en Spotify) ----
   El vault entero está pensado en torno a un spotifyId real: es la clave que
   usan la deduplicación, las tumbas de borrado y la fusión al sincronizar. En
   vez de montar un sistema de ids en paralelo, a estos elementos se les da un
   spotifyId sintético (prefijo "manual:") que encaja en todo ese mecanismo
   como una clave opaca cualquiera, y se marcan con `manual: true` para que
   "Completar carátulas" y "Actualizar desde Spotify" —que sí necesitan un
   id real de catálogo— los dejen en paz. */
let manualType = 'album';

function openManualAdd() {
  manualType = 'album';
  showSheet(`
    <div class="sheethead"><h2>Enlace externo</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <div class="segrow" id="manSegs">

      <button class="seg on" data-t="manual">🔗 Externo</button>
    </div>
    <p class="lede">Para lo que no está en Spotify: un disco que solo existe en YouTube, Bandcamp, SoundCloud… Rellena lo que sepas — luego se edita como cualquier otro elemento del vault.</p>

    <div class="flabel">Tipo</div>
    <div class="segrow" id="manType">
      <button class="seg on" data-mt="album">💿 Álbum</button>
      <button class="seg" data-mt="track">🎵 Canción</button>
      <button class="seg" data-mt="artist">🎤 Artista</button>
    </div>
    <input class="field" id="manTitle" placeholder="Título *" style="margin-bottom:8px;">
    <input class="field" id="manArtist" placeholder="Artista(s), separados por comas" style="margin-bottom:8px;">
    <input class="field mono" id="manUrl" placeholder="Enlace (empieza por http:// o https://) *" autocomplete="off" spellcheck="false" style="margin-bottom:8px;">
    <input class="field mono" id="manCover" placeholder="URL de carátula (opcional)" autocomplete="off" spellcheck="false">
    <div class="btnrow"><button class="btn primary wide" id="manGo">Añadir al vault</button></div>
  `);
  document.getElementById('manSegs').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    if (b.dataset.t === 'back') openSearch();
  });
  document.getElementById('manType').addEventListener('click', e => {
    const b = e.target.closest('.seg'); if (!b) return;
    manualType = b.dataset.mt;
    document.querySelectorAll('#manType .seg').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('manGo').addEventListener('click', () => {
    const title = document.getElementById('manTitle').value.trim();
    const url = document.getElementById('manUrl').value.trim();
    if (!title) { toast('Falta el título'); return; }
    if (!/^https?:\/\//i.test(url)) { toast('Pon un enlace válido (empieza por http:// o https://)'); return; }
    const artistsStr = document.getElementById('manArtist').value.trim();
    const cover = document.getElementById('manCover').value.trim();
    const item = makeItem({
      spotifyId: 'manual:' + uid(), type: manualType, title,
      artists: artistsStr ? artistsStr.split(',').map(s => s.trim()).filter(Boolean) : [],
      coverUrl: cover || null, spotifyUrl: url, manual: true,
      releaseDate: null, albumName: null, albumId: null, durationMs: null, totalTracks: null,
      label: null, popularity: null, genres: null, followers: null, explicit: null,
      trackNumber: null, discNumber: null, albumType: null, isrc: null
    });
    ITEMS.push(item);
    saveItems(); render(); closeModal();
    toast('Añadido al vault');
  });
  document.getElementById('manTitle').focus();
}

/* ---- detail ---- */

  const it = ITEMS.find(x => x.id === id);
  if (!it) return;
  const y = yearOf(it);
  showSheet(`
    <div class="sheethead"><h2>${TYPE_ICON[it.type]} ${TYPE_LABEL[it.type]}</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <div class="dwrap">
      <div class="dart">${portada(it.coverUrl, TYPE_ICON[it.type], false)}</div>
      <div>
        <h3 class="dtitle">${esc(it.title)}</h3>
        <p class="dartist">${esc(artistsOf(it))}</p>
        <div class="dfacts">
          ${it.archived ? `<span class="fact">📦 Archivado</span>` : ''}
          ${y ? `<span class="fact">${y}</span>` : ''}
          ${fmtDur(it.durationMs) ? `<span class="fact">${fmtDur(it.durationMs)}</span>` : ''}
          ${it.albumType ? `<span class="fact">${esc(ALBUM_TYPE_ES[it.albumType] || it.albumType)}</span>` : ''}
          ${it.explicit ? `<span class="fact">Explícito</span>` : ''}
        </div>
        ${it.type !== 'artist' ? `<div class="btnrow">
          <button class="btn ${it.listened ? 'jade' : ''} wide" id="dListen">${it.listened ? '✓ Ya escuchado' : 'Marcar como escuchado'}</button>
        </div>` : ''}
      </div>
    </div>

    <div class="flabel">Valoración</div>
    <div class="starpick" id="dStars">
      ${[1,2,3,4,5].map(n => `<button data-n="${n}" class="${n <= (it.rating || 0) ? 'on' : ''}" aria-label="${n} estrellas">★</button>`).join('')}
    </div>

    <div class="flabel" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span>Metadatos</span>
      <span style="display:flex;gap:10px;">
        <button class="linkbtn" id="dEdit">Editar</button>
        ${it.manual ? '' : `<button class="linkbtn" id="dRefresh">Actualizar</button>`}
      </span>
    </div>
    <div id="dMeta">${metaTableHtml(it)}</div>

    <div class="flabel">Notas</div>
    <textarea class="field" id="dNotes" placeholder="¿Por qué lo guardaste? ¿Quién te lo recomendó?">${esc(it.notes || '')}</textarea>

    <div class="flabel">Etiquetas</div>
    <div class="tagpick" id="dTags">
      ${TAGS.length ? TAGS.map(t => `<button class="tagsel ${(it.tagIds || []).includes(t.id) ? '' : 'off'}" data-tag="${esc(t.id)}"><span class="dot" style="background:${esc(t.colorHex)}"></span>${esc(t.name)}</button>`).join('')
        : `<p class="lede" style="margin:0;">Todavía no has creado ninguna etiqueta. <button class="linkbtn" data-open="settings">Crear una</button></p>`}
    </div>

    ${it.type === 'artist' && !it.manual ? `<div class="btnrow"><button class="btn wide" id="dDisco">Ver su discografía</button></div>` : ''}
    <div class="btnrow">
      <a class="btn primary wide" href="${esc(it.spotifyUrl)}" target="_blank" rel="noopener">${it.manual ? 'Abrir enlace' : 'Abrir en Spotify'} ↗</a>
    </div>
    <div class="btnrow">
      <button class="btn wide" id="dArchive">${it.archived ? '📤 Sacar del archivo' : '📦 Archivar'}</button>
    </div>
    <div class="btnrow">
      <button class="btn danger wide" id="dDel">Eliminar del vault</button>
    </div>
  `);

  document.getElementById('dDisco')?.addEventListener('click', () => openDiscography(it));
  wireMeta(it, id);

  document.getElementById('dArchive').addEventListener('click', () => {
    it.archived = !it.archived;
    it.touchedAt = Date.now();
    const quedaArchivado = it.archived;
    saveItems(); render(); openDetail(id);
    toast(quedaArchivado ? 'Archivado — sigue en tu vault, fuera de las listas normales' : 'Fuera del archivo', 'Deshacer', () => {
      it.archived = !quedaArchivado;
      it.touchedAt = Date.now();
      saveItems(); render();
      if (document.getElementById('dArchive')) openDetail(id);
    });
  });

  document.getElementById('dListen')?.addEventListener('click', () => { it.listened = !it.listened; saveItems(); render(); openDetail(id); });
  document.getElementById('dStars').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const n = +b.dataset.n;
    it.rating = it.rating === n ? 0 : n;
    saveItems(); render(); openDetail(id);
  });
  const notes = document.getElementById('dNotes');
  notes.addEventListener('input', () => { it.notes = notes.value; saveItems(); });
  document.getElementById('dTags').addEventListener('click', e => {
    const b = e.target.closest('.tagsel'); if (!b) return;
    it.tagIds = it.tagIds || [];
    const tid = b.dataset.tag;
    it.tagIds = it.tagIds.includes(tid) ? it.tagIds.filter(x => x !== tid) : it.tagIds.concat(tid);
    saveItems(); render(); openDetail(id);
  });
  document.getElementById('dDel').addEventListener('click', () => { closeModal(); deleteItems([id]); });
}

/* ---- metadatos: ver / editar / refrescar ---- */
function metaTableHtml(it) {
  const rows = metaPairs(it);
  return `<dl class="metalist">${rows.map(([k, v]) =>
    `<div class="metarow"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
}

// Campos que tiene sentido que corrijas a mano.
const EDITABLE = [
  ['title', 'Título', 'text'],
  ['artistsStr', 'Artista(s), separados por comas', 'text'],
  ['albumName', 'Álbum', 'text'],
  ['releaseDate', 'Fecha de lanzamiento (AAAA o AAAA-MM-DD)', 'text'],
  ['label', 'Sello discográfico', 'text'],
  ['genresStr', 'Géneros, separados por comas', 'text'],
  ['coverUrl', 'URL de la carátula', 'text']
];

function metaFormHtml(it) {
  const val = f => f === 'artistsStr' ? artistsOf(it)
    : f === 'genresStr' ? (it.genres || []).join(', ')
    : (it[f] ?? '');
  return `<div class="metaform">
    ${EDITABLE.map(([f, label]) => `
      <label class="mfield">
        <span>${esc(label)}</span>
        <input class="field" data-f="${f}" value="${esc(val(f))}">
      </label>`).join('')}
    <div class="btnrow">
      <button class="btn primary wide" id="mSave">Guardar cambios</button>
      <button class="btn wide" id="mCancel">Cancelar</button>
    </div>
  </div>`;
}

function wireMeta(it, id) {
  document.getElementById('dEdit')?.addEventListener('click', () => {
    document.getElementById('dMeta').innerHTML = metaFormHtml(it);
    document.getElementById('mCancel').addEventListener('click', () => { document.getElementById('dMeta').innerHTML = metaTableHtml(it); wireMeta(it, id); });
    document.getElementById('mSave').addEventListener('click', () => {
      document.querySelectorAll('.metaform [data-f]').forEach(inp => {
        const f = inp.dataset.f, v = inp.value.trim();
        if (f === 'artistsStr') it.artists = v ? v.split(',').map(s => s.trim()).filter(Boolean) : [];
        else if (f === 'genresStr') it.genres = v ? v.split(',').map(s => s.trim()).filter(Boolean) : null;
        else it[f] = v || null;
      });
      it.editedByUser = true;
      it.touchedAt = Date.now();   // una edición manual también debe ganarle a una tumba vieja
      saveItems(); render(); openDetail(id);
      toast('Metadatos actualizados');
    });
  });

  document.getElementById('dRefresh')?.addEventListener('click', async () => {
    const btn = document.getElementById('dRefresh');
    if (!isConnected()) { toast('Conecta Spotify en Ajustes primero'); return; }
    if (it.editedByUser && !confirm('Editaste estos datos a mano. Actualizar desde Spotify los sobrescribirá. ¿Continuar?')) return;
    btn.textContent = 'Actualizando…';
    try {
      const fresh = normalize(await spotifyLookup(it.type, it.spotifyId), it.type);
      // conservo lo que es tuyo: notas, valoración, etiquetas, estado y fecha de guardado
      Object.assign(it, fresh, {
        id: it.id, dateAdded: it.dateAdded, notes: it.notes, rating: it.rating,
        tagIds: it.tagIds, listened: it.listened, editedByUser: false, touchedAt: Date.now()
      });
      saveItems(); render(); openDetail(id);
      toast('Metadatos recargados desde Spotify');
    } catch (err) {
      btn.textContent = 'Actualizar';
      toast('No se pudo actualizar (' + ((err.message || '').split(':')[1] || 'error') + ')');
    }
  });
}

/* Traía limit=50 de golpe, pero este endpoint (a diferencia de /search) siempre
   ha tenido el máximo en 10 — con más, Spotify responde 400 (parámetro
   inválido), no un fallo de red. Pagina de 10 en 10 hasta agotar el catálogo
   del artista o llegar a un tope razonable. */
async function fetchArtistAlbums(artistId, onProgress) {
  let out = [], offset = 0, total = null;
  while (offset < 200) {
    const t = await spotifyToken();
    const res = await fetchConReintento429(`https://api.spotify.com/v1/artists/${artistId}/albums?include_groups=album,single&limit=10&offset=${offset}&market=ES`, t);
    if (res.status === 429) throw new Error('RATE_LIMIT');
    if (!res.ok) throw new Error('DISCO_FAILED:' + res.status);
    const d = await res.json();
    if (total === null) total = d.total;
    out = out.concat(d.items || []);
    onProgress?.(out.length, Math.min(total, 200));
    offset += 10;
    if (offset >= total || !(d.items || []).length) break;
  }
  return out;
}

    <div id="discoOut"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  `);
  const box = document.getElementById('discoOut');
  // un artista de "enlace externo" no tiene un id real de catálogo: pedir su
  // discografía a Spotify daría un 400 (id inválido), no un fallo de red
  if (artist.manual || !artist.spotifyId || String(artist.spotifyId).startsWith('manual:')) {
    box.innerHTML = `<div class="empty" style="padding:24px 8px;"><p>Este artista es un enlace externo, no tiene ficha ni discografía en Spotify.</p></div>`;
    return;
  }
  try {

      if (tot > 10) box.innerHTML = `<p class="lede" style="text-align:center;padding:20px 4px;">Leyendo discografía… ${got} de ${tot}</p>`;
    });
    // Spotify repite el mismo disco en varias ediciones; me quedo con uno por título.
    const seen = new Set();
    lastResults = items.map(a => normalize(a, 'album'))
      .filter(r => { const k = fold(r.title); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => (parseInt(String(b.releaseDate || '0').slice(0, 4)) || 0) - (parseInt(String(a.releaseDate || '0').slice(0, 4)) || 0));
    box.innerHTML = lastResults.length ? lastResults.map(rrow).join('') : `<div class="empty" style="padding:24px 8px;"><p>Spotify no devuelve álbumes para este artista.</p></div>`;
  } catch (err) {
    const text = err.message === 'RATE_LIMIT'
      ? 'Demasiadas peticiones seguidas — espera unos segundos y vuelve a intentarlo.'
      : `No se pudo cargar la discografía (${esc((err.message || '').split(':')[1] || 'error')}).`;
    box.innerHTML = `<div class="empty" style="padding:24px 8px;"><p>${text}</p></div>`;
  }
}

/* ---- settings ---- */
let swatch = TAG_COLORS[0];

/* ============ sincronización vía GitHub ============
   El vault se guarda como un JSON en tu repo. Cada dispositivo se baja el
   remoto, lo funde con lo suyo y vuelve a subir el resultado.
   Reglas de la fusión:
     · unión por spotifyId — nadie pierde lo que ha añadido
     · si el mismo elemento está en los dos, gana el del documento más reciente
     · un borrado deja una "tumba" con su hora: si la tumba es posterior a la
       última edición del elemento, el borrado manda y no revive. */
const GH_PATH = 'musicvault-sync.json';
let _syncEstado = { at: 0, msg: '', err: false };
let _syncTimer = null, _syncCorriendo = false;

const ghCfg = () => { const g = read(K_GH, null); return (g && g.token && g.repo) ? g : null; };

function syncEstadoTexto() {
  if (!ghCfg()) return 'Ahora mismo este dispositivo guarda solo en local.';
  if (!_syncEstado.at) return 'Sin sincronizar todavía en esta sesión.';
  return _syncEstado.msg;
}

/* Nada de String.fromCharCode(...bytes): con un vault de miles de elementos son
   millones de argumentos y se desborda la pila de llamadas. Va por trozos. */
function b64enc(s) {
  const bytes = new TextEncoder().encode(s);
  const TROZO = 0x8000;
  let bin = '';
  for (let i = 0; i < bytes.length; i += TROZO) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + TROZO));
  }
  return btoa(bin);
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));

async function ghFetch(url, opts) {
  const g = ghCfg();
  return fetch(url, Object.assign({}, opts, {
    headers: Object.assign({
      Authorization: 'Bearer ' + g.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, (opts && opts.headers) || {})
  }));
}

function fundir(remoto) {
  const tombLocal = TOMB.slice();
  (remoto.tombstones || []).forEach(t => { if (t && t.sid) tombLocal.push(t); });
  const ultimaTumba = new Map();
  tombLocal.forEach(t => {
    if (!ultimaTumba.has(t.sid) || t.at > ultimaTumba.get(t.sid)) ultimaTumba.set(t.sid, t.at);
  });

  const remotoGana = (remoto.updatedAt || 0) > (META.updatedAt || 0);
  const porId = new Map();
  const meter = (arr, prioritario) => (arr || []).forEach(it => {
    if (!it || !it.spotifyId) return;
    if (!porId.has(it.spotifyId) || prioritario) porId.set(it.spotifyId, it);
  });
  meter(remotoGana ? ITEMS : remoto.items, false);
  meter(remotoGana ? remoto.items : ITEMS, true);

  const vivos = [];
  porId.forEach((it, sid) => {
    const muerto = ultimaTumba.get(sid);
    // el elemento sobrevive si se tocó (deshacer, edición) después de que lo borraran
    const marca = it.touchedAt || it.dateAdded;
    if (muerto && !(marca && marca > muerto)) return;
    vivos.push(it);
  });

  const nombres = new Set(TAGS.map(t => t.name.toLowerCase()));
  (remoto.tags || []).forEach(t => {
    if (t && t.name && !nombres.has(t.name.toLowerCase())) { TAGS.push(t); nombres.add(t.name.toLowerCase()); }
  });

  const cambia = vivos.length !== ITEMS.length;
  ITEMS = vivos;
  TOMB = tombLocal;
  saveTomb();          // deduplica y poda
  return cambia;
}

async function sincronizar(manual) {
  const g = ghCfg();
  if (!g) return 'Ahora mismo este dispositivo guarda solo en local.';
  if (_syncCorriendo) return 'Ya hay una sincronización en marcha.';
  _syncCorriendo = true;
  const api = `https://api.github.com/repos/${g.repo}/contents/${GH_PATH}`;
  try {
    // 1) bajar el remoto
    let sha = null, remoto = null;
    const res = await ghFetch(api + '?ref=main&t=' + Date.now());
    if (res.status === 401 || res.status === 403) throw new Error('El token no tiene permiso sobre ese repo.');
    if (res.status === 404 && !res.headers.get('x-ratelimit-remaining')) throw new Error('No encuentro ese repo. Revisa usuario/repo.');
    if (res.ok) {
      const d = await res.json();
      sha = d.sha;
      if (d.content) {
        try { remoto = JSON.parse(b64dec(d.content.replace(/\n/g, ''))); } catch { remoto = null; }
      } else {
        /* Por encima de 1 MB la API no incluye el contenido: hay que pedirlo en
           crudo. Devuelve el archivo tal cual, sin límite práctico de tamaño. */
        const crudo = await ghFetch(api + '?ref=main&t=' + Date.now(),
                                    { headers: { Accept: 'application/vnd.github.raw' } });
        if (crudo.ok) { try { remoto = JSON.parse(await crudo.text()); } catch { remoto = null; } }
      }
    } else if (res.status !== 404) {
      throw new Error('GitHub respondió ' + res.status + '.');
    }

    // 2) fundir
    const antes = ITEMS.length;
    if (remoto && Array.isArray(remoto.items)) {
      fundir(remoto);
      _flush(K_ITEMS, () => ITEMS); saveTags();
    }
    const traidos = ITEMS.length - antes;

    // 3) subir el resultado
    const cuerpo = JSON.stringify({
      app: 'MusicVault', version: 2, updatedAt: Date.now(),
      items: ITEMS, tags: TAGS, tombstones: TOMB
    });
    if (cuerpo.length > 60e6) {
      throw new Error(`el vault ocupa ${(cuerpo.length / 1e6).toFixed(0)} MB y no cabe en GitHub. Borra lo que no uses.`);
    }
    const put = await ghFetch(api, {
      method: 'PUT',
      body: JSON.stringify({
        message: `vault: ${ITEMS.length} elementos`,
        content: b64enc(cuerpo), branch: 'main',
        sha: sha || undefined
      })
    });
    if (put.status === 409) throw new Error('Otro dispositivo estaba escribiendo. Prueba otra vez.');
    if (!put.ok) throw new Error('No he podido subirlo (' + put.status + ').');

    META.updatedAt = Date.now(); saveMeta();
    if (traidos) render();
    const hora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    _syncEstado = { at: Date.now(), err: false,
      msg: `Sincronizado a las ${hora} · ${ITEMS.length.toLocaleString('es-ES')} elementos` +
           (traidos > 0 ? ` · ${traidos.toLocaleString('es-ES')} traídos del otro dispositivo` : '') };
    if (manual) toast(traidos > 0 ? `${traidos} traídos del otro dispositivo` : 'Sincronizado');
    return _syncEstado.msg;
  } catch (e) {
    _syncEstado = { at: Date.now(), err: true, msg: 'Error: ' + (e && e.message ? e.message : 'de red') };
    if (manual) toast(_syncEstado.msg);
    return _syncEstado.msg;
  } finally {
    _syncCorriendo = false;
  }
}

/* Cualquier cambio en el vault programa una subida, agrupando ráfagas. */
function programarSync() {
  if (!ghCfg()) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => sincronizar(false), 4000);
}

/* El botón "Detener" vivía como dataset del propio <button>, pero si se cierra
   Ajustes mientras el bucle corre, el nodo se destruye y al reabrir aparece uno
   nuevo con el dataset a cero: pulsar "Completar" otra vez lanzaba un SEGUNDO
   bucle en paralelo sobre las mismas peticiones. El estado de "está corriendo"
   tiene que vivir fuera del DOM. */
let _completandoPortadas = false;

async function completarPortadas() {
  const btn = document.getElementById('fillCovers');
  const est = document.getElementById('coverStat');
  if (_completandoPortadas) { _parar = true; return; }
  _completandoPortadas = true;
  _parar = false;
  if (btn) btn.textContent = 'Detener';

  const faltan = ITEMS.filter(i => !i.coverUrl && i.spotifyId && !i.manual && i.type !== 'playlist');
  let hechos = 0, fallos = 0;

  try {
    for (const tipo of ['album', 'artist', 'track']) {
      const grupo = faltan.filter(i => i.type === tipo);
      if (!grupo.length || _parar) continue;
      const datos = await fetchItemsIndividually(
        tipo, grupo.map(x => x.spotifyId),
        () => {
          const estAhora = document.getElementById('coverStat');
          // la hoja de Ajustes puede haberse cerrado o reabierto: comprobar
          // que el nodo sigue siendo el que hay en pantalla antes de tocarlo
          if (estAhora) estAhora.textContent = `● ${hechos.toLocaleString('es-ES')} de ${faltan.length.toLocaleString('es-ES')} completadas`;
        },
        () => _parar
      );
      datos.forEach((raw, n) => {
        const it = grupo[n];
        if (!raw || !it) { fallos++; return; }
        const fresco = normalize(raw, tipo);
        Object.keys(fresco).forEach(k => {
          if (fresco[k] != null && fresco[k] !== '' &&
              (it[k] == null || it[k] === '' ||
               (Array.isArray(it[k]) && !it[k].length))) it[k] = fresco[k];
        });
        hechos++;
      });
      saveItems();
    }
  } catch (e) {
    const msg = (e && e.message) || '';
    toast(msg === 'NO_CREDS' || msg === 'AUTH_FAILED'
      ? 'Tu conexión con Spotify no es válida o ha caducado. Vuelve a conectarte en Ajustes.'
      : 'Spotify ha fallado: ' + (msg || 'error de red'));
  }

  saveItems(); render();
  _completandoPortadas = false;
  toast(_parar ? `Detenido — ${hechos} completadas`
               : `${hechos} completadas${fallos ? ` · ${fallos} sin datos` : ''}`);
  if (document.getElementById('fillCovers')) openSettings();
}

    const name = document.getElementById('newTag').value.trim();
    if (!name) return;
    if (TAGS.some(t => t.name.toLowerCase() === name.toLowerCase())) { toast('Ya tienes una etiqueta con ese nombre'); return; }
    TAGS.push({ id: uid(), name, colorHex: swatch });
    saveTags(); render(); openSettings();
  });
  document.getElementById('tagList').addEventListener('click', e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const id = b.dataset.del;
    TAGS = TAGS.filter(t => t.id !== id);
    ITEMS.forEach(it => { it.tagIds = (it.tagIds || []).filter(x => x !== id); });
    if (PREFS.tag === id) PREFS.tag = 'all';
    saveTags(); saveItems(); savePrefs(); render(); openSettings();
  });
  document.getElementById('expBtn').addEventListener('click', exportBackup);
  document.getElementById('impBtn').addEventListener('click', () => document.getElementById('impFile').click());
  document.getElementById('impFile').addEventListener('change', importBackup);
}

function tagListHtml() {
  if (!TAGS.length) return `<p class="lede" style="margin:0;">Aún no hay etiquetas. Crea una abajo para organizar tu vault.</p>`;
  return TAGS.map(t => {
    const n = ITEMS.filter(i => (i.tagIds || []).includes(t.id)).length;
    return `<div class="tagline">
      <span class="lf"><span class="dot" style="background:${esc(t.colorHex)}"></span>${esc(t.name)}<span class="ct">${n}</span></span>
      <button class="xbtn" data-del="${esc(t.id)}" aria-label="Eliminar etiqueta">✕</button>
    </div>`;
  }).join('');
}

function exportBackup() {
  const blob = new Blob([JSON.stringify({ app: 'MusicVault', version: 1, exportedAt: new Date().toISOString(), items: ITEMS, tags: TAGS }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `musicvault-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Copia descargada');
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!Array.isArray(d.items)) throw new Error('bad');
      const known = new Set(ITEMS.map(i => i.spotifyId));
      const fresh = d.items.filter(i => i && i.spotifyId && !known.has(i.spotifyId));
      // si alguno estaba borrado (con tumba) desde después de esta copia, que la
      // restauración gane: si no, la próxima sincronización lo borraría otra vez
      // sin avisar, justo después de decirte que se había restaurado
      fresh.forEach(i => { i.touchedAt = Date.now(); });
      untombstone(fresh);
      const tagNames = new Set(TAGS.map(t => t.name.toLowerCase()));
      (d.tags || []).forEach(t => { if (t && t.name && !tagNames.has(t.name.toLowerCase())) TAGS.push(t); });
      ITEMS = ITEMS.concat(fresh);
      saveItems(); saveTags(); render(); closeModal();
      toast(`${fresh.length} elemento${fresh.length === 1 ? '' : 's'} restaurado${fresh.length === 1 ? '' : 's'}`);
    } catch {
      toast('Ese archivo no es una copia válida de MusicVault');
    }
  };
  fr.readAsText(file);
  e.target.value = '';
}

/* ---- estadísticas ---- */
function relDate(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return 'hoy';
  if (days === 1) return 'ayer';
  if (days < 30) return `hace ${days} días`;
  const months = Math.floor(days / 30);
  if (months < 12) return `hace ${months} ${months === 1 ? 'mes' : 'meses'}`;
  const years = Math.floor(days / 365);
  return `hace ${years} ${years === 1 ? 'año' : 'años'}`;
}

function bars(rows, color) {
  if (!rows.length) return '<p class="lede" style="margin:0;">Sin datos todavía.</p>';
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="barlist">${rows.map(([label, n]) => `
    <div class="barrow">
      <span class="blabel">${esc(label)}</span>
      <span class="btrack"><span class="bfill" style="width:${Math.max(4, n / max * 100)}%;background:${color}"></span></span>
      <span class="bnum">${n}</span>
    </div>`).join('')}</div>`;
}

function openStats() {
  if (!ITEMS.length) { toast('Tu vault está vacío'); return; }
  // los artistas y lo archivado no cuentan como pendiente ni escuchado
  const contables = ITEMS.filter(i => i.type !== 'artist' && !i.archived);
  const done = contables.filter(i => i.listened);
  const pending = contables.filter(i => !i.listened);

  const byArtist = {};
  ITEMS.forEach(i => (i.artists || []).forEach(a => { byArtist[a] = (byArtist[a] || 0) + 1; }));
  const topArtists = Object.entries(byArtist).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 8);

  const byGenre = {};
  ITEMS.forEach(i => (i.genres || []).forEach(g => { byGenre[g] = (byGenre[g] || 0) + 1; }));
  const topGenres = Object.entries(byGenre).sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).slice(0, 8);

  const byDecade = {};
  ITEMS.forEach(i => { const y = yearOf(i); if (y) { const d = Math.floor(y / 10) * 10 + 's'; byDecade[d] = (byDecade[d] || 0) + 1; } });
  const decades = Object.entries(byDecade).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));

  const byType = ['album', 'track', 'artist', 'playlist'].map(t => [TYPE_PLURAL[t], ITEMS.filter(i => i.type === t).length]).filter(r => r[1]);
  const rated = ITEMS.filter(i => i.rating > 0);
  const avg = rated.length ? (rated.reduce((s, i) => s + i.rating, 0) / rated.length).toFixed(1) : null;
  const oldest = pending.slice().sort((a, b) => a.dateAdded - b.dateAdded)[0];
  const pct = contables.length ? Math.round(done.length / contables.length * 100) : 0;

  showSheet(`
    <div class="sheethead"><h2>Tu vault en números</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>

    <div class="bigstat">
      <div class="bignum">${pct}<span class="pctsign">%</span></div>
      <div>
        <div style="font-weight:650;">escuchado</div>
        <div class="lede" style="margin:0;">${done.length} de ${contables.length} · te quedan ${pending.length} por escuchar</div>
      </div>
    </div>
    <div class="progtrack"><span class="progfill" style="width:${pct}%"></span></div>

    ${oldest ? `<div class="flabel">Lo que más tiempo lleva esperando</div>
    <button class="oldcard" data-goto="${oldest.id}">
      <span class="oldart">${portada(oldest.coverUrl, TYPE_ICON[oldest.type], false)}</span>
      <span class="oldinfo">
        <span class="oldt">${esc(oldest.title)}</span>
        <span class="olda">${esc(artistsOf(oldest))} · guardado ${relDate(oldest.dateAdded)}</span>
      </span>
    </button>` : ''}

    <div class="flabel">Qué guardas</div>
    ${bars(byType, 'var(--amber)')}

    <div class="flabel">Artistas con más cosas guardadas</div>
    ${bars(topArtists, 'var(--jade)')}

    ${topGenres.length ? `<div class="flabel">Géneros más frecuentes</div>
    ${bars(topGenres, 'var(--jade)')}` : ''}

    <div class="flabel">Por década de lanzamiento</div>
    ${bars(decades, 'var(--amber)')}

    <div class="flabel">Valoraciones</div>
    <p class="lede" style="margin:0;">${rated.length ? `Has valorado ${rated.length} de ${ITEMS.length}. Media: <strong>${avg}</strong> ★` : 'Todavía no has valorado nada. Abre cualquier ficha y toca las estrellas.'}</p>

    ${ITEMS.some(i => i.archived) ? `<div class="flabel">Archivado</div>
    <p class="lede" style="margin:0;">${ITEMS.filter(i => i.archived).length} guardado${ITEMS.filter(i => i.archived).length === 1 ? '' : 's'} aparte, fuera de las listas normales.</p>` : ''}
  `);

  document.querySelector('[data-goto]')?.addEventListener('click', e => openDetail(e.currentTarget.dataset.goto));
}

/* ---- shuffle ---- */
function shuffle() {
  const pool = ITEMS.filter(i => !i.listened && !i.archived);
  if (!pool.length) {
    toast(ITEMS.length ? '¡No te queda nada pendiente!' : 'Tu vault está vacío');
    return;
  }
  openDetail(pool[Math.floor(Math.random() * pool.length)].id);
}

/* ============ events ============ */
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('statsBtn').addEventListener('click', openStats);
document.getElementById('bulkBtn').addEventListener('click', openBulk);
document.getElementById('setBtn').addEventListener('click', openSettings);
document.getElementById('addFab').addEventListener('click', openSearch);

document.getElementById('q').addEventListener('input', render);
document.getElementById('sortSel').addEventListener('change', e => { PREFS.sort = e.target.value; savePrefs(); render(); });
document.getElementById('viewBtn').addEventListener('click', () => { PREFS.view = PREFS.view === 'grid' ? 'list' : 'grid'; savePrefs(); render(); });

document.querySelector('.state-strip').addEventListener('click', e => {
  const b = e.target.closest('.stat'); if (!b) return;
  PREFS.status = PREFS.status === b.dataset.status ? 'all' : b.dataset.status;
  savePrefs(); render();
});

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.type) PREFS.type = b.dataset.type;
  if (b.dataset.tag) PREFS.tag = PREFS.tag === b.dataset.tag ? 'all' : b.dataset.tag;
  if (b.dataset.genre) PREFS.genre = PREFS.genre === b.dataset.genre ? 'all' : b.dataset.genre;
  if (b.dataset.decade) PREFS.decade = PREFS.decade === b.dataset.decade ? 'all' : b.dataset.decade;
  savePrefs(); render();
});

/* content delegation: open detail, toggle listened, selection, empty-state buttons.
   Va en el <main> completo (no solo #results): el botón "Quitar filtros" de la
   cabecera de resultados vive en #resultline, un hermano de #results, y con el
   listener solo en #results ese clic no llegaba a ningún sitio. */
let pressTimer = null;
const contentEl = document.querySelector('main.content');

contentEl.addEventListener('click', e => {
  const clear = e.target.closest('[data-clear]');
  if (clear) { PREFS.type = 'all'; PREFS.status = 'all'; PREFS.tag = 'all'; PREFS.genre = 'all'; PREFS.decade = 'all'; document.getElementById('q').value = ''; savePrefs(); render(); return; }
  const open = e.target.closest('[data-open]');
  if (open) { open.dataset.open === 'search' ? openSearch() : openBulk(); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { e.stopPropagation(); toggleListened(tg.dataset.toggle); return; }
  const more = e.target.closest('[data-more]');
  if (more) { VISTAS += TANDA * 3; render(); return; }
  const card = e.target.closest('[data-id]');
  if (!card) return;
  if (selMode) toggleSel(card.dataset.id);
  else openDetail(card.dataset.id);
});

/* long-press enters selection mode (mobile) */
contentEl.addEventListener('pointerdown', e => {
  const card = e.target.closest('[data-id]');
  if (!card || e.target.closest('[data-toggle]')) return;
  pressTimer = setTimeout(() => {
    if (!selMode) { selMode = true; selected.add(card.dataset.id); render(); if (navigator.vibrate) navigator.vibrate(12); }
  }, 480);
});
['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(ev =>
  contentEl.addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));
window.addEventListener('scroll', () => clearTimeout(pressTimer), { passive: true });

document.getElementById('selbarRoot').addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (!b) return;
  const ids = [...selected];
  if (b.dataset.sel === 'cancel') return setSelMode(false);
  if (b.dataset.sel === 'listen') {
    // los artistas no tienen concepto de "escuchado" (ver gcard/lrow/openDetail)
    let n = 0;
    ids.forEach(id => { const it = ITEMS.find(x => x.id === id); if (it && it.type !== 'artist') { it.listened = true; n++; } });
    saveItems(); setSelMode(false); toast(`${n} marcado${n === 1 ? '' : 's'} como escuchado${n === 1 ? '' : 's'}`);
  }
  if (b.dataset.sel === 'tag') openTagPicker(ids);
  if (b.dataset.sel === 'archive') {
    const marcar = PREFS.status !== 'archived';   // en la vista de archivo, el botón desarchiva
    const afectados = [];
    ids.forEach(id => { const it = ITEMS.find(x => x.id === id); if (it) { it.archived = marcar; it.touchedAt = Date.now(); afectados.push(it); } });
    saveItems(); setSelMode(false);
    toast(`${afectados.length} ${marcar ? 'archivado' : 'restaurado'}${afectados.length === 1 ? '' : 's'}`, 'Deshacer', () => {
      afectados.forEach(it => { it.archived = !marcar; it.touchedAt = Date.now(); });
      saveItems(); render();
    });
  }
  if (b.dataset.sel === 'del') { setSelMode(false); deleteItems(ids); }
});

/* modal delegation */
modalRoot.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeModal();
  const add = e.target.closest('[data-add]');
  if (add) {
    const r = lastResults[+add.dataset.add];
    if (!r || ITEMS.some(x => x.spotifyId === r.spotifyId)) return;
    ITEMS.push(makeItem(r));
    saveItems(); render();
    add.classList.add('done'); add.textContent = '✓';
    return;
  }

  // ---- selección múltiple en resultados de búsqueda ----
  const restool = e.target.closest('[data-restool]');
  if (restool) {
    if (restool.dataset.restool === 'selmode') searchSelMode = true;
    else if (restool.dataset.restool === 'cancel') { searchSelMode = false; searchSel = new Set(); }
    else if (restool.dataset.restool === 'addall') {
      const n = addManyResults(lastResults);
      toast(n ? `${n} añadido${n === 1 ? '' : 's'} al vault` : 'Ya tenías todo esto guardado');
    }
    pintarResultados();
    return;
  }
  const chk = e.target.closest('[data-rchk]');
  if (chk) {
    const i = +chk.dataset.rchk;
    if (searchSel.has(i)) searchSel.delete(i); else searchSel.add(i);
    pintarResultados();
    return;
  }
  if (e.target.closest('[data-moreres]')) { cargarMasResultados(); return; }
  if (e.target.closest('[data-reconnect]')) { beginSpotifyLogin(); return; }
  const selbar = e.target.closest('[data-selbar]');
  if (selbar) {
    if (selbar.dataset.selbar === 'add') {
      const elegidos = [...searchSel].map(i => lastResults[i]).filter(Boolean);
      const n = addManyResults(elegidos);
      toast(`${n} añadido${n === 1 ? '' : 's'} al vault`);
    }
    searchSelMode = false; searchSel = new Set();
    pintarResultados();
    return;
  }

  const open = e.target.closest('[data-open]');
  if (open && open.dataset.open === 'settings') { closeModal(); openSettings(); }
});

/* desktop shortcuts */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'n' || e.key === 'N') openSearch();
  if (e.key === 'v' || e.key === 'V') { PREFS.view = PREFS.view === 'grid' ? 'list' : 'grid'; savePrefs(); render(); }
});

/* ============ init ============ */
handleSpotifyRedirect().then(() => bootStorage()).then(() => {
  render();
  if (ghCfg()) sincronizar(false);
});

/* Al volver a la app (cambiar de pestaña, desbloquear el móvil) se comprueba
   si el otro dispositivo ha añadido algo, pero como mucho una vez por minuto. */
let _ultimoVistazo = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !ghCfg()) return;
  if (Date.now() - _ultimoVistazo < 60000) return;
  _ultimoVistazo = Date.now();
  sincronizar(false);
});
</script>
