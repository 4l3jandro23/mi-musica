document.getElementById('q').addEventListener('input', render);
document.getElementById('sortSel').addEventListener('change', e => { PREFS.sort = e.target.value; savePrefs(); render(); });
document.getElementById('viewBtn').addEventListener('click', () => { PREFS.view = PREFS.view === 'grid' ? 'list' : 'grid'; savePrefs(); render(); });

document.querySelector('.state-strip').addEventListener('click', e => {
  const b = e.target.closest('.stat'); if (!b) return;
  PREFS.status = PREFS.status === b.dataset.status ? 'all' : b.dataset.status;
  savePrefs(); render();
});

document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.genall) { openGenrePicker(); return; }
  if (b.dataset.vista !== undefined) { aplicarVista(+b.dataset.vista); return; }
  if (b.dataset.dur) PREFS.dur = PREFS.dur === b.dataset.dur ? 'all' : b.dataset.dur;
  if (b.dataset.type) PREFS.type = b.dataset.type;
  if (b.dataset.tag) PREFS.tag = PREFS.tag === b.dataset.tag ? 'all' : b.dataset.tag;
  if (b.dataset.genre) PREFS.genre = PREFS.genre === b.dataset.genre ? 'all' : b.dataset.genre;
  if (b.dataset.decade) PREFS.decade = PREFS.decade === b.dataset.decade ? 'all' : b.dataset.decade;
  savePrefs(); render();
});

/* Vistas guardadas: una combinación de filtros con nombre, para no tener que
   volver a montarla a mano. Guarda solo los filtros y el orden — no una lista
   de elementos — así una vista sigue siendo válida según crece el vault. */
const CAMPOS_VISTA = ['type', 'status', 'tag', 'genre', 'decade', 'dur', 'sort'];
function guardarVistaActual() {
  const nombre = (prompt('Nombre para esta vista (p. ej. "Pendientes de los 90"):') || '').trim();
  if (!nombre) return;
  const vista = { nombre };
  CAMPOS_VISTA.forEach(c => vista[c] = PREFS[c]);
  vista.q = document.getElementById('q').value.trim();
  PREFS.vistas = (PREFS.vistas || []).concat([vista]).slice(-12);   // tope: la fila de chips no es infinita
  savePrefs(); render();
  toast('Vista guardada: ' + nombre);
}
function aplicarVista(i) {
  const v = (PREFS.vistas || [])[i];
  if (!v) return;
  CAMPOS_VISTA.forEach(c => { if (v[c] !== undefined) PREFS[c] = v[c]; });
  document.getElementById('q').value = v.q || '';
  savePrefs(); render();
}
/* Ordenar a mano dentro de una etiqueta. Con botones ↑/↓ y no arrastrando:
   estas filas ya tienen pulsación larga (seleccionar) y deslizamiento
   (marcar/archivar), y un tercer gesto encima los volvería imprevisibles. */
function openOrdenarEtiqueta() {
  const t = PREFS.tag !== 'all' ? tagById(PREFS.tag) : null;
  if (!t) { toast('Elige antes una etiqueta en los filtros'); return; }
  const conEtiqueta = ITEMS.filter(i => (i.tagIds || []).includes(t.id) && !i.archived);
  if (!conEtiqueta.length) { toast('Esa etiqueta no tiene nada todavía'); return; }
  // el orden guardado manda; lo que no esté en él se añade al final
  const orden = (t.orden || []).filter(id => conEtiqueta.some(i => i.id === id));
  conEtiqueta.forEach(i => { if (!orden.includes(i.id)) orden.push(i.id); });
  t.orden = orden;

  const pintar = () => {
    showSheet(`
      <div class="sheethead"><h2>Ordenar «${esc(t.name)}»</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
      <p class="lede">Coloca los elementos a tu gusto. Para verlo así en la lista, elige el orden «Orden manual» con esta etiqueta puesta.</p>
      <div class="tracklist" id="ordList">
        ${t.orden.map((id, idx) => {
          const it = ITEMS.find(x => x.id === id);
          if (!it) return '';
          return `<div class="trow">
            <span class="trn">${idx + 1}</span>
            <span class="trlink"><span class="trt">${esc(it.title)}</span></span>
            <button class="xbtn" data-mv="up" data-i="${idx}" ${idx === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
            <button class="xbtn" data-mv="down" data-i="${idx}" ${idx === t.orden.length - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
          </div>`;
        }).join('')}
      </div>
    `);
    document.getElementById('ordList').addEventListener('click', e => {
      const b = e.target.closest('[data-mv]'); if (!b) return;
      const i = +b.dataset.i, j = b.dataset.mv === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= t.orden.length) return;
      [t.orden[i], t.orden[j]] = [t.orden[j], t.orden[i]];
      saveTags(); render(); pintar();
    });
  };
  pintar();
}

function openVistasGuardadas() {
  const vistas = PREFS.vistas || [];
  showSheet(`
    <div class="sheethead"><h2>Vistas guardadas</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <p class="lede">Combinaciones de filtros con nombre. Guarda la que tengas puesta ahora mismo, o borra las que ya no uses.</p>
    <div class="btnrow"><button class="btn primary wide" id="guardarVista">Guardar los filtros actuales</button></div>
    ${vistas.length ? `<div id="listaVistas">${vistas.map((v, i) => `
      <div class="tagline">
        <span class="lf">🔖 ${esc(v.nombre)}</span>
        <button class="xbtn" data-delvista="${i}" aria-label="Eliminar vista">✕</button>
      </div>`).join('')}</div>` : `<p class="lede" style="margin-top:10px;">Todavía no tienes ninguna.</p>`}
  `);
  document.getElementById('guardarVista').addEventListener('click', () => { closeModal(); guardarVistaActual(); });
  document.getElementById('listaVistas')?.addEventListener('click', e => {
    const b = e.target.closest('[data-delvista]'); if (!b) return;
    PREFS.vistas.splice(+b.dataset.delvista, 1);
    savePrefs(); render(); openVistasGuardadas();
  });
}

function openGenrePicker() {
  const { freq, label } = generosConFrecuencia();
  const todos = Object.entries(freq).sort((a, b) => label[a[0]].localeCompare(label[b[0]], 'es'));
  showSheet(`
    <div class="sheethead"><h2>Todos los géneros</h2><button class="iconbtn" data-close="1" aria-label="Cerrar">✕</button></div>
    <input class="field" id="genreSearch" placeholder="Buscar género…" style="margin-bottom:12px;">
    <div class="tagpick" id="genreList">
      ${todos.map(([k, n]) => `<button class="chip genre ${PREFS.genre === k ? 'on' : ''}" data-genre="${esc(k)}">${esc(label[k])} <span class="ct">${n}</span></button>`).join('')}
    </div>
  `);
  document.getElementById('genreSearch').addEventListener('input', e => {
    const q = fold(e.target.value.trim());
    document.querySelectorAll('#genreList .chip').forEach(b => {
      b.style.display = fold(b.textContent).includes(q) ? '' : 'none';
    });
  });
  document.getElementById('genreList').addEventListener('click', e => {
    const b = e.target.closest('[data-genre]'); if (!b) return;
    PREFS.genre = PREFS.genre === b.dataset.genre ? 'all' : b.dataset.genre;
    savePrefs(); closeModal(); render();
  });
}

/* content delegation: open detail, toggle listened, selection, empty-state buttons.
   Va en el <main> completo (no solo #results): el botón "Quitar filtros" de la
   cabecera de resultados vive en #resultline, un hermano de #results, y con el
   listener solo en #results ese clic no llegaba a ningún sitio. */
let pressTimer = null;
const contentEl = document.querySelector('main.content');

contentEl.addEventListener('click', e => {
  if (Date.now() < _swipeHasta) { e.stopPropagation(); return; }   // clic fantasma tras deslizar
  const clear = e.target.closest('[data-clear]');
  if (clear) { PREFS.type = 'all'; PREFS.status = 'all'; PREFS.tag = 'all'; PREFS.genre = 'all'; PREFS.decade = 'all'; PREFS.dur = 'all'; document.getElementById('q').value = ''; savePrefs(); render(); return; }
  if (e.target.closest('[data-vistas]')) { openVistasGuardadas(); return; }
  if (e.target.closest('[data-ordenar]')) { openOrdenarEtiqueta(); return; }
  const selall = e.target.closest('[data-selall]');
  if (selall) { selMode = true; selected = new Set(filtered().map(it => it.id)); render(); return; }
  const open = e.target.closest('[data-open]');
  if (open) { open.dataset.open === 'search' ? openSearch() : openBulk(); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { e.stopPropagation(); toggleListened(tg.dataset.toggle); return; }
  const more = e.target.closest('[data-more]');
  if (more) { VISTAS += tanda() * 3; render(); return; }
  const card = e.target.closest('[data-id]');
  if (!card) return;
  if (selMode) toggleSel(card.dataset.id);
  else openDetail(card.dataset.id);
});

/* long-press enters selection mode (mobile) */
/* Deslizar una fila: derecha = escuchado, izquierda = archivar. Convive con
   la pulsación larga (que entra en modo selección) porque en cuanto el dedo
   se mueve de verdad se cancela ese temporizador — si no, arrastrar acabaría
   seleccionando sin querer. Solo en vista lista y fuera del modo selección,
   donde el gesto no compite con nada. */
let _sw = null, _swipeHasta = 0;
const SWIPE_MIN = 60;      // px que hay que recorrer para que cuente
const SWIPE_MAX_Y = 30;    // si te desvías más en vertical, es un scroll, no un deslizamiento

contentEl.addEventListener('pointerdown', e => {
  const card = e.target.closest('[data-id]');
  if (!card || e.target.closest('[data-toggle]')) return;
  if (PREFS.view === 'list' && !selMode && e.pointerType !== 'mouse') {
    _sw = { id: card.dataset.id, el: card, x: e.clientX, y: e.clientY };
  }
  pressTimer = setTimeout(() => {
    if (!selMode) { selMode = true; selected.add(card.dataset.id); render(); if (navigator.vibrate) navigator.vibrate(12); }
  }, 480);
});

contentEl.addEventListener('pointermove', e => {
  if (!_sw) return;
  const dx = e.clientX - _sw.x, dy = e.clientY - _sw.y;
  if (Math.abs(dy) > SWIPE_MAX_Y) { cancelarSwipe(); return; }     // se está desplazando, no deslizando
  if (Math.abs(dx) > 8) {
    clearTimeout(pressTimer);                                       // ya no es una pulsación larga
    // tope visual: pasado el umbral ya no hace falta seguir arrastrando el
    // dedo entero de la pantalla para que se note qué va a pasar
    const topado = Math.max(-100, Math.min(100, dx));
    _sw.el.style.transform = `translateX(${topado}px)`;
    _sw.el.style.transition = 'none';
    _sw.el.style.background = Math.abs(dx) < SWIPE_MIN ? ''
      : dx > 0 ? 'color-mix(in srgb, var(--jade) 18%, var(--surface))'
               : 'color-mix(in srgb, var(--rust) 18%, var(--surface))';
    _sw.movido = true;
  }
}, { passive: true });

function cancelarSwipe() {
  if (_sw?.el) {
    const el = _sw.el;
    el.style.transition = 'transform .18s, background .18s';   // vuelve a su sitio con suavidad, no de golpe
    el.style.transform = '';
    el.style.background = '';
    setTimeout(() => { el.style.transition = ''; }, 200);
  }
  _sw = null;
}

contentEl.addEventListener('pointerup', e => {
  if (!_sw) return;
  const dx = e.clientX - _sw.x;
  const el = _sw.el, id = _sw.id, movido = _sw.movido;
  cancelarSwipe();
  if (!movido) return;
  // aunque no llegue al mínimo, si hubo arrastre hay que tragarse el clic
  // que el navegador dispara justo después: si no, se abriría la ficha sola
  _swipeHasta = Date.now() + 400;
  if (Math.abs(dx) < SWIPE_MIN) return;
  const it = ITEMS.find(x => x.id === id);
  if (!it) return;
  if (dx > 0) {
    if (it.type === 'artist') { toast('Un artista no se marca como escuchado'); return; }
    toggleListened(id);
  } else {
    it.archived = !it.archived; it.touchedAt = Date.now();
    const quedaArchivado = it.archived;
    saveItems(); render();
    toast(quedaArchivado ? 'Archivado' : 'Fuera del archivo', 'Deshacer', () => {
      it.archived = !quedaArchivado; it.touchedAt = Date.now(); saveItems(); render();
    });
  }
});

['pointercancel', 'pointerleave'].forEach(ev =>
  contentEl.addEventListener(ev, cancelarSwipe, { passive: true }));
['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(ev =>
  contentEl.addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));
window.addEventListener('scroll', () => clearTimeout(pressTimer), { passive: true });

document.getElementById('selbarRoot').addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (!b) return;
  const ids = [...selected];
  if (b.dataset.sel === 'cancel') return setSelMode(false);
  if (b.dataset.sel === 'listen') {
    // los artistas no tienen concepto de "escuchado" (ver gcard/lrow/openDetail).
    // Con selecciones grandes (p. ej. "Seleccionar todo lo filtrado"), recorrer
    // ITEMS una vez y consultar el Set es mucho más rápido que un .find() por id.
    let n = 0;
    ITEMS.forEach(it => {
      if (!selected.has(it.id) || it.type === 'artist') return;
      it.listened = true; it.listenedAt = Date.now();
      if (it.type === 'album' && it.trackTitles?.length) it.cancionesEscuchadas = it.trackTitles.slice();
      n++;
    });
    saveItems(); setSelMode(false); toast(`${n} marcado${n === 1 ? '' : 's'} como escuchado${n === 1 ? '' : 's'}`);
  }
  if (b.dataset.sel === 'prioridad') {
    // los artistas no se marcan prioritarios (igual que en su propia ficha)
    // si ya estaba todo fijado, lo quita; si había alguno sin fijar, fija todo —
    // el mismo criterio "todo o nada" que usan los checkboxes de tres estados
    const seleccionados = ITEMS.filter(it => selected.has(it.id) && it.type !== 'artist');
    if (!seleccionados.length) { toast('Los artistas no se marcan como prioritarios'); return; }
    const marcar = !seleccionados.every(it => it.prioridad);
    seleccionados.forEach(it => { it.prioridad = marcar; it.touchedAt = Date.now(); });
    saveItems(); setSelMode(false);
    toast(`${seleccionados.length} ${marcar ? 'marcado' : 'desmarcado'}${seleccionados.length === 1 ? '' : 's'} como prioritario${seleccionados.length === 1 ? '' : 's'}`);
  }
  if (b.dataset.sel === 'tag') openTagPicker(ids);
  if (b.dataset.sel === 'archive') {
    const marcar = PREFS.status !== 'archived';   // en la vista de archivo, el botón desarchiva
    const afectados = [];
    ITEMS.forEach(it => { if (selected.has(it.id)) { it.archived = marcar; it.touchedAt = Date.now(); afectados.push(it); } });
    saveItems(); setSelMode(false);
    toast(`${afectados.length} ${marcar ? 'archivado' : 'restaurado'}${afectados.length === 1 ? '' : 's'}`, 'Deshacer', () => {
      afectados.forEach(it => { it.archived = !marcar; it.touchedAt = Date.now(); });
      saveItems(); render();
    });
  }
  if (b.dataset.sel === 'copiar') copiarEnlaces(ITEMS.filter(it => selected.has(it.id)), 'Enlace copiado');
  if (b.dataset.sel === 'del') {
    if (!confirmarBorradoSiHaceFalta(ids.length)) return;
    setSelMode(false); deleteItems(ids);
  }
});

/* modal delegation */
modalRoot.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeModal();
  const add = e.target.closest('[data-add]');
  if (add) {
    const r = lastResults[+add.dataset.add];
    if (!r || ITEMS.some(x => x.spotifyId === r.spotifyId)) return;
    ITEMS.push(makeItem(r));
    saveItems(); render();
    add.classList.add('done'); add.textContent = '✓';
    return;
  }

  // ---- selección múltiple en resultados de búsqueda ----
  const restool = e.target.closest('[data-restool]');
  if (restool) {
    if (restool.dataset.restool === 'selmode') searchSelMode = true;
    else if (restool.dataset.restool === 'cancel') { searchSelMode = false; searchSel = new Set(); }
    else if (restool.dataset.restool === 'addall') {
      const n = addManyResults(lastResults);
      toast(n ? `${n} añadido${n === 1 ? '' : 's'} al vault` : 'Ya tenías todo esto guardado');
    }
    pintarResultados();
    return;
  }
  const chk = e.target.closest('[data-rchk]');
  if (chk) {
    const i = +chk.dataset.rchk;
    if (searchSel.has(i)) searchSel.delete(i); else searchSel.add(i);
    pintarResultados();
    return;
  }
  if (e.target.closest('[data-moreres]')) { cargarMasResultados(); return; }
  if (e.target.closest('[data-reconnect]')) { beginSpotifyLogin(); return; }
  const selbar = e.target.closest('[data-selbar]');
  if (selbar) {
    if (selbar.dataset.selbar === 'add') {
      const elegidos = [...searchSel].map(i => lastResults[i]).filter(Boolean);
      const n = addManyResults(elegidos);
      toast(`${n} añadido${n === 1 ? '' : 's'} al vault`);
    }
    searchSelMode = false; searchSel = new Set();
    pintarResultados();
    return;
  }

  const open = e.target.closest('[data-open]');
  if (open && open.dataset.open === 'settings') { closeModal(); openSettings(); }
});

/* desktop shortcuts */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'n' || e.key === 'N') openSearch();
  if (e.key === 'v' || e.key === 'V') { PREFS.view = PREFS.view === 'grid' ? 'list' : 'grid'; savePrefs(); render(); }
});

/* ============ init ============ */
/* Añadir desde el Share Sheet de iOS. iOS no deja que una web instalada se
   registre como destino de "Compartir" (eso solo existe en Android/ChromeOS),
   así que la vía real es un Atajo de Apple que abra esta página con
   ?add=<enlace> — ver Ajustes → "Añadir desde Compartir" para las instrucciones.
   Un enlace directo a álbum/canción/artista no tiene ambigüedad: se añade
   solo, sin más toques. Una playlist o un texto sin enlace sí necesita elegir,
   así que eso abre el buscador ya con la búsqueda lanzada. */
async function manejarParametroAdd() {
  const qs = new URLSearchParams(location.search);
  const add = qs.get('add');
  if (!add) return;
  history.replaceState({}, '', location.pathname);   // no reprocesar si se recarga
  const texto = add.trim();
  if (!texto) return;
  const m = texto.match(URL_ONE);
  if (m) {
    try {
      const item = normalize(await spotifyLookup(m[1], m[2]), m[1]);
      if (ITEMS.some(x => x.spotifyId === item.spotifyId)) { toast('Ya lo tenías: ' + item.title); return; }
      ITEMS.push(makeItem(item));
      saveItems(); render();
      toast('Añadido desde Compartir: ' + item.title);
      return;
    } catch {
      // sin conexión, token caducado, etc. — se cae al buscador normal, que ya
      // explica el problema con su propio mensaje
    }
  }
  openSearch();
  document.getElementById('sq').value = texto;
  runSearch();
}

aplicarTamanoCaratula();
handleSpotifyRedirect().then(() => bootStorage()).then(() => {
  render();
  purgarPapelera();
  const gArranque = ghCfg();
  if (gArranque && gArranque.auto !== false) sincronizar(false);
  if (isConnected() && tieneScopeRecientes()) sincronizarEscuchasSpotify(true);
  manejarParametroAdd();
});

/* Al volver a la app (cambiar de pestaña, desbloquear el móvil) se comprueba
   si el otro dispositivo ha añadido algo, pero como mucho una vez por minuto.
   Nada de esto corre si la sincronización automática está desactivada — en
   ese caso solo sincroniza cuando tocas el botón ⟳ a propósito. */
let _ultimoVistazo = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const g = ghCfg();
  if (!g || g.auto === false) return;
  if (Date.now() - _ultimoVistazo < 60000) return;
  _ultimoVistazo = Date.now();
  sincronizar(false);
});
</script>
