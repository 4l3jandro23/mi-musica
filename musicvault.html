<style>
  :root {
    color-scheme: light;
    /* Alto que tapa el teclado en iOS ahora mismo (lo actualiza JS con visualViewport).
       position:fixed se ancla al viewport de LAYOUT, que no encoge con el teclado;
       esta variable es lo que permite compensarlo a mano. */
    --kb: 0px;
    /* "none" en todos los temas normales; la paleta Cristal es la única que
       la redefine con un desenfoque real — así los componentes de abajo
       pueden pedir backdrop-filter:var(--glass-blur) sin que afecte a nadie más */
    --glass-blur: none;
    /* neutrales con sesgo cálido, no gris puro */
    --bg:        #f7f2e9;
    --surface:   #fffdf8;
    --surface-2: #efe8db;
    --line:      rgba(26,20,14,0.11);
    --line-firm: rgba(26,20,14,0.20);
    --fg:        #1a140e;
    --fg-soft:   #5d5346;
    --fg-mute:   #726858;
    --amber:     #a3690f;
    --amber-soft:#f0e0c2;
    --on-amber:  #fffdf8;
    --jade:      #14795c;
    --jade-soft: #d5e9e0;
    --rust:      #b03f30;
    --shadow-sm: 0 1px 2px rgba(26,20,14,0.06), 0 4px 12px rgba(26,20,14,0.06);
    --shadow-md: 0 2px 6px rgba(26,20,14,0.10), 0 12px 28px rgba(26,20,14,0.12);
    --shadow-lg: 0 -4px 40px rgba(26,20,14,0.18);
    /* Curvas con más carácter que las de CSS por defecto — las de serie son
       demasiado suaves y las animaciones se notan blandas, sin intención. */
    --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:        #14100d;
      --surface:   #1e1915;
      --surface-2: #2a231d;
      --line:      rgba(247,242,233,0.10);

      --fg-soft:   #b8ab99;

  }

  /* ---------- Cristal (vidrio esmerilado, tipo "Liquid Glass") ----------
     Es la única paleta que no solo cambia color: --surface/--surface-2 pasan
     a ser translúcidos y --glass-blur deja de ser "none", así que cualquier
     componente que ya pida backdrop-filter:var(--glass-blur) (ver más abajo)
     se vuelve cristal esmerilado automáticamente, sin tocarlo aparte. El
     fondo también cambia a un degradado — sin algo de color detrás, el
     desenfoque no se nota, se ve solo "medio transparente" y ya. */

    --glass-blur: blur(20px) saturate(1.8);
    --bg:#eef2f7;--surface:rgba(255,255,255,0.55);--surface-2:rgba(255,255,255,0.35);

    --fg:#12181f;--fg-soft:#46505c;--fg-mute:#6b7480;
    --amber:#0a84ff;--amber-soft:rgba(10,132,255,0.16);--on-amber:#ffffff;

    --shadow-lg: 0 -4px 40px rgba(20,30,50,0.16);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
    /* en iPhone, tirar hacia abajo en lo alto de una lista larga a veces
       arrastraba la página entera (el rebote nativo de Safari) en vez de
       quedarse dentro de la lista; esto evita que se escape ese gesto */
    overscroll-behavior-y: contain;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- command bar ---------- */
  .cmdbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .wordmark { display:flex; align-items:center; gap:9px; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .wordmark .disc { width:19px; height:19px; flex-shrink:0; }
  /* El logo lleva al inicio, como en cualquier sitio. En el movil el nombre se
     esconde y queda solo el disco, asi que el boton se agranda por dentro para
     que siga siendo comodo de tocar. */
  .wmbtn {
    display:flex; align-items:center; gap:9px; cursor:pointer;
    background:none; border:none; padding: 12px 6px; margin: -12px -6px;
    font: inherit; color: inherit; letter-spacing: inherit;
    transition: opacity .15s;
  }
  .wmbtn:active { opacity: .55; }
  /* en pantallas estrechas el disco basta como identidad; el espacio va a los controles */
  @media (max-width: 419px) { .wordmark .wm-text { display: none; } }
  .cmd-actions { display:flex; gap: 7px; }
  .iconbtn {
    display:flex; align-items:center; justify-content:center;
    width: 38px; height: 38px; border-radius: 11px; flex-shrink:0;
    background: var(--surface); border: 1px solid var(--line); color: var(--fg);
    font-size: 16px; cursor: pointer; transition: background .15s, transform .1s;
    position: relative;
  }
  /* 38px se ve bien pero se falla al pulsar; esto lleva la zona táctil a 44 */
  .iconbtn::after { content:""; position:absolute; inset:-3px; border-radius:14px; }
  .iconbtn:hover { background: var(--surface-2); }
  .iconbtn:active { transform: scale(0.94); }
  .iconbtn.accent { background: var(--amber); border-color: transparent; color: var(--on-amber); }
  /* el enlace de vuelta al índice: mismo botón, sin subrayado ni color de enlace */
  .backbtn { text-decoration: none; font-size: 18px; line-height: 1; }
  .backbtn:visited { color: var(--fg); }

  .shell { max-width: 1080px; margin: 0 auto; padding: 0 14px; }

  /* ---------- vault state strip ---------- */
  .state-strip { display:grid; grid-template-columns: repeat(4, 1fr); gap: 9px; padding: 16px 0 4px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 10px; cursor: pointer; text-align:left; font-family: inherit; color: inherit;
    transition: border-color .15s, background .15s;
  }
  .stat:hover { background: var(--surface-2); }
  .stat.active { border-color: var(--amber); background: var(--amber-soft); }
  .stat .n { font-family: Georgia, serif; font-size: 23px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat.pending .n { color: var(--amber); }
  .stat.done .n { color: var(--jade); }
  .stat.archived .n { color: var(--fg-mute); }
  .stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-mute); margin-top: 5px; font-family: ui-monospace, monospace; line-height: 1.25; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: calc(58px + env(safe-area-inset-top)); z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 10px 0 9px; margin-top: 12px;
    border-bottom: 1px solid var(--line);
  }
  /* En Cristal, esta barra se quedaba con un desenfoque fijo de 12px y un
     fondo plano al 92% de --bg (que ahí es un gris liso) mientras el resto
     de tarjetas/chips usan --surface translúcido + el desenfoque de 20px con
     más saturación de la paleta — de ahí que se viera como un panel gris
     aparte en vez de cristal a juego con todo lo demás. */
  :root[data-palette="cristal"] .toolbar {
    background: var(--surface);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  }
  .toolbar-row { display:flex; gap: 8px; align-items:center; }
  .searchwrap { position: relative; flex: 1 1 auto; min-width: 0; }
  .searchwrap .mag { position:absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--fg-mute); pointer-events:none; }
  .searchwrap input {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 12px 9px 31px;
  }
  .searchwrap input::placeholder { color: var(--fg-mute); }
  select.ctl {
    font-family: inherit; font-size: 13px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 8px; max-width: 45vw;
  }
  .chiprow { display:flex; gap: 6px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    display:flex; align-items:center; gap:5px; flex-shrink: 0;
    font-family: inherit; font-size: 12.5px; color: var(--fg-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  /* el chip mide 30px de alto: se ve bien pero se falla mucho con el dedo.
     El pseudoelemento amplía la zona sensible sin cambiar el aspecto. */
  .chip { position: relative; }
  .chip::after { content:""; position:absolute; inset:-7px -2px; border-radius:999px; }
  .chip:hover { background: var(--surface-2); }
  .chip.on { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .chip .ct { font-size: 10.5px; opacity: .65; font-variant-numeric: tabular-nums; }
  /* separa visualmente tipo / década / etiquetas / género en la fila de chips:
     sin esto, cuantas más décadas y etiquetas tengas, más parece una sola
     lista indiferenciada en vez de varios filtros distintos */
  .chipdiv { width: 1px; align-self: stretch; background: var(--line-firm); flex-shrink: 0; margin: 2px 3px; }

  /* ---------- content ---------- */
  .content { padding: 16px 0 110px; }
  .resultline { font-size: 11.5px; color: var(--fg-mute); font-family: ui-monospace, monospace; margin-bottom: 11px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .linkbtn { background:none; border:none; font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--amber); cursor:pointer; padding:0; text-decoration: underline; text-underline-offset: 2px; }
  /* "Seleccionar todo" y "Quitar filtros" del resultline: antes texto subrayado
     suelto, ahora una píldora — más fácil de ver y de acertar con el dedo. */
  .pillbtn {
    position: relative; display:inline-flex; align-items:center; gap: 4px;
    font-family: inherit; font-size: 11px; font-weight: 650; white-space: nowrap;
    color: var(--fg-soft); background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 10px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .pillbtn::after { content:""; position:absolute; inset:-6px; }
  .pillbtn:hover { background: var(--surface-2); }
  .pillbtn.accent { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); background: var(--amber-soft); }

  .group + .group { margin-top: 22px; }
  .ghead {
    display:flex; align-items:baseline; gap: 9px; margin: 0 0 10px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--fg-soft); font-family: ui-monospace, monospace;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
    position: sticky; top: calc(158px + env(safe-area-inset-top)); z-index: 10;
    background: var(--bg);
  }
  .ghead .gcount { font-size: 10.5px; color: var(--fg-mute); font-weight: 500; }

  /* --gcols lo pone el ajuste "Tamaño de carátula": más columnas = carátulas
     más pequeñas y más cosas por pantalla. Sin ajuste, se comporta como antes. */
  .grid { display:grid; grid-template-columns: repeat(var(--gcols, 2), 1fr); gap: 13px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(calc(var(--gcols, 2) + 1), 1fr); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(calc(var(--gcols, 2) + 2), 1fr); } }

  /* La portada es el objeto, no hay caja que la envuelva: el título y el
     artista van sueltos sobre el fondo y los datos bajan a chips. Así la
     rejilla se lee como una estantería de discos y no como un formulario. */
  .gcard {
    background: none; border: none; border-radius: 0; box-shadow: none;
    overflow: visible; cursor: pointer; position: relative;
    transition: transform .12s;
    /* Sin caja, la tarjeta dejó de recortar su contenido y el texto sin partir
       ensanchaba su columna: las dos de la rejilla salían de distinto ancho.
       Esto le devuelve permiso a encogerse hasta lo que le toca. */
    min-width: 0;
  }
  .gcard:active { transform: scale(0.975); }
  @media (hover: hover) { .gcard:hover .art { box-shadow: var(--shadow-md); } }
  .gcard.sel .art { outline: 2.5px solid var(--amber); outline-offset: 2px; }
  .gcard .art {
    position: relative; aspect-ratio: 1; background: var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm);
    transition: box-shadow .15s, outline-color .15s;
  }
  .gcard .art img { width:100%; height:100%; object-fit: cover; display:block; transition: opacity .2s, filter .2s; }
  .gcard.done .art img { opacity: .5; filter: saturate(.55); }
  .gcard .art .ph { font-size: 30px; opacity: .3; }
  .gcard .gbody { padding: 9px 1px 2px; }
  .gcard .gt { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gcard .ga { font-size: 13.5px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top: 1px; }
  /* Los colaboradores, medio tono por debajo del artista principal. Con opacidad
     en vez de un color fijo, para que siga funcionando en todas las paletas. */
  .ga .feat, .la .feat { opacity: .58; }
  .gcard .gmeta { display:flex; flex-wrap:wrap; align-items:center; gap: 5px; margin-top: 8px; min-height: 15px; }
  /* Los datos sueltos (año, tipo) en chips bajo el título: se leen de un vistazo
     sin competir con el nombre, y es lo que hace que la rejilla respire. */
  .gchip {
    display:inline-flex; align-items:center; gap: 4px; white-space: nowrap;
    font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 8.5px;
    border-radius: 7px; background: var(--amber-soft); color: var(--amber);
  }

  .statusdot {
    position:absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; cursor: pointer; z-index: 2;
    font-size: 12px; font-weight: 800; line-height: 1;
    background: rgba(20,16,13,0.55); border: 1.5px solid rgba(255,255,255,0.75); color: #fff;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: transform .12s;
  }
  .statusdot:active { transform: scale(0.88); }
  .statusdot.on { background: var(--jade); border-color: var(--jade); }
  /* el círculo se ve de 24px pero se toca en 44px */
  .statusdot::after { content:''; position:absolute; inset:-10px; border-radius: 50%; }
  /* El tipo se movió a un chip debajo del título: encima de la portada tapaba
     parte del arte y repetía algo que ya se ve mejor en la línea de datos. */
  .stars { font-size: 12px; color: var(--amber); letter-spacing: -0.5px; }
  .tagpip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .pin { font-size: 11px; flex-shrink: 0; line-height: 1; }

  /* list view */
  .list { display:flex; flex-direction: column; gap: 7px; }
  .lrow {
    display:flex; flex-wrap: wrap; align-items:center; gap: 11px; cursor: pointer; position: relative;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 12px 10px 10px; overflow: hidden;
    transition: background .13s, border-color .15s;
    /* deja que el navegador siga gestionando el scroll vertical nativo y le
       cede a JS solo el eje horizontal — sin esto, un listener "passive"
       (necesario para no trabar el scroll) no puede frenar el scroll nativo
       mientras deslizas, y el gesto se siente atascado o directamente falla */
    touch-action: pan-y;
  }
  .lrow::before { content:''; position:absolute; left:0; top:0; bottom:0; width: 3px; background: var(--amber); }
  .lrow.done::before { background: var(--jade); }
  .lrow:hover { background: var(--surface-2); }
  .lrow.sel { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
  .lrow .lart { width: 58px; height: 58px; border-radius: 8px; flex-shrink:0; overflow:hidden; background: var(--surface-2); display:flex; align-items:center; justify-content:center; margin-left: 4px; }
  .lrow .lart img { width:100%; height:100%; object-fit:cover; }
  .lrow.done .lart img { opacity:.5; filter: saturate(.55); }
  .lrow .linfo { flex: 1; min-width: 0; }
  .lrow .lt { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .la { font-size: 14px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top: 1px; }
  /* Los chips van en su propio renglón, separados por una línea fina: es lo
     que deja respirar la fila cuando el título ya ocupa lo suyo. */
  .lrow .lchips { flex-basis: 100%; display:flex; flex-wrap:wrap; gap: 5px; padding-top: 9px; margin-top: 1px; border-top: 1px solid var(--line); }
  .lrow .lmeta { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .lrow .lyear { font-size: 11px; color: var(--fg-mute); font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .lcheck {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink:0; cursor:pointer; position: relative;
    display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 800;
    background: transparent; border: 1.5px solid var(--line-firm); color: transparent;
  }
  .lcheck::after { content:''; position:absolute; inset:-9px; border-radius: 50%; }
  .lcheck.on { background: var(--jade); border-color: var(--jade); color: #fff; }

  /* ---------- empty ---------- */
  .empty { text-align:center; padding: 64px 22px; }
  .empty .ico { font-size: 34px; opacity: .4; margin-bottom: 14px; }
  .empty h2 { font-size: 16.5px; margin: 0 0 6px; font-weight: 650; }
  .empty p { font-size: 13.5px; color: var(--fg-mute); margin: 0 auto; max-width: 34ch; line-height: 1.5; }
  .empty .acts { display:flex; gap: 9px; justify-content:center; margin-top: 18px; flex-wrap: wrap; }

  /* ---------- buttons ---------- */
  .btn {
    font-family: inherit; font-size: 14px; font-weight: 550; text-align:center; text-decoration:none;
    padding: 11px 16px; border-radius: 12px; cursor:pointer; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); display:inline-flex; align-items:center; justify-content:center; gap: 7px;
    transition: transform .1s, background .15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--amber); color: var(--on-amber); border-color: transparent; font-weight: 650; }
  .btn.jade { background: var(--jade); color: #fff; border-color: transparent; font-weight: 650; }
  .btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 45%, transparent); background: transparent; }
  .btn.vermas { display: block; width: 100%; margin: 18px 0 4px; padding: 14px; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btnrow { display:flex; gap: 9px; margin-top: 12px; }

  /* ---------- FAB ---------- */
  /* Índice A-Z lateral, como el de Contactos del iPhone: con miles de
     elementos, scrollear hasta la M es inviable. Solo aparece cuando el
     orden es alfabético (por título o por artista), que es cuando saltar a
     una letra significa algo. */
  .azrail {
    position: fixed; right: 2px; top: 50%; transform: translateY(-50%); z-index: 30;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 6px 3px; border-radius: 999px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); box-shadow: var(--shadow-sm);
    max-height: 74vh; overflow: hidden;
  }
  .azrail button {
    font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700;
    line-height: 1; padding: 2px 4px; min-width: 16px;
    background: none; border: none; color: var(--fg-mute); cursor: pointer;
  }
  .azrail button:active { color: var(--amber); transform: scale(1.5); }
  /* Ocupa espacio de sobra en el iPhone (pantalla estrecha, ya hay barra
     inferior); se queda en iPad/desktop, donde sí cabe y ayuda. */
  @media (max-width: 480px) { .azrail { display: none; } }

  /* Modo presentación: esconde todo lo que es "manejar la app" y deja solo
     las carátulas, para enseñar la colección en una pantalla grande. */
  body.presentacion .topbar, body.presentacion .state-strip, body.presentacion .chiprow,
  body.presentacion .resultline, body.presentacion .fab, body.presentacion .azrail,
  body.presentacion .vermas { display: none !important; }
  body.presentacion .content { padding-top: 8px; }
  body.presentacion .gcard .gbody { padding: 6px 8px 8px; }
  #salirPresent { display: none; }
  body.presentacion #salirPresent {
    display: flex; position: fixed; top: 10px; right: 10px; z-index: 60;
    align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); color: var(--fg);
    font-size: 16px; box-shadow: var(--shadow-md);
  }

  .fab {
    position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom) + var(--kb, 0px)); z-index: 35;
    height: 54px; padding: 0 20px; border-radius: 27px; border:none; cursor:pointer;
    background: var(--amber); color: var(--on-amber);
    font-family: inherit; font-size: 15px; font-weight: 650;
    display:flex; align-items:center; gap: 8px;
    box-shadow: 0 6px 20px color-mix(in srgb, var(--amber) 45%, transparent);
    transition: transform .12s;
  }
  .fab:active { transform: scale(0.94); }

  /* ---------- selection action bar ---------- */
  .selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); box-shadow: var(--shadow-lg);
    display:flex; align-items:center; gap: 8px;
    /* con 5 botones (contador + escuchado + etiquetar + archivar + eliminar +
       cancelar) puede no caber entero en un iPhone pequeño: mejor que se
       deslice a que se aplaste o se salga de la pantalla */
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .selbar::-webkit-scrollbar { display: none; }
  .selbar .cnt { font-size: 13px; font-weight: 650; margin-right: auto; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .selbar .btn { padding: 9px 13px; font-size: 13px; flex-shrink: 0; white-space: nowrap; }

  /* ---------- sheets / modals ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(10,7,5,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: fade .18s var(--ease-out);
  }
  /* Antes cerrar era instantáneo (innerHTML = ''): la ficha, ajustes, buscar,
     TODO desaparecía de golpe en cada cierre de toda la app. Que algo
     aparezca con una entrada cuidada y se esfume de golpe se nota — rompe la
     sensación de que la interfaz responde a lo que haces. Con .closing (ver
     closeModal) ahora también sale con su propia transición, un poco más
     rápida que la entrada porque cerrar debe sentirse inmediato. */
  .overlay.closing { animation: fadeOut .15s var(--ease-out) forwards; pointer-events: none; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
  @keyframes rise { from { transform: translateY(18px); opacity: .6 } to { transform: none; opacity: 1 } }
  @keyframes fall { from { transform: none; opacity: 1 } to { transform: translateY(14px); opacity: 0 } }
  @media (min-width: 640px) { .overlay { align-items:center; } }
  .sheet {
    background: var(--bg); width: 100%; max-width: 540px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* min() con --kb: si el teclado está tapando parte de la pantalla, el hueco
       útil se reduce para que el contenido de abajo (el último botón, sobre
       todo) quede siempre por encima del teclado y no oculto detrás. */
    max-height: min(90vh, calc(100vh - var(--kb, 0px) - 12px));
    border-radius: 22px 22px 0 0; padding: 18px 18px calc(26px + env(safe-area-inset-bottom) + var(--kb, 0px));
    border: 1px solid var(--line); border-bottom: none;
    animation: rise .2s var(--ease-out);
  }
  .sheet.closing { animation: fall .15s var(--ease-out) forwards; }
  /* El salto entre bloques de la ficha se anima desde aquí: scrollTo() con
     behavior:'smooth' lo ignoran los navegadores con el scroll suave apagado
     y el salto se quedaba sin hacer; moviendo scrollTop siempre ocurre, y
     esto le pone la animación cuando se puede. */
  .sheet { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { .sheet { scroll-behavior: auto; } }
  @media (min-width: 640px) { .sheet { border-radius: 20px; max-height: min(86vh, calc(100vh - var(--kb, 0px) - 12px)); border-bottom: 1px solid var(--line); } }
  .sheethead { display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-bottom: 14px; }
  .sheethead h2 { font-size: 17px; margin:0; font-weight: 680; }
  .lede { font-size: 13px; color: var(--fg-mute); margin: 0 0 13px; line-height: 1.5; }
  .lede a { color: var(--amber); }
  .flabel { font-size: 15px; font-weight: 600; color: var(--fg-mute); margin: 22px 0 8px; }
  .flabel:first-child { margin-top: 0; }

  .field {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px;
  }
  textarea.field { min-height: 76px; resize: vertical; line-height: 1.5; }
  textarea.field.tall { min-height: 150px; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .field.mono { font-family: ui-monospace, monospace; font-size: 12.5px; }

  .segrow { display:flex; gap: 6px; margin-bottom: 13px; }
  .seg {
    flex: 1; font-family: inherit; font-size: 13px; color: var(--fg-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; cursor:pointer;
    transition: background .15s, color .15s;
  }
  .seg.on { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }

  /* search results */
  .rrow { display:flex; gap: 11px; align-items:center; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .rrow:last-child { border-bottom: none; }
  .rrow .rart { width: 48px; height: 48px; border-radius: 8px; background: var(--surface-2); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size: 17px; }
  .rrow .rart img { width:100%; height:100%; object-fit:cover; }
  .rrow .rinfo { flex:1; min-width:0; }
  .rrow .rt { font-size: 13.5px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .ra { font-size: 12px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .addbtn {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink:0; cursor:pointer;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--fg);
    font-size: 17px; font-weight: 500; display:flex; align-items:center; justify-content:center;
    transition: transform .1s;
  }
  .addbtn:active { transform: scale(0.9); }
  .addbtn.done { background: var(--jade); color: #fff; border-color: transparent; }

  /* ---- selección múltiple en resultados de búsqueda ---- */
  .restools { display:flex; gap:14px; align-items:center; padding: 2px 2px 12px; font-size: 13px; }
  .restools button { color: var(--accent, var(--jade)); font-weight: 600; }
  .restools .n { color: var(--fg-mute); font-weight: 400; margin-left: 2px; }
  .rrow.selectable { cursor: pointer; }
  .rrow.selectable:active { background: var(--surface-2); }
  .rchk {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink:0;
    border: 1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size: 14px; color: transparent; position: relative;
  }
  .rchk::after { content:""; position:absolute; inset:-10px; }  /* zona táctil real de 46px */
  .rchk.on { background: var(--jade); border-color: transparent; color: #fff; }
  .rchk.saved { border-style: dashed; opacity: .55; }
  .skel { height: 66px; border-radius: 10px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sweep 1.2s infinite; margin-bottom: 7px; }
  @keyframes sweep { from { background-position: 200% 0 } to { background-position: -200% 0 } }

  /* detail */
  /* La portada, grande y centrada, manda en la ficha: es de lo que va la
     pantalla. Debajo el título y el artista, y solo después los datos. */
  .dart { width: min(64%, 236px); aspect-ratio: 1; margin: 2px auto 16px; border-radius: 14px; overflow:hidden; background: var(--surface-2); box-shadow: 0 14px 34px rgba(26,20,14,0.22); display:flex; align-items:center; justify-content:center; font-size: 44px; }
  .dart img { width:100%; height:100%; object-fit:cover; }
  .dwrap { display: block; text-align: center; }
  .dtitle { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.18; margin: 0 0 4px; text-wrap: balance; }
  .dartist { font-size: 17px; color: var(--fg-mute); margin: 0; }
  .artistlink { cursor:pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 2px; transition: text-decoration-color .15s; }
  .artistlink:hover, .artistlink:active { text-decoration-color: currentColor; }
  .dfacts { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top: 12px; }
  .fact { font-size: 12px; font-weight: 600; color: var(--fg-mute); background: var(--surface-2); border: none; border-radius: 7px; padding: 4.5px 9px; }
  .fact.accent { color: var(--amber); background: var(--amber-soft); }

  /* Pestañas de la ficha: no esconden nada, saltan a cada bloque de la
     pantalla — que es larga y así no hay que buscarlos con el dedo. */
  .dtabs {
    display:flex; gap: 2px; max-width: 300px; margin: 18px auto 22px;
    background: var(--surface-2); border-radius: 999px; padding: 3px;
  }
  .dtabs button {
    flex: 1; display:flex; align-items:center; justify-content:center;
    border: none; background: none; border-radius: 999px; padding: 8px 0;
    color: var(--fg-mute); cursor: pointer;
    transition: background .2s var(--ease-out), color .2s, box-shadow .2s;
  }
  .dtabs button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
  .dtabs svg { width: 19px; height: 19px; display:block; }
  /* gap 0 a propósito: el espaciado lo da el padding, que además crea la zona táctil de 44px */
  .starpick { display:flex; gap: 0; margin-left: -6px; }
  .starpick button { background:none; border:none; font-size: 27px; line-height: 1; cursor:pointer; color: var(--line-firm); padding: 9px 6px; transition: transform .1s, color .12s; }
  .starpick button.on { color: var(--amber); }
  .starpick button:active { transform: scale(1.2); }
  .tagpick { display:flex; flex-wrap:wrap; gap: 6px; }
  .tagsel {
    display:flex; align-items:center; gap:6px; font-size: 12.5px; padding: 6px 12px;
    border-radius: 999px; cursor:pointer; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg-soft); transition: opacity .15s, border-color .15s;
  }
  .tagsel.off { opacity: .42; }
  .tagsel .dot { width: 9px; height: 9px; border-radius: 50%; }
  .simgrid { display:flex; flex-wrap:wrap; gap: 6px; }
  .simchip {
    display:flex; align-items:center; gap:6px; font-size: 12.5px; padding: 6px 12px;
    border-radius: 999px; cursor:pointer; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg-soft); transition: background .15s, color .15s, border-color .15s;
  }
  .simchip:active { transform: scale(0.96); }
  .simchip.done { background: var(--jade-soft); color: var(--jade); border-color: transparent; }
  .tracklist { display:flex; flex-direction:column; }
  .trow {
    display:flex; flex-direction:column; gap: 2px; padding: 7px 4px;
    border-bottom: 1px solid var(--line);
  }
  .trow:last-child { border-bottom: none; }
  .trow:hover { background: var(--surface-2); }
  .trow.done { opacity: .6; }
  .trmain { display:flex; align-items:center; gap: 8px; }
  .trstars { display:flex; gap: 0; padding-left: 30px; }
  .trstars button { background:none; border:none; font-size: 13px; line-height: 1; cursor:pointer; color: var(--line-firm); padding: 3px 2px; transition: transform .1s, color .12s; }
  .trstars button.on { color: var(--amber); }
  .trstars button:active { transform: scale(1.2); }
  .trcheck {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink:0; cursor:pointer;
    border: 1px solid var(--line); background: var(--surface); color: transparent;
    font-size: 12px; display:flex; align-items:center; justify-content:center; transition: transform .1s;
  }
  .trcheck:active { transform: scale(0.88); }
  .trcheck.on { background: var(--jade); border-color: transparent; color: #fff; }
  .trlink { flex:1; min-width:0; display:flex; align-items:center; gap:10px; color: inherit; text-decoration: none; }
  .trlink:hover { text-decoration: underline; }
  .trow .trn { width: 20px; flex-shrink:0; font-size: 12px; color: var(--fg-mute); text-align:right; font-variant-numeric: tabular-nums; }
  .trow .trt { flex:1; min-width:0; font-size: 13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trow .trd { font-size: 12px; color: var(--fg-mute); flex-shrink:0; font-variant-numeric: tabular-nums; }
  .trow .trplays { font-size: 10.5px; color: var(--jade); background: var(--jade-soft); border-radius: 999px; padding: 1px 6px; flex-shrink:0; font-variant-numeric: tabular-nums; }
  .trtwrap { display:flex; flex-direction:column; min-width:0; gap: 1px; }
  .trtwrap .tra { font-size: 11px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .histgrid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .histcell { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; text-align:center; }
  .histnum { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--amber); line-height:1.15; }
  .histlbl { font-size: 11px; color: var(--fg-mute); margin-top: 3px; }
  .tlprogress { display:flex; align-items:center; gap: 9px; margin-bottom: 10px; }
  .tlprogress-bar { flex:1; height: 5px; border-radius: 3px; background: var(--surface-2); overflow:hidden; }
  .tlprogress-fill { height:100%; background: var(--jade); border-radius: 3px; transition: width .2s; }
  .tlprogress-txt { font-size: 11px; color: var(--fg-mute); flex-shrink:0; font-variant-numeric: tabular-nums; white-space:nowrap; }

  .relrow { display:flex; align-items:center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor:pointer; }
  .relrow:last-child { border-bottom: none; }
  .relrow:hover { background: var(--surface-2); }
  .relrow .relart { width: 34px; height: 34px; border-radius: 6px; overflow:hidden; background: var(--surface-2); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .relrow .relart img { width:100%; height:100%; object-fit:cover; }
  .relrow .relt { flex:1; min-width:0; font-size: 13.5px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .relrow .reltag { font-size: 11px; color: var(--fg-mute); font-weight: 400; }
  .relrow .rely { font-size: 11.5px; color: var(--fg-mute); flex-shrink:0; font-variant-numeric: tabular-nums; }

  .tlchrono { display:flex; flex-direction:column; }
  .chronorow { display:flex; align-items:center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor:pointer; }
  .chronorow:last-child { border-bottom: none; }
  .chronorow:hover { background: var(--surface-2); }
  .chronorow .chronoy { width: 38px; flex-shrink:0; font-size: 12px; color: var(--fg-mute); font-variant-numeric: tabular-nums; }
  .chronorow .chronot { flex:1; min-width:0; font-size: 13.5px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .lightbox { position:fixed; inset:0; z-index: 90; background: rgba(10,7,5,0.9); display:flex; align-items:center; justify-content:center; padding: 24px; animation: fade .15s ease; }
  .lightbox img { max-width:100%; max-height:100%; border-radius: 12px; box-shadow: var(--shadow-lg); }

  /* settings */
  .statusline { display:inline-flex; align-items:center; gap: 7px; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; margin-bottom: 12px; font-weight: 550; }
  .statusline.ok { background: var(--jade-soft); color: var(--jade); }
  .statusline.no { background: color-mix(in srgb, var(--rust) 15%, transparent); color: var(--rust); }
  .swatches { display:flex; gap: 8px; flex-wrap:wrap; margin: 9px 0 4px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; cursor:pointer; border: 2.5px solid transparent; transition: transform .1s; }
  .sw.on { border-color: var(--fg); transform: scale(1.1); }
  .tagline { display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .tagline .lf { display:flex; align-items:center; gap: 9px; font-size: 13.5px; min-width:0; }
  .tagline .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink:0; }
  .tagline .ct { font-size: 11px; color: var(--fg-mute); font-family: ui-monospace, monospace; }
  .xbtn { background:none; border:none; color: var(--fg-mute); font-size: 16px; cursor:pointer; padding: 4px 6px; line-height:1; }
  .xbtn:hover { color: var(--rust); }

  /* metadatos */
  /* Ficha técnica como bloque agrupado: etiqueta a la izquierda, valor a la
     derecha en gris, y una línea finísima entre filas. */
  .metalist { margin: 0; display:flex; flex-direction:column; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
  .metarow { display:flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items:baseline; }
  .metarow:last-child { border-bottom: none; }
  .metarow dt { flex: 0 0 42%; font-size: 14px; color: var(--fg); }
  .metarow dd { margin: 0; flex: 1; font-size: 14px; color: var(--fg-mute); text-align: right; overflow-wrap: anywhere; }
  .metaform { display:flex; flex-direction:column; gap: 10px; }
  .mfield { display:flex; flex-direction:column; gap: 5px; }
  .mfield span { font-size: 11.5px; color: var(--fg-mute); font-family: ui-monospace, monospace; }

  /* estadísticas */
  .bigstat { display:flex; align-items:center; gap: 14px; margin-bottom: 10px; }
  .bignum { font-family: Georgia, serif; font-size: 46px; font-weight: 700; line-height: 1; color: var(--jade); font-variant-numeric: tabular-nums; }
  .bignum .pctsign { font-size: 22px; margin-left: 2px; }
  .progtrack { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progfill { display:block; height: 100%; background: var(--jade); border-radius: 4px; }
  .barlist { display:flex; flex-direction: column; gap: 7px; }
  .barrow { display:flex; align-items:center; gap: 10px; }
  .blabel { font-size: 12.5px; width: 34%; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--fg-soft); }
  .btrack { flex:1; height: 9px; background: var(--surface-2); border-radius: 5px; overflow:hidden; }
  .bfill { display:block; height:100%; border-radius: 5px; }
  .bnum { font-size: 11.5px; color: var(--fg-mute); width: 26px; text-align:right; font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .oldcard {
    display:flex; align-items:center; gap: 11px; width:100%; text-align:left; cursor:pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px; font-family: inherit; color: inherit;
  }
  .oldcard:hover { background: var(--surface-2); }
  .oldart { width: 46px; height: 46px; border-radius: 8px; overflow:hidden; background: var(--surface-2); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .oldart img { width:100%; height:100%; object-fit:cover; }
  .oldinfo { min-width:0; display:flex; flex-direction:column; }
  .oldt { font-size: 13.5px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .olda { font-size: 12px; color: var(--fg-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Todo lo que usa var(--surface) como fondo pide este desenfoque — en
     cualquier paleta normal --glass-blur vale "none" y no pasa nada; solo la
     paleta Cristal lo redefine, y estos mismos elementos se vuelven cristal
     esmerilado de golpe sin tocarlos uno a uno. */
  .iconbtn, .stat, .chip, .lrow, .btn, .seg, .tagsel, .oldcard {
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  }
  /* Safari de iOS a veces no compone el desenfoque dentro de contenedores con
     scroll (como la fila de chips) si el elemento no tiene su propia capa —
     esto lo fuerza. Va solo bajo Cristal para no gastar una capa de GPU
     de más en el resto de paletas, donde no hace ninguna falta. */
  [data-palette="cristal"] .iconbtn, [data-palette="cristal"] .stat, [data-palette="cristal"] .chip,
  [data-palette="cristal"] .lrow, [data-palette="cristal"] .btn,
  [data-palette="cristal"] .seg, [data-palette="cristal"] .tagsel, [data-palette="cristal"] .oldcard {
    -webkit-transform: translateZ(0); will-change: backdrop-filter;
  }

  /* El despliegue entra en vez de aparecer de golpe: como la lista se repinta
     entera, sin esto el bloque nuevo da un salto seco bajo el dedo. */
  @keyframes desplegar { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
  .aexp { animation: desplegar .17s var(--ease-out); }
  @media (prefers-reduced-motion: reduce) { .aexp { animation: none; } }
  /* Un botón que se hunde al tocarlo confirma el toque antes de que dé tiempo
     a que la pantalla cambie — que es la mitad de la sensación de que va fino. */
  .btn:active, .iconbtn:active, .chip:active, .tagsel:active, .stat:active { transform: scale(0.955); }
  .btn, .iconbtn, .chip, .tagsel, .stat { transition: transform .13s var(--ease-out), background .15s, border-color .15s, color .15s; }
  .crow { transition: background .14s var(--ease-out); }
  .irow { transition: background .14s var(--ease-out); }
  .tagsel { display:inline-flex; align-items:center; gap: 7px; }

  /* ---- etiquetas con icono ---- */
  .tgico { display:block; flex-shrink:0; }
  /* El icono sobre su color al 15%: se distingue de un vistazo sin gritar */
  .tgbadge { display:flex; align-items:center; justify-content:center; border-radius: 9px; flex-shrink:0; }

  .icogrid { display:grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .icogrid button {
    display:flex; align-items:center; justify-content:center; aspect-ratio: 1;
    border: none; border-radius: 11px; background: var(--surface-2); cursor:pointer;
    transition: transform .12s var(--ease-out), background .15s;
  }
  .icogrid button:active { transform: scale(.9); }
  .icogrid button.on { background: color-mix(in srgb, currentColor 18%, transparent); box-shadow: inset 0 0 0 2px currentColor; }

  .tagline { display:flex; align-items:center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .tagline:last-child { border-bottom: none; }
  .tagline .lf { display:flex; align-items:center; gap: 9px; flex: 1; min-width: 0; font-size: 15px; }
  .tagline .lf .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tagline.dentro { padding-left: 22px; }
  .tagcab { display:flex; align-items:center; gap: 9px; margin: 14px 0 2px; font-size: 13px; font-weight: 700; color: var(--fg-soft); }
  .tagcab:first-child { margin-top: 0; }

  /* ---- pantalla de inicio ---- */
  /* Solo se pinta una de las dos: en Inicio sobran la tira de estado, la barra
     de herramientas y la lista, y esconderlas evita además que se repinten. */
  .inicio { display: none; padding: 2px 0 100px; }
  body.en-inicio .inicio { display: block; }
  body.en-inicio .state-strip, body.en-inicio .toolbar, body.en-inicio .content,
  body.en-inicio .azrail, body.en-inicio .fab { display: none !important; }

  .inicio h1 { font-size: 33px; font-weight: 800; letter-spacing: -0.03em; margin: 8px 0 15px; }
  .inicio h2 { font-size: 21px; font-weight: 750; letter-spacing: -0.02em; margin: 28px 0 10px; }

  .tiles { display:grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .tile {
    border: none; border-radius: 19px; padding: 14px 15px 13px; cursor: pointer;
    color: #fff; text-align: left; font-family: inherit;
    display:flex; flex-direction: column; gap: 24px;
    box-shadow: var(--shadow-sm); transition: transform .12s;
  }
  .tile:active { transform: scale(0.97); }
  .tile .top { display:flex; align-items:center; justify-content:space-between; gap: 8px; }
  .tile .ico { font-size: 18px; line-height: 1; }
  .tile .n { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .tile .l { font-size: 15px; font-weight: 650; }
  /* Los cuatro tonos salen de tus propios acentos, no de una paleta nueva:
     así los mosaicos cambian con el tema como todo lo demás. */
  .tile.t1 { background: linear-gradient(155deg, color-mix(in srgb, var(--amber) 72%, #fff), var(--amber)); }
  .tile.t2 { background: linear-gradient(155deg, color-mix(in srgb, var(--jade) 72%, #fff), var(--jade)); }
  .tile.t3 { background: linear-gradient(155deg, var(--fg-soft), var(--fg)); }
  .tile.t4 { background: linear-gradient(155deg, color-mix(in srgb, var(--rust) 72%, #fff), var(--rust)); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .crow {
    position: relative; display:flex; align-items:center; gap: 12px; width: 100%;
    padding: 13px 15px; background:none; border:none; cursor:pointer;
    font-family: inherit; font-size: 15.5px; color: var(--fg); text-align:left;
  }
  /* La línea arranca después del icono, no de punta a punta */
  .crow + .crow::before, .aexp + .crow::before { content:''; position:absolute; left: 49px; right: 0; top: 0; height: 1px; background: var(--line); }
  .crow:active { background: var(--surface-2); }
  .crow .ci { font-size: 16px; width: 22px; text-align:center; flex-shrink:0; }
  .crow .ct { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .cn { margin-left:auto; color: var(--fg-mute); font-size: 14.5px; flex-shrink:0; }
  .crow.abierta { background: var(--surface-2); }

  /* Los discos y canciones de un artista, colgando de su fila */
  .aexp { background: var(--surface-2); }
  .irow { display:flex; align-items:center; gap: 11px; padding: 8px 15px 8px 49px; cursor:pointer; }
  .irow:active { background: var(--line); }
  .irow .ip { width: 44px; height: 44px; border-radius: 7px; flex-shrink:0; overflow:hidden; background: var(--surface); display:flex; align-items:center; justify-content:center; font-size: 18px; }
  .irow .ip img { width:100%; height:100%; object-fit:cover; }
  .irow .ii { min-width: 0; }
  .irow .it { font-size: 14.5px; font-weight: 650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .irow .ig { display:flex; gap: 5px; margin-top: 4px; }

<script>
'use strict';

/* ============ storage ============ */
const K_ITEMS = 'musicvault_items_v1';
const K_TAGS  = 'musicvault_tags_v1';
const K_CREDS = 'musicvault_spotify_creds_v1';
const K_PREFS = 'musicvault_prefs_v1';
const K_THEME = 'musicvaultTheme';
const K_GH    = 'musicvault_github_v1';   // token + repo de sincronización
const K_TOMB  = 'musicvault_tomb_v1';     // borrados pendientes de propagar
const K_META  = 'musicvault_meta_v1';     // marca de tiempo del vault local
const K_LASTFM = 'musicvault_lastfm_v1';  // clave de API de Last.fm, para géneros
const K_TAG_TOMB = 'musicvault_tagtomb_v1';   // etiquetas borradas pendientes de propagar
const K_PALETTE = 'musicvaultPalette';
const K_TRASH = 'musicvault_trash_v1';    // papelera — solo local, ver comentario junto a TRASH

const read = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch { return fb; } };
const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* El vault vive en IndexedDB: localStorage se queda en ~5 MB (y cuenta UTF-16),
   que con miles de álbumes se agota enseguida. Ajustes/tema/credenciales siguen
   en localStorage porque son cuatro claves y conviene leerlas de forma síncrona. */
const DB_NAME = 'musicvault', DB_STORE = 'kv';
let _db = null, _sinIDB = false;

function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    if (!self.indexedDB) return rej(new Error('sin indexedDB'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE);
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
const idbGet = k => idb().then(db => new Promise((res, rej) => {
  const q = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
}));
const idbSet = (k, v) => idb().then(db => new Promise((res, rej) => {
  const t = db.transaction(DB_STORE, 'readwrite');
  t.objectStore(DB_STORE).put(v, k);
  t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
}));

let ITEMS = [];
let TAGS  = [];
// dondequiera que se listen etiquetas se piden así, en vez de tocar el orden
// real de TAGS — así no se altera nada de la lógica de fusión/dedup por id.
// las fijadas primero (entre ellas, alfabético), luego el resto, también alfabético
/* Las carpetas viven en el MISMO array que las etiquetas, marcadas con
   esCarpeta. Así heredan gratis la sincronización y las tumbas que ya existían
   para etiquetas, sin tocar el formato del fichero que se sube a GitHub — que
   es la parte donde un fallo cuesta datos de verdad. Todo lo que pinta
   etiquetas pasa por aquí, así que filtrarlas en este sitio las deja fuera de
   los chips, del selector de la ficha y de los filtros de una sola vez. */
const esCarpeta = t => !!(t && t.esCarpeta);
const tagsOrdenados = () => TAGS.filter(t => !esCarpeta(t)).sort((a, b) => (b.favorito ? 1 : 0) - (a.favorito ? 1 : 0) || a.name.localeCompare(b.name, 'es'));
const carpetasOrdenadas = () => TAGS.filter(esCarpeta).sort((a, b) => a.name.localeCompare(b.name, 'es'));
/* Etiquetas de una carpeta; sin argumento, las que no están en ninguna. */
const tagsDeCarpeta = id => tagsOrdenados().filter(t => (t.carpetaId || null) === (id || null));
let PREFS = Object.assign({ sort: 'added_desc', view: 'grid', type: 'all', status: 'all', tag: 'all', genre: 'all', decade: 'all', covers: false, confirmarBorrado: false, tanda: 120, autoAddEscuchas: false, dur: 'all', vistas: [], gcardSize: 0, pantalla: 'inicio' }, read(K_PREFS, {}));

/* Al borrar algo hay que dejar constancia: si no, el otro dispositivo lo
   vuelve a subir en la siguiente sincronización y el borrado "revive". */
let TOMB = read(K_TOMB, []);
let META = Object.assign({ updatedAt: 0 }, read(K_META, {}));
/* Un borrado masivo genera decenas de miles de tumbas. Si se recortan demasiado
   pronto, el otro dispositivo no se entera de esos borrados y los resucita en la
   siguiente sincronización. Se deduplica por id (vale la más reciente) y el tope
   se deja alto: 30.000 tumbas ocupan ~1,5 MB, que GitHub asume sin problema. */
const TOPE_TUMBAS = 30000;
function podarTumbas() {
  const ultima = new Map();
  for (const t of TOMB) {
    if (!t || !t.sid) continue;
    const prev = ultima.get(t.sid);
    if (prev === undefined || t.at > prev) ultima.set(t.sid, t.at);
  }
  TOMB = [...ultima].map(([sid, at]) => ({ sid, at }))
                    .sort((a, b) => a.at - b.at)
                    .slice(-TOPE_TUMBAS);
  return TOMB;
}
const saveTomb = () => write(K_TOMB, podarTumbas());
const saveMeta = () => write(K_META, META);

/* Papelera: guarda el elemento COMPLETO (no solo su tumba) durante 7 días
   tras borrarlo, para poder recuperarlo desde Ajustes aunque hayan pasado
   horas o días — el aviso de "Deshacer" de 9 segundos sigue existiendo aparte
   para el despiste inmediato. Deliberadamente NO se sincroniza entre
   dispositivos: añadirla al JSON que viaja a GitHub tocaría fundir(), que ya
   es delicada de por sí (todo-o-nada por dispositivo, no por campo) — el
   riesgo de estropear la fusión real no compensaba una papelera compartida. */
let TRASH = read(K_TRASH, []);
const saveTrash = () => write(K_TRASH, TRASH);
function purgarPapelera() {
  const limite = Date.now() - 7 * 86400000;
  const antes = TRASH.length;
  TRASH = TRASH.filter(t => t.deletedAt > limite);
  if (TRASH.length !== antes) saveTrash();
}
function tombstone(items) {
  const at = Date.now();
  items.forEach(it => { if (it && it.spotifyId) TOMB.push({ sid: it.spotifyId, at }); });
  saveTomb();
}
function untombstone(items) {   // al deshacer un borrado
  const sids = new Set(items.map(i => i && i.spotifyId).filter(Boolean));
  TOMB = TOMB.filter(t => !sids.has(t.sid));
  saveTomb();
}

/* Las etiquetas se fusionaban solo por unión (se añade lo que falte, nunca se
   quita): si borrabas una en el PC pero el iPhone no se había enterado, al
   sincronizar el iPhone la volvía a subir sin querer y "revivía" en el PC en
   la siguiente vuelta — el mismo problema que tenían los elementos borrados
   antes de que existieran las tumbas de arriba. Mismo remedio, para etiquetas. */
let TAG_TOMB = read(K_TAG_TOMB, []);
const saveTagTomb = () => write(K_TAG_TOMB, TAG_TOMB = [...new Set(TAG_TOMB)].slice(-2000));
function tombstoneTag(id) { TAG_TOMB.push(id); saveTagTomb(); }

/* Escrituras agrupadas: al importar miles de elementos no queremos una
   transacción por cada uno. */
let _pend = null;
function _flush(k, get) {
  if (_sinIDB) { try { write(k, get()); } catch (e) { toast('No cabe en el almacenamiento del navegador'); } return; }
  idbSet(k, get()).catch(() => toast('No se ha podido guardar'));
}
function saveItems() {
  META.updatedAt = Date.now(); saveMeta();
  clearTimeout(_pend);
  _pend = setTimeout(() => _flush(K_ITEMS, () => ITEMS), 120);
  programarSync();
}
const saveTags  = () => _flush(K_TAGS, () => TAGS);
const savePrefs = () => write(K_PREFS, PREFS);
const loadCreds = () => read(K_CREDS, null);

/* Carga inicial + migración desde localStorage la primera vez. */
async function bootStorage() {
  try {
    const [i, t, q] = await Promise.all([idbGet(K_ITEMS), idbGet(K_TAGS), idbGet(K_IMPORT_QUEUE)]);
    if (Array.isArray(i)) ITEMS = i;
    if (Array.isArray(t)) TAGS = t;
    if (Array.isArray(q)) IMPORT_QUEUE = q;
    if (!Array.isArray(i)) {
      const li = read(K_ITEMS, []), lt = read(K_TAGS, []);
      if (li.length || lt.length) {
        ITEMS = li; TAGS = lt;
        await idbSet(K_ITEMS, ITEMS); await idbSet(K_TAGS, TAGS);
      }
    }
  } catch {
    _sinIDB = true;
    ITEMS = read(K_ITEMS, []);
    TAGS  = read(K_TAGS, []);
    IMPORT_QUEUE = [];   // sin IndexedDB no merece la pena meter esto en localStorage: no es vault, se puede perder
  }
}

/* ============ helpers ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const TYPE_LABEL = { album: 'Álbum', track: 'Canción', artist: 'Artista', playlist: 'Playlist' };
const TYPE_PLURAL = { album: 'Álbumes', track: 'Canciones', artist: 'Artistas', playlist: 'Playlists' };
const TYPE_ICON  = { album: '💿', track: '🎵', artist: '🎤', playlist: '📑' };

const ICONOS_ORDEN = Object.keys(ICONOS);

/* Una etiqueta sin icono elegido se pinta con el de etiqueta, y una carpeta
   con el de carpeta: nunca sale un hueco. */
const iconoDe = t => ICONOS[t && t.icon] ? t.icon : (t && t.esCarpeta ? 'carpeta' : 'etiqueta');
const iconoHtml = (t, px) =>
  `<svg class="tgico" viewBox="0 0 24 24" width="${px}" height="${px}" fill="${esc(t && t.colorHex || 'currentColor')}" aria-hidden="true"><path d="${ICONOS[iconoDe(t)]}"/></svg>`;
const artistsOf = it => (it.artists || []).join(', ');
/* Spotify devuelve el artista principal el primero, y la importación desde el
   Excel mantuvo ese orden: artists[0] es de quién es la canción y el resto son
   colaboraciones. Agrupar por el principal junta "50 Cent" con "50 Cent, Olivia"
   en lugar de abrir una cabecera distinta por cada combinación de invitados. */
const principalDe = it => (it.artists || [])[0] || '';
const colaboradoresDe = it => (it.artists || []).slice(1);
/* Con las carátulas desactivadas el vault se lee como una lista, no como una
   pared de discos. Es una preferencia, no un borrado: se vuelve a activar en Ajustes. */
const verPortada = () => PREFS.covers !== false;
const portada = (url, icono, lazy) =>
  (verPortada() && url) ? `<img src="${esc(url)}" ${lazy ? 'loading="lazy" ' : ''}alt="">` : icono;
// Buscar "camaron" tiene que encontrar "Camarón".
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const yearOf = it => (it.releaseDate ? parseInt(String(it.releaseDate).slice(0, 4), 10) : 0) || 0;
// Para ordenar como una discoteca de verdad: "The Beatles" va por la B.
const sortKey = s => String(s || '').toLowerCase().replace(/^(the|los|las|el|la|a|an)\s+/, '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
/* localeCompare construye un comparador nuevo en CADA llamada, y ordenar el
   vault son cientos de miles de llamadas: era segundo y medio de espera por
   render (mucho más en el móvil). Reutilizar un Intl.Collator compara igual
   pero cuesta una fracción. */
const COLLATOR = new Intl.Collator('es', { sensitivity: 'base' });
const cmp = (a, b) => COLLATOR.compare(a, b);
/* Agrupar y ordenar tienen que coincidir o los grupos salen partidos. Va foldeada
   para que "deadmau5" y "Deadmau5" no sean dos cabeceras seguidas. */
/* Ordenar recalculaba sortKey() de título y artistas en cada comparación: para
   17.000 elementos son millones de normalizaciones de texto repetidas. Se
   calculan una vez por elemento y se guardan aquí. El caché se revalida solo
   comparando el título y la referencia del array de artistas, así que editar
   una ficha (o que llegue una versión nueva al sincronizar) lo recalcula sin
   necesidad de acordarse de invalidarlo a mano en cada sitio. */
const _clavesOrden = new WeakMap();
function clavesDe(it) {
  let k = _clavesOrden.get(it);
  if (!k || k.t !== it.title || k.a !== it.artists) {
    const art = sortKey(principalDe(it));
    k = { t: it.title, a: it.artists, art, agr: fold(art), full: sortKey(artistsOf(it)), tit: sortKey(it.title) };
    _clavesOrden.set(it, k);
  }
  return k;
}
const claveArtista = it => clavesDe(it).agr;
const tagById = id => TAGS.find(t => t.id === id);
